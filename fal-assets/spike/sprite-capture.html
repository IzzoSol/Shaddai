<title>Sprite Capture Rig</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;}#stage{width:512px;height:512px;}</style>
<div id="stage"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = null;

  // orthographic left/right/top/bottom are relative to the camera itself,
  // NOT absolute world Y -- so the frustum must be symmetric and the
  // camera's own y must equal the world-space vertical center of the shot.
  // The CPU-side geometry bounding box on these auto-rigged SkinnedMeshes
  // doesn't reliably match where the GPU-skinned mesh actually renders
  // (bind-pose/skin-matrix mismatch from the Meshy auto-rig step), so we
  // can't trust 3D math to frame this precisely. Instead: zoom WAY out to
  // a safe static frame that's guaranteed to contain the whole character
  // no matter where it lands, and let the Node-side pixel analysis
  // (sharp trim, in capture-sprites.mjs) find the real silhouette bounds
  // from the actual rendered pixels and crop/center from that.
  const FRAME_HALF = 3.0;
  const FRAME_CENTER_Y = 1.0;
  const camera = new THREE.OrthographicCamera(-FRAME_HALF, FRAME_HALF, FRAME_HALF, -FRAME_HALF, 0.01, 100);
  camera.position.set(0, FRAME_CENTER_Y, 4);
  camera.lookAt(0, FRAME_CENTER_Y, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(512, 512);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(2, 4, 3);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x5fe0ff, 0.5);
  rim.position.set(-3, 1, -2);
  scene.add(rim);

  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);

  // rig: outer group we translate every frame to re-center the model,
  // since Meshy's baked walk/run root motion drifts the chibi skeleton
  // vertically (retargeting mismatch) -- fixing it once at load isn't
  // enough, so we recompute the floor/center on every setTime call.
  const rig = new THREE.Group();
  scene.add(rig);

  let mixer = null, action = null, model = null, modelScale = 1;
  window.__ready = false;
  window.__duration = 0;

  function recenter() {
    rig.position.set(0, 0, 0);
    rig.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    rig.position.set(
      -(box.min.x + box.max.x) / 2,
      -box.min.y,
      -(box.min.z + box.max.z) / 2
    );
    window.__debug = { boxMin: box.min.toArray(), boxMax: box.max.toArray(), rigPos: rig.position.toArray(), modelScale };
  }

  window.__loadClip = function (glbPath) {
    window.__ready = false;
    if (model) { rig.remove(model); model = null; mixer = null; action = null; }
    loader.load(glbPath, (gltf) => {
      model = gltf.scene;
      model.position.set(0, 0, 0);
      model.scale.setScalar(1);
      rig.add(model);
      rig.position.set(0, 0, 0);
      const box1 = new THREE.Box3().setFromObject(model);
      const size1 = box1.getSize(new THREE.Vector3());
      modelScale = 1.6 / Math.max(size1.x, size1.y, size1.z);
      model.scale.setScalar(modelScale);

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        action = mixer.clipAction(gltf.animations[0]);
        action.play();
        // NOTE: do NOT set action.paused = true -- three.js forces
        // deltaTime to 0 for paused actions inside AnimationAction._update,
        // which makes mixer.setTime() below silently freeze the pose near
        // frame 0 no matter what time is requested.
        window.__duration = gltf.animations[0].duration;
        mixer.setTime(0);
      } else {
        window.__duration = 0;
      }
      recenter();
      renderer.render(scene, camera);
      window.__ready = true;
    }, undefined, (err) => { console.error('load fail', err); window.__ready = 'error'; });
  };

  window.__setTime = function (t) {
    if (mixer && action) mixer.setTime(t);
    recenter();
    renderer.render(scene, camera);
  };

  (function tick(){ requestAnimationFrame(tick); if (!mixer) renderer.render(scene, camera); })();
</script>
