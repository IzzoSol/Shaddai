<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>◈ AGENT ARCADE — SHADDAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000000;
    --panel:#050505;
    --panel2:#080a09;
    --border:rgba(0,255,136,0.14);
    --border-strong:rgba(0,255,136,0.4);
    --green:#00ff88;
    --cyan:#00f0ff;
    --purple:#c084fc;
    --yellow:#f5e000;
    --orange:#ff9d3d;
    --red:#ff2a2a;
    --dim:#5a6b60;
    --text:#c8d6cd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Share Tech Mono',monospace;
    font-size:14px;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  /* CRT scanlines */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.035) 3px,
      rgba(0,0,0,0.035) 4px
    );
  }
  h1,h2,h3{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:1px;margin:0;}
  a{color:var(--cyan);text-decoration:none;}
  a:hover{color:var(--green);}

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 22px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
    flex-wrap:wrap;
  }
  .topbar h1{
    font-size:20px;
    color:var(--green);
    text-shadow:0 0 12px rgba(0,255,136,0.5);
  }
  .topbar .tag{color:var(--dim);font-size:12px;letter-spacing:1px;}
  .topbar .back{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:6px 12px;
    border:1px solid var(--border);
  }
  .topbar .back:hover{border-color:var(--border-strong);}
  .topbar .spacer{margin-left:auto;}
  .apistatus{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
  .apistatus.up{color:var(--green);}
  .apistatus.down{color:var(--red);}

  .wrap{max-width:1200px;margin:0 auto;padding:22px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    padding:18px;
    margin-bottom:22px;
    box-shadow:0 0 24px rgba(0,255,136,0.04) inset;
  }
  .card > h2{
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    color:var(--cyan);
    margin-bottom:16px;
    text-transform:uppercase;
    letter-spacing:2px;
    text-shadow:0 0 8px rgba(0,240,255,0.35);
  }
  .card > h2 .step{color:var(--dim);margin-right:8px;}

  select,button{
    font-family:'Share Tech Mono',monospace;
    outline:none;
  }
  select{
    background:#000;
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    padding:8px 10px;
  }
  select:focus{border-color:var(--green);}

  /* Grid of cards */
  .grid{display:grid;gap:14px;}
  .games-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  .agents-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}

  .pick{
    background:var(--panel2);
    border:2px solid #182018;
    padding:14px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
    text-align:center;
    user-select:none;
  }
  .pick:hover{transform:translateY(-3px);}
  .pick.sel{box-shadow:0 0 22px var(--accent, var(--green));border-color:var(--accent,var(--green));}
  .pick.sel::after{
    content:"◈";position:absolute;top:6px;right:9px;color:var(--accent,var(--green));font-size:13px;
  }

  /* Game cards */
  .game-ico{font-size:34px;line-height:1;margin-bottom:8px;display:block;}
  .game-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;}

  /* Agent cards */
  .agent-tile{
    width:100%;
    aspect-ratio:1/1;
    background:#000;
    border:1px solid #141a14;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:8px;overflow:hidden;
  }
  .agent-tile img.ship{
    width:100%;height:100%;object-fit:contain;
    mix-blend-mode:lighten;
  }
  .agent-row{display:flex;align-items:center;justify-content:center;gap:7px;}
  .agent-port{
    width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top center;
    border:1px solid rgba(255,255,255,0.15);background:#000;flex:none;
  }
  .agent-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;}

  /* Actions */
  .actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .btn{
    font-family:'Orbitron',sans-serif;font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase;font-size:13px;
    padding:12px 22px;background:#000;color:var(--green);
    border:1px solid var(--border-strong);cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover:not(:disabled){background:rgba(0,255,136,0.1);box-shadow:0 0 18px rgba(0,255,136,0.35);}
  .btn.cyan{color:var(--cyan);border-color:rgba(0,240,255,0.4);}
  .btn.cyan:hover:not(:disabled){background:rgba(0,240,255,0.1);box-shadow:0 0 18px rgba(0,240,255,0.35);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.small{font-size:11px;padding:7px 14px;}
  .sel-note{color:var(--dim);font-size:12px;}
  .sel-note b{color:var(--text);}

  /* Result banner */
  .banner{
    margin-top:18px;padding:16px 18px;border:1px solid var(--border);
    background:#020402;display:none;
  }
  .banner.show{display:block;animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
  .banner .verdict{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;}
  .banner .verdict.win{color:var(--green);text-shadow:0 0 14px rgba(0,255,136,0.5);}
  .banner .verdict.loss{color:var(--red);text-shadow:0 0 14px rgba(255,42,42,0.5);}
  .banner .score{font-size:14px;color:var(--yellow);margin-top:4px;}
  .banner .summary{margin-top:8px;color:var(--text);font-size:13px;line-height:1.5;}
  .banner .meta{margin-top:6px;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;}

  /* Leaderboard */
  .lb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .lb-head .filters{display:flex;gap:10px;flex-wrap:wrap;}
  .lb-head .spacer{margin-left:auto;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    text-align:left;color:var(--green);font-family:'Orbitron',sans-serif;font-weight:500;
    font-size:10px;text-transform:uppercase;letter-spacing:1px;
    padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
  tr:hover td{background:rgba(0,255,136,0.03);}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;box-shadow:0 0 6px currentColor;}
  .aname{font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;vertical-align:middle;}
  .rank{color:var(--dim);font-size:11px;}
  .badge-win{color:var(--green);font-weight:700;}
  .badge-loss{color:var(--red);font-weight:700;}
  .empty{color:var(--dim);text-align:center;padding:24px;font-size:13px;}

  /* Watch overlay */
  .overlay{
    position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,0.92);
    display:none;flex-direction:column;padding:14px;
  }
  .overlay.show{display:flex;}
  .overlay .obar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .overlay .otitle{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--cyan);font-size:14px;letter-spacing:1px;}
  .overlay iframe{flex:1;width:100%;border:1px solid var(--border-strong);background:#000;}
  .overlay .waiting{color:var(--dim);font-size:12px;letter-spacing:1px;}

  .msg{color:var(--dim);font-size:13px;padding:10px 0;}
  .msg.err{color:var(--orange);}
</style>
</head>
<body>
  <div class="topbar">
    <h1>◈ AGENT ARCADE</h1>
    <span class="tag">pick a game · pick an agent · watch it play</span>
    <div class="spacer"></div>
    <span id="apiStatus" class="apistatus">● connecting…</span>
    <a class="back" href="/games/battle-arena.html">⚔ BATTLE ARENA</a>
    <a class="back" href="/">← DASHBOARD</a>
  </div>

  <div class="wrap">

    <!-- GAME SELECT -->
    <div class="card">
      <h2><span class="step">01</span> Select Game</h2>
      <div id="gamesGrid" class="grid games-grid"></div>
    </div>

    <!-- AGENT SELECT -->
    <div class="card">
      <h2><span class="step">02</span> Select Agent</h2>
      <div id="agentsGrid" class="grid agents-grid"></div>
    </div>

    <!-- ACTIONS -->
    <div class="card">
      <h2><span class="step">03</span> Play</h2>
      <div class="actions">
        <button id="btnPlay" class="btn" disabled>▶ Play (Instant)</button>
        <button id="btnWatch" class="btn cyan" disabled>◉ Watch Bot</button>
        <span id="selNote" class="sel-note">Choose a game and an agent to begin.</span>
      </div>
      <div id="banner" class="banner"></div>
    </div>

    <!-- LEADERBOARD -->
    <div class="card">
      <div class="lb-head">
        <h2 style="margin:0;">◆ Leaderboard</h2>
        <div class="filters">
          <select id="filterGame"><option value="">All Games</option></select>
          <select id="filterAgent"><option value="">All Agents</option></select>
        </div>
        <div class="spacer"></div>
        <button id="btnRefresh" class="btn small">↻ Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Agent</th><th>Game</th><th>Score</th><th>Result</th><th>When</th></tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- WATCH OVERLAY -->
  <div id="overlay" class="overlay">
    <div class="obar">
      <span class="otitle" id="overlayTitle">◉ Watching…</span>
      <span class="waiting" id="overlayWait">Bot is playing — result will appear here.</span>
      <div class="spacer" style="margin-left:auto;"></div>
      <button id="btnCloseOverlay" class="btn small">✕ Close</button>
    </div>
    <iframe id="gameFrame" title="game" allow="autoplay; fullscreen"></iframe>
  </div>

<script>
(function(){
  "use strict";

  // ---------- fallback data ----------
  var FALLBACK_GAMES = [
    {id:"basketball",  name:"NEON HOOPS",     url:"/games/basketball.html",  color:"#ff9d3d", icon:"🏀"},
    {id:"football",    name:"GRID GRIDIRON",  url:"/games/football.html",    color:"#ff2a2a", icon:"🏈"},
    {id:"dodgeball",   name:"GRID DODGEBALL", url:"/games/dodgeball.html",   color:"#ff5db1", icon:"⚡"},
    {id:"sigil-storm", name:"SIGIL STORM",    url:"/games/sigil-storm.html", color:"#c084fc", icon:"✦"},
    {id:"xt-adventure", name:"XT ADVENTURE",  url:"/games/xt-adventure.html", color:"#00ff88", icon:"🗡️"}
  ];
  var FALLBACK_AGENTS = [
    {id:"SHADDAI", color:"#ffcf1a"},
    {id:"NEXUS",   color:"#00f0ff"},
    {id:"ORACLE",  color:"#b06bff"},
    {id:"ZEROX",   color:"#ff9d3d"},
    {id:"TURTLE",  color:"#ff2bd6"},
    {id:"QUILL",   color:"#f5e000"},
    {id:"PIKADON", color:"#ff2a2a"}
  ].map(function(a){
    a.name = a.id;
    a.ship = "/assets/games/ships/"+a.id+".png";
    a.portrait = "/assets/agents/"+a.id+"-portrait.png";
    return a;
  });
  var GAME_ICONS = {basketball:"🏀", football:"🏈", dodgeball:"⚡", "sigil-storm":"✦", "xt-adventure":"🗡️"};

  // ---------- state ----------
  var GAMES = [], AGENTS = [];
  var selGame = null, selAgent = null;
  var apiOnline = true;
  var pollTimer = null;

  // ---------- dom ----------
  var $ = function(id){ return document.getElementById(id); };
  var gamesGrid = $("gamesGrid"), agentsGrid = $("agentsGrid");
  var btnPlay = $("btnPlay"), btnWatch = $("btnWatch"), selNote = $("selNote");
  var banner = $("banner"), lbBody = $("lbBody");
  var filterGame = $("filterGame"), filterAgent = $("filterAgent");
  var overlay = $("overlay"), gameFrame = $("gameFrame");
  var apiStatus = $("apiStatus");

  // ---------- helpers ----------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function agentById(id){
    for(var i=0;i<AGENTS.length;i++){ if(AGENTS[i].id===id) return AGENTS[i]; }
    return null;
  }
  function gameById(id){
    for(var i=0;i<GAMES.length;i++){ if(GAMES[i].id===id) return GAMES[i]; }
    return null;
  }
  function timeAgo(ts){
    if(!ts) return "—";
    var t = (typeof ts === "number") ? ts : Date.parse(ts);
    if(isNaN(t)) return "—";
    var s = Math.max(0, Math.floor((Date.now()-t)/1000));
    if(s<60) return s+"s ago";
    var m = Math.floor(s/60); if(m<60) return m+"m ago";
    var h = Math.floor(m/60); if(h<24) return h+"h ago";
    return Math.floor(h/24)+"d ago";
  }
  function setApiStatus(up){
    apiOnline = up;
    apiStatus.className = "apistatus " + (up ? "up" : "down");
    apiStatus.textContent = up ? "● API online" : "● API offline (demo)";
  }
  async function api(path, opts){
    var res = await fetch(path, opts);
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }

  // ---------- render games ----------
  function renderGames(){
    gamesGrid.innerHTML = "";
    filterGame.innerHTML = '<option value="">All Games</option>';
    GAMES.forEach(function(g){
      var icon = g.icon || GAME_ICONS[g.id] || "🎮";
      var el = document.createElement("div");
      el.className = "pick";
      el.style.setProperty("--accent", g.color || "#00ff88");
      el.innerHTML = '<span class="game-ico">'+esc(icon)+'</span>'+
                     '<span class="game-name" style="color:'+esc(g.color||"#00ff88")+'">'+esc(g.name)+'</span>';
      el.addEventListener("click", function(){ selectGame(g.id); });
      el.dataset.id = g.id;
      gamesGrid.appendChild(el);

      var o = document.createElement("option");
      o.value = g.id; o.textContent = g.name;
      filterGame.appendChild(o);
    });
  }
  function selectGame(id){
    selGame = id;
    [].forEach.call(gamesGrid.children, function(c){
      c.classList.toggle("sel", c.dataset.id === id);
    });
    updateActions();
  }

  // ---------- render agents ----------
  function renderAgents(){
    agentsGrid.innerHTML = "";
    filterAgent.innerHTML = '<option value="">All Agents</option>';
    AGENTS.forEach(function(a){
      var col = a.color || "#00ff88";
      var el = document.createElement("div");
      el.className = "pick";
      el.style.setProperty("--accent", col);
      el.innerHTML =
        '<div class="agent-tile"><img class="ship" alt="'+esc(a.name)+' ship" src="'+esc(a.ship)+'" '+
          'onerror="this.style.display=\'none\'"></div>'+
        '<div class="agent-row">'+
          '<img class="agent-port" alt="" src="'+esc(a.portrait)+'" onerror="this.style.display=\'none\'">'+
          '<span class="agent-name" style="color:'+esc(col)+'">'+esc(a.name)+'</span>'+
        '</div>';
      el.addEventListener("click", function(){ selectAgent(a.id); });
      el.dataset.id = a.id;
      agentsGrid.appendChild(el);

      var o = document.createElement("option");
      o.value = a.id; o.textContent = a.name;
      filterAgent.appendChild(o);
    });
  }
  function selectAgent(id){
    selAgent = id;
    [].forEach.call(agentsGrid.children, function(c){
      c.classList.toggle("sel", c.dataset.id === id);
    });
    updateActions();
  }

  function updateActions(){
    var ready = selGame && selAgent;
    btnPlay.disabled = !ready;
    btnWatch.disabled = !ready;
    if(ready){
      var g = gameById(selGame), a = agentById(selAgent);
      selNote.innerHTML = "Ready: <b>"+esc(a?a.name:selAgent)+"</b> plays <b>"+esc(g?g.name:selGame)+"</b>.";
    } else {
      selNote.textContent = "Choose a game and an agent to begin.";
    }
  }

  // ---------- result banner ----------
  function showResult(r){
    if(!r){ return; }
    var win = !!r.win;
    var g = gameById(r.game), a = agentById(r.agent);
    var meta = [];
    meta.push((a?a.name:r.agent) + " · " + (g?g.name:r.game));
    banner.innerHTML =
      '<div class="verdict '+(win?"win":"loss")+'">'+(win?"◈ WIN":"✕ LOSS")+'</div>'+
      '<div class="score">SCORE: '+esc(r.score==null?"—":r.score)+'</div>'+
      (r.summary ? '<div class="summary">'+esc(r.summary)+'</div>' : "")+
      '<div class="meta">'+esc(meta.join(""))+'</div>';
    banner.classList.add("show");
  }

  // ---------- PLAY (instant) ----------
  async function playInstant(){
    if(!selGame || !selAgent) return;
    btnPlay.disabled = true;
    var prev = btnPlay.textContent; btnPlay.textContent = "… playing";
    try{
      var data = await api("/api/arcade/play", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({game:selGame, agent:selAgent})
      });
      setApiStatus(true);
      if(data && data.ok && data.result){
        showResult(data.result);
        loadLeaderboard();
      } else {
        banner.innerHTML = '<div class="summary">No result returned by the arcade engine.</div>';
        banner.classList.add("show");
      }
    }catch(e){
      setApiStatus(false);
      banner.innerHTML = '<div class="summary" style="color:var(--orange)">Play failed — the arcade API is offline. Try again once the backend is running.</div>';
      banner.classList.add("show");
    }finally{
      btnPlay.textContent = prev; btnPlay.disabled = !(selGame && selAgent);
    }
  }

  // ---------- WATCH BOT (iframe + postMessage) ----------
  function watchBot(){
    if(!selGame || !selAgent) return;
    var g = gameById(selGame), a = agentById(selAgent);
    if(!g) return;
    var url = g.url + (g.url.indexOf("?")>=0 ? "&" : "?") + "autoplay=1&agent=" + encodeURIComponent(selAgent);
    $("overlayTitle").textContent = "◉ " + (a?a.name:selAgent) + " plays " + (g?g.name:selGame);
    $("overlayWait").textContent = "Bot is playing — result will appear here.";
    gameFrame.src = url;
    overlay.classList.add("show");
  }
  function closeOverlay(){
    overlay.classList.remove("show");
    gameFrame.src = "about:blank";
  }
  // listen for game results
  window.addEventListener("message", function(ev){
    var d = ev.data;
    if(!d || typeof d !== "object") return;
    if(d.type !== "arcadeResult") return;
    var r = d.result || d.payload || d;
    // normalise minimal shape
    var result = {
      game:   r.game   != null ? r.game   : selGame,
      agent:  r.agent  != null ? r.agent  : selAgent,
      score:  r.score,
      win:    r.win,
      summary:r.summary
    };
    $("overlayWait").textContent = "Result received ✓ — you can close this window.";
    showResult(result);
    loadLeaderboard();
  });

  // ---------- leaderboard ----------
  async function loadLeaderboard(){
    var qs = [];
    if(filterGame.value)  qs.push("game="+encodeURIComponent(filterGame.value));
    if(filterAgent.value) qs.push("agent="+encodeURIComponent(filterAgent.value));
    qs.push("limit=20");
    try{
      var data = await api("/api/arcade/leaderboard?"+qs.join("&"));
      setApiStatus(true);
      renderLeaderboard((data && data.scores) || []);
    }catch(e){
      setApiStatus(false);
      lbBody.innerHTML = '<tr><td colspan="6" class="empty">Leaderboard unavailable — arcade API is offline.</td></tr>';
    }
  }
  function renderLeaderboard(scores){
    if(!scores.length){
      lbBody.innerHTML = '<tr><td colspan="6" class="empty">No scores yet — be the first to play.</td></tr>';
      return;
    }
    var rows = scores.map(function(s, i){
      var a = agentById(s.agent), g = gameById(s.game);
      var col = a ? a.color : "#00ff88";
      var win = !!s.win;
      return '<tr>'+
        '<td class="rank">'+(i+1)+'</td>'+
        '<td><span class="dot" style="color:'+esc(col)+';background:'+esc(col)+'"></span>'+
            '<span class="aname" style="color:'+esc(col)+'">'+esc(a?a.name:s.agent)+'</span></td>'+
        '<td>'+esc(g?g.name:s.game)+'</td>'+
        '<td style="color:var(--yellow)">'+esc(s.score==null?"—":s.score)+'</td>'+
        '<td>'+(win?'<span class="badge-win">WIN</span>':'<span class="badge-loss">LOSS</span>')+'</td>'+
        '<td class="rank">'+esc(timeAgo(s.ts))+'</td>'+
      '</tr>';
    });
    lbBody.innerHTML = rows.join("");
  }

  // ---------- load games/agents ----------
  async function loadCatalog(){
    try{
      var gd = await api("/api/arcade/games");
      GAMES = (gd && gd.ok && gd.games && gd.games.length) ? gd.games : FALLBACK_GAMES;
      setApiStatus(true);
    }catch(e){ GAMES = FALLBACK_GAMES; setApiStatus(false); }

    try{
      var ad = await api("/api/arcade/agents");
      AGENTS = (ad && ad.ok && ad.agents && ad.agents.length) ? ad.agents.map(function(a){
        a.name = a.name || a.id;
        a.ship = a.ship || ("/assets/games/ships/"+a.id+".png");
        a.portrait = a.portrait || ("/assets/agents/"+a.id+"-portrait.png");
        return a;
      }) : FALLBACK_AGENTS;
    }catch(e){ AGENTS = FALLBACK_AGENTS; }

    renderGames();
    renderAgents();
  }

  // ---------- wire ----------
  btnPlay.addEventListener("click", playInstant);
  btnWatch.addEventListener("click", watchBot);
  $("btnCloseOverlay").addEventListener("click", closeOverlay);
  $("btnRefresh").addEventListener("click", loadLeaderboard);
  filterGame.addEventListener("change", loadLeaderboard);
  filterAgent.addEventListener("change", loadLeaderboard);
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && overlay.classList.contains("show")) closeOverlay();
  });

  // ---------- init ----------
  (async function init(){
    await loadCatalog();
    await loadLeaderboard();
    pollTimer = setInterval(loadLeaderboard, 15000);
  })();

})();
</script>
</body>
</html>
