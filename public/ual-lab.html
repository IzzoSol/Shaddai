<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Lab</title>
<style>
:root{--bg:#06080b;--panel:#0d1219;--line:#1d2733;--ink:#dfe7ee;--dim:#7a8794;--gold:#e8c45c;--em:#00ff9c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px system-ui,Segoe UI,sans-serif;overflow:hidden}
#ui{position:fixed;top:0;left:0;bottom:0;width:250px;background:rgba(13,18,25,.94);border-right:1px solid var(--line);padding:12px;overflow:auto;z-index:2}
h1{font-size:13px;letter-spacing:.14em;color:var(--gold);margin:0 0 4px}
.sub{color:var(--dim);font-size:11px;margin-bottom:10px}
label{display:block;color:var(--dim);font-size:11px;margin:8px 0 4px}
select{width:100%;background:#101822;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
#clips button{display:block;width:100%;text-align:left;margin:2px 0;background:none;border:1px solid transparent;color:var(--ink);border-radius:6px;padding:4px 7px;font:inherit;font-size:12px;cursor:pointer}
#clips button:hover{border-color:var(--line)}
#clips button.on{border-color:var(--gold);color:var(--gold)}
#clips .grp{color:var(--dim);font-size:10px;letter-spacing:.12em;margin:10px 0 2px}
#status{position:fixed;right:12px;bottom:10px;color:var(--dim);font-size:11px}
canvas{display:block}
@media (max-width:640px){#ui{width:100%;height:40%;bottom:auto;right:0}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <h1>ANIMATION LAB</h1>
  <div class="sub">Quaternius UAL2 (CC0) moves on our agents — aimed per body, no stretching.</div>
  <label for="agent">Agent</label>
  <select id="agent"></select>
  <label>Move</label>
  <div id="clips"></div>
</div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { attachUAL } from '/ual-retarget.js';

const AGENTS = ['oracle-v2', 'pikadon-v2', 'quill', 'nexus', 'pikadon', 'zerox', 'oracle', 'turtle', 'shaddai', 'leadr', 'gaeli'];
const GROUPS = { Combat: /Sword|Melee|Shield|Hit|Throw|Block|Dash/, Move: /Jump|Slide|Climb|Walk|Zombie_Walk|Lay/, Idle: /Idle|Yes|TPose/, World: /Farm|Tree|Chest|Consume|Rail|Phone|Lantern|Zombie/ };
const $ = (s) => document.querySelector(s);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b1016);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100); camera.position.set(2.2, 1.5, 3.6);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.9, 0);
scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x202830, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x141b24 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
scene.add(new THREE.GridHelper(6, 12, 0x2a3a48, 0x1a242e));
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let body = null, mixer = null, ual = null, current = null; const clips = {};
const sel = $('#agent'); AGENTS.forEach((a) => sel.add(new Option(a.toUpperCase(), a)));
const q = new URLSearchParams(location.search);
sel.value = q.get('agent') || 'quill';

async function loadAgent(id) {
  $('#status').textContent = 'loading ' + id + '…';
  if (body) scene.remove(body);
  for (const k in clips) delete clips[k];
  const g = await loader.loadAsync(`/assets/models/chars/${id}.glb`);
  body = g.scene;
  scene.add(body);
  mixer = new THREE.AnimationMixer(body);
  ual = attachUAL(THREE, body, mixer, clips);   // captures the rest pose in body space — scaling after is safe
  // size from the SKELETON (head above feet), not Box3: skinned bounds on these rigs report ~1/100 scale
  if (ual.rig) {
    body.updateMatrixWorld(true);
    const y = (o) => o ? new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).y : NaN;
    const feet = Math.min(y(ual.rig.L.foot), y(ual.rig.R.foot)), top = y(ual.rig.head) || y(ual.rig.neck);
    const h = (top - feet) || 1; body.scale.multiplyScalar(1.62 / h);   // head joint sits ~0.18m below the crown of a 1.8m body
    body.updateMatrixWorld(true); body.position.y -= Math.min(y(ual.rig.L.foot), y(ual.rig.R.foot)) - 0.08;
  }
  const ok = await ual.ready;
  window.__ual = ual; window.__play = (n) => play(n, true);
  renderList(ok ? ual.names : []);
  $('#status').textContent = ok ? `${id}: ${ual.names.length} moves · rig ${ual.rig.spine.length}-bone spine` : 'no rig found on ' + id;
  window.__ready = ok;
  if (ok) play(q.get('clip') || 'Sword_Regular_Combo');
}
function renderList(names) {
  const box = $('#clips'); box.innerHTML = '';
  for (const [g, re] of Object.entries(GROUPS)) {
    const list = names.filter((n) => re.test(n) && !Object.entries(GROUPS).some(([g2, r2]) => g2 !== g && Object.keys(GROUPS).indexOf(g2) < Object.keys(GROUPS).indexOf(g) && r2.test(n)));
    if (!list.length) continue;
    box.insertAdjacentHTML('beforeend', `<div class="grp">${g.toUpperCase()}</div>`);
    list.forEach((n) => { const b = document.createElement('button'); b.textContent = n.replace(/_/g, ' '); b.dataset.n = n; b.onclick = () => play(n); box.appendChild(b); });
  }
}
function play(name, immediate) {
  const a = ual && ual.add(name); if (!a) return false;
  if (immediate) { mixer.stopAllAction(); a.reset().setLoop(THREE.LoopRepeat).play(); }
  else { if (current && current !== a) current.fadeOut(0.15); a.reset().setLoop(THREE.LoopRepeat).fadeIn(0.15).play(); }
  current = a;
  document.querySelectorAll('#clips button').forEach((b) => b.classList.toggle('on', b.dataset.n === name));
  return true;
}
window.__setTime = (t) => { if (mixer) { mixer.setTime(t); renderer.render(scene, camera); } };
sel.onchange = () => loadAgent(sel.value);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, camera); });
loadAgent(sel.value).catch((e) => { $('#status').textContent = 'error: ' + e.message; window.__ready = 'error'; });
</script>
</body>
</html>
