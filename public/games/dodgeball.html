  // crisp team-color rim around the head
  ctx.lineWidth=Math.max(1.4,u*0.14); ctx.strokeStyle=flash?'#fff':p.color;
  ctx.shadowColor=glowCol; ctx.shadowBlur=isActive?11:5;
  ctx.beginPath(); ctx.ellipse(0,hCY,headR*0.9,headR,0,0,6.283); ctx.stroke();
  ctx.shadowBlur=0;

  // catch flash ring around head
  if(p.catchFlash>0){
    ctx.globalAlpha=p.catchFlash/0.4*0.8; ctx.strokeStyle=GN; ctx.lineWidth=2.5;
    ctx.shadowColor=GN; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,hCY,headR*(1.3+ (0.4-p.catchFlash)*3),0,6.283); ctx.stroke();
  }
  ctx.restore();

  // mini HP bar above head (screen space, no rotate/scale)
  // head top sits ~ (hip 1.55u + torso 1.45u + neck 0.24u + head ~1.5u) above feet
  var headTop = footY - lift - (u*4.9)*sqY;
  var bw=u*2.0, bh=Math.max(3,u*0.24), bx=X-bw/2, by=headTop;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  var frac=Math.max(0,p.hp/p.maxHp);
  ctx.fillStyle = frac>0.5?p.color:(frac>0.25?'#ffd24d':'#ff1a1a');
  ctx.fillRect(bx,by,bw*frac,bh);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================ RENDER: BALL ============================ */
function drawTrails(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';   // trails add light -> glowing streak
  for(var i=0;i<trail.length;i++){
    var t=trail[i]; var a=t.life/t.max;
    ctx.globalAlpha=a*a*0.8;
    ctx.fillStyle=t.special?'#ffae4a':CY;
    ctx.shadowColor=t.special?'#ff5a1a':CY; ctx.shadowBlur=t.special?20:14;
    ctx.beginPath(); ctx.arc(sx(t.x), sy(t.y)-8*scale*0.55, BR*scale*(0.35+a*0.75),0,6.283); ctx.fill();
  }
  ctx.restore();
}
function drawBall(b){
  if(b.state==='held' && !b.held) return;
  var X=sx(b.x), Y=sy(b.y)-b.z*scale*0.55;
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx(b.x), sy(b.y)+2, BR*scale*0.9, BR*scale*0.45,0,0,6.283); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(X,Y); ctx.rotate(b.spin);
  var glow = b.special?'#ff6a2a':(b.state==='thrown'?CY:'#cfe');
  var rr=BR*scale;
  ctx.shadowColor=glow; ctx.shadowBlur= b.special?24:12;
  // shaded sphere via radial gradient (highlight upper-left)
  var bg=ctx.createRadialGradient(-rr*0.35,-rr*0.35,rr*0.1,0,0,rr);
  if(b.special){ bg.addColorStop(0,'#fff3d6'); bg.addColorStop(0.5,'#ffb347'); bg.addColorStop(1,'#ff6a1a'); }
  else { bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.5,'#d5f4ff'); bg.addColorStop(1,'#7fc9e0'); }
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,rr,0,6.283); ctx.fill();
  // dodgeball seams
  ctx.shadowBlur=0;
  ctx.strokeStyle= b.special?'#ff3a1a':'#0088aa'; ctx.lineWidth=Math.max(1,rr*0.28);
  ctx.beginPath(); ctx.moveTo(-rr,0); ctx.lineTo(rr,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,rr*0.62,0.3,2.4); ctx.stroke();
  // hot spec highlight
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-rr*0.35,-rr*0.35,rr*0.22,0,6.283); ctx.fill();
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<particles.length;i++){
    var p=particles[i]; var a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=a; ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+a*0.8),0,6.283); ctx.fill();
  }
  ctx.restore();
}
// brief full-screen flash on big impacts (driven by flashT)
var flashT=0, flashCol='#ffffff';
function screenFlash(col,amt){ flashT=Math.max(flashT,amt||0.18); flashCol=col||'#ffffff'; }
function drawScreenFlash(){
  if(flashT<=0) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.min(0.5,flashT); ctx.fillStyle=flashCol;
  ctx.fillRect(0,0,W,H); ctx.restore();
}
function drawPopups(){
  for(var i=0;i<popups.length;i++){
    var q=popups[i]; var a=Math.min(1,q.life/(q.max*0.6));
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(q.big?Math.max(20,Math.min(40,W*0.038)):15)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=q.color; ctx.shadowColor=q.color; ctx.shadowBlur=q.big?20:8;
    ctx.fillText(q.txt, q.x, q.y);
    ctx.restore();
  }
}
function drawReticle(){
  if(G.state!=='PLAY') return;
  var a=activeRef; if(!a||!a.alive||!a.hasBall) return;
  // lock onto the SAME target the throw will use (bestTarget) so the reticle is truthful
  var t=bestTarget(a); if(!t) return;
  var X=sx(t.x), Y=sy(t.y)-t.z*scale*0.55 - t.r*scale*1.5, R=t.r*scale*1.5;
  ctx.save();
  var pr=(Math.sin(perfNow*0.012)*0.5+0.5);
  ctx.globalAlpha=0.55+pr*0.4; ctx.strokeStyle='#ff3a3a'; ctx.lineWidth=2.2;
  ctx.shadowColor='#ff3a3a'; ctx.shadowBlur=12;
  // spinning reticle ring for a satisfying lock feel
  ctx.beginPath(); ctx.arc(X,Y,R,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(X,Y,R*0.6, perfNow*0.004, perfNow*0.004+4.2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(X-R-5,Y); ctx.lineTo(X-R+7,Y);
  ctx.moveTo(X+R-7,Y); ctx.lineTo(X+R+5,Y);
  ctx.moveTo(X,Y-R-5); ctx.lineTo(X,Y-R+7);
  ctx.moveTo(X,Y+R-7); ctx.lineTo(X,Y+R+5);
  ctx.stroke();
  // LEAD marker: where the ball is actually aimed for a moving target (helps the player read it)
  var lp=leadPoint(a,t,a.charging&&a.charge>=CHARGE_SPECIAL?SPECIAL_SPD:THROW_SPD);
  if(lp && (Math.abs(t.vx||0)+Math.abs(t.vy||0))>8){
    var LX=sx(lp.x), LY=sy(lp.y)-t.r*scale*1.5;
    ctx.globalAlpha=0.5+pr*0.4; ctx.strokeStyle='#ffd24d'; ctx.lineWidth=1.6;
    ctx.shadowColor='#ffd24d'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(LX,LY,R*0.5,0,6.283); ctx.stroke();
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(LX,LY); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ============================ HUD ============================ */
function drawBadge(agent, x, y, r, glow){
  // circular portrait badge; fallback to color disc + initial
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
  ctx.fillStyle='#050505'; ctx.fill();
  ctx.save(); ctx.clip();
  if(agent.ready && agent.im){
    var iw=agent.im.width, ih=agent.im.height, s=Math.max((2*r)/iw,(2*r)/ih);
    ctx.drawImage(agent.im, x-iw*s/2, y-ih*s/2 - r*0.25, iw*s, ih*s);
  } else {
    ctx.fillStyle=rgba(agent.color,0.35); ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.fillStyle=agent.color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(r*0.9)+"px 'Orbitron',sans-serif";
    ctx.fillText(agent.key.charAt(0), x, y);
  }
  ctx.restore();
  ctx.lineWidth=2.5; ctx.strokeStyle=agent.color;
  if(glow){ ctx.shadowColor=agent.color; ctx.shadowBlur=12; }
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
  ctx.restore();
}
function drawTeamPanel(arr, agent, side, sub){
  var color=agent.color;
  var pad=14;
  var br=Math.max(16,Math.min(26,W*0.026));
  var badgeX = side==='left' ? pad+br : W-pad-br;
  var badgeY = HUD_TOP+12+br;
  drawBadge(agent, badgeX, badgeY, br, true);
  ctx.save();
  ctx.textBaseline='top';
  var tx = side==='left' ? pad+br*2+8 : W-pad-br*2-8;
  ctx.textAlign = side==='left' ? 'left':'right';
  ctx.font="800 "+Math.max(13,Math.min(19,W*0.017))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=10;
  ctx.fillText(agent.key, tx, HUD_TOP+10);
  ctx.shadowBlur=0;
  ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
  ctx.fillText(sub, tx, HUD_TOP+30);
  // HP bars — compact when 5v5 (up to 10 bars) so they don't overflow the panel
  var many=arr.length>6;
  var bw=Math.min(150, W*0.20), bh=many?6:8, gap=many?8:11;
  var barX = side==='left' ? tx : tx-bw;
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var by=HUD_TOP+44+i*gap;
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(barX,by,bw,bh);
    var frac=Math.max(0,p.hp/p.maxHp);
    if(!p.alive){ ctx.fillStyle='rgba(120,120,120,0.4)'; ctx.fillRect(barX,by,bw,bh); }
    else { ctx.fillStyle= frac>0.5?color:(frac>0.25?'#ffd24d':'#ff1a1a'); ctx.fillRect(barX,by, bw*frac, bh); }
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(barX,by,bw,bh);
    // number tag
    ctx.fillStyle=p.alive?'#cfe':'#666'; ctx.font="9px 'Share Tech Mono',monospace";
    ctx.textAlign=side==='left'?'left':'right';
    var nx=side==='left'? barX+bw+4 : barX-4;
    ctx.fillText('#'+p.num, nx, by-1);
  }
  ctx.restore();
}
function drawHUD(){
  ctx.save();
  var g=ctx.createLinearGradient(0,HUD_TOP,0,HUD_TOP+topPad+6);
  g.addColorStop(0,'rgba(0,0,0,0.85)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HUD_TOP+topPad+14);
  ctx.restore();

  drawTeamPanel(teamA, G.playerAgent, 'left', 'YOU');
  drawTeamPanel(teamB, G.cpuAgent, 'right', 'CPU');

  // timer center (below the fixed top strip)
  var mm=Math.floor(G.timer/60), ss=Math.floor(G.timer%60);
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font="12px 'Share Tech Mono',monospace"; ctx.fillStyle='#8fd';
  ctx.fillText('ROUND '+G.round+'/'+MAX_ROUNDS+'   ·   SCORE '+G.score+'   ·   K.O. '+G.elims, W/2, HUD_TOP+6);
  ctx.font="800 "+Math.max(20,Math.min(34,W*0.03))+"px 'Orbitron',sans-serif";
  ctx.fillStyle = G.timer<15?'#ff1a1a':GN; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12;
  ctx.fillText(mm+':'+(ss<10?'0':'')+ss, W/2, HUD_TOP+22);
  ctx.shadowBlur=0;

  // camera view label (bottom-center) — always show which angle is active + how to cycle
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font="800 11px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=8;
  ctx.fillText('◎ CAM: '+VIEW.names[VIEW.mode]+'   (V)', W/2, H-30);
  ctx.shadowBlur=0;

  // charge meter bottom-left
  if(G.state==='PLAY'){
    var a=activeRef;
    var bx=14, by=H-56, bw=170, bh=12;
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(bx,by,bw,bh);
    var cf = a&&a.hasBall ? a.charge/CHARGE_MAX : 0;
    var full = cf>=CHARGE_SPECIAL/CHARGE_MAX;
    ctx.fillStyle = full?'#ff6a2a':GN;
    if(full){ ctx.shadowColor='#ff6a2a'; ctx.shadowBlur=14; }
    ctx.fillRect(bx,by, bw*Math.min(1,cf), bh); ctx.shadowBlur=0;
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    var tickX=bx+bw*(CHARGE_SPECIAL/CHARGE_MAX);
    ctx.beginPath(); ctx.moveTo(tickX,by-2); ctx.lineTo(tickX,by+bh+2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.strokeRect(bx,by,bw,bh);
    ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#7fe'; ctx.textAlign='left';
    ctx.fillText(full?'SPECIAL READY — RELEASE!':'HOLD SPACE TO CHARGE', bx, by-12);

    // CAPTAIN OVERDRIVE meter (bottom-left, above charge) — only when not spectating
    if(!WATCH_ON){
      var cap=null;
      for(var ci=0;ci<teamA.length;ci++){ if(teamA[ci].captain){ cap=teamA[ci]; break; } }
      if(cap){
        var cby=by-30, cbw=170, cbh=8;
        var ready=cap.capCd<=0 && cap.alive;
        var fr=ready?1:(1-cap.capCd/CAP_COOLDOWN);
        ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(bx,cby,cbw,cbh);
        ctx.fillStyle=ready?cap.color:'#557';
        if(ready){ ctx.shadowColor=cap.color; ctx.shadowBlur=12; }
        ctx.fillRect(bx,cby,cbw*fr,cbh); ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,cby,cbw,cbh);
        ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle=ready?cap.color:'#89a'; ctx.textAlign='left';
        ctx.fillText(ready?'★ CAPTAIN OVERDRIVE READY — Q':'★ OVERDRIVE '+Math.ceil(cap.capCd)+'s', bx, cby-11);
      }
    }
  }

  // match intro banner
  if(G.introT>0 && G.state==='PLAY'){
    var alpha=Math.min(1,G.introT/0.4);
    ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+Math.max(20,Math.min(40,W*0.038))+"px 'Orbitron',sans-serif";
    ctx.fillStyle=G.playerAgent.color; ctx.shadowColor=G.playerAgent.color; ctx.shadowBlur=18;
    ctx.fillText(G.playerAgent.key+"  VS  "+G.cpuAgent.key, W/2, H*0.42);
    ctx.restore();
  }
}

var sel={ you:1, cpu:4, cursor:1 };
var cardRects=[];
var startBtn={x:0,y:0,w:0,h:0};
var shuffleBtn={x:0,y:0,w:0,h:0};

function sizeLabel(){ return TEAM_SIZE+'v'+TEAM_SIZE; }

function computeCards(){
  cardRects=[];
  var n=AGENTS.length;
  var cols = W<760 ? 4 : 7;
  var rows = Math.ceil(n/cols);
  var topY = topPad+6;
  var availH = H-topY-140;
  var gap = Math.max(8, W*0.012);
  var cw = Math.min((W-gap*(cols+1))/cols, 160);
  // vertical cards: portrait aspect (taller than wide), clamped to available height
  var ch = Math.min(cw*1.55, availH/rows - gap);
  if(ch<cw*1.15) ch=Math.max(80,Math.min(cw*1.55, availH/rows - gap)); // keep portrait feel
  if(ch<80) ch=80;
  var gridW = cols*cw + (cols-1)*gap;
  var startX = (W-gridW)/2;
  var gridH = rows*ch + (rows-1)*gap;
  var startY = topY + Math.max(10,(availH-gridH)/2);
  for(var i=0;i<n;i++){
    var c=i%cols, r=Math.floor(i/cols);
    // center last row
    var rowCount = (r===rows-1) ? (n-(rows-1)*cols) : cols;
    var rowW = rowCount*cw+(rowCount-1)*gap;
    var rowStartX = (W-rowW)/2;
    var x=rowStartX + c*(cw+gap);
    var y=startY + r*(ch+gap);
    cardRects.push({x:x,y:y,w:cw,h:ch,idx:i});
  }
  var bh=48, by=H-96;
  // Row of three: [SIZE toggle] [SHUFFLE] [START]. Sized to fit narrow screens.
  var sizeW=Math.min(120,W*0.20), shufW=Math.min(140,W*0.22), startW=Math.min(180,W*0.28);
  var bgap=Math.max(8,W*0.012);
  var totalW=sizeW+shufW+startW+bgap*2;
  var bx0=(W-totalW)/2;
  sizeBtn   ={x:bx0,                     y:by, w:sizeW,  h:bh};
  shuffleBtn={x:bx0+sizeW+bgap,          y:by, w:shufW,  h:bh};
  startBtn  ={x:bx0+sizeW+shufW+bgap*2,  y:by, w:startW, h:bh};
}

function wrapText(text, cx, y, maxW, lh){
  var words=text.split(' '), line='', lines=[];
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
    else line=test;
  }
  if(line) lines.push(line);
  for(var j=0;j<lines.length;j++) ctx.fillText(lines[j], cx, y+j*lh);
}

function pickCard(idx){
  audio();
  if(sel.you===idx){ sel.you=null; }
  else if(sel.cpu===idx){ sel.cpu=null; }
  else if(sel.you==null){ sel.you=idx; if(sel.cpu===idx) sel.cpu=null; }
  else { sel.cpu=idx; }
  sndSelect();
}
function shuffleTeams(){
  audio();
  sel.you=Math.floor(Math.random()*AGENTS.length);
  do{ sel.cpu=Math.floor(Math.random()*AGENTS.length); }while(sel.cpu===sel.you);
  sndSelect();
}
function confirmSelect(){
  if(sel.you==null) return;
  var c=sel.cpu;
  if(c==null || c===sel.you){ do{ c=Math.floor(Math.random()*AGENTS.length); }while(c===sel.you); }
  G.playerAgent=AGENTS[sel.you]; G.cpuAgent=AGENTS[c];
  gotoModeSelect();    // MODE step (PLAY / WATCH / SKILL PLAY) before the match starts
}
/* ---- MODE SELECT: choose PLAY / WATCH / SKILL PLAY (overlays SELECT) ---- */
var MODE_DEFS=[
  {id:'PLAY',  title:'PLAY',       sub:'Human vs AI',      desc:'You control your agent. Move, throw, catch, dodge.', color:'#00ff88', icon:'▶'},
  {id:'WATCH', title:'WATCH',      sub:'AI vs AI',         desc:'Sit back and spectate a full AI-vs-AI showdown.',    color:'#00f0ff', icon:'◈'},
  {id:'SKILL', title:'SKILL PLAY', sub:'Loadout + Play',   desc:'Activate ability boosts, then play the match.',      color:'#ff2bd6', icon:'✦'}
];
var modeCursor=0, modeBtns=[];
function gotoModeSelect(){ G_MODESEL=true; modeCursor=0; sndSelect(); }
function chooseMode(m){
  G_MODESEL=false;
  if(m==='PLAY'){  G.mode='PLAY';  WATCH_ON=false; startMatch(); }
  else if(m==='WATCH'){ G.mode='WATCH'; WATCH_ON=true; startMatch(); }
  else { G.mode='SKILL'; WATCH_ON=false; gotoSkillSelect(); }
  sndSelect();
}
function selectKey(k){
  if(G_MODESEL){
    if(k==='arrowleft'||k==='a'){ modeCursor=(modeCursor+MODE_DEFS.length-1)%MODE_DEFS.length; sndMove(); }
    else if(k==='arrowright'||k==='d'){ modeCursor=(modeCursor+1)%MODE_DEFS.length; sndMove(); }
    else if(k==='enter'||k==='space'){ chooseMode(MODE_DEFS[modeCursor].id); }
    else if(k==='t'){ G_MODESEL=false; }   // back to team select
    return;
  }
  if(G_SKILLSEL){
    // skill-loadout screen: ENTER starts; cards toggled by mouse/tap
    if(k==='enter'||k==='space'){ confirmSkillPlay(); }
    else if(k==='t'){ G_SKILLSEL=false; gotoModeSelect(); }   // back to mode select
    return;
  }
  var cols = W<760 ? 4 : 7, n=AGENTS.length;
  if(k==='arrowleft'||k==='a'){ sel.cursor=(sel.cursor+n-1)%n; sndMove(); }
  else if(k==='arrowright'||k==='d'){ sel.cursor=(sel.cursor+1)%n; sndMove(); }
  else if(k==='arrowup'||k==='w'){ sel.cursor=(sel.cursor+n-cols)%n; sndMove(); }
  else if(k==='arrowdown'||k==='s'){ sel.cursor=(sel.cursor+cols)%n; sndMove(); }
  else if(k==='space'){ pickCard(sel.cursor); }
  else if(k==='enter'){ confirmSelect(); }
  else if(k==='r'){ shuffleTeams(); }
  else if(k==='g'){ toggleTeamSize(); }
}

function drawRoundClear(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var col=G.playerAgent.color;
  ctx.font="800 "+Math.max(28,Math.min(72,W*0.07))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=26;
  ctx.fillText('ROUND '+G.round+' CLEAR', W/2, H*0.42);
  ctx.shadowBlur=0;
  ctx.font="16px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText('SCORE '+G.score, W/2, H*0.52);
  var pulse=0.5+0.5*Math.sin(perfNow*0.008);
  ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(15,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=14;
  ctx.fillText('ROUND '+(G.round+1)+' / '+MAX_ROUNDS+' INCOMING…', W/2, H*0.60);
  ctx.restore();
}
function drawOver(){
  ctx.save();
  // cinematic arena backdrop under a strong scrim so the result reads clearly
  drawArenaBg(0.74);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var win=G.winner==='A';
  var wa=win?G.playerAgent:G.cpuAgent;
  var col=win?wa.color:'#ff1a1a';
  drawBadge(wa, W/2, H*0.18, Math.max(38,Math.min(66,W*0.066)), true);
  ctx.font="800 "+Math.max(28,Math.min(80,W*0.08))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(win?'VICTORY!':'DEFEAT', W/2, H*0.35);
  ctx.shadowBlur=0;
  ctx.font="15px 'Orbitron',sans-serif"; ctx.fillStyle=wa.color;
  ctx.fillText(win? 'ALL '+MAX_ROUNDS+' ROUNDS CLEARED — '+wa.key
                  : 'FELL IN ROUND '+G.round+' — '+G.cpuAgent.key+' WINS', W/2, H*0.44);
  // final score (big)
  ctx.font="800 "+Math.max(24,Math.min(44,W*0.04))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=GN; ctx.shadowColor=GN; ctx.shadowBlur=18;
  ctx.fillText('SCORE  '+G.score, W/2, H*0.53);
  ctx.shadowBlur=0;
  ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText('ROUND '+G.round+'/'+MAX_ROUNDS+'   ·   K.O. '+G.elims+'   ·   CATCHES '+G.catches, W/2, H*0.60);
  var pulse=0.6+0.4*Math.sin(perfNow*0.006);
  ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(15,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=16;
  ctx.fillText('R — PLAY AGAIN      ·      T — CHANGE AGENT      ·      ESC — EXIT', W/2, H*0.70);
  ctx.restore();
}

/* ============================ MENU MOUSE (menus only — NO on-screen game controls) ============================ */
/* Keyboard is the ONLY gameplay input. Mouse/tap is allowed on the SELECT and OVER
   menu screens purely to click cards/buttons — there is no on-screen joystick or
   throw/jump touch button anywhere. */
function inRect(r,x,y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

canvas.addEventListener('pointerdown', function(e){
  if(AP.on) return;   // ignore real input while autoplaying
  audio();
  var x=e.clientX, y=e.clientY;
  if(G.state==='SELECT'){
    // MODE overlay hit-testing (takes priority when active)
    if(G_MODESEL){
      for(var mi=0;mi<modeBtns.length;mi++){
        if(inRect(modeBtns[mi],x,y)){ modeCursor=mi; chooseMode(modeBtns[mi].id); return; }
      }
      return;
    }
    // SKILLPLAY overlay hit-testing (takes priority when active)
    if(G_SKILLSEL){
      for(var si=0;si<skillBtns.length;si++){
        var sb=skillBtns[si];
        if(x>=sb.x&&x<=sb.x+sb.w&&y>=sb.y&&y<=sb.y+sb.h){
          if(sb.action==='confirm'){ confirmSkillPlay(); return; }
          if(sb.action==='skill'){
            var idx=sb.idx, already=skillPicked.indexOf(idx);
            if(already>=0){ skillPicked.splice(already,1); sndMove(); }
            else if(skillPicked.length<skillPickMax){ skillPicked.push(idx); sndSelect(); }
            applySkillBoosts();
            return;
          }
        }
      }
      return;
    }
    for(var i=0;i<cardRects.length;i++){ if(inRect(cardRects[i],x,y)){ sel.cursor=cardRects[i].idx; pickCard(cardRects[i].idx); return; } }
    if(inRect(startBtn,x,y)){ confirmSelect(); return; }
    if(inRect(shuffleBtn,x,y)){ shuffleTeams(); return; }
    if(inRect(sizeBtn,x,y)){ toggleTeamSize(); return; }
    return;
  }
  if(G.state==='OVER'){ restartMatch(); return; }
});

/* ============================ MAIN LOOP ============================ */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  perfNow=now;

  if(AP.on) apDirector(dt);

  if(G.state==='PLAY') updatePlay(dt);
  else if(G.state==='ROUNDCLEAR'){ G.rcT-=dt; if(G.rcT<=0){ nextRound(); } }
  updateParticles(dt);

  // shake decay
  if(shakeMag>0.2){
    shakeX=(Math.random()*2-1)*shakeMag;
    shakeY=(Math.random()*2-1)*shakeMag;
    shakeMag*=Math.pow(0.0015,dt); shakeMag-=dt*10; if(shakeMag<0)shakeMag=0;
  } else { shakeX=0; shakeY=0; shakeMag=0; }
  if(flashT>0){ flashT-=dt*1.6; if(flashT<0) flashT=0; }

  updateCamera(dt);
  ctx.clearRect(0,0,W,H);

  // show the HTML controls legend only during live play (SELECT/OVER have their own footer)
  var hintEl=document.getElementById('hint');
  if(hintEl){ hintEl.style.display=((G.state==='PLAY'||G.state==='ROUNDCLEAR')&&!WATCH_ON)?'flex':'none'; }

  if(G.state==='SELECT'){
    if(G_SKILLSEL) drawSkillSelect();
    else if(G_MODESEL){ drawSelect(); drawModeSelect(); }
    else drawSelect();
  } else {
    drawCourt();
    drawReticle();
    // reuse a persistent, in-place-sorted array (no per-frame slice allocation)
    drawOrder.length=0;
    for(var oi=0;oi<players.length;oi++) drawOrder.push(players[oi]);
    drawOrder.sort(sortByY);
    for(var i=0;i<drawOrder.length;i++) drawPlayer(drawOrder[i]);
    drawTrails();
    for(var bi=0;bi<balls.length;bi++) drawBall(balls[bi]);
    drawParticles();
    drawScreenFlash();
    drawPopups();
    drawHUD();
    if(WATCH_ON && (G.state==='PLAY'||G.state==='ROUNDCLEAR')){
      ctx.save();
      var pu=0.6+0.4*Math.sin(perfNow*0.006);
      ctx.globalAlpha=pu; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.font="800 "+Math.max(12,Math.min(16,W*0.016))+"px 'Orbitron',sans-serif";
      ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=12;
      ctx.fillText('◈ SPECTATING — AI vs AI    ·    T EXIT', W/2, HUD_TOP+6);
      ctx.restore();
    }
    if(G.state==='ROUNDCLEAR') drawRoundClear();
    if(G.state==='OVER') drawOver();
  }

  requestAnimationFrame(frame);
}

/* ============================ BOOT ============================ */
resize();
newGame();
G.state='SELECT';
requestAnimationFrame(frame);

/* ---- test/inspection hook (inert unless ?dbg=1) — lets an automated harness set the
   team size + start a match and read live counts. No effect on normal play. ---- */
try{
  if(new URLSearchParams(location.search).get('dbg')==='1'){
    window.__DBG={
      setSize:function(n){ TEAM_SIZE=(n<3?3:(n>5?5:n)); syncTeamSize(); },
      start:function(watch){ WATCH_ON=!!watch; G.mode=watch?'WATCH':'PLAY'; startMatch(); },
      info:function(){ return { state:G.state, teamSize:TEAM_SIZE, ballCount:BALL_COUNT,
        ballsInPlay:balls.length, teamA:teamA.length, teamB:teamB.length,
        courtW:COURT_W, courtH:COURT_H, pr:PR, watch:WATCH_ON }; }
    };
  }
}catch(e){}

/* ============================ MOBILE TOUCH CONTROLS ============================
   Touch devices only. The stick writes into the same keys{} map moveVec() reads
   and the buttons call the same actionDown/actionUp/doJump/doDash/doCaptainSpecial
   the keyboard fires, so nothing about the keyboard or menu-mouse path changes.
   Hidden (and inert) outside PLAY so the SELECT/OVER menu taps still land. */
try{
  if(window.SHDTouch && SHDTouch.isTouchDevice()){
    window.__DB_TOUCH = SHDTouch.create({
      keys: keys,
      canvas: canvas,
      keyNames: {up:'w', down:'s', left:'a', right:'d'},
      buttons: [
        { label:'THROW', wide:true,
          down:function(){ if(G.state!=='PLAY'||WATCH_ON||AP.on) return; actionDown(); },
          up:function(){ if(AP.on) return; actionUp(); } },
        { label:'JUMP', down:function(){ if(WATCH_ON||AP.on) return; doJump(); } },
        { label:'DASH', down:function(){ if(WATCH_ON||AP.on) return; doDash(); } },
        { label:'SPEC', down:function(){ if(WATCH_ON||AP.on) return; doCaptainSpecial(); } }
      ],
      visible: function(){ return G.state==='PLAY' && !WATCH_ON && !AP.on; }
    });
  }
}catch(e){}

})();
</script>
