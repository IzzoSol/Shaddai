<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>City Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#06080b; --panel:#0c1016; --panel-2:#10161e; --line:#1b2530; --line-2:#243241;
  --emerald:#00ff9c; --emerald-dim:#00c97b; --emerald-glow:rgba(0,255,156,.18);
  --gold:#e8c45c; --gold-dim:rgba(232,196,92,.14);
  --cyan:#5ee7ff; --ember:#ff7a45; --text:#e7eef5; --muted:#8a9aab; --faint:#56657a;
  --radius:14px; --gap:14px;
  --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--obsidian);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(0,255,156,.07),transparent 60%),
  radial-gradient(900px 400px at -10% 110%,rgba(232,196,92,.05),transparent 60%),var(--obsidian)}
a{color:var(--emerald)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;border:1px solid var(--emerald);display:grid;place-items:center;
  color:var(--emerald);font-weight:700;box-shadow:0 0 18px var(--emerald-glow)}
.brand h1{font-size:18px;margin:0;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em;text-transform:none}
.mode{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px}
.mode b{color:var(--emerald);font-weight:600}

/* ping strip */
.pings{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;margin-bottom:10px;
  background:linear-gradient(90deg,rgba(0,255,156,.08),rgba(0,255,156,.02) 60%,transparent);border:1px solid var(--line-2);
  border-radius:var(--radius);overflow:hidden}
.pings .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald)}
.pings .label{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.pings .stage{position:relative;flex:1 1 auto;min-width:0;height:24px}
.ping{position:absolute;inset:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ping .amt{font-family:var(--mono);font-weight:600;margin-right:8px}
.ping.mint .amt{color:var(--emerald)} .ping.sink .amt{color:var(--gold)}
.ping.enter{animation:pingIn .5s cubic-bezier(.2,.8,.2,1) both}
.ping.leave{animation:pingOut .35s ease-in both}
@keyframes pingIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes pingOut{to{transform:translateY(-100%);opacity:0}}
.pings.flash{box-shadow:0 0 0 1px var(--emerald),0 0 24px var(--emerald-glow)}
.pings{transition:box-shadow .6s ease}
.first{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 16px;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.first li::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;border:1px solid var(--faint);vertical-align:-1px}
.first li.done{color:var(--text)} .first li.done::before{background:var(--emerald);border-color:var(--emerald);box-shadow:0 0 8px var(--emerald-glow)}

/* grid */
.grid{display:grid;grid-template-columns:1fr;gap:var(--gap)}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile--sparks{grid-row:span 2}}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px;border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line)}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--emerald);opacity:.55}
.tile.is-soon::before{background:var(--faint)} .tile.is-demo::before{background:var(--gold)}
.tile header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.demo{color:var(--gold);background:var(--gold-dim);border:1px solid rgba(232,196,92,.35)}
.badge.soon{color:var(--muted);border:1px solid var(--line-2)}
.badge.live{color:var(--emerald);border:1px solid rgba(0,255,156,.3)}
.big{font-size:26px;font-weight:700;line-height:1.1}
.big.sparks{font-family:var(--mono);color:var(--emerald);text-shadow:0 0 18px var(--emerald-glow)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.row > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid rgba(0,255,156,.35);color:var(--emerald);background:rgba(0,255,156,.05)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald-dim),var(--emerald));box-shadow:0 0 10px var(--emerald-glow)}
.gold{color:var(--gold);font-family:var(--mono);font-weight:600}
.mint{color:var(--emerald)} .sink{color:var(--gold)}
.tx{font-family:var(--mono);font-size:13px}
.light{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.light i{width:10px;height:10px;border-radius:50%;background:#1a222c;border:1px solid var(--line-2)}
.light.lit i,.light.windows i{background:var(--gold);box-shadow:0 0 10px rgba(232,196,92,.7);border-color:var(--gold)}
.light.beacon i{background:var(--emerald);box-shadow:0 0 12px var(--emerald);border-color:var(--emerald)}
.light.cyan i{background:transparent;border:2px solid var(--cyan);box-shadow:0 0 10px rgba(94,231,255,.6)}
.light.due i{background:var(--gold);opacity:.55;box-shadow:0 0 6px rgba(232,196,92,.4)}
.light.dim i{background:#2a3038;opacity:.6}
.soon-copy{color:var(--muted);font-size:14px;line-height:1.45}
.cta{display:inline-block;font-weight:600;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--emerald);text-decoration:none;color:var(--emerald)}
.cta:hover,.cta:focus-visible{background:rgba(0,255,156,.08)}
.go{margin-top:auto;padding-top:6px;font-size:13px;text-decoration:none;color:var(--muted);border-top:1px dashed var(--line)}
.go:hover,.go:focus-visible{color:var(--emerald)}
.go code{font-family:var(--mono);font-size:11px;color:var(--faint)}
.note{font-size:12px;color:var(--faint)}
.skeleton{height:84px;border-radius:10px;background:linear-gradient(90deg,var(--line) 0%,var(--line-2) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
footer.foot{margin-top:22px;color:var(--faint);font-size:12px;text-align:center}
a:focus-visible,button:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  .ping.enter,.ping.leave,.skeleton{animation:none}
  .pings{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">S</div>
      <h1>City Dashboard<small>SHADDAI City · what's waiting for you</small></h1>
    </div>
    <span class="mode" id="mode">loading…</span>
  </header>

  <section class="pings" id="pings" aria-label="SPARKS pings">
    <span class="dot" aria-hidden="true"></span>
    <span class="label">Pings</span>
    <div class="stage" id="ping-stage" aria-live="polite"></div>
  </section>
  <ul class="first" id="first" aria-label="First session"></ul>

  <main class="grid" id="grid"></main>

  <footer class="foot">SPARKS is the city's own currency. It stays in the world.</footer>
</div>

<!-- Pure logic: formatting, data sources, tile models, HTML rendering. No DOM access.
     tools/tests/city-dashboard.test.cjs loads this block into a vm context. -->
<script id="dash-core">
(function (root) {
  'use strict';

  var WORLD_PAGE = 'SHADDAI-WORLD-3D.html';
  var MINUS = '−';
  // Closed-loop law (DOC_SPARKS.md): no rendered string may carry these words.
  var BANNED_TEST = /withdraw|cash ?-?out|redeem|payout|apy|yield/i;
  var BANNED_ALL = /withdraw\w*|cash ?-?out\w*|redeem\w*|payouts?|\bapy\b|yield\w*/gi;

  // Ping templates, copied from public/assets/world/city-copy-v4.json "pings".
  var PING_TPL = {
    'sparks:mint': '+{amount} SPARKS · {source}',
    'sparks:sink': MINUS + '{amount} SPARKS · {reason}',
    'class:done': 'Class done: {skill}. Take it to the Forge to seat it.',
    'rent:paid': 'Rent paid at {home}. The lights stay warm.',
    'rent:lapsed': '{home} has lapsed. The windows dim until rent is settled.',
    'stall:sold': 'Stall {n} sold {item} while you were out.'
  };

  // ---------- formatting ----------
  function scrub(s) { return String(s == null ? '' : s).replace(BANNED_ALL, 'ledger'); }
  function esc(s) {
    return scrub(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(n) { var x = Number(n); return isFinite(x) ? x : 0; }
  function fmtNum(n) {
    return String(Math.abs(Math.round(num(n)))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtSigned(n) {
    var x = Math.round(num(n));
    if (x > 0) return '+' + fmtNum(x);
    if (x < 0) return MINUS + fmtNum(x);
    return '0';
  }
  function fmtSparks(n) { return fmtNum(n) + ' SPARKS'; }
  function clamp01(p) { p = num(p); return p < 0 ? 0 : p > 1 ? 1 : p; }
  function fmtPct(p) { return Math.round(clamp01(p) * 100) + '%'; }
  function relTime(iso, nowMs) {
    var t = Date.parse(iso);
    if (!isFinite(t)) return '';
    var d = Math.round((num(nowMs) - t) / 1000);
    var fut = d < 0; d = Math.abs(d);
    var s = d < 45 ? null : d < 3600 ? Math.round(d / 60) + 'm' : d < 86400 ? Math.round(d / 3600) + 'h' : Math.round(d / 86400) + 'd';
    if (!s) return fut ? 'in a moment' : 'just now';
    return fut ? 'in ' + s : s + ' ago';
  }
  function fill(tpl, f) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return f && f[k] != null ? String(f[k]) : m; });
  }
  function worldLink(id) {
    return WORLD_PAGE + '?map=v4&goto=' + encodeURIComponent(String(id || ''));
  }
  function title(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

  // Ledger reason -> short human label. Sign-aware: the same verb reads differently as a mint or a sink.
  var REASONS = [
    [/check-?in/, 'Home check-in', 'Home check-in'],
    [/rent/, 'Rent', 'Rent'],
    [/race[_:]?(entry|enter)/, 'Race entry', 'Race entry'],
    [/race|heat/, 'Race place', 'Race entry'],
    [/tuition|academy|class/, 'Class finished', 'Tuition'],
    [/install|forge|seat|skill/, 'Skill seated', 'Forge install'],
    [/repair/, 'Repair', 'Repair'],
    [/stall|bazaar|gallery/, 'Stall sale', 'Stall purchase'],
    [/work/, 'Work session', 'Work session'],
    [/hire/, 'Hired', 'Hired an agent'],
    [/boost/, 'Boost lock returned', 'Boost lock'],
    [/plot|deed|upkeep/, 'Plot', 'Plot'],
    [/catalog|kiosk|purchase|kit/, 'Kiosk', 'Kiosk'],
    [/arcade/, 'Arcade prize', 'Arcade'],
    [/radio/, 'Radio spin', 'Radio slot'],
    [/exhibit/, 'Exhibit cut', 'Exhibit entry'],
    [/starter|welcome|signup|onboard/, 'Starter SPARKS', 'Starter SPARKS']
  ];
  function reasonLabel(reason, amount) {
    var r = String(reason || '').toLowerCase();
    for (var i = 0; i < REASONS.length; i++) {
      if (REASONS[i][0].test(r)) return num(amount) >= 0 ? REASONS[i][1] : REASONS[i][2];
    }
    var t = scrub(r).replace(/[_:.\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    return t ? title(t).slice(0, 24) : 'Ledger entry';
  }
  function txLine(tx, nowMs) {
    var a = Math.round(num(tx && tx.amount));
    return {
      id: String(tx && (tx.id != null ? tx.id : tx.idempotency_key) || ''),
      kind: a >= 0 ? 'mint' : 'sink',
      amount: fmtSigned(a),
      label: reasonLabel(tx && tx.reason, a),
      when: relTime(tx && (tx.created_at || tx.at), nowMs)
    };
  }
  function pingText(ev) {
    var a = Math.round(num(ev && ev.amount));
    var label = reasonLabel(ev && ev.reason, a);
    return scrub(a >= 0 ? fill(PING_TPL['sparks:mint'], { amount: fmtNum(a), source: label })
                        : fill(PING_TPL['sparks:sink'], { amount: fmtNum(a), reason: label }));
  }

  // ---------- plots: the lights ARE the ledger (DOC_PLOTS.md) ----------
  var PLOT_LIGHT = {
    empty: { cls: 'dim', text: 'Dark' },
    claimed: { cls: 'beacon', text: 'Beacon' },
    built: { cls: 'windows', text: 'Windows on' },
    listed: { cls: 'cyan', text: 'Cyan edge' },
    lapsed: { cls: 'dim', text: 'Dimmed' }
  };
  var HOME_LIGHT = {
    lit: { cls: 'lit', text: 'Lit' },
    rent_due: { cls: 'due', text: 'Rent due' },
    lapsed: { cls: 'dim', text: 'Lapsed' },
    empty: { cls: 'dim', text: 'No home yet' }
  };

  // ---------- tile definitions ----------
  // isNew: the route is written but not yet mounted (or only proposed). A 404/501 there means "coming soon".
  var TILES = [
    { id: 'agent', title: 'Your agent', place: 'forge.install', sources: [
      { key: 'roster', path: '/api/agents' },
      { key: 'card', path: '/api/city/agent', isNew: true, user: true },
      { key: 'active', path: '/api/work/active', user: true }] },
    { id: 'home', title: 'Home & plot', place: 'home.a', sources: [
      { key: 'status', path: '/api/home/status', isNew: true, user: true },
      { key: 'plots', path: '/api/plots/mine', isNew: true, user: true }] },
    { id: 'training', title: 'Training queue', place: 'academy.board', sources: [
      { key: 'queue', path: '/api/academy/queue', isNew: true, user: true }] },
    { id: 'race', title: 'Race invites', place: 'race.gate', sources: [
      { key: 'heats', path: '/api/race/heats?state=open', isNew: true }] },
    { id: 'sparks', title: 'SPARKS', place: 'sparks', sources: [
      { key: 'balance', path: '/api/economy/balance', user: true },
      { key: 'txs', path: '/api/economy/transactions?limit=5', isNew: true, user: true }] },
    { id: 'hiring', title: 'Hiring offers', place: 'hiring', sources: [
      { key: 'rates', path: '/api/hire/rates' },
      { key: 'offers', path: '/api/hire/offers', isNew: true, user: true }] },
    { id: 'jobs', title: 'Perch & courier jobs', place: 'perch.main', sources: [
      { key: 'active', path: '/api/work/active', user: true },
      { key: 'jobs', path: '/api/work/jobs?kinds=perch,courier', isNew: true, user: true }] }
  ];
  var SOON_COPY = {
    agent: 'Frame, skills and energy arrive with the next city update.',
    home: 'Homes and deeds open with the next city update. Your windows will show here.',
    training: 'The class queue opens with the next city update.',
    race: 'The Ring opens its heats with the next city update.',
    sparks: 'Your SPARKS history arrives with the next city update.',
    hiring: 'Offers for your agent arrive with the next city update.',
    jobs: 'The courier board opens with the next city update.'
  };

  // ---------- data sources ----------
  function withUser(path, userId) {
    if (!userId) return path;
    return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'userId=' + encodeURIComponent(userId);
  }

  function createLiveSource(opts) {
    opts = opts || {};
    var doFetch = opts.fetch;
    var base = String(opts.base || '');
    var timeoutMs = opts.timeoutMs == null ? 5000 : opts.timeoutMs;
    var sameOrigin = !base || opts.sameOrigin === true;
    return {
      name: 'live',
      userId: opts.userId || null,
      get: function (path) {
        var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
        var headers = { Accept: 'application/json' };
        // Never hand the session token to a foreign origin (?api= override).
        if (opts.token && sameOrigin) headers.Authorization = 'Bearer ' + opts.token;
        var timer;
        var timeout = new Promise(function (_, reject) {
          timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, timeoutMs);
        });
        var req = Promise.resolve(doFetch(base + path, { headers: headers, credentials: 'same-origin', signal: ctrl ? ctrl.signal : undefined }))
          .then(function (res) {
            return Promise.resolve(res.json ? res.json() : null).catch(function () { return null; })
              .then(function (body) { return { status: res.status, body: body }; });
          });
        return Promise.race([req, timeout]).then(function (r) { clearTimeout(timer); return r; },
          function (e) { clearTimeout(timer); throw e; });
      }
    };
  }

  // Deterministic PRNG (mulberry32) seeded from a string.
  function hashStr(s) {
    var h = 2166136261 >>> 0; s = String(s);
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function rng(seed) {
    var a = hashStr(seed);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(r, arr) { return arr[Math.floor(r() * arr.length) % arr.length]; }
  function intIn(r, lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); }

  var COUNCIL = [
    { id: 'SHADDAI', name: 'SHADDAI', role: 'Supreme Orchestrator' },
    { id: 'NEXUS', name: 'NEXUS', role: 'Technical Architect' },
    { id: 'ZEROX', name: 'ZEROX', role: 'Wealth & Revenue Engine' },
    { id: 'ORACLE', name: 'ORACLE', role: 'Research & Intelligence' },
    { id: 'TURTLE', name: 'TURTLE', role: 'UI/UX & Creative' },
    { id: 'QUILL', name: 'QUILL', role: 'Writing & Communication' },
    { id: 'PIKADON', name: 'PIKADON', role: 'Security & Compliance' }
  ];
  var DEMO_SKILLS = ['work.hire', 'drive.street', 'pilot.hover', 'music.compose', 'quill.lyric', 'turtle.art.motion', 'courier.route', 'forge.repair'];
  // Mints and sinks with amounts from docs/city-v3/PRICES.md (PROPOSED).
  var DEMO_TX = [
    { reason: 'home:checkin', amount: 3 }, { reason: 'home:rent', amount: -5 },
    { reason: 'work_session', amount: 4 }, { reason: 'academy:tuition', amount: -12 },
    { reason: 'race_entry', amount: -10 }, { reason: 'race_prize', amount: 15 },
    { reason: 'forge:install', amount: -15 }, { reason: 'stall_sale', amount: 6 },
    { reason: 'arcade_prize', amount: 2 }, { reason: 'hire:contract_start', amount: 2 },
    { reason: 'kiosk:catalog', amount: -8 }, { reason: 'class_finished', amount: 4 }
  ];

  function createDemoSource(opts) {
    opts = opts || {};
    var seed = String(opts.seed || 'shaddai-city');
    var nowMs = opts.now == null ? Date.UTC(2026, 8, 27, 12, 0, 0) : num(opts.now);
    function iso(msAgo) { return new Date(nowMs - msAgo).toISOString(); }
    function day(offsetDays) { return new Date(nowMs + offsetDays * 86400000).toISOString().slice(0, 10); }
    var agentName = pick(rng(seed + ':agent'), COUNCIL.slice(1)).name;
    function body(path) {
      var p = String(path).split('?')[0];
      var r = rng(seed + ':' + p);
      switch (p) {
        case '/api/agents': return { agents: COUNCIL.map(function (a) { return { id: a.id, name: a.name, role: a.role, status: 'online', isCustom: false }; }), total: COUNCIL.length };
        case '/api/city/agent': {
          var skills = DEMO_SKILLS.slice(), out = [];
          for (var i = 0; i < 3; i++) out.push(skills.splice(Math.floor(r() * skills.length), 1)[0]);
          return { ok: true, agent: { name: agentName, frame: pick(r, ['Runner frame', 'Courier frame', 'Hover frame', 'Studio frame']), skills: out, energy: intIn(r, 35, 92), energy_max: 100 } };
        }
        case '/api/work/active': return { ok: true, userId: 'demo', working: r() < 0.6 ? [agentName] : [] };
        case '/api/home/status': {
          var sold = intIn(r, 0, 4);

<script id="dash-ui">

      var live = modes.filter(function (m) { return m === 'live'; }).length;
      document.getElementById('mode').innerHTML = forceDemo ? '<b>demo</b> mode' : '<b>' + live + '</b>/' + tiles.length + ' live';
      var evs = C.collectEvents(tiles);
      document.getElementById('first').innerHTML = C.renderFirst(C.firstSession(tiles, evs));
      var fresh = C.newEvents(seen, evs);
      // First load: show only the newest event so the strip isn't a flood.
      enqueue(Object.keys(seen).length === fresh.length ? fresh.slice(0, 1) : fresh.reverse());
      return tiles;
    });
  }

  var stage = document.getElementById('ping-stage');
  var strip = document.getElementById('pings');
  function enqueue(evs) { evs.forEach(function (e) { queue.push(e); }); if (!showing) next(); }
  function next() {
    var e = queue.shift();
    if (!e) { showing = false; return; }
    showing = true;
    var old = stage.firstChild;
    var el = document.createElement('div');
    el.className = 'ping ' + (e.amount >= 0 ? 'mint' : 'sink') + (reduced ? '' : ' enter');
    var txt = C.pingText(e), cut = txt.indexOf(' ');
    el.innerHTML = '<span class="amt">' + C.esc(txt.slice(0, cut)) + '</span>' + C.esc(txt.slice(cut + 1));
    if (old) {
      if (reduced) stage.removeChild(old);
      else { old.className += ' leave'; setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 360); }
    }
    stage.appendChild(el);
    if (!reduced) { strip.classList.add('flash'); setTimeout(function () { strip.classList.remove('flash'); }, 700); }
    setTimeout(next, queue.length ? 2200 : 400);
  }

  refresh().then(function () {
    if (!last.length) return;
    var n = 0;
    setInterval(function () {
      if (document.hidden) return;
      if (forceDemo) { var ev = demo.tick(++n); ev.id = 'tick:' + n; seen[ev.id] = 1; enqueue([ev]); }
      else refresh();
    }, forceDemo ? 9000 : 30000);
  });
})();
</script>
</body>
</html>
