<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHADDAI — Walking Character Test</title>
<style>
  body{margin:0;background:#06070d;color:#cfe;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px}
  #bar button{font:600 13px system-ui;letter-spacing:1px;background:#0e1426;color:#27e0ff;border:1px solid #27e0ff;border-radius:8px;padding:10px 18px;cursor:pointer;box-shadow:0 0 12px rgba(39,224,255,.3)}
  #bar button.on{background:#27e0ff;color:#04060d}
  #info{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#7e8aa3;z-index:10}
</style>
<script type="importmap">{ "imports": {
  "three":"https://unpkg.com/three@0.180.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/" }}</script>
</head>
<body>
<div id="bar"><button data-a="Idle" class="on">IDLE</button><button data-a="Walk">WALK</button><button data-a="Run">RUN</button></div>
<div id="info">the rigged player character — same one that walks in the world (press V there for 3rd-person)</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x06070d);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200); camera.position.set(0,3.5,7);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,2,0);
scene.add(new THREE.HemisphereLight(0xeaf2ff,0x202838,1.2));
const d=new THREE.DirectionalLight(0xffffff,1.4); d.position.set(4,8,5); scene.add(d);
scene.add(new THREE.GridHelper(20,40,0x27e0ff,0x10202e));
const clock=new THREE.Clock(); let mixer=null; const acts={}; let cur=null;
new GLTFLoader().load('/assets/player/soldier.glb',(g)=>{
  const m=g.scene; const box=new THREE.Box3().setFromObject(m); const s=new THREE.Vector3(); box.getSize(s);
  m.scale.setScalar(3.6/(s.y||1)); const b2=new THREE.Box3().setFromObject(m); m.position.y=-b2.min.y;
  m.traverse(c=>{ if(c.isMesh) c.frustumCulled=false; }); scene.add(m);
  mixer=new THREE.AnimationMixer(m); (g.animations||[]).forEach(cl=>acts[cl.name]=mixer.clipAction(cl));
  (acts['Idle']||Object.values(acts)[0]).play(); cur=acts['Idle'];
  document.getElementById('info').textContent='loaded clips: '+Object.keys(acts).join(', ');
});
function play(name){ const n=acts[name]; if(!n||n===cur) return; if(cur) cur.fadeOut(0.2); n.reset().fadeIn(0.2).play(); cur=n; }
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#bar button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); play(b.dataset.a); });
(function loop(){ requestAnimationFrame(loop); if(mixer) mixer.update(clock.getDelta()); controls.update(); renderer.render(scene,camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
