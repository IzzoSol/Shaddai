# Render Blueprint for SHADDAI — Main service + Clipper backend
# Render auto-detects this on deploy. The dashboard is served by the same
# service (same-origin), so no CORS config is needed.
#
# After first deploy, set the secret env vars in the Render dashboard
# (Environment tab): GROQ_API_KEY is the important one (free at
# https://console.groq.com/keys). OpenRouter is an optional extra fallback.

services:
  # ─── Main SHADDAI Dashboard ──────────────────────────────────────────────
  - type: web
    name: shaddai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/model/health
    autoDeploy: true

# FORCE REDEPLOY MARKER: 2026-09-19 19:22:00
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false        # set in Render dashboard (secret) — free at console.groq.com/keys
      - key: OPENROUTER_API_KEY
        sync: false        # optional extra fallback (free models) — openrouter.ai/keys (ROTATED 2026-06-03)
      - key: NODE_ENV
        value: production
      # ── Security (optional now; the app boots dev-permissive without them) ──
      # Flip REQUIRE_AUTH to "true" + set the two below to enforce real auth.
      - key: REQUIRE_AUTH
        value: "false"      # set "true" to enforce Firebase/admin auth on protected routes
      - key: ADMIN_TOKEN
        sync: false         # secret — gates admin ops + /execute-code (send as x-shaddai-admin)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false         # secret — Firebase service-account JSON; enables ID-token verify
      # ── Optional creation/commerce keys (leave unset for free tiers) ──
      - key: STRIPE_SECRET_KEY
        sync: false         # subscriptions (lazy-loaded; unset = billing in free/credit mode)
      - key: SUNO_API_KEY
        sync: false         # real music generation (unset = lyrics-only)
      - key: FAL_KEY
        sync: false         # fal.ai FLUX image engine for "Make a picture" (unset = falls back to HuggingFace/Pollinations)
      # ── Live signals feed (24/7 pollers: DexScreener / pump.fun / Gecko / Helius) ──
      # Set in the Render dashboard (Environment tab). The pollers are a no-op
      # until TELEGRAM_BOT_TOKEN is set. Helius adds the fresh-mint scan source.
      - key: TELEGRAM_BOT_TOKEN
        sync: false         # secret — bot token from @BotFather (same as local .env)
      - key: TELEGRAM_CHANNEL
        sync: false         # e.g. "@ShaddaiSignals" (bot must be admin) — public feed
      - key: HELIUS_API_KEY
        sync: false         # secret — Helius RPC key (mainnet.helius-rpc.com/?api-key=)
      - key: HELIUS_RPC_URL
        sync: false         # optional — full RPC url incl. api-key (overrides HELIUS_API_KEY)
      # ── Uptime Robot keep-alive (free) ────────────────────────────────────
      # Run `npm run uptime` once locally with UPTIME_ROBOT_API_KEY set to create
      # a 5-min monitor on /api/model/health. That external ping stops Render's
      # free tier from sleeping, so the signal pollers never pause.
      - key: RENDER_EXTERNAL_URL
        sync: false         # auto-set by Render — used by the built-in self-ping

  # NOTE: the old standalone "shaddai-clipper" (Docker/FFmpeg/Whisper) + its
  # static "shaddai-clipper-frontend" were removed 2026-09-11 -- superseded by
  # backend/clipper-engine, which runs as a local-only sidecar (spawned by
  # backend/clipper-engine-runner.js, embedded in the dashboard's Media Studio
  # overlay) rather than a separate deployed service. If either service is
  # still showing in the Render dashboard, delete it there too -- removing it
  # from this Blueprint does not tear down an already-live service.