<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ SHADDAI Colosseum — Master Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #06080b;
      color: #00ff9c;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .left-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(6, 8, 11, 0.95);
      border: 2px solid #00ff9c;
      padding: 20px;
      border-radius: 8px;
      max-width: 320px;
      z-index: 100;
      max-height: 80vh;
      overflow-y: auto;
    }
    .right-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(6, 8, 11, 0.95);
      border: 2px solid #00ff9c;
      padding: 20px;
      border-radius: 8px;
      max-width: 300px;
      z-index: 100;
      max-height: 80vh;
      overflow-y: auto;
    }
    h2 {
      font-size: 14px;
      margin-bottom: 12px;
      text-shadow: 0 0 20px #00ff9c;
      color: #00ff9c;
    }
    h3 {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin: 12px 0 8px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid #00ff9c;
    }
    button {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      background: rgba(0, 255, 156, 0.1);
      border: 1px solid #00ff9c;
      color: #00ff9c;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    button:hover {
      background: rgba(0, 255, 156, 0.2);
      box-shadow: 0 0 10px rgba(0, 255, 156, 0.2);
    }
    button.active {
      background: #00ff9c;
      color: #06080b;
      font-weight: bold;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .grid-2 button {
      margin-bottom: 0;
      padding: 6px;
      font-size: 9px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .grid-3 button {
      margin-bottom: 0;
      padding: 6px;
      font-size: 8px;
    }
    .stat {
      font-size: 10px;
      margin: 8px 0;
      padding: 8px;
      background: rgba(0, 255, 156, 0.05);
      border-left: 2px solid #00ff9c;
      border-radius: 4px;
    }
    .stat-label {
      color: #888;
      font-size: 9px;
    }
    .stat-value {
      color: #00ff9c;
      font-weight: bold;
      font-size: 11px;
    }
    .action-button {
      margin-top: 12px;
      padding: 10px !important;
      background: rgba(0, 255, 156, 0.15) !important;
      font-weight: bold;
    }
    .action-button:hover {
      background: rgba(0, 255, 156, 0.3) !important;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
      background: rgba(6, 8, 11, 0.98);
      padding: 40px;
      border: 2px solid #00ff9c;
      border-radius: 8px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid #00ff9c;
      border-top-color: #ffaa00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log {
      font-size: 9px;
      color: #888;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
    }
    .log-entry {
      margin: 3px 0;
      padding: 2px;
      border-left: 1px solid #00ff9c;
      padding-left: 6px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>⚔️ Loading SHADDAI Colosseum...</p>
    <p style="font-size: 11px; color: #888; margin-top: 20px;">Initializing game engine...</p>
  </div>

  <canvas id="canvas"></canvas>

  <div class="left-panel">
    <h2>⚔️ ARENA CONTROL</h2>

    <h3>Level</h3>
    <div class="grid-2">
      <button id="mainBtn" class="active">Main</button>
      <button id="basementBtn">Basement</button>
    </div>

    <h3>Terrain</h3>
    <div class="grid-3">
      <button class="terrain" data-t="grass">🟢 Grass</button>
      <button class="terrain" data-t="water">💧 Water</button>
      <button class="terrain" data-t="fire">🔥 Fire</button>
      <button class="terrain" data-t="ice">❄️ Ice</button>
      <button class="terrain" data-t="lava">🌋 Lava</button>
      <button class="terrain" data-t="crystal">💎 Crystal</button>
    </div>

    <h3>Game Mode</h3>
    <button class="mode" data-mode="arena">Arena Combat</button>
    <button class="mode" data-mode="koh">King of Hill</button>
    <button class="mode" data-mode="ctf">Capture Flag</button>
    <button class="mode" data-mode="parkour">Parkour</button>
    <button class="mode" data-mode="dodgeball">Dodgeball</button>
    <button class="mode" data-mode="lava">Lava Survival</button>

    <button class="action-button" id="launchBtn">⚡ LAUNCH ARENA</button>

    <div class="log">
      <div style="color: #00ff9c; margin-bottom: 6px;">📡 Arena Log</div>
      <div id="gameLog"></div>
    </div>
  </div>

  <div class="right-panel">
    <h2>⚔️ HERO SELECT</h2>

    <h3>Characters</h3>
    <div class="grid-2">
      <button class="hero" data-hero="oracle">Oracle</button>
      <button class="hero" data-hero="zerox">Zerox</button>
      <button class="hero" data-hero="nexus">Nexus</button>
      <button class="hero" data-hero="pikadon">Pikadon</button>
      <button class="hero" data-hero="turtle">Turtle</button>
      <button class="hero" data-hero="quill">Quill</button>
    </div>

    <div class="stat">
      <div class="stat-label">Selected Hero</div>
      <div class="stat-value" id="heroName">—</div>
    </div>

    <h3>Hero Stats</h3>
    <div class="stat">
      <div class="stat-label">Health</div>
      <div class="stat-value" id="heroHealth">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Attack</div>
      <div class="stat-value" id="heroAttack">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Speed</div>
      <div class="stat-value" id="heroSpeed">—</div>
    </div>

    <h3>Cosmetics</h3>
    <button id="skinBtn" class="active">Base Skin</button>

    <h3>Arena Status</h3>
    <div class="stat">
      <div class="stat-label">Level</div>
      <div class="stat-value" id="arenaLevel">Main Arena</div>
    </div>
    <div class="stat">
      <div class="stat-label">Terrain</div>
      <div class="stat-value" id="arenaTerrain">Grass</div>
    </div>
    <div class="stat">
      <div class="stat-label">Mode</div>
      <div class="stat-value" id="arenaMode">—</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let mainGroup, basementGroup, terrainMesh;
    let currentLevel = 'main', currentTerrain = 'grass', currentMode = 'arena';
    let selectedHero = 'oracle';
    let rotating = false;

    const TERRAINS = {
      grass: { color: 0x3a6b3a, emissive: 0x1a4a1a, name: 'Grass', friction: 1.0, jumpMult: 1.0 },
      water: { color: 0x001a4d, emissive: 0x000d2e, name: 'Water', friction: 0.5, jumpMult: 0.7 },
      fire: { color: 0x8b3a1a, emissive: 0xff4400, name: 'Fire', friction: 0.8, jumpMult: 1.2, damage: 5 },
      ice: { color: 0x1a3a4d, emissive: 0x4da6ff, name: 'Ice', friction: 0.3, jumpMult: 1.1 },
      lava: { color: 0x5a2a0a, emissive: 0xff6600, name: 'Lava', friction: 0.2, jumpMult: 0.5, damage: 20 },
      crystal: { color: 0x2a4a6a, emissive: 0x6699ff, name: 'Crystal', friction: 1.3, jumpMult: 1.3 }
    };

    const HEROES = {
      oracle: { health: 100, attack: 15, speed: 1.0, color: 0x6699ff },
      zerox: { health: 90, attack: 18, speed: 1.1, color: 0xffaa00 },
      nexus: { health: 110, attack: 14, speed: 0.9, color: 0x00ff9c },
      pikadon: { health: 95, attack: 20, speed: 0.95, color: 0xff3333 },
      turtle: { health: 105, attack: 12, speed: 1.05, color: 0x33ff99 },
      quill: { health: 85, attack: 16, speed: 1.15, color: 0xffdd00 }
    };

    const MODES = {
      arena: { name: 'Arena Combat', desc: 'Last hero standing' },
      koh: { name: 'King of Hill', desc: 'Control the center' },
      ctf: { name: 'Capture Flag', desc: 'Secure the objective' },
      parkour: { name: 'Parkour', desc: 'Navigate obstacles' },
      dodgeball: { name: 'Dodgeball', desc: 'Hit enemies with projectiles' },
      lava: { name: 'Lava Survival', desc: 'Avoid the floor' }
    };

    function log(msg) {
      const logDiv = document.getElementById('gameLog');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = msg;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      if (logDiv.children.length > 15) logDiv.removeChild(logDiv.firstChild);
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x001a33);
      scene.fog = new THREE.Fog(0x001a33, 400, 1200);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
      camera.position.set(0, 50, 120);

      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, precision: 'highp' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowShadowMap;

      controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotateSpeed = 2;
      controls.target.set(0, 0, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const sun = new THREE.DirectionalLight(0xffffff, 1.8);
      sun.position.set(150, 200, 150);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 8192;
      sun.shadow.mapSize.height = 8192;
      sun.shadow.camera.left = -400;
      sun.shadow.camera.right = 400;
      sun.shadow.camera.top = 400;
      sun.shadow.camera.bottom = -400;
      scene.add(sun);

      const skyLight = new THREE.HemisphereLight(0x6699ff, 0xff9900, 0.5);
      scene.add(skyLight);

      mainGroup = new THREE.Group();
      basementGroup = new THREE.Group();

      buildMainArena();
      buildBasement();
      createTerrainPlane();

      scene.add(mainGroup);
      scene.add(basementGroup);
      basementGroup.visible = false;

      // Event listeners
      document.getElementById('mainBtn').addEventListener('click', () => switchLevel('main'));
      document.getElementById('basementBtn').addEventListener('click', () => switchLevel('basement'));

      document.querySelectorAll('.terrain').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.terrain').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          switchTerrain(btn.dataset.t);
        });
      });

      document.querySelectorAll('.hero').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.hero').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectHero(btn.dataset.hero);
        });
      });

      document.querySelectorAll('.mode').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          document.getElementById('arenaMode').textContent = MODES[currentMode].name;
          log(`📌 ${MODES[currentMode].name}`);
        });
      });

      document.getElementById('launchBtn').addEventListener('click', launchArena);

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          rotating = !rotating;
          controls.autoRotate = rotating;
        }
      });

      // Select first hero
      selectHero('oracle');
      document.querySelector('[data-hero="oracle"]').classList.add('active');
      document.querySelector('[data-terrain="grass"]').classList.add('active');
      document.querySelector('[data-mode="arena"]').classList.add('active');

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      log('✅ Arena initialized');
      document.getElementById('loading').style.display = 'none';
    }

    function buildMainArena() {
      const loader = new THREE.GLTFLoader();
      loader.load('/fal-assets/world/assets/bld-mecha-arena/bld-mecha-arena-mesh.glb', (gltf) => {
        const model = gltf.scene;
        model.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              node.material.metalness = Math.max(0.1, node.material.metalness || 0.5);
              node.material.roughness = Math.max(0.3, node.material.roughness || 0.7);
            }
          }
        });
        mainGroup.add(model);
      });

      // Bleachers
      for (let i = 0; i < 6; i++) {
        const r = 100 + i * 18;
        const h = 8 + i * 8;
        const geo = new THREE.CylinderGeometry(r, r, 3, 96);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xe8c45c,
          metalness: 0.7,
          roughness: 0.2,
          emissive: 0xaa8800,
          emissiveIntensity: 0.3
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = h;
        mesh.receiveShadow = true;
        mainGroup.add(mesh);
      }

      // Columns
      for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const x = Math.cos(angle) * 110;
        const z = Math.sin(angle) * 110;
        const geo = new THREE.CylinderGeometry(5, 5, 80, 24);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xf5f5dc,
          metalness: 0.3,
          roughness: 0.4
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 40, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mainGroup.add(mesh);
      }

      // Orb
      const orbGeo = new THREE.SphereGeometry(20, 64, 64);
      const orbMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.95,
        roughness: 0.05,
        emissive: 0xffaa00,
        emissiveIntensity: 0.8
      });
      const orb = new THREE.Mesh(orbGeo, orbMat);
      orb.position.y = 70;
      orb.castShadow = true;
      mainGroup.add(orb);

      // Dome
      const domeGeo = new THREE.SphereGeometry(130, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
      const domeMat = new THREE.MeshStandardMaterial({
        color: 0xb8860b,
        roughness: 0.7,
        side: THREE.BackSide,
        emissive: 0x5a4a0a,
        emissiveIntensity: 0.2
      });
      const dome = new THREE.Mesh(domeGeo, domeMat);
      dome.position.y = 100;
      dome.receiveShadow = true;
      mainGroup.add(dome);
    }

    function buildBasement() {
      const floorGeo = new THREE.CylinderGeometry(180, 180, 3, 96);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x4a4a4a,
        roughness: 0.9,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -120;
      floor.receiveShadow = true;
      basementGroup.add(floor);

      for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const x = Math.cos(angle) * 185;
        const z = Math.sin(angle) * 185;
        const wallGeo = new THREE.BoxGeometry(30, 100, 5);
        const wallMat = new THREE.MeshStandardMaterial({
          color: 0x3a3a3a,
          roughness: 0.9
        });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(x, -70, z);
        wall.rotation.y = angle;
        wall.castShadow = true;
        basementGroup.add(wall);
      }

      for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        const radius = 100;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const pillarGeo = new THREE.CylinderGeometry(6, 6, 100, 16);
        const pillarMat = new THREE.MeshStandardMaterial({
          color: 0x5a5a5a,
          roughness: 0.8
        });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(x, -70, z);
        pillar.castShadow = true;
        basementGroup.add(pillar);
      }

      const chamberGeo = new THREE.CylinderGeometry(50, 50, 80, 64);
      const chamberMat = new THREE.MeshStandardMaterial({
        color: 0x2a5a7a,
        emissive: 0x004488,
        emissiveIntensity: 0.4,
        roughness: 0.6
      });
      const chamber = new THREE.Mesh(chamberGeo, chamberMat);
      chamber.position.y = -70;
      chamber.receiveShadow = true;
      basementGroup.add(chamber);
    }

    function createTerrainPlane() {
      const geo = new THREE.CylinderGeometry(140, 140, 1, 96);
      const mat = new THREE.MeshStandardMaterial({
        color: TERRAINS.grass.color,
        emissive: TERRAINS.grass.emissive,
        roughness: 0.8
      });
      terrainMesh = new THREE.Mesh(geo, mat);
      terrainMesh.position.y = 0.5;
      terrainMesh.receiveShadow = true;
      mainGroup.add(terrainMesh);
    }

    function switchLevel(level) {
      currentLevel = level;
      const isMain = level === 'main';
      mainGroup.visible = isMain;
      basementGroup.visible = !isMain;

      document.getElementById('mainBtn').classList.toggle('active', isMain);
      document.getElementById('basementBtn').classList.toggle('active', !isMain);
      document.getElementById('arenaLevel').textContent = isMain ? 'Main Arena' : 'Basement';

      controls.target.set(0, isMain ? 0 : -120, 0);
      log(`🏛️ ${isMain ? 'Main Arena' : 'Basement'} activated`);
    }

    function switchTerrain(t) {
      currentTerrain = t;
      const data = TERRAINS[t];
      terrainMesh.material.color.setHex(data.color);
      terrainMesh.material.emissive.setHex(data.emissive);
      document.getElementById('arenaTerrain').textContent = data.name;
      log(`🌍 Terrain: ${data.name}`);
    }

    function selectHero(hero) {
      selectedHero = hero;
      const stats = HEROES[hero];
      document.getElementById('heroName').textContent = hero.toUpperCase();
      document.getElementById('heroHealth').textContent = stats.health;
      document.getElementById('heroAttack').textContent = stats.attack;
      document.getElementById('heroSpeed').textContent = stats.speed.toFixed(2) + 'x';
      log(`👤 ${hero.toUpperCase()} selected`);
    }

    function launchArena() {
      log(`⚡ Launching ${MODES[currentMode].name}...`);
      log(`🎮 Arena: ${currentLevel.toUpperCase()}`);
      log(`🌍 Terrain: ${TERRAINS[currentTerrain].name}`);
      log(`👤 Hero: ${selectedHero.toUpperCase()}`);
      setTimeout(() => log(`✅ Match started!`), 500);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
