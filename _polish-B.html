<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADDAI · Wardrobe Prototypes</title>
<style>
  html,body{margin:0;background:#0d1017;color:#cfe3f2;font-family:'Segoe UI',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid #202838}
  h1{margin:0;font-size:16px}h1 b{color:#00ff88}
  .sub{color:#7d8ea3;font-size:12px;margin-top:3px}
  .wrap{padding:14px 22px}
  .stage{background:radial-gradient(120% 90% at 50% 10%,#1a212d,#0e131b 70%);border:1px solid #202838;border-radius:12px;padding:6px}
  canvas{display:block;width:100%;height:auto;border-radius:8px;image-rendering:pixelated}
</style></head><body>
<header><h1>SHADDAI · <b>Wardrobe Prototypes</b> — cleaned heads · clothing cosmetics</h1>
<div class="sub">Same modular rig, bigger. Face drawn last (clean). Prototyping: hoodie, suit, long-sleeve, tank, watch, shoe styles.</div></header>
<div class="wrap"><div class="stage"><canvas id="c"></canvas></div></div>
<script>
'use strict';
const TW=84, TH=42;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2);
const COLS=3, ROWS=3, CELLW=260, CELLH=280, SC=2.4;
let OX=0, OY=0;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function iso(col,row){return [OX+(col-row)*TW/2, OY+(col+row)*TH/2];}
function Pth(pts){ctx.beginPath();ctx.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));for(let i=1;i<pts.length;i++)ctx.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));ctx.closePath();}
function box(col,row,w,d,h,top,opts){opts=opts||{};const cx=OX+(col-row)*TW/2,cy=OY+(col+row)*TH/2;const dx=(dc,dr)=>(dc-dr)*TW/2,dy=(dc,dr)=>(dc+dr)*TH/2;const hw=w/2,hd=d/2;const back=[cx+dx(-hw,-hd),cy+dy(-hw,-hd)],right=[cx+dx(hw,-hd),cy+dy(hw,-hd)],front=[cx+dx(hw,hd),cy+dy(hw,hd)],left=[cx+dx(-hw,hd),cy+dy(-hw,hd)];const up=p=>[p[0],p[1]-h];const tB=up(back),tR=up(right),tF=up(front),tL=up(left);ctx.fillStyle=opts.left||shade(top,-0.17);Pth([left,front,tF,tL]);ctx.fill();ctx.fillStyle=opts.right||shade(top,-0.33);Pth([front,right,tR,tF]);ctx.fill();ctx.fillStyle=top;Pth([tB,tR,tF,tL]);ctx.fill();if(opts.edge){ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;ctx.lineJoin='round';Pth([tB,tR,right,front,left,tL]);ctx.stroke();}}
function boxL(col,row,w,d,h,color,lift,opts){const s=OY;OY-=lift;box(col,row,w,d,h,color,opts);OY=s;}
const E={edge:true};

// ---- shoe styles ----
function shoePart(c,r,style,color,L){
  if(style==='boot'){boxL(c,r+0.02,0.17,0.19,8,color,0+L,E);}
  else if(style==='dress'){boxL(c,r+0.05,0.15,0.22,3,color,0+L,E);}
  else if(style==='heel'){boxL(c,r+0.02,0.13,0.15,3,color,0+L,E);boxL(c,r+0.12,0.05,0.05,2,color,0+L);}
  else{ boxL(c,r+0.05,0.17,0.2,1.6,'#eef1f4',0+L); boxL(c,r+0.02,0.16,0.18,4,color,1.6+L,E); } // sneaker: white sole + upper
}
// ---- arm with sleeve length + watch ----
function armPart(c,r,sleeve,skinC,L,o){o=o||{};
  boxL(c,r,0.1,0.1,3,skinC,8+L,E);                                   // hand
  if(o.short){boxL(c,r,0.1,0.1,7,skinC,11+L,E);boxL(c,r,0.11,0.11,7,sleeve,18+L,E);} // forearm skin + short sleeve
  else boxL(c,r,0.1,0.1,13,sleeve,11+L,E);                           // long sleeve
  if(o.cuff && !o.short){                                            // ribbed cuff band at wrist
    boxL(c,r,0.115,0.115,2.5,shade(sleeve,-0.28),11+L,E);
    const[bx,by]=iso(c,r);ctx.fillStyle=shade(sleeve,-0.45);
    for(let i=-3;i<4;i+=2)ctx.fillRect(Math.round(bx)+i,Math.round(by)-(13+L),1,2);
  }
  if(o.watch){ctx.fillStyle=o.watch;const[wx,wy]=iso(c,r);ctx.fillRect(Math.round(wx)-3,Math.round(wy)-(11+L),6,2);ctx.fillStyle=shade(o.watch,0.4);ctx.fillRect(Math.round(wx)-1,Math.round(wy)-(11+L),2,2);}
}

function guy(rig,t,phase){
  const col=0,row=0, tt=t/1000+(phase||0), L=Math.sin(tt*1.7)*0.4;
  const skin=rig.skin||'#f0c199', shirt=rig.shirt||'#e0662e', pants=rig.pants||'#37414f';
  const shoe=rig.shoe||'#2a2a2a', hair=rig.hair||'#3a2a1a', cap=rig.cap;
  const top=rig.suit||rig.hoodie||rig.jacket||shirt;
  const sleeve=top;
  const [cx,cy]=iso(0,0);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(cx,cy+3,14,6,0,0,7);ctx.fill();
  // BACK arm
  armPart(col+0.18,row-0.18,sleeve,skin,L,{short:rig.short,watch:rig.watch,cuff:rig.jacket});
  // legs / dress
  if(rig.dress){shoePart(col-0.02,row+0.02,'heel',shoe,L);shoePart(col+0.02,row-0.02,'heel',shoe,L);boxL(col,row,0.5,0.4,13,rig.dress,3+L,E);boxL(col,row,0.36,0.26,12,rig.dress,16+L,E);}
  else{for(const g of [[-0.08,0.08],[0.08,-0.08]]){const c=col+g[0],r=row+g[1];shoePart(c,r,rig.shoeStyle,shoe,L);boxL(c,r,0.13,0.13,6,pants,4+L,E);}
    boxL(col,row,0.4,0.3,15,top,10+L,E);}
  // ---- clothing detail on the torso front ----
  const T=(o)=>cy-(10+o+L);
  const fxc=Math.round(cx);
  // ===== UNIVERSAL FABRIC SHADING (skip robot / dress handled elsewhere) =====
  // torso-front spans ~ x:[cx-9..cx+9], y:[T(15)..T(0.5)]
  if(!rig.robot && !rig.dress){
    const bodyTop=T(15), bodyBot=T(0.5), hL=Math.round(bodyTop), hH=Math.round(bodyBot)-Math.round(bodyTop);
    // lit-left vertical highlight strip
    ctx.fillStyle='rgba(255,255,255,0.13)';ctx.fillRect(fxc-9,hL+1,2,hH-1);
    // right/bottom shadow wrap
    ctx.fillStyle='rgba(0,0,0,0.16)';ctx.fillRect(fxc+7,hL+2,2,hH-2);
    ctx.fillStyle='rgba(0,0,0,0.20)';ctx.fillRect(fxc-9,Math.round(bodyBot)-1,18,2); // darker hem
    // fabric fold shadows (two soft vertical creases)
    ctx.fillStyle='rgba(0,0,0,0.10)';ctx.fillRect(fxc-2,hL+3,1,hH-5);ctx.fillRect(fxc+4,hL+4,1,hH-7);
  }
  // ===== HOODIE (down): rounded hood bunched behind neck + collar + strings + pocket =====
  if(rig.hoodie && !rig.hoodUp){
    const hc=rig.hoodie;
    boxL(col,row-0.14,0.46,0.22,12,shade(hc,-0.06),27+L,E);               // hood roll rising behind head
    boxL(col,row-0.20,0.30,0.10,7,shade(hc,0.10),33+L,E);                 // lit top of hood roll
    boxL(col,row-0.07,0.36,0.13,5,shade(hc,-0.24),28+L,E);               // hood inner cavity shadow
    // bunched collar band across the front of the neck
    ctx.fillStyle=shade(hc,-0.22);ctx.fillRect(fxc-7,T(15),14,3);
    ctx.fillStyle=shade(hc,0.10);ctx.fillRect(fxc-7,T(15)-1,14,1);        // lit top edge of collar
    ctx.fillStyle=shade(hc,-0.34);ctx.fillRect(fxc-7,T(13),14,1);         // collar under-shadow
    // drawstrings (short, close to collar; dark cores + light front)
    ctx.fillStyle=shade(hc,-0.4);ctx.fillRect(fxc-2,T(13),1,5);ctx.fillRect(fxc+2,T(13),1,5);
    ctx.fillStyle='#eef1f4';ctx.fillRect(fxc-2,T(13),1,4);ctx.fillRect(fxc+2,T(13),1,4);
    ctx.fillStyle='#c9ccd0';ctx.fillRect(fxc-2,T(9),1,1);ctx.fillRect(fxc+2,T(9),1,1); // aglet tips
    // kangaroo pocket + seam
    ctx.fillStyle=shade(hc,-0.14);ctx.fillRect(fxc-6,T(4),12,3);
    ctx.fillStyle=shade(hc,-0.28);ctx.fillRect(fxc-6,T(4),12,1);
  }
  // ===== BOMBER JACKET: ribbed hem/collar + zip + stripe =====
  if(rig.jacket){
    const jc=rig.jacket;
    // ribbed collar
    ctx.fillStyle=shade(jc,-0.2);ctx.fillRect(fxc-6,T(15),12,2);
    ctx.fillStyle=shade(jc,0.08);ctx.fillRect(fxc-6,T(15)-1,12,1);
    // center zip
    ctx.fillStyle=shade(jc,-0.4);ctx.fillRect(fxc,T(14),1,12);
    ctx.fillStyle='#c9ccd0';ctx.fillRect(fxc,T(9),1,1);
    // chest stripe (white accent)
    ctx.fillStyle='#eef1f4';ctx.fillRect(fxc-6,T(9),12,1);
    // ribbed hem (banded waist)
    ctx.fillStyle=shade(jc,-0.26);ctx.fillRect(fxc-8,T(1),16,3);
    for(let i=-7;i<8;i+=2){ctx.fillStyle=shade(jc,-0.4);ctx.fillRect(fxc+i,T(1),1,3);}
  }
  // ===== SUIT: lapels + white shirt triangle + buttons =====
  if(rig.suit){
    const sc=rig.suit;
    // white shirt triangle behind lapels
    ctx.fillStyle='#eef1f4';Pth([[fxc-4,T(15)],[fxc+4,T(15)],[fxc,T(6)]]);ctx.fill();
    ctx.fillStyle='#d5dae0';Pth([[fxc+1,T(15)],[fxc+4,T(15)],[fxc,T(6)]]);ctx.fill(); // shirt shadow side
    // lapels V (over the shirt edges)
    ctx.fillStyle=shade(sc,-0.24);
    Pth([[fxc-6,T(15)],[fxc-1,T(6)],[fxc-3,T(15)]]);ctx.fill();
    Pth([[fxc+6,T(15)],[fxc+1,T(6)],[fxc+3,T(15)]]);ctx.fill();
    ctx.fillStyle=shade(sc,0.14); // lapel highlight edge
    Pth([[fxc-6,T(15)],[fxc-5,T(15)],[fxc-1,T(6)]]);ctx.fill();
    // buttons down the front
    ctx.fillStyle=shade(sc,-0.5);ctx.fillRect(fxc-1,T(5),2,1);ctx.fillRect(fxc-1,T(2),2,1);
  }
  // ===== TIE =====
  if(rig.tie){
    ctx.fillStyle=shade(rig.tie,-0.1);
    Pth([[fxc-2,T(13)],[fxc+2,T(13)],[fxc+2,T(9)],[fxc+3,T(2)],[fxc-3,T(2)],[fxc-2,T(9)]]);ctx.fill();
    ctx.fillStyle=rig.tie;ctx.fillRect(fxc-2,T(12),3,6);                  // lit front of tie
    ctx.fillStyle=shade(rig.tie,-0.35);ctx.fillRect(fxc-2,T(14),4,2);     // knot shadow
    ctx.fillStyle=shade(rig.tie,0.25);ctx.fillRect(fxc-1,T(13),1,1);      // knot highlight
  }
  else if(!rig.suit && !rig.jacket && !rig.hoodie && !rig.short && !rig.robot){
    ctx.fillStyle=shade(top,0.18);ctx.fillRect(fxc-5,T(14),10,2);         // crew collar (sweater/tee)
    ctx.fillStyle=shade(top,-0.22);ctx.fillRect(fxc-5,T(13),10,1);
  }
  // ===== TANK TOP: shoulder straps + deep neckline (skin/chest showing) =====
  if(rig.short && !rig.jacket){
    // exposed chest — wide skin panel below the neck (sleeveless), deep scoop
    ctx.fillStyle=skin;Pth([[fxc-5,T(15)],[fxc+5,T(15)],[fxc+2,T(8)],[fxc-2,T(8)]]);ctx.fill();
    ctx.fillStyle=shade(skin,-0.18);Pth([[fxc+1,T(15)],[fxc+5,T(15)],[fxc+2,T(8)]]);ctx.fill(); // shaded right of chest
    ctx.fillStyle=shade(skin,0.14);ctx.fillRect(fxc-4,T(14),1,5); // lit chest edge (pec highlight)
    ctx.fillStyle=shade(skin,-0.22);ctx.fillRect(fxc-2,T(11),4,1); // sternum shadow
    // straps (bold, over the shoulders, framing the skin)
    ctx.fillStyle=shade(top,-0.24);ctx.fillRect(fxc-7,T(15),2,6);ctx.fillRect(fxc+5,T(15),2,6);
    ctx.fillStyle=shade(top,0.18);ctx.fillRect(fxc-7,T(15),1,6);ctx.fillRect(fxc+5,T(15),1,6);
    // armhole shadow where strap meets skin
    ctx.fillStyle=shade(skin,-0.28);ctx.fillRect(fxc-5,T(13),1,3);ctx.fillRect(fxc+4,T(13),1,3);
  }
  // ===== NIKE SWOOSH (clean white check, lower-right chest, clear of strings) =====
  if(rig.logo){
    // swoosh sits on the left chest, below the collar, as a bold check
    const sx=fxc-6, sy=T(5.5);
    ctx.strokeStyle=shade(rig.logo,-0.6);ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,sy+1);ctx.lineTo(sx+2,sy+2.5);ctx.lineTo(sx+8,sy-2);ctx.stroke(); // dark backing
    ctx.strokeStyle=rig.logo;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(sx,sy+1);ctx.lineTo(sx+2,sy+2.5);ctx.lineTo(sx+8,sy-2);ctx.stroke();
  }
  if(rig.emblem){ctx.fillStyle=rig.emblem;ctx.fillRect(fxc-3,T(8),6,6);}
  // ===== ROBOT: panel lines + chest light =====
  if(rig.robot){
    const mc=rig.skin;
    // vertical + horizontal panel seams
    ctx.fillStyle=shade(mc,-0.34);ctx.fillRect(fxc-8,T(8),16,1);ctx.fillRect(fxc,T(15),1,14);
    ctx.fillStyle=shade(mc,0.28);ctx.fillRect(fxc-8,T(15),16,1);   // top rim highlight
    ctx.fillStyle=shade(mc,-0.34);ctx.fillRect(fxc-8,T(15),1,15);ctx.fillRect(fxc+7,T(15),1,15); // side seams
    // glowing chest light (mid-chest, compact)
    const led=rig.led||'#5fe0ff';
    ctx.fillStyle='rgba(95,224,255,0.25)';ctx.fillRect(fxc-3,T(9),6,5); // tight glow halo
    ctx.fillStyle=shade(led,-0.5);ctx.fillRect(fxc-2,T(8),4,4);          // bezel
    ctx.fillStyle=led;ctx.fillRect(fxc-2,T(8),3,3);                       // core
    ctx.fillStyle='#ffffff';ctx.fillRect(fxc-2,T(8),1,1);                // glint
  }
  // FRONT arm
  armPart(col-0.18,row+0.18,sleeve,skin,L,{short:rig.short,watch:rig.watch2,cuff:rig.jacket});
  // ==== HEAD (variant C: MAX POLISH) ====
  boxL(col,row,0.44,0.35,15,skin,25+L,E);
  if(!rig.robot&&rig.ears!==false){const earC=shade(skin,-0.08);
    boxL(col-0.185,row,0.05,0.08,4.5,earC,28.5+L,E);boxL(col+0.185,row,0.05,0.08,4.5,earC,28.5+L,E);
    const[ex,ey0]=iso(0,0);ctx.fillStyle=shade(skin,-0.28);
    ctx.fillRect(Math.round(ex)-14,Math.round(ey0)-(31+L),1,2);ctx.fillRect(Math.round(ex)+13,Math.round(ey0)-(31+L),1,2);
  }
  // hair / cap  (hood-up replaces hair)
  if(rig.robot){boxL(col,row,0.48,0.38,5,rig.cap||'#9aa4ad',39+L,E);boxL(col,row,0.04,0.04,6,'#9aa4ad',44+L,E);ctx.fillStyle=rig.led||'#ff5a4d';const[ax,ay]=iso(0,0);ctx.beginPath();ctx.arc(ax,ay-(50+L),2.5,0,7);ctx.fill();}
  else if(rig.hoodUp){const hc=rig.hoodie||'#555';
    boxL(col,row-0.05,0.6,0.52,20,hc,24+L,E);            // hood shell over the whole head
    boxL(col,row+0.17,0.32,0.05,13,skin,24.5+L,E);       // face opening — skin comes forward (pulled in)
    boxL(col,row-0.03,0.5,0.16,7,hc,44+L,E);             // hood crown/peak
    const[hx,hy]=iso(0,0);
    // recessed opening rim (darker inside the hood, top + sides)
    ctx.fillStyle=shade(hc,-0.34);ctx.fillRect(Math.round(hx)-8,Math.round(hy)-(41+L),16,2);
    ctx.fillStyle=shade(hc,-0.22);ctx.fillRect(Math.round(hx)-9,Math.round(hy)-(40+L),2,10);ctx.fillRect(Math.round(hx)+7,Math.round(hy)-(40+L),2,10);
    ctx.fillStyle=shade(hc,0.12);ctx.fillRect(Math.round(hx)-8,Math.round(hy)-(42+L),16,1); // lit brow of hood
    // drawstrings hanging below the opening onto the chest
    const dy=Math.round(cy-(10+L));
    ctx.fillStyle=shade(hc,-0.4);ctx.fillRect(Math.round(hx)-3,dy-5,1,6);ctx.fillRect(Math.round(hx)+2,dy-5,1,6);
    ctx.fillStyle='#e6e0f0';ctx.fillRect(Math.round(hx)-3,dy-5,1,5);ctx.fillRect(Math.round(hx)+2,dy-5,1,5);
  }
  else if(cap){boxL(col,row,0.5,0.4,6,cap,40+L,E);boxL(col,row+0.15,0.42,0.07,3,hair,38.5+L,E);boxL(col-0.12,row,0.05,0.14,4.5,hair,31.5+L,E);boxL(col+0.12,row,0.05,0.14,4.5,hair,31.5+L,E);
    boxL(col,row+0.15,0.42,0.02,1,shade(cap,0.18),40+L);}
  else if(rig.mohawk){boxL(col,row,0.1,0.34,12,hair,39+L,E);boxL(col-0.1,row,0.05,0.15,4,hair,32+L,E);boxL(col+0.1,row,0.05,0.15,4,hair,32+L,E);}
  else{
    // hair: wraparound MASS (silhouette first) — main + rounded crown + fuller sides + high thin fringe
    boxL(col,row,0.46,0.37,6,hair,39.5+L,E);                                 // main hair
    boxL(col,row,0.32,0.25,3,hair,45+L,E);                                   // rounded crown (softens top corners)
    boxL(col-0.13,row,0.085,0.27,10,hair,30+L,E);boxL(col+0.13,row,0.085,0.27,10,hair,30+L,E); // fuller side wrap
    boxL(col,row+0.16,0.42,0.07,3.5,hair,38+L,E);                            // high thin fringe (leaves forehead)
    const[hx,hy]=iso(0,0);ctx.fillStyle=shade(hair,0.18);ctx.fillRect(Math.round(hx)-6,Math.round(hy)-(44+L),5,1); // single crown sheen
  }
  if(rig.beard&&!rig.hoodUp)boxL(col,row+0.13,0.4,0.09,6,rig.beardCol||shade(hair,0.05),25+L,E);
  // ---- FACE LAST (always clean, on top) ----
  const fx=Math.round(cx);
  const ey=Math.round(cy-(25+L)-5);   // eyes a touch lower → more forehead
  if(rig.robot){ctx.fillStyle=rig.led||'#5fe0ff';ctx.fillRect(fx-6,ey,4,4);ctx.fillRect(fx+3,ey,4,4);}
  else{
    // subtle face shading so the panel isn't flat
    ctx.fillStyle=shade(skin,0.14);ctx.fillRect(fx-8,ey+3,3,3);          // cheek highlight (lit-left)
    ctx.fillStyle=shade(skin,-0.16);ctx.fillRect(fx+1,ey+7,6,2);ctx.fillRect(fx+4,ey+3,2,3); // jaw/chin shadow
    ctx.fillStyle=shade(skin,0.05);ctx.fillRect(fx-1,ey-1,2,6);          // soften center seam
    // eyebrows — defined, angled slightly, forehead gap above the eyes
    ctx.fillStyle=shade(hair,-0.1);
    ctx.fillRect(fx-6,ey-4,4,1);ctx.fillRect(fx-6,ey-3,1,1);   // left brow (down-inner)
    ctx.fillRect(fx+3,ey-4,4,1);ctx.fillRect(fx+6,ey-3,1,1);   // right brow
    // eyes: rounder whites, centered pupil, top-lid shadow, corner shadow, glint
    const eyeW=shade(skin,0.66),pupil=rig.eye||'#1a1208';
    // left eye
    ctx.fillStyle=eyeW;ctx.fillRect(fx-7,ey,4,4);
    ctx.fillStyle=shade(eyeW,-0.28);ctx.fillRect(fx-7,ey,4,1);        // upper-lid shadow
    ctx.fillStyle=pupil;ctx.fillRect(fx-6,ey+1,2,3);                  // iris/pupil (centered)
    ctx.fillStyle='#ffffff';ctx.fillRect(fx-6,ey+1,1,1);             // glint
    // right eye
    ctx.fillStyle=eyeW;ctx.fillRect(fx+3,ey,4,4);
    ctx.fillStyle=shade(eyeW,-0.28);ctx.fillRect(fx+3,ey,4,1);
    ctx.fillStyle=pupil;ctx.fillRect(fx+4,ey+1,2,3);
    ctx.fillStyle='#ffffff';ctx.fillRect(fx+4,ey+1,1,1);
    // nose (small, defined)
    ctx.fillStyle=shade(skin,-0.22);ctx.fillRect(fx,ey+4,1,2);
    ctx.fillStyle=shade(skin,0.14);ctx.fillRect(fx-1,ey+4,1,2);
    // mouth (neutral / slight smile)
    ctx.fillStyle=shade(skin,-0.40);
    if(rig.frown){ctx.fillRect(fx-2,ey+8,4,1);}
    else{ctx.fillRect(fx-2,ey+8,4,1);ctx.fillRect(fx-3,ey+7,1,1);ctx.fillRect(fx+2,ey+7,1,1);}
    ctx.fillStyle=shade(skin,0.08);ctx.fillRect(fx-1,ey+9,3,1);
    // cheek blush (cute factor)
    if(rig.blush!==false){ctx.fillStyle='rgba(232,120,130,0.18)';ctx.fillRect(fx-7,ey+5,2,2);ctx.fillRect(fx+5,ey+5,2,2);}
    // glasses
    if(rig.glasses){ctx.strokeStyle='#0e1116';ctx.lineWidth=1.4;ctx.lineJoin='round';
      ctx.strokeRect(fx-6,ey-1,5,5);ctx.strokeRect(fx+1,ey-1,5,5);
      ctx.beginPath();ctx.moveTo(fx-1,ey+1);ctx.lineTo(fx+1,ey+1);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.moveTo(fx-5,ey+3);ctx.lineTo(fx-4,ey);ctx.stroke();
    }
  }
}

function resize(){const W=Math.min(document.querySelector('.stage').clientWidth-12,1000);canvas.style.width=W+'px';canvas.style.height=W*(ROWS*CELLH)/(COLS*CELLW)+'px';canvas.width=COLS*CELLW*DPR;canvas.height=ROWS*CELLH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;}
function frame(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,COLS*CELLW,ROWS*CELLH);
  for(let i=0;i<CAST.length;i++){
    const r=(i/COLS)|0,c=i%COLS, cxc=c*CELLW+CELLW/2, cyc=r*CELLH+CELLH-70;
    ctx.setTransform(DPR*SC,0,0,DPR*SC,cxc*DPR,cyc*DPR);OX=0;OY=0;ctx.imageSmoothingEnabled=false;
    guy(CAST[i][1],t,i*0.5);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#aebccb';ctx.font='13px Segoe UI';ctx.textAlign='center';ctx.fillText(CAST[i][0],cxc,r*CELLH+CELLH-24);
  }
  requestAnimationFrame(frame);
}
