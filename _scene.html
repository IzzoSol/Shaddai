<!doctype html><html><head><meta charset="utf-8"><title>SHADDAI · first scene</title>
<style>
  body{margin:0;background:#0d1017;color:#cfe3f2;font-family:'Segoe UI',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid #202838}
  h1{margin:0;font-size:16px}h1 b{color:#00ff88}
  .sub{color:#7d8ea3;font-size:12px;margin-top:3px}
  .wrap{padding:16px 22px}
  canvas{width:100%;max-width:1000px;height:auto;border-radius:12px;border:1px solid #202838;image-rendering:pixelated;box-shadow:0 20px 60px rgba(0,0,0,.45)}
</style></head><body>
<header><h1>SHADDAI · <b>first assembled scene</b> — 0 tokens</h1>
<div class="sub">Every piece is an AI-generated sprite we already made — backgrounds stripped in code and composited into one world.</div></header>
<div class="wrap"><canvas id="c" width="1000" height="620"></canvas></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height;

function load(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }

// edge flood-fill background removal: transparent-out the bg color connected to the border
function cutout(img, tol=48){
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  const id=g.getImageData(0,0,c.width,c.height), d=id.data, w=c.width, h=c.height;
  const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2]];});
  const bg=[0,1,2].map(k=>Math.round(corners.reduce((s,c)=>s+c[k],0)/4));
  const near=(i)=>Math.abs(d[i]-bg[0])<tol&&Math.abs(d[i+1]-bg[1])<tol&&Math.abs(d[i+2]-bg[2])<tol;
  const stack=[], seen=new Uint8Array(w*h);
  for(let x=0;x<w;x++){stack.push(x, x+(h-1)*w);} for(let y=0;y<h;y++){stack.push(y*w, w-1+y*w);}
  while(stack.length){const p=stack.pop(); if(seen[p])continue; seen[p]=1; const i=p*4; if(!near(i))continue; d[i+3]=0;
    const x=p%w, y=(p/w)|0;
    if(x>0)stack.push(p-1); if(x<w-1)stack.push(p+1); if(y>0)stack.push(p-w); if(y<h-1)stack.push(p+w);
  }
  g.putImageData(id,0,0); return c;
}

(async ()=>{
  const grass = await load('_world_grass.png');
  const names = ['_world_house','_world_tree','_world_lamp','_world_car','_sprite_char1','_sprite_char2','_sprite_char3','_sprite_char4'];
  const imgs = {}; for(const n of names){ const im=await load(n+'.png'); imgs[n]= im?cutout(im):null; }

  // ground: tile grass
  if(grass){ const p=ctx.createPattern(grass,'repeat'); ctx.fillStyle=p; ctx.fillRect(0,0,W,H); }
  else { ctx.fillStyle='#3fbf5a'; ctx.fillRect(0,0,W,H); }

  // a simple road band for the car
  ctx.fillStyle='#59606b'; ctx.fillRect(0,470,W,90);
  ctx.strokeStyle='#e8d24a'; ctx.lineWidth=3; ctx.setLineDash([26,22]);
  ctx.beginPath(); ctx.moveTo(0,515); ctx.lineTo(W,515); ctx.stroke(); ctx.setLineDash([]);

  // place sprites: {img, x(center), y(bottom), drawH}
  const place = [
    ['_world_house', 235, 430, 250],
    ['_world_tree',  430, 435, 190],
    ['_world_lamp',  540, 445, 165],
    ['_sprite_char3',360, 470, 140],
    ['_sprite_char4',620, 468, 150],
    ['_sprite_char1',700, 470, 150],
    ['_world_car',   470, 560, 150],
    ['_sprite_char2',815, 560, 150],
  ];
  place.sort((a,b)=>a[2]-b[2]); // painter's order by bottom-y
  for(const [n,x,y,dh] of place){ const im=imgs[n]; if(!im)continue;
    const s=dh/im.height, dw=im.width*s;
    // soft contact shadow
    ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x,y-4,dw*0.32,dh*0.06,0,0,7); ctx.fill();
    ctx.drawImage(im, x-dw/2, y-dh, dw, dh);
  }
})();
</script></body></html>
