<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHADDAI World — Vehicles Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; }
  #hud {
    position: fixed; top: 10px; left: 12px; z-index: 10;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #27e0ff; text-shadow: 0 0 6px #27e0ff88; pointer-events: none;
  }
  #hud b { color: #ffcf4a; }
</style>
</head>
<body>
<div id="hud">
  <div><b>SHADDAI Vehicles</b> — procedural test scene</div>
  <div>drag = orbit · scroll = zoom · cars / ship / plane / drone</div>
  <div id="fps"></div>
</div>

<!-- world layout (classic script, must load before the module call) -->
<script src="/world-layout.js"></script>
<!-- procedural vehicles module (classic script) -->
<script src="/world-vehicles.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.FogExp2(0x02040a, 0.0011);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(80, 70, 140);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// lights
scene.add(new THREE.HemisphereLight(0x88bbff, 0x0a0a12, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(120, 200, 80);
scene.add(sun);

// reference ground grid
const grid = new THREE.GridHelper(760, 76, 0x27e0ff, 0x103040);
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);
scene.add(new THREE.AxesHelper(20));

// build vehicles
const v = window.buildWorldVehicles(THREE, scene, window.WORLD_LAYOUT);

// animation loop with real clock delta
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps');
let acc = 0, frames = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  v.update(dt, t);
  controls.update();
  renderer.render(scene, camera);

  acc += dt; frames++;
  if (acc >= 0.5) { fpsEl.textContent = 'fps: ' + Math.round(frames / acc); acc = 0; frames = 0; }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
