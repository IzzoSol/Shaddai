<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHADDAI JAM // NEON HOOPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00ff88; --cyan:#00f0ff; --red:#ff1a1a; --mag:#ff2bd6; --gold:#ffd23b; --orange:#ff6a1a;
    --bg:#000; --dim:#0a0f0d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:#cfe;cursor:default;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
       touch-action:none;}
  #wrap{position:fixed;inset:0;background:#000;}
  canvas{position:absolute;inset:0;display:block;image-rendering:auto;touch-action:none;}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:39;
    box-shadow:inset 0 0 180px rgba(0,240,255,0.05), inset 0 0 60px rgba(0,0,0,0.7);}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;gap:12px;
    padding:8px clamp(10px,2vw,18px);
    background:linear-gradient(180deg,rgba(0,0,0,0.78),rgba(0,0,0,0));
    pointer-events:none;}
  #topbar .navbtns{display:flex;gap:8px;align-items:center;flex:none;pointer-events:none;}
  #back,#codex{pointer-events:auto;flex:none;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(11px,1.5vw,14px);letter-spacing:1px;
    color:var(--cyan);background:rgba(0,14,18,0.6);border:1px solid var(--cyan);
    padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
    text-shadow:0 0 8px var(--cyan);box-shadow:0 0 14px rgba(0,240,255,0.28);
    transition:all .15s;}
  #back:hover{background:var(--cyan);color:#000;box-shadow:0 0 22px var(--cyan);}
  #codex{color:var(--mag);border-color:var(--mag);text-shadow:0 0 8px var(--mag);box-shadow:0 0 14px rgba(255,43,214,0.28);}
  #codex:hover{background:var(--mag);color:#000;box-shadow:0 0 22px var(--mag);}
  #topbar .ttl{flex:1;min-width:0;text-align:center;
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(13px,2.4vw,22px);letter-spacing:2px;
    color:var(--gold);text-shadow:0 0 12px var(--gold);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar .spacer{flex:none;width:clamp(58px,9vw,90px);}
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:35;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:6px 14px;padding:8px clamp(10px,3vw,24px);
    background:linear-gradient(0deg,rgba(0,0,0,0.72),rgba(0,0,0,0));
    font-size:clamp(9px,1.4vw,12px);letter-spacing:1px;color:#8ff;opacity:.92;
    pointer-events:none;text-shadow:0 0 6px rgba(0,240,255,.5);}
  #hint span{white-space:nowrap;}
  #hint b{color:var(--gold);}
  @media (max-width:640px){#hint{gap:4px 9px;}}
  /* Mobile touch controls (shown only during live play on touch devices) */
  #touch{position:fixed;inset:0;z-index:45;pointer-events:none;display:none;}
  #stick{position:absolute;left:20px;bottom:26px;width:132px;height:132px;border-radius:50%;
    border:2px solid rgba(0,240,255,.4);background:rgba(0,20,26,.32);pointer-events:auto;touch-action:none;}
  #stick .nub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#00f0ff,#0088aa);box-shadow:0 0 16px #00f0ff;}
  #btns{position:absolute;right:16px;bottom:26px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;}
  #btns .row{display:flex;gap:12px;}
  .tbtn{pointer-events:auto;touch-action:none;width:74px;height:74px;border-radius:50%;
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:12px;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;
    border:2px solid;background:rgba(0,0,0,.4);}
  .tbtn.shoot{color:var(--gold);border-color:var(--gold);text-shadow:0 0 8px var(--gold);box-shadow:0 0 16px rgba(255,210,59,.35);}
  .tbtn.pass{color:var(--cyan);border-color:var(--cyan);text-shadow:0 0 8px var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.3);}
  .tbtn.turbo{width:64px;height:64px;color:var(--green);border-color:var(--green);text-shadow:0 0 8px var(--green);box-shadow:0 0 16px rgba(0,255,136,.3);}
  .tbtn.shove{width:60px;height:60px;color:var(--orange);border-color:var(--orange);text-shadow:0 0 8px var(--orange);box-shadow:0 0 16px rgba(255,106,26,.3);}
  .tbtn.cap{width:64px;height:64px;color:var(--gold);border-color:var(--gold);text-shadow:0 0 8px var(--gold);box-shadow:0 0 16px rgba(255,210,59,.3);}
  .tbtn.view{position:absolute;left:20px;top:96px;width:52px;height:52px;font-size:10px;color:var(--mag);border-color:var(--mag);
    text-shadow:0 0 8px var(--mag);box-shadow:0 0 14px rgba(255,43,214,.3);pointer-events:auto;}
  .tbtn:active{filter:brightness(1.5);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="vig"></div>
<div id="crt"></div>
<div id="topbar">
  <button id="back">◀ ARCADE MENU</button>
  <div class="ttl">SHADDAI JAM</div>
  <div class="navbtns">
    <button id="codex" title="Back to Codex">⌂ CODEX</button>
  </div>
</div>
<div id="hint">
  <span><b>WASD / ARROWS</b> move</span>
  <span><b>SPACE</b> shoot (hold=aim) / on D: block-steal</span>
  <span><b>E / SHIFT</b> pass · alley-oop</span>
  <span><b>Z</b> turbo</span>
  <span><b>F</b> shove</span>
  <span><b>Q</b> GAMEBREAKER</span>
  <span><b>V</b> camera</span>
  <span><b>R</b> restart</span>
  <span><b>ESC</b> exit</span>
</div>
<div id="touch">
  <div id="stick"><div class="nub"></div></div>
  <button class="tbtn view" id="tView">CAM (V)</button>
  <div id="btns">
    <div class="row"><button class="tbtn cap" id="tCap">GAME
BREAK</button><button class="tbtn turbo" id="tTurbo">TURBO</button></div>
    <div class="row"><button class="tbtn shove" id="tShove">SHOVE</button><button class="tbtn pass" id="tPass">PASS</button><button class="tbtn shoot" id="tShoot">SHOOT</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ EXIT (contract preserved) ============================ */
function doExit(){
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'exitGame'}, '*'); } }catch(e){}
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'shaddai-close-panel'}, '*'); } }catch(e){}
  try{ if(window.parent && window.parent!==window && window.parent.closeGame){ window.parent.closeGame(); return; } }catch(e){}
  try{ window.close(); }catch(e){}
  if(history.length>1){ history.back(); } else { location.href="/"; }
}
document.getElementById('back').addEventListener('click', doExit);
document.getElementById('codex').addEventListener('click', function(){
  try{ (window.top||window).location.href='/codex.html'; }catch(e){ location.href='/codex.html'; }
});

/* ============================ CANVAS ============================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeView();
}
window.addEventListener('resize', resize);

/* ============================ AUDIO ============================ */
var AC=null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol,when){
  var a=audio(); if(!a) return;
  when = when||0; dur=dur||0.12; type=type||'square'; vol=(vol==null?0.18:vol);
  var t=a.currentTime+when;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol){
  var a=audio(); if(!a) return;
  var n=Math.floor((a.sampleRate)*dur);
  var buf=a.createBuffer(1,n,a.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  var s=a.createBufferSource(); s.buffer=buf;
  var g=a.createGain(); g.gain.value=vol||0.15;
  var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=600;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sndDribble(){ beep(180,0.05,'sine',0.05,0); }
function sndShoot(){ beep(520,0.10,'sine',0.08,0); beep(760,0.08,'sine',0.06,0.05); }
function sndSwish(){ beep(1200,0.06,'sine',0.10,0); noiseBurst(0.14,0.05); beep(900,0.10,'sine',0.08,0.05); }
function sndScore(){ var s=[660,880,1046]; for(var i=0;i<s.length;i++) beep(s[i],0.10,'square',0.12,i*0.06); }
function sndThree(){ var s=[660,880,1046,1318]; for(var i=0;i<s.length;i++) beep(s[i],0.11,'square',0.13,i*0.06); }
function sndDunk(){ beep(120,0.20,'square',0.18,0); beep(80,0.26,'sawtooth',0.16,0.06); noiseBurst(0.24,0.16); beep(220,0.12,'sawtooth',0.12,0.02); }
function sndMiss(){ beep(200,0.10,'square',0.10,0); noiseBurst(0.10,0.08); }
function sndSteal(){ beep(900,0.06,'square',0.12,0); beep(1300,0.08,'square',0.10,0.05); }
function sndBlock(){ beep(140,0.14,'square',0.18,0); noiseBurst(0.12,0.14); }
function sndPass(){ beep(420,0.05,'triangle',0.07,0); }
function sndShove(){ beep(150,0.09,'sawtooth',0.14,0); noiseBurst(0.08,0.10); }
function sndTurbo(){ beep(300,0.05,'sawtooth',0.05,0); }
function sndFire(){ beep(660,0.10,'square',0.14,0); beep(990,0.14,'square',0.14,0.08); beep(1320,0.16,'sine',0.12,0.16); }
function sndBuzzer(){ beep(220,0.5,'square',0.2,0); beep(180,0.6,'square',0.18,0.1); }
function sndWin(){ var s=[523,659,784,1046,1318]; for(var i=0;i<s.length;i++) beep(s[i],0.16,'square',0.15,i*0.11); beep(1046,0.5,'sawtooth',0.10,s.length*0.11); }
function sndLose(){ beep(300,0.2,'sawtooth',0.15,0); beep(220,0.24,'sawtooth',0.14,0.16); beep(140,0.4,'square',0.13,0.34); }
function sndSelect(){ beep(760,0.06,'square',0.10,0); beep(1140,0.06,'square',0.08,0.04); }
function sndMove(){ beep(520,0.04,'square',0.05,0); }
function sndBreak(){ beep(160,0.14,'sawtooth',0.16,0); beep(240,0.16,'square',0.14,0.06); beep(520,0.2,'sine',0.14,0.14); noiseBurst(0.3,0.14); }

/* ============================ AGENT ROSTER ============================ */
// stats 1..5: spd=speed, sht=shooting, dnk=power/dunk, def=defense
var AGENTS=[
  {key:'SHADDAI', color:'#ffcf1a', tag:'Supreme',  stats:{spd:3,sht:4,dnk:5,def:4}},
  {key:'NEXUS',   color:'#00f0ff', tag:'Architect',stats:{spd:4,sht:4,dnk:3,def:3}},
  {key:'ORACLE',  color:'#b06bff', tag:'Intel',    stats:{spd:3,sht:5,dnk:2,def:4}},
  {key:'ZEROX',   color:'#ff9d3d', tag:'Wealth',   stats:{spd:3,sht:3,dnk:5,def:3}},
  {key:'TURTLE',  color:'#ff2bd6', tag:'Creative', stats:{spd:2,sht:3,dnk:4,def:5}},
  {key:'QUILL',   color:'#f5e000', tag:'Comms',    stats:{spd:5,sht:4,dnk:2,def:2}},
  {key:'PIKADON', color:'#ff2a2a', tag:'Security', stats:{spd:4,sht:2,dnk:4,def:5}}
];
for(var si=0; si<AGENTS.length; si++){
  var st=AGENTS[si].stats;
  AGENTS[si].spdMul = 0.84 + st.spd*0.08;   // ~0.92 .. 1.24
  AGENTS[si].shtMul = 0.72 + st.sht*0.06;   // shooting accuracy
  AGENTS[si].dnkMul = 0.80 + st.dnk*0.06;   // dunk/finish power
  AGENTS[si].defMul = 0.74 + st.def*0.07;   // steal/block skill
  AGENTS[si].init   = AGENTS[si].key.charAt(0);
}
function hexToRgb(h){ h=h.replace('#',''); return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)}; }
function tint(hex,f){ var c=hexToRgb(hex); return 'rgb('+Math.round(c.r*f)+','+Math.round(c.g*f)+','+Math.round(c.b*f)+')'; }
function lighten(hex,f){ var c=hexToRgb(hex); return 'rgb('+Math.round(c.r+(255-c.r)*f)+','+Math.round(c.g+(255-c.g)*f)+','+Math.round(c.b+(255-c.b)*f)+')'; }
function rgba(hex,a){ var c=hexToRgb(hex); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }

/* ============================ PORTRAIT IMAGES (NBA-Jam digitized players) ============================ */
// Primary: /assets/games/hoops/chars/{ID}.png  →  fallback: /assets/agents/{ID}-portrait.png
// → then colored fallback if neither loads.  Big head, small body = the JAM look.
var PORTRAITS={};   // key -> {img, ok}
(function loadPortraits(){
  for(var i=0;i<AGENTS.length;i++){
    (function(ag){
      var rec={img:new Image(), ok:false};
      var triedFallback=false;
      rec.img.onload=function(){ rec.ok=true; };
      rec.img.onerror=function(){
        if(!triedFallback){ triedFallback=true; rec.img.src='/assets/agents/'+ag.key+'-portrait.png'; }
        else { rec.ok=false; }
      };
      rec.img.src='/assets/games/hoops/chars/'+ag.key+'.png';
      PORTRAITS[ag.key]=rec;
    })(AGENTS[i]);
  }
})();

/* ============================ SKILLPLAY (ability loadout) ============================ */
// ids MUST match backend /api/skillplay/hoops catalog.
var ALL_SKILL_DEFS = [
  {id:'sharpshooter',  label:'Sharpshooter',  icon:'🎯', desc:'+shooting accuracy & range',   boost:{sht:0.20}},
  {id:'crossover',     label:'Ankle Breaker',  icon:'💨', desc:'+move speed & handles',        boost:{spd:0.16}},
  {id:'poster',        label:'Poster Dunker',  icon:'💥', desc:'+dunk power & finish',         boost:{dnk:0.22}},
  {id:'clamps',        label:'Clamps',         icon:'🧤', desc:'+on-ball defense',             boost:{def:0.22}},
  {id:'floor_general', label:'Floor General',  icon:'🅿', desc:'+pass speed & control',        boost:{spd:0.06, sht:0.06}},
  {id:'motor',         label:'Motor',          icon:'🔥', desc:'+turbo & stamina',             boost:{spd:0.10, def:0.06}},
  {id:'pickpocket',    label:'Pickpocket',     icon:'⚡', desc:'+steal reach & reaction',      boost:{def:0.14, spd:0.06}},
  {id:'glass_cleaner', label:'Glass Cleaner',  icon:'🛡', desc:'+rebound & block',             boost:{def:0.12, dnk:0.08}}
];
var AGENT_ABILITIES = {
  SHADDAI:['poster','glass_cleaner','sharpshooter'],
  NEXUS:  ['floor_general','crossover','sharpshooter'],
  ORACLE: ['sharpshooter','clamps','floor_general'],
  ZEROX:  ['poster','glass_cleaner','crossover'],
  TURTLE: ['clamps','glass_cleaner','poster'],
  QUILL:  ['crossover','pickpocket','sharpshooter'],
  PIKADON:['clamps','poster','pickpocket']
};
var SKILL_DEFS = ALL_SKILL_DEFS.slice();
var skillPickMax = 3;
var skillPicked = [];
var agentMatchedIds = [];
var skillBtns = [];
var G_SKILLSEL = false;
var G_MODESEL  = false;
var WATCH_ON   = false;
var skillBoosts = {spd:0, sht:0, dnk:0, def:0};

function selectedAgentKey(){ return (sel.you!=null && AGENTS[sel.you]) ? AGENTS[sel.you].key : (G.playerAgent?G.playerAgent.key:null); }
function computeAgentMatchedLocal(){
  var k=selectedAgentKey();
  var a=(k && AGENT_ABILITIES[k]) ? AGENT_ABILITIES[k].slice() : [];
  if(!a.length) a=['sharpshooter','crossover','clamps'];
  return a;
}
function refreshAgentMatchedFromBackend(){
  var k=selectedAgentKey(); if(!k) return;
  try{
    fetch('/api/skillplay/hoops/kit/'+encodeURIComponent(k)+'?n=3')
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok&&j.abilities&&j.abilities.length){ agentMatchedIds=j.abilities.map(function(x){return x.id;}); } })
      .catch(function(){});
  }catch(e){}
}
function applySkillBoosts(){
  skillBoosts={spd:0,sht:0,dnk:0,def:0};
  for(var i=0;i<skillPicked.length;i++){
    var sk=SKILL_DEFS[skillPicked[i]]; if(!sk) continue;
    for(var kk in sk.boost){ if(sk.boost.hasOwnProperty(kk)) skillBoosts[kk]=(skillBoosts[kk]||0)+sk.boost[kk]; }
  }
}
function applyBoostsToTeamA(){
  for(var i=0;i<teamA.length;i++){
    var p=teamA[i];
    p.spdMul *= (1+(skillBoosts.spd||0));
    p.shtMul *= (1+(skillBoosts.sht||0));
    p.dnkMul *= (1+(skillBoosts.dnk||0));
    p.defMul *= (1+(skillBoosts.def||0));
  }
}
function gotoSkillSelect(){
  G_SKILLSEL=true;
  SKILL_DEFS=ALL_SKILL_DEFS.slice();
  skillPickMax=3;
  agentMatchedIds=computeAgentMatchedLocal();
  refreshAgentMatchedFromBackend();
  skillPicked=[];
  for(var mi=0; mi<SKILL_DEFS.length && skillPicked.length<skillPickMax; mi++){
    if(agentMatchedIds.indexOf(SKILL_DEFS[mi].id)>=0) skillPicked.push(mi);
  }
  applySkillBoosts();
  sndSelect();
}
function confirmSkillPlay(){
  G_SKILLSEL=false;
  applySkillBoosts();
  sndSelect();
  startMatch();
}

/* ============================ AUTOPLAY (bot mode) — ?autoplay=1 ============================ */
var AP={on:false, agent:null, idx:0, t0:0, wait:0, reported:false};
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var a=(q.get('autoplay')||'').toLowerCase();
    AP.on=(a==='1'||a==='true');
    var ag=(q.get('agent')||'').toUpperCase();
    var ix=-1;
    for(var i=0;i<AGENTS.length;i++){ if(AGENTS[i].key===ag){ ix=i; break; } }
    if(ix<0) ix=Math.floor(Math.random()*AGENTS.length);
    AP.idx=ix; AP.agent=AGENTS[ix].key;
  }catch(e){ AP.on=false; }
})();
function apBadge(){
  if(!AP.on || document.getElementById('apBadge')) return;
  var b=document.createElement('div'); b.id='apBadge';
  b.textContent='◈ AUTOPLAY — '+AP.agent;
  b.style.cssText='position:fixed;left:14px;top:12px;z-index:60;font-family:Orbitron,sans-serif;font-weight:800;font-size:12px;letter-spacing:1px;color:#ffd23b;background:rgba(0,10,14,.6);border:1px solid #ffd23b;padding:7px 12px;border-radius:6px;box-shadow:0 0 12px rgba(255,210,59,.35);pointer-events:none;';
  document.body.appendChild(b);
}
function apReport(scoreVal, win){
  if(!AP.on || AP.reported) return; AP.reported=true;
  var s=Math.round(scoreVal)|0;
  try{ fetch('/api/arcade/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'basketball',agent:AP.agent,score:s,win:!!win})}).catch(function(){}); }catch(e){}
  try{ window.parent.postMessage({type:'arcadeResult',game:'basketball',agent:AP.agent,score:s,win:!!win}, '*'); }catch(e){}
  apEndCard(s, !!win);
}
function apEndCard(sc, win){
  if(document.getElementById('apEndCard')) return;
  var c=document.createElement('div'); c.id='apEndCard';
  c.style.cssText='position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,4,6,.9);font-family:Orbitron,sans-serif;';

// Full horizontal court. Team A attacks the RIGHT hoop, Team B attacks the LEFT hoop.
var COURT_W=220, COURT_H=124, CX=110, CYm=62;
var X0=0, X1=COURT_W, Y0=0, Y1=COURT_H;
var PR=6.6;               // player radius
var BR=3.0;               // ball radius
var GRAV=320;
var JUMP_VZ=120;
var MOVE_SPD=52;
var TURBO_MUL=1.5;
var TURBO_MAX=100, TURBO_DRAIN=42, TURBO_REGEN=22;
var STEAL_R=13, BLOCK_R=15, PICKUP_R=11;
var SHOVE_R=15;
var SHOT_CLOCK=14;        // seconds
var GAME_TIME=90;         // seconds
var WIN_SCORE=30;         // first-to (or highest at buzzer) — JAM games run hotter
// hoop positions: rim at each baseline, centered vertically
var HOOP_A={x:X1-8, y:CYm};  // Team A scores here (right)
var HOOP_B={x:X0+8, y:CYm};  // Team B scores here (left)
var THREE_R=64;           // 3-point arc radius from rim
/* ---- ON FIRE (NBA-Jam streaks) ---- */
var FIRE_MAKES=3;         // consecutive makes to catch fire
/* ---- GAMEBREAKER (NBA-Street signature) ---- captain super move */
var CAP_COOLDOWN=11;      // fallback cooldown seconds between uses
var TAKEOVER_TIME=4.4;    // buffed window: turbo-drive, guaranteed dunk, hot shooting, sticky D
var GAMEBREAK_NEED=100;   // meter fill required
var CY='#00f0ff', MG='#ff2bd6', GN='#00ff88', GOLD='#ffd23b', ORG='#ff6a1a';

/* ============================ VIEW / CAMERA ============================ */
// 2.5D perspective camera.  Court is drawn as a trapezoid (far edge narrower).
// Multiple views cycled with V:  BROADCAST (default) → SIDELINE → FIRST-PERSON (in-the-action).
var CAM_MODES=['BROADCAST','SIDELINE','ACTION'];
var camMode=0;
var camName=['BROADCAST','SIDELINE','1ST-PERSON'];
// camera state (eased each frame)
var cam={ cx:CX, cy:CYm, zoom:1, persp:0.42, tilt:0.30, targX:CX, targY:CYm, targZoom:1, targPersp:0.42, targTilt:0.30 };
var scale=1, offX=0, offY=0, topPad=70;
var HUD_TOP=46;
function computeView(){
  topPad=Math.min(150,Math.max(112,H*0.17));
}
function cycleCamera(){
  camMode=(camMode+1)%CAM_MODES.length;
  sndSelect();
  callout('CAM: '+camName[camMode], MG);
}
// Configure the target camera parameters per mode.  Eased toward each frame.
function updateCamera(dt){
  var m=CAM_MODES[camMode];
  var a=activeRef;
  var foc = ballHolder() || a || teamA[0];
  if(m==='BROADCAST'){
    cam.targX=CX; cam.targY=CYm; cam.targZoom=1.0; cam.targPersp=0.40; cam.targTilt=0.30;
  } else if(m==='SIDELINE'){
    // follow the action horizontally, tighter, low sideline angle
    cam.targX = foc ? (CX*0.35 + foc.x*0.65) : CX;
    cam.targY = CYm;
    cam.targZoom=1.35; cam.targPersp=0.62; cam.targTilt=0.5;
  } else { // ACTION — first-person / in-the-action close cam behind the controlled baller
    if(foc){
      // sit the camera just behind the ball-carrier looking toward their hoop
      var hp=hoopFor(foc.team);
      var dx=hp.x-foc.x, dy=hp.y-foc.y, dl=Math.hypot(dx,dy)||1;
      cam.targX = foc.x + dx/dl*22;   // look ahead of the player toward the rim
      cam.targY = foc.y + dy/dl*10;
    } else { cam.targX=CX; cam.targY=CYm; }
    cam.targZoom=2.05; cam.targPersp=0.92; cam.targTilt=0.72;
  }
  var k=Math.min(1, dt*4.5);
  cam.cx    += (cam.targX-cam.cx)*k;
  cam.cy    += (cam.targY-cam.cy)*k;
  cam.zoom  += (cam.targZoom-cam.zoom)*k;
  cam.persp += (cam.targPersp-cam.persp)*k;
  cam.tilt  += (cam.targTilt-cam.tilt)*k;
  recomputeScale();
}
function recomputeScale(){
  var botPad=54;
  var availW=W-20, availH=H-topPad-botPad;
  var base=Math.min(availW/COURT_W, availH/COURT_H);
  if(base<=0) base=1;
  scale=base*cam.zoom;
}
// Perspective projection: given world (x,y[,z]) → screen.  y=top(0) is FAR (smaller),
// y=bottom is NEAR (larger).  Camera pans via cam.cx/cy.  tilt compresses far depth.
function depthT(y){ return (y-Y0)/(Y1-Y0); } // 0 far .. 1 near
function persScale(y){
  // far things shrink; near things grow.  cam.persp controls strength.
  var t=depthT(y);
  return (1-cam.persp*0.5) + cam.persp*t;
}
var shakeX=0, shakeY=0, shakeMag=0;
function sx(x,y){
  // horizontal position with perspective narrowing toward far edge + camera pan
  if(y==null) y=CYm;
  var ps=persScale(y);
  var relX=(x-cam.cx);
  return W/2 + relX*scale*ps + shakeX;
}
function sy(y){
  // vertical placement: apply tilt so far (top) rows sit higher & compress
  var t=depthT(y);
  var centerT=depthT(cam.cy);
  var vy=(t-centerT);
  // compress far, expand near via tilt
  var comp=1 - cam.tilt*0.35;
  return H*0.52 + vy*COURT_H*scale*comp + shakeY;
}
function sz(worldZ,y){ // pixels a z-height lifts on screen (near lifts more)
  return worldZ*scale*persScale(y)*0.62;
}
function addShake(m){ shakeMag=Math.max(shakeMag,m); }
function depthOf(y){ return persScale(y); }

/* ============================ STATE ============================ */
var G={ state:'SELECT', clock:GAME_TIME, shotClock:SHOT_CLOCK, winner:null,

var ball=null;
var activeRef=null;

function mkBall(){

function hoopFor(team){ return team==='A' ? HOOP_A : HOOP_B; }   // hoop a team attacks

function newGame(){
  recomputeScale();
  var pa=G.playerAgent, cb=G.cpuAgent;
  teamA=[]; teamB=[];
  // 2v2 formation: guard + wing per side
  teamA.push(mkPlayer(CX-40, CYm-24, 'A', pa, 1));
  teamA.push(mkPlayer(CX-56, CYm+24, 'A', pa, 2));
  teamB.push(mkPlayer(CX+40, CYm+24, 'B', cb, 1));
  teamB.push(mkPlayer(CX+56, CYm-24, 'B', cb, 2));
  // roles: player 1 = lead guard/creator, player 2 = wing/finisher
  teamA[0].role='guard'; teamA[1].role='wing';
  teamB[0].role='guard'; teamB[1].role='wing';
  applyBoostsToTeamA();
  // CAPTAINS: the lead guard on each side owns the GAMEBREAKER super.
  teamA[0].captain=true; teamB[0].captain=true;
  players=teamA.concat(teamB);
  ball=mkBall();
  giveBall(teamA[0], 'A');
  activeRef=teamA[0];
  particles.length=0; popups.length=0; trail.length=0;

  G.scoreA=0; G.scoreB=0; G.possession='A'; G.madeA=0; G.madeB=0; G.stealsA=0; G.dunksA=0;
  G.callout=''; G.calloutT=0;
  // reset camera snapped to broadcast
  camMode=0;
  cam.cx=CX; cam.cy=CYm; cam.zoom=1; cam.persp=0.40; cam.tilt=0.30;
  cam.targX=CX; cam.targY=CYm; cam.targZoom=1; cam.targPersp=0.40; cam.targTilt=0.30;

}
function startMatch(){

/* ============================ HELPERS ============================ */
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function opponentsOf(t){ return t==='A'?teamB:teamA; }
function teammatesOf(p){ var arr=p.team==='A'?teamA:teamB, o=[]; for(var i=0;i<arr.length;i++) if(arr[i]!==p) o.push(arr[i]); return o; }
function nearestOpp(p){
  var arr=opponentsOf(p.team), best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var d=dist(p,arr[i]); if(d<bd){bd=d;best=arr[i];} }
  return best;
}
function ballHolder(){ return ball && ball.state==='held' ? ball.holder : null; }

function clampPlayer(p){
  if(p.x<X0+p.r)p.x=X0+p.r; if(p.x>X1-p.r)p.x=X1-p.r;
  if(p.y<Y0+p.r)p.y=Y0+p.r; if(p.y>Y1-p.r)p.y=Y1-p.r;
}
function giveBall(p,team){
  ball.state='held'; ball.holder=p; ball.ownerTeam=team; ball.inFlight=false; ball.dunking=false;
  ball.made=false; ball.vx=ball.vy=ball.vz=0; ball.alley=false; ball.passTo=null;
  for(var i=0;i<players.length;i++) players[i].hasBall=false;
  p.hasBall=true; p.charging=false; p.charge=0;
  G.possession=team;
}

/* ============================ FIRE STREAKS ============================ */
function isHot(p){ return p && (p.onFire>0 || p.takeoverT>0); }   // "on fire" OR gamebreaker window
function registerMake(p){
  p.fireStreak++;
  if(p.fireStreak===2 && !p.onFire){ callout("HE'S HEATING UP!", p.color); sndFire(); }
  if(p.fireStreak>=FIRE_MAKES && !p.onFire){
    p.onFire=1; callout("HE'S ON FIRE!!!", ORG, true); sndFire(); addShake(9);
    spawnBurst(p.x,p.y,ORG,20);
  }

}
function coolOff(p){ p.onFire=0; p.fireStreak=0; }

/* ============================ FX / CALLOUTS ============================ */
function popup(x,y,txt,color,life,big){ popups.push({x:x,y:y,txt:txt,color:color||'#0ff',life:life||1.0,max:life||1.0,big:!!big}); }
function callout(txt,color,big){ G.callout=txt; G.calloutT=1.6; G.calloutCol=color||GOLD; G.calloutBig=!!big; }
var MAX_PARTICLES=220;
function spawnBurst(wx,wy,color,n){
  var cx=sx(wx,wy), cy=sy(wy);
  var room=MAX_PARTICLES-particles.length;
  if(room<=0){ particles.splice(0, Math.min(particles.length, n)); room=n; }
  if(n>room) n=room;
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28, sp=40+Math.random()*260;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.6,max:1.0,size:2+Math.random()*4,color:color});
  }
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=260*dt; p.vx*=0.97; p.vy*=0.97; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(var j=popups.length-1;j>=0;j--){
    var q=popups[j]; q.life-=dt; q.y-=(q.big?18:40)*dt; if(q.life<=0) popups.splice(j,1);
  }
  for(var k=trail.length-1;k>=0;k--){ var t=trail[k]; t.life-=dt; if(t.life<=0) trail.splice(k,1); }
}
var flashT=0, flashCol='#ffffff';
function screenFlash(col,amt){ flashT=Math.max(flashT,amt||0.18); flashCol=col||'#ffffff'; }

/* ============================ INPUT ============================ */
var keys={};
function keyName(e){
  var k=e.key;
  if(k===' '||k==='Spacebar') return 'space';
  if(k==='Shift') return 'shift';
  if(k==='Escape') return 'esc';
  if(k==='Enter') return 'enter';

}
window.addEventListener('keydown', function(e){
  var k=keyName(e);
  if(['space','arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','shift','enter','e','z','q','f','v'].indexOf(k)>=0) e.preventDefault();
  if(k==='esc'){ doExit(); return; }
  if(AP.on){ if(k==='v'&&!e.repeat) cycleCamera(); return; }
  if(G.state==='SELECT'){ selectKey(k); keys[k]=true; return; }

  if(k==='r'){ if(G.state!=='SELECT'){ restartMatch(); } return; }
  if(WATCH_ON){ keys[k]=true; return; }
  if(!e.repeat){
    if(k==='space') actionDown();
    if(k==='e'||k==='shift') doPass();
    if(k==='f') doShove();
    if(k==='q') doCaptainSpecial();
  }
  keys[k]=true;
});
window.addEventListener('keyup', function(e){

});
window.addEventListener('blur', function(){ keys={}; if(activeRef) activeRef.charging=false; });

function moveVec(){
  var dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  if(touchMove.active){ dx+=touchMove.x; dy+=touchMove.y; }
  return {x:dx,y:dy};
}
function turboHeld(){ return !!keys['z'] || touchTurbo; }

function actionDown(){
  audio();
  if(G.state==='OVER'){ restartMatch(); return; }
  var a=activeRef; if(!a||!a.alive||a.stunT>0) return;
  if(a.hasBall){ a.charging=true; }         // hold to aim/charge shot
  else { attemptStealBlock(a); }             // no ball → steal or block attempt
}
function actionUp(){
  var a=activeRef;
  if(a&&a.alive&&a.hasBall&&a.charging){ shootBall(a, a.charge); }
  if(a){ a.charging=false; }
}
function doPass(){
  var a=activeRef; if(!a||!a.hasBall) return;
  var mates=teammatesOf(a); if(!mates.length) return;
  var mate=mates[0];
  // ALLEY-OOP: if the mate is near the rim and moving/open, lob it for a slam
  var d=dist(mate, hoopFor(a.team));
  if(d<46){ alleyPass(a, mate); }
  else { passTo(a, mate); }
}
function doShove(){
  var a=activeRef; if(!a||!a.alive) return;
  shove(a);
}

/* ============================ SHOOT / DUNK / PASS / STEAL / SHOVE ============================ */
function shootBall(p, charge){
  if(!p||!p.hasBall) return;
  var hoop=hoopFor(p.team);
  var d=dist(p, hoop);
  var isThree = d>THREE_R;
  // close to rim → dunk (bigger takeoff range when hot / turbo)
  if(d<(isHot(p)?42:28) && p.z<6 && (p.turboOn||isHot(p)||Math.random()<0.5)){
    startDunk(p);
    return;
  }
  // shot success chance: base * shooting skill, timing sweet-spot, minus distance/contest
  var contest=0;
  var opp=nearestOpp(p);
  if(opp && dist(p,opp)<16 && Math.abs(opp.x-p.x)<20 && opp.z>3) contest = (1 - dist(p,opp)/16)*0.30;
  // timing sweet-spot: releasing between 0.5..0.92 charge rewards, over-charge overshoots
  var timingBonus = (charge>0.5 && charge<0.92)?0.14:(charge>=0.98?-0.10:0.02);
  var distPen = Math.min(0.34, d/COURT_W*0.55);
  var chance = (0.58*(p.shtMul||1)) + timingBonus - distPen - contest;
  if(isThree) chance -= 0.06;
  if(isHot(p)) chance = 0.99;   // ON FIRE / GAMEBREAKER: automatic
  chance = Math.max(0.06, Math.min(isHot(p)?0.99:0.94, chance));
  var made = Math.random() < chance;

  ball.state='flight'; ball.inFlight=true; ball.holder=null; ball.dunking=false;
  ball.shotBy=p; ball.made=made; ball.isThree=isThree; ball.pts=isThree?3:2; ball.ownerTeam=p.team;
  ball.hot=isHot(p);
  ball.sx=p.x; ball.sy=p.y; ball.sz=p.z+9;
  ball.targetX = made ? hoop.x : hoop.x + (Math.random()*20-10);
  ball.targetY = made ? hoop.y : hoop.y + (Math.random()*16-8);
  ball.arc = 34 + d*0.25;
  ball.arcT=0; ball.arcDur = 0.55 + d*0.006;
  p.hasBall=false; p.charging=false; p.charge=0; p.throwAnim=0.32;
  p.face = Math.atan2(hoop.y-p.y, hoop.x-p.x);
  sndShoot(); addShake(2);
  spawnBurst(p.x,p.y-8,p.color,6);
  callout(isThree?'FROM DOWNTOWN…':'JUMPER…', p.color);
}
function startDunk(p){
  var hoop=hoopFor(p.team);
  p.dunkT=0.58; p.dunkFromX=p.x; p.dunkFromY=p.y; p.dunkTarget=hoop;
  p.hasBall=false; p.charging=false; p.charge=0;
  ball.state='dunk'; ball.dunking=true; ball.inFlight=true; ball.holder=p; ball.shotBy=p;
  ball.made=true; ball.pts=2; ball.isThree=false; ball.ownerTeam=p.team;
  sndTurbo(); callout('TAKES FLIGHT!', GOLD);
}
function finishDunk(p, isAlley){
  var hoop=hoopFor(p.team);
  var hot=isHot(p);
  ball.dunking=false; ball.inFlight=false;
  scorePoints(p.team, 2, p, false, true);
  spawnBurst(hoop.x, hoop.y, hot?GOLD:MG, hot?38:28);
  spawnBurst(hoop.x, hoop.y, GOLD, hot?28:18);
  addShake(hot?24:18); screenFlash(rgba(GOLD,1),hot?0.34:0.26); sndDunk();
  popup(sx(hoop.x,hoop.y), sy(hoop.y)-30, isAlley?'ALLEY-OOP!':(hot?'POSTER!':'SLAM!'), GOLD, 1.2, true);
  callout(isAlley?'LOB CITY! BOOMSHAKALAKA!':(hot?'OH HE PUT HIM ON A POSTER!':'BOOMSHAKALAKA!'), GOLD, true);
}
function passTo(p, mate){
  if(!p.hasBall) return;
  ball.state='pass'; ball.inFlight=true; ball.holder=null; ball.made=false; ball.dunking=false;
  ball.shotBy=p; ball.ownerTeam=p.team; ball.alley=false;
  ball.sx=p.x; ball.sy=p.y; ball.sz=p.z+9;
  ball.targetX=mate.x; ball.targetY=mate.y; ball.passTo=mate;
  ball.arc=10; ball.arcT=0; ball.arcDur=Math.max(0.16, dist(p,mate)*0.005);
  p.hasBall=false;
  p.face=Math.atan2(mate.y-p.y, mate.x-p.x);
  sndPass();
}
function alleyPass(p, mate){
  if(!p.hasBall) return;
  ball.state='pass'; ball.inFlight=true; ball.holder=null; ball.made=false; ball.dunking=false;
  ball.shotBy=p; ball.ownerTeam=p.team; ball.alley=true;
  ball.sx=p.x; ball.sy=p.y; ball.sz=p.z+9;
  var hoop=hoopFor(p.team);
  ball.targetX=hoop.x + (mate.x>hoop.x?6:-6); ball.targetY=hoop.y; ball.passTo=mate;
  ball.arc=40; ball.arcT=0; ball.arcDur=Math.max(0.28, dist(p,hoop)*0.006);
  p.hasBall=false; p.face=Math.atan2(hoop.y-p.y, hoop.x-p.x);
  sndPass(); callout('LOB!', p.color);
}
function attemptStealBlock(p){
  if(p.stealCd>0) return;
  p.stealCd=0.6;
  var holder=ballHolder();
  // block a shot in flight near this defender
  if(ball.inFlight && ball.state==='flight' && ball.ownerTeam!==p.team && p.z>4){
    var bx=ball.x, by=ball.y;
    if(Math.hypot(bx-p.x,by-p.y)<BLOCK_R+(isHot(p)?4:0)){
      var bchance=0.5*(p.defMul||1)+(isHot(p)?0.35:0);
      if(ball.hot) bchance*=0.4;  // hard to block an on-fire shot
      if(Math.random()<bchance){ blockShot(p); return; }
    }
  }
  // steal from a nearby ball-holder
  if(holder && holder.team!==p.team && dist(p,holder)<STEAL_R+p.r+(isHot(p)?6:0)){
    var schance=0.34*(p.defMul||1) - 0.10*(holder.turboOn?1:0);
    if(isHot(p)) schance+=0.30;
    if(holder.onFire) schance*=0.35;   // tough to steal from a hot hand
    if(holder.stunT>0) schance+=0.4;
    if(Math.random()<schance){
      giveBall(p, p.team);
      holder.stunT=0.4; holder.fireStreak=0;
      if(p.team==='A') G.stealsA++;
      p.meter=Math.min(GAMEBREAK_NEED,p.meter+14);
      sndSteal(); addShake(6); spawnBurst(p.x,p.y,GN,14);
      popup(sx(p.x,p.y),sy(p.y)-p.r*scale-14,'STEAL!',GN,0.9);
      callout('PICKED HIS POCKET!', GN);
      return;
    } else {
      popup(sx(p.x,p.y),sy(p.y)-p.r*scale-14,'reach',rgba('#ffffff',0.6),0.5);
    }
  }
  jump(p);
}
function blockShot(p){
  ball.made=false; ball.inFlight=true; ball.state='loose';
  var hoop=ownHoop(p.team);
  var ang=Math.atan2(hoop.y-p.y, hoop.x-p.x)+Math.PI+(Math.random()*1-0.5);
  ball.vx=Math.cos(ang)*90; ball.vy=Math.sin(ang)*90; ball.vz=60; ball.z=p.z+8;
  ball.x=p.x; ball.y=p.y; ball.holder=null; ball.dunking=false; ball.looseT=0;
  ball.ownerTeam=null; ball.hot=false;
  p.meter=Math.min(GAMEBREAK_NEED,p.meter+18);
  sndBlock(); addShake(12); screenFlash(rgba(CY,1),0.2);
  spawnBurst(p.x,p.y,CY,18);
  popup(sx(p.x,p.y),sy(p.y)-p.r*scale-16,'REJECTED!',CY,1.1,true);
  callout(['GET THAT OUTTA HERE!','REJECTED!','NOT IN MY HOUSE!'][(Math.random()*3)|0], CY, true);
}
function jump(p){
  if(!p||!p.alive) return;
  if(p.z>0.5 || p.jumpCd>0) return;
  p.vz=JUMP_VZ; p.jumpCd=0.5;
}
// SHOVE — NBA Jam signature: knock a nearby opponent down; pops the ball loose if they had it.
function shove(p){
  if(p.shoveCd>0||p.stunT>0) return;
  p.shoveCd=0.9;
  var target=null, best=SHOVE_R+p.r;
  var arr=opponentsOf(p.team);
  for(var i=0;i<arr.length;i++){ var o=arr[i]; var d=dist(p,o); if(d<best){best=d;target=o;} }
  if(!target){ return; }
  target.stunT=0.7; target.vz=Math.max(target.vz,40); target.fireStreak=0;
  var dx=target.x-p.x, dy=target.y-p.y, dm=Math.hypot(dx,dy)||1;
  target.vx+=dx/dm*70; target.vy+=dy/dm*70;
  sndShove(); addShake(6); spawnBurst(target.x,target.y,'#ffffff',10);
  popup(sx(target.x,target.y),sy(target.y)-target.r*scale-14,'SHOVE!',ORG,0.8);
  callout(['SHOVE!','DOWN GOES '+target.agent.key+'!','NO FOULS HERE!'][(Math.random()*3)|0], ORG);
  if(ball.state==='held' && ball.holder===target){
    ball.state='loose'; ball.holder=null; target.hasBall=false; ball.looseT=0;
    ball.x=target.x; ball.y=target.y; ball.z=8; ball.vx=dx/dm*40; ball.vy=dy/dm*40; ball.vz=30; ball.ownerTeam=null;
  }
}

/* ---- GAMEBREAKER (NBA-Street super) / captain TAKEOVER window ---- */
function captainSpecial(p){
  if(!p||!p.alive||!p.captain) return;
  if(p.meter<GAMEBREAK_NEED && p.capCd>0) return;   // need full meter OR cooldown elapsed
  p.meter=0; p.capCd=CAP_COOLDOWN; p.takeoverT=TAKEOVER_TIME; p.capFlash=0.7;
  p.turbo=TURBO_MAX;
  sndBreak(); sndFire(); addShake(14); screenFlash(rgba(p.color,1),0.34);
  spawnBurst(p.x,p.y,p.color,34); spawnBurst(p.x,p.y,GOLD,18);
  popup(sx(p.x,p.y), sy(p.y)-p.r*scale-22, 'GAMEBREAKER!', p.color, 1.4, true);
  callout((p.agent?p.agent.key:'CAPTAIN')+' GAMEBREAKER!', p.color, true);
}
function doCaptainSpecial(){
  if(G.state!=='PLAY') return;
  var cap=null;
  for(var i=0;i<teamA.length;i++){ if(teamA[i].captain && teamA[i].alive){ cap=teamA[i]; break; } }
  if(cap){ captainSpecial(cap); }
}

/* ============================ SCORING ============================ */
function scorePoints(team, pts, scorer, isThree, isDunk){
  if(team==='A'){ G.scoreA+=pts; G.madeA++; if(isDunk) G.dunksA++; } else { G.scoreB+=pts; G.madeB++; }
  if(scorer){ registerMake(scorer); scorer.meter=Math.min(GAMEBREAK_NEED, scorer.meter+(isDunk?24:(isThree?20:14))); }
  if(!isDunk){
    if(isThree){ sndThree(); callout('SPLASH! THREE!', team==='A'?GN:MG); }
    else { sndSwish(); sndScore(); callout(['SWISH!','BUCKETS!','COUNT IT!','KA-BLAM!'][(Math.random()*4)|0], team==='A'?GN:MG); }
    spawnBurst(hoopFor(team).x, hoopFor(team).y, team==='A'?GN:MG, 18);
    addShake(6);
  }
  popup(sx(hoopFor(team).x,hoopFor(team).y), sy(hoopFor(team).y)-34, '+'+pts, team==='A'?GN:MG, 1.1, true);
  if((G.scoreA>=WIN_SCORE || G.scoreB>=WIN_SCORE)){ endGame(); return; }
  var other = team==='A'?'B':'A';
  resetPossession(other);
}
function missShot(){
  sndMiss();
  callout(['CLANK!','OFF THE IRON!','NO GOOD!','BRICK!'][(Math.random()*4)|0], rgba('#ffffff',0.8));
  if(ball.shotBy) ball.shotBy.fireStreak=0;   // a miss ends a streak
  var hoop=hoopFor(ball.ownerTeam||'A');
  ball.state='loose'; ball.inFlight=true; ball.made=false; ball.dunking=false; ball.holder=null; ball.hot=false;
  ball.x=hoop.x + (Math.random()*30-15); ball.y=hoop.y + (Math.random()*24-12);
  ball.z=14; ball.vz=-20; ball.vx=(Math.random()*2-1)*40; ball.vy=(Math.random()*2-1)*40;
  ball.ownerTeam=null; ball.looseT=0;
  spawnBurst(hoop.x,hoop.y,rgba('#ffffff',1),8);
}
function resetPossession(team){
  var arr = team==='A'?teamA:teamB;
  var g=arr[0];
  giveBall(g, team);
  ball.x=g.x; ball.y=g.y; ball.z=g.z+9;
  G.shotClock=SHOT_CLOCK;
  activeRef = (team==='A') ? g : activeRef;
}

/* ============================ ACTIVE PLAYER ============================ */
function updateActive(){
  for(var i=0;i<teamA.length;i++){ if(teamA[i].hasBall){ activeRef=teamA[i]; return; } }
  var best=null, bd=1e9;
  for(var j=0;j<teamA.length;j++){
    var d=Math.hypot(teamA[j].x-ball.x, teamA[j].y-ball.y);
    if(d<bd){bd=d;best=teamA[j];}
  }
  activeRef = best || teamA[0];
}
function updateActiveInput(a,dt){
  if(a.stunT>0){ a.stunT-=dt; return; }
  var mv=moveVec(); var m=Math.hypot(mv.x,mv.y);
  var hot=isHot(a);
  var turbo = (hot && m>0) || (turboHeld() && a.turbo>2 && m>0);
  a.turboOn=turbo;
  if(turbo && !hot){ a.turbo=Math.max(0,a.turbo-TURBO_DRAIN*dt); if(Math.random()<0.4) sndTurbo(); }
  else { a.turbo=Math.min(TURBO_MAX, a.turbo+TURBO_REGEN*dt); }
  var msp=MOVE_SPD*(a.spdMul||1)*(turbo?TURBO_MUL:1)*(hot?1.2:1);
  if(m>0){
    a.vx=mv.x/m*msp; a.vy=mv.y/m*msp;
    if(!a.hasBall) a.face=Math.atan2(mv.y,mv.x);
    a.dribble+=Math.hypot(a.vx,a.vy)*dt*0.14;
  } else { a.vx*=0.5; a.vy*=0.5; }
  a.x+=a.vx*dt; a.y+=a.vy*dt;
  if(a.hasBall){
    var hoop=hoopFor(a.team); a.face=Math.atan2(hoop.y-a.y,hoop.x-a.x);
    if(a.charging) a.charge=Math.min(1,a.charge+dt*1.8);
    if(a.z<0.5){ a.dribble+=dt*4; if(Math.floor(a.dribble)%2===0 && Math.random()<0.05) sndDribble(); }
    // ANKLE-BREAKER crossover: turbo + tight defender → juke him (stun) & burst
    var opp=nearestOpp(a);
    if(a.crossT<=0 && turbo && opp && dist(a,opp)<12 && opp.z<2 && m>0){
      opp.stunT=Math.max(opp.stunT,0.45); opp.vx*=0.3; opp.vy*=0.3;
      a.crossT=1.4; a.meter=Math.min(GAMEBREAK_NEED,a.meter+10);
      spawnBurst(opp.x,opp.y,a.color,10); sndMove();
      popup(sx(opp.x,opp.y),sy(opp.y)-opp.r*scale-12,'ANKLES!',a.color,0.8);
      callout('BROKE HIS ANKLES!', a.color);
    }
  }
}

/* ============================ AI ============================ */
function aiSteer(p,tx,ty,spd,dt){
  var dx=tx-p.x, dy=ty-p.y, mm=Math.hypot(dx,dy)||1;
  var wx=dx/mm*spd, wy=dy/mm*spd;
  var k=Math.min(1, dt*8);
  p.vx+=(wx-p.vx)*k; p.vy+=(wy-p.vy)*k;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
}
function spaceOut(p,tx,ty){
  var mates=teammatesOf(p), mate=null, md=1e9;
  for(var i=0;i<mates.length;i++){ if(!mates[i].alive) continue;
    var d=dist(p,mates[i]); if(d<md){md=d;mate=mates[i];} }
  if(mate && md<34){ tx+=(p.x-mate.x)*0.55; ty+=(p.y-mate.y)*0.55; }
  return {x:tx,y:ty};
}
function openTeammate(p){
  var mates=teammatesOf(p), best=null, bestOpen=-1;
  var myOpp=nearestOpp(p); var myOpen=myOpp?dist(p,myOpp):999;
  for(var i=0;i<mates.length;i++){ var m=mates[i]; if(!m.alive) continue;
    var arr=opponentsOf(m.team), nd=1e9;
    for(var j=0;j<arr.length;j++){ var d=dist(m,arr[j]); if(d<nd) nd=d; }
    var toHoop=dist(m,hoopFor(m.team));
    var score=nd - toHoop*0.25;
    if(nd>myOpen+8 && score>bestOpen){ bestOpen=score; best=m; }
  }
  return best;
}
function runAI(p,dt){
  if(p.stunT>0){ p.stunT-=dt; return; }
  var hoop=hoopFor(p.team);
  p.stealCd=Math.max(0,p.stealCd-dt);
  p.aiReact=Math.max(0,(p.aiReact||0)-dt);

  // captain fires GAMEBREAKER when meter is full & it can swing the game
  if(p.captain){
    p.aiCapT-=dt;
    if((p.meter>=GAMEBREAK_NEED || p.capCd<=0) && p.aiCapT<=0){
      var behind = (p.team==='A'? G.scoreA<G.scoreB : G.scoreB<G.scoreA);
      var hasRock = p.hasBall && dist(p,hoop)<THREE_R*1.3;
      if(p.meter>=GAMEBREAK_NEED && (hasRock || behind || Math.random()<0.5)){
        captainSpecial(p);
        p.aiCapT=CAP_COOLDOWN+Math.random()*3;
      } else { p.aiCapT=0.8; }
    }
  }
  if(!isHot(p)) p.turbo=Math.min(TURBO_MAX, p.turbo+TURBO_REGEN*0.7*dt);

  if(p.hasBall){
    p.aiAct-=dt;
    var d=dist(p,hoop);
    var opp=nearestOpp(p);
    var pressured = opp && dist(p,opp)<15;
    var tx=hoop.x, ty=hoop.y;
    if(pressured && opp && d>28){
      var awx=p.x-opp.x, awy=p.y-opp.y, al=Math.hypot(awx,awy)||1;
      tx=hoop.x + awx/al*14; ty=hoop.y + awy/al*22;
    }
    var burst = isHot(p) || (p.turbo>28 && d<80 && d>26 && Math.random()<0.04);
    if(burst && p.turbo>4) p.turboOn=true; else if(p.turbo<6 && !isHot(p)) p.turboOn=false;
    var spd=MOVE_SPD*0.94*(p.spdMul||1)*(p.turboOn?TURBO_MUL:1)*(isHot(p)?1.2:1)*(p.buff||1);
    if(p.turboOn && !isHot(p)) p.turbo=Math.max(0,p.turbo-TURBO_DRAIN*dt);
    aiSteer(p, tx, ty, spd, dt);
    p.face=Math.atan2(hoop.y-p.y,hoop.x-p.x);
    p.dribble+=dt*5;
    if(p.aiAct<=0){
      var mate=openTeammate(p);
      // ALLEY-OOP: if a mate is at the rim & open, throw the lob
      var mateAtRim = mate && dist(mate,hoopFor(mate.team))<40;
      if(d<(isHot(p)?40:26)){ startDunk(p); }
      else if(mateAtRim && d>50 && Math.random()<0.5){ alleyPass(p,mate); }
      else if(pressured && mate && Math.random()<0.6){ passTo(p,mate); }
      else if(d<THREE_R*1.15){
        var shootOdds=0.42 + (p.shtMul-1) + (isHot(p)?0.5:0) - (pressured?0.25:0);
        if(Math.random()<shootOdds){ shootBall(p, 0.6+Math.random()*0.3); }
        else if(mate){ passTo(p,mate); }
        else { shootBall(p, 0.6); }
      } else if(mate && Math.random()<0.5){ passTo(p,mate); }
      p.aiAct=0.45+Math.random()*0.7;
    }
    return;
  }

  var holder=ballHolder();
  // an off-ball attacker cuts to the rim to invite alley-oops
  if(ball.state==='loose' || (ball.inFlight && !ball.dunking && ball.state!=='pass')){
    var spd2=MOVE_SPD*0.9*(p.spdMul||1)*(p.buff||1);
    aiSteer(p, ball.x, ball.y, spd2, dt);
    p.face=Math.atan2(ball.y-p.y,ball.x-p.x);
    var md=dist(p,ball);
    if(md<PICKUP_R+p.r && ball.z<12 && ball.state!=='pass' && !ball.dunking){
      giveBall(p,p.team); ball.x=p.x; ball.y=p.y; ball.z=p.z+9; G.shotClock=SHOT_CLOCK;
    }
    return;
  }

  if(holder && holder.team!==p.team){
    var ownH=ownHoop(p.team);
    var mates=teammatesOf(p);
    var iAmClosest = dist(p,holder) <= (mates[0]&&mates[0].alive?dist(mates[0],holder):1e9);
    var gx,gy;
    if(iAmClosest){
      var hx=hoopFor(holder.team).x, hy2=hoopFor(holder.team).y;
      gx=holder.x+(hx-holder.x)*0.26; gy=holder.y+(hy2-holder.y)*0.26;
    } else {
      var om=openTeammate(holder)||holder;
      gx=(ownH.x*0.5+om.x*0.5); gy=(ownH.y*0.4+om.y*0.6);
    }
    var spd3=MOVE_SPD*0.9*(p.spdMul||1)*(p.buff||1);
    aiSteer(p, gx, gy, spd3, dt);
    p.face=Math.atan2(holder.y-p.y,holder.x-p.x);
    if(iAmClosest && p.aiReact<=0){
      var dh=dist(p,holder);
      if(dh<STEAL_R+2 && p.stealCd<=0 && Math.random()<0.5){ attemptStealBlock(p); p.aiReact=0.35; }
      else if(dh<SHOVE_R && p.shoveCd<=0 && Math.random()<0.10){ shove(p); p.aiReact=0.5; }
      else if(ball.inFlight && ball.state==='flight' && dist(p,ball)<BLOCK_R+3 && p.z<1 && Math.random()<0.3){ attemptStealBlock(p); p.aiReact=0.4; }
    }
    return;
  }

  if(holder && holder.team===p.team){
    var oh=hoopFor(p.team);
    p.wander+=dt*(0.9+Math.random()*0.5);
    var baseX,baseY;
    if(p.role==='wing'){
      // wing periodically crashes the rim (sets up alley-oops)
      var crash = (Math.sin(p.wander*0.5)>0.5);
      if(crash){ baseX=oh.x + (p.team==='A'?-8:8); baseY=oh.y + Math.sin(p.wander*1.4)*10; }
      else {
        baseX = oh.x + (p.team==='A'? -1:1)*(24+Math.cos(p.wander)*10);
        baseY = oh.y + (p.homeY<oh.y? -1:1)*(26+Math.sin(p.wander*1.2)*10);
      }
    } else {
      baseX = (p.homeX+oh.x)/2 + Math.cos(p.wander)*14;
      baseY = oh.y + Math.sin(p.wander*1.3)*30;
    }
    var sp=spaceOut(p, baseX, baseY);
    var spd4=MOVE_SPD*0.72*(p.spdMul||1);
    aiSteer(p, sp.x, sp.y, spd4, dt);
    p.face=Math.atan2(oh.y-p.y,oh.x-p.x);
    return;
  }
}

/* ============================ PHYSICS ============================ */
function updatePlayerPhysics(p,dt){
  p.z+=p.vz*dt; p.vz-=GRAV*dt;
  if(p.z<0){ p.z=0; p.vz=0; }
  p.jumpCd=Math.max(0,p.jumpCd-dt);
  p.throwAnim=Math.max(0,p.throwAnim-dt);
  p.glow=Math.max(0,p.glow-dt);
  p.shoveCd=Math.max(0,p.shoveCd-dt);
  p.crossT=Math.max(0,p.crossT-dt);
  p.capCd=Math.max(0,p.capCd-dt);
  p.capFlash=Math.max(0,p.capFlash-dt);
  if(p.takeoverT>0){ p.takeoverT=Math.max(0,p.takeoverT-dt); p.glow=Math.max(p.glow,0.2); }
  p.anim+=(Math.abs(p.vx)+Math.abs(p.vy))*dt*0.9;
  // apply shove knockback friction
  if(p.stunT>0){ p.vx*=0.9; p.vy*=0.9; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  if(p.dunkT>0){
    var t=1-(p.dunkT/0.58);
    var hoop=p.dunkTarget||hoopFor(p.team);
    p.x=p.dunkFromX+(hoop.x-p.dunkFromX)*t;
    p.y=p.dunkFromY+(hoop.y-p.dunkFromY)*t;
    p.z=Math.sin(t*Math.PI)*26;
    p.dunkT-=dt;
    if(p.dunkT<=0){ p.z=0; finishDunk(p, ball.alley); }
    return;
  }
  clampPlayer(p);
}
function updateBall(dt){
  var b=ball;
  b.spin+=dt*16;
  if(b.state==='held'){
    var h=b.holder;
    if(!h||!h.alive){ b.state='loose'; b.holder=null; b.looseT=0; return; }
    var bob=(h.z<0.5)? Math.abs(Math.sin(h.dribble))* -6 : 0;
    b.x=h.x+Math.cos(h.face)*(h.r+1);
    b.y=h.y+Math.sin(h.face)*(h.r+1)+2;
    b.z=(h.z<0.5? 3+ (Math.sin(h.dribble*2)*3+3) : h.z+8);
    b.vx=b.vy=0;
  }
  else if(b.state==='dunk'){
    var h2=b.holder;
    if(h2){ b.x=h2.x; b.y=h2.y; b.z=h2.z+8; }
  }
  else if(b.state==='flight' || b.state==='pass'){
    b.arcT+=dt;
    var t=Math.min(1, b.arcT/b.arcDur);
    b.x=b.sx+(b.targetX-b.sx)*t;
    b.y=b.sy+(b.targetY-b.sy)*t;
    b.z=b.sz+(0-b.sz)*t + Math.sin(t*Math.PI)*b.arc;
    if(trail.length<80) trail.push({x:b.x,y:b.y,z:b.z,special:(b.hot||(b.state==='flight'&&b.isThree)),life:0.3,max:0.3});
    if(t>=1){
      if(b.state==='pass'){
        var mate=b.passTo;
        if(b.alley && mate && mate.alive && mate.stunT<=0){
          // ALLEY-OOP finish: mate catches at rim & slams
          giveBall(mate, b.ownerTeam);
          startDunk(mate); ball.alley=true;
        } else if(mate && mate.alive && mate.stunT<=0){ giveBall(mate, b.ownerTeam); b.x=mate.x; b.y=mate.y; }
        else { b.state='loose'; b.looseT=0; b.vz=0; b.ownerTeam=null; }
      } else {
        if(b.made){ scorePoints(b.ownerTeam, b.pts, b.shotBy, b.isThree, false); }
        else { missShot(); }
      }
    }
  }
  else if(b.state==='loose'){
    b.looseT+=dt;
    b.z+=b.vz*dt; b.vz-=GRAV*dt;
    if(b.z<0){ b.z=0; b.vz*=-0.45; if(Math.abs(b.vz)<14) b.vz=0; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=0.92; b.vy*=0.92;
    if(b.x<X0+BR){b.x=X0+BR;b.vx*=-0.5;} if(b.x>X1-BR){b.x=X1-BR;b.vx*=-0.5;}
    if(b.y<Y0+BR){b.y=Y0+BR;b.vy*=-0.5;} if(b.y>Y1-BR){b.y=Y1-BR;b.vy*=-0.5;}
    if(b.looseT>0.15 && b.z<11){
      var best=null,bd=1e9;
      for(var i=0;i<players.length;i++){ if(players[i].stunT>0) continue; var d=Math.hypot(players[i].x-b.x,players[i].y-b.y); if(d<bd){bd=d;best=players[i];} }
      if(best && bd<PICKUP_R+best.r){ giveBall(best,best.team); b.x=best.x; b.y=best.y; b.z=best.z+9; G.shotClock=SHOT_CLOCK; callout('REBOUND!', best.team==='A'?GN:MG); }
    }
  }
}

/* ============================ MAIN UPDATE ============================ */
function updatePlay(dt){
  if(G.introT>0) G.introT-=dt;
  if(G.calloutT>0) G.calloutT-=dt;
  G.clock-=dt; if(G.clock<=0){ G.clock=0; endGame(); return; }
  var holder=ballHolder();
  if(holder){
    G.shotClock-=dt;
    if(G.shotClock<=0){ G.shotClock=SHOT_CLOCK; callout('SHOT CLOCK VIOLATION!', '#ff5a2a'); sndBuzzer();
      var other=holder.team==='A'?'B':'A'; resetPossession(other); }
  } else { G.shotClock=Math.max(G.shotClock, 0); }

  updateActive();
  var a=activeRef;
  for(var i=0;i<players.length;i++){
    var p=players[i]; if(!p.alive) continue;
    if(p===a && !(AP.on||WATCH_ON)) updateActiveInput(p,dt);
    else runAI(p,dt);
  }
  for(var j=0;j<players.length;j++) updatePlayerPhysics(players[j],dt);
  // soft player-player separation
  for(var m=0;m<players.length;m++) for(var n=m+1;n<players.length;n++){
    var pa=players[m], pb=players[n];
    var dx=pb.x-pa.x, dy=pb.y-pa.y, dd=Math.hypot(dx,dy);
    if(dd<pa.r+pb.r-1 && dd>0){ var push=(pa.r+pb.r-1-dd)/2; pa.x-=dx/dd*push; pa.y-=dy/dd*push; pb.x+=dx/dd*push; pb.y+=dy/dd*push; }
  }
  updateBall(dt);
}
function endGame(){
  if(G.state==='OVER') return;
  var win = G.scoreA>=G.scoreB;
  G.state='OVER'; G.winner=win?'A':'B'; G.victory=win;
  sndBuzzer();
  setTimeout(function(){ if(win) sndWin(); else sndLose(); }, 300);
  postScore(finalScore());
}
function finalScore(){ return G.scoreA*100 + G.madeA*20 + G.dunksA*30 + G.stealsA*40 + (G.victory?1000:0); }

/* ---- score reporting ---- */
function postScore(finalScoreVal){
  if(scorePosted) return; scorePosted=true;
  if(AP.on){ apReport(G.victory?1000+G.scoreA:G.scoreA, G.victory); }
  try{ window.parent.postMessage({type:'shaddai-game-score', game:'basketball', score:finalScoreVal}, '*'); }catch(e){}
  try{
    fetch('/api/leaderboard/basketball', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ game:'basketball', score:finalScoreVal, agent:G.playerAgent.key,
        scoreA:G.scoreA, scoreB:G.scoreB, made:G.madeA, dunks:G.dunksA, steals:G.stealsA, victory:!!G.victory, ts:Date.now() })
    }).catch(function(){});
  }catch(e){}
}

/* ============================ RENDER: COURT ============================ */
var CROWD=null;
function buildCrowd(){
  CROWD=[]; var cols=['#00f0ff','#ff2bd6','#00ff88','#ffd23b','#b06bff'];
  for(var i=0;i<160;i++){
    CROWD.push({ x:Math.random()*COURT_W, side:Math.random()<0.5?-1:1, row:Math.random(),
      c:cols[(Math.random()*cols.length)|0], t:Math.random()*6.28, sz:1.4+Math.random()*1.8 });
  }
}
function drawCrowd(){
  if(!CROWD) buildCrowd();
  ctx.save();
  for(var i=0;i<CROWD.length;i++){
    var d=CROWD[i];
    // stands sit beyond the far baseline (top) and near baseline — draw as bleacher dots
    var wy = d.side<0 ? Y0 - d.row*30 : Y1 + d.row*22;
    var px=sx(d.x, Math.max(Y0,Math.min(Y1,wy))), py=sy(wy);
    var tw=0.35+0.65*(0.5+0.5*Math.sin(perfNow*0.003+d.t));
    ctx.globalAlpha=(0.10+tw*0.32)*Math.max(0.2,persScale(wy));
    ctx.fillStyle=d.c; ctx.shadowColor=d.c; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(px,py,d.sz*persScale(wy),0,6.283); ctx.fill();
  }
  ctx.restore();
}
function drawHoop(hoop, side, defColor){
  var s=scale*persScale(hoop.y);
  var dir = side==='right' ? -1 : 1;
  var X=sx(hoop.x,hoop.y), Y=sy(hoop.y);
  var poleX=sx(hoop.x - dir*4, hoop.y);
  ctx.save();
  // pole
  ctx.strokeStyle=rgba(defColor,0.5); ctx.lineWidth=Math.max(3,4*s); ctx.shadowColor=defColor; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(poleX, sy(hoop.y-30)); ctx.lineTo(poleX, sy(hoop.y+30)); ctx.stroke();
  // backboard
  ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.fillStyle='rgba(10,20,30,0.55)'; ctx.lineWidth=2;
  var bbW=3*s, bbH=30*s;
  ctx.fillRect(poleX-bbW/2, Y-bbH/2, bbW, bbH);
  ctx.strokeRect(poleX-bbW/2, Y-bbH/2, bbW, bbH);
  ctx.strokeStyle=rgba(defColor,0.9); ctx.lineWidth=1.6; ctx.shadowColor=defColor; ctx.shadowBlur=8;
  ctx.strokeRect(poleX-bbW/2-1, Y-6*s, bbW+2, 12*s);
  // rim
  ctx.shadowColor=GOLD; ctx.shadowBlur=16;
  ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(2,3*s);
  ctx.beginPath(); ctx.ellipse(X, Y, 8*s, 3.4*s, 0, 0, 6.283); ctx.stroke();
  // net
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1;
  for(var i=-3;i<=3;i++){
    ctx.beginPath();
    ctx.moveTo(X+i*2.4*s, Y);
    ctx.lineTo(X+i*1.2*s, Y+11*s);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(X-8*s,Y+6*s); ctx.lineTo(X+8*s,Y+6*s); ctx.stroke();
  ctx.restore();
}
function drawCourt(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0620'); bg.addColorStop(0.45,'#160a35'); bg.addColorStop(1,'#04030f');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  drawCrowd();

  var pc=G.playerAgent.color, cc=G.cpuAgent.color;
  // corners of the court as a perspective quad
  var TL={x:sx(X0,Y0),y:sy(Y0)}, TR={x:sx(X1,Y0),y:sy(Y0)};
  var BR2={x:sx(X1,Y1),y:sy(Y1)}, BL={x:sx(X0,Y1),y:sy(Y1)};

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(TL.x,TL.y); ctx.lineTo(TR.x,TR.y); ctx.lineTo(BR2.x,BR2.y); ctx.lineTo(BL.x,BL.y); ctx.closePath();
  ctx.clip();
  // hardwood floor
  var floorBase=ctx.createLinearGradient(0,sy(Y0),0,sy(Y1));
  floorBase.addColorStop(0,'#2a180a'); floorBase.addColorStop(0.5,'#3a220c'); floorBase.addColorStop(1,'#4a2c10');
  ctx.fillStyle=floorBase; ctx.fillRect(0,0,W,H);
  // center neon glow
  var mx=sx(CX,CYm), midY=sy(CYm);
  var rad=ctx.createRadialGradient(mx,midY,0,mx,midY,Math.max(W,H)*0.5);
  rad.addColorStop(0,'rgba(0,240,255,0.14)'); rad.addColorStop(0.5,'rgba(0,240,255,0.04)'); rad.addColorStop(1,'rgba(0,240,255,0)');
  ctx.fillStyle=rad; ctx.fillRect(0,0,W,H);
  // team-tinted halves
  var gA=ctx.createLinearGradient(sx(X0,CYm),0,mx,0);
  gA.addColorStop(0,rgba(pc,0.14)); gA.addColorStop(1,rgba(pc,0.02));
  ctx.fillStyle=gA; ctx.fillRect(0,0,mx,H);
  var gB=ctx.createLinearGradient(mx,0,sx(X1,CYm),0);
  gB.addColorStop(0,rgba(cc,0.02)); gB.addColorStop(1,rgba(cc,0.14));
  ctx.fillStyle=gB; ctx.fillRect(mx,0,W-mx,H);
  ctx.restore();

  // COURT LINES (perspective)
  function wline(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(sx(x1,y1),sy(y1)); ctx.lineTo(sx(x2,y2),sy(y2)); ctx.stroke(); }
  ctx.save();
  var pulse=(Math.sin(perfNow*0.004)*0.5+0.5);
  // center line + circle
  ctx.strokeStyle=rgba(GOLD,0.55); ctx.lineWidth=2; ctx.shadowColor=GOLD; ctx.shadowBlur=10+pulse*6;
  wline(CX,Y0,CX,Y1);
  ctx.beginPath();
  ctx.ellipse(sx(CX,CYm),sy(CYm), 20*scale*persScale(CYm), 20*scale*persScale(CYm)*(1-cam.tilt*0.5), 0,0,6.283); ctx.stroke();
  // keys / arcs
  drawKey(HOOP_A,'right',cc);
  drawKey(HOOP_B,'left',pc);
  // boundary
  ctx.strokeStyle=rgba(CY,0.8); ctx.lineWidth=2.4; ctx.shadowColor=CY; ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.moveTo(TL.x,TL.y); ctx.lineTo(TR.x,TR.y); ctx.lineTo(BR2.x,BR2.y); ctx.lineTo(BL.x,BL.y); ctx.closePath(); ctx.stroke();
  ctx.restore();

  drawHoop(HOOP_A,'right',cc);
  drawHoop(HOOP_B,'left',pc);
}
function drawKey(hoop, side, col){
  var dir = side==='right' ? -1 : 1;
  ctx.save();
  ctx.strokeStyle=rgba(col,0.5); ctx.lineWidth=1.8; ctx.shadowColor=col; ctx.shadowBlur=8;
  // three-point arc (sampled in world space so it warps with perspective)
  var start = side==='right' ? Math.PI*0.5 : -Math.PI*0.5;
  var end   = side==='right' ? Math.PI*1.5 : Math.PI*0.5;
  ctx.beginPath();
  var steps=26;
  for(var i=0;i<=steps;i++){
    var ang=start+(end-start)*(i/steps);
    var wx=hoop.x+Math.cos(ang)*THREE_R, wy=hoop.y+Math.sin(ang)*THREE_R;
    var px=sx(wx,Math.max(Y0,Math.min(Y1,wy))), py=sy(wy);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
  // paint rectangle
  var keyLen=34, keyW=34;
  var x1=hoop.x+dir*keyLen;
  ctx.strokeStyle=rgba(col,0.4); ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.moveTo(sx(hoop.x,hoop.y-keyW/2), sy(hoop.y-keyW/2));
  ctx.lineTo(sx(x1,hoop.y-keyW/2), sy(hoop.y-keyW/2));
  ctx.lineTo(sx(x1,hoop.y+keyW/2), sy(hoop.y+keyW/2));
  ctx.lineTo(sx(hoop.x,hoop.y+keyW/2), sy(hoop.y+keyW/2));
  ctx.stroke();
  ctx.restore();
}

/* ============================ RENDER: PLAYER (BIG-HEAD PORTRAIT SPRITE — NBA JAM) ============================ */
function drawPlayer(p){
  var ps=persScale(p.y);
  var X=sx(p.x,p.y);
  var footY=sy(p.y);
  var lift=sz(p.z,p.y);
  var u=p.r*scale*ps;                 // body unit
  var isActive=(p===activeRef && G.state==='PLAY' && !WATCH_ON && !AP.on);
  var flip = Math.cos(p.face)<0;
  var hot = isHot(p);
  var teamRing = p.team==='A'?CY:'#ff3b3b';
  var col=p.color;

  // ground shadow
  ctx.save();
  ctx.globalAlpha=0.34*(1-Math.min(0.7,p.z/40)); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(X, footY, u*1.05*(1-p.z/70), u*0.42*(1-p.z/70), 0,0,6.283); ctx.fill();
  ctx.restore();

  // active chevron ring
  if(isActive){
    ctx.save();
    var pr=(Math.sin(perfNow*0.008)*0.5+0.5);
    ctx.globalAlpha=0.85; ctx.strokeStyle=GN; ctx.lineWidth=3; ctx.shadowColor=GN; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(X, footY, u*1.4+pr*3, u*0.56+pr*1.4, 0,0,6.283); ctx.stroke();
    ctx.restore();
  }
  if(p.captain && p.alive){
    ctx.save();
    var cp=(Math.sin(perfNow*0.006+p.num)*0.5+0.5);
    ctx.globalAlpha=0.5+cp*0.35; ctx.strokeStyle=hot?GOLD:col; ctx.lineWidth=2;
    ctx.shadowColor=hot?GOLD:col; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.ellipse(X, footY, u*1.12+cp*2, u*0.46+cp, 0,0,6.283); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(X, footY - lift);
  var stunFlick = (p.stunT>0 && Math.floor(perfNow/60)%2===0) ? 0.55 : 1;
  ctx.globalAlpha=stunFlick;

  // proportions: SMALL body, BIG head (the JAM look)
  var walk=Math.sin(p.anim*2.0), walk2=Math.sin(p.anim*2.0+Math.PI);
  var moving=Math.hypot(p.vx||0,p.vy||0);
  var gait=Math.min(1, moving/28);
  var bodyH=u*1.7, bodyW=u*1.15;
  var headR=u*1.65;                 // big head
  var legLift = p.z>1? Math.min(sz(p.z,p.y)*0.14, u*0.6):0;
  var armUp = (p.throwAnim>0 || p.dunkT>0 || p.charging || p.z>4);
  var fs = flip?-1:1;

  // ON FIRE aura (flames)
  if(hot){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(var f=0;f<5;f++){
      ctx.globalAlpha=0.22;
      ctx.fillStyle=['#ff2b00','#ff6a00','#ffb700'][f%3];
      var fy=-bodyH-headR*1.2 + Math.sin(perfNow*0.011+f)*u*0.5;
      ctx.beginPath();
      ctx.moveTo(-u*1.1+f*u*0.5, -bodyH*0.4);
      ctx.quadraticCurveTo((f-2)*u*0.7, fy, 0, fy-u*0.6);
      ctx.quadraticCurveTo(-(f-2)*u*0.7, fy, u*1.1-f*u*0.5, -bodyH*0.4);
      ctx.fill();
    }
    ctx.restore();
  } else if(p.turboOn){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.4; ctx.fillStyle=GOLD; ctx.shadowColor='#ff6a1a'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(0, -bodyH*0.5, u*1.3, u*1.9, 0,0,6.283); ctx.fill();
    ctx.restore();
  }

  // LEGS
  ctx.strokeStyle='#e8c6a0'; ctx.lineWidth=u*0.42; ctx.lineCap='round';
  var legY0=-u*0.1, legY1=bodyH*0.55+legLift;
  var sway=(0.2+gait*0.5)*u;
  ctx.beginPath(); ctx.moveTo(-u*0.32, legY0); ctx.lineTo(-u*0.4 + walk*sway, legY1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( u*0.32, legY0); ctx.lineTo( u*0.42 + walk2*sway, legY1); ctx.stroke();
  // shoes
  ctx.fillStyle='#eef';
  ctx.beginPath(); ctx.ellipse(-u*0.4+walk*sway, legY1, u*0.3,u*0.15,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse( u*0.42+walk2*sway, legY1, u*0.3,u*0.15,0,0,6.283); ctx.fill();

  // SHORTS
  ctx.fillStyle=tint(col,0.42);
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.55,-bodyH*0.12); ctx.lineTo(bodyW*0.55,-bodyH*0.12);
  ctx.lineTo(bodyW*0.5,bodyH*0.22); ctx.lineTo(-bodyW*0.5,bodyH*0.22); ctx.closePath(); ctx.fill();

  // TORSO jersey
  ctx.save();
  ctx.shadowColor=hot?GOLD:col; ctx.shadowBlur=isActive?15:(hot?16:8);
  var jg=ctx.createLinearGradient(0,-bodyH,0,0);
  jg.addColorStop(0,lighten(col,0.22)); jg.addColorStop(1,tint(col,0.5));
  ctx.fillStyle=jg;
  roundRect(-bodyW/2, -bodyH, bodyW, bodyH*0.9, u*0.3); ctx.fill();
  ctx.restore();
  // jersey number
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font="800 "+(u*0.7).toFixed(0)+"px 'Orbitron',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(p.num+(p.team==='A'?0:2)), 0, -bodyH*0.42);

  // ARMS
  ctx.strokeStyle='#e8c6a0'; ctx.lineWidth=u*0.34; ctx.lineCap='round';
  var ay = armUp? -bodyH-u*1.0 : -bodyH*0.68;
  var ax = armUp? u*0.4 : u*0.7;
  ctx.beginPath(); ctx.moveTo(-bodyW*0.5, -bodyH*0.72); ctx.lineTo(-ax, ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( bodyW*0.5, -bodyH*0.72); ctx.lineTo( ax, ay); ctx.stroke();

  // BIG HEAD — portrait image (circle clipped), colored fallback
  var hy=-bodyH-headR*0.72;
  var rec=PORTRAITS[p.agent.key];
  ctx.save();
  ctx.beginPath(); ctx.arc(0,hy,headR,0,6.283);
  ctx.shadowColor=hot?ORG:col; ctx.shadowBlur=hot?18:8;
  ctx.fillStyle='#111'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save();
  ctx.beginPath(); ctx.arc(0,hy,headR-headR*0.06,0,6.283); ctx.clip();
  if(rec && rec.ok){
    if(flip) ctx.scale(-1,1);
    var dw=headR*2.25, dh=headR*2.25;
    ctx.drawImage(rec.img, -dw/2, hy-dh/2-headR*0.12, dw, dh);
  } else {
    ctx.fillStyle=col; ctx.fillRect(-headR,hy-headR,headR*2,headR*2);
    ctx.fillStyle='#000'; ctx.font="900 "+(headR*1.15).toFixed(0)+"px 'Orbitron',sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.agent.init, 0, hy);
  }
  ctx.restore();
  // head team ring
  ctx.lineWidth=Math.max(1.6,u*0.16); ctx.strokeStyle=hot?GOLD:teamRing;
  ctx.shadowColor=hot?GOLD:teamRing; ctx.shadowBlur=isActive?12:6;
  ctx.beginPath(); ctx.arc(0,hy,headR-headR*0.03,0,6.283); ctx.stroke();
  ctx.restore();

  // captain star + on-fire label
  if(p.captain && p.alive){
    ctx.fillStyle=hot?GOLD:col; ctx.shadowColor=hot?GOLD:col; ctx.shadowBlur=10;
    ctx.font="800 "+(u*1.0).toFixed(0)+"px 'Orbitron',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('★', 0, hy-headR-u*0.6); ctx.shadowBlur=0;
  }
  // stun stars
  if(p.stunT>0){
    ctx.fillStyle=GOLD; ctx.font=(headR*0.8).toFixed(0)+"px serif"; ctx.textAlign='center';
    ctx.fillText('★', -headR, hy-headR); ctx.fillText('★', headR, hy-headR*0.6);
  }
  // active down-arrow indicator
  if(isActive){
    ctx.save();
    var iy=hy-headR-u*1.4+Math.sin(perfNow*0.006)*u*0.2;
    ctx.globalAlpha=0.9; ctx.fillStyle=GN; ctx.shadowColor=GN; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(0,iy+u*0.6); ctx.lineTo(-u*0.5,iy); ctx.lineTo(u*0.5,iy); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================ RENDER: BALL ============================ */
function drawTrails(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(var i=0;i<trail.length;i++){
    var t=trail[i]; var a=t.life/t.max;
    ctx.globalAlpha=a*a*0.8;
    ctx.fillStyle=t.special?ORG:GOLD;
    ctx.shadowColor=t.special?'#ff5500':'#ff8a1a'; ctx.shadowBlur=t.special?18:12;
    ctx.beginPath(); ctx.arc(sx(t.x,t.y), sy(t.y)-sz(t.z||0,t.y), BR*scale*persScale(t.y)*(0.35+a*0.75),0,6.283); ctx.fill();
  }
  ctx.restore();
}
function drawBall(){
  var b=ball; if(!b) return;
  if(b.state==='held' && !b.holder) return;
  var ps=persScale(b.y);
  var X=sx(b.x,b.y), Y=sy(b.y)-sz(b.z,b.y);
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx(b.x,b.y), sy(b.y)+2, BR*scale*ps*0.9, BR*scale*ps*0.45,0,0,6.283); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(X,Y); ctx.rotate(b.spin);
  var rr=BR*scale*ps;
  ctx.shadowColor=b.hot?'#ff5500':'#ff8a1a'; ctx.shadowBlur=b.hot?16:12;
  var bg=ctx.createRadialGradient(-rr*0.35,-rr*0.35,rr*0.1,0,0,rr);
  bg.addColorStop(0,'#ffd08a'); bg.addColorStop(0.5,'#ff8a2a'); bg.addColorStop(1,'#d1571a');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,rr,0,6.283); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='#5a2408'; ctx.lineWidth=Math.max(1,rr*0.18);
  ctx.beginPath(); ctx.moveTo(-rr,0); ctx.lineTo(rr,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-rr); ctx.lineTo(0,rr); ctx.stroke();
  ctx.beginPath(); ctx.arc(-rr*1.1,0,rr*1.2,-0.9,0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(rr*1.1,0,rr*1.2,Math.PI-0.9,Math.PI+0.9); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(-rr*0.35,-rr*0.35,rr*0.22,0,6.283); ctx.fill();
  ctx.restore();
}
function drawParticles(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(var i=0;i<particles.length;i++){
    var p=particles[i]; var a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+a*0.8),0,6.283); ctx.fill();
  }
  ctx.restore();
}
function drawScreenFlash(){
  if(flashT<=0) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.min(0.5,flashT); ctx.fillStyle=flashCol; ctx.fillRect(0,0,W,H); ctx.restore();
}
function drawPopups(){
  for(var i=0;i<popups.length;i++){
    var q=popups[i]; var a=Math.min(1,q.life/(q.max*0.6));
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(q.big?Math.max(20,Math.min(40,W*0.038)):15)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=q.color; ctx.shadowColor=q.color; ctx.shadowBlur=q.big?20:8;

}

function drawBadge(agent, x, y, r, glow){
  var rec=PORTRAITS[agent.key];
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
  if(glow){ ctx.shadowColor=agent.color; ctx.shadowBlur=12; }
  ctx.fillStyle='#111'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-1.5,0,6.283); ctx.clip();
  if(rec && rec.ok){ var d=r*2.2; ctx.drawImage(rec.img, x-d/2, y-d/2-r*0.1, d, d); }
  else { ctx.fillStyle=rgba(agent.color,0.35); ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.fillStyle=agent.color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(r*0.95)+"px 'Orbitron',sans-serif"; ctx.fillText(agent.init, x, y); }
  ctx.restore();
  ctx.lineWidth=2.5; ctx.strokeStyle=agent.color;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
  ctx.restore();
}

  ctx.fillText(G.playerAgent.key, 14+br*2+8, HUD_TOP+10); ctx.shadowBlur=0;
  ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
  ctx.fillText(WATCH_ON?'TEAM A':'YOU', 14+br*2+8, HUD_TOP+30);

  ctx.font="800 "+Math.max(13,Math.min(18,W*0.016))+"px 'Orbitron',sans-serif";

  ctx.fillText(WATCH_ON?'TEAM B':'CPU', W-14-br*2-8, HUD_TOP+30);
