<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHADDAI Buildings — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
} }</script>
<style>html,body{margin:0;height:100%;background:#04060d;overflow:hidden}#hud{position:fixed;top:12px;left:16px;z-index:5;font-family:Orbitron,monospace;color:#ffcf4a;font-size:13px;letter-spacing:3px;text-shadow:0 0 12px rgba(255,207,74,.6)}#sub{font-size:9px;color:#27e0ff;letter-spacing:2px}</style>
</head><body>
<div id="hud">SHADDAI · DISTRICT PREVIEW<div id="sub">temple · market hub · library · nexus · esoteric portal</div></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildShaddaiBuildings } from './world-buildings.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);
scene.fog = new THREE.FogExp2(0x04060d, 0.0016);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
const q = new URLSearchParams(location.search);
const cam = (q.get('cam')||'aerial');
const CAMS = {
  aerial:  [70, 95, 150],   // 3/4 overview of the district
  temple:  [40, 22, 60],    // close on the temple
  inside:  [6, 10, -8],     // inside the temple hall
  street:  [110, 8, 70],    // ground level near market hub
};
const cp = CAMS[cam] || CAMS.aerial;
camera.position.set(cp[0], cp[1], cp[2]);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(cam==='temple'||cam==='inside'?0:0, cam==='inside'?10:8, cam==='temple'||cam==='inside'?-40:0);
controls.update();

scene.add(new THREE.AmbientLight(0x2a3550, 0.8));
const sun = new THREE.DirectionalLight(0xbfd4ff, 1.1); sun.position.set(80,140,60); scene.add(sun);
const fill = new THREE.PointLight(0xffcf4a, 0.6, 400); fill.position.set(0,60,0); scene.add(fill);
// starfield
{ const N=1200,p=new Float32Array(N*3); for(let i=0;i<N;i++){const r=400+Math.random()*900,th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=Math.abs(r*Math.cos(ph))*0.7+40;p[i*3+2]=r*Math.sin(ph)*Math.sin(th);} const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(gg,new THREE.PointsMaterial({color:0xaecbff,size:1.4,transparent:true,opacity:.8}))); }

const city = buildShaddaiBuildings(THREE, scene, { addWater:true });
window.__city = city; window.__scene = scene;

const clock = new THREE.Clock();
let auto = q.get('spin') !== '0';
function animate(){ requestAnimationFrame(animate); const dt=Math.min(0.05,clock.getDelta()); const t=clock.elapsedTime;
  city.update(t, dt);
  if (auto && cam==='aerial'){ const r=185, a=t*0.06; camera.position.set(Math.cos(a)*r, 95, Math.sin(a)*r); controls.target.set(0,8,0); controls.update(); }
  renderer.render(scene, camera);
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body></html>
