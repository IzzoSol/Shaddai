<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colosseum Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #06080b; font-family: 'Space Grotesk', system-ui, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #e7f3ee;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(6, 8, 11, 0.8);
      border: 1px solid #1c2624;
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 10;
      line-height: 1.6;
    }
    #ui b { color: #00ff9c; }
    button {
      margin-top: 8px;
      padding: 6px 12px;
      background: rgba(0, 255, 156, 0.2);
      border: 1px solid #00ff9c;
      color: #00ff9c;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    button:hover { background: rgba(0, 255, 156, 0.35); }
  </style>
</head>
<body>
  <div id="ui">
    <b>SHADDAI COLOSSEUM</b><br>
    <small>Drag to look · Scroll to zoom</small><br>
    <br>
    <b>Theme:</b><br>
    <button onclick="setTheme('classic')">Classic</button>
    <button onclick="setTheme('royal')">Royal</button>
    <button onclick="setTheme('night')">Night</button>
    <button onclick="setTheme('festival')">Festival</button>
    <br>
    <b>Field:</b><br>
    <button onclick="setField('sand')">Sand</button>
    <button onclick="setField('soccer')">Soccer</button>
    <button onclick="setField('tactics')">Tactics</button>
    <button onclick="setField('team-attack')">Team Attack</button>
    <button onclick="setField('party')">Party</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Basic Three.js setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06080b);
    scene.fog = new THREE.Fog(0x06080b, 100, 500);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 30, 80);
    camera.lookAt(0, 20, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Load colosseum
    const { buildColosseumArena } = await import('./world-colosseum.js');
    const arena = buildColosseumArena(THREE, { scene });
    scene.add(arena);

    // Make it visible
    arena.visible = true;

    // Camera controls
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    const cameraRotation = { x: 0, y: 0 };

    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;
      cameraRotation.y += deltaX * 0.01;
      cameraRotation.x += deltaY * 0.01;
      camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -deltaX * 0.01);
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Zoom
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      const direction = camera.position.clone().normalize();
      const distance = camera.position.length();
      const newDistance = distance + e.deltaY * 0.1;
      camera.position.copy(direction.multiplyScalar(Math.max(20, Math.min(300, newDistance))));
    });

    // Global functions for theme/field switching
    window.setTheme = (themeName) => {
      if (arena.setTheme) arena.setTheme(themeName);
    };

    window.setField = (fieldName) => {
      if (arena.setField) arena.setField(fieldName);
    };

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
