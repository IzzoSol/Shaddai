  ctx.fillStyle = G.clock<15?'#ff1a1a':GOLD; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
  ctx.fillText(mm+':'+(ss<10?'0':'')+ss, midX, HUD_TOP+52); ctx.shadowBlur=0;
  var scNum=Math.ceil(G.shotClock);
  ctx.font="800 "+Math.max(12,Math.min(16,W*0.015))+"px 'Orbitron',sans-serif";
  ctx.fillStyle = scNum<=5?'#ff4d00':'#fff'; if(scNum<=5){ ctx.shadowColor='#ff4d00'; ctx.shadowBlur=10; }
  ctx.fillText('⏱ '+scNum, midX, HUD_TOP+76); ctx.shadowBlur=0;
  ctx.font="9px 'Share Tech Mono',monospace"; ctx.fillStyle='#8fd';
  ctx.fillText('FIRST TO '+WIN_SCORE+'  ·  CAM '+camName[camMode], midX, HUD_TOP+96);

  // callout banner (announcer)
  if(G.calloutT>0 && G.callout){
    var ca=Math.min(1,G.calloutT/0.5);
    ctx.save(); ctx.globalAlpha=ca; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.translate(W/2, H*(G.calloutBig?0.30:0.34));
    ctx.rotate((1-ca)*0.05*Math.sin(perfNow*0.02));
    var fsz=G.calloutBig?Math.max(24,Math.min(52,W*0.05)):Math.max(18,Math.min(34,W*0.032));
    ctx.font="900 "+fsz+"px 'Orbitron',sans-serif";
    ctx.lineWidth=6; ctx.strokeStyle='#000'; ctx.strokeText(G.callout,0,0);
    ctx.fillStyle=G.calloutCol; ctx.shadowColor=G.calloutCol; ctx.shadowBlur=18;
    ctx.fillText(G.callout, 0, 0);
    ctx.restore();
  }

  // bottom bars: turbo + gamebreaker (player only)
  if(G.state==='PLAY' && !WATCH_ON && !AP.on){
    var a=activeRef;
    var bx=14, by=H-56, bw=170, bh=12;
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(bx,by,bw,bh);
    var tf=a?a.turbo/TURBO_MAX:0;
    var onF=a&&a.onFire;
    if(onF){ var tg=ctx.createLinearGradient(bx,0,bx+bw,0); tg.addColorStop(0,'#ff2b00'); tg.addColorStop(1,GOLD); ctx.fillStyle=tg; ctx.fillRect(bx,by,bw,bh); }
    else { ctx.fillStyle = tf<0.25?'#ff6a2a':GN; if(tf<0.25){ctx.shadowColor='#ff6a2a';ctx.shadowBlur=12;} ctx.fillRect(bx,by,bw*tf,bh); ctx.shadowBlur=0; }
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.strokeRect(bx,by,bw,bh);
    ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#7fe'; ctx.textAlign='left';
    ctx.fillText(onF?'🔥 ON FIRE — UNLIMITED':'TURBO (Z)', bx, by-12);

    // GAMEBREAKER meter
    var capA=null;
    for(var ci=0;ci<teamA.length;ci++){ if(teamA[ci].captain){ capA=teamA[ci]; break; } }
    if(capA){
      var px=bx, py=by-40, pw=170, ph=16;
      var ready=capA.meter>=GAMEBREAK_NEED && capA.alive;
      var hotNow=capA.takeoverT>0;
      var pulse=0.6+0.4*Math.sin(perfNow*0.008);
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(px,py,pw,ph,5); ctx.fill();
      var frac = hotNow? (capA.takeoverT/TAKEOVER_TIME) : (capA.meter/GAMEBREAK_NEED);
      var barCol = hotNow?GOLD:(ready?capA.color:'#5a3fa0');
      ctx.fillStyle=barCol; if(ready||hotNow){ctx.shadowColor=barCol;ctx.shadowBlur=hotNow?14:10*pulse;}
      roundRect(px,py,pw*Math.max(0,Math.min(1,frac)),ph,5); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,0.28)'; roundRect(px,py,pw,ph,5); ctx.stroke();
      ctx.font="800 9px 'Orbitron',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle= hotNow?'#111':(ready?'#031':'#cbe');
      ctx.fillText(hotNow?'★ GAMEBREAKER ACTIVE':(ready?'★ GAMEBREAKER READY (Q)':'★ GAMEBREAKER '+Math.round(capA.meter)+'%'), px+pw/2, py+ph/2);
      ctx.restore();
      ctx.textAlign='left'; ctx.textBaseline='top';
    }
    if(a&&a.hasBall){
      var cbx=bx+bw+14, cbw=150;
      ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(cbx,by,cbw,bh);
      // sweet-spot band
      ctx.fillStyle='rgba(0,255,136,0.25)'; ctx.fillRect(cbx+cbw*0.5,by,cbw*0.42,bh);
      ctx.fillStyle=GOLD; ctx.fillRect(cbx,by,cbw*(a.charge||0),bh);
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.strokeRect(cbx,by,cbw,bh);
      ctx.fillStyle='#fe7'; ctx.fillText('HOLD SPACE = AIM (green=perfect)', cbx, by-12);
    }
  }

  if(G.introT>0 && G.state==='PLAY'){
    var alpha=Math.min(1,G.introT/0.4);
    ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="900 "+Math.max(20,Math.min(40,W*0.038))+"px 'Orbitron',sans-serif";
    ctx.fillStyle=G.playerAgent.color; ctx.shadowColor=G.playerAgent.color; ctx.shadowBlur=18;
    ctx.fillText(G.playerAgent.key+"  VS  "+G.cpuAgent.key, W/2, H*0.44);
    ctx.restore();
  }
}

/* ============================ TEAM SELECT ============================ */
var sel={ you:1, cpu:4, cursor:1 };
var cardRects=[];
var startBtn={x:0,y:0,w:0,h:0};
var shuffleBtn={x:0,y:0,w:0,h:0};

function computeCards(){
  cardRects=[];
  var n=AGENTS.length;
  var cols = W<760 ? 4 : 7;
  var rows = Math.ceil(n/cols);
  var topY = topPad+6;
  var availH = H-topY-140;
  var gap = Math.max(8, W*0.012);
  var cw = Math.min((W-gap*(cols+1))/cols, 160);
  var ch = Math.min(cw*1.5, availH/rows - gap);
  if(ch<80) ch=80;
  for(var i=0;i<n;i++){
    var c=i%cols, r=Math.floor(i/cols);
    var rowCount = (r===rows-1) ? (n-(rows-1)*cols) : cols;
    var rowW = rowCount*cw+(rowCount-1)*gap;
    var rowStartX = (W-rowW)/2;
    var x=rowStartX + c*(cw+gap);
    var y=topY + Math.max(10,(availH-(rows*ch+(rows-1)*gap))/2) + r*(ch+gap);
    cardRects.push({x:x,y:y,w:cw,h:ch,idx:i});
  }
  var bh=48, by=H-96;
  var shufW=Math.min(150,W*0.26), startW=Math.min(190,W*0.32);
  var bgap=Math.max(10,W*0.014);
  var totalW=shufW+startW+bgap;
  var bx0=(W-totalW)/2;
  shuffleBtn={x:bx0, y:by, w:shufW, h:bh};
  startBtn  ={x:bx0+shufW+bgap, y:by, w:startW, h:bh};
}
function drawSelect(){
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0a0620'); bg.addColorStop(0.5,'#160a35'); bg.addColorStop(1,'#04030f');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,240,255,0.05)'; ctx.lineWidth=1;
  for(var gx=0; gx<W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(var gy=0; gy<H; gy+=40){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font=Math.max(11,Math.min(15,W*0.015))+"px 'Share Tech Mono',monospace"; ctx.fillStyle=GOLD;
  ctx.shadowColor=GOLD; ctx.shadowBlur=8;
  ctx.fillText('PICK YOUR BALLER  ·  YOU + CPU  ·  2v2 STREET JAM  ·  NEXT: SELECT MODE', W/2, topPad-16);
  ctx.shadowBlur=0;

  computeCards();
  for(var i=0;i<cardRects.length;i++){
    var cr=cardRects[i], ag=AGENTS[cr.idx];
    var isYou = sel.you===cr.idx, isCpu = sel.cpu===cr.idx, isCur=sel.cursor===cr.idx;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(cr.x,cr.y,cr.w,cr.h,10); ctx.fill();
    // portrait region = real character image
    ctx.save(); roundRect(cr.x+4,cr.y+4,cr.w-8,cr.h-42,8); ctx.clip();
    var pg=ctx.createLinearGradient(cr.x,cr.y,cr.x,cr.y+cr.h);
    pg.addColorStop(0,rgba(ag.color,0.20)); pg.addColorStop(1,'rgba(0,0,0,0.4)');
    ctx.fillStyle=pg; ctx.fillRect(cr.x,cr.y,cr.w,cr.h);
    var rec=PORTRAITS[ag.key];
    if(rec && rec.ok){
      var iw=cr.w-8, ih=cr.h-42;
      // cover-fit the portrait
      var ar=rec.img.width/rec.img.height || 1;
      var dw=iw, dh=iw/ar; if(dh<ih){ dh=ih; dw=ih*ar; }
      ctx.globalAlpha=0.95;
      ctx.drawImage(rec.img, cr.x+4+(iw-dw)/2, cr.y+4+(ih-dh)/2, dw, dh);
      ctx.globalAlpha=1;
    } else {
      drawCardFallback(ag, cr.x+cr.w/2, cr.y+(cr.h-42)*0.5, Math.min(cr.w,cr.h)*0.3);
    }
    var fg=ctx.createLinearGradient(0,cr.y+cr.h-56,0,cr.y+cr.h-4);
    fg.addColorStop(0,'rgba(0,0,0,0)'); fg.addColorStop(1,'rgba(0,0,0,0.82)');
    ctx.fillStyle=fg; ctx.fillRect(cr.x,cr.y+cr.h-56,cr.w,52);
    ctx.restore();
    // stat bars
    var sVals=[['SPD',ag.stats.spd],['SHT',ag.stats.sht],['DNK',ag.stats.dnk],['DEF',ag.stats.def]];
    var sBH=Math.max(3,cr.h*0.026), sGap=Math.max(2,cr.h*0.012);
    var sTotal=sVals.length*sBH+(sVals.length-1)*sGap;
    var sY=cr.y+(cr.h-42)-sTotal-6;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)'; roundRect(cr.x+4, sY-5, cr.w-8, sTotal+10, 6); ctx.fill();
    var labelW=cr.w*0.22, bx0=cr.x+8+labelW, bw0=cr.w-16-labelW;
    ctx.textBaseline='middle';
    for(var s=0;s<sVals.length;s++){
      var yy=sY+s*(sBH+sGap);
      ctx.textAlign='left'; ctx.fillStyle='#8fe';
      ctx.font=Math.max(7,Math.min(11,cr.w*0.075))+"px 'Share Tech Mono',monospace";
      ctx.fillText(sVals[s][0], cr.x+8, yy+sBH/2);
      ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(bx0,yy,bw0,sBH);
      ctx.fillStyle=ag.color; ctx.fillRect(bx0,yy,bw0*(sVals[s][1]/5),sBH);
    }
    ctx.restore();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=ag.color; ctx.shadowColor=ag.color; ctx.shadowBlur=8;
    ctx.font="800 "+Math.max(11,Math.min(16,cr.w*0.13))+"px 'Orbitron',sans-serif";
    ctx.fillText(ag.key, cr.x+cr.w/2, cr.y+cr.h-24); ctx.shadowBlur=0;
    ctx.fillStyle='#bfe'; ctx.font=Math.max(7,Math.min(10,cr.w*0.08))+"px 'Share Tech Mono',monospace";
    ctx.fillText((ag.tag||'').toUpperCase(), cr.x+cr.w/2, cr.y+cr.h-10);
    var bcol=ag.color, bw=2;
    if(isYou){ bcol=CY; bw=4; } else if(isCpu){ bcol='#ff3a3a'; bw=4; }
    ctx.strokeStyle=bcol; ctx.lineWidth=bw;
    if(isYou||isCpu){ ctx.shadowColor=bcol; ctx.shadowBlur=14; }
    roundRect(cr.x,cr.y,cr.w,cr.h,10); ctx.stroke(); ctx.shadowBlur=0;
    if(isYou||isCpu){
      ctx.fillStyle=isYou?CY:'#ff3a3a'; ctx.font="800 11px 'Orbitron',sans-serif";
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(isYou?'YOU':'CPU', cr.x+6, cr.y+6);
    }
    if(isCur){
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
      var pu=0.5+0.5*Math.sin(perfNow*0.008);
      ctx.globalAlpha=0.5+pu*0.5;
      roundRect(cr.x-3,cr.y-3,cr.w+6,cr.h+6,12); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  var ready = sel.you!=null;
  drawSelBtn(shuffleBtn,'⟳ SHUFFLE','#b06bff', true);
  drawSelBtn(startBtn, ready?'▶ NEXT':'PICK A BALLER', ready?GN:'#666', ready);

  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font=Math.max(10,Math.min(13,W*0.013))+"px 'Share Tech Mono',monospace"; ctx.fillStyle='#8ff';
  ctx.fillText('ARROWS / WASD move   ·   SPACE pick   ·   ENTER next   ·   R shuffle   ·   ESC exit', W/2, H-14);
}
function drawCardFallback(ag, cx, cy, u){
  ctx.save();
  var col=ag.color;
  var headR=u*1.15;
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(cx,cy,headR+u*0.1,0,6.283); ctx.fill();
  ctx.fillStyle=rgba(col,0.5); ctx.beginPath(); ctx.arc(cx,cy,headR,0,6.283); ctx.fill();
  ctx.fillStyle='#000'; ctx.font="900 "+(headR*1.1).toFixed(0)+"px 'Orbitron',sans-serif";
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ag.init, cx, cy);
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,u*0.15); ctx.shadowColor=col; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx,cy,headR,0,6.283); ctx.stroke();
  ctx.restore();
}
function drawSelBtn(b,label,color,enabled){
  ctx.save();
  ctx.globalAlpha=enabled?1:0.5;
  var bg=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
  bg.addColorStop(0, enabled?rgba(color,0.16):'rgba(0,0,0,0.6)');
  bg.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle=bg; roundRect(b.x,b.y,b.w,b.h,12); ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2.5;
  if(enabled){ ctx.shadowColor=color; ctx.shadowBlur=14; }
  roundRect(b.x,b.y,b.w,b.h,12); ctx.stroke(); ctx.shadowBlur=0;
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=color; ctx.shadowBlur=enabled?8:0;
  ctx.font="800 "+Math.max(14,Math.min(20,b.w*0.11))+"px 'Orbitron',sans-serif";
  ctx.fillText(label, b.x+b.w/2, b.y+b.h/2);
  ctx.restore();
}

function drawModeSelect(){

  var you=(sel.you!=null?AGENTS[sel.you]:G.playerAgent), cpu=G.cpuAgent;
  ctx.font=Math.max(11,Math.min(15,W*0.015))+"px 'Share Tech Mono',monospace"; ctx.fillStyle='#8ff';
  ctx.fillText((you?you.key:'YOU')+'   vs   '+(cpu?cpu.key:'CPU')+'    ·    2v2  ·  FIRST TO '+WIN_SCORE, W/2, H*0.235);

  var n=MODE_DEFS.length;
  var cw=Math.min(280, (W-80)/n - 18), ch=Math.min(H*0.42, 300);
  var gap=Math.max(14,W*0.02);
  var totalW=n*cw+(n-1)*gap, startX=(W-totalW)/2, cy=H*0.52-ch/2;
  modeBtns=[];
  for(var i=0;i<n;i++){
    var m=MODE_DEFS[i], cx=startX+i*(cw+gap);
    var isCur=(i===modeCursor);
    modeBtns.push({x:cx,y:cy,w:cw,h:ch,id:m.id});
    ctx.save();
    var g=ctx.createLinearGradient(cx,cy,cx,cy+ch);
    g.addColorStop(0, isCur?rgba(m.color,0.22):'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle=g; roundRect(cx,cy,cw,ch,16); ctx.fill();
    ctx.strokeStyle=m.color; ctx.lineWidth=isCur?4:2;
    if(isCur){ ctx.shadowColor=m.color; ctx.shadowBlur=24; }
    roundRect(cx,cy,cw,ch,16); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=m.color; ctx.shadowColor=m.color; ctx.shadowBlur=isCur?18:8;
    ctx.font="800 "+Math.max(40,ch*0.22)+"px 'Orbitron',sans-serif";
    ctx.fillText(m.icon, cx+cw/2, cy+ch*0.26); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font="800 "+Math.max(18,Math.min(28,cw*0.13))+"px 'Orbitron',sans-serif";
    ctx.fillText(m.title, cx+cw/2, cy+ch*0.50);
    ctx.fillStyle=m.color; ctx.font=Math.max(11,Math.min(14,cw*0.06))+"px 'Share Tech Mono',monospace";
    ctx.fillText(m.sub.toUpperCase(), cx+cw/2, cy+ch*0.63);
    ctx.fillStyle='#bfe'; ctx.font=Math.max(10,Math.min(12,cw*0.052))+"px 'Share Tech Mono',monospace";
    wrapText(m.desc, cx+cw/2, cy+ch*0.74, cw-28, 15);
    if(isCur){
      var pu=0.5+0.5*Math.sin(perfNow*0.008);
      ctx.globalAlpha=0.55+pu*0.45; ctx.fillStyle=m.color;
      ctx.font="800 "+Math.max(11,Math.min(14,cw*0.055))+"px 'Orbitron',sans-serif";
      ctx.fillText('▶ SELECT', cx+cw/2, cy+ch-20); ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font=Math.max(10,Math.min(13,W*0.013))+"px 'Share Tech Mono',monospace"; ctx.fillStyle='#8ff';
  ctx.fillText('◄ ► / A D  choose   ·   ENTER select   ·   T back   ·   ESC exit', W/2, H-14);
  ctx.restore();
}
function wrapText(text, cx, y, maxW, lh){
  var words=text.split(' '), line='', lines=[];
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
    else line=test;
  }
  if(line) lines.push(line);
  for(var j=0;j<lines.length;j++) ctx.fillText(lines[j], cx, y+j*lh);
}

/* ---- SKILLPLAY loadout screen ---- */
function drawSkillSelect(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(18,Math.min(36,W*0.034))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=MG; ctx.shadowColor=MG; ctx.shadowBlur=20;
  ctx.fillText('ACTIVATE ABILITIES', W/2, H*0.10); ctx.shadowBlur=0;
  var agObj=(sel.you!=null)?AGENTS[sel.you]:G.playerAgent;
  ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle=agObj?agObj.color:MG;
  ctx.fillText((agObj?agObj.key+' · ':'')+'ABILITY LOADOUT', W/2, H*0.155);
  ctx.font="11px 'Share Tech Mono',monospace"; ctx.fillStyle='#f9d';
  ctx.fillText('Pick up to '+skillPickMax+' — ★ = auto-matched to '+(agObj?agObj.key:'your agent')+"'s real skills", W/2, H*0.205);

  var N=SKILL_DEFS.length;
  var cols=(W>560)?2:1;
  var rows=Math.ceil(N/cols);
  var cardGap=Math.max(8,Math.min(14,W*0.014));
  var gridTop=H*0.24, gridBottom=H*0.83;
  var gridW=Math.min(W*0.92, cols*360 + (cols-1)*cardGap);
  var cardW=(gridW-(cols-1)*cardGap)/cols;
  var gridX=W/2-gridW/2;
  var cardH=Math.max(46,Math.min(84,(gridBottom-gridTop-(rows-1)*cardGap)/rows));
  skillBtns.length=0;
  for(var j=0;j<N;j++){
    var sk=SKILL_DEFS[j];
    var col=j%cols, row=Math.floor(j/cols);
    var bsx=gridX+col*(cardW+cardGap), bsy=gridTop+row*(cardH+cardGap);
    var picked=skillPicked.indexOf(j)>=0;
    var matched=agentMatchedIds.indexOf(sk.id)>=0;
    skillBtns.push({x:bsx,y:bsy,w:cardW,h:cardH,action:'skill',idx:j});
    ctx.save();
    ctx.fillStyle=picked?'rgba(255,43,214,0.18)':'rgba(4,12,10,0.65)';
    ctx.strokeStyle=picked?MG:(matched?'rgba(255,210,90,0.55)':'rgba(255,43,214,0.3)'); ctx.lineWidth=picked?2.5:(matched?1.8:1.1);
    ctx.shadowColor=picked?MG:(matched?'#ffd24a':MG); ctx.shadowBlur=picked?16:(matched?8:3);
    roundRect(bsx,bsy,cardW,cardH,9); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.textAlign='left';
    ctx.font=Math.max(16,cardH*0.34)+"px serif"; ctx.fillStyle=MG;
    ctx.fillText(sk.icon, bsx+cardH*0.34, bsy+cardH*0.5);
    ctx.font="800 "+Math.max(11,cardW*0.055)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=picked?MG:'#f9d'; ctx.shadowColor=picked?MG:'transparent'; ctx.shadowBlur=picked?6:0;
    ctx.fillText(sk.label, bsx+cardH*0.72, bsy+cardH*0.36); ctx.shadowBlur=0;
    ctx.font=Math.max(8,cardW*0.036)+"px 'Share Tech Mono',monospace"; ctx.fillStyle='rgba(200,150,220,0.82)';
    ctx.fillText(sk.desc, bsx+cardH*0.72, bsy+cardH*0.68);
    if(matched){
      ctx.textAlign='right'; ctx.font="800 "+Math.max(11,cardH*0.22)+"px 'Orbitron',sans-serif";
      ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffd24a'; ctx.shadowBlur=8;
      ctx.fillText(picked?'★✓':'★', bsx+cardW-9, bsy+cardH*0.26); ctx.shadowBlur=0;
    } else if(picked){
      ctx.textAlign='right'; ctx.font="800 "+Math.max(12,cardH*0.26)+"px 'Orbitron',sans-serif";
      ctx.fillStyle=MG; ctx.shadowColor=MG; ctx.shadowBlur=8;
      ctx.fillText('✓', bsx+cardW-9, bsy+cardH*0.28); ctx.shadowBlur=0;
    }
    ctx.textAlign='center'; ctx.restore();
  }
  var confY=gridTop+rows*(cardH+cardGap)+Math.max(10,H*0.02);
  var confW=Math.min(260,W*0.42), confH=Math.min(52,H*0.08);
  var confX=W/2-confW/2;
  skillBtns.push({x:confX,y:confY,w:confW,h:confH,action:'confirm'});
  var pulse2=0.65+0.35*Math.sin(perfNow*0.008);
  ctx.save(); ctx.globalAlpha=pulse2;
  ctx.fillStyle='rgba(255,43,214,0.20)'; ctx.strokeStyle=MG; ctx.lineWidth=2.5;
  ctx.shadowColor=MG; ctx.shadowBlur=20;
  roundRect(confX,confY,confW,confH,10); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  ctx.font="800 "+Math.max(14,confH*0.32)+"px 'Orbitron',sans-serif";
  ctx.fillStyle=MG; ctx.shadowColor=MG; ctx.shadowBlur=12;
  ctx.fillText((skillPicked.length>0?'▶ TIP-OFF WITH '+skillPicked.length+' SKILL'+(skillPicked.length>1?'S':''):'▶ TIP-OFF (NO SKILLS)'), W/2, confY+confH/2);
  ctx.shadowBlur=0; ctx.restore();
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font=Math.max(10,Math.min(13,W*0.013))+"px 'Share Tech Mono',monospace"; ctx.fillStyle='#8ff';
  ctx.fillText('CLICK/TAP a card to toggle   ·   ENTER start   ·   T back   ·   ESC exit', W/2, H-10);
  ctx.restore();
}
function pickCard(idx){
  audio();
  if(sel.you===idx){ sel.you=null; }
  else if(sel.cpu===idx){ sel.cpu=null; }
  else if(sel.you==null){ sel.you=idx; if(sel.cpu===idx) sel.cpu=null; }
  else { sel.cpu=idx; }
  sndSelect();
}
function shuffleTeams(){
  audio();
  sel.you=Math.floor(Math.random()*AGENTS.length);
  do{ sel.cpu=Math.floor(Math.random()*AGENTS.length); }while(sel.cpu===sel.you);
  sndSelect();
}
function confirmSelect(){
  if(sel.you==null) return;
  var c=sel.cpu;
  if(c==null || c===sel.you){ do{ c=Math.floor(Math.random()*AGENTS.length); }while(c===sel.you); }
  G.playerAgent=AGENTS[sel.you]; G.cpuAgent=AGENTS[c];
  gotoModeSelect();
}
function selectKey(k){
  if(G_MODESEL){
    if(k==='arrowleft'||k==='a'){ modeCursor=(modeCursor+MODE_DEFS.length-1)%MODE_DEFS.length; sndMove(); }
    else if(k==='arrowright'||k==='d'){ modeCursor=(modeCursor+1)%MODE_DEFS.length; sndMove(); }
    else if(k==='enter'||k==='space'){ chooseMode(MODE_DEFS[modeCursor].id); }
    else if(k==='t'){ G_MODESEL=false; }
    return;
  }
  if(G_SKILLSEL){
    if(k==='enter'||k==='space'){ confirmSkillPlay(); }
    else if(k==='t'){ G_SKILLSEL=false; gotoModeSelect(); }
    return;
  }
  var cols = W<760 ? 4 : 7, n=AGENTS.length;
  if(k==='arrowleft'||k==='a'){ sel.cursor=(sel.cursor+n-1)%n; sndMove(); }
  else if(k==='arrowright'||k==='d'){ sel.cursor=(sel.cursor+1)%n; sndMove(); }
  else if(k==='arrowup'||k==='w'){ sel.cursor=(sel.cursor+n-cols)%n; sndMove(); }
  else if(k==='arrowdown'||k==='s'){ sel.cursor=(sel.cursor+cols)%n; sndMove(); }
  else if(k==='space'){ pickCard(sel.cursor); }
  else if(k==='enter'){ confirmSelect(); }
  else if(k==='r'){ shuffleTeams(); }
}

/* ============================ OVER ============================ */
function drawOver(){
  ctx.save();
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0a0620'); bg.addColorStop(1,'#04030f');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var win=G.winner==='A';
  var wa=win?G.playerAgent:G.cpuAgent;
  var col=win?wa.color:'#ff1a1a';
  drawBadge(wa, W/2, H*0.18, Math.max(38,Math.min(66,W*0.066)), true);
  ctx.font="800 "+Math.max(28,Math.min(80,W*0.08))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(win?'VICTORY!':'DEFEAT', W/2, H*0.35); ctx.shadowBlur=0;
  ctx.font="15px 'Orbitron',sans-serif"; ctx.fillStyle=wa.color;
  ctx.fillText(win? wa.key+' TAKES THE JAM' : G.cpuAgent.key+' TAKES THE JAM', W/2, H*0.44);
  ctx.font="800 "+Math.max(24,Math.min(44,W*0.04))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=GOLD; ctx.shadowColor=GOLD; ctx.shadowBlur=18;
  ctx.fillText('FINAL  '+G.scoreA+' - '+G.scoreB, W/2, H*0.53); ctx.shadowBlur=0;
  ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText('BUCKETS '+G.madeA+'   ·   DUNKS '+G.dunksA+'   ·   STEALS '+G.stealsA+'   ·   SCORE '+finalScore(), W/2, H*0.60);
  var pulse=0.6+0.4*Math.sin(perfNow*0.006);
  ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(15,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=16;
  ctx.fillText('R — REMATCH      ·      T — CHANGE BALLER      ·      ESC — EXIT', W/2, H*0.70);
  ctx.restore();
}

/* ============================ MENU MOUSE ============================ */
function inRect(r,x,y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
canvas.addEventListener('pointerdown', function(e){
  if(AP.on) return;
  audio();
  var x=e.clientX, y=e.clientY;
  if(G.state==='SELECT'){
    if(G_MODESEL){
      for(var mi=0;mi<modeBtns.length;mi++){ if(inRect(modeBtns[mi],x,y)){ modeCursor=mi; chooseMode(modeBtns[mi].id); return; } }
      return;
    }
    if(G_SKILLSEL){
      for(var si=0;si<skillBtns.length;si++){
        var sb=skillBtns[si];
        if(x>=sb.x&&x<=sb.x+sb.w&&y>=sb.y&&y<=sb.y+sb.h){
          if(sb.action==='confirm'){ confirmSkillPlay(); return; }
          if(sb.action==='skill'){
            var idx=sb.idx, already=skillPicked.indexOf(idx);
            if(already>=0){ skillPicked.splice(already,1); sndMove(); }
            else if(skillPicked.length<skillPickMax){ skillPicked.push(idx); sndSelect(); }
            applySkillBoosts(); return;
          }
        }
      }
      return;
    }
    for(var i=0;i<cardRects.length;i++){ if(inRect(cardRects[i],x,y)){ sel.cursor=cardRects[i].idx; pickCard(cardRects[i].idx); return; } }
    if(inRect(startBtn,x,y)){ confirmSelect(); return; }
    if(inRect(shuffleBtn,x,y)){ shuffleTeams(); return; }
    return;
  }
  if(G.state==='OVER'){ restartMatch(); return; }
});

/* ============================ TOUCH CONTROLS ============================ */
var IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
var touchMove={active:false,x:0,y:0};
var touchTurbo=false;
(function(){
  var stick=document.getElementById('stick'), nub=stick?stick.querySelector('.nub'):null;
  if(stick){
    var sid=null, cx=0, cy=0, rad=60;
    function start(e){ var t=e.changedTouches?e.changedTouches[0]:e; sid=e.changedTouches?t.identifier:'m';
      var r=stick.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; touchMove.active=true; move(e); e.preventDefault(); }
    function move(e){ if(!touchMove.active) return;
      var t=null; if(e.changedTouches){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===sid){ t=e.changedTouches[i]; break; } } } else t=e;
      if(!t) return;
      var dx=t.clientX-cx, dy=t.clientY-cy, d=Math.hypot(dx,dy)||1;
      var k=Math.min(1,d/rad); touchMove.x=dx/d*k; touchMove.y=dy/d*k;
      if(nub){ var nd=Math.min(d,rad); nub.style.transform='translate('+(dx/d*nd)+'px,'+(dy/d*nd)+'px)'; }
      e.preventDefault();
    }
    function end(e){ touchMove.active=false; touchMove.x=0; touchMove.y=0; if(nub) nub.style.transform='translate(0,0)'; }
    stick.addEventListener('touchstart',start,{passive:false});
    stick.addEventListener('touchmove',move,{passive:false});
    stick.addEventListener('touchend',end); stick.addEventListener('touchcancel',end);
    stick.addEventListener('mousedown',start); window.addEventListener('mousemove',function(e){ if(touchMove.active&&sid==='m') move(e); }); window.addEventListener('mouseup',function(){ if(sid==='m') end(); });
  }
  function bindBtn(id, downFn, upFn){
    var el=document.getElementById(id); if(!el) return;
    el.addEventListener('touchstart',function(e){ audio(); downFn(); e.preventDefault(); },{passive:false});
    el.addEventListener('touchend',function(e){ if(upFn) upFn(); e.preventDefault(); },{passive:false});
    el.addEventListener('mousedown',function(e){ audio(); downFn(); e.preventDefault(); });
    el.addEventListener('mouseup',function(e){ if(upFn) upFn(); e.preventDefault(); });
  }
  bindBtn('tShoot', function(){ if(!WATCH_ON) actionDown(); }, function(){ if(!WATCH_ON) actionUp(); });
  bindBtn('tPass', function(){ if(!WATCH_ON) doPass(); });
  bindBtn('tShove', function(){ if(!WATCH_ON) doShove(); });
  bindBtn('tTurbo', function(){ touchTurbo=true; }, function(){ touchTurbo=false; });
  bindBtn('tCap', function(){ if(!WATCH_ON) doCaptainSpecial(); });
  bindBtn('tView', function(){ cycleCamera(); });
})();

/* ============================ MAIN LOOP ============================ */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  perfNow=now;

  if(AP.on) apDirector(dt);
  if(G.state==='PLAY') updatePlay(dt);
  if(G.state==='PLAY'||G.state==='OVER') updateCamera(dt);
  updateParticles(dt);

  if(shakeMag>0.2){
    shakeX=(Math.random()*2-1)*shakeMag; shakeY=(Math.random()*2-1)*shakeMag;
    shakeMag*=Math.pow(0.0015,dt); shakeMag-=dt*10; if(shakeMag<0)shakeMag=0;
  } else { shakeX=0; shakeY=0; shakeMag=0; }
  if(flashT>0){ flashT-=dt*1.6; if(flashT<0) flashT=0; }

  ctx.clearRect(0,0,W,H);

  var hintEl=document.getElementById('hint');
  if(hintEl){ hintEl.style.display=(G.state==='PLAY'&&!WATCH_ON&&!AP.on&&!IS_TOUCH)?'flex':'none'; }
  var touchEl=document.getElementById('touch');
  if(touchEl){ touchEl.style.display=(IS_TOUCH && G.state==='PLAY' && !AP.on)?'block':'none'; }

  if(G.state==='SELECT'){
    if(G_SKILLSEL) drawSkillSelect();
    else if(G_MODESEL){ drawSelect(); drawModeSelect(); }
    else drawSelect();
  } else {
    drawCourt();
    drawOrder.length=0;
    for(var oi=0;oi<players.length;oi++) drawOrder.push(players[oi]);
    drawOrder.sort(sortByY);
    // draw far players first, then ball inline by depth
    for(var i=0;i<drawOrder.length;i++) drawPlayer(drawOrder[i]);
    drawTrails();
    drawBall();
    drawParticles();
    drawScreenFlash();
    drawPopups();
    drawHUD();
    if(WATCH_ON && G.state==='PLAY'){
      ctx.save();
      var pu=0.6+0.4*Math.sin(perfNow*0.006);
      ctx.globalAlpha=pu; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.font="800 "+Math.max(12,Math.min(16,W*0.016))+"px 'Orbitron',sans-serif";
      ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=12;
      ctx.fillText('◈ SPECTATING — AI vs AI    ·    V CAMERA    ·    T EXIT', W/2, HUD_TOP+120);
      ctx.restore();
    }
    if(G.state==='OVER') drawOver();
  }
  requestAnimationFrame(frame);
}

/* ============================ BOOT ============================ */
resize();
newGame();
G.state='SELECT';
requestAnimationFrame(frame);

})();
</script>
