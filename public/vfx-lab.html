<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX lab</title>
<style>html,body{margin:0;height:100%;background:#06080b;overflow:hidden;color:#cfe;font:12px monospace}#hud{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
<script src="/world-vfx.js"></script></head>
<body><div id="hud"></div>
<script type="module">
/* VFX lab (light review page for world-vfx.js; no world): left = old PointsMaterial (hard squares), right = WorldVFX.softPointsMaterial;
   centre = every burst preset fired in a ring, a trail circling, a few decals. window.__lab exposes stats; ?loop=1 keeps re-firing. */
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const _close = /[?&]close=1/.test(location.search);   // ?close=1: gameplay distance (~6-9 m from the bursts), bursts read as they would in a fight
camera.position.set(0, _close ? 4 : 9, _close ? 9 : 24); camera.lookAt(0, _close ? 1.5 : 2, 0);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x202530, 1.2));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x1a1f28, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
function cloud(mat, x){ const n = 400, a = new Float32Array(n * 3); for (let i = 0; i < n; i++){ a[i*3] = x + (Math.random() - 0.5) * 6; a[i*3+1] = 1 + Math.random() * 6; a[i*3+2] = -6 + (Math.random() - 0.5) * 6; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(a, 3)); const p = new THREE.Points(g, mat); scene.add(p); return p; }
cloud(new THREE.PointsMaterial({ color: 0xffd27a, size: 0.35, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }), -9);   // the old look: squares
cloud(WorldVFX.softPointsMaterial(THREE, { color: 0xffd27a, size: 0.35, additive: true, opacity: 0.9 }), 9);                                                // the fix: soft round
const vfx = WorldVFX.create({ THREE, scene, camera, unit: 1, getTier: () => 'HIGH', getViewHeight: () => renderer.domElement.height, flash: () => {} });
const kinds = ['hit', 'dust', 'boost', 'loot', 'splash', 'muzzle', 'levelup', 'portal'];
function fire(){ kinds.forEach((k, i) => { const a = i / kinds.length * Math.PI * 2; vfx.burst(k, new THREE.Vector3(Math.cos(a) * 6, 1, Math.sin(a) * 6)); }); }
fire(); const tr = vfx.trail({ n: 40, width: 0.5, color: 0x00e5ff });
for (let i = 0; i < 6; i++) vfx.decals.add(new THREE.Vector3(-3 + i * 1.2, 0.02, 4), new THREE.Vector3(0, 1, 0), i % 2 ? 'scorch' : 'footprint', 1, 30);
const errs = []; const oe = console.error; console.error = function(){ errs.push([...arguments].join(' ').slice(0, 400)); oe.apply(console, arguments); };
let t = 0, last = performance.now(), fired = 0; const loop = /[?&]loop=1/.test(location.search);
window.__lab = { vfx, errs, stats: () => vfx.stats() };
renderer.setAnimationLoop(() => { const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  tr.push(new THREE.Vector3(Math.cos(t * 1.5) * 4, 2 + Math.sin(t * 3) * 0.5, Math.sin(t * 1.5) * 4));
  if (loop && t - fired > 1.5) { fire(); fired = t; }
  vfx.update(dt); renderer.render(scene, camera);
  document.getElementById('hud').textContent = 'left: old PointsMaterial (squares) | right: WorldVFX soft points\n' + JSON.stringify(vfx.stats()) + '\nprograms ' + renderer.info.programs.length + ' calls ' + renderer.info.render.calls + (errs.length ? '\nERRORS ' + errs.length : ''); });
</script></body></html>
