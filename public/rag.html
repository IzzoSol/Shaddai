<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/pin-gate.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SHADDAI · Brain</title>
<meta name="description" content="The SHADDAI brain — ask the council, see exactly what each agent knows, and read the sources behind every answer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="/sw-heal.js"></script>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<style>
:root{
  --void:#06080b; --panel:#0b1016; --card:#0e141b; --edge:rgba(120,150,140,.18); --edge2:rgba(120,150,140,.32);
  --ink:#e9efe9; --ink-soft:#93a49b; --ink-faint:#5d6b65;
  --emerald:#00ff9c; --gold:#e8c45c; --cyan:#5fe0ff; --ac:#00ff9c;
  --f-display:'Cinzel',serif; --f-ui:'Inter',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--void); color:var(--ink); font-family:var(--f-ui); -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:1px solid var(--emerald); outline-offset:2px; }

/* top bar */
.top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px clamp(14px,3vw,28px);
  background:rgba(6,8,11,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--edge); }
.brand{ font-family:var(--f-display); font-weight:900; letter-spacing:.14em; font-size:17px; }
.brand b{ color:var(--emerald); }
.stats{ margin-left:auto; display:flex; gap:18px; font-family:var(--f-mono); font-size:11px; color:var(--ink-soft); }
.stats b{ color:var(--ink); font-weight:600; }
.top .x{ width:36px; height:36px; display:grid; place-items:center; font-size:20px; color:var(--ink-soft); border-radius:4px; }
.top .x:hover{ color:var(--ink); background:rgba(255,255,255,.05); }

/* layout */
.wrap{ max-width:1240px; margin:0 auto; padding:clamp(14px,2.4vw,26px); display:grid; gap:clamp(14px,2.4vw,26px);
  grid-template-columns:minmax(300px,380px) 1fr; align-items:start; }
@media(max-width:900px){ .wrap{ grid-template-columns:1fr; } }

/* stage (agent) */
.stage{ position:sticky; top:74px; background:var(--panel); border:1px solid var(--edge); border-radius:10px; overflow:hidden;
  border-top:2px solid var(--ac); }
@media(max-width:900px){ .stage{ position:static; } }
.view{ position:relative; aspect-ratio:4/4.4; background:radial-gradient(120% 90% at 50% 20%, color-mix(in srgb,var(--ac) 22%, #0a0e13) 0%, #06080b 70%); }
@media(max-width:900px){ .view{ aspect-ratio:16/10; } }
.view img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 18%; transition:opacity .35s; }
.view canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.view .note{ position:absolute; left:12px; bottom:10px; font:500 10px var(--f-mono); letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase; }
.mode{ position:absolute; top:10px; right:10px; display:flex; border:1px solid var(--edge2); border-radius:6px; overflow:hidden; background:rgba(6,8,11,.7); backdrop-filter:blur(6px); }
.mode button{ padding:6px 12px; font:600 10px var(--f-mono); letter-spacing:.14em; color:var(--ink-soft); }
.mode button[aria-pressed=true]{ background:var(--ac); color:#04120c; }
.who{ padding:14px 16px 6px; }
.who h2{ font-family:var(--f-display); font-weight:900; font-size:22px; letter-spacing:.08em; color:var(--ac); }
.who .role{ font:500 11px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px; }
.who .focus{ font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }
.nums{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin:12px 16px; background:var(--edge); border:1px solid var(--edge); border-radius:6px; overflow:hidden; }
.nums div{ background:var(--card); padding:9px 10px; }
.nums b{ display:block; font:600 16px var(--f-mono); color:var(--ink); }
.nums span{ font:500 9.5px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
.pick{ display:flex; gap:6px; padding:0 16px 16px; flex-wrap:wrap; }
.pick button{ width:42px; height:42px; border-radius:50%; background-size:cover; background-position:50% 20%; border:2px solid transparent; opacity:.55; transition:.2s; }
.pick button:hover{ opacity:.9; }
.pick button[aria-pressed=true]{ opacity:1; border-color:var(--c); box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%, transparent); }

/* ask */
.ask{ display:flex; gap:10px; }
.ask input{ flex:1; min-width:0; min-height:54px; padding:0 18px; font:400 16px var(--f-ui); color:var(--ink); background:var(--panel);
  border:1px solid var(--edge2); border-radius:8px; outline:none; }
.ask input:focus{ border-color:var(--emerald); box-shadow:0 0 0 3px rgba(0,255,156,.1); }
.ask button{ padding:0 24px; border-radius:8px; background:var(--emerald); color:#04120c; font:600 13px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; }
.ask button:disabled{ opacity:.5; cursor:progress; }
.opts{ display:flex; align-items:center; gap:14px; margin:10px 2px 0; font:500 11px var(--f-mono); color:var(--ink-faint); letter-spacing:.06em; flex-wrap:wrap; }
.opts label{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.opts input{ accent-color:var(--emerald); }
.eg{ display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.eg button{ font:400 12px var(--f-ui); color:var(--ink-soft); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; }
.eg button:hover{ color:var(--emerald); border-color:var(--emerald); }

/* answer */
.ans{ margin-top:18px; background:var(--card); border:1px solid var(--edge); border-left:3px solid var(--ac); border-radius:8px; padding:18px 20px; display:none; }
.ans.on{ display:block; animation:rise .3s ease; }
@keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.ans .by{ font:600 10px var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--ac); }
.ans .txt{ margin-top:10px; font-size:15px; line-height:1.7; white-space:pre-wrap; }
.ans .meta{ margin-top:12px; font:500 10.5px var(--f-mono); color:var(--ink-faint); letter-spacing:.06em; }
.srcs{ margin-top:14px; border-top:1px solid var(--edge); padding-top:6px; }
.src{ border-bottom:1px solid var(--edge); }
.src:last-child{ border-bottom:0; }
.src > button{ width:100%; display:flex; gap:10px; align-items:baseline; text-align:left; padding:10px 0; }
.src .n{ font:600 11px var(--f-mono); color:var(--cyan); flex:0 0 auto; }
.src .t{ flex:1; font-size:13px; color:var(--ink); }
.src .s{ font:500 10px var(--f-mono); color:var(--ink-faint); flex:0 0 auto; }
.src .body{ display:none; padding:0 0 12px 28px; font-size:13px; line-height:1.65; color:var(--ink-soft); }
.src.open .body{ display:block; }
.src .body a{ color:var(--emerald); font:500 11px var(--f-mono); letter-spacing:.08em; }

/* knowledge */
h3.sec{ margin:30px 0 12px; font:600 11px var(--f-mono); letter-spacing:.2em; text-transform:uppercase; color:var(--gold); display:flex; gap:10px; align-items:baseline; }
h3.sec small{ font:500 10.5px var(--f-mono); color:var(--ink-faint); letter-spacing:.06em; text-transform:none; }
.topics{ display:flex; flex-wrap:wrap; gap:7px; }
.topics button{ font:500 12px var(--f-ui); color:var(--ink-soft); background:var(--card); border:1px solid var(--edge); border-radius:6px; padding:7px 11px; }
.topics button b{ color:var(--gold); font:600 10px var(--f-mono); margin-left:7px; }
.topics button:hover, .topics button[aria-pressed=true]{ color:var(--ink); border-color:var(--ac); }
.topics .primary{ border-color:color-mix(in srgb,var(--ac) 45%,transparent); }
.list{ display:grid; gap:8px; }
.item{ background:var(--card); border:1px solid var(--edge); border-radius:8px; }
.item > button{ width:100%; text-align:left; padding:12px 14px; display:flex; gap:12px; align-items:baseline; }
.item .t{ flex:1; font-size:13.5px; line-height:1.4; }
.item .s{ font:500 10px var(--f-mono); color:var(--ink-faint); flex:0 0 auto; }
.item .body{ display:none; padding:0 14px 14px; font-size:13px; line-height:1.65; color:var(--ink-soft); }
.item.open .body{ display:block; }
.item .body a{ color:var(--emerald); font:500 11px var(--f-mono); letter-spacing:.08em; }
.empty{ color:var(--ink-faint); font-size:13px; padding:14px 0; }
.skel{ height:44px; border-radius:8px; background:linear-gradient(90deg,var(--card),#121a23,var(--card)); background-size:200% 100%; animation:sk 1.2s linear infinite; }
@keyframes sk{ to{ background-position:-200% 0; } }
@media(prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">SHADDAI <b>BRAIN</b></div>
  <div class="stats" id="stats"><span>loading…</span></div>
  <a class="x" href="/" aria-label="Close">&times;</a>
</header>

<div class="wrap">
  <!-- the agent -->
  <aside class="stage" id="stage">
    <div class="view" id="view">
      <img id="portrait" alt="" />
      <div class="mode" role="group" aria-label="View mode">
        <button type="button" id="m2d" aria-pressed="true">2D</button>
        <button type="button" id="m3d" aria-pressed="false">3D</button>
      </div>
      <div class="note" id="vnote"></div>
    </div>
    <div class="who">
      <h2 id="aName">—</h2>
      <div class="role" id="aRole"></div>
      <div class="focus" id="aFocus"></div>
    </div>
    <div class="nums">
      <div><b id="nDocs">0</b><span>sources</span></div>
      <div><b id="nChunks">0</b><span>passages</span></div>
      <div><b id="nTopics">0</b><span>topics</span></div>
    </div>
    <div class="pick" id="pick" role="group" aria-label="Choose an agent"></div>
  </aside>

  <!-- ask + knowledge -->
  <main>
    <div class="ask">
      <input id="q" placeholder="Ask the brain anything it has studied…" aria-label="Ask the brain" autocomplete="off" />
      <button id="go" type="button">Ask</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="auto" checked /> Auto-route to the right agent</label>
      <span id="routeNote"></span>
    </div>
    <div class="eg" id="eg"></div>

    <section class="ans" id="ans" aria-live="polite">
      <div class="by" id="ansBy"></div>
      <div class="txt" id="ansTxt"></div>
      <div class="srcs" id="ansSrcs"></div>
      <div class="meta" id="ansMeta"></div>
    </section>

    <h3 class="sec">Topics <small id="topicHint">click one to read the passages behind it</small></h3>
    <div class="topics" id="topics"><div class="skel" style="width:100%"></div></div>
    <div class="list" id="topicHits" style="margin-top:12px"></div>

    <h3 class="sec">Sources <small id="srcCount"></small></h3>
    <div class="list" id="sources"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </main>
</div>

<script>
'use strict';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var safeUrl = function(u){ return /^https?:\/\//i.test(u||'') ? u : ''; };
var nf = new Intl.NumberFormat();
/* Transcripts come from auto-captions, which repeat themselves ("going to over on hosting going to over on hosting").
   Collapse any run of 2-10 words that repeats back-to-back, so excerpts read like text. */
function clean(t){
  t = String(t==null?'':t).replace(/\s+/g,' ').trim();
  for(var i=0;i<3;i++){ var n=t.replace(/((?:\S+\s+){2,10}?)\1+/gi,'$1'); if(n===t) break; t=n; }
  return t;
}

/* Canonical agent metadata: role, colour, what it is for. Portraits are the
   correct-likeness set in /assets/agents. */
var AGENTS = [
  {id:'SHADDAI', role:'Supreme Orchestrator',     col:'#c9a6ff', focus:'Strategy, prioritisation and the final call.'},
  {id:'NEXUS',   role:'Technical Architect',      col:'#5bc8d4', focus:'Backend, APIs, data and agent infrastructure.'},
  {id:'ZEROX',   role:'Revenue Engine',           col:'#b87fdf', focus:'Markets, pricing, money and crypto.'},
  {id:'ORACLE',  role:'Research & Intelligence',  col:'#f0d080', focus:'Research, psychology and pattern-finding.'},
  {id:'TURTLE',  role:'UI/UX & Creative',         col:'#4dd4a0', focus:'Design, art, motion and sound.'},
  {id:'QUILL',   role:'Writing & Communication',  col:'#e87f7f', focus:'Copy, docs and narrative.'},
  {id:'PIKADON', role:'Security & Compliance',    col:'#f0a060', focus:'Audit, risk and what could go wrong.'}
];
var EXAMPLES = ['How do I price a subscription?','What makes a launch thread work?','How do I check if a contract is safe?','How should an agent log its work?'];
var DATA = { ov:null, kmap:null }, cur = AGENTS[0];
var byId = function(id){ return AGENTS.filter(function(a){return a.id===id;})[0] || AGENTS[0]; };
var ovAgent = function(id){ return (DATA.ov && DATA.ov.agents || []).filter(function(a){return a.id===id;})[0] || {}; };
var getJSON = function(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); };

/* ── agent stage ── */
function setAgent(id, quiet){
  cur = byId(id);
  var o = ovAgent(cur.id);
  document.documentElement.style.setProperty('--ac', cur.col);
  $('aName').textContent = cur.id; $('aRole').textContent = cur.role; $('aFocus').textContent = cur.focus;
  $('nDocs').textContent = nf.format(o.docs||0); $('nChunks').textContent = nf.format(o.chunks||0);
  var subj = subjectsOf(cur.id); $('nTopics').textContent = nf.format(subj.length);
  $('portrait').src = '/assets/agents/' + cur.id + '-portrait.png';
  $('portrait').alt = cur.id + ' portrait';
  [].forEach.call($('pick').children, function(b){ b.setAttribute('aria-pressed', b.dataset.id===cur.id ? 'true':'false'); });
  if(viewMode==='3d') load3D(cur.id);
  if(!quiet){ renderTopics(); renderSources(); $('topicHits').innerHTML=''; }
}
function buildPicker(){
  $('pick').innerHTML = '';
  AGENTS.forEach(function(a){
    var b = document.createElement('button'); b.type='button'; b.dataset.id=a.id; b.title=a.id+' — '+a.role;
    b.setAttribute('aria-label', a.id); b.setAttribute('aria-pressed','false');
    b.style.setProperty('--c', a.col); b.style.backgroundImage="url('/assets/agents/"+a.id+"-portrait.png')";
    b.addEventListener('click', function(){ setAgent(a.id); });
    $('pick').appendChild(b);
  });
}
function subjectsOf(id){
  var k = DATA.kmap && DATA.kmap.agents ? DATA.kmap.agents.filter(function(x){return x.agent===id;})[0] : null;
  return (k && k.subjects) || [];
}

/* ── 2D / 3D (three.js loads only if you ask for 3D) ── */
var viewMode = '2d', T = null;
function setMode(m){
  viewMode = m;
  $('m2d').setAttribute('aria-pressed', m==='2d'?'true':'false');
  $('m3d').setAttribute('aria-pressed', m==='3d'?'true':'false');
  $('portrait').style.opacity = m==='2d' ? 1 : 0;
  if(m==='3d'){ load3D(cur.id); } else { stop3D(); $('vnote').textContent=''; }
}
function stop3D(){ if(T){ T.running=false; if(T.canvas) T.canvas.style.display='none'; } }
async function load3D(id){
  $('vnote').textContent = 'loading 3D…';
  try{
    if(!T){
      var THREE = await import('three');
      var G = await import('three/addons/loaders/GLTFLoader.js');
      var O = await import('three/addons/controls/OrbitControls.js');
      var canvas = document.createElement('canvas'); $('view').insertBefore(canvas, $('view').querySelector('.mode'));
      var r = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
      r.setPixelRatio(Math.min(devicePixelRatio||1, 1.75));
      var sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(28, 1, .1, 100);
      sc.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
      var key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2,3,4); sc.add(key);
      var rim = new THREE.DirectionalLight(0x66ffcc, 1.1); rim.position.set(-3,2,-3); sc.add(rim);
      var ctl = new O.OrbitControls(cam, canvas); ctl.enableZoom=false; ctl.enablePan=false; ctl.enableDamping=true;
      ctl.minPolarAngle=Math.PI*.38; ctl.maxPolarAngle=Math.PI*.58; ctl.autoRotate=true; ctl.autoRotateSpeed=1.2;
      T = {THREE:THREE, loader:new G.GLTFLoader(), r:r, sc:sc, cam:cam, ctl:ctl, canvas:canvas, model:null, running:false, cache:{}};
      new ResizeObserver(function(){ var w=$('view').clientWidth, h=$('view').clientHeight; r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }).observe($('view'));
      new IntersectionObserver(function(es){ if(viewMode==='3d' && es[0].isIntersecting) tick(); else T.running=false; }).observe($('view'));
    }
    T.canvas.style.display='block';
    var gltf = T.cache[id] || (T.cache[id] = await new Promise(function(ok,no){ T.loader.load('/assets/agents/'+id+'.glb', ok, undefined, no); }));
    if(cur.id !== id || viewMode!=='3d') return;
    if(T.model) T.sc.remove(T.model);
    T.model = gltf.scene; T.sc.add(T.model);
    // frame head + shoulders: aim at the upper part of the model's bounds
    var box = new T.THREE.Box3().setFromObject(T.model), size = box.getSize(new T.THREE.Vector3()), ctr = box.getCenter(new T.THREE.Vector3());
    var focusY = box.max.y - size.y*0.13, span = size.y*0.34;
    var dist = span / (2*Math.tan(T.THREE.MathUtils.degToRad(T.cam.fov/2)));
    T.cam.position.set(ctr.x, focusY, ctr.z + dist*1.55); T.ctl.target.set(ctr.x, focusY - size.y*0.015, ctr.z); T.ctl.update();
    $('vnote').textContent = 'drag to turn';
    tick();
  }catch(e){
    $('vnote').textContent = '3D unavailable for ' + id;
    setMode('2d');
  }
}
function tick(){
  if(!T || T.running) return; T.running = true;
  (function f(){ if(!T.running) return; T.ctl.update(); T.r.render(T.sc, T.cam); requestAnimationFrame(f); })();
}
$('m2d').addEventListener('click', function(){ setMode('2d'); });
$('m3d').addEventListener('click', function(){ setMode('3d'); });

/* ── ask: route to the right agent, then a grounded, cited answer ── */
function srcRow(s, i){
  var link = safeUrl(s.deepLink);
  return '<div class="src"><button type="button" aria-expanded="false"><span class="n">['+(i+1)+']</span><span class="t">'+esc(s.title||'source')+'</span>'+
    '<span class="s">'+(s.timeLabel?esc(s.timeLabel)+' · ':'')+(s.score||0).toFixed(2)+'</span></button>'+
    '<div class="body">'+esc(clean(s.snippet))+(s.snippet && s.snippet.length>=200?'…':'')+(link?' <a href="'+esc(link)+'" target="_blank" rel="noopener">open source →</a>':'')+'</div></div>';
}
function wireToggles(root){
  [].forEach.call(root.querySelectorAll('.src > button, .item > button'), function(b){
    b.addEventListener('click', function(){ var p=b.parentNode, o=p.classList.toggle('open'); b.setAttribute('aria-expanded', o?'true':'false'); });
  });
}
async function ask(){
  var q = $('q').value.trim(); if(!q) return;
  var go = $('go'); go.disabled = true; go.textContent = '…';
  $('ans').classList.add('on'); $('ansBy').textContent = 'thinking'; $('ansTxt').textContent=''; $('ansSrcs').innerHTML=''; $('ansMeta').textContent='';
  var agent = cur.id;
  try{
    if($('auto').checked){
      var r = await getJSON('/api/route?q='+encodeURIComponent(q));
      if(r && r.ranked && r.ranked.length){ agent = r.ranked[0].agent; $('routeNote').textContent = '→ '+agent+(r.matchedTopics&&r.matchedTopics.length?' · matched '+r.matchedTopics.slice(0,3).join(', '):''); if(agent!==cur.id) setAgent(agent); }
    } else { $('routeNote').textContent=''; }
    var d = await getJSON('/api/ask?agent='+encodeURIComponent(agent)+'&q='+encodeURIComponent(q));
    $('ansBy').textContent = (d.agent||agent) + (d.role?' · '+d.role:'');
    if(d.answer && d.llm_powered){
      $('ansTxt').textContent = clean(d.answer);
      $('ansSrcs').innerHTML = (d.sources||[]).map(srcRow).join(''); wireToggles($('ansSrcs'));
      $('ansMeta').textContent = (d.sources||[]).length+' sources · '+(d.ms||0)+' ms'+(d.llm_powered?' · written from those sources':' · excerpts only');
    } else if(d.sources && d.sources.length){
      $('ansTxt').textContent = 'No written answer is available right now. These are the closest passages the council has studied. Tap one to read it.';
      $('ansSrcs').innerHTML = d.sources.map(srcRow).join(''); wireToggles($('ansSrcs'));
      var first = $('ansSrcs').querySelector('.src'); if(first) first.classList.add('open');
      $('ansMeta').textContent = d.sources.length+' passages · '+(d.ms||0)+' ms';
    } else { $('ansTxt').textContent = 'Nothing grounded came back. Try rephrasing the question.'; }
  }catch(e){
    $('ansBy').textContent = 'unavailable'; $('ansTxt').textContent = 'The brain could not be reached. Try again in a moment.';
  }
  go.disabled = false; go.textContent = 'Ask';
}
$('go').addEventListener('click', ask);
$('q').addEventListener('keydown', function(e){ if(e.key==='Enter') ask(); });
EXAMPLES.forEach(function(t){ var b=document.createElement('button'); b.type='button'; b.textContent=t; b.addEventListener('click', function(){ $('q').value=t; ask(); }); $('eg').appendChild(b); });

/* ── knowledge: topics → passages, sources → digests ── */
function renderTopics(){
  var subj = subjectsOf(cur.id).slice(0, 36), el = $('topics'); el.innerHTML='';
  if(!subj.length){ el.innerHTML = '<div class="empty">No organised topics for '+esc(cur.id)+' yet.</div>'; return; }
  subj.forEach(function(s){
    var b=document.createElement('button'); b.type='button'; b.className = s.rank==='primary'?'primary':''; b.setAttribute('aria-pressed','false');
    b.innerHTML = esc(s.topic)+'<b>'+s.count+'</b>';
    b.addEventListener('click', function(){ [].forEach.call(el.children,function(x){x.setAttribute('aria-pressed','false');}); b.setAttribute('aria-pressed','true'); showTopic(s.topic); });
    el.appendChild(b);
  });
}
async function showTopic(t){
  var box = $('topicHits'); box.innerHTML = '<div class="skel"></div>';
  try{
    var d = await getJSON('/api/search?agent='+encodeURIComponent(cur.id)+'&k=6&q='+encodeURIComponent(t));
    var rs = d.results||[];
    box.innerHTML = rs.length ? rs.map(function(h){
      var link = safeUrl(h.deepLink);
      return '<div class="item"><button type="button" aria-expanded="false"><span class="t">'+esc(h.title||'passage')+'</span><span class="s">'+(h.timeLabel?esc(h.timeLabel):'')+'</span></button>'+
        '<div class="body">'+esc(clean((h.text||'').slice(0,1400)).slice(0,700))+(link?'<br><a href="'+esc(link)+'" target="_blank" rel="noopener">open source →</a>':'')+'</div></div>';
    }).join('') : '<div class="empty">No passages found for “'+esc(t)+'”.</div>';
    wireToggles(box);
  }catch(e){ box.innerHTML = '<div class="empty">Could not load passages.</div>'; }
}
async function renderSources(){
  var box = $('sources'); box.innerHTML = '<div class="skel"></div><div class="skel"></div>'; $('srcCount').textContent='';
  try{
    var d = await getJSON('/api/digests?agent='+encodeURIComponent(cur.id));
    var ds = d.digests||[]; $('srcCount').textContent = ds.length ? ds.length+' studied' : '';
    box.innerHTML = ds.length ? ds.slice(0,40).map(function(x){
      var link = safeUrl(x.url);
      return '<div class="item"><button type="button" aria-expanded="false"><span class="t">'+esc(x.title||x.name)+'</span><span class="s">'+(x.runtimeLabel?esc(x.runtimeLabel)+' · ':'')+x.insights+' insights</span></button>'+
        '<div class="body">'+esc(x.thesis||'No summary yet.')+'<br><span style="color:var(--ink-faint);font:500 10.5px var(--f-mono)">'+x.chapters+' chapters · '+x.quotes+' quotes</span>'+(link?' <a href="'+esc(link)+'" target="_blank" rel="noopener">open source →</a>':'')+'</div></div>';
    }).join('') : '<div class="empty">No sources indexed for '+esc(cur.id)+' yet.</div>';
    wireToggles(box);
  }catch(e){ box.innerHTML = '<div class="empty">Could not load sources.</div>'; }
}

/* ── boot ── */
(async function(){
  buildPicker();
  try{ DATA.ov = await getJSON('/api/overview'); $('stats').innerHTML = '<span><b>'+nf.format(DATA.ov.videos||0)+'</b> sources</span><span><b>'+nf.format(DATA.ov.chunks||0)+'</b> passages</span><span><b>7</b> agents</span>'; }
  catch(e){ $('stats').innerHTML = '<span>offline</span>'; }
  try{ DATA.kmap = await getJSON('/api/knowledge-map'); }catch(e){}
  var hash = (location.hash||'').replace('#','').toUpperCase();
  setAgent(AGENTS.some(function(a){return a.id===hash;}) ? hash : 'SHADDAI');
})();
</script>
