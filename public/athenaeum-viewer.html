<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athenaeum Campus Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #06080b; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; color: #e7f3ee; font: 12px/1.6 monospace; background: rgba(6,8,11,.8); border: 1px solid #1c2624; border-radius: 10px; padding: 10px 14px; z-index: 10; max-width: 420px; }
    #ui b { color: #00ff9c; }
    button { margin: 2px 2px 0 0; padding: 4px 9px; background: rgba(0,255,156,.18); border: 1px solid #00ff9c; color: #00ff9c; border-radius: 4px; cursor: pointer; font: inherit; }
    button:hover { background: rgba(0,255,156,.35); }
  </style>
</head>
<body>
  <div id="ui">
    <b>THE ATHENAEUM CAMPUS</b> &middot; drag = orbit, wheel = zoom<br>
    View: <button data-v="over">Overview</button><button data-v="rot">Rotunda</button><button data-v="dais">Dais</button><button data-v="gate">Gate</button><button data-v="dean">Dean's Atrium</button><br>
    Wings: <button data-w="observatory">Observatory</button><button data-w="library">Library</button><button data-w="museum">Museum</button><button data-w="forge">Forge</button><button data-w="music">Sound</button><button data-w="council">Council</button><br>
    Quality: <button data-q="LOW">Low</button><button data-q="MEDIUM">Med</button><button data-q="HIGH">High</button>
    <div id="stats"></div>
  </div>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/" } }</script>
  <script src="/athenaeum-layout.js"></script>
  <script src="/world-athenaeum.js"></script>
  <script type="module">
    import * as THREE from 'three';
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x06080b); scene.fog = new THREE.FogExp2(0x06080b, 0.0009);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.3, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.97;     // same as the world
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
    // QA only: the campus is lit from inside; this lets the exterior be judged in the viewer (the world has its own sun)
    const qaSun = new THREE.DirectionalLight(0xbcd8ff, 1.6); qaSun.position.set(400, 600, 300); scene.add(qaSun); scene.add(new THREE.AmbientLight(0x20303a, 0.8));
    const campus = window.buildAthenaeumCampus(THREE, { scene, originX: 0, originZ: 0 });
    campus.group.visible = true;
    const U = campus.layout.U, L = campus.layout;
    const m = (v) => v * U;
    const look = (x, y, z, tx, ty, tz) => { camera.position.set(m(x), m(y), m(z)); camera.lookAt(m(tx), m(ty), m(tz)); };
    const views = {
      over: () => look(120, 110, 150, 0, 6, 0), rot: () => look(0, 3.2, 26, 0, 8, -20), dais: () => look(11, 4, 14, 0, 7, 0),
      gate: () => look(0, 2.2, 62, 0, 4, 20), dean: () => look(0, 3, -36, 0, 5, -56)
    };
    function wingView(id) {
      const w = L.wings.find((x) => x.id === id), p = L.at(w, 44, 0), q = L.at(w, 74, 0);
      camera.position.set(m(p.x), m(2.8), m(p.z)); camera.lookAt(m(q.x), m(3.4), m(q.z));
    }
    document.getElementById('ui').addEventListener('click', (e) => {
      const b = e.target; if (b.dataset.v) views[b.dataset.v](); if (b.dataset.w) wingView(b.dataset.w); if (b.dataset.q) campus.setQuality(b.dataset.q);
    });
    let yaw = 0.7, pitch = 0.5, dist = m(210), drag = false, lx = 0, ly = 0, free = true;
    const orbit = () => { camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist); camera.lookAt(0, m(8), 0); };
    addEventListener('pointerdown', (e) => { if (e.target.closest('#ui')) return; drag = true; free = true; lx = e.clientX; ly = e.clientY; });
    addEventListener('pointerup', () => drag = false);
    addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - lx) * 0.006; pitch = Math.max(0.03, Math.min(1.45, pitch + (e.clientY - ly) * 0.004)); lx = e.clientX; ly = e.clientY; orbit(); });
    addEventListener('wheel', (e) => { dist = Math.max(m(10), Math.min(m(900), dist * (1 + e.deltaY * 0.001))); orbit(); }, { passive: true });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    window.__viewer = { campus, camera, renderer, scene, views, wingView, look, ready: true };
    views.over();
    let last = performance.now(), frames = 0, acc = 0;
    (function loop(now) {
      requestAnimationFrame(loop); const dt = Math.min(0.1, (now - last) / 1000); last = now;
      campus.tick(dt); renderer.render(scene, camera);
      frames++; acc += dt; if (acc > 1) { document.getElementById('stats').textContent = Math.round(frames / acc) + ' fps · ' + renderer.info.render.calls + ' draws · ' + Math.round(renderer.info.render.triangles / 1000) + 'k tris'; frames = 0; acc = 0; }
    })(last);
  </script>
</body>
</html>
