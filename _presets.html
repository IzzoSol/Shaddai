<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADDAI · 100 Character Presets</title>
<style>
  html,body{margin:0;background:#0d1017;color:#cfe3f2;font-family:'Segoe UI',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid #202838}
  h1{margin:0;font-size:16px}h1 b{color:#00ff88}
  .sub{color:#7d8ea3;font-size:12px;margin-top:3px}
  .wrap{padding:14px 22px}
  .stage{background:radial-gradient(120% 90% at 50% 10%,#1a212d,#0e131b 70%);border:1px solid #202838;border-radius:12px;padding:6px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  canvas{display:block;width:100%;height:auto;border-radius:8px;image-rendering:pixelated}
</style></head><body>
<header><h1>SHADDAI · <b>100 Character Presets</b> — diverse people + robot theme · one modular rig</h1>
<div class="sub">Every one is the same tiny rig, different data. Skin tones, hair, outfits, caps, jackets, shoes, glasses, beards, dresses — plus a robot line.</div></header>
<div class="wrap"><div class="stage"><canvas id="c"></canvas></div></div>
<script>
'use strict';
const TW=84, TH=42;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2), CSSW=0, CSSH=0, OX=0, OY=0;
const COLS=10, ROWS=10, CELLW=118, CELLH=132;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function iso(col,row){return [OX+(col-row)*TW/2, OY+(col+row)*TH/2];}
function Pth(pts){ctx.beginPath();ctx.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));for(let i=1;i<pts.length;i++)ctx.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));ctx.closePath();}
function box(col,row,w,d,h,top,opts){opts=opts||{};const cx=OX+(col-row)*TW/2,cy=OY+(col+row)*TH/2;const dx=(dc,dr)=>(dc-dr)*TW/2,dy=(dc,dr)=>(dc+dr)*TH/2;const hw=w/2,hd=d/2;const back=[cx+dx(-hw,-hd),cy+dy(-hw,-hd)],right=[cx+dx(hw,-hd),cy+dy(hw,-hd)],front=[cx+dx(hw,hd),cy+dy(hw,hd)],left=[cx+dx(-hw,hd),cy+dy(-hw,hd)];const up=p=>[p[0],p[1]-h];const tB=up(back),tR=up(right),tF=up(front),tL=up(left);ctx.fillStyle=opts.left||shade(top,-0.17);Pth([left,front,tF,tL]);ctx.fill();ctx.fillStyle=opts.right||shade(top,-0.33);Pth([front,right,tR,tF]);ctx.fill();ctx.fillStyle=top;Pth([tB,tR,tF,tL]);ctx.fill();if(opts.edge){ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;ctx.lineJoin='round';Pth([tB,tR,right,front,left,tL]);ctx.stroke();}}
function boxL(col,row,w,d,h,color,lift,opts){const s=OY;OY-=lift;box(col,row,w,d,h,color,opts);OY=s;}
const E={edge:true};
function armStub(c,r,sleeve,skinC,L){boxL(c,r,0.1,0.1,3,skinC,8+L,E);boxL(c,r,0.1,0.1,13,sleeve,11+L,E);}

function guy(rig,t,phase){
  const col=0,row=0;const tt=t/1000+(phase||0);
  const bob=Math.sin(tt*1.7)*0.5;const L=bob;
  const skin=rig.skin||'#f0c199', shirt=rig.shirt||'#e0662e', pants=rig.pants||'#37414f';
  const shoe=rig.shoe||'#2a2a2a', hair=rig.hair||'#3a2a1a', cap=rig.cap, sleeve=rig.jacket||shirt;
  const [cx,cy]=iso(0,0);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(cx,cy+3,14,6,0,0,7);ctx.fill();
  armStub(col+0.18,row-0.18,sleeve,skin,L);            // back arm
  if(rig.dress){
    boxL(col,row+0.03,0.16,0.17,4,shoe,0+L,E);boxL(col,row+0.03,0.16,0.17,4,shoe,0+L,E);
    boxL(col,row,0.5,0.4,13,rig.dress,4+L,E);          // flared skirt
    boxL(col,row,0.36,0.26,12,rig.dress,17+L,E);       // bodice
  }else{
    for(const g of [[-0.08,0.08],[0.08,-0.08]]){const c=col+g[0],r=row+g[1];boxL(c,r+0.03,0.16,0.17,4,shoe,0+L,E);boxL(c,r,0.13,0.13,6,pants,4+L,E);}
    boxL(col,row,0.4,0.3,15,rig.jacket||shirt,10+L,E);
    if(rig.jacket){ctx.fillStyle=shirt;ctx.fillRect(Math.round(cx)-2,Math.round(cy)-(10+13+L),4,12);}
    ctx.fillStyle=shade(rig.jacket||shirt,0.16);ctx.fillRect(Math.round(cx)-4,Math.round(cy)-(10+14+L),8,2);
  }
  if(rig.emblem){ctx.fillStyle=rig.emblem;ctx.fillRect(Math.round(cx)-3,Math.round(cy)-(10+8+L),6,6);}
  armStub(col-0.18,row+0.18,sleeve,skin,L);            // front arm
  boxL(col,row,0.44,0.35,15,skin,25+L,E);              // head
  // ears (skin slabs on the visible sides)
  if(!rig.robot&&rig.ears!==false){const earC=shade(skin,-0.07);boxL(col-0.185,row,0.045,0.07,4,earC,29+L,E);boxL(col+0.185,row,0.045,0.07,4,earC,29+L,E);}
  const ey=cy-(25+L)-7;
  if(rig.robot){ctx.fillStyle=rig.led||'#5fe0ff';ctx.fillRect(Math.round(cx)-6,Math.round(ey),4,4);ctx.fillRect(Math.round(cx)+3,Math.round(ey),4,4);}
  else{
    ctx.fillStyle=rig.eye||'#241a12';ctx.fillRect(Math.round(cx)-5,Math.round(ey),3,4);ctx.fillRect(Math.round(cx)+3,Math.round(ey),3,4);        // eyes
    ctx.fillStyle=shade(hair,-0.1);ctx.fillRect(Math.round(cx)-5,Math.round(ey)-3,3,1);ctx.fillRect(Math.round(cx)+3,Math.round(ey)-3,3,1);      // eyebrows
    ctx.fillStyle=shade(skin,-0.42);ctx.fillRect(Math.round(cx)-1,Math.round(ey)+6,4,1);                                                        // mouth
  }
  if(rig.glasses){ctx.strokeStyle='#0e1116';ctx.lineWidth=1.4;ctx.strokeRect(Math.round(cx)-7,Math.round(ey)-2,6,6);ctx.strokeRect(Math.round(cx)+2,Math.round(ey)-2,6,6);ctx.beginPath();ctx.moveTo(cx-1,ey+1);ctx.lineTo(cx+2,ey+1);ctx.stroke();}
  if(rig.beard)boxL(col,row+0.14,0.4,0.08,6,rig.beardCol||shade(hair,0.05),25+L,E);
  // hair / cap / mohawk / robot antenna  (with side-hair volume + rounded crown)
  if(rig.robot){boxL(col,row,0.48,0.38,5,rig.cap||'#9aa4ad',39+L,E);boxL(col,row,0.04,0.04,6,'#9aa4ad',44+L,E);ctx.fillStyle=rig.led||'#ff5a4d';const[ax,ay]=iso(0,0);ctx.beginPath();ctx.arc(ax,ay-(50+L),2.5,0,7);ctx.fill();}
  else if(cap){boxL(col,row,0.5,0.4,6,cap,40+L,E);boxL(col,row+0.15,0.42,0.06,3,hair,38+L,E);boxL(col-0.12,row,0.05,0.12,3,hair,33+L,E);boxL(col+0.12,row,0.05,0.12,3,hair,33+L,E);}
  else if(rig.mohawk){boxL(col,row,0.1,0.34,12,hair,39+L,E);boxL(col,row+0.16,0.4,0.06,4,hair,35+L,E);boxL(col-0.1,row,0.05,0.14,4,hair,33+L,E);boxL(col+0.1,row,0.05,0.14,4,hair,33+L,E);}
  else{
    boxL(col,row,0.47,0.38,7,hair,39+L,E);            // hair top
    boxL(col,row+0.16,0.44,0.07,5,hair,35+L,E);       // forehead fringe
    boxL(col-0.11,row,0.07,0.18,5,hair,33+L,E);       // side hair L
    boxL(col+0.11,row,0.07,0.18,5,hair,33+L,E);       // side hair R
    if(!rig.squareHead)boxL(col,row,0.3,0.24,3,hair,45+L,E);  // narrower crown → rounder head
  }
}

// ===== preset generator =====
let SEED=2027;function rnd(){SEED=(SEED*1103515245+12345)&0x7fffffff;return SEED/0x7fffffff;}
function pick(a){return a[(rnd()*a.length)|0];}
const SKIN=['#ffe0bd','#f2c9a0','#e7b58a','#d19a6a','#b07c4f','#8a5a3a','#6b4423','#4a2f1c'];
const HAIR=['#2a1c12','#5a3a1a','#111111','#e8a23a','#d8d2c8','#7a5a3a','#c0392b','#e83a3a','#3a5ac0','#7a3ac0','#2aa050','#f2c84a','#b0b0b0'];
const SHIRT=['#e0662e','#2f6fe8','#3f9e4d','#e8433a','#f2a01e','#8b5cf6','#12b3b3','#eef1f4','#d94f8f','#00a3a3','#7a3ac0'];
const CAP=['#e8c33a','#e8433a','#2f6fe8','#1a1a1a','#00a3a3','#2aa050','#d94f8f'];
const SHOE=['#2a2a2a','#111111','#8a2a2a','#e8e8e8','#2a3a5a','#5a3a1a'];
const ROBOT_METAL=['#b8c0c8','#8a9199','#6b7280','#c8a24a','#c46b3a','#e8e8ee','#3a3f47','#9aa4ad'];
const LED=['#5fe0ff','#ff5a4d','#00ff9c','#f2c84a','#c9a6ff'];
const ARCH=[
  ()=>({jacket:pick(['#1f3a63','#20242c','#2b3a4a','#3a2f2a','#26313f']),shirt:'#eef1f4',pants:'#20242c',shoe:'#20161a',hair:pick(HAIR),glasses:rnd()<0.35}),      // business
  ()=>({shirt:pick(SHIRT),pants:pick(['#2b3a4a','#203a5a','#37414f','#3a2a1f']),shoe:pick(SHOE),cap:rnd()<0.5?pick(CAP):null,hair:pick(HAIR)}),                       // casual
  ()=>({shirt:pick(['#e8433a','#2f6fe8','#00a3a3','#f2a01e','#8b5cf6']),pants:pick(['#20242c','#eef1f4']),shoe:'#eef1f4',cap:rnd()<0.4?pick(['#e8433a','#2f6fe8']):null,hair:pick(HAIR)}), // athlete
  ()=>({jacket:'#1a1a1a',shirt:pick(['#e83a3a','#8b5cf6','#00ff9c']),pants:'#20242c',shoe:'#111',hair:pick(['#e83a3a','#8b5cf6','#2aa050','#f2c84a']),mohawk:true}),  // punk
  ()=>({shirt:pick(['#3f9e4d','#7a6a9a','#8a6a44','#4a6a8a']),pants:'#3a3a3a',shoe:'#3a2a1a',hair:pick(['#d8d2c8','#e8e8e8','#b0b0b0']),glasses:true,beard:rnd()<0.5}),// elder
  ()=>({shirt:pick(SHIRT),pants:pick(SHIRT),shoe:pick(['#c0392b','#2aa050','#e8e8e8']),cap:pick(['#8b5cf6','#e8c33a','#00a3a3']),hair:pick(HAIR)}),                   // artist
  ()=>({dress:pick(['#e84f8f','#8b5cf6','#1f3a63','#c0392b','#2aa050','#f2a01e']),shoe:'#20161a',hair:pick(HAIR)}),                                                    // formal/dress
  ()=>({jacket:pick(['#e8a83a','#3a6ac0','#c46b3a']),shirt:'#d8d2c8',pants:pick(['#2b3a4a','#3a2a1f']),shoe:'#3a2a1a',cap:pick(['#e8c33a','#e8433a']),hair:pick(HAIR)}),// worker
];
function robotPreset(){const m=pick(ROBOT_METAL),led=pick(LED);return {robot:true,skin:m,cap:pick(ROBOT_METAL),shirt:pick(ROBOT_METAL),pants:pick(ROBOT_METAL),shoe:'#3a3f47',led,emblem:led};}
const presets=[];
for(let i=0;i<100;i++){
  if(i>=88){presets.push(robotPreset());continue;}            // last 12 = robots
  const rig=ARCH[i%ARCH.length]();
  rig.skin=SKIN[i%SKIN.length];                                // march through every skin tone
  if(rig.beard&&!rig.beardCol)rig.beardCol=rig.hair;
  presets.push(rig);
}

function resize(){
  CSSW=Math.min(document.querySelector('.stage').clientWidth-12,1180);
  const scale=CSSW/(COLS*CELLW);
  CSSH=Math.round(ROWS*CELLH*scale);
  canvas.style.width=CSSW+'px';canvas.style.height=CSSH+'px';
  canvas.width=COLS*CELLW*DPR;canvas.height=ROWS*CELLH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
}
function frame(t){
  ctx.clearRect(0,0,COLS*CELLW,ROWS*CELLH);
  for(let i=0;i<100;i++){
    const r=(i/COLS)|0, c=i%COLS;
    OX=c*CELLW+CELLW/2; OY=r*CELLH+CELLH-34;
    // pedestal tile
    const [px,py]=iso(0,0);
    ctx.fillStyle=(r+c)%2?'#20283440':'#1a212c40';
    Pth([[px,py-TH/2],[px+TW/2,py],[px,py+TH/2],[px-TW/2,py]]);ctx.fill();
    guy(presets[i],t,i*0.37);
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{DPR=Math.min(devicePixelRatio||1,2);resize();});
resize();requestAnimationFrame(frame);
</script></body></html>
