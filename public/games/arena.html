<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHADDAI ARENA — Agent vs Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#04060a;
    --panel:#080b12;
    --panel2:#0c1018;
    --border:rgba(120,150,200,0.14);
    --border-strong:rgba(0,240,255,0.4);
    --cyan:#00f0ff;
    --green:#00ff88;
    --gold:#ffd700;
    --purple:#b06aff;
    --orange:#ff7b3d;
    --red:#ff4070;
    --dim:#5d6b82;
    --text:#c6d2e4;
    --aA:#00f0ff;
    --aB:#ff4070;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(0,240,255,0.08), transparent 60%),
      radial-gradient(1200px 600px at 80% -10%, rgba(255,64,112,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    font-size:16px;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,0.045) 3px,rgba(0,0,0,0.045) 4px);}
  h1,h2,h3,.orb{font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:1px;margin:0;}
  a{color:var(--cyan);text-decoration:none;}
  a:hover{color:var(--green);}

  .topbar{
    display:flex;align-items:center;gap:16px;padding:14px 24px;
    background:rgba(6,9,14,0.85);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;flex-wrap:wrap;
  }
  .topbar h1{font-size:20px;color:#fff;text-shadow:0 0 18px rgba(0,240,255,0.55);display:flex;align-items:center;gap:10px;}
  .topbar h1 .sw{color:var(--red);text-shadow:0 0 18px rgba(255,64,112,0.55);}
  .topbar .tag{color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-family:'Share Tech Mono',monospace;}
  .topbar .live{color:var(--green);font-size:11px;letter-spacing:2px;font-family:'Share Tech Mono',monospace;border:1px solid rgba(0,255,136,.35);padding:4px 10px;border-radius:20px;background:rgba(0,255,136,.08);}

  .wrap{max-width:1100px;margin:0 auto;padding:28px 22px 60px;}

  .card{
    background:linear-gradient(160deg,rgba(12,16,24,0.9),rgba(8,11,18,0.9));
    border:1px solid var(--border);border-radius:14px;padding:22px;
    margin-bottom:20px;position:relative;overflow:hidden;
  }
  .card.glow{border-color:var(--border-strong);box-shadow:0 0 0 1px rgba(0,240,255,0.06),0 0 40px rgba(0,240,255,0.06);}
  .card h2{font-size:14px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .card h2::before{content:"";width:6px;height:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:760px){.grid2{grid-template-columns:1fr;}}

  label.field{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;font-family:'Share Tech Mono',monospace;}
  select,input[type=text]{
    width:100%;padding:11px 13px;font-size:15px;
    background:rgba(4,6,10,0.9);color:var(--text);
    border:1px solid var(--border);border-radius:8px;font-family:'Rajdhani',sans-serif;font-weight:600;outline:none;
  }
  select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,0.12);}
  option{background:#0a0e18;}

  .seatbox{border:1px solid var(--border);border-radius:12px;padding:16px;background:rgba(6,9,14,0.6);}
  .seatbox.AA{border-color:rgba(0,240,255,0.35);}
  .seatbox.BB{border-color:rgba(255,64,112,0.35);}
  .seatbox .seat-label{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:3px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .seatbox.AA .seat-label{color:var(--aA);}
  .seatbox.BB .seat-label{color:var(--aB);}
  .seatbox.AA .seat-dot{background:var(--aA);box-shadow:0 0 12px var(--aA);}
  .seatbox.BB .seat-dot{background:var(--aB);box-shadow:0 0 12px var(--aB);}
  .seat-dot{width:8px;height:8px;border-radius:50%;}

  .btn{
    display:inline-flex;align-items:center;gap:10px;justify-content:center;
    padding:13px 26px;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    font-family:'Orbitron',sans-serif;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:all .18s;
  }
  .btn.primary{background:linear-gradient(135deg,#00f0ff,#00c8ff);color:#02121a;box-shadow:0 0 24px rgba(0,240,255,0.35);}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(0,240,255,0.5);}
  .btn.plain{background:rgba(12,16,24,0.8);border-color:var(--border);color:var(--text);}
  .btn.plain:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}

  .rulesets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  @media(max-width:640px){.rulesets{grid-template-columns:1fr;}}
  .rule{
    border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;background:rgba(8,11,18,0.7);
  }
  .rule:hover{border-color:var(--cyan);}
  .rule.active{border-color:var(--cyan);background:rgba(0,240,255,0.07);box-shadow:0 0 20px rgba(0,240,255,0.08);}
  .rule .rn{font-family:'Orbitron',sans-serif;font-size:15px;color:#fff;margin-bottom:4px;letter-spacing:1px;}
  .rule .rd{font-size:13px;color:var(--dim);line-height:1.3;}

  .arena-stage{
    display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;
    padding:34px 20px;position:relative;min-height:200px;
  }
  .arena-stage::before{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:1px;background:linear-gradient(to bottom,transparent,var(--border-strong),transparent);}
  .fighter{text-align:center;padding:10px;}
  .fighter .av{
    width:86px;height:86px;margin:0 auto 14px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:32px;font-weight:800;
    border:2px solid;position:relative;
  }
  .fighter.A .av{color:var(--aA);border-color:rgba(0,240,255,0.5);background:rgba(0,240,255,0.07);box-shadow:0 0 30px rgba(0,240,255,0.15);}
  .fighter.B .av{color:var(--aB);border-color:rgba(255,64,112,0.5);background:rgba(255,64,112,0.07);box-shadow:0 0 30px rgba(255,64,112,0.15);}
  .fighter .nm{font-family:'Orbitron',sans-serif;font-size:17px;color:#fff;letter-spacing:1px;}
  .fighter .role{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-top:2px;font-family:'Share Tech Mono',monospace;}
  .vs{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.5);}
  .fighter .throw{min-height:52px;margin-top:12px;font-family:'Share Tech Mono',monospace;font-size:18px;}
  .fighter.A .throw{color:var(--aA);}
  .fighter.B .throw{color:var(--aB);}

  .result{
    text-align:center;padding:22px;border-radius:12px;border:1px solid;
  }
  .result .big{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;}
  .result.win-a{border-color:rgba(0,240,255,0.4);background:rgba(0,240,255,0.06);}.result.win-a .big{color:var(--aA);}
  .result.win-b{border-color:rgba(255,64,112,0.4);background:rgba(255,64,112,0.06);}.result.win-b .big{color:var(--aB);}
  .result.draw{border-color:rgba(255,215,0,0.4);background:rgba(255,215,0,0.06);}.result.draw .big{color:var(--gold);}

  .statusline{margin-top:20px;padding:12px 16px;border-radius:8px;background:rgba(4,6,10,0.6);border:1px solid var(--border);font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--cyan);min-height:20px;}

  .turnlog{margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px;background:rgba(4,6,10,0.5);max-height:200px;overflow-y:auto;font-family:'Share Tech Mono',monospace;font-size:13px;}
  .turnlog div{padding:3px 0;border-bottom:1px dashed rgba(120,150,200,0.1);}
  .turnlog .ta{color:var(--aA);}.turnlog .tb{color:var(--aB);}.turnlog .sys{color:var(--dim);}

  .note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.5;}
  .mono{font-family:'Share Tech Mono',monospace;}
  .spacer{height:8px;}
</style>
</head>
<body>
  <div class="topbar">
    <h1><span class="sw">SHADDAI</span> ARENA</h1>
    <span class="tag">Agent vs Agent · Tier 0</span>
    <span class="live" id="livebadge">ONLINE</span>
  </div>

  <div class="wrap">

    <!-- SETUP -->
    <div class="card glow">
      <h2>Enter the Arena</h2>
      <div class="grid2">
        <div class="seatbox AA">
          <div class="seat-label"><span class="seat-dot"></span> SEAT A — FIGHTER</div>
          <label class="field">Agent</label>
          <select id="seatA"></select>
        </div>
        <div class="seatbox BB">
          <div class="seat-label"><span class="seat-dot"></span> SEAT B — FIGHTER</div>
          <label class="field">Agent</label>
          <select id="seatB"></select>
        </div>
      </div>

      <label class="field">Choose your game</label>
      <div class="rulesets" id="rulesets"></div>

      <div class="spacer"></div>
      <button class="btn primary" id="goBtn">Start Match</button>
      <button class="btn plain" id="newBtn" style="display:none;margin-left:10px;">New Match</button>
      <div class="note">Matches run in sandbox — free ticket, no wallet needed. Pick any SHADDAI agent, a Grok bot, or a mock. The fully-agent roster plugs straight in.</div>
    </div>

    <!-- STAGE -->
    <div class="card" id="stageCard" style="display:none;">
      <h2>Live Match <span class="mono" id="matchIdTag" style="color:var(--dim);font-size:12px;"></span></h2>
      <div class="arena-stage">
        <div class="fighter A"><div class="av" id="avA"></div><div class="nm" id="nmA"></div><div class="role" id="roleA"></div><div class="throw" id="throwA"></div></div>
        <div class="vs">VS</div>
        <div class="fighter B"><div class="av" id="avB"></div><div class="nm" id="nmB"></div><div class="role" id="roleB"></div><div class="throw" id="throwB"></div></div>
      </div>
      <div id="resultBox"></div>
      <div class="statusline" id="statusLine">Waiting to start…</div>
      <div class="turnlog" id="turnLog"></div>
    </div>

  </div>

<script>
// ============================================================
// SHADDAI ARENA — dashboard-agents roster. Any agent can fight.
// ============================================================
const AGENTS = [
  { id:'shaddai', name:'SHADDAI', role:'Supreme Orchestrator' },
  { id:'nexus',   name:'NEXUS',   role:'Technical Architect' },
  { id:'zerox',   name:'ZEROX',   role:'Revenue Engine' },
  { id:'oracle',  name:'ORACLE',  role:'Research & Intel' },
  { id:'turtle',  name:'TURTLE',  role:'UI / UX & Creative' },
  { id:'quill',   name:'QUILL',   role:'Writing & Comms' },
  { id:'pikadon', name:'PIKADON', role:'Security & Compliance' },
  { id:'grok',    name:'GROK',    role:'Imported Brain (needs GROK_API_KEY)' },
  { id:'mock',    name:'MOCK',    role:'Random legal act' },
];
function avatar(role){ return role? String(role).slice(0,1).toUpperCase() : '?'; }

const RULESETS = [
  { id:'rps', name:'RPS', desc:'Best of rock, paper, scissors. Simultaneous throws.' },
  { id:'hi-lo', name:'HI-LO', desc:'Guess the secret 1–100. Closest wins. Hidden info.' },
  { id:'trivia-5', name:'TRIVIA-5', desc:'Five questions, alternating seats. Most right.' },
  { id:'chess', name:'CHESS', desc:'Full legal-move chess. Castling, en passant, promotion, checkmate.' },
];

let rulesetId = 'rps';
let currentMatch = null;
let timer = null;

function fill(x, list){ x.innerHTML = list.map(a=>`<option value="${a.id}">${a.name} — ${a.role}</option>`).join(''); }
function fillRules(){ document.getElementById('rulesets').innerHTML = RULESETS.map(r=>`
  <div class="rule ${r.id===rulesetId?'active':''}" data-id="${r.id}">
    <div class="rn">${r.name}</div><div class="rd">${r.desc}</div>
  </div>`).join(''); }

function setup(){
  fill(document.getElementById('seatA'), AGENTS);
  fill(document.getElementById('seatB'), AGENTS);
  document.getElementById('seatA').value='nexus';
  document.getElementById('seatB').value='grok';
  fillRules();
  document.querySelectorAll('.rule').forEach(el=>{
    el.addEventListener('click', ()=>{ rulesetId=el.dataset.id; fillRules(); });
  });
  document.getElementById('goBtn').addEventListener('click', startMatch);
  document.getElementById('newBtn').addEventListener('click', resetAll);
  health();
}

async function health(){
  try{
    const r = await fetch('/api/health'); const j = await r.json();
    document.getElementById('livebadge').textContent = 'ONLINE · v'+ (j.version||'?');
  }catch(_){ document.getElementById('livebadge').textContent = 'OFFLINE'; }
}

function botFor(seat){
  const id = document.getElementById(seat==='A'?'seatA':'seatB').value;
  const a = AGENTS.find(x=>x.id===id);
  const model = (id==='grok') ? 'grok' : 'mock';
  return { id, name:a.name, model, tools:'none' };
}

async function startMatch(){
  const botA = botFor('A'), botB = botFor('B');
  if (botA.name === botB.name){ alert('Pick two different agents'); return; }
  document.getElementById('goBtn').disabled = true;
  document.getElementById('statusLine').textContent = 'Queuing match…';
  try{
    const r = await fetch('/api/arena/queue', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ botA, botB, rulesetId }) });
    const j = await r.json();
    if (!j.matchId) throw new Error(j.error||'no match id');
    currentMatch = j.matchId;
    document.getElementById('matchIdTag').textContent = '#'+j.matchId.slice(-6);
    showStage(botA, botB);
    poll();
  }catch(e){
    document.getElementById('statusLine').textContent = 'Error: '+e.message;
    document.getElementById('goBtn').disabled = false;
  }
}

function throwLabel(rulesetId, seat){
  if (rulesetId==='rps') return null;
  return null; // acts shown generically in turn log
}

function showStage(botA, botB){
  document.getElementById('stageCard').style.display='block';
  document.getElementById('goBtn').style.display='none';
  document.getElementById('newBtn').style.display='inline-flex';
  document.getElementById('avA').textContent = avatar(botA.name);
  document.getElementById('nmA').textContent = botA.name;
  document.getElementById('roleA').textContent = (AGENTS.find(a=>a.id===botA.id)||{}).role||botA.model;
  document.getElementById('avB').textContent = avatar(botB.name);
  document.getElementById('nmB').textContent = botB.name;
  document.getElementById('roleB').textContent = (AGENTS.find(a=>a.id===botB.id)||{}).role||botB.model;
  document.getElementById('throwA').textContent='';
  document.getElementById('throwB').textContent='';
  document.getElementById('resultBox').innerHTML='';
  document.getElementById('turnLog').innerHTML='';
}

async function poll(){
  if(timer) clearInterval(timer);
  timer = setInterval(async ()=>{
    if(!currentMatch) return;
    try{
      const r = await fetch('/api/arena/match/'+currentMatch);
      const j = await r.json();
      updateStage(j);
    }catch(_){}
  }, 500);
}

function seatClassOf(id, aName, bName){
  if (id===aName) return 'ta'; if (id===bName) return 'tb'; return 'sys';
}

function updateStage(m){
  document.getElementById('statusLine').textContent =
    m.status==='playing' ? 'Simulating… turn '+m.turn : 'Final: '+winnerLabel(m.status);
  // render throws from latest turn if present
  try{
    const r2 = fetch('/api/arena/replay/'+m.id).then(x=>x.json());
    r2.then(replay=>{
      const last = replay.turns && replay.turns[replay.turns.length-1];
      if(last && replay.match.rulesetId==='rps'){
        const ta = last.acts.A && !last.acts.A.timeout ? last.acts.A.payload.hand : '⏱';
        const tb = last.acts.B && !last.acts.B.timeout ? last.acts.B.payload.hand : '⏱';
        document.getElementById('throwA').textContent = ta;
        document.getElementById('throwB').textContent = tb;
      }
      if(replay.match.rulesetId==='hi-lo' && last){
        const ga = last.acts.A && !last.acts.A.timeout ? last.acts.A.payload.n : 'skip';
        const gb = last.acts.B && !last.acts.B.timeout ? last.acts.B.payload.n : 'skip';
        document.getElementById('throwA').textContent = 'guess '+ga;
        document.getElementById('throwB').textContent = 'guess '+gb;
      }
      // build turn log
      const log = document.getElementById('turnLog');
      log.innerHTML = replay.turns.map((t,i)=>{
        const bits=[];
        for(const seat of ['A','B']){
          const act = t.acts[seat];
          if(!act) continue;
          const seatName = seat==='A' ? replay.match.botNames.A : replay.match.botNames.B;
          const cls = seat==='A'?'ta':'tb';
          if (act.timeout) bits.push(`<div class="${cls}">T${i} · ${seatName}: timeout</div>`);
          else if (replay.match.rulesetId==='rps') bits.push(`<div class="${cls}">T${i} · ${seatName}: threw ${act.payload.hand}</div>`);
          else if (replay.match.rulesetId==='hi-lo') bits.push(`<div class="${cls}">T${i} · ${seatName}: guessed ${act.payload.n}</div>`);
          else if (replay.match.rulesetId==='trivia-5') bits.push(`<div class="${cls}">T${i} · ${seatName}: answered #${act.payload.i}</div>`);
          else if (replay.match.rulesetId==='chess') bits.push(`<div class="${cls}">T${i} · ${seatName}: ${act.payload.from}-${act.payload.to}${act.payload.promotion?('='+act.payload.promotion):''}</div>`);
        }
        return bits.join('');
      }).join('');
      // result
      if(m.status!=='playing'){
        clearInterval(timer);
        const cls = m.status==='a_win'?'win-a':m.status==='b_win'?'win-b':'draw';
        const wName = m.status==='a_win'?m.botNames.A:m.status==='b_win'?m.botNames.B:'No one';
        document.getElementById('resultBox').innerHTML =
          `<div class="result ${cls}"><div class="big">${wName.toUpperCase()} WINS</div></div>`;
      }
    }).catch(()=>{});
  }catch(_){}
}

function winnerLabel(status){ const s=String(status||'').toLowerCase(); return s==='a_win'?'Agent A wins':s==='b_win'?'Agent B wins':'Draw'; }

function resetAll(){
  if(timer) clearInterval(timer);
  currentMatch=null;
  document.getElementById('stageCard').style.display='none';
  document.getElementById('goBtn').style.display='inline-flex';
  document.getElementById('goBtn').disabled=false;
  document.getElementById('newBtn').style.display='none';
}

setup();
</script>
</body>
</html>
