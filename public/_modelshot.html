<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#12141a;overflow:hidden}#c{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P=new URLSearchParams(location.search); const AGENT=(P.get('agent')||'TURTLE'); const UNLIT=P.get('unlit')!=='0';
const W=768,H=1024;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H); renderer.setClearColor(0x12141a,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,W/H,0.05,100);
// bright even rig (used when not unlit)
scene.add(new THREE.AmbientLight(0xffffff,1.1));
scene.add(new THREE.HemisphereLight(0xffffff,0x606060,3.0));
const k=new THREE.DirectionalLight(0xffffff,2.6); k.position.set(2,3,4); scene.add(k);
const k2=new THREE.DirectionalLight(0xffffff,1.6); k2.position.set(-3,1,-2); scene.add(k2);
const k3=new THREE.DirectionalLight(0xffffff,1.4); k3.position.set(0,-2,3); scene.add(k3);
window.__done=false; window.__err=null;
const loader=new GLTFLoader();
loader.load('/assets/agents/'+AGENT+'.glb',(gltf)=>{
  const root=gltf.scene;
  root.traverse(o=>{ if(o.isMesh&&o.material){
    const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=(Array.isArray(o.material)?mats:mats[0]);
    const conv=(m)=>{ if(UNLIT){ const b=new THREE.MeshBasicMaterial({map:m.map||null,color:m.color?m.color.clone():new THREE.Color(0xffffff),vertexColors:m.vertexColors,transparent:m.transparent,side:THREE.DoubleSide}); return b; } else { if('metalness'in m)m.metalness=0; if('roughness'in m)m.roughness=Math.max(m.roughness??1,0.7); return m; } };
    o.material=Array.isArray(o.material)?mats.map(conv):conv(mats[0]);
  }});
  scene.add(root);
  // robust bounding box: union ONLY real mesh geometry (ignore stray bones/helpers that inflate setFromObject)
  function meshBox(o){ const b=new THREE.Box3(); o.updateWorldMatrix(true,true); o.updateMatrixWorld(true); o.traverse(n=>{ if(n.isMesh&&n.geometry){ if(!n.geometry.boundingBox) n.geometry.computeBoundingBox(); const bb=n.geometry.boundingBox; if(bb){ const w=bb.clone().applyMatrix4(n.matrixWorld); if(isFinite(w.min.x)&&isFinite(w.max.x)&&isFinite(w.min.y)) b.union(w); } } }); return b; }
  // center + fit
  let box=meshBox(root); const ctr=box.getCenter(new THREE.Vector3());
  root.position.sub(ctr);
  box=meshBox(root); let s2=box.getSize(new THREE.Vector3());
  // normalize by HEIGHT so T-pose (wide arms) still frames correctly
  const sc=2.0/Math.max(0.001,s2.y); root.scale.multiplyScalar(sc);
  box=meshBox(root); s2=box.getSize(new THREE.Vector3());
  const c2=box.getCenter(new THREE.Vector3()); root.position.sub(c2);
  const fit=Math.max(s2.y, s2.x*0.72); const dist=(fit/2)/Math.tan((camera.fov*Math.PI/180)/2)*1.18;
  window.__frame=(az)=>{ const a=(az||0)*Math.PI/180; camera.position.set(Math.sin(a)*dist,0,Math.cos(a)*dist); camera.lookAt(0,0,0); renderer.render(scene,camera); };
  window.__frame(0);
  window.__done=true;
},undefined,(e)=>{ window.__err=String(e&&e.message||e); window.__done=true; });
</script></body></html>
