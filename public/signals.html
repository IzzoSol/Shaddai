<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>SHADDAI · Master Terminal</title>
<meta name="description" content="Live calls — list, bubbles, heatmap, ranked. Pump.fun pre-bond and post-bond, boosted, and the top 25 on DEX." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ══ SIGNALS ══════════════════════════════════════════════════════════════
   Built as an APP, not a page. The window is the frame: header and filters
   are fixed, only the results pane scrolls, and nothing ever moves the whole
   document. That is the difference between "a website on a phone" and
   something usable one-handed while standing up.

   Big and bold on purpose, matching Simple Mode. This screen is read at a
   glance in bad light with a moving thumb — small type is not a style choice
   here, it is a failure.

   FILTERS ARE REMEMBERED. Someone who only trades post-bond with socials
   should not re-pick that every visit.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --shell:#06080b; --void:#06080b; --void2:#0a0e13; --card:#0e141a;
  --ink:#e9efe9; --ink-soft:#93a49b; --ink-faint:#5c6b64;
  --edge:rgba(120,150,140,.2); --edge2:rgba(120,150,140,.34);
  --emerald:#00ff9c; --gold:#e8c45c;
  /* Performance ramp — semantic, deliberately NOT the brand palette.
     A loss must never render "on brand". */
  --up3:#00ff9c; --up2:#4ade80; --up1:#a3e635;
  --flat:#7d8d86; --dn1:#fbbf24; --dn2:#fb7185; --dn3:#ef4444;
  --f-display:'Cinzel',serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --hdr:52px; --rails:96px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* The window IS the frame — but height:100% on a phone ignores the dynamic
   URL bar, so the fixed header + rails can push the scroll surface below the
   fold ("screen off, not sized"). 100dvh is the live viewport; 100vh is the
   fallback for browsers that predate it. */
html,body{ margin:0; padding:0; height:100%; min-height:100dvh; overflow:hidden; }
body{ background:var(--void); color:var(--ink); font-family:var(--f-mono);
  display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
@media(prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ── header ────────────────────────────────────────────────────────────── */
header{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
  height:var(--hdr); padding:0 12px; padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--edge); background:var(--shell); }
.brand{ display:flex; align-items:center; gap:9px; min-width:0; }
.brand b{ font-family:var(--f-display); font-weight:900; font-size:21px; letter-spacing:.1em;
  text-shadow:0 0 14px rgba(0,255,156,.5), 0 0 34px rgba(0,255,156,.22), 0 0 2px #000; }
.pill{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
  letter-spacing:.1em; color:var(--emerald); border:1px solid rgba(0,255,156,.5);
  padding:4px 10px; border-radius:2px; box-shadow:0 0 16px -4px rgba(0,255,156,.55), inset 0 0 10px rgba(0,255,156,.08);
  text-shadow:0 0 10px rgba(0,255,156,.65); background:rgba(0,255,156,.05); }
.pill .d{ width:7px; height:7px; border-radius:50%; background:var(--emerald);
  box-shadow:0 0 10px var(--emerald), 0 0 20px var(--emerald);
  animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 50%{opacity:.3} }
header a.x{ font-size:20px; color:var(--ink-soft); text-decoration:none; width:44px; height:44px;
  display:grid; place-items:center; }

/* ── app: Signals ⇄ Markets switch ─────────────────────────────────────── */
.apptabs{ display:flex; gap:4px; margin:0 4px; }
.atab{ -webkit-appearance:none; appearance:none; border:1px solid var(--edge2); background:none;
  color:var(--ink-soft); font-family:var(--f-mono); font-size:13px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; padding:9px 14px; border-radius:4px;
  cursor:pointer; white-space:nowrap; transition:color .15s, background .15s, border-color .15s, box-shadow .15s; }
.atab[aria-pressed=true]{ background:var(--emerald); border-color:var(--emerald); color:#04120c;
  box-shadow:0 0 18px -6px rgba(0,255,156,.85); }
.atab+.atab{ margin-left:4px; }

/* ── filter rails ──────────────────────────────────────────────────────── */
.rails{ flex:0 0 auto; background:var(--shell); border-bottom:1px solid var(--edge); }
.rail{ display:flex; gap:6px; overflow-x:auto; padding:8px 12px;
  scrollbar-width:none; -ms-overflow-style:none; }
.rail::-webkit-scrollbar{ display:none; }
.rail + .rail{ padding-top:0; }
.chip{ flex:0 0 auto; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--edge2); border-radius:4px; background:linear-gradient(180deg,var(--card),#0b1116);
  color:var(--ink-soft); font-family:var(--f-mono); font-size:13px; font-weight:600; letter-spacing:.04em;
  cursor:pointer; white-space:nowrap; transition:background .15s, color .15s, border-color .15s, box-shadow .15s; }
 .chip[aria-pressed=true]{ background:var(--emerald); color:#04120c; border-color:var(--emerald);
   box-shadow:0 0 18px -4px rgba(0,255,156,.8), inset 0 0 8px rgba(0,255,156,.4); }
 .rail.modes .chip{ font-size:15px; padding:0 18px; }
 .rail.modes .chip[aria-pressed=true]{ background:var(--gold); border-color:var(--gold); color:#140f02;
   box-shadow:0 0 18px -4px rgba(232,196,92,.8); }
 .chip .ct{ font-size:10px; opacity:.7; font-weight:600; }

/* ── the one scrolling surface ─────────────────────────────────────────── */
main{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; padding:8px calc(4vw,8px) calc(16vw,24px); }
 .bar{ display:flex; justify-content:space-between; align-items:baseline; gap:6px;
   font-size:11px; color:var(--ink-faint); letter-spacing:.08em; margin-bottom:6px; }
 .bar b{ color:var(--ink); font-size:13px; }
 .empty{ padding:32px 14px; text-align:center; color:var(--ink-faint); font-size:12px; line-height:1.5; }
 .view{ display:none; } .view.on{ display:block; }

/* ── SWARM — MiroFish terminal embedded full-bleed ────────────────────── */
#v-swarm{ display:none; flex-direction:column; height:100%; }
#v-swarm.on{ display:flex; }
.swarm-ch{ display:flex; align-items:center; gap:8px; flex:0 0 auto; font-size:10.5px;
  letter-spacing:.1em; color:var(--ink-soft); padding:2px 2px 8px; }
.swarm-ch b{ font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--gold);
  text-shadow:0 0 10px rgba(232,196,92,.45); white-space:nowrap; }
.swarm-ch .sc-note{ color:var(--ink-faint); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; font-size:10px; }
.swarm-ch .sc-full{ margin-left:auto; flex:0 0 auto; text-decoration:none; color:var(--ink-soft);
  border:1px solid var(--edge2); padding:4px 12px; border-radius:2px; font-size:10px;
  font-weight:600; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
.swarm-ch .sc-full:active{ color:var(--gold); border-color:var(--gold); }
#v-swarm iframe{ flex:1 1 auto; min-height:0; width:100%; border:0; display:block;
  background:#010b10; }

/* ── MARKET STRIP + NEWS TICKER — one 34px band under the header ──────────
   Left are the live market dots (BTC/ETH/SOL); right is the key-free news
   feed scrolling forever. Pauses on hold. The strip is global — it stays
   across all three apps (Signals / Markets / Swarm). */
#mktstrip{ flex:0 0 auto; display:flex; align-items:stretch; gap:10px;
  background:#04070a; border-bottom:1px solid var(--edge); padding:4px 10px; min-height:34px; }
#mktChips{ display:flex; gap:6px; align-items:center; flex:0 0 auto; }
#mktChips .mkt{ display:inline-flex; align-items:center; gap:6px; font-size:12px;
  font-weight:700; letter-spacing:.03em; padding:5px 11px; border:1px solid var(--edge2);
  border-radius:15px; color:var(--ink-soft); background:rgba(255,255,255,.02);
  white-space:nowrap; font-variant-numeric:tabular-nums; }
#mktChips .mkt b{ color:var(--ink); }
#mktChips .mkt .up{ color:var(--emerald); text-shadow:0 0 8px rgba(0,255,156,.5); }
#mktChips .mkt .dn{ color:#fb7185; text-shadow:0 0 8px rgba(251,113,133,.4); }
#ticker{ flex:1 1 auto; min-width:0; overflow:hidden; display:flex; align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent); }
#ttrack{ display:inline-flex; align-items:center; white-space:nowrap; will-change:transform;
  animation:tick 60s linear infinite; }
#ticker:hover #ttrack{ animation-play-state:paused; }
@keyframes tick{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.tt{ font-size:12.5px; color:var(--ink-soft); letter-spacing:.02em; padding:0 20px;
  border-right:1px solid var(--edge2); display:inline-flex; align-items:center; gap:7px; }
.tt a{ color:inherit; text-decoration:none; }
.tt a:active{ color:var(--gold); }
.tt .ts{ color:#d4af37; font-weight:700; text-transform:uppercase; letter-spacing:.09em; font-size:10px; }

/* ── NEWS CONTEXT — the headline strip inside a coin sheet ──────────── */
#cnw{ margin-top:14px; border-top:1px solid var(--edge); padding-top:12px; }
#cnw .cnl{ display:flex; align-items:center; gap:7px; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold); margin-bottom:7px; }
#cnw .cnl::before{ content:''; width:5px; height:5px; background:var(--gold);
  box-shadow:0 0 8px var(--gold); border-radius:50%; }
#cnw .cnv{ display:block; font-size:12.5px; line-height:1.55; color:var(--ink-soft); }
#cnw .cnv a{ display:block; color:var(--ink-soft); text-decoration:none; padding:3px 0;
  border-left:2px solid var(--edge2); padding-left:9px; margin-bottom:2px; }
#cnw .cnv a em{ font-style:normal; color:var(--ink-faint); font-size:10.5px; }
#cnw .cnv a:active{ color:var(--gold); border-color:var(--gold); }

/* Button feel — the bare chips get a thumb, a radius and a press state so a
   tap reads as a tap, not a link. */
.chip{ min-height:36px; border-radius:3px; }
.chip:active, .atab:active{ transform:scale(.96); }
.atab{ padding:10px 16px; }

/* ── DEMO TRADING — one-thumb paper desk with a live equity chart ─────────
   Every fill is a paper fill at the CURRENT price (fetched at press time); the
   equity line only moves on what actually happened — no optimised multi-call
   fantasy. Reuses the auto-trader portfolio (zerox-demo) that is wired to
   ZEROX's paybox receiving wallets. */
#v-demo{ display:none; flex-direction:column; gap:10px; height:100%; }
#v-demo.on{ display:flex; }
.d-head{ display:flex; align-items:center; gap:10px; }
.d-bal{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
.d-bal span{ font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); }
.d-bal b{ font-family:var(--f-display); font-size:29px; font-weight:900; color:var(--ink);
  text-shadow:0 0 14px rgba(0,255,156,.3); font-variant-numeric:tabular-nums; }
.d-bal i{ font-style:normal; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.d-bal .pos{ color:var(--emerald); text-shadow:0 0 10px rgba(0,255,156,.4); }
.d-bal .neg{ color:#fb7185; text-shadow:0 0 10px rgba(251,113,133,.4); }
.d-bal .settle{ font-size:9.5px; color:var(--ink-faint); margin-top:3px; letter-spacing:.05em; }
.d-acts{ margin-left:auto; display:flex; gap:7px; }
.dbtn{ min-height:38px; padding:0 14px; border:1px solid var(--edge2); background:none;
  color:var(--ink-soft); font-family:var(--f-mono); font-size:10.5px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; border-radius:3px; cursor:pointer;
  transition:transform .12s, color .15s, border-color .15s; }
.dbtn:active{ transform:scale(.96); }
.dbtn.pri{ background:var(--emerald); color:#04120c; border-color:var(--emerald);
  box-shadow:0 0 16px -6px rgba(0,255,156,.85); }
#dChart{ height:210px; border:1px solid var(--edge2); border-radius:4px; padding:6px;
  background:#05080b; overflow:hidden; }
.d-row{ display:flex; gap:8px; align-items:center; }
.d-row input{ flex:1 1 auto; min-width:0; min-height:44px; background:var(--void2);
  border:1px solid var(--edge2); color:var(--ink); font-family:var(--f-mono); font-size:19px;
  font-weight:700; letter-spacing:.08em; padding:0 12px; border-radius:3px; text-transform:uppercase; }
.d-row input:focus{ border-color:var(--emerald); box-shadow:0 0 12px -4px rgba(0,255,156,.5); }
.d-row .sz{ flex:0 0 auto; font-size:11px; color:var(--ink-faint); white-space:nowrap;
  border:1px solid var(--edge2); border-radius:3px; padding:8px 10px; font-family:var(--f-mono); }
.d-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
.d-pane{ border:1px solid var(--edge2); border-radius:4px;
  background:linear-gradient(180deg,var(--card),#0a0e11); padding:10px 12px; }
.d-pane h4{ margin:0 0 8px; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
.dt{ display:flex; align-items:center; gap:9px; padding:9px 2px; border-bottom:1px solid var(--edge);
  font-size:12.5px; }
.dt:last-child{ border-bottom:0; }
.dt .sm{ font-weight:700; color:var(--ink); min-width:6ch; }
.dt .en{ color:var(--ink-faint); font-size:11px; white-space:nowrap; }
.dt .pl{ margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dt .pl.pos{ color:var(--emerald); } .dt .pl.neg{ color:#fb7185; }
.dt .cx{ border:1px solid var(--edge2); background:none; color:var(--ink-soft); font-family:var(--f-mono);
  font-size:9.5px; letter-spacing:.1em; padding:5px 9px; border-radius:2px; cursor:pointer; min-height:28px; }
.dt .cx:active{ color:var(--gold); border-color:var(--gold); }
.d-empty{ font-size:11.5px; color:var(--ink-faint); padding:14px 2px; text-align:center; }

/* ── avatar, shared ────────────────────────────────────────────────────── */
.av{ flex:0 0 auto; width:60px; height:60px; border-radius:50%; background:var(--void2);
  border:1px solid var(--edge2); object-fit:cover; display:block; }
.av.ph{ display:grid; place-items:center; font-size:15px; font-weight:700; color:var(--ink-faint); }

/* ── LIST — big rows ───────────────────────────────────────────────────── */
.row{ display:flex; align-items:center; gap:13px; border:1px solid var(--edge2);
  border-left:6px solid var(--pc,var(--flat)); background:linear-gradient(180deg,var(--card),#0b1116);
  padding:16px 15px; margin-bottom:10px; min-height:100px; cursor:pointer;
  box-shadow:0 1px 0 rgba(0,255,156,.04), inset 0 0 0 1px rgba(255,255,255,.015);
  transition:transform .12s, box-shadow .2s, border-color .2s; }
.row:active{ transform:scale(.988); }
/* The contract address on the face of the row. It is the thing someone copies
   to buy, so making them open a sheet to see it costs a tap at the exact
   moment speed matters. Truncated head+tail — the middle of a mint carries no
   recognition value, but the ends do. */
.row .ca{ font-size:11px; color:var(--ink-faint); letter-spacing:.02em; margin-top:6px;
  display:flex; align-items:center; gap:7px; }
.row .ca b{ color:var(--ink-soft); font-weight:400; }
.row .cabtn{ border:1px solid var(--edge2); background:none; color:var(--ink-faint);
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 8px; border-radius:2px; cursor:pointer; min-height:30px; }
.row .cabtn:active{ color:var(--emerald); border-color:var(--emerald); box-shadow:0 0 10px rgba(0,255,156,.5); }
.row .mid{ flex:1 1 auto; min-width:0; }
.row .sym{ font-size:26px; font-weight:700; letter-spacing:.03em; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  text-shadow:0 0 10px rgba(0,255,156,.22); }
.row .sub{ font-size:12.5px; color:var(--ink-faint); margin-top:5px; display:flex; gap:8px;
  align-items:center; flex-wrap:wrap; }
.row .mult{ flex:0 0 auto; font-size:36px; font-weight:700; color:var(--pc,var(--flat));
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  text-shadow:0 0 16px color-mix(in srgb, var(--pc,var(--flat)) 60%, transparent);
  filter:drop-shadow(0 0 4px rgba(0,0,0,.4)); }
.row:hover{ border-color:color-mix(in srgb, var(--pc,var(--flat)) 55%, var(--edge2));
  box-shadow:0 0 26px -8px color-mix(in srgb, var(--pc,var(--flat)) 70%, transparent),
             0 1px 0 rgba(0,255,156,.06); }
.so{ display:inline-flex; gap:4px; align-items:center; }
.so i{ font-style:normal; font-size:12px; opacity:.9; }
.tag{ border:1px solid var(--edge2); padding:2px 6px; border-radius:2px; font-size:10px;
  font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.tag.pre{ color:var(--gold); border-color:rgba(232,196,92,.45); }
.tag.bond{ color:var(--emerald); border-color:rgba(0,255,156,.45); }
.tag.boost{ color:#c4b5fd; border-color:rgba(196,181,253,.45); }

/* ── BUBBLES ───────────────────────────────────────────────────────────── */
#bubbles{ position:relative; width:100%; height:100%; min-height:40vh; }
#bubbles canvas{ width:100%; height:100%; display:block; touch-action:pan-y; }
#v-bub.on{ height:100%; }

/* ── HEATMAP — bigger cells, logo behind ───────────────────────────────── */
.heat{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px; }
.cell{ position:relative; aspect-ratio:1; border:0; padding:8px; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start;
  font-family:var(--f-mono); color:#04120c; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
.cell img{ position:absolute; inset:0; width:100%; height:100%; border-radius:0;
  opacity:.6; object-fit:cover; }
.cell::after{ content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(2,6,3,.85), rgba(2,6,3,.18) 55%); }
.cell .s, .cell .m, .cell .so{ position:relative; z-index:1; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.5); }
.cell.dark .s, .cell.dark .m{ color:#fff; }
.cell .s{ position:relative; font-size:16px; font-weight:700; line-height:1.05; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cell .m{ position:relative; font-size:25px; font-weight:700; font-variant-numeric:tabular-nums;
  filter:drop-shadow(0 0 6px rgba(0,0,0,.35)); }
.cell .so{ position:absolute; left:7px; bottom:7px; font-size:11px; opacity:.75; }
.cell.dark{ color:#f4fbf7; }

/* ── RANKED ────────────────────────────────────────────────────────────── */
.rank{ display:flex; align-items:center; gap:12px; padding:13px 4px;
  border-bottom:1px solid var(--edge); cursor:pointer; min-height:74px; }
.rank .n{ flex:0 0 auto; font-family:var(--f-display); font-weight:900; font-size:23px;
  color:var(--ink-faint); min-width:1.8ch; font-variant-numeric:tabular-nums; }
.rank:nth-child(1) .n{ color:var(--gold); font-size:28px; text-shadow:0 0 14px rgba(232,196,92,.6); }
.rank:nth-child(2) .n{ color:#cbd5e1; text-shadow:0 0 12px rgba(203,213,225,.5); }
.rank:nth-child(3) .n{ color:#d19a66; text-shadow:0 0 12px rgba(209,154,102,.5); }
.rank .b{ flex:1 1 auto; min-width:0; }
.rank .b .s{ font-size:22px; font-weight:700; color:var(--ink); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-shadow:0 0 10px rgba(0,255,156,.2); }
.rank .b .u{ font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
.rank .v{ flex:0 0 auto; font-size:30px; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--pc,var(--flat));
  text-shadow:0 0 16px color-mix(in srgb, var(--pc,var(--flat)) 60%, transparent);
  filter:drop-shadow(0 0 4px rgba(0,0,0,.4)); }

/* ── sheet ─────────────────────────────────────────────────────────────── */
#sheet{ position:fixed; inset:0; z-index:70; display:none; }
#sheet.on{ display:block; }
#sheet .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.74); }
#sheet .panel{ position:absolute; left:0; right:0; bottom:0; background:var(--card);
  border-top:3px solid var(--pc,var(--emerald)); padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:86vh; overflow-y:auto;
  box-shadow:0 -8px 40px -12px color-mix(in srgb, var(--pc,var(--emerald)) 45%, transparent); }
#sheet .top{ display:flex; align-items:center; gap:13px; }
#sheet .top .av{ width:56px; height:56px; }
#sheet h3{ font-family:var(--f-display); font-weight:900; font-size:27px; margin:0; letter-spacing:.03em;
  text-shadow:0 0 14px rgba(0,255,156,.25); }
#sheet .sub{ font-size:12px; color:var(--ink-faint); margin-top:4px; }

#sheet .tok{ font-size:11px; font-weight:600; letter-spacing:.05em;

/* HIRE ZEROX — the commerce surface on every coin sheet */
#sheet .zxhire{ margin-top:18px; border:1px solid rgba(232,196,92,.28);
  border-radius:4px; padding:13px 14px; background:rgba(232,196,92,.04); }
#sheet .zxhire-h{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
#sheet .zxhire-h span:first-child{ font-size:12px; font-weight:700; letter-spacing:.12em;
  color:var(--gold); text-transform:uppercase; }
#sheet .zxhire-h .zxhire-s{ font-size:10.5px; color:var(--ink-soft); }
#sheet .zxhire-acts{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
#sheet .zxhire-btn{ flex:1 1 auto; min-height:44px; display:inline-flex; align-items:center;
  justify-content:center; border:1px solid rgba(232,196,92,.4); color:var(--gold);
  font-family:var(--f-mono); font-size:12px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; text-decoration:none; border-radius:3px; cursor:pointer;

  min-height:0; }

/* On a desktop the phone view is not the right tool — offer the terminal
   rather than silently being the lesser of the two. Hidden below 820px, where
   this view IS the right tool. */
#toTerm{ display:none; }
@media(min-width:820px){
  #toTerm{ display:inline-flex; align-items:center; gap:7px; min-height:38px; padding:0 14px;
    border:1px solid var(--gold); color:var(--gold); background:none; border-radius:3px;
    font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; text-decoration:none; margin-right:8px; }

}

.pill .d{animation:pulse 1.8s ease-in-out infinite;}

color:#fff;background:rgba(2,6,3,.72);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:2px 6px;
cursor:pointer;text-shadow:0 1px 2px #000;}</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ALL = [], TOP = [], VIEW = [], INFO = {};
  /* Markets app: a secondary DEX browser fed by the server market routes.
     Same row/heatmap/sheet machinery as Signals, different data source. */
  var MK = { feed: [], loaded: false, cat: 'top' };
  var APP = 'sig';

  /* Saved parameters. Someone who only trades post-bond with socials should
     not re-pick that on every visit. Wrapped because storage throws in
     private mode and a crashed preference read must not blank the page. */
  var P = { mode: 'list', cat: 'all', hours: 24, social: '' };
  try { Object.assign(P, JSON.parse(localStorage.getItem('shd_sig_v1') || '{}')); } catch (e) {}
  function save() { try { localStorage.setItem('shd_sig_v1', JSON.stringify(P)); } catch (e) {} }

  /* Real `source` values from the feed, named the way a trader says them.
     Pre-bond and post-bond are pump.fun's bonding curve specifically. */
  var CATS = [
    { id: 'all',   label: 'All',          srcs: null },
    { id: 'pre',   label: 'Pre-bond',     srcs: ['new_pools'], note: 'pump.fun, still on the curve' },
    { id: 'post',  label: 'Post-bond',    srcs: ['bonded'],    note: 'pump.fun, graduated' },
    { id: 'boost', label: 'Boosted',      srcs: ['boosted'],   note: 'paid promotion running' },
    { id: 'trend', label: 'Trending',     srcs: ['trending', 'trending_pools'] },
    { id: 'top',   label: 'Top 25 DEX',   srcs: null, top: true, note: 'most boosted right now' },
  ];

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  /* Head and tail of a mint. The middle carries no recognition value; the ends
     are what someone checks against a chart or a wallet. */
  function shortCA(m) {
    m = String(m || '');
    return m.length > 14 ? m.slice(0, 6) + '…' + m.slice(-5) : m;
  }
  function mult(c) { var m = Number(c.curMult); return isFinite(m) && m > 0 ? m : 0; }
  function ago(ts) { var m = (Date.now() - (ts || 0)) / 60000;
    if (!ts) return ''; if (m < 1) return 'now'; if (m < 60) return Math.round(m) + 'm';
    if (m < 1440) return Math.round(m / 60) + 'h'; return Math.round(m / 1440) + 'd'; }
  function money(n) { n = Number(n) || 0;
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K'; return '$' + n.toFixed(0); }
  function rampHex(m) { if (!m) return '#7d8d86';
    if (m >= 5) return '#00ff9c'; if (m >= 2) return '#4ade80'; if (m >= 1.15) return '#a3e635';
    if (m >= .85) return '#7d8d86'; if (m >= .5) return '#fbbf24'; if (m >= .25) return '#fb7185';
    return '#ef4444'; }

  /* ── market weather + news ticker (all key-free, server-proxied) ──────── */
  function wfmt(n) { n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K'; return n.toFixed(2); }
  function loadMarketWeather() {
    var box = $('mktChips'); if (!box) return;
    fetch('/api/tufish/watch?ids=bitcoin,ethereum,solana', { signal: AbortSignal.timeout(8000) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.coins || !d.coins.length) return;
        box.innerHTML = d.coins.map(function (c) {
          var ch = Number(c.change24h) || 0, up = ch >= 0;
          return '<span class="mkt"><b>' + esc(c.symbol) + '</b> $' + wfmt(c.price) +
            ' <i class="' + (up ? 'up' : 'dn') + '">' + (up ? '▲' : '▼') + (up ? '+' : '') +
            ch.toFixed(1) + '%</i></span>';
        }).join('');
      }).catch(function () {});
  }
  function loadTicker() {
    var tr = $('ttrack'); if (!tr) return;
    fetch('/api/tufish/news?q=crypto', { signal: AbortSignal.timeout(10000) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d && d.items) || [];
        if (!items.length) return;
        var one = items.map(function (it) {
          return '<span class="tt"><span class="ts">' + esc(it.source || 'NEWS') + '</span>' +
            '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></span>';
        }).join('');
        tr.innerHTML = one + one;   // two copies → seamless 60s loop
      }).catch(function () {});
  }
  /* News context pinned to one signal — the headline read before you bet. */
  function fillCoinNews(sym) {
    var box = $('cnNews'); if (!box || !sym) { if (box) box.textContent = 'News offline.'; return; }
    box.innerHTML = '<span style="color:var(--ink-faint)">…</span>';
    fetch('/api/tufish/news?q=' + encodeURIComponent(sym), { signal: AbortSignal.timeout(8000) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d && d.items) || [];
        if (!items.length) { box.textContent = 'No fresh headlines for ' + sym + '.'; return; }
        box.innerHTML = items.slice(0, 3).map(function (it) {
          return '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) +
            ' <em>— ' + esc(it.source || 'news') + '</em></a>';
        }).join('');
      }).catch(function () { box.textContent = 'News offline.'; });
  }

  /* ── demo trading app ────────────────────────────────────────────────────
     Paper desk wired to the same portfolio the auto-trader uses (zerox-demo),
     which already carries ZEROX's paybox receiving + agent execution wallets.
     Fills happen at the CURRENT price fetched at press time; the equity line
     only moves on what really happened. */

  var DEMO = { userId: 'zerox-demo', chart: null };
  var DEMO_IDS = { BTC: 'bitcoin', ETH: 'ethereum', SOL: 'solana' };

  function injectChart() {
    if (window.LightweightCharts) return;
    var sc = document.createElement('script');
    sc.src = 'https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js';
    document.head.appendChild(sc);
  }
  function ensureDemo() {
    var v = $('v-demo'); if (!v) return;
    [].forEach.call(document.querySelectorAll('.view'), function (x) { x.classList.remove('on'); });
    v.classList.add('on');
    injectChart();
    loadDemo();
  }
  function demoPrices(syms) {
    syms = (syms || []).filter(function (x) { return x; });
    var want = {};
    syms.forEach(function (s0) {
      if (DEMO_IDS[s0]) want[DEMO_IDS[s0]] = s0;
      else want[s0.toLowerCase()] = s0;
    });
    var out = {};
    return fetch('/api/tufish/watch?ids=' + encodeURIComponent(Object.keys(want).join(',')), { signal: AbortSignal.timeout(8000) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        (d && d.coins || []).forEach(function (c) { out[c.symbol] = Number(c.price) || 0; });
        return out;
      })
      .catch(function () { return out; });
  }
  function drawEquity(pts) {
    var el = $('dChart'); if (!el || !window.LightweightCharts) return;
    if (DEMO.chart) { try { DEMO.chart.remove(); } catch (e) {} DEMO.chart = null; }
    DEMO.chart = LightweightCharts.createChart(el, {
      width: el.clientWidth, height: Math.max(160, el.clientHeight || 210),
      layout: { background: { type: 'solid', color: '#05080b' }, textColor: '#93a49b', fontSize: 10 },
      grid: { vertLines: { color: 'rgba(120,150,140,.08)' }, horzLines: { color: 'rgba(120,150,140,.08)' } },
      rightPriceScale: { borderColor: 'rgba(120,150,140,.2)' },
      timeScale: { borderColor: 'rgba(120,150,140,.2)', timeVisible: true, secondsVisible: false }
    });
    var line = DEMO.chart.addLineSeries({ color: '#00ff9c', lineWidth: 2, priceLineVisible: false,
      lastValueVisible: true, crosshairMarkerVisible: true });
    line.setData(pts.map(function (q) {
      return { time: Math.floor(q.t / 1000), value: Math.round(q.s * 100) / 100 };
    }));
  }
  function renderDemo(p) {
    var eqB = $('demoEquity'), pn = $('demoPnl'), op = $('dOpen'), cl = $('dClosed'), st = $('dSettle');
    if (!eqB) return;
    eqB.textContent = '-'; pn.textContent = ''; op.innerHTML = '<div class="d-empty">-</div>';
    cl.innerHTML = '<div class="d-empty">-</div>'; if (st) st.textContent = '';
    if (!p || !p.exists) {
      op.innerHTML = '<div class="d-empty">No account yet. Hit Seed $1K.</div>';
      return;
    }
    var bal = Number(p.balance) || 0, start = Number(p.startingBalance) || bal;
    var open = p.openTrades || [], closed = p.closedTrades || [];
    var unreal = 0, syms = open.map(function (o) { return o.symbol; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
    demoPrices(syms).then(function (px) {
      open.forEach(function (o) {
        var cur = px[o.symbol];
        if (cur && o.entry) {
          var mult = o.side === 'sell' ? o.entry / cur : cur / o.entry;
          unreal += (Number(o.notional) || 0) * (mult - 1);
        }
      });
      var eq = bal + unreal;
      eqB.textContent = '$' + money(eq);
      var pl = eq - start, pp = start ? (pl / start * 100) : 0;
      pn.textContent = (pl >= 0 ? '+' : '') + money(pl) + '  (' + (pl >= 0 ? '+' : '') + pp.toFixed(1) + '%)';
      pn.className = pl >= 0 ? 'pos' : 'neg';
      var wins = closed.filter(function (t) { return Number(t.pnl) > 0; }).length;
      if (st) st.textContent = 'wired to ZEROX paybox' +
        (p.paybox && p.paybox.sol ? ' · SOL ' + String(p.paybox.sol).slice(0, 6) + '…' : '') +
        ' · closed ' + closed.length + ' · win ' + closed.length ? (wins / closed.length * 100).toFixed(0) : 0 + '%';
      op.innerHTML = open.length ? open.map(function (o) {
        return '<div class="dt"><span class="sm">' + esc(o.symbol) + '</span><span class="en">@$' +
          money(o.entry) + (o.side === 'sell' ? ' ↓' : ' ↑') + '</span>' +
          '<span class="pl"></span><button class="cx" data-close-sym="' + esc(o.symbol) + '" data-side="' + (o.side === 'sell' ? 'sell' : 'buy') + '">CLOSE</button></div>';
      }).join('') : '<div class="d-empty">No open positions.</div>';
      var last = closed.slice(-12).reverse();
      cl.innerHTML = last.length ? last.map(function (t) {
        var ppct = Number(t.pnlPct) || 0;
        return '<div class="dt"><span class="sm">' + esc(t.symbol) + '</span>' +
          '<span class="pl ' + (ppct >= 0 ? 'pos' : 'neg') + '">' + (ppct >= 0 ? '+' : '') +
          ppct.toFixed(1) + '%</span><span class="pl ' + (ppct >= 0 ? 'pos' : 'neg') + '">' +
          (t.pnl >= 0 ? '+' : '') + '$' + money(t.pnl) + '</span></div>';
      }).join('') : '<div class="d-empty">No closed trades yet.</div>';
    });
    if (p.equity && p.equity.length) drawEquity(p.equity);
  }
  function loadDemo() {
    fetch('/api/prove-edge/portfolio?userId=' + DEMO.userId, { signal: AbortSignal.timeout(8000) })
      .then(function (r) { return r.json(); })
      .then(function (p) { renderDemo(p); })
      .catch(function () {
        var eqB = $('demoEquity'); if (eqB) eqB.textContent = 'offline';
      });
  }
  function demoToast(msg) {
    var b = $('demoOpen'); if (!b) return;
    var old = b.textContent; b.textContent = msg;
    setTimeout(function () { b.textContent = old; }, 1600);
  }
  function openDemo() {
    var sym0 = ($('demoSym').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
    if (!sym0) { demoToast('SYMBOL?'); return; }
    demoPrices([sym0]).then(function (px) {
      var price = px[sym0] || px[sym0.toLowerCase()];
      if (!price) { demoToast('NO PRICE'); return; }
      fetch('/api/prove-edge/trade', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: DEMO.userId, symbol: sym0, side: 'buy', sizePct: 0.02, entry: price })
      }).then(function (r) { return r.json(); })
        .then(function (t) {
          demoToast(t && t.ok ? 'OPENED @ ' + price : (t && t.error ? 'OPEN FAIL' : 'OPEN FAIL'));
          loadDemo();
        }).catch(function () { demoToast('OPEN FAIL'); });
    });
  }
  function closeDemo(sym, side) {
    demoPrices([sym]).then(function (px) {
      var price = px[sym] || px[sym.toLowerCase()];
      if (!price) { demoToast('NO PRICE'); return; }
      fetch('/api/prove-edge/trade', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: DEMO.userId, symbol: sym, side: side || 'buy', exit: price })
      }).then(function (r) { return r.json(); })
        .then(function (t) { demoToast(t && t.ok ? 'CLOSED' : 'CLOSE FAIL'); loadDemo(); })
        .catch(function () { demoToast('CLOSE FAIL'); });
    });
  }
  var dV = $('v-demo');
  if (dV) dV.addEventListener('click', function (e) {
    var b = e.target.closest('[data-close-sym]');
    if (b) { closeDemo(b.dataset.closeSym, b.dataset.side || 'buy'); return; }
    if (e.target.closest('#demoOpen')) { openDemo(); return; }
    if (e.target.closest('#demoSeed')) {
      fetch('/api/prove-edge/portfolio', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: DEMO.userId, startingBalance: 1000, perTradeStake: 0.02 })
      }).then(function (r) { return r.json(); }).then(function (p2) { loadDemo(); }).catch(function () {});
      return;
    }
    if (e.target.closest('#demoReset')) {
      fetch('/api/prove-edge/portfolio', {

  var bub = { nodes: [], raf: 0 };
  function renderBub() {
    var cv = $('bcv'), wrap = $('bubbles');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = wrap.offsetWidth, H = wrap.offsetHeight || 380;
    if (!W) return;
    cv.width = W * dpr; cv.height = H * dpr;
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var by = VIEW.slice().sort(function (a, b) { return mult(b) - mult(a); }).slice(0, 60);
    var sz = by.map(function (c) { return Number(c.curFdv || c.entryFdv || c.vol24) || 1; });
    var mx = Math.max.apply(null, sz.concat([1])), area = W * H;
    bub.nodes = by.map(function (c) {
      var f = (Number(c.curFdv || c.entryFdv || c.vol24) || 1) / mx;
      var r = Math.max(19, Math.min(Math.sqrt(area * f * .05 / Math.PI), Math.min(W, H) * .2));
      return { c: c, r: r, x: Math.random() * (W - 2 * r) + r, y: Math.random() * (H - 2 * r) + r,
               m: c.__top ? 1 + (c.chg24 || 0) / 100 : mult(c) };
    });
    cancelAnimationFrame(bub.raf);
    var steps = 0;
    (function relax() {
      for (var i = 0; i < bub.nodes.length; i++) {
        var a = bub.nodes[i];
        for (var j = i + 1; j < bub.nodes.length; j++) {
          var b = bub.nodes[j], dx = b.x - a.x, dy = b.y - a.y;
          var d = Math.sqrt(dx * dx + dy * dy) || .01, need = a.r + b.r + 3;
          if (d < need) { var p = (need - d) / d * .5;
            a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p; }
        }
        a.x = Math.max(a.r, Math.min(W - a.r, a.x));
        a.y = Math.max(a.r, Math.min(H - a.r, a.y));
      }
      ctx.clearRect(0, 0, W, H);
      bub.nodes.forEach(function (n) {
        var col = rampHex(n.m);
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = col + '30'; ctx.fill();
        ctx.lineWidth = 1.8; ctx.strokeStyle = col; ctx.stroke();
        if (n.r > 24) {
          ctx.textAlign = 'center'; ctx.fillStyle = '#e9efe9';
          ctx.font = '700 ' + Math.min(15, n.r * .42) + 'px IBM Plex Mono, monospace';
          ctx.fillText((n.c.symbol || '?').slice(0, 6), n.x, n.y - 1);
          ctx.fillStyle = col;
          ctx.font = '700 ' + Math.min(14, n.r * .38) + 'px IBM Plex Mono, monospace';
          ctx.fillText(n.c.__top ? Math.round(n.c.chg24 || 0) + '%' : (n.m ? n.m.toFixed(1) + 'x' : '—'),
                       n.x, n.y + Math.min(16, n.r * .48));
        }
      });
      if (++steps < 80) bub.raf = requestAnimationFrame(relax);
    })();
  }

     is tapped, so Signals stays instant. */
  function ensureSwarm() {
    var v = $('v-swarm'); if (!v) return;
    [].forEach.call(document.querySelectorAll('.view'), function (x) { x.classList.remove('on'); });
    v.classList.add('on');
    var f = $('swarmIframe');
    if (f && !f.getAttribute('src')) f.setAttribute('src', '/mirofish-terminal.html');
  }
  if (apptabs) apptabs.addEventListener('click', function (e) {
    var b = e.target.closest('.atab'); if (!b) return;
    [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    APP = b.dataset.app;
    var isPanel = APP === 'swarm' || APP === 'demo';
    var bar = document.querySelector('main .bar');
    $('modes').style.display = isPanel ? 'none' : '';
    $('cats').style.display = (APP === 'mk' || isPanel) ? 'none' : '';
    $('filters').style.display = (APP === 'mk' || isPanel) ? 'none' : '';
    if (mkcats) mkcats.style.display = (APP === 'mk' && !isPanel) ? '' : 'none';
    $('toTerm').style.display = (APP === 'mk' || isPanel) ? 'none' : '';
    if (bar) bar.style.display = isPanel ? 'none' : '';
    if (APP === 'mk' && !MK.loaded) loadMarkets();
    else if (APP === 'swarm') ensureSwarm();
    else if (APP === 'demo') ensureDemo();
    else { restoreChips(); applyFilters(); }
  });
  /* Deep-linkable: /signals.html#swarm opens straight into the swarm app so
     launchers (Simple Mode wheel, landing nav) land where they point. */
  if (location.hash === '#swarm' || location.hash === '#demo') {
    var hb = document.querySelector('.atab[data-app="' + location.hash.slice(1) + '"]');
    if (hb) { hb.click(); }
  }
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.t !== undefined) {
      [].forEach.call(this.querySelectorAll('[data-t]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      P.hours = Number(b.dataset.t);
    } else {
      // socials chips toggle off when tapped again — a filter you cannot clear
      // is a trap
      var on = b.getAttribute('aria-pressed') === 'true';
      [].forEach.call(this.querySelectorAll('[data-s]'), function (x) { x.setAttribute('aria-pressed', 'false'); });
      if (!on) { b.setAttribute('aria-pressed', 'true'); P.social = b.dataset.s; } else P.social = '';
    }
    save(); applyFilters();
  });

  function buildCats() {
    $('cats').innerHTML = CATS.map(function (c) {
      var n = c.top ? (TOP.length || 25)
            : c.srcs ? ALL.filter(function (x) { return !x.closed && c.srcs.indexOf(x.source) !== -1; }).length
            : ALL.filter(function (x) { return !x.closed; }).length;
      return '<button class="chip" data-c="' + c.id + '" aria-pressed="' + (c.id === P.cat) + '"' +
        (c.note ? ' title="' + esc(c.note) + '"' : '') + '>' + c.label + ' <span class="ct">' + n + '</span></button>';
    }).join('');
  }
  function restoreChips() {
    [].forEach.call($('modes').children, function (x) { x.setAttribute('aria-pressed', String(x.dataset.m === P.mode)); });
    [].forEach.call($('filters').querySelectorAll('[data-t]'), function (x) { x.setAttribute('aria-pressed', String(Number(x.dataset.t) === P.hours)); });
    [].forEach.call($('filters').querySelectorAll('[data-s]'), function (x) { x.setAttribute('aria-pressed', String(x.dataset.s === P.social)); });
  }

  var rz; window.addEventListener('resize', function () {
    clearTimeout(rz); rz = setTimeout(function () {
      if (P.mode === 'bub') renderBub();
      if (DEMO.chart) DEMO.chart.applyOptions({ width: $('dChart').clientWidth });
    }, 220); });

  /* ── data ──────────────────────────────────────────────────────────────── */
  function enrichVisible() {
    // Only what is on screen, newest first — enrichment is decoration and must
    // never delay the first paint or hammer a free API.
    var mints = ALL.filter(function (c) { return !c.closed; })
      .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); })
      .slice(0, 90).map(function (c) { return c.mint; })
      .filter(function (m) { return !(m in INFO); });
    if (!mints.length) return;
    fetch('/api/pro-signals/enrich', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mints: mints }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { Object.assign(INFO, d.tokens || {}); render(); })
      .catch(function () {});
  }
  function loadTop() {
    fetch('/api/pro-signals/top-dex?limit=25&_=' + Date.now()).then(function (r) { return r.json(); })
      .then(function (d) {
        TOP = (d.pairs || []).map(function (x) { x.__top = true; return x; });
        buildCats(); applyFilters();
      }).catch(function () { applyFilters(); });
  }
  /* ── Markets app: pull DEX pairs from the deployed server market routes ── */
  function loadMarkets() {
    MK.loaded = true;
    var out = [], done = 0;
    function ok() { if (++done === 2) { MK.feed = out; applyFilters(); } }
    /* Boosted + top tokens: symbol/name/mint/price/volume */
    fetch('/api/markets/boosted-and-top').then(function (r) { return r.json(); }).then(function (d) {
      (d.assets || []).forEach(function (a, i) {
        if (!a.mint && !a.address) return;
        out.push({
          __market: true, kind: 'boost', rank: i + 1,
          mint: a.mint || a.address, symbol: a.symbol, name: a.name || a.symbol,
          priceUsd: a.priceUsd, volume24h: a.volume24h,
          chg24: a.priceChange24h || 0, image: a.image || a.icon || '',
          socials: a.socials || null, pairUrl: a.url || null
        });
      });
      ok();
    }).catch(ok);
    /* DexScreener token profiles: rich images + links (hot / building) */
    fetch('/api/markets/dex-hot').then(function (r) { return r.json(); }).then(function (d) {
      var pairs = d.pairs || d.data || [];
      pairs.forEach(function (p) {
        if (!p.tokenAddress && !p.mint) return;
        var links = p.links || [];
        out.push({
          __market: true, kind: 'hot', mint: p.tokenAddress || p.mint || '',
          symbol: p.symbol, name: p.description || p.symbol,
          priceUsd: Number(p.priceUsd) || 0, volume24h: Number(p.volumeUsd24h) || 0, chg24: 0,
          image: p.icon || p.header || p.openGraph || '',
          socials: { any: !!(p.twitterUrl || links.find(function (l) { return l.type === 'twitter'; })), twitter: !!(p.twitterUrl || links.find(function (l) { return l.type === 'twitter'; })), telegram: !!links.find(function (l) { return l.type === 'telegram'; }), site: p.websiteUrl || p.url || null },
          pairUrl: p.url || (p.tokenAddress ? 'https://dexscreener.com/solana/' + p.tokenAddress : null)
        });
      });
      ok();
    }).catch(ok);
  }
  function load() {
    fetch('/api/pro-signals/feed').then(function (r) { return r.json(); })
      .then(function (d) {
        ALL = (d.calls || []).filter(function (c) { return c && c.mint && c.source !== 'test' && c.source !== 'seed'; });
        buildCats(); restoreChips(); applyFilters(); enrichVisible();
        if (P.cat === 'top') loadTop();
      })
      .catch(function () { $('cN').textContent = '—';
        $('v-list').innerHTML = '<div class="empty">Feed unavailable.<br>Try again shortly.</div>'; });
  }
  load();
  setInterval(load, 60000);
  loadMarkets();
  loadMarketWeather();
  loadTicker();

  /* ── Thesis Engine: hover a call for the reasoning, click for the DEX link ── */
  function thesis(c) {
    var side = (c.signal === 'buy' || c.big === 'buy') ? 'BUY' : (c.signal === 'sell' ? 'SELL' : (c.__top || c.__market) ? 'LIVE' : 'WATCH');
    var tryPct = c.edge != null ? Math.round(c.edge * 100) : null;
    var pts = [];
    if (c.riskScore != null) pts.push('risk ' + c.riskScore + (c.riskScore <= 35 ? ' low' : c.riskScore <= 60 ? ' mod' : ' high'));
    if (c.liq) pts.push('liq $' + Math.round(c.liq).toLocaleString());
    if (c.vol24) pts.push('vol ' + money(c.vol24 || 0));
    if (c.holders != null) pts.push((c.holders || 0) + ' hold');
    if (c.entryFdv) pts.push('FDV $' + Math.round(c.entryFdv).toLocaleString());
    if (c.liqRatio) pts.push('LQ ' + c.liqRatio);
    if (c.boost) pts.push('boost ' + c.boost);
    if (c.chg24 != null) pts.push('24h ' + (c.chg24 >= 0 ? '+' : '') + Math.round(c.chg24) + '%');
    if (c.viabilityScore != null) pts.push('live ' + c.viabilityScore);
    if (c.rugScore != null) pts.push('rug ' + c.rugScore);
    var why = (tryPct != null ? 'edge ' + (tryPct >= 0 ? '+' : '') + tryPct + '%' : 'signal scored') + ' · ' + (pts.length ? pts.join(' · ') : 'monitoring live data');
    var d = c.pairUrl || (c.mint && c.mint.indexOf('Sol') === -1 ? 'https://dexscreener.com/solana/' + c.mint : null);
    return '<b>' + side + ' · ' + esc(c.symbol || c.name || '?') + '</b><br>' + esc(why) +
      (d ? '<br><a href="' + esc(d) + '" target="_blank" rel="noopener" style="color:#6ee7a8">DexScreener ↗</a>' : '');
  }
  var thf = document.createElement('div');
  thf.id = 'thf';
  thf.innerHTML = '&nbsp;';
  thf.style.cssText = 'position:fixed;z-index:99;display:none;max-width:300px;padding:8px 10px;border:1px solid rgba(255,255,255,.18);background:rgba(4,10,6,.96);color:#e9f5ec;font:12px/1.5 var(--f-mono);border-radius:8px;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.55);';
  document.body.appendChild(thf);
  function thShow(c, e) {
    thf.innerHTML = thesis(c);
    var w = 312, h = thf.offsetHeight || 96;
    thf.style.left = Math.min(Math.max(6, e.clientX + 14), innerWidth - w) + 'px';
    thf.style.top = Math.min(Math.max(6, e.clientY + 18), innerHeight - h) + 'px';
    thf.style.display = 'block';
  }
  function thHide() { thf.style.display = 'none'; }
  function thCell(e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.hasAttribute('data-mint'))) t = t.parentNode;
    if (!t || !t.getAttribute) return null;
    var mint = t.getAttribute('data-mint');
    if (!mint) return null;
    var all = MK.feed.concat(TOP, ALL);
    for (var i = 0; i < all.length; i++) if (all[i].mint === mint) return all[i];
    return null;
  }
  document.addEventListener('mouseover', function (e) {
    var c = thCell(e);
    if (c) thShow(c, e); else thHide();
  });
  document.addEventListener('mouseout', function () { thHide(); });

  document.addEventListener('click', function (e) {
    var d = e.target;
    while (d && d !== document && !(d.getAttribute && d.hasAttribute('data-dex'))) d = d.parentNode;
    if (d && d.getAttribute) {
      var u = d.getAttribute('data-dex');
      if (u && /^https?:\/\//i.test(u)) { e.preventDefault(); e.stopPropagation(); window.open(u, '_blank'); return; }
    }
    var c = thCell(e);
    if (c) thShow(c, e);
  });


})();
</script>
</body>
</html>
