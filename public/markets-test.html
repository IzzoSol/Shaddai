<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZEROX EXCHANGE — Markets Chart Test</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;background:#04060d;color:#cfe6f5;font-family:'Share Tech Mono',monospace;}
  .wrap{max-width:760px;margin:30px auto;padding:0 16px;}
  h1{font-family:'Orbitron',sans-serif;color:#27e0ff;letter-spacing:2px;font-size:15px;
     text-shadow:0 0 8px rgba(39,224,255,.5);}
  #chart{min-height:380px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>markets-test :: standalone harness</h1>
    <div id="chart"></div>
  </div>
  <script src="/markets-chart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.renderMarketsChart(document.getElementById('chart'), { symbol: 'btc' });
    });
  </script>
</body>
</html>
