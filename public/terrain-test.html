<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SHADDAI World — Terrain Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #hud {
    position: fixed; top: 10px; left: 12px; z-index: 10;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #9fe7ff; background: rgba(0,0,0,.45);
    padding: 8px 11px; border: 1px solid #155; border-radius: 8px; pointer-events: none;
  }
  #hud b { color: #fff; }
</style>
</head>
<body>
<div id="hud">
  <b>Terrain Test</b><br>
  Orbit: drag · zoom: wheel<br>
  Red spheres = marker.y set via <b>t.heightAt(x,z)</b><br>
  (they should rest exactly on the surface)
</div>

<!-- layout must load before the terrain module (classic scripts) -->
<script src="/world-layout.js"></script>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';
  import { OrbitControls } from 'https://unpkg.com/three@0.180.0/examples/jsm/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060a);
  scene.fog = new THREE.Fog(0x05060a, 500, 1400);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 4000);
  camera.position.set(260, 220, 320);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 0, 0);

  // lights
  scene.add(new THREE.HemisphereLight(0x88bbff, 0x202028, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(300, 500, 200);
  sun.castShadow = true;
  scene.add(sun);

  // build terrain
  const t = window.buildWorldTerrain(THREE, scene, window.WORLD_LAYOUT);

  // marker spheres — one per biome center + the flat grid core, Y from heightAt()
  const probes = [
    [0, 0], [60, 60], [120, 0],
    [210, 200], [-230, 170], [190, -230], [-200, -210],
    [300, 0], [0, 300], [-300, -300],
  ];
  const markerGeo = new THREE.SphereGeometry(4, 16, 12);
  const markerMat = new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0x551111 });
  for (const [x, z] of probes) {
    const m = new THREE.Mesh(markerGeo, markerMat);
    m.position.set(x, t.heightAt(x, z) + 4, z); // +radius so it sits ON the surface
    scene.add(m);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  (function loop() {
    requestAnimationFrame(loop);
    t.update(clock.getElapsedTime());
    controls.update();
    renderer.render(scene, camera);
  })();
</script>
</body>
</html>
