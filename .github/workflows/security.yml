# .github/workflows/security.yml
# -----------------------------------------------------------------------------
# SHADDAI automated security CI.
#
# Runs on every push and pull request targeting `main` and performs three checks:
#   1. SECRET SCAN      - self-contained grep over tracked files for committed
#                         API keys / tokens / private keys. BLOCKING.
#   2. DEPENDENCY AUDIT - `npm audit` in backend/. NON-BLOCKING (warning only) so
#                         the ~18 known deferred Metaplex/Solana vulns cannot break
#                         a Render deploy.
#   3. SYNTAX SANITY    - `node -c` parse of the backend entry point. BLOCKING but
#                         effectively free.
#
# NOTE: A separate `secret-scan.yml` runs full-history gitleaks against
# `.gitleaks.toml`. This workflow's grep step is a complementary, zero-dependency
# net that also covers patterns gitleaks isn't configured for (hf_, sk_live_,
# sk-, msy_, xox*-, generic PRIVATE KEY blocks). No paid service required.
# -----------------------------------------------------------------------------

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read   # only need to read the repo

jobs:
  # ===========================================================================
  # 1. SECRET SCAN  (blocking)
  # ===========================================================================
  secret-scan:
    name: Secret scan (grep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for committed secrets
        shell: bash
        run: |
          set -uo pipefail
          echo "Scanning tracked files for secret-shaped strings..."

          # ------------------------------------------------------------------
          # Patterns considered high-confidence real secrets.
          #   gsk_...                  Groq
          #   sk_live_...              Stripe live secret key
          #   sk-...(20+)              OpenAI / Anthropic-style keys.
          #                            Requires a >=20-char run of [A-Za-z0-9]
          #                            with NO hyphens, so hyphenated English
          #                            words like "risk-assessment-framework"
          #                            are NOT matched.
          #   hf_...                   HuggingFace token
          #   AKIA[0-9A-Z]{16}         AWS access key id
          #   AIza[0-9A-Za-z_-]{35}    Google / Firebase API key
          #   msy_...                  Meshy API key
          #   xox[baprs]-...           Slack token
          #   BEGIN * PRIVATE KEY      PEM private key block
          # ------------------------------------------------------------------
          PATTERN='gsk_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|msy_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'

          # ------------------------------------------------------------------
          # Exclusions (avoid known false positives):
          #   - backend/tools-pikadon.js : the detect_secrets tool - its source
          #                                *contains these patterns as regex*.
          #   - *.md / docs/             : documentation with example keys.
          #   - *.example/.sample/.template + .env.example : placeholder files.
          #   - .gitleaks.toml           : the sibling scanner's own rule set.
          #   - this workflow file       : contains the patterns above.
          # ------------------------------------------------------------------
          # Known-public value allowlist. These match the patterns above but are
          # intentionally public and safe to ship:
          #   - The Firebase WEB apiKey (AIzaSyB9Qz...): a client-side config key
          #     that MUST ship in the browser. It is not a secret; Firebase
          #     secures access via Security Rules + authorized domains, not by
          #     hiding this string. Any OTHER AIza key still fails the scan.
          #   - Common placeholder markers.
          # ------------------------------------------------------------------
          # Note: matched case-insensitively via `grep -iEv` below, so no inline (?i).
          ALLOWLIST='AIzaSyB9QzPlI9AiAnisSO-jK-UUJ-ZwtmHlzjw|YOUR_[A-Z0-9_]+|placeholder|redacted|XXXX+|sk-your|sk-xxxx'

          FINDINGS=0
          # git ls-files = only tracked files; -z / read -d handles odd names.
          while IFS= read -r -d '' file; do
            case "$file" in
              backend/tools-pikadon.js) continue ;;
              *.md|docs/*|*.example|*.sample|*.template) continue ;;
              .gitleaks.toml) continue ;;
              .github/workflows/security.yml) continue ;;
            esac
            # Match the patterns, then drop any line that is a known-public/allowlisted value.
            HITS="$(grep -InE "$PATTERN" "$file" 2>/dev/null | grep -ivE "$ALLOWLIST" || true)"
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Possible committed secret detected"
              echo "$HITS" | sed 's/^/    /'
              FINDINGS=$((FINDINGS+1))
            fi
          done < <(git ls-files -z)

          if [ "$FINDINGS" -gt 0 ]; then
            echo ""
            echo "❌ Secret scan failed: $FINDINGS file(s) contain secret-shaped strings."
            echo "   Rotate the key immediately and remove it from history if it is real."
            echo "   If it is a false positive, add the path to the exclusion list in this workflow."
            exit 1
          fi
          echo "✅ Secret scan passed: no committed secrets detected."

  # ===========================================================================
  # 2. DEPENDENCY AUDIT  (non-blocking / warning-only)
  # ===========================================================================
  dependency-audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit (warning only)
        working-directory: backend
        continue-on-error: true   # NEVER fail the build - deferred Metaplex/Solana vulns are known
        run: |
          echo "Running npm audit (high severity). This is advisory only and will NOT fail the build."
          echo "NOTE: ~18 Metaplex/Solana transitive vulns are knowingly deferred to a later sprint."
          npm audit --audit-level=high || true

      - name: Audit note
        if: always()
        run: echo "ℹ️ Dependency audit is advisory. Review the log above; it does not gate deploys."

  # ===========================================================================
  # 3. SYNTAX SANITY CHECK  (blocking, trivial)
  # ===========================================================================
  syntax-check:
    name: Backend syntax sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node -c on backend entry point
        run: |
          echo "Parsing backend/server-production.js..."
          node -c backend/server-production.js
          echo "✅ Syntax OK."
