<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7b3d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#00c8ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#020817;stop-opacity:0" />
    </radialGradient>
    <filter id="hiveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#020817"/>
  
  <!-- Pulsing energy rings -->
  <g>
    <circle cx="256" cy="256" r="220" fill="none" stroke="#00e5a0" stroke-width="1" opacity="0.15"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#00c8ff" stroke-width="1" opacity="0.2"/>
    <circle cx="256" cy="256" r="180" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>
  </g>
  
  <!-- Outer hive ring - 12 nodes -->
  <g>
    <circle cx="256" cy="56" r="12" fill="#00e5a0" filter="url(#hiveGlow)"/>
    <circle cx="365" cy="91" r="10" fill="#00c8ff" filter="url(#hiveGlow)"/>
    <circle cx="421" cy="200" r="12" fill="#8b5cf6" filter="url(#hiveGlow)"/>
    <circle cx="421" cy="312" r="10" fill="#ff7b3d" filter="url(#hiveGlow)"/>
    <circle cx="365" cy="421" r="12" fill="#00e5a0" filter="url(#hiveGlow)"/>
    <circle cx="256" cy="456" r="10" fill="#00c8ff" filter="url(#hiveGlow)"/>
    <circle cx="147" cy="421" r="12" fill="#8b5cf6" filter="url(#hiveGlow)"/>
    <circle cx="91" cy="312" r="10" fill="#ff7b3d" filter="url(#hiveGlow)"/>
    <circle cx="91" cy="200" r="12" fill="#00e5a0" filter="url(#hiveGlow)"/>
    <circle cx="147" cy="91" r="10" fill="#00c8ff" filter="url(#hiveGlow)"/>
  </g>
  
  <!-- Outer connections -->
  <g stroke="url(#hiveGrad)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M256,56 Q365,91 365,91" />
    <circle cx="365" cy="91" r="3" fill="#00c8ff"/>
  </g>
  
  <!-- Inner hexagon - the core -->
  <g filter="url(#hiveGlow)">
    <polygon points="256,180 340,218 340,294 256,332 172,294 172,218" 
             fill="none" stroke="url(#hiveGrad)" stroke-width="4"/>
  </g>
  
  <!-- Central core - The AI Brain -->
  <g>
    <circle cx="256" cy="256" r="80" fill="url(#coreGrad)" filter="url(#ringPulse)"/>
    <circle cx="256" cy="256" r="60" fill="none" stroke="#00e5a0" stroke-width="2" opacity="0.8"/>
    <circle cx="256" cy="256" r="40" fill="none" stroke="#00c8ff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Brain pattern -->
  <g fill="none" stroke="#020817" stroke-width="3" opacity="0.8">
    <!-- Left hemisphere -->
    <path d="M220,230 Q200,256 220,282"/>
    <path d="M235,220 Q215,256 235,292"/>
    <!-- Right hemisphere -->
    <path d="M292,230 Q312,256 292,282"/>
    <path d="M277,220 Q297,256 277,292"/>
    <!-- Corpus callosum -->
    <path d="M220,256 L292,256" stroke-width="2"/>
  </g>
  
  <!-- 7 Agent cores inside -->
  <g>
    <circle cx="256" cy="200" r="8" fill="#ffd700">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="235" r="6" fill="#00c8ff">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="277" r="6" fill="#b06aff">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="312" r="8" fill="#00e5a0">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="202" cy="277" r="6" fill="#ff7b3d">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="202" cy="235" r="6" fill="#ffb020">
      <animate attributeName="opacity" values="1;0.5;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Center - SHADDAI -->
    <circle cx="256" cy="256" r="12" fill="#ffd700">
      <animate attributeName="r" values="12;14;12" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Energy beams to outer nodes -->
  <g stroke="url(#hiveGrad)" stroke-width="1.5" opacity="0.5">
    <line x1="256" y1="200" x2="256" y2="56">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="235" x2="365" y2="91"/>
    <line x1="310" y1="277" x2="421" y2="200"/>
    <line x1="256" y1="312" x2="365" y2="421"/>
    <line x1="202" y1="277" x2="147" y2="421"/>
    <line x1="202" y1="235" x2="91" y2="312"/>
    <line x1="256" y1="200" x2="91" y2="200"/>
    <line x1="256" y1="312" x2="256" y2="456"/>
  </g>
  
  <!-- Floating data particles -->
  <g fill="#00e5a0" opacity="0.6">
    <circle cx="140" cy="140" r="2">
      <animate attributeName="cy" values="140;135;140" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="372" cy="140" r="2">
      <animate attributeName="cy" values="140;145;140" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="280" r="1.5">
      <animate attributeName="cx" values="400;395;400" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="280" r="1.5">
      <animate attributeName="cx" values="112;117;112" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="400" r="2">
      <animate attributeName="cy" values="400;395;400" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- SHADDAI text -->
  <text x="256" y="490" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="url(#hiveGrad)" letter-spacing="8">SHADDAI</text>
  
  <!-- Subtitle -->
  <text x="256" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a6b8a" letter-spacing="4">EMPIRE</text>
</svg>