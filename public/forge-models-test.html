<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHADDAI Forge — 3D Model Viewer</title>
<style>
  :root { --neon:#00f0ff; --mag:#ff2bd6; --bg:#06070d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#e6f7ff; font-family:'Segoe UI',system-ui,sans-serif; height:100vh; overflow:hidden; }
  #app { display:grid; grid-template-columns:240px 1fr; height:100vh; }
  #side { background:#0a0c16; border-right:1px solid #14304a; padding:16px; overflow:auto; }
  h1 { font-size:15px; letter-spacing:2px; color:var(--neon); margin:0 0 14px; text-transform:uppercase; }
  .arch { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; margin-bottom:6px; cursor:pointer;
          background:#0e1426; border:1px solid #1b2b45; border-radius:8px; color:#cfe; text-align:left; font-size:13px; transition:.15s; }
  .arch:hover { border-color:var(--neon); }
  .arch.active { border-color:var(--mag); box-shadow:0 0 12px rgba(255,43,214,.4); }
  .arch img { width:34px; height:34px; border-radius:6px; object-fit:cover; background:#000; }
  #stage { position:relative; }
  #status { position:absolute; top:12px; left:14px; font-size:12px; color:var(--neon); z-index:5; text-shadow:0 0 8px #000; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="side"><h1>Forge Models</h1><div id="list">Loading…</div></div>
  <div id="stage"><div id="status">Select an archetype</div></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070d);
const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.01, 100);
camera.position.set(0, 1, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

scene.add(new THREE.HemisphereLight(0xbfe9ff, 0x202040, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xff2bd6, 0.8); rim.position.set(-4, 2, -3); scene.add(rim);
const grid = new THREE.GridHelper(10, 20, 0x14304a, 0x0e1c2e); scene.add(grid);

const loader = new GLTFLoader();
const clock = new THREE.Clock();
let current = null, mixer = null;

function load(url, fallback) {
  statusEl.textContent = 'Loading model…';
  loader.load(url, (gltf) => {
    if (current) scene.remove(current);
    if (mixer) { mixer.stopAllAction(); mixer = null; }
    current = gltf.scene;
    // play embedded animation clips if the model has any (rigged models)
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(current);
      mixer.clipAction(gltf.animations[0]).play();
    }
    // center + scale to ~1.6 units tall
    const box = new THREE.Box3().setFromObject(current);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const s = 1.6 / (size.y || 1);
    current.scale.setScalar(s);
    current.position.sub(center.multiplyScalar(s));
    current.position.y += (size.y * s) / 2;
    scene.add(current);
    statusEl.textContent = url.split('/').pop() + (gltf.animations.length ? ' (animated)' : '');
  }, undefined, (err) => { if (fallback) { load(fallback); } else { statusEl.textContent = 'Load error: ' + err.message; } });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (current) { current.rotation.y += 0.01; current.position.y += Math.sin(clock.elapsedTime * 1.2) * 0.0015; } // turntable + idle bob
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
});

(async () => {
  const list = document.getElementById('list');
  try {
    const r = await fetch('/api/forge/models');
    const data = await r.json();
    const arch = data.archetypes || {};
    const keys = Object.keys(arch);
    if (!keys.length) { list.textContent = 'No models yet.'; return; }
    list.innerHTML = '';
    keys.forEach((k, i) => {
      const a = arch[k];
      const btn = document.createElement('button');
      btn.className = 'arch';
      btn.innerHTML = `${a.thumb ? `<img src="${a.thumb}" alt="">` : ''}<span>${a.name || k}</span>`;
      const walk = a.glb.replace(/\.glb$/, '-walk.glb');   // prefer the animated walk version
      btn.onclick = () => {
        document.querySelectorAll('.arch').forEach(e => e.classList.remove('active'));
        btn.classList.add('active');
        load(walk, a.glb);
      };
      list.appendChild(btn);
      btn.dataset.arch = k;
      if (i === 0) { btn.classList.add('active'); load(walk, a.glb); }
    });
    // optional ?arch=<code> preselect (used by the dashboard forge "3D VIEW" button)
    const want = new URLSearchParams(location.search).get('arch');
    if (want) { const b = [...document.querySelectorAll('.arch')].find(e => e.dataset.arch === want); if (b) b.click(); }
  } catch (e) { list.textContent = 'Fetch error: ' + e.message; }
})();
</script>
</body>
</html>
