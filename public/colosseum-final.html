<!DOCTYPE html>
<html>
<head>
  <title>SHADDAI Colosseum - Battle Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; background: #000; font-family: monospace; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: fixed; top: 20px; left: 20px;
      background: rgba(0,0,0,0.95); border: 2px solid #0f0;
      color: #0f0; padding: 20px; z-index: 100;
      border-radius: 8px; width: 320px;
    }

    h1 { font-size: 18px; margin-bottom: 15px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; font-size: 12px; }
    .info-item { border: 1px solid #0f0; padding: 8px; border-radius: 4px; }
    .info-label { color: #888; font-size: 10px; }
    .info-value { color: #0f0; font-weight: bold; }

    .modes {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 15px 0; padding: 15px 0; border-top: 1px solid #0f0; border-bottom: 1px solid #0f0;
    }

    .btn {
      background: rgba(0,255,0,0.1); border: 1px solid #0f0;
      color: #0f0; padding: 10px; cursor: pointer; border-radius: 4px;
      font-size: 11px; font-weight: bold; transition: all 0.2s;
      font-family: monospace;
    }

    .btn:hover { background: rgba(0,255,0,0.25); }
    .btn.active { background: #0f0; color: #000; }

    .events {
      background: rgba(0,100,0,0.2); border: 1px solid #0f0;
      padding: 10px; border-radius: 4px; font-size: 11px;
      line-height: 1.6; max-height: 120px; overflow-y: auto;
    }

    .event-msg {
      padding: 5px 0; border-bottom: 1px solid #0f0;
      color: #5fe0ff;
    }

    .event-msg:last-child { border-bottom: none; }

    #status {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.95); border: 1px solid #0f0;
      color: #0f0; padding: 15px; z-index: 100;
      border-radius: 4px; font-size: 11px;
    }

    .status-line { margin: 5px 0; }
    .stat-key { color: #888; }
    .stat-val { color: #0f0; font-weight: bold; float: right; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>⚔️ SHADDAI COLOSSEUM</h1>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">DIAMETER</div>
        <div class="info-value">240m</div>
      </div>
      <div class="info-item">
        <div class="info-label">HEIGHT</div>
        <div class="info-value">35m</div>
      </div>
      <div class="info-item">
        <div class="info-label">FIELD</div>
        <div class="info-value">100×64m</div>
      </div>
      <div class="info-item">
        <div class="info-label">SEATS</div>
        <div class="info-value">40 rows</div>
      </div>
    </div>

    <div class="modes">
      <button class="btn active" onclick="setArenaMode('sand')">🏜️ Sand</button>
      <button class="btn" onclick="setArenaMode('water')">💧 Water</button>
      <button class="btn" onclick="setArenaMode('naval')">⛵ Naval</button>
      <button class="btn" onclick="setArenaMode('terrain')">🏔️ Terrain</button>
    </div>

    <div style="font-size: 11px; margin-bottom: 10px;">
      <div style="color: #888;">CURRENT EVENT</div>
      <div id="eventName" style="color: #ffd700; font-weight: bold; margin-top: 5px;">SAND GLADIATOR COMBAT</div>
    </div>

    <div class="events" id="eventLog">
      <div class="event-msg">Arena ready for combat...</div>
    </div>
  </div>

  <div id="status">
    <div class="status-line"><span class="stat-key">Mode:</span><span class="stat-val" id="modeVal">SAND</span></div>
    <div class="status-line"><span class="stat-key">Spectators:</span><span class="stat-val" id="specVal">42,000</span></div>
    <div class="status-line"><span class="stat-key">Energy:</span><span class="stat-val" id="energyVal">100%</span></div>
    <div class="status-line"><span class="stat-key">FPS:</span><span class="stat-val" id="fpsVal">60</span></div>
  </div>

  <script src="https://unpkg.com/three@r128/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, clock;
    let boats = [];
    let rocks = [];
    let frameCount = 0;
    let lastTime = Date.now();
    let currentMode = 'sand';
    let eventLog = [];

    function addEvent(msg) {
      eventLog.unshift(msg);
      if (eventLog.length > 5) eventLog.pop();

      const logEl = document.getElementById('eventLog');
      logEl.innerHTML = eventLog.map(e => `<div class="event-msg">${e}</div>`).join('');
    }

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e0c);
      scene.fog = new THREE.Fog(0x0a0e0c, 350, 1200);

      // Camera
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(180, 100, 180);
      camera.lookAt(0, 30, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, precision: 'highp' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowShadowMap;
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      // Build everything
      buildFullArena();
      setupControls();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
      addEvent('🎪 Spectators entering the colosseum...');
    }

    function buildFullArena() {
      // Materials
      const mat = {
        sand: new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.95, metalness: 0 }),
        water: new THREE.MeshStandardMaterial({ color: 0x1a7fa0, roughness: 0.25, metalness: 0.2, transparent: true, opacity: 0.8 }),
        seat: new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.8, metalness: 0 }),
        stone: new THREE.MeshStandardMaterial({ color: 0xb8956a, roughness: 0.85, metalness: 0 }),
        steel: new THREE.MeshStandardMaterial({ color: 0x545454, roughness: 0.5, metalness: 0.8 }),
        marble: new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.3, metalness: 0.1 })
      };

      // ARENA FLOORS
      const sandFloor = new THREE.Mesh(new THREE.PlaneGeometry(100, 64), mat.sand);
      sandFloor.name = 'sandFloor';
      sandFloor.rotation.x = -Math.PI / 2;
      sandFloor.position.y = 0.01;
      sandFloor.receiveShadow = true;
      scene.add(sandFloor);

      const waterFloor = new THREE.Mesh(new THREE.PlaneGeometry(100, 64), mat.water);
      waterFloor.name = 'waterFloor';
      waterFloor.rotation.x = -Math.PI / 2;
      waterFloor.position.y = 0.5;
      waterFloor.receiveShadow = true;
      waterFloor.visible = false;
      scene.add(waterFloor);

      // BOATS
      for (let i = 0; i < 2; i++) {
        const boat = new THREE.Group();

        const hull = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 15), mat.steel);
        hull.castShadow = true;
        boat.add(hull);

        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 14), mat.steel);
        mast.position.y = 9;
        mast.castShadow = true;
        boat.add(mast);

        const sail = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), mat.marble);
        sail.position.set(3, 7, 0);
        boat.add(sail);

        boat.position.set((i === 0 ? -40 : 40), 1.5, (i === 0 ? -30 : 30));
        boat.userData.phase = i * Math.PI;
        boat.userData.baseY = 1.5;
        boat.visible = false;
        scene.add(boat);
        boats.push(boat);
      }

      // ROCKS
      for (let i = 0; i < 8; i++) {
        const rock = new THREE.Mesh(
          new THREE.IcosahedronGeometry(3.5 + Math.random() * 2, 2),
          mat.stone
        );
        const angle = (i / 8) * Math.PI * 2;
        rock.position.set(Math.cos(angle) * 45, 2.5, Math.sin(angle) * 45);
        rock.castShadow = true;
        rock.visible = false;
        scene.add(rock);
        rocks.push(rock);
      }

      // PODIUM
      const podGeo = new THREE.LatheGeometry([
        new THREE.Vector2(50, 0),
        new THREE.Vector2(53, 0),
        new THREE.Vector2(53, 2),
        new THREE.Vector2(50, 2)
      ], 64);
      const podium = new THREE.Mesh(podGeo, mat.stone);
      podium.castShadow = true;
      podium.receiveShadow = true;
      scene.add(podium);

      // LOWER BLEACHERS (20 rows)
      for (let i = 0; i < 20; i++) {
        const r1 = 53 + i * 2.5;
        const r2 = 53 + (i + 1) * 2.5;
        const geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0),
          new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, 0.75),
          new THREE.Vector2(r1, 0.75)
        ], 64);
        const row = new THREE.Mesh(geo, mat.seat);
        row.position.y = 2 + i * 0.75;
        row.castShadow = true;
        row.receiveShadow = true;
        scene.add(row);
      }

      // PROMENADE
      const promGeo = new THREE.LatheGeometry([
        new THREE.Vector2(103, 0),
        new THREE.Vector2(107, 0),
        new THREE.Vector2(107, 1.5),
        new THREE.Vector2(103, 1.5)
      ], 64);
      const prom = new THREE.Mesh(promGeo, mat.stone);
      prom.position.y = 18;
      prom.castShadow = true;
      prom.receiveShadow = true;
      scene.add(prom);

      // UPPER BLEACHERS (20 rows)
      for (let i = 0; i < 20; i++) {
        const r1 = 107 + i * 2.5;
        const r2 = 107 + (i + 1) * 2.5;
        const geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0),
          new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, 0.6),
          new THREE.Vector2(r1, 0.6)
        ], 64);
        const row = new THREE.Mesh(geo, mat.seat);
        row.position.y = 18 + i * 0.6;
        row.castShadow = true;
        row.receiveShadow = true;
        scene.add(row);
      }

      // ROOF
      const roofGeo = new THREE.LatheGeometry([
        new THREE.Vector2(157, 0),
        new THREE.Vector2(167, 0),
        new THREE.Vector2(167, 35),
        new THREE.Vector2(157, 35)
      ], 64);
      const roof = new THREE.Mesh(roofGeo, mat.steel);
      roof.castShadow = true;
      roof.receiveShadow = true;
      scene.add(roof);

      // PILLARS (32)
      for (let i = 0; i < 32; i++) {
        const angle = (i / 32) * Math.PI * 2;
        const x = Math.cos(angle) * 162;
        const z = Math.sin(angle) * 162;
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(1.3, 1.3, 32, 12),
          mat.steel
        );
        pillar.position.set(x, 16, z);
        pillar.castShadow = true;
        scene.add(pillar);
      }

      // GRAND LOBBY
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(85, 45), mat.marble);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 18, 210);
      floor.receiveShadow = true;
      scene.add(floor);

      const walls = [
        new THREE.Vector3(0, 18, 238),  // back
        new THREE.Vector3(-42.5, 18, 210), // left
        new THREE.Vector3(42.5, 18, 210)   // right
      ];

      const wallGeos = [
        new THREE.BoxGeometry(85, 32, 1), // back
        new THREE.BoxGeometry(1, 32, 45), // left
        new THREE.BoxGeometry(1, 32, 45)  // right
      ];

      walls.forEach((pos, i) => {
        const wall = new THREE.Mesh(wallGeos[i], mat.stone);
        wall.position.copy(pos);
        wall.position.y = 16;
        wall.castShadow = true;
        scene.add(wall);
      });

      // Columns
      const colGeo = new THREE.CylinderGeometry(1.6, 1.6, 28, 12);
      [[-4, -2], [-4, 2], [0, -2], [0, 2], [4, -2], [4, 2]].forEach(([cx, cz]) => {
        const col = new THREE.Mesh(colGeo, mat.marble);
        col.position.set(cx * 12, 14, 210 + cz * 15);
        col.castShadow = true;
        scene.add(col);
      });

      // LIGHTING
      scene.add(new THREE.AmbientLight(0xffffff, 0.75));

      const sun = new THREE.DirectionalLight(0xffffff, 1.5);
      sun.position.set(120, 120, 120);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 4096;
      sun.shadow.mapSize.height = 4096;
      sun.shadow.camera.far = 900;
      scene.add(sun);

      for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        const light = new THREE.SpotLight(0xffd700, 2.2);
        light.position.set(Math.cos(angle) * 165, 34, Math.sin(angle) * 165);
        light.target.position.set(0, 20, 0);
        light.castShadow = true;
        light.angle = Math.PI / 6;
        scene.add(light);
      }
    }

    function setupControls() {
      let drag = false, px = 0, py = 0;

      document.addEventListener('mousedown', (e) => {
        drag = true;
        px = e.clientX;
        py = e.clientY;
      });

      document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        const dx = e.clientX - px;
        const dy = e.clientY - py;
        camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -dx * 0.01);
        px = e.clientX;
        py = e.clientY;
      });

      document.addEventListener('mouseup', () => { drag = false; });

      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        const d = camera.position.length();
        const dir = camera.position.clone().normalize();
        const nd = Math.max(60, Math.min(600, d + e.deltaY * 0.2));
        camera.position.copy(dir.multiplyScalar(nd));
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      // Animate boats
      boats.forEach(boat => {
        boat.userData.phase += dt * 2;
        boat.position.y = boat.userData.baseY + Math.sin(boat.userData.phase) * 0.6;
        boat.rotation.z = Math.sin(boat.userData.phase * 0.5) * 0.12;
      });

      // FPS
      frameCount++;
      const now = Date.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fpsVal').textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      renderer.render(scene, camera);
    }

    function setArenaMode(mode) {
      currentMode = mode;

      const sandFloor = scene.getObjectByName('sandFloor');
      const waterFloor = scene.getObjectByName('waterFloor');

      sandFloor.visible = (mode === 'sand');
      waterFloor.visible = (mode === 'water' || mode === 'naval');

      boats.forEach(b => {
        b.visible = (mode === 'water' || mode === 'naval');
      });

      rocks.forEach(r => {
        r.visible = (mode === 'terrain');
      });

      // Update UI
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('modeVal').textContent = mode.toUpperCase();

      // Event messages
      const events = {
        sand: { name: 'SAND GLADIATOR COMBAT', msg: '⚔️ Gladiators ready for battle!' },
        water: { name: 'WATER SPECTACLE', msg: '💧 Water flooding the arena!' },
        naval: { name: 'NAVAL BATTLE', msg: '⛵ Ships clash in battle!' },
        terrain: { name: 'TERRAIN COMBAT', msg: '🏔️ Fighters engage in rough terrain!' }
      };

      const evt = events[mode];
      document.getElementById('eventName').textContent = evt.name;
      addEvent(evt.msg);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
