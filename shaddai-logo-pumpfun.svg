<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#020817;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#020817"/>
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>
  
  <!-- Main symbol - stylized S in infinity -->
  <g filter="url(#neon)">
    <!-- Infinity loop -->
    <path d="M180,256 C180,160 220,140 256,140 C292,140 332,160 332,256 C332,352 292,372 256,372 C220,372 180,352 180,256" 
          fill="none" stroke="url(#pumpGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- S curve through center -->
    <path d="M200,200 C230,180 280,180 310,220 C340,260 340,300 310,320 C280,340 230,340 200,320" 
          fill="none" stroke="#020817" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Glowing core -->
  <circle cx="256" cy="256" r="40" fill="#020817"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#00e5a0" stroke-width="3" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="15" fill="#00e5a0"/>
  
  <!-- Orbiting nodes -->
  <g>
    <circle cx="256" cy="100" r="8" fill="#00e5a0" filter="url(#neon)"/>
    <circle cx="390" cy="170" r="8" fill="#00c8ff" filter="url(#neon)"/>
    <circle cx="390" cy="342" r="8" fill="#8b5cf6" filter="url(#neon)"/>
    <circle cx="256" cy="412" r="8" fill="#00e5a0" filter="url(#neon)"/>
    <circle cx="122" cy="342" r="8" fill="#00c8ff" filter="url(#neon)"/>
    <circle cx="122" cy="170" r="8" fill="#8b5cf6" filter="url(#neon)"/>
  </g>
  
  <!-- Orbit rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00e5a0" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00c8ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Agent dots on ring -->
  <g fill="#00e5a0" opacity="0.7">
    <circle cx="150" cy="200" r="3"/>
    <circle cx="362" cy="200" r="3"/>
    <circle cx="362" cy="312" r="3"/>
    <circle cx="150" cy="312" r="3"/>
  </g>
  
  <!-- SHADDAI text - Bold and clear -->
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="36" font-weight="900" fill="#00e5a0" letter-spacing="6">SHADDAI</text>
  
  <!-- Small tagline -->
  <text x="256" y="492" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a6b8a" letter-spacing="2">AUTONOMOUS AGENTS</text>
</svg>