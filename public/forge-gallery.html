<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHADDAI · Forge Models — Render Review</title>
<style>
  :root{ --bg:#05070e; --panel:#0a0e1a; --bd:#16233b; --txt:#dbeafe; --mut:#7f93b3; --neon:#27e0ff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:radial-gradient(1200px 700px at 50% -10%,#0c1630,#05070e 60%); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; }
  header{ padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1{ font-size:16px; letter-spacing:2px; margin:0; color:var(--neon); text-transform:uppercase; }
  header .sub{ font-size:11px; color:var(--mut); }
  #grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding:0 18px 28px; }
  .card{ background:var(--panel); border:1px solid var(--bd); border-radius:12px; overflow:hidden; }
  .card.newbuild{ border-color:#3ddc84; box-shadow:0 0 0 1px #3ddc8455, 0 0 18px #3ddc8422; }
  .view{ height:300px; position:relative; background:#070b14; }
  .view canvas{ display:block; width:100%; height:100%; }
  .view .fb{ position:absolute; inset:0; background-size:cover; background-position:center top; display:none; }
  .view .tag{ position:absolute; top:8px; left:10px; font-size:9px; color:var(--neon); text-shadow:0 0 6px #000; letter-spacing:1px; z-index:2; pointer-events:none; }
  .view .new{ position:absolute; top:8px; right:10px; font-size:8px; font-weight:800; color:#04130b; background:#3ddc84; border-radius:4px; padding:2px 6px; z-index:2; }
  .meta{ padding:9px 11px; }
  .meta b{ font-size:14px; letter-spacing:1px; }
  .meta span{ display:block; font-size:10px; color:var(--mut); margin-top:2px; }
  .meta .stat{ font-size:9px; color:var(--mut); margin-top:5px; font-family:'Share Tech Mono',monospace; }
</style>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.180.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"
}}
</script>
<script src="/sw-heal.js"></script>
</head>
<body>
<header>
  <div><h1>⬡ Forge Models — Render Review</h1><div class="sub">drag a model to spin it · green border = new T-pose build</div></div>
  <div class="sub" id="status">loading…</div>
</header>
<div id="grid"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ARCHES = [
  { id:'vanguard',     name:'Vanguard',     role:'Guardian / Tank',   color:'#27e0ff', neu:true },
  { id:'ghost',        name:'Ghost',        role:'Stealth / Recon',   color:'#9b8cff' },
  { id:'artisan',      name:'Artisan',      role:'Creator / Design',  color:'#1fd6c4' },
  { id:'oracle',       name:'Oracle',       role:'Seer / Research',   color:'#c084fc' },
  { id:'street-deity', name:'Street Deity', role:'Hustler / Markets', color:'#ffcf4a' },
  { id:'gaia-link',    name:'Gaia-Link',    role:'Nature / Bio',      color:'#3ddc84' },
  { id:'psionic',      name:'Psionic',      role:'Mind / Logic',      color:'#ff5db1' },
  { id:'harvester',    name:'Harvester',    role:'Reaper / Ops',      color:'#ff5a6e' },
];
const VER = 3; // bump to bust GLB cache after a rebuild
const presetImg = id => '/api/forge/art/arch-' + id + '.png';
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
let done = 0;

ARCHES.forEach(a => {
  const card = document.createElement('div'); card.className = 'card' + (a.neu ? ' newbuild' : '');
  card.innerHTML = `<div class="view">
      <canvas></canvas>
      <div class="fb" style="background-image:url('${presetImg(a.id)}')"></div>
      <div class="tag">loading…</div>${a.neu ? '<div class="new">NEW BUILD</div>' : ''}
    </div>
    <div class="meta"><b style="color:${a.color}">${a.name}</b><span>${a.role}</span><div class="stat">—</div></div>`;
  grid.appendChild(card);
  setupViewer(card, a);
});

function setupViewer(card, a){
  const view = card.querySelector('.view');
  const canvas = card.querySelector('canvas');
  const fb = card.querySelector('.fb');
  const tag = card.querySelector('.tag');
  const stat = card.querySelector('.stat');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio));
  } catch(e){ fb.style.display='block'; tag.textContent='PRESET (no WebGL)'; return; }
  const W = view.clientWidth, H = view.clientHeight;
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x101830, 1.3));
  const k = new THREE.DirectionalLight(0xffffff, 1.7); k.position.set(3,6,4); scene.add(k);
  const rim = new THREE.DirectionalLight(new THREE.Color(a.color), 0.7); rim.position.set(-4,2,-3); scene.add(rim);
  scene.add(new THREE.GridHelper(10,20,0x14304a,0x0d1a2c));
  const cam = new THREE.PerspectiveCamera(42, W/H, 0.05, 100); cam.position.set(0,1.05,4.4);
  const controls = new OrbitControls(cam, renderer.domElement);
  controls.enableDamping = true; controls.target.set(0,1,0); controls.autoRotate = true; controls.autoRotateSpeed = 1.8;
  const clock = new THREE.Clock(); let mixer = null;

  const urls = [`/assets/forge-models/${a.id}-walk.glb?v=${VER}`, `/assets/forge-models/${a.id}.glb?v=${VER}`];
  const attempt = (i) => {
    if (i >= urls.length){ fb.style.display='block'; tag.textContent='PRESET (GLB failed)'; stat.textContent='model did not load'; return; }
    loader.load(urls[i], (g) => {
      const m = g.scene;
      const box = new THREE.Box3().setFromObject(m); const sz = new THREE.Vector3(); box.getSize(sz);
      const s = 2.0/(sz.y||1); m.scale.setScalar(s);
      const b2 = new THREE.Box3().setFromObject(m); const c2 = new THREE.Vector3(); b2.getCenter(c2);
      m.position.x -= c2.x; m.position.z -= c2.z; m.position.y -= b2.min.y;
      let tris=0, meshes=0, tex=0;
      m.traverse(o=>{ if(o.isMesh){ meshes++; const gg=o.geometry; if(gg&&gg.index)tris+=gg.index.count/3; else if(gg&&gg.attributes.position)tris+=gg.attributes.position.count/3; if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(mt=>{ if(mt.color)mt.color.set(0xffffff); if(mt.map)tex++; });} } });
      scene.add(m);
      if (g.animations && g.animations.length){ mixer = new THREE.AnimationMixer(m); mixer.clipAction(g.animations[0]).play(); }
      tag.textContent = g.animations.length ? '3D · ANIMATED' : '3D · STATIC';
      stat.textContent = `${Math.round(tris).toLocaleString()} tris · ${tex} tex · ${urls[i].includes('-walk')?'walk':'static'}`;
      done++; document.getElementById('status').textContent = `${done}/${ARCHES.length} models loaded`;
    }, undefined, () => attempt(i+1));
  };
  attempt(0);

  (function loop(){ requestAnimationFrame(loop); if(mixer) mixer.update(clock.getDelta()); controls.update(); renderer.render(scene, cam); })();
  addEventListener('resize', () => { const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); });
}
</script>

<script src="/home-btn.js" defer></script>
</body>
</html>
