<title>Sprite Capture Rig</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;}#stage{width:100vw;height:100vh;}</style>
<div id="stage"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = null;

  // orthographic left/right/top/bottom are relative to the camera itself,
  // NOT absolute world Y -- so the frustum must be symmetric and the
  // camera's own y must equal the world-space vertical center of the shot.
  // The CPU-side geometry bounding box on these auto-rigged SkinnedMeshes
  // doesn't reliably match where the GPU-skinned mesh actually renders
  // (bind-pose/skin-matrix mismatch from the Meshy auto-rig step), so we
  // can't trust 3D math to frame this precisely. Instead: zoom WAY out to
  // a safe static frame that's guaranteed to contain the whole character
  // no matter where it lands, and let the Node-side pixel analysis
  // (sharp trim, in capture-sprites.mjs) find the real silhouette bounds
  // from the actual rendered pixels and crop/center from that.
  const FRAME_HALF = 5.0;
  const FRAME_CENTER_Y = 1.0;
  const camera = new THREE.OrthographicCamera(-FRAME_HALF, FRAME_HALF, FRAME_HALF, -FRAME_HALF, 0.01, 100);
  camera.position.set(0, FRAME_CENTER_Y, 4);
  camera.lookAt(0, FRAME_CENTER_Y, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const ambL = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambL);
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  window.__setLight = (k) => { ambL.intensity = 1.0 * k; key.intensity = 1.5 * k; };
  key.position.set(2, 4, 3);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x5fe0ff, 0.5);
  rim.position.set(-3, 1, -2);
  scene.add(rim);

  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);

  // rig: outer group we translate every frame to re-center the model,
  // since Meshy's baked walk/run root motion drifts the chibi skeleton
  // vertically (retargeting mismatch) -- fixing it once at load isn't
  // enough, so we recompute the floor/center on every setTime call.
  const rig = new THREE.Group();
  scene.add(rig);

  let mixer = null, action = null, model = null, modelScale = 1;
  window.__ready = false;
  window.__duration = 0;

  function recenter() {
    rig.position.set(0, 0, 0);
    rig.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    rig.position.set(
      -(box.min.x + box.max.x) / 2,
      -box.min.y,
      -(box.min.z + box.max.z) / 2
    );
    window.__debug = { boxMin: box.min.toArray(), boxMax: box.max.toArray(), rigPos: rig.position.toArray(), modelScale };
  }

  // clipPath (optional): play THIS file's animation on glbPath's body. All Meshy rigs
  // share one 26-bone skeleton, so clips retarget by bone name for free.
  // Keep bone ROTATIONS (portable across bodies); drop per-bone translations
  // (baked to the donor's limb lengths -> squashes taller/shorter bodies);
  // keep Hips translation, rescaled by hips-height ratio so root motion fits.
  function retargetClip(clip, body) {
    const hips = body.getObjectByName('Hips');
    const out = [];
    for (const t of clip.tracks) {
      if (t.name.endsWith('.quaternion')) { out.push(t); continue; }
      if (t.name === 'Hips.position' && hips) {
        const donorY = t.values[1] || 1;
        const k = hips.position.y / donorY;
        const v = Float32Array.from(t.values, (x) => x * k);
        out.push(new THREE.VectorKeyframeTrack(t.name, t.times, v));
      }
    }
    return new THREE.AnimationClip(clip.name, clip.duration, out);
  }

  window.__loadClip = function (glbPath, clipPath, armK) {
    window.__ready = false;
    if (model) { rig.remove(model); model = null; mixer = null; action = null; }
    loader.load(glbPath, (gltf) => {
      model = gltf.scene;
      model.position.set(0, 0, 0);
      model.scale.setScalar(1);
      rig.add(model);
      rig.position.set(0, 0, 0);
      const box1 = new THREE.Box3().setFromObject(model);
      const size1 = box1.getSize(new THREE.Vector3());
      modelScale = 1.6 / Math.max(size1.x, size1.y, size1.z);
      model.scale.setScalar(modelScale);

      const startAnim = (clip) => {
        // Any per-character proportion tweak requires rotations-only clips, else the
        // clip's baked bone translations would overwrite the stretched joints.
        if (armK && armK !== 1) window.__stretchArms(armK);
        if (clipPath || (armK && armK !== 1)) clip = retargetClip(clip, model);
        mixer = new THREE.AnimationMixer(model);
        action = mixer.clipAction(clip);
        action.play();
        window.__duration = clip.duration;
        mixer.setTime(0);
        recenter();
        renderer.render(scene, camera);
        window.__ready = true;
      };
      if (clipPath) {
        loader.load(clipPath, (cg) => startAnim(cg.animations[0]), undefined, () => { window.__ready = 'error'; });
        return;
      }
      if (armK && armK !== 1 && gltf.animations && gltf.animations.length) {
        startAnim(gltf.animations[0]);
        return;
      }
      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        action = mixer.clipAction(gltf.animations[0]);
        action.play();
        // NOTE: do NOT set action.paused = true -- three.js forces
        // deltaTime to 0 for paused actions inside AnimationAction._update,
        // which makes mixer.setTime() below silently freeze the pose near
        // frame 0 no matter what time is requested.
        window.__duration = gltf.animations[0].duration;
        mixer.setTime(0);
      } else {
        window.__duration = 0;
      }
      recenter();
      renderer.render(scene, camera);
      window.__ready = true;
    }, undefined, (err) => { console.error('load fail', err); window.__ready = 'error'; });
  };

  // Proportion fix: lengthen arms by moving child joint offsets (translation only;
  // limbs stretch at elbow/wrist, hands stay unscaled). k = 1.0 -> unchanged.
  window.__stretchArms = function (k) {
    for (const side of ['Left', 'Right']) {
      for (const n of [side + 'ForeArm', side + 'Hand']) {
        const b = model.getObjectByName(n);
        if (b) b.position.multiplyScalar(k);
      }
    }
    model.updateMatrixWorld(true);
    recenter();
    renderer.render(scene, camera);
  };

  window.__setTime = function (t) {
    if (mixer && action) mixer.setTime(t);
    recenter();
    renderer.render(scene, camera);
  };

  (function tick(){ requestAnimationFrame(tick); if (!mixer) renderer.render(scene, camera); })();
</script>
