<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRON SNAKE · SHADDAI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#27e0ff; --amber:#ffcf4a; --void:#04060d; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void);color:#eaf2ff;font-family:'Share Tech Mono',monospace;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #hud{display:flex;gap:22px;align-items:center;font-family:'Orbitron',sans-serif;letter-spacing:2px}
  #hud .t{font-weight:900;font-size:18px;color:#fff;text-shadow:0 0 14px var(--cyan)}
  #hud .t b{color:var(--cyan)}
  #hud .s{font-size:13px;color:var(--amber)}
  #board{border:1px solid rgba(39,224,255,.3);border-radius:10px;box-shadow:0 0 40px rgba(39,224,255,.25),inset 0 0 40px rgba(39,224,255,.06);background:#020509;display:block;touch-action:none}
  #hint{font-size:11px;letter-spacing:2px;color:#7e8aa3}
  #hint .k{border:1px solid rgba(174,187,214,.35);border-radius:4px;padding:1px 6px;margin:0 2px;color:#fff}
  /* touch d-pad */
  #pad{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px;z-index:10}
  #pad button{font-size:22px;background:rgba(39,224,255,.10);border:1px solid var(--cyan);color:var(--cyan);border-radius:12px;box-shadow:0 0 14px rgba(39,224,255,.3)}
  #pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
  /* overlay */
  #over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,5,9,.82);backdrop-filter:blur(4px);z-index:20;text-align:center}
  #over.hide{display:none}
  #over .big{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(28px,7vw,56px);letter-spacing:8px;color:#fff;text-shadow:0 0 30px var(--cyan)}
  #over .big b{color:var(--cyan)}
  #over .sub{margin-top:10px;font-size:13px;letter-spacing:3px;color:var(--amber)}
  #over button{margin-top:26px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;color:#04060d;background:linear-gradient(90deg,var(--cyan),var(--amber));border:none;border-radius:10px;padding:14px 34px;cursor:pointer;box-shadow:0 0 30px rgba(39,224,255,.5)}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><div class="t">TRON <b>SNAKE</b></div><div class="s" id="score">SCORE 0</div><div class="s" id="best">BEST 0</div></div>
  <canvas id="board"></canvas>
  <div id="hint"><span class="k">↑↓←→</span> / <span class="k">WASD</span> · swipe on mobile · <span class="k">SPACE</span> pause</div>
</div>
<div id="pad">
  <button class="up" data-d="up">▲</button>
  <button class="left" data-d="left">◀</button>
  <button class="down" data-d="down">▼</button>
  <button class="right" data-d="right">▶</button>
</div>
<div id="over">
  <div class="big" id="overTitle">TRON <b>SNAKE</b></div>
  <div class="sub" id="overSub">ride the light · eat the data · don't cross your trail</div>
  <button id="startBtn">▶ START</button>
</div>
<script>
(function(){
  const cv=document.getElementById('board'), x=cv.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const over=document.getElementById('over'), overTitle=document.getElementById('overTitle'), overSub=document.getElementById('overSub'), startBtn=document.getElementById('startBtn');
  const GRID=24;            // cells across/down
  let CELL=24;              // px per cell (set on resize)
  let snake, dir, nextDir, food, score, best=+(localStorage.getItem('tronSnakeBest')||0), speed, acc, running, paused, last;

  bestEl.textContent='BEST '+best;

  function fit(){
    const max=Math.min(window.innerWidth-24, window.innerHeight-160, 620);
    CELL=Math.floor(max/GRID); const px=CELL*GRID;
    cv.width=px; cv.height=px;
    // mobile d-pad
    document.getElementById('pad').style.display = ('ontouchstart' in window) ? 'grid' : 'none';
  }
  window.addEventListener('resize', fit); fit();

  function reset(){
    snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
    dir={x:1,y:0}; nextDir={x:1,y:0};
    score=0; speed=8; acc=0; paused=false;
    placeFood();
    scoreEl.textContent='SCORE 0';
  }
  function placeFood(){
    do { food={x:(Math.random()*GRID)|0, y:(Math.random()*GRID)|0}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function start(){ reset(); running=true; over.classList.add('hide'); last=performance.now(); requestAnimationFrame(loop); }
  function gameOver(){
    running=false;
    if(score>best){ best=score; localStorage.setItem('tronSnakeBest',best); bestEl.textContent='BEST '+best; }
    overTitle.innerHTML='GAME <b>OVER</b>'; overSub.textContent='score '+score+' · best '+best;
    startBtn.textContent='▶ PLAY AGAIN'; over.classList.remove('hide');
  }

  function setDir(d){
    const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
    if(!m) return;
    if(m.x===-dir.x && m.y===-dir.y) return;   // no 180°
    nextDir=m;
  }
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w') setDir('up');
    else if(k==='arrowdown'||k==='s') setDir('down');
    else if(k==='arrowleft'||k==='a') setDir('left');
    else if(k==='arrowright'||k==='d') setDir('right');
    else if(k===' '){ if(running) paused=!paused; }
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  });
  document.querySelectorAll('#pad button').forEach(b=>{
    b.addEventListener('touchstart',e=>{ e.preventDefault(); setDir(b.dataset.d); },{passive:false});
    b.addEventListener('mousedown',()=>setDir(b.dataset.d));
  });
  // swipe
  let tsx=0,tsy=0;
  cv.addEventListener('touchstart',e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
  cv.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left'); else setDir(dy>0?'down':'up'); },{passive:true});

  function step(){
    dir=nextDir;
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    // walls + self
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){ gameOver(); return; }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score+=10; scoreEl.textContent='SCORE '+score; speed=Math.min(20,8+score/40); placeFood(); }
    else snake.pop();
  }

  function draw(){
    x.clearRect(0,0,cv.width,cv.height);
    // grid
    x.strokeStyle='rgba(39,224,255,0.08)'; x.lineWidth=1;
    for(let i=0;i<=GRID;i++){ const p=i*CELL+.5; x.beginPath(); x.moveTo(p,0); x.lineTo(p,cv.height); x.moveTo(0,p); x.lineTo(cv.width,p); x.stroke(); }
    // food (amber data node)
    x.save(); x.shadowColor='#ffcf4a'; x.shadowBlur=18; x.fillStyle='#ffcf4a';
    const fx=food.x*CELL, fy=food.y*CELL;
    x.fillRect(fx+CELL*0.28, fy+CELL*0.28, CELL*0.44, CELL*0.44); x.restore();
    // snake (cyan light trail)
    x.save(); x.shadowColor='#27e0ff'; x.shadowBlur=14;
    snake.forEach((s,i)=>{
      const head=i===0; x.fillStyle=head?'#bdf3ff':'#27e0ff';
      const pad=head?1:2; x.fillRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2);
    });
    x.restore();
  }

  function loop(now){
    if(!running) return;
    requestAnimationFrame(loop);
    const dt=(now-last)/1000; last=now;
    if(paused){ draw(); x.fillStyle='rgba(39,224,255,.9)'; x.font='900 24px Orbitron, monospace'; x.textAlign='center'; x.fillText('PAUSED', cv.width/2, cv.height/2); return; }
    acc+=dt;
    if(acc >= 1/speed){ acc=0; step(); }
    draw();
  }

  startBtn.addEventListener('click', start);
  // draw idle board behind the start overlay
  reset(); draw();
})();
</script>
</body>
</html>
