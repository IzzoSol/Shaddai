<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SHADDAI — Pixel City (P1)</title>
<meta name="theme-color" content="#06080b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --void:#06080b; --void2:#0a0e13; --emerald:#00ff9c; --gold:#e8c45c; --cyan:#5fe0ff; --ink:#e9efe9; --ink-soft:#8fa39a; --red:#ff5a6a; }
*{ margin:0; box-sizing:border-box; }
html,body{ height:100%; background:var(--void); color:var(--ink); font-family:'IBM Plex Mono',monospace; overflow:hidden; }
#c{ position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; cursor:crosshair; }

/* ── HUD ─────────────────────────────────────── */
.panel{ position:fixed; z-index:6; background:rgba(6,8,11,.72); border:1px solid rgba(0,255,156,.22);
  backdrop-filter:blur(6px); border-radius:10px; }
#top{ left:14px; top:14px; padding:11px 15px; }
#top .brand{ font-family:'Cinzel',serif; font-weight:800; font-size:18px; letter-spacing:.14em; color:var(--emerald);
  text-shadow:0 0 14px rgba(0,255,156,.45); }
#top .sub{ font-size:9.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-top:2px; }
#clock{ right:14px; top:14px; padding:10px 16px; text-align:right; }
#clock .t{ font-size:20px; font-weight:600; letter-spacing:.06em; color:var(--cyan); }
#clock .d{ font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }
#zone{ left:50%; top:14px; transform:translateX(-50%); padding:9px 20px; text-align:center; opacity:0; transition:opacity .5s; }
#zone.show{ opacity:1; }
#zone .z{ font-family:'Cinzel',serif; font-size:15px; letter-spacing:.12em; color:var(--gold); }
#zone .zs{ font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); margin-top:1px; }
#help{ left:14px; bottom:14px; padding:9px 14px; font-size:10px; line-height:1.7; color:var(--ink-soft); }
#help b{ color:var(--emerald); font-weight:600; }
#help .k{ display:inline-block; min-width:16px; text-align:center; padding:1px 5px; margin:0 1px; border:1px solid rgba(255,255,255,.2);
  border-radius:4px; color:var(--ink); font-size:9px; }
#mini{ right:14px; bottom:14px; width:150px; height:150px; padding:0; overflow:hidden; }
#minic{ width:100%; height:100%; display:block; }
#toast{ position:fixed; left:50%; bottom:74px; transform:translateX(-50%) translateY(12px); z-index:7;
  background:rgba(6,8,11,.9); border:1px solid rgba(232,196,92,.4); border-radius:8px; padding:10px 18px;
  font-size:11px; letter-spacing:.06em; color:var(--gold); opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (max-width:640px){ #mini{ width:110px; height:110px; } #help{ display:none; } #top .brand{ font-size:15px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <div class="brand">SHADDAI</div>
  <div class="sub">Pixel City · Seed of Life District</div>
</div>
<div id="clock" class="panel"><div class="t" id="clockT">12:00</div><div class="d" id="clockD">Midday</div></div>
<div id="zone" class="panel"><div class="z" id="zoneZ">—</div><div class="zs" id="zoneS"></div></div>
<div id="help" class="panel">
  <div><b>MOVE</b> <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> / arrows · <b>RUN</b> <span class="k">shift</span></div>
  <div><b>ENTER</b> <span class="k">E</span> at a glowing door · <b>DAY/NIGHT</b> <span class="k">T</span> · <b>ZOOM</b> wheel</div>
</div>
<div id="mini" class="panel"><canvas id="minic" width="150" height="150"></canvas></div>
<div id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   SHADDAI PIXEL CITY — P1 walkable isometric slice
   Procedural (zero external art). Isometric 2:1. Depth-sorted.
   Districts map to the council: Agora, Aegis(PIKADON), Athenaeum(ORACLE/QUILL),
   Forge(NEXUS), Markets(ZEROX), Sanctuary(TURTLE), Seed-of-Life plaza(SHADDAI).
   ══════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mini = document.getElementById('minic'), mctx = mini.getContext('2d');
let W=0,H=0, DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=false; }
resize(); addEventListener('resize',resize,{passive:true});

/* ── isometric constants ── */
const TW=64, TH=32;              // tile footprint (screen px, 2:1)
const GRID=48;                   // world is GRID×GRID tiles
let zoom=1.0;
function w2s(wx,wy){ return { x:(wx-wy)*(TW/2), y:(wx+wy)*(TH/2) }; }  // pre-camera

/* ── palette helpers ── */
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r*f))|0; g=Math.max(0,Math.min(255,g*f))|0; b=Math.max(0,Math.min(255,b*f))|0;
  return 'rgb('+r+','+g+','+b+')'; }

/* ═══════════ WORLD MODEL ═══════════ */
// tile types: 0 grass, 1 road, 2 plaza(stone), 3 water, 4 path(gold)
const tiles = new Uint8Array(GRID*GRID);
const T=(x,y)=> (x<0||y<0||x>=GRID||y>=GRID)?0:tiles[y*GRID+x];
const setT=(x,y,v)=>{ if(x>=0&&y>=0&&x<GRID&&y<GRID) tiles[y*GRID+x]=v; };

// deterministic PRNG so the city is stable
let seed=1337; const rnd=()=>{ seed=(seed*1664525+1013904223)&0xffffffff; return (seed>>>8)/0x1000000; };

// lay grass
for(let i=0;i<tiles.length;i++) tiles[i]=0;
// ring roads + cross avenues (grid blocks)
for(let x=0;x<GRID;x++) for(let y=0;y<GRID;y++){
  if(x%8===0||y%8===0) setT(x,y,1);
}
// central plaza (Seed of Life) ~ radius 5 around center
const CX=GRID/2, CY=GRID/2;
for(let x=0;x<GRID;x++) for(let y=0;y<GRID;y++){
  const d=Math.hypot(x-CX,y-CY);
  if(d<5.4) setT(x,y,2);
  else if(d>=5.4&&d<6.2) setT(x,y,4);   // gold ring path
}
// a little water pond in the Sanctuary quadrant
for(let x=6;x<11;x++) for(let y=34;y<39;y++){ if(Math.hypot(x-8,y-36)<2.6) setT(x,y,3); }

/* ═══════════ BUILDINGS ═══════════ */
// each: grid x,y (footprint tile), w,d (tiles), h (levels), body color, roof accent, sign, glyph, district
const AGENT_COLORS = { emerald:'#00ff9c', gold:'#e8c45c', cyan:'#5fe0ff', violet:'#b07cff', orange:'#ff9a4d', red:'#ff5a6a', indigo:'#7c8cff' };
const buildings = [];
function B(x,y,w,d,h,col,acc,sign,glyph,zone){ buildings.push({x,y,w,d,h,col,acc,sign,glyph,zone, doorPulse:rnd()*6.28}); }

// ── ring of council district towers (mirrors the seed-of-life agent layout) ──
B(20,10, 4,4, 6, '#12303a', AGENT_COLORS.cyan,   'MARKETS',    '$',  'Markets · ZEROX');       // N
B(31,15, 4,4, 5, '#14243c', AGENT_COLORS.indigo, 'ATHENAEUM',  '📖', 'Athenaeum · ORACLE/QUILL');// NE
B(33,28, 4,4, 7, '#2a1330', AGENT_COLORS.violet, 'SOURCE',     '✦',  'The Source · SHADDAI');   // E
B(28,34, 4,4, 5, '#0f2e22', AGENT_COLORS.emerald,'SANCTUARY',  '🌱', 'Sanctuary · TURTLE');     // SE
B(14,33, 4,4, 6, '#301616', AGENT_COLORS.red,    'AEGIS',      '🛡', 'Aegis · PIKADON');        // SW
B(9,22,  4,4, 6, '#31240f', AGENT_COLORS.gold,   'FORGE',      '⚒',  'The Forge · NEXUS');      // W
B(11,13, 4,4, 5, '#12303a', AGENT_COLORS.cyan,   'AGORA',      '⌂',  'The Agora · Commons');    // NW

// ── everyday-life buildings (the "put your agent to work / commerce" layer) ──
B(2,2,  3,3, 3, '#1a2230', AGENT_COLORS.gold,   'BANK',    '⛁', 'First Sephira Bank');
B(2,18, 3,2, 2, '#20182a', AGENT_COLORS.violet, 'ARCADE',  '◉', 'Arcade & Games');
B(18,2, 2,3, 3, '#122622', AGENT_COLORS.emerald,'GROCER',  '🧺', 'Grocery Exchange');
B(41,3, 3,3, 4, '#1c1420', AGENT_COLORS.cyan,   'JOBS',    '⚑', 'Jobs Board');
B(42,20,3,3, 3, '#241a12', AGENT_COLORS.orange, 'DINER',   '☕', 'DoorDash Diner');
B(41,40,3,3, 4, '#141e2c', AGENT_COLORS.indigo, 'HOUSING', '⌂', 'Agent Housing');
B(3,40, 3,3, 3, '#101c18', AGENT_COLORS.emerald,'PETS',    '🐾', 'Pet Sanctuary');
B(18,41,3,3, 2, '#221420', AGENT_COLORS.red,    'CLINIC',  '✚', 'Repair Clinic');
B(20,20, 2,2, 2, '#1a1a24', AGENT_COLORS.gold,  'PLAZA',   '✧', 'Central Plaza');

// footprint occupancy (block player + mark door tiles)
const solid = new Uint8Array(GRID*GRID);
const doors = []; // {wx,wy, b}
for(const b of buildings){
  for(let dx=0;dx<b.w;dx++) for(let dy=0;dy<b.d;dy++) solid[(b.y+dy)*GRID+(b.x+dx)]=1;
  // door at front-bottom tile (toward camera = +x,+y corner)
  b.door={ x:b.x+b.w-1, y:b.y+b.d, };
  if(b.door.y<GRID) doors.push({wx:b.x+b.w-1+0.5, wy:b.y+b.d-1+0.9, b});
}
const isSolid=(x,y)=>{ x|=0; y|=0; return (x<0||y<0||x>=GRID||y>=GRID)?1:solid[y*GRID+x]; };

/* ═══════════ CITIZENS + CARS (life) ═══════════ */
const NPC_COLS=[AGENT_COLORS.emerald,AGENT_COLORS.cyan,AGENT_COLORS.gold,AGENT_COLORS.violet,AGENT_COLORS.orange,AGENT_COLORS.indigo,'#ffffff'];
const citizens=[];
for(let i=0;i<46;i++){
  let x,y,tries=0; do{ x=rnd()*GRID; y=rnd()*GRID; tries++; }while(isSolid(x,y)&&tries<40);
  citizens.push({x,y, tx:x,ty:y, spd:0.010+rnd()*0.018, col:NPC_COLS[(rnd()*NPC_COLS.length)|0], ph:rnd()*6.28});
}
function retarget(n){ n.tx=Math.max(1,Math.min(GRID-2,n.x+(rnd()*16-8))); n.ty=Math.max(1,Math.min(GRID-2,n.y+(rnd()*16-8))); }
// cars drive along road tiles (x%8==0 vertical, y%8==0 horizontal)
const cars=[];
const CAR_COLS=['#ff5a6a','#5fe0ff','#e8c45c','#00ff9c','#b07cff','#ff9a4d'];
for(let i=0;i<18;i++){
  const horiz=rnd()<0.5;
  const lane=(1+((rnd()*5)|0))*8;
  cars.push({ horiz, x: horiz? rnd()*GRID : lane, y: horiz? lane : rnd()*GRID,
    dir: rnd()<0.5?1:-1, spd:0.05+rnd()*0.06, col:CAR_COLS[(rnd()*CAR_COLS.length)|0] });
}

/* ═══════════ PLAYER (your agent) ═══════════ */
const player={ x:CX+0.5, y:CY+6.5, dir:0, moving:false, run:false, bob:0 };
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true;
  if(e.key==='t'||e.key==='T') toggleDayNight();
  if(e.key==='e'||e.key==='E') tryEnter();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
},{passive:false});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('wheel',e=>{ zoom=Math.max(0.6,Math.min(1.9,zoom-Math.sign(e.deltaY)*0.08)); },{passive:true});

/* ═══════════ DAY / NIGHT ═══════════ */
let tod=0.5; // 0..1  (0=midnight,0.5=noon)
let todAuto=true;
function toggleDayNight(){ todAuto=false; tod=(tod<0.5)?0.5:0.02; }
const SKY_DAY=['#0a2a3a','#1d5a6e','#3a8fa0'], SKY_NIGHT=['#04060c','#0a1424','#161f3a'];
function lerpCol(a,b,t){ const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)), pb=b.match(/\w\w/g).map(h=>parseInt(h,16));
  return 'rgb('+pa.map((v,i)=>(v+(pb[i]-v)*t)|0).join(',')+')'; }

/* ═══════════ ZONE + TOAST UI ═══════════ */
const zoneEl=document.getElementById('zone'), zoneZ=document.getElementById('zoneZ'), zoneS=document.getElementById('zoneS');
let curZone=''; let zoneHide=0;
function showZone(name,sub){ if(name===curZone) { zoneHide=performance.now()+2600; return; } curZone=name;
  zoneZ.textContent=name; zoneS.textContent=sub||''; zoneEl.classList.add('show'); zoneHide=performance.now()+2600; }
const toastEl=document.getElementById('toast'); let toastHide=0;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); toastHide=performance.now()+2200; }
function tryEnter(){
  let best=null,bd=99;
  for(const d of doors){ const dd=Math.hypot(d.wx-player.x,d.wy-player.y); if(dd<bd){bd=dd;best=d;} }
  if(best&&bd<1.6){ toast('⌂ Entering '+best.b.sign+' — '+best.b.zone+' (interior coming in P2)'); }
  else toast('Walk up to a glowing door, then press E');
}

/* ═══════════ RENDER ═══════════ */
let camX=0,camY=0;
function draw(t){
  // time of day
  if(todAuto){ tod+=0.00003; if(tod>1) tod-=1; }
  const dayness=Math.max(0,Math.min(1, Math.sin(tod*Math.PI))); // 0 night .. 1 noon
  // update clock label
  const hh=Math.floor(tod*24), mm=Math.floor((tod*24-hh)*60);
  document.getElementById('clockT').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  document.getElementById('clockD').textContent = dayness>0.75?'Midday':dayness>0.35?(tod<0.5?'Morning':'Evening'):dayness>0.12?'Dusk':'Night';

  /* sky gradient */
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, lerpCol(SKY_NIGHT[0].slice(1),SKY_DAY[0].slice(1),dayness));
  g.addColorStop(0.5, lerpCol(SKY_NIGHT[1].slice(1),SKY_DAY[1].slice(1),dayness));
  g.addColorStop(1, lerpCol(SKY_NIGHT[2].slice(1),SKY_DAY[2].slice(1),dayness));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // stars at night
  if(dayness<0.5){ ctx.globalAlpha=(0.5-dayness)*1.6; ctx.fillStyle='#cfe8ff';
    for(let i=0;i<70;i++){ const sx=(i*97.13%W), sy=(i*57.7%(H*0.5)); const tw=0.5+0.5*Math.sin(t*0.002+i); ctx.globalAlpha=(0.5-dayness)*tw*1.4; ctx.fillRect(sx,sy,2,2);} ctx.globalAlpha=1; }
  // sun/moon
  const arcx=W*(tod%1), arcy=H*0.42 - Math.sin(tod*Math.PI)*H*0.34;
  ctx.beginPath(); ctx.arc(arcx,arcy, dayness>0.3?22:16,0,6.28);
  ctx.fillStyle=dayness>0.3?'#ffe9a8':'#dfe8ff'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=40*Math.max(0.3,dayness); ctx.fill(); ctx.shadowBlur=0;

  /* camera centers on player */
  const ps=w2s(player.x,player.y);
  camX = W/2 - ps.x*zoom;
  camY = H/2 - ps.y*zoom - 40;
  ctx.save(); ctx.translate(camX,camY); ctx.scale(zoom,zoom);

  /* ── draw ground tiles (painter's order: back-to-front by wx+wy) ── */
  const nightMix=1-dayness;
  for(let s=0;s<2*GRID-1;s++){
    for(let x=0;x<GRID;x++){ const y=s-x; if(y<0||y>=GRID) continue;
      drawTile(x,y,nightMix,t);
    }
  }

  /* ── build a draw list of all "tall" entities, depth sort by (wx+wy) ── */
  const list=[];
  for(const b of buildings) list.push({d:b.x+b.d+b.w, kind:'b', o:b});
  for(const n of citizens) list.push({d:n.x+n.y, kind:'n', o:n});
  for(const c of cars) list.push({d:c.x+c.y, kind:'c', o:c});
  list.push({d:player.x+player.y, kind:'p', o:player});
  list.sort((a,b)=>a.d-b.d);
  for(const e of list){
    if(e.kind==='b') drawBuilding(e.o,nightMix,t);
    else if(e.kind==='n') drawPerson(e.o.x,e.o.y, e.o.col, 0, e.o.ph, t, false);
    else if(e.kind==='c') drawCar(e.o);
    else drawPerson(player.x,player.y, AGENT_COLORS.emerald, player.bob, 0, t, true);
  }
  ctx.restore();

  /* nighttime vignette + warm bloom */
  if(nightMix>0.15){ const v=ctx.createRadialGradient(W/2,H/2,H*0.2, W/2,H/2,H*0.8);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,10,'+(nightMix*0.55)+')');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }

  drawMini();
  // zone auto-hide
  if(zoneHide && performance.now()>zoneHide){ zoneEl.classList.remove('show'); zoneHide=0; }
  if(toastHide && performance.now()>toastHide){ toastEl.classList.remove('show'); toastHide=0; }
}

function drawTile(x,y,nightMix){
  const type=T(x,y); const p=w2s(x,y);
  let base;
  if(type===0) base = ((x+y)&1)? '#123020':'#0f2a1c';      // grass checker
  else if(type===1) base='#1b2028';                         // road
  else if(type===2) base= ((x+y)&1)?'#20222c':'#191b24';    // plaza stone
  else if(type===3) base='#0d3550';                         // water
  else base='#2a2412';                                      // gold path
  const top=shade(base, 1+ (0.10*(1-nightMix)) );
  // iso diamond
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x+TW/2, p.y+TH/2);
  ctx.lineTo(p.x, p.y+TH);
  ctx.lineTo(p.x-TW/2, p.y+TH/2);
  ctx.closePath();
  ctx.fillStyle=shade(top, 0.55+0.45*(1-nightMix)); ctx.fill();
  // subtle grid line
  if(type!==3){ ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=1; ctx.stroke(); }
  // water shimmer
  if(type===3){ ctx.strokeStyle='rgba(95,224,255,0.25)'; ctx.stroke(); }
  // gold path glow at night
  if(type===4 && nightMix>0.2){ ctx.fillStyle='rgba(232,196,92,'+(nightMix*0.18)+')'; ctx.fill(); }
  // road center dashes
  if(type===1){ ctx.fillStyle='rgba(232,196,92,0.35)'; ctx.fillRect(p.x-1,p.y+TH/2-1,3,2); }
}

// draw an isometric prism building with neon crown + windows + sign + door
function drawBuilding(b,nightMix,t){
  const lvl=b.h, LH=20;                 // pixels per level
  const p0=w2s(b.x,b.y);                // back-top corner (screen, pre-cam)
  // compute the 4 top-face corners of footprint at ground, then raise by height
  const topH = lvl*LH;
  // footprint corners (ground)
  const A=w2s(b.x, b.y);                       // back
  const Bc=w2s(b.x+b.w, b.y);                  // right
  const C=w2s(b.x+b.w, b.y+b.d);               // front
  const Dc=w2s(b.x, b.y+b.d);                  // left
  const up=y=>y-topH;
  const bodyL=shade(b.col,0.7), bodyR=shade(b.col,0.45), roof=shade(b.col,1.15);

  // LEFT wall (from Dc to C)
  ctx.beginPath(); ctx.moveTo(Dc.x,Dc.y); ctx.lineTo(C.x,C.y); ctx.lineTo(C.x,up(C.y)); ctx.lineTo(Dc.x,up(Dc.y)); ctx.closePath();
  ctx.fillStyle=shade(bodyL,0.6+0.4*(1-nightMix)); ctx.fill();
  // RIGHT wall (from C to Bc)
  ctx.beginPath(); ctx.moveTo(C.x,C.y); ctx.lineTo(Bc.x,Bc.y); ctx.lineTo(Bc.x,up(Bc.y)); ctx.lineTo(C.x,up(C.y)); ctx.closePath();
  ctx.fillStyle=shade(bodyR,0.55+0.35*(1-nightMix)); ctx.fill();
  // windows on both visible walls (lit at night with accent)
  drawWindows(Dc,C,lvl,LH,b,nightMix,t, 'L');
  drawWindows(C,Bc,lvl,LH,b,nightMix,t, 'R');
  // ROOF top face
  ctx.beginPath();
  ctx.moveTo(A.x,up(A.y)); ctx.lineTo(Bc.x,up(Bc.y)); ctx.lineTo(C.x,up(C.y)); ctx.lineTo(Dc.x,up(Dc.y)); ctx.closePath();
  ctx.fillStyle=shade(roof,0.55+0.45*(1-nightMix)); ctx.fill();
  // neon roof crown (accent)
  ctx.strokeStyle=b.acc; ctx.lineWidth=2; ctx.shadowColor=b.acc; ctx.shadowBlur=nightMix>0.2?12:5; ctx.stroke(); ctx.shadowBlur=0;
  // rooftop glyph beacon
  const rc={ x:(A.x+C.x)/2, y:(up(A.y)+up(C.y))/2 };
  ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.globalAlpha=0.9; ctx.fillText(b.glyph, rc.x, rc.y-4); ctx.globalAlpha=1;

  // SIGN board above the door (front-right wall, near ground)
  const sx=(C.x+Bc.x)/2, sy=(C.y+Bc.y)/2 - LH*0.9;
  ctx.font='bold 9px "IBM Plex Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(b.sign).width+10;
  ctx.fillStyle='rgba(6,8,11,0.85)'; ctx.fillRect(sx-tw/2, sy-8, tw, 15);
  ctx.strokeStyle=b.acc; ctx.lineWidth=1; ctx.strokeRect(sx-tw/2, sy-8, tw, 15);
  ctx.fillStyle=b.acc; ctx.shadowColor=b.acc; ctx.shadowBlur=nightMix>0.3?8:0; ctx.fillText(b.sign,sx,sy); ctx.shadowBlur=0;

  // DOOR (glowing) at front corner
  const dsc=w2s(b.x+b.w-0.5, b.y+b.d-0.02);
  const pulse=0.5+0.5*Math.sin(t*0.004+b.doorPulse);
  ctx.fillStyle=shade(b.acc, 0.5+0.5*pulse);
  ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.moveTo(dsc.x-7,dsc.y); ctx.lineTo(dsc.x+7,dsc.y); ctx.lineTo(dsc.x+7,dsc.y-16); ctx.lineTo(dsc.x-7,dsc.y-16); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  // player-proximity door glow ring
  const dd=Math.hypot((b.x+b.w-0.5)-player.x,(b.y+b.d-0.02)-player.y);
  if(dd<1.8){ ctx.strokeStyle=b.acc; ctx.lineWidth=2; ctx.shadowColor=b.acc; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(dsc.x,dsc.y+2,16,8,0,0,6.28); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=b.acc; ctx.font='bold 8px "IBM Plex Mono"'; ctx.fillText('◄ E',dsc.x,dsc.y+16); }
}
function drawWindows(P,Q,lvl,LH,b,nightMix,t,side){
  const cols=b.w>=4?4:3;
  for(let L=0;L<lvl;L++){
    for(let ci=0;ci<cols;ci++){
      const fx=(ci+0.5)/cols;
      const wx=P.x+(Q.x-P.x)*fx, wy=P.y+(Q.y-P.y)*fx;
      const yy=wy - LH*(L+0.55);
      // lit windows more likely at night; deterministic-ish flicker
      const litSeed=Math.sin((b.x*7+b.y*13+L*3+ci*5))*0.5+0.5;
      const lit = nightMix>0.25 ? (litSeed>0.35) : (litSeed>0.8);
      ctx.fillStyle = lit ? shade(b.acc,0.9) : 'rgba(10,14,20,0.7)';
      if(lit && nightMix>0.3){ ctx.shadowColor=b.acc; ctx.shadowBlur=6; }
      ctx.fillRect(wx-3, yy-4, 6, 6);
      ctx.shadowBlur=0;
    }
  }
}

// articulated faceless pixel person (isometric)
function drawPerson(wx,wy,col,bob,ph,t,isPlayer){
  const p=w2s(wx,wy);
  const b=isPlayer?bob:Math.sin(t*0.006+ph)*1.2;
  const x=p.x, y=p.y - 2 - b;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x,p.y+2,7,3.4,0,0,6.28); ctx.fill();
  const sc=isPlayer?1.25:1.0;
  // legs
  const legSwing=Math.sin(t*0.02+ph)* (isPlayer&&player.moving?3: (isPlayer?0:1.5));
  ctx.strokeStyle=shade(col,0.5); ctx.lineWidth=2.4*sc; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y-6*sc); ctx.lineTo(x-2*sc+legSwing*0.2, y); ctx.moveTo(x,y-6*sc); ctx.lineTo(x+2*sc-legSwing*0.2, y); ctx.stroke();
  // torso
  ctx.strokeStyle=col; ctx.lineWidth=4*sc;
  ctx.beginPath(); ctx.moveTo(x,y-6*sc); ctx.lineTo(x,y-15*sc); ctx.stroke();
  // arms
  ctx.lineWidth=2*sc; ctx.strokeStyle=shade(col,0.85);
  ctx.beginPath(); ctx.moveTo(x,y-13*sc); ctx.lineTo(x-4*sc, y-8*sc+legSwing*0.15); ctx.moveTo(x,y-13*sc); ctx.lineTo(x+4*sc, y-8*sc-legSwing*0.15); ctx.stroke();
  // head (faceless)
  ctx.fillStyle=shade(col,1.1); ctx.beginPath(); ctx.arc(x,y-18*sc,3.4*sc,0,6.28); ctx.fill();
  if(isPlayer){ // glowing agent halo
    ctx.strokeStyle=AGENT_COLORS.gold; ctx.lineWidth=1.4; ctx.shadowColor=AGENT_COLORS.gold; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x,y-18*sc,6,0,6.28); ctx.stroke(); ctx.shadowBlur=0;
    // name tag
    ctx.fillStyle=AGENT_COLORS.emerald; ctx.font='bold 8px "IBM Plex Mono"'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('YOU', x, y-27*sc);
  }
}

function drawCar(c){
  const p=w2s(c.x,c.y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(p.x,p.y+3,10,4,0,0,6.28); ctx.fill();
  // simple iso car body
  ctx.fillStyle=c.col;
  ctx.beginPath(); ctx.moveTo(p.x-9,p.y); ctx.lineTo(p.x,p.y+5); ctx.lineTo(p.x+9,p.y); ctx.lineTo(p.x,p.y-5); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(c.col,0.6);
  ctx.beginPath(); ctx.moveTo(p.x-9,p.y); ctx.lineTo(p.x,p.y+5); ctx.lineTo(p.x,p.y-1); ctx.lineTo(p.x-9,p.y-6); ctx.closePath(); ctx.fill();
  // cabin
  ctx.fillStyle=shade(c.col,1.3); ctx.fillRect(p.x-3,p.y-9,6,5);
  // headlight glow
  ctx.fillStyle='rgba(255,240,180,0.5)'; ctx.fillRect(p.x+(c.dir>0?7:-9),p.y-3,2,2);
}

/* ═══════════ MINIMAP ═══════════ */
function drawMini(){
  mctx.clearRect(0,0,150,150);
  mctx.fillStyle='#06080b'; mctx.fillRect(0,0,150,150);
  const s=150/GRID;
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
    const ty=T(x,y);
    if(solid[y*GRID+x]){ mctx.fillStyle='#2a3340'; }
    else if(ty===1){ mctx.fillStyle='#161a20'; }
    else if(ty===2){ mctx.fillStyle='#20222c'; }
    else if(ty===3){ mctx.fillStyle='#0d3550'; }
    else if(ty===4){ mctx.fillStyle='#4a3d16'; }
    else continue;
    mctx.fillRect(x*s,y*s,Math.ceil(s),Math.ceil(s));
  }
  // buildings accent dots
  for(const b of buildings){ mctx.fillStyle=b.acc; mctx.fillRect((b.x+b.w/2)*s-1,(b.y+b.d/2)*s-1,2,2); }
  // player
  mctx.fillStyle='#00ff9c'; mctx.shadowColor='#00ff9c'; mctx.shadowBlur=6;
  mctx.fillRect(player.x*s-2,player.y*s-2,4,4); mctx.shadowBlur=0;
  mctx.strokeStyle='rgba(0,255,156,0.3)'; mctx.strokeRect(0,0,150,150);
}

/* ═══════════ UPDATE ═══════════ */
let last=performance.now();
function step(t){
  const dt=Math.min(50,t-last); last=t;
  // player movement (isometric: screen-up = world -x,-y feel; use grid axes rotated)
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']){ mx-=1; my-=1; }
  if(keys['s']||keys['arrowdown']){ mx+=1; my+=1; }
  if(keys['a']||keys['arrowleft']){ mx-=1; my+=1; }
  if(keys['d']||keys['arrowright']){ mx+=1; my-=1; }
  player.run = !!(keys['shift']);
  const spd=(player.run?0.055:0.032)*(dt/16.67);
  player.moving = (mx||my)!==0;
  if(player.moving){
    const len=Math.hypot(mx,my)||1; mx/=len; my/=len;
    const nx=player.x+mx*spd, ny=player.y+my*spd;
    // collide vs solid + world bounds (try axis-separated)
    if(!isSolid(nx,player.y) && nx>0.5 && nx<GRID-0.5) player.x=nx;
    if(!isSolid(player.x,ny) && ny>0.5 && ny<GRID-0.5) player.y=ny;
    player.bob=Math.sin(t*0.02)*2*(player.run?1.4:1);
  } else player.bob*=0.85;

  // zone detection by nearest building
  let nb=null,nd=99; for(const b of buildings){ const d=Math.hypot((b.x+b.w/2)-player.x,(b.y+b.d/2)-player.y); if(d<nd){nd=d;nb=b;} }
  if(nb && nd<4.5) showZone(nb.sign, nb.zone);

  // npcs wander
  for(const n of citizens){
    const dx=n.tx-n.x, dy=n.ty-n.y, d=Math.hypot(dx,dy);
    if(d<0.3){ retarget(n); }
    else { const step=n.spd*(dt/16.67); n.x+=dx/d*step; n.y+=dy/d*step; }
  }
  // cars loop along lanes
  for(const c of cars){
    if(c.horiz){ c.x+=c.spd*c.dir*(dt/16.67); if(c.x>GRID+1)c.x=-1; if(c.x<-1)c.x=GRID+1; }
    else { c.y+=c.spd*c.dir*(dt/16.67); if(c.y>GRID+1)c.y=-1; if(c.y<-1)c.y=GRID+1; }
  }

  draw(t);
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// intro toast
setTimeout(()=>toast('◈ Welcome to SHADDAI Pixel City — walk to a district, press E at its door'),700);
</script>
