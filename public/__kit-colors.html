<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit Colour Check</title>
<style>
  :root { --bg: #0a0f18; --panel: #111a26; --line: #22314a; --ink: #e6edf6; --dim: #8fa3b8; --accent: #ff6a30; --ok: #34e5b0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
         background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; }
  #bar b { font-weight: 600; margin-right: 6px; }
  select, button { background: #0d1520; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #labels { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; }
  #labels span { background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; color: var(--dim); }
  #labels span.after { color: var(--ok); border-color: var(--ok); }
  #info { color: var(--dim); margin-left: auto; font-size: 12px; }
  @media (max-width: 640px) { #info { width: 100%; margin-left: 0; } }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body>
<div id="bar">
  <b>Kit colours</b>
  <select id="kit"></select>
  <button id="mSplit" class="on">Before | After</button>
  <button id="mBefore">Before only</button>
  <button id="mAfter">After only</button>
  <button id="bloom" class="on">Bloom</button>
  <span id="info">loading…</span>
</div>
<div id="labels"><span id="lBefore">BEFORE — as shipped</span><span id="lAfter" class="after">AFTER — colour fix</span></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { fixKitColors } from '/kit-color-fix.js';

// the game's own lighting (SHADDAI-WORLD-3D.html ~line 516 and 1045-1060), so this page shows what the world will show
const KITS = ['realm_buildings_volcano','realm_town_volcano','station_volcano','realm_buildings_desert','realm_town_desert','station_desert',
  'realm_buildings_arctic','realm_town_arctic','station_arctic','realm_buildings_void','realm_town_void','station_void','realm_buildings_ocean',
  'realm_town_ocean','station_ocean','realm_buildings_meadow','realm_town_meadow','realm_buildings_forest','realm_town_forest','realm_buildings_darkforest',
  'realm_town_darkforest','realm_buildings_suburb','realm_town_suburb','realm_buildings_grid','realm_town_grid','station_grid','realm_props',
  'race_hq','race_kit','transit_kit','maglev_kit','desert_homes','forest_homes','colosseum_lobby','athenaeum_rotunda','hover_league','park_dress',
  'naval','tower_spire','tower_slab','tower_setback','furniture_kit','weapons','ship_arrow','hoverboards_v02'];
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.97; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0f18); scene.fog = new THREE.Fog(0x0a0f18, 400, 1400);
scene.add(new THREE.AmbientLight(0x223355, 0.7), new THREE.HemisphereLight(0xeaf2ff, 0x241d2e, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(30, 60, 20);
const sun2 = new THREE.DirectionalLight(0xcfe2ff, 0.7); sun2.position.set(-40, 40, -30);
const rim = new THREE.DirectionalLight(0xffb066, 0.5); rim.position.set(-60, 24, 60); scene.add(sun, sun2, rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshStandardMaterial({ color: 0x1b1612, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.55, 0.6, 0.85); composer.addPass(bloom);
let useBloom = true, mode = 'split', before = null, after = null;
const loader = new GLTFLoader(), sel = document.getElementById('kit'), info = document.getElementById('info');
KITS.forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = k.replace(/_/g, ' '); sel.appendChild(o); });
function cloneDeep(root) { const c = root.clone(true); c.traverse((o) => { if (o.isMesh) o.geometry = o.geometry.clone(); }); return c; }
function show(kit) {
  info.textContent = 'loading ' + kit + '…';
  [before, after].forEach((m) => m && scene.remove(m));
  loader.load('/assets/kits/shaddai_' + (/_vdd$/.test(kit) ? kit : kit + '_v01') + '.glb', (g) => {
    before = g.scene; after = cloneDeep(g.scene); const n = fixKitColors(after);
    const box = new THREE.Box3().setFromObject(before), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    const gap = Math.max(size.x, 4) * 0.6 + 4;
    before.position.set(-ctr.x - size.x / 2 - gap / 2, -box.min.y, -ctr.z); after.position.set(-ctr.x + size.x / 2 + gap / 2, -box.min.y, -ctr.z);
    scene.add(before, after); layout();
    const r = Math.max(size.x * 2 + gap, size.z, size.y) * 0.9 + 10;
    controls.target.set(0, size.y * 0.35, 0); camera.position.set(r * 0.25, size.y * 0.6 + r * 0.35, r * 0.95); controls.update();
    let vc = 0; before.traverse((o) => { if (o.isMesh && o.geometry.attributes.color) vc++; });
    info.textContent = kit + ' · ' + vc + ' vertex-coloured meshes · fix touched ' + n;
  }, undefined, () => { info.textContent = 'missing: ' + kit; });
}
function layout() {
  if (!before || !after) return;
  before.visible = mode !== 'after'; after.visible = mode !== 'before';
  document.getElementById('lBefore').style.visibility = mode === 'after' ? 'hidden' : 'visible';
  document.getElementById('lAfter').style.visibility = mode === 'before' ? 'hidden' : 'visible';
}
function setMode(m) { mode = m; ['mSplit', 'mBefore', 'mAfter'].forEach((id) => document.getElementById(id).classList.toggle('on', id === { split: 'mSplit', before: 'mBefore', after: 'mAfter' }[m])); layout(); }
document.getElementById('mSplit').onclick = () => setMode('split');
document.getElementById('mBefore').onclick = () => setMode('before');
document.getElementById('mAfter').onclick = () => setMode('after');
document.getElementById('bloom').onclick = (e) => { useBloom = !useBloom; e.target.classList.toggle('on', useBloom); };
sel.onchange = () => show(sel.value);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); useBloom ? composer.render() : renderer.render(scene, camera); });
show(KITS[0]);
</script>
</body>
</html>
