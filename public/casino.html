<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>The Casino — Shaddai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:       #040d1a;
    --navy-mid:   #071428;
    --navy-light: #0c1f3a;
    --felt:       #0b2216;
    --felt-mid:   #0f2e1c;
    --felt-rim:   #1a4a2e;
    --gold:       #c9a84c;
    --gold-bright:#f0c84a;
    --gold-dim:   #7a6030;
    --cyan:       #00e5ff;
    --cyan-dim:   #005566;
    --red:        #e03040;
    --white:      #f5f0e8;
    --cream:      #ede0c4;
    --shadow-gold: 0 0 20px rgba(201,168,76,0.3);
    --shadow-cyan: 0 0 20px rgba(0,229,255,0.25);
    --glow-gold:  0 0 40px rgba(201,168,76,0.4), 0 0 80px rgba(201,168,76,0.15);
  }
  .font-title { font-family: 'Cinzel', serif; }
  /* casino.html (originally hall.html) — merged from Shaddai-Arcade/Royale into the main Shaddai
     repo 2026-09-14 (owner decision: one build, not a separate site). The
     neon-casino palette below is copied verbatim from Royale's styles.css
     (:root block) since that stylesheet doesn't exist in this repo -- kept
     inline here rather than added as a new shared file, so this page stays
     a single self-contained artifact like the rest of public/*.html.
     Original mobile-first design notes (Shaddai-Arcade #6, 2026-09-13
     (2026-09-13 follow-up): "walking into the Hall, not a list of games."
     One room (horizontal swipe strip, not a card grid/hamburger), sticky
     HUD, sticky bottom rail, bottom sheets for buy-in/add-bot, real
     spectate via GET /api/casino/tables, inline muted Lens video.

     HONEST GAPS -- read before extending this file:
     - The 20s "timeout bar" on a human seat's turn is COSMETIC ONLY. The
       server (hall/mailbox.js) only enforces a turn timeout for non-human
       seats; a human seat has no server-side clock today. Do not let
       anyone treat this bar as authoritative.
     - Crowd-mode vote counts are NOT implemented anywhere server-side (no
       vote tracking exists in hall/routes.js). This file deliberately does
       NOT fabricate vote numbers on the rail buttons -- crowd mode isn't
       real yet, only solo-vs-house is.
     - "Spectate" means: poll the real GET /api/casino/tables list and show
       another live match's spectator-safe summary (playerTotal/
       dealerUpcard/contenders/pick -- never the deck or a pre-reveal
       dealer hole card, never a pre-settlement bet winner). It is NOT a
       live two-seat concurrent hand (that's still solo-vs-house under the
       hood, same as desktop) -- an onlooker watches one seat's own hand
       against the house, same shape as the desktop game.
  */
  html, body { overflow: hidden; height: 100%; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  .hud {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; padding: 0.5rem 0.75rem; min-height: 44px;
    background: linear-gradient(180deg, var(--navy) 0%, rgba(4,13,26,0.92) 100%);
    border-bottom: 1px solid var(--gold-dim); z-index: 30;
  }
  .hud-brand { font-family: 'Cinzel Decorative', serif; color: var(--gold-bright); font-size: 1rem; white-space: nowrap; }
  .hud-right { display: flex; align-items: center; gap: 0.4rem; }
  .hud-pill {
    font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--cream);
    background: var(--navy-light); border: 1px solid var(--gold-dim); border-radius: 999px;
    padding: 0.3rem 0.65rem; white-space: nowrap;
  }
  .hud-btn {
    width: 40px; height: 40px; min-width: 40px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    border: 1px solid var(--gold-dim); background: var(--navy-light); color: var(--cream);
  }
  .hud-btn:disabled { opacity: 0.35; }
  .hud-btn:active { background: var(--felt-rim); }

  /* ── Backdrop (persists behind room + match, dims for match/spectate) ── */
  .hall-backdrop {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(120% 90% at 50% -10%, var(--felt-mid) 0%, var(--navy) 60%);
    transition: filter 0.25s;
  }
  body.in-match .hall-backdrop, body.in-spectate .hall-backdrop { filter: brightness(0.55) saturate(0.8); }

  /* ── ROOM: swipeable strip of table hotspots (max ~3 visible) ─────────── */
  #view-room {
    position: relative; z-index: 1; flex: 1 1 auto; display: flex; flex-direction: column;
    min-height: 0;
  }
  .room-caption {
    flex: 0 0 auto; padding: 0.6rem 1rem 0.2rem;
    font-family: 'Cormorant Garamond', serif; color: var(--cream); opacity: 0.85; font-size: 0.95rem;
  }
  .room-strip {
    flex: 1 1 auto; display: flex; gap: 0.7rem; align-items: center;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain;
    touch-action: pan-x; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; padding: 0.5rem 20vw; /* side padding centers the strip, ~3 cards visible */
  }
  .room-strip::-webkit-scrollbar { display: none; }
  .table-hotspot {
    scroll-snap-align: center; flex: 0 0 auto; width: 42vw; max-width: 190px; min-width: 140px;
    border-radius: 16px; padding: 0.9rem 0.8rem;
    background: radial-gradient(120% 140% at 30% 0%, var(--felt-mid) 0%, var(--felt) 70%);
    border: 1px solid var(--felt-rim); box-shadow: var(--glow-gold);
    display: flex; flex-direction: column; justify-content: space-between; min-height: 168px;
  }
  .table-hotspot.occupied { border-color: var(--gold); }
  .table-hotspot.active-glow { box-shadow: 0 0 0 2px var(--gold-bright), var(--glow-gold); }
  .table-name { font-family: 'Cinzel', serif; color: var(--white); font-size: 0.95rem; }
  .table-tag { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--cyan); margin-top: 0.2rem; }
  .seat-row { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem; }
  .seat-chip {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--navy);
    background: var(--gold-bright); border: 1px solid var(--gold-dim);
  }
  .seat-chip.empty {
    background: transparent; color: var(--gold-dim); border-style: dashed;
    animation: chip-pulse 1.8s ease-in-out 1;
  }
  @keyframes chip-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; box-shadow: 0 0 0 6px rgba(201,168,76,0.15); } }
  .table-cta { font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold-bright); margin-top: 0.5rem; }
  .table-hotspot-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .table-mini-btn {
    flex: 1; min-height: 40px; border-radius: 8px; font-family: 'Cinzel', serif; font-size: 0.75rem;
    background: var(--navy-light); color: var(--cream); border: 1px solid var(--gold-dim);
  }
  .table-mini-btn.primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--navy); border: none; }
  .table-mini-btn:active { filter: brightness(0.9); }

  /* ── MATCH / SPECTATE view ─────────────────────────────────────────────── */
  .hall-view { position: relative; z-index: 1; flex: 1 1 auto; display: none; flex-direction: column; min-height: 0; padding: 0.75rem 1rem; }
  .hall-view.active { display: flex; }
  .back-row { display: flex; align-items: center; justify-content: space-between; }
  .hall-back { font-family: 'Share Tech Mono', monospace; color: var(--cream); font-size: 0.85rem; background: none; border: none; min-height: 44px; padding: 0 0.25rem; }
  .spectate-badge { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: 6px; padding: 0.15rem 0.5rem; }

  .turn-line { font-family: 'Cinzel', serif; color: var(--gold-bright); font-size: 0.95rem; margin-top: 0.5rem; }
  .timeout-track { height: 4px; border-radius: 3px; background: var(--navy-light); margin-top: 0.35rem; overflow: hidden; }
  .timeout-fill { height: 100%; background: var(--cyan); width: 100%; transform-origin: left; }
  .timeout-fill.running { animation: timeout-shrink 20s linear forwards; }
  @keyframes timeout-shrink { to { transform: scaleX(0); } }

  .status-line { font-family: 'Cormorant Garamond', serif; color: var(--white); font-size: 1.15rem; margin: 0.6rem 0; min-height: 1.6em; }
  .hand-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
  .card-chip { font-family: 'Share Tech Mono', monospace; background: var(--white); color: var(--navy); border-radius: 6px; padding: 0.4rem 0.6rem; font-weight: bold; min-width: 2.2rem; text-align: center; }

  .lens-media { margin: 0.5rem 0; border-radius: 12px; overflow: hidden; background: var(--navy-light); min-height: 0; }
  .lens-media video { width: 100%; display: block; }

  /* ── Bottom rail (always <=3 legal buttons; fixed, thumb-reachable) ────── */
  .rail {
    flex: 0 0 auto; display: none; gap: 0.5rem;
    padding: 0.6rem 0.75rem calc(0.6rem + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--navy) 0%, rgba(4,13,26,0.92) 100%);
    border-top: 1px solid var(--gold-dim); min-height: 72px; z-index: 30;
  }
  .rail.show { display: flex; }
  .rail-btn {
    flex: 1; min-height: 52px; min-width: 44px; border-radius: 10px;
    font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--navy);
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
    border: 1px solid var(--gold-dim);
  }
  .rail-btn:active { filter: brightness(0.92); }
  .rail-btn.secondary { background: var(--navy-light); color: var(--cream); border-color: var(--gold-dim); }
  .rail-btn.lens { background: linear-gradient(180deg, var(--cyan), var(--cyan-dim)); color: var(--navy); }
  .rail-btn:disabled { opacity: 0.4; }

  /* ── Sheets (bottom sheet pattern: buy-in confirm, add bot, line, menu) ─ */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(2,6,12,0.6); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--navy-mid); border-top: 1px solid var(--gold-dim);
    border-radius: 18px 18px 0 0; padding: 1rem 1.1rem calc(1rem + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.22s ease-out;
    max-height: 70vh; overflow-y: auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--gold-dim); margin: 0 auto 0.8rem; }
  .sheet-title { font-family: 'Cinzel', serif; color: var(--gold-bright); font-size: 1.05rem; margin-bottom: 0.5rem; }
  .sheet-body { font-family: 'Cormorant Garamond', serif; color: var(--cream); font-size: 1.05rem; margin-bottom: 0.9rem; }
  .sheet-row { display: flex; gap: 0.6rem; }
  .sheet-btn { flex: 1; min-height: 48px; border-radius: 10px; font-family: 'Cinzel', serif; font-size: 0.95rem; border: 1px solid var(--gold-dim); background: var(--navy-light); color: var(--cream); }
  .sheet-btn.primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--navy); border: none; }
  .sheet-field {
    width: 100%; min-height: 44px; border-radius: 8px; margin-bottom: 0.6rem;
    background: var(--navy-light); border: 1px solid var(--gold-dim); color: var(--white);
    font-family: 'Share Tech Mono', monospace; padding: 0 0.7rem;
  }
  .sheet-select { width: 100%; min-height: 44px; border-radius: 8px; margin-bottom: 0.6rem; background: var(--navy-light); border: 1px solid var(--gold-dim); color: var(--white); font-family: 'Share Tech Mono', monospace; padding: 0 0.7rem; }
  .menu-item { display: block; width: 100%; text-align: left; min-height: 48px; font-family: 'Cinzel', serif; color: var(--cream); background: none; border: none; border-bottom: 1px solid rgba(122,96,48,0.3); }
  .menu-item:last-child { border-bottom: none; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--navy-light); border: 1px solid var(--gold); color: var(--cream);
    font-family: 'Cormorant Garamond', serif; font-size: 1rem;
    padding: 0.6rem 1rem; border-radius: 10px; z-index: 50; max-width: 88vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
  .hall-art { margin: 8px auto 4px; width: min(760px, 92vw); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  .hall-art img { display: block; width: 100%; height: auto; }
  .hud-pill.claimed { opacity: .55; }
</style>
</head>
<body>

<div class="hall-backdrop"></div>

<div class="hud">
  <div class="hud-brand">The Casino</div>
  <div class="hud-right">
    <span class="hud-pill" id="sparks-pill">Sparks —</span>
    <button class="hud-btn" id="daily-claim" title="Claim daily Sparks" hidden>✦ 25</button>
    <button class="hud-btn" id="btn-line" title="Line (coach chat)">💬</button>
    <button class="hud-btn" id="btn-lens-hud" title="Lens" disabled>🎬</button>
    <button class="hud-btn" id="btn-menu" title="Menu">☰</button>
  </div>
</div>

<div class="hall-art" id="hall-art" hidden><img id="hall-art-img" alt=""></div>

<!-- ROOM -->
<section id="view-room">
  <div class="room-caption">Swipe to look around · tap a table to sit or watch</div>
  <div class="room-strip" id="room-strip"></div>
</section>

<!-- MATCH (seated) / SPECTATE (watching) -->
<section id="view-table" class="hall-view">
  <div class="back-row">
    <button class="hall-back" id="btn-leave-table">‹ Back to the room</button>
    <span class="spectate-badge" id="spectate-badge" style="display:none">Spectating</span>
  </div>
  <div class="turn-line" id="turn-line"></div>
  <div class="timeout-track" id="timeout-track" style="display:none"><div class="timeout-fill" id="timeout-fill"></div></div>
  <div class="status-line" id="table-status">—</div>
  <div class="hand-row" id="table-hand"></div>
  <div class="lens-media" id="lens-media" style="display:none"></div>
</section>

<div class="rail" id="rail"></div>

<!-- Sheets -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet-buyin">
  <div class="sheet-grab"></div>
  <div class="sheet-title" id="buyin-title">Sit in?</div>
  <div class="sheet-body" id="buyin-body"></div>
  <div class="sheet-row">
    <button class="sheet-btn" id="buyin-cancel">Cancel</button>
    <button class="sheet-btn primary" id="buyin-confirm">Sit</button>
  </div>
</div>
<div class="sheet" id="sheet-menu">
  <div class="sheet-grab"></div>
  <div class="sheet-title">Menu</div>
  <button class="menu-item" id="menu-add-bot">＋ Add a bot seat</button>
  <button class="menu-item" id="menu-profile">Profile (coming soon)</button>
  <button class="menu-item" id="menu-close">Close</button>
</div>
<div class="sheet" id="sheet-addbot">
  <div class="sheet-grab"></div>
  <div class="sheet-title">Add a bot seat</div>
  <select class="sheet-select" id="bot-kind">
    <option value="grok">Grok bot (webhook)</option>
    <option value="webhook">Generic webhook</option>
    <option value="shaddai">Shaddai agent</option>
  </select>
  <input class="sheet-field" id="bot-name" placeholder="Display name" value="Bot">
  <input class="sheet-field" id="bot-endpoint" placeholder="https://... (endpoint URL)">
  <div class="sheet-row">
    <button class="sheet-btn" id="addbot-cancel">Cancel</button>
    <button class="sheet-btn primary" id="addbot-confirm">Seat it at Blackjack</button>
  </div>
</div>
<div class="sheet" id="sheet-line">
  <div class="sheet-grab"></div>
  <div class="sheet-title">Line</div>
  <div class="sheet-body">Coach chat is coming soon. Even while coaching, only the 3 move buttons submit a move — chat never plays a hand.</div>
  <div class="sheet-row"><button class="sheet-btn primary" id="line-close">Close</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ── Copy (docs/HALL-COPY.md — keep both files in sync) ───────────────────
  const COPY = {
    buyinBody: (w) => `Sit for ${w} Sparks?`,
    buyinInsufficient: (w) => `You need ${w} Sparks to sit in.`,
    buyinToast: (w) => `You're in. ${w} Sparks on the table.`,
    illegalHuman: "That's not one of your options right now. Pick one of the highlighted buttons.",
    outcome: { win: 'You win.', blackjack: 'Blackjack! You win.', push: 'Push — your Sparks are back.', lose: 'House takes it this time.', bust: 'House takes it this time.' },
    lensButton: '🎬 Lens this — 15 Sparks',
    lensRolling: 'Rolling the clip... this usually takes under a minute.',
    lensReady: "Clip's ready.",
    lensFail: "Couldn't get the shot this time. Your 15 Sparks are back in your balance.",
    lensInsufficient: 'You need 15 Sparks for a Lens clip.',
    lensNoEvent: 'Nothing to film right now — Lens works right after a result (win, bust, blackjack, or an arcade reveal).',
    lensDisabled: "Lens isn't running at this table yet. Check back soon.",
    tableGone: "That table isn't active anymore.",
  };

  // Matches backend/hall/packs/index.js exactly -- pack keys/agent lists
  // changed when the bet packs were rewired from the external shaddai-games
  // repo onto this repo's own in-process backend/lib/arcade-sim.js.
  const TABLES = [
    { pack: 'blackjack', name: 'Blackjack', tag: 'Solo · vs house' },
    { pack: 'basketball_bet', name: 'Neon Hoops', tag: 'Watch & bet' },
    { pack: 'football_bet', name: 'Grid Gridiron', tag: 'Watch & bet' },
    { pack: 'dodgeball_bet', name: 'Grid Dodgeball', tag: 'Watch & bet' },
    { pack: 'sigilstorm_bet', name: 'Sigil Storm', tag: 'Watch & bet' },
  ];
  const DEFAULT_WAGER = 25;

  // Cast — the seven council faces behind every watch-and-bet table. Plain
  // glyphs, no likenesses: the human player sits in the eighth chair. The Lens
  // adapter turns the winning/losing agent into the fal cutscene at the reveal.
  const FACES = { SHADDAI: '👑', NEXUS: '⚙️', ORACLE: '🔮', ZEROX: '💰', TURTLE: '🎨', QUILL: '✍️', PIKADON: '🛡️' };
  const face = (name) => FACES[name] || '🎮';

  let seatId = localStorage.getItem('hall_seat_id');
  let matchId = null;
  let spectateId = null;
  let spectatePoll = null;
  let roomPoll = null;
  let lensPollTimer = null;

  // ── generic helpers ───────────────────────────────────────────────────────
  function toast(msg, ms) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms || 2600);
  }
  async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const id = localStorage.getItem('shd_userid') || localStorage.getItem('shd_email');
    if (id) headers['x-user-id'] = id; // same identity the seat wallet uses (dev fallback path)
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw Object.assign(new Error(data.error || `${method} ${path} failed`), { status: res.status, data });
    return data;
  }
  async function ensureSeat() {
    if (seatId) return seatId;
    const uid = localStorage.getItem('shd_userid') || localStorage.getItem('shd_email') || '';
    const { seat } = await api('POST', '/api/casino/seats', {
      kind: 'human', display_name: 'You',
      sparks_ref: uid || undefined, // canonical wallet id = raw identity, same key the profile faucet uses
    });
    seatId = seat.id;
    localStorage.setItem('hall_seat_id', seatId);
    return seatId;
  }
  // Sparks wallet: balance + one-time starter (server-side, idempotent).
  const sparksPill = document.getElementById('sparks-pill');
  const dailyBtn = document.getElementById('daily-claim');
  const DAILY_SPARKS = 25; // mirrors backend/hall/earn-store.js
  function applyEarn(snap) {
    dailyBtn.hidden = false;
    const claimedToday = !!(snap && snap.dailyClaimedToday);
    dailyBtn.disabled = claimedToday;
    dailyBtn.classList.toggle('claimed', claimedToday);
    dailyBtn.textContent = claimedToday ? '✓ claimed' : `✦ ${DAILY_SPARKS}`;
    dailyBtn.title = (snap && snap.streak > 1) ? `Winning streak: ${snap.streak} days` : 'Claim daily Sparks';
  }
  dailyBtn.addEventListener('click', async () => {
    try {
      const r = await api('GET', '/api/casino/earn/daily');
      toast(r.replayed ? `Already claimed today (${r.amount})` : `+${r.amount} daily Sparks`);
      refreshSparks();
    } catch (e) {
      toast(e.status === 401 ? 'Sign in to claim daily Sparks' : (e.message || 'Could not claim daily Sparks'));
    }
  });
  async function refreshSparks() {
    try {
      const p = await api('GET', '/api/casino/profile');
      sparksPill.textContent = `Sparks ${p.balance}`;
      sparksPill.classList.toggle('has-balance', p.balance > 0);
      applyEarn(p.earn);
      if (p.starter && p.starter.given) toast(`New wallet — ${p.starter.amount} starter Sparks. Go play.`);
      return p;
    } catch (e) {
      sparksPill.classList.remove('has-balance');
      sparksPill.textContent = e.status === 401 ? 'Sparks — sign in' : 'Sparks —';
      dailyBtn.hidden = true; dailyBtn.disabled = false; dailyBtn.textContent = `✦ ${DAILY_SPARKS}`;
      return null;
    }
  }

  // HF menu art banner (GET /api/casino/art). Best-effort: hide on failure.
  const hallArtBox = document.getElementById('hall-art');
  const hallArtImg = document.getElementById('hall-art-img');
  function setHallArt(pack) {
    pack = pack || 'hall';
    hallArtBox.hidden = false;
    hallArtImg.onerror = () => { hallArtBox.hidden = true; };
    if (hallArtImg.dataset.pack === pack) return; // avoid re-setting src on every room poll (no flicker)
    hallArtImg.dataset.pack = pack;
    hallArtImg.src = `/api/casino/art?pack=${encodeURIComponent(pack)}`;
  }
  function openSheet(id) { document.getElementById('sheet-backdrop').classList.add('show'); document.getElementById(id).classList.add('show'); }

  // ── SFX (procedural WebAudio — no assets, game feel) ──────────────────────
  let audioCtx = null;
  document.addEventListener('pointerdown', () => {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });
  function sfx(type) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const tone = (freq, when, dur, shape = 'triangle') => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = shape; o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(when); o.stop(when + dur + 0.02);
      };
      if (type === 'card') {
        tone(620, t, 0.09, 'square'); tone(930, t + 0.04, 0.07, 'square');
      } else if (type === 'pick') {
        tone(440, t, 0.08);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.11, 0.45));
      } else if (type === 'lose') {
        tone(196, t, 0.35, 'sawtooth'); tone(147, t + 0.16, 0.4, 'sawtooth');
      }
    } catch (_) { /* sound is best-effort */ }
  }

  // Run it back — reopen the same table type with one tap after a settle.
  async function sitAgain(pack) {
    try {
      await ensureSeat();
      const res = await api('POST', '/api/casino/tables', { seatId, wager: DEFAULT_WAGER, pack });
      if (res.settlement && res.settlement.sparksError) { toast(COPY.buyinInsufficient(DEFAULT_WAGER)); return; }
      toast(COPY.buyinToast(DEFAULT_WAGER));
      matchId = res.matchId;
      enterMatch(activeTable, res.state, res.legal, res.settlement);
    } catch (e) {
      toast(e.status === 402 || /insufficient/i.test(e.message || '') ? COPY.buyinInsufficient(DEFAULT_WAGER) : (e.message || 'Could not run it back.'));
    }
  }
  function closeSheets() {
    document.getElementById('sheet-backdrop').classList.remove('show');
    document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('show'));
  }
  document.getElementById('sheet-backdrop').addEventListener('click', closeSheets);

  // ── ROOM ────────────────────────────────────────────────────────────────
  function renderRoom(rows) {
    const strip = document.getElementById('room-strip');
    strip.innerHTML = '';
    for (const t of TABLES) {
      // "live" here includes a brief post-settle grace window (see
      // hall/routes.js's SETTLED_GRACE_MS) -- a non-human seat's hand
      // resolves synchronously, so this room can never show one *mid*-
      // decision, only just-seated or just-finished. Tag reflects which.
      const row = rows.find((r) => r.pack === t.pack);
      const justFinished = row && row.phase === 'settled';
      const card = document.createElement('div');
      card.className = 'table-hotspot' + (row ? ' occupied' : '');
      const chip = row
        ? `<div class="seat-chip" title="${row.seatName || ''}">${(row.seatKind || '?')[0].toUpperCase()}</div>`
        : `<div class="seat-chip empty"></div>`;
      const tag = row ? (justFinished ? `${t.tag} · just finished` : `${t.tag} · in progress`) : t.tag;
      card.innerHTML = `
        <div>
          <div class="table-name font-title">${t.name}</div>
          <div class="table-tag">${tag}</div>
          <div class="seat-row">${chip}</div>
        </div>
        <div class="table-hotspot-btns">
          ${row ? `<button class="table-mini-btn" data-act="watch">${justFinished ? 'Recap' : 'Watch'}</button>` : ''}
          <button class="table-mini-btn primary" data-act="sit">${row ? 'Sit elsewhere' : 'Sit'}</button>
        </div>`;
      card.querySelector('[data-act="sit"]').addEventListener('click', () => confirmSit(t));
      const watchBtn = card.querySelector('[data-act="watch"]');
      if (watchBtn) watchBtn.addEventListener('click', () => enterSpectate(row.matchId));
      strip.appendChild(card);
    }
    setHallArt('hall');
  }
  async function refreshRoom() {
    try {
      const { tables } = await api('GET', '/api/casino/tables');
      renderRoom(tables);
    } catch (e) { /* room listing is best-effort; a transient failure just skips this refresh */ }
  }

  // ── BUY-IN SHEET → SIT ─────────────────────────────────────────────────
  let pendingTable = null;
  function confirmSit(table) {
    pendingTable = table;
    document.getElementById('buyin-title').textContent = table.name;
    document.getElementById('buyin-body').textContent = COPY.buyinBody(DEFAULT_WAGER);
    openSheet('sheet-buyin');
  }
  document.getElementById('buyin-cancel').addEventListener('click', closeSheets);
  document.getElementById('buyin-confirm').addEventListener('click', async () => {
    closeSheets();
    if (!pendingTable) return;
    try {
      await ensureSeat();
      const res = await api('POST', '/api/casino/tables', { seatId, wager: DEFAULT_WAGER, pack: pendingTable.pack });
      if (res.settlement && res.settlement.sparksError) { toast(COPY.buyinInsufficient(DEFAULT_WAGER)); return; }
      toast(COPY.buyinToast(DEFAULT_WAGER));
      matchId = res.matchId;
      enterMatch(pendingTable, res.state, res.legal, res.settlement);
    } catch (e) {
      toast(e.status === 402 || /insufficient/i.test(e.message || '') ? COPY.buyinInsufficient(DEFAULT_WAGER) : (e.message || 'Could not open that table.'));
    }
  });

  // ── MATCH (seated) ─────────────────────────────────────────────────────
  let activeTable = null;
  function enterMatch(table, state, legal, settlement) {
    activeTable = table;
    setHallArt(table.pack);
    document.body.classList.add('in-match');
    document.getElementById('view-room').style.display = 'none';
    document.getElementById('view-table').classList.add('active');
    document.getElementById('spectate-badge').style.display = 'none';
    document.getElementById('lens-media').style.display = 'none';
    document.getElementById('lens-media').innerHTML = '';
    renderMatch(state, legal, settlement);
  }
  function renderMatch(state, legal, settlement) {
    document.getElementById('table-hand').innerHTML = '';
    if (state && state.player && Array.isArray(state.player.cards)) {
      const row = document.getElementById('table-hand');
      for (const c of state.player.cards) {
        const el = document.createElement('span'); el.className = 'card-chip'; el.textContent = `${c.r}${c.s}`; row.appendChild(el);
      }
    }
    const score = settlement && settlement.score;
    if (score && (score === 'win' || score === 'blackjack')) {
      if (settlement.earn) toast(`Win bonus +${settlement.earn.bonus} Sparks (streak ${settlement.earn.streak})`);
      refreshSparks(); // payout + earn bonus changed the wallet behind this settled hand
    }
    const turnLine = document.getElementById('turn-line');
    const timeoutTrack = document.getElementById('timeout-track');
    const timeoutFill = document.getElementById('timeout-fill');
    if (!score) {
      turnLine.textContent = 'Your move';
      timeoutTrack.style.display = '';
      timeoutFill.className = 'timeout-fill'; void timeoutFill.offsetWidth; timeoutFill.className = 'timeout-fill running';
    } else {
      turnLine.textContent = 'Hand over';
      timeoutTrack.style.display = 'none';
    }
    let statusText;
    if (score) {
      statusText = (state && state.simSummary) ? state.simSummary : (COPY.outcome[score] || score);
    } else if (state && Array.isArray(state.agents)) {
      statusText = `Pick who to back at ${state.label || 'this table'}: ${state.agents.map((a) => `${face(a)} ${a}`).join('  ·  ')}`;
    } else {
      statusText = 'You 12 · Dealer showing';
    }
    document.getElementById('table-status').textContent = statusText;
    renderRail(legal, settlement);
  }
  function renderRail(legal, settlement) {
    const rail = document.getElementById('rail');
    rail.innerHTML = '';
    const over = settlement && settlement.score;
    document.getElementById('btn-lens-hud').disabled = !(over && settlement.events && settlement.events.length);
    if (over) {
      rail.classList.add('show');
      const canLens = settlement.events && settlement.events.length;
      const lensBtn = document.createElement('button');
      lensBtn.className = 'rail-btn lens'; lensBtn.textContent = COPY.lensButton; lensBtn.disabled = !canLens;
      lensBtn.addEventListener('click', requestLens);
      rail.appendChild(lensBtn);
      const againBtn = document.createElement('button');
      againBtn.className = 'rail-btn primary'; againBtn.textContent = '⟳ Run it back';
      againBtn.addEventListener('click', () => sitAgain(activeTable.pack));
      rail.appendChild(againBtn);
      const leaveBtn = document.createElement('button');
      leaveBtn.className = 'rail-btn secondary'; leaveBtn.textContent = 'Back to the room';
      leaveBtn.addEventListener('click', leaveTable);
      rail.appendChild(leaveBtn);
      return;
    }
    if (!legal || !legal.length) { rail.classList.remove('show'); return; }
    rail.classList.add('show'); // ENGINE-VISION.md: bottom rail is ALWAYS <=3 legal buttons, full-width thirds
    for (const b of legal) {
      const btn = document.createElement('button');
      btn.className = 'rail-btn'; btn.textContent = FACES[b.id] ? `${FACES[b.id]} ${b.label}` : b.label;
      btn.addEventListener('click', () => { if (FACES[b.id]) sfx('pick'); submitMove(b.id); });
      rail.appendChild(btn);
    }
  }
  async function submitMove(moveId) {
    try {
      const res = await api('POST', `/api/casino/tables/${matchId}/move`, { move: moveId });
      if (res.settlement && res.settlement.score) sfx(res.settlement.score === 'win' || res.settlement.score === 'blackjack' ? 'win' : 'lose');
      else sfx('card');
      renderMatch(res.state, res.legal, res.settlement);
    } catch (e) { toast(COPY.illegalHuman); }
  }

  // ── LENS ────────────────────────────────────────────────────────────────
  async function requestLens() {
    toast(COPY.lensRolling, 6000);
    try {
      const clip = await api('POST', `/api/casino/tables/${matchId}/lens`);
      pollLens(clip.jobId);
      refreshSparks(); // the 15 Sparks just left the wallet
    } catch (e) {
      if (e.status === 402) toast(COPY.lensInsufficient);
      else if (e.status === 409) toast(COPY.lensNoEvent);
      else if (e.status === 503) toast(COPY.lensDisabled);
      else toast(COPY.lensFail);
    }
  }
  function pollLens(jobId) {
    clearInterval(lensPollTimer);
    let tries = 0;
    lensPollTimer = setInterval(async () => {
      tries++;
      if (tries > 40) { clearInterval(lensPollTimer); return; } // ~2min ceiling, stop polling silently
      try {
        const s = await api('GET', `/api/casino/tables/${matchId}/lens/${jobId}`);
        if (s.status === 'error') { clearInterval(lensPollTimer); toast(COPY.lensFail); return; }
        if (s.videoUrl) {
          clearInterval(lensPollTimer);
          toast(COPY.lensReady);
          const holder = document.getElementById('lens-media');
          holder.style.display = 'block';
          // Inline, muted-first playback -- tap for sound. preload=none until we actually have a URL.
          holder.innerHTML = `<video src="${s.videoUrl}" playsinline muted autoplay loop controls preload="none"></video>`;
        }
      } catch (_) { /* keep polling until the tries ceiling */ }
    }, 3000);
  }
  document.getElementById('btn-lens-hud').addEventListener('click', () => { if (!document.getElementById('btn-lens-hud').disabled) requestLens(); });

  // ── SPECTATE (read-only, another live table via the sanitized list) ──────
  async function enterSpectate(id) {
    spectateId = id;
    document.body.classList.add('in-spectate');
    document.getElementById('view-room').style.display = 'none';
    document.getElementById('view-table').classList.add('active');
    document.getElementById('spectate-badge').style.display = '';
    document.getElementById('timeout-track').style.display = 'none';
    document.getElementById('rail').classList.remove('show');
    document.getElementById('lens-media').style.display = 'none';
    document.getElementById('table-hand').innerHTML = '';
    await pollSpectate();
    clearInterval(spectatePoll);
    spectatePoll = setInterval(pollSpectate, 2500);
  }
  async function pollSpectate() {
    try {
      const { tables } = await api('GET', '/api/casino/tables');
      const row = tables.find((t) => t.matchId === spectateId);
      if (!row) { toast(COPY.tableGone); leaveTable(); return; }
      document.getElementById('turn-line').textContent = `Watching ${row.seatName || row.seatKind || 'a seat'}`;
      if (typeof row.playerTotal === 'number') {
        document.getElementById('table-status').textContent = `${row.seatName || 'Player'} ${row.playerTotal}${row.dealerUpcard ? ' · Dealer showing ' + row.dealerUpcard : ''}`;
      } else if (Array.isArray(row.agents)) {
        document.getElementById('table-status').textContent = row.simSummary
          || `${row.agents.join(' or ')} — ${row.pick ? 'picked ' + row.pick : 'no pick yet'}`;
      }
    } catch (_) { /* transient poll failure -- try again next tick */ }
  }

  function leaveTable() {
    matchId = null; activeTable = null; spectateId = null;
    setHallArt('hall');
    clearInterval(spectatePoll); clearInterval(lensPollTimer);
    document.body.classList.remove('in-match', 'in-spectate');
    document.getElementById('view-table').classList.remove('active');
    document.getElementById('view-room').style.display = '';
    document.getElementById('rail').classList.remove('show');
    refreshRoom();
  }
  document.getElementById('btn-leave-table').addEventListener('click', leaveTable);

  // ── HUD: Line + Menu + Add-bot ────────────────────────────────────────────
  document.getElementById('btn-line').addEventListener('click', () => openSheet('sheet-line'));
  document.getElementById('line-close').addEventListener('click', closeSheets);
  document.getElementById('btn-menu').addEventListener('click', () => openSheet('sheet-menu'));
  document.getElementById('menu-close').addEventListener('click', closeSheets);
  document.getElementById('menu-profile').addEventListener('click', () => toast('Profile is coming soon.'));
  document.getElementById('menu-add-bot').addEventListener('click', () => { closeSheets(); openSheet('sheet-addbot'); });
  document.getElementById('addbot-cancel').addEventListener('click', closeSheets);
  document.getElementById('addbot-confirm').addEventListener('click', async () => {
    const kind = document.getElementById('bot-kind').value;
    const display_name = document.getElementById('bot-name').value || 'Bot';
    const endpoint = document.getElementById('bot-endpoint').value.trim();
    if (kind !== 'shaddai' && !endpoint) { toast('That bot kind needs an endpoint URL.'); return; }
    closeSheets();
    try {
      const { seat } = await api('POST', '/api/casino/seats', { kind, display_name, endpoint: endpoint || undefined });
      // Seat it immediately so it shows up in the room as an occupied chair,
      // demonstrating the "bot/agent in other chair" state via the real
      // seat/mailbox pipeline, same as any human seat.
      await api('POST', '/api/casino/tables', { seatId: seat.id, wager: 0, pack: 'blackjack' });
      toast(`${display_name} is seated at Blackjack.`);
      refreshRoom();
    } catch (e) { toast(e.message || 'Could not seat that bot.'); }
  });

  // ── deep link: /hall?table=<matchId>&mode=spectate ────────────────────────
  const params = new URLSearchParams(location.search);
  const deepTable = params.get('table');

  refreshRoom();
  refreshSparks();
  clearInterval(roomPoll);
  roomPoll = setInterval(() => { if (!document.body.classList.contains('in-match') && !document.body.classList.contains('in-spectate')) refreshRoom(); }, 5000);

  if (deepTable) enterSpectate(deepTable);
})();
</script>
</body>
</html>
