<!-- ===================================================================== -->
<!-- SHADDAI v92 — ROOMS PANEL (sub-project C)                              -->
<!-- Self-contained fragment: <div id="roomsPanel"> + scoped <style> + JS.  -->
<!-- Init via window.roomsPanelInit(). Calls relative /api/rooms/*.         -->
<!-- All ids/classes prefixed 'rm'. Aesthetic matches the Forge tab:        -->
<!-- dark, neon-teal #22d3ee + gold #d4af37, 'Share Tech Mono',             -->
<!-- holographic casting-chamber — but the ROOM reads as a lived-in,        -->
<!-- 3D-ish habitat: perspective floor, depth walls, ambient volumetric     -->
<!-- glow. "Change clothes" = cycling the forge slot system (POST wearable).-->
<!-- ===================================================================== -->
<div id="roomsPanel">
  <style>
  /* ---- scoped tokens ------------------------------------------------- */
  #roomsPanel{
    --rm-teal:#22d3ee; --rm-gold:#d4af37; --rm-ink:#05080d; --rm-ink2:#0a0f17;
    --rm-line:rgba(34,211,238,.22); --rm-line2:rgba(212,175,55,.20);
    --rm-dim:rgba(160,190,205,.55); --rm-mono:'Share Tech Mono','Courier New',monospace;
    position:relative; color:#cfe9f1; font-family:var(--rm-mono);
    background:
      radial-gradient(1100px 520px at 78% -8%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(212,175,55,.07), transparent 60%),
      linear-gradient(180deg,#04060a 0%, #070b12 100%);
    border:1px solid var(--rm-line); border-radius:14px; overflow:hidden;
    box-shadow:inset 0 0 80px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6);
  }
  #roomsPanel *{ box-sizing:border-box; }
  #roomsPanel::before{ /* grain + scanline atmosphere */
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5; z-index:6;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 50% 40%, transparent 60%, rgba(0,0,0,.45) 100%);
    mix-blend-mode:overlay;
  }

  /* ---- header strip -------------------------------------------------- */
  .rm-head{ display:flex; align-items:center; gap:14px; padding:14px 18px;
    border-bottom:1px solid var(--rm-line); position:relative; z-index:7;
    background:linear-gradient(90deg, rgba(34,211,238,.06), transparent 70%); }
  .rm-sigil{ width:34px;height:34px;flex:0 0 34px;border-radius:8px;
    border:1px solid var(--rm-line); display:grid;place-items:center;
    background:radial-gradient(circle at 50% 30%, rgba(34,211,238,.3), rgba(5,8,13,.9));
    box-shadow:0 0 18px rgba(34,211,238,.35); }
  .rm-sigil svg{ width:20px;height:20px; }
  .rm-title{ font-size:15px; letter-spacing:5px; color:#eaf8fc; text-transform:uppercase; }
  .rm-title b{ color:var(--rm-gold); }
  .rm-sub{ font-size:9px; letter-spacing:2px; color:var(--rm-dim); margin-top:2px; }
  .rm-owner{ margin-left:auto; font-size:9px; letter-spacing:2px; color:var(--rm-teal);
    border:1px solid var(--rm-line); padding:5px 10px; border-radius:20px;
    background:rgba(34,211,238,.06); }
  .rm-owner b{ color:#eaf8fc; }

  /* ---- main two-column layout --------------------------------------- */
  .rm-body{ display:grid; grid-template-columns:1.35fr 1fr; gap:0; position:relative; z-index:7; }
  @media (max-width:860px){ .rm-body{ grid-template-columns:1fr; } }

  /* ===== THE ROOM (left): a 3D-ish habitat ========================== */
  .rm-stage{ position:relative; min-height:420px; overflow:hidden;
    border-right:1px solid var(--rm-line);
    background:#060a10; perspective:900px; perspective-origin:50% 38%; }
  @media (max-width:860px){ .rm-stage{ border-right:none; border-bottom:1px solid var(--rm-line);} }

  /* generated FLUX scene sits behind, pushed into depth */
  .rm-scene{ position:absolute; inset:-6%; background-size:cover; background-position:center;
    filter:saturate(1.05) contrast(1.05) brightness(.82); transform:translateZ(-1px) scale(1.06);
    transition:opacity .5s ease; }
  .rm-scene.rm-empty{ background:
      radial-gradient(600px 380px at 50% 30%, rgba(34,211,238,.10), transparent 60%),
      linear-gradient(180deg,#070d15,#04070c); }

  /* procedural depth grid (the room never looks empty even with no FLUX img) */
  .rm-grid{ position:absolute; inset:0; pointer-events:none; }
  .rm-floor{ position:absolute; left:-20%; right:-20%; bottom:0; height:46%;
    background-image:
      linear-gradient(rgba(34,211,238,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.10) 1px, transparent 1px);
    background-size:48px 48px;
    transform:rotateX(72deg); transform-origin:bottom center;
    -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 88%, transparent);
            mask-image:linear-gradient(transparent, #000 32%, #000 88%, transparent);
    animation:rmFloor 14s linear infinite; }
  @keyframes rmFloor{ to{ background-position:0 48px, 48px 0; } }
  .rm-wallL,.rm-wallR{ position:absolute; top:0; bottom:34%; width:30%;
    background:linear-gradient(90deg, rgba(34,211,238,.05), transparent); }
  .rm-wallL{ left:0; transform:skewY(8deg); transform-origin:left;
    background:linear-gradient(90deg, rgba(212,175,55,.06), transparent); }
  .rm-wallR{ right:0; transform:skewY(-8deg); transform-origin:right; }
  .rm-glow{ position:absolute; left:50%; top:30%; width:340px; height:340px;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(34,211,238,.30), transparent 65%);
    filter:blur(8px); animation:rmPulse 6s ease-in-out infinite; }
  @keyframes rmPulse{ 50%{ transform:translate(-50%,-50%) scale(1.12); opacity:.75; } }

  /* the operative standing on the floor */
  .rm-opwrap{ position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
    width:200px; text-align:center; z-index:3; }
  .rm-pedestal{ position:absolute; left:50%; bottom:-14px; width:190px; height:42px;
    transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(34,211,238,.45), transparent 70%);
    filter:blur(3px); animation:rmPulse 6s ease-in-out infinite; }
  .rm-op{ width:200px; height:300px; position:relative; z-index:2;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(34,211,238,.25));
    animation:rmBob 5s ease-in-out infinite; }
  @keyframes rmBob{ 50%{ transform:translateY(-7px); } }
  .rm-op img{ width:100%; height:100%; object-fit:contain; border-radius:10px; }

  .rm-tags{ position:absolute; top:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; z-index:4; }
  .rm-tag{ font-size:8px; letter-spacing:2px; padding:4px 8px; border-radius:5px;
    border:1px solid var(--rm-line); background:rgba(5,8,13,.7); color:var(--rm-teal); backdrop-filter:blur(4px); }
  .rm-tag.gold{ color:var(--rm-gold); border-color:var(--rm-line2); }
  .rm-rarity{ text-transform:uppercase; }

  /* theme picker overlaid bottom of stage */
  .rm-themebar{ position:absolute; left:0; right:0; bottom:0; z-index:5;
    display:flex; gap:6px; padding:10px 12px; overflow-x:auto;
    background:linear-gradient(0deg, rgba(4,6,10,.92), transparent);
    backdrop-filter:blur(2px); }
  .rm-themebar::-webkit-scrollbar{ height:0; }
  .rm-theme{ flex:0 0 auto; font-size:8px; letter-spacing:1.5px; padding:6px 11px;
    border-radius:18px; cursor:pointer; white-space:nowrap; color:var(--rm-dim);
    border:1px solid var(--rm-line); background:rgba(8,14,22,.6); transition:.15s; }
  .rm-theme:hover{ color:#eaf8fc; border-color:var(--rm-teal); }
  .rm-theme.on{ color:var(--rm-ink); background:var(--rm-teal); border-color:var(--rm-teal);
    box-shadow:0 0 14px rgba(34,211,238,.5); font-weight:700; }
  .rm-regen{ margin-left:auto; flex:0 0 auto; font-size:8px; letter-spacing:2px;
    padding:6px 14px; border-radius:18px; cursor:pointer; text-transform:uppercase;
    color:var(--rm-gold); border:1px solid var(--rm-gold);
    background:linear-gradient(180deg, rgba(212,175,55,.18), rgba(212,175,55,.04)); transition:.15s; }
  .rm-regen:hover{ background:var(--rm-gold); color:var(--rm-ink); box-shadow:0 0 18px rgba(212,175,55,.55); }
  .rm-regen[disabled]{ opacity:.5; cursor:wait; }

  /* ===== RIGHT COLUMN: tabs + controls ============================== */
  .rm-side{ display:flex; flex-direction:column; min-height:420px; }
  .rm-tabs{ display:flex; border-bottom:1px solid var(--rm-line); }
  .rm-tabbtn{ flex:1; padding:12px 8px; font-size:9px; letter-spacing:2px; cursor:pointer;
    text-transform:uppercase; color:var(--rm-dim); background:transparent; border:none;
    border-right:1px solid var(--rm-line); font-family:var(--rm-mono); transition:.15s; }
  .rm-tabbtn:last-child{ border-right:none; }
  .rm-tabbtn:hover{ color:#eaf8fc; }
  .rm-tabbtn.on{ color:var(--rm-teal); background:linear-gradient(180deg, rgba(34,211,238,.12), transparent);
    box-shadow:inset 0 -2px 0 var(--rm-teal); }
  .rm-pane{ flex:1; padding:16px; overflow:auto; display:none; }
  .rm-pane.on{ display:block; animation:rmFade .25s ease; }
  @keyframes rmFade{ from{ opacity:0; transform:translateY(4px);} }

  /* wearable rows (the "change clothes" controls) */
  .rm-slot{ display:flex; align-items:center; gap:10px; padding:9px 10px; margin-bottom:7px;
    border:1px solid var(--rm-line); border-radius:9px; background:rgba(8,14,22,.5); }
  .rm-slot:hover{ border-color:rgba(34,211,238,.5); }
  .rm-slotname{ flex:0 0 78px; font-size:9px; letter-spacing:1.5px; color:var(--rm-gold); text-transform:uppercase; }
  .rm-slotval{ flex:1; font-size:10px; color:#eaf8fc; text-align:center; letter-spacing:1px; }
  .rm-cyc{ width:26px; height:26px; flex:0 0 26px; border-radius:6px; cursor:pointer;
    border:1px solid var(--rm-line); background:rgba(34,211,238,.08); color:var(--rm-teal);
    font-size:13px; line-height:1; display:grid; place-items:center; transition:.12s; }
  .rm-cyc:hover{ background:var(--rm-teal); color:var(--rm-ink); }
  .rm-cyc[disabled]{ opacity:.4; cursor:wait; }

  /* file / collectable cards */
  .rm-cards{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .rm-card{ border:1px solid var(--rm-line); border-radius:9px; padding:11px; background:rgba(8,14,22,.5);
    transition:.15s; }
  .rm-card:hover{ border-color:var(--rm-teal); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .rm-card .ic{ font-size:18px; }
  .rm-card .nm{ font-size:10px; color:#eaf8fc; margin-top:6px; letter-spacing:1px; word-break:break-word; }
  .rm-card .mt{ font-size:8px; color:var(--rm-dim); margin-top:3px; }
  .rm-card.col .ic{ filter:drop-shadow(0 0 6px rgba(212,175,55,.6)); }

  .rm-empty-note{ font-size:10px; color:var(--rm-dim); text-align:center; padding:26px 10px;
    border:1px dashed var(--rm-line); border-radius:9px; letter-spacing:1px; }
  .rm-future{ margin-top:12px; padding:11px; border:1px dashed var(--rm-line2); border-radius:9px;
    font-size:9px; color:var(--rm-gold); letter-spacing:1px; text-align:center; opacity:.85; }

  .rm-toast{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%) translateY(20px);
    z-index:9; padding:9px 16px; border-radius:8px; font-size:9px; letter-spacing:1.5px;
    background:rgba(5,8,13,.95); border:1px solid var(--rm-teal); color:#eaf8fc;
    box-shadow:0 0 22px rgba(34,211,238,.4); opacity:0; transition:.3s; pointer-events:none; }
  .rm-toast.err{ border-color:#ff5470; color:#ffd2da; box-shadow:0 0 22px rgba(255,84,112,.4); }
  .rm-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .rm-load{ position:absolute; inset:0; z-index:8; display:none; place-items:center;
    background:rgba(4,6,10,.6); backdrop-filter:blur(2px); }
  .rm-load.on{ display:grid; }
  .rm-ring{ width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(34,211,238,.2); border-top-color:var(--rm-teal); animation:rmSpin .8s linear infinite; }
  @keyframes rmSpin{ to{ transform:rotate(360deg);} }
  .rm-load .lbl{ position:absolute; margin-top:78px; font-size:9px; letter-spacing:2px; color:var(--rm-teal); }
  </style>

  <!-- ============================ HEADER ============================ -->
  <div class="rm-head">
    <div class="rm-sigil">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.4">
        <path d="M3 11 12 4l9 7"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/>
      </svg>
    </div>
    <div>
      <div class="rm-title">OPERATIVE <b>QUARTERS</b></div>
      <div class="rm-sub">LIVED-IN HABITAT · FLUX SCENE FORGE · WEARABLE BAY</div>
    </div>
    <div class="rm-owner">OWNER · <b id="rmOwner">—</b></div>
  </div>

  <!-- ============================= BODY ============================= -->
  <div class="rm-body">
    <!-- THE ROOM -->
    <div class="rm-stage" id="rmStage">
      <div class="rm-scene rm-empty" id="rmScene"></div>
      <div class="rm-grid" id="rmGrid">
        <div class="rm-wallL"></div><div class="rm-wallR"></div>
        <div class="rm-glow"></div><div class="rm-floor"></div>
      </div>
      <div class="rm-tags">
        <span class="rm-tag" id="rmArch">ARCHETYPE</span>
        <span class="rm-tag gold rm-rarity" id="rmRarity">—</span>
      </div>
      <div class="rm-opwrap">
        <div class="rm-pedestal"></div>
        <div class="rm-op" id="rmOp"></div>
      </div>
      <div class="rm-themebar" id="rmThemebar"></div>
      <div class="rm-load" id="rmLoad"><div class="rm-ring"></div><div class="lbl" id="rmLoadLbl">RENDERING…</div></div>
      <div class="rm-toast" id="rmToast"></div>
    </div>

    <!-- SIDE TABS -->
    <div class="rm-side">
      <div class="rm-tabs">
        <button class="rm-tabbtn on" data-pane="wear">Wearables</button>
        <button class="rm-tabbtn" data-pane="files">My Files</button>
        <button class="rm-tabbtn" data-pane="col">Collectables</button>
      </div>
      <div class="rm-pane on" id="rmPaneWear"></div>
      <div class="rm-pane" id="rmPaneFiles"></div>
      <div class="rm-pane" id="rmPaneCol"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- module state ----
  var S = { owner:'anon', meta:null, room:null, rarity:'common', busy:false };
  var $ = function(id){ return document.getElementById(id); };
  function api(p){ return '/api/rooms'+p; }

  function toast(msg, isErr){
    var t = $('rmToast'); if(!t) return;
    t.textContent = msg; t.className = 'rm-toast show'+(isErr?' err':'');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className='rm-toast'+(isErr?' err':''); }, 3200);
  }
  function load(on, lbl){ var l=$('rmLoad'); if(!l) return; if(lbl) $('rmLoadLbl').textContent=lbl; l.className='rm-load'+(on?' on':''); }
  function title(s){ return String(s||'').replace(/[-_]/g,' ').replace(/\b\w/g, function(c){return c.toUpperCase();}); }

  // ---- inline operative composite (SVG) — concept mirrors backend/forge sprites ----
  // We don't have the FLUX portrait until a forge happens, so paint a layered SVG
  // operative whose colours/shapes shift with the look-build. If the room stores a
  // forge portrait URL we show that instead.
  var SLOT_TINT = {
    aura:{ neon:'#22d3ee', flames:'#ff7a3c', 'sprouting-vines':'#4ade80', 'cosmic-nebula':'#a78bfa' },
    hair:{ natural:'#3a2a22', silver:'#d9dee5', green:'#4ade80', violet:'#a78bfa' },
    accent:{ azure:'#22d3ee', magenta:'#ec4899', green:'#4ade80', gold:'#d4af37' }
  };
  function tint(slot, val, def){ return (SLOT_TINT[slot]&&SLOT_TINT[slot][val]) || def; }

  function operativeSVG(build){
    var s = build.slots, id='rmg'+Math.random().toString(36).slice(2,7);
    var aura = tint('aura', s.aura, '#22d3ee');
    var hair = tint('hair', s.hair, '#d9dee5');
    var acc  = tint('accent', s.accent, '#d4af37');
    var bodyC = s.body==='android' ? '#e7ecf2' : s.body==='cyborg' ? '#9fb0bd'
              : s.body==='sylvan-form' ? '#6b8f5a' : '#caa07a';
    var fit  = s.outfit==='plate-armor' ? '#7e8a98' : s.outfit==='tech-kimono' ? '#1f2b3a'
             : s.outfit==='leaf-woven-mantle' ? '#356b3f' : '#16202b';
    var eye  = s.eyes==='glowing'||s.eyes==='scanner'||s.eyes==='third-eye' ? aura : '#1b2530';
    return ''
    + '<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">'
    +   '<defs>'
    +     '<radialGradient id="'+id+'a" cx="50%" cy="40%" r="60%">'
    +       '<stop offset="0%" stop-color="'+aura+'" stop-opacity=".55"/>'
    +       '<stop offset="100%" stop-color="'+aura+'" stop-opacity="0"/></radialGradient>'
    +     '<linearGradient id="'+id+'f" x1="0" y1="0" x2="0" y2="1">'
    +       '<stop offset="0%" stop-color="'+fit+'"/><stop offset="100%" stop-color="#05080d"/></linearGradient>'
    +   '</defs>'
    +   '<ellipse cx="100" cy="150" rx="92" ry="120" fill="url(#'+id+'a)"/>'
    // legs
    +   '<rect x="78" y="208" width="17" height="74" rx="7" fill="'+fit+'"/>'
    +   '<rect x="105" y="208" width="17" height="74" rx="7" fill="'+fit+'"/>'
    // torso / outfit
    +   '<path d="M70 120 q30 -16 60 0 l10 96 q-40 16 -80 0 z" fill="url(#'+id+'f)" stroke="'+acc+'" stroke-width="1.5"/>'
    +   '<line x1="100" y1="124" x2="100" y2="208" stroke="'+acc+'" stroke-width="1" opacity=".5"/>'
    // arms
    +   '<rect x="56" y="126" width="15" height="80" rx="7" fill="'+bodyC+'"/>'
    +   '<rect x="129" y="126" width="15" height="80" rx="7" fill="'+bodyC+'"/>'
    // handheld hint
    + (s.handheld==='cyber-katana' ? '<rect x="138" y="96" width="4" height="118" rx="2" fill="'+acc+'"/>' : '')
    + (s.handheld==='mage-staff'||s.handheld==='wooden-scythe' ? '<rect x="138" y="70" width="5" height="150" rx="2" fill="#6b4f2a"/><circle cx="140" cy="70" r="9" fill="'+aura+'"/>' : '')
    + (s.handheld==='coffee-cup' ? '<rect x="132" y="170" width="18" height="16" rx="3" fill="#caa07a"/>' : '')
    // neck + head
    +   '<rect x="92" y="98" width="16" height="20" fill="'+bodyC+'"/>'
    +   '<ellipse cx="100" cy="80" rx="28" ry="32" fill="'+bodyC+'"/>'
    // hair
    +   '<path d="M72 78 q4 -42 28 -44 q24 2 28 44 q-12 -18 -28 -18 q-16 0 -28 18z" fill="'+hair+'"/>'
    // headwear hints
    + (s.headwear==='antlers' ? '<path d="M84 52 q-14 -22 -24 -18 M116 52 q14 -22 24 -18" stroke="#b98b4a" stroke-width="3" fill="none"/>' : '')
    + (s.headwear==='neural-crown' ? '<path d="M78 60 h44" stroke="'+aura+'" stroke-width="3"/><circle cx="100" cy="50" r="3" fill="'+aura+'"/>' : '')
    + (s.headwear==='oni-mask' ? '<path d="M80 78 q20 14 40 0" stroke="#c0392b" stroke-width="3" fill="none"/>' : '')
    + (s.headwear==='mage-hood' ? '<path d="M66 80 q34 -54 68 0 q-34 -22 -68 0z" fill="'+fit+'" opacity=".9"/>' : '')
    // eyes
    +   '<circle cx="90" cy="82" r="3.4" fill="'+eye+'"/><circle cx="110" cy="82" r="3.4" fill="'+eye+'"/>'
    + (s.eyes==='third-eye' ? '<circle cx="100" cy="66" r="3" fill="'+aura+'"/>' : '')
    + '</svg>';
  }

  function renderOperative(){
    var op = $('rmOp'); if(!op||!S.room||!S.room.build) return;
    // prefer a real forged portrait if present on the record
    var portrait = S.room.portrait || (S.room.scene && S.room.operativePortrait);
    if (portrait){ op.innerHTML = '<img src="'+portrait+'" alt="operative"/>'; }
    else { op.innerHTML = operativeSVG(S.room.build); }
    $('rmArch').textContent = title((S.room.build && S.room.build.archetype) || 'operative');
    $('rmRarity').textContent = S.rarity || 'common';
  }

  function renderScene(){
    var sc = $('rmScene'); if(!sc) return;
    var url = S.room && S.room.scene && S.room.scene.url;
    if (url){ sc.style.backgroundImage='url('+url+')'; sc.className='rm-scene'; }
    else { sc.style.backgroundImage='none'; sc.className='rm-scene rm-empty'; }
  }

  // ---- THEME PICKER ----
  function renderThemes(){
    var bar = $('rmThemebar'); if(!bar||!S.meta) return;
    var cur = (S.room && S.room.theme) || 'neon-loft';
    var html = S.meta.themes.map(function(t){
      return '<div class="rm-theme'+(t.key===cur?' on':'')+'" data-theme="'+t.key+'">'+t.label+'</div>';
    }).join('');
    html += '<button class="rm-regen" id="rmRegen">⟳ Regenerate Room (FLUX)</button>';
    bar.innerHTML = html;
    Array.prototype.forEach.call(bar.querySelectorAll('.rm-theme'), function(el){
      el.onclick = function(){
        Array.prototype.forEach.call(bar.querySelectorAll('.rm-theme'), function(x){ x.classList.remove('on'); });
        el.classList.add('on');
        if (S.room) S.room.theme = el.getAttribute('data-theme');
      };
    });
    $('rmRegen').onclick = regenScene;
  }

  function regenScene(){
    if (S.busy) return;
    var theme = (S.room && S.room.theme) || 'neon-loft';
    S.busy = true; var btn=$('rmRegen'); if(btn) btn.disabled=true;
    load(true, 'FLUX RENDERING SCENE…');
    fetch(api('/scene'), { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ owner:S.owner, theme:theme }) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (res.ok && res.j.ok){
          S.room.scene = res.j.scene; renderScene();
          toast('ROOM SCENE RENDERED · '+title(theme));
        } else {
          var msg = (res.j && res.j.error) || 'scene render failed';
          toast(msg.slice(0,90), true);
        }
      })
      .catch(function(e){ toast('NETWORK · '+e.message, true); })
      .finally(function(){ S.busy=false; if(btn) btn.disabled=false; load(false); });
  }

  // ---- WEARABLES (change clothes = forge slots) ----
  function renderWear(){
    var pane = $('rmPaneWear'); if(!pane||!S.meta||!S.room) return;
    var build = S.room.build, order = S.meta.slotOrder;
    pane.innerHTML = '<div style="font-size:9px;letter-spacing:2px;color:var(--rm-dim);margin-bottom:11px;">'
      + 'CHANGE CLOTHES · cycle look slots · saved live to your operative</div>'
      + order.map(function(slot){
        var opts = S.meta.slots[slot];
        var cur = build.slots[slot];
        var found = opts.filter(function(o){return o.key===cur;})[0];
        return '<div class="rm-slot" data-slot="'+slot+'">'
          + '<span class="rm-slotname">'+slot+'</span>'
          + '<button class="rm-cyc" data-dir="-1">‹</button>'
          + '<span class="rm-slotval">'+(found?found.name:cur)+'</span>'
          + '<button class="rm-cyc" data-dir="1">›</button></div>';
      }).join('');
    Array.prototype.forEach.call(pane.querySelectorAll('.rm-slot'), function(row){
      var slot = row.getAttribute('data-slot');
      Array.prototype.forEach.call(row.querySelectorAll('.rm-cyc'), function(b){
        b.onclick = function(){ cycleSlot(slot, parseInt(b.getAttribute('data-dir'),10), row); };
      });
    });
  }

  function cycleSlot(slot, dir, row){
    if (S.busy) return;
    var opts = S.meta.slots[slot], cur = S.room.build.slots[slot];
    var i = 0; for (var k=0;k<opts.length;k++){ if(opts[k].key===cur){ i=k; break; } }
    var next = opts[(i + dir + opts.length) % opts.length].key;
    S.busy = true;
    Array.prototype.forEach.call(row.querySelectorAll('.rm-cyc'), function(b){ b.disabled=true; });
    fetch(api('/wearable'), { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ owner:S.owner, slot:slot, value:next }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.ok){
          S.room.build = j.build; S.rarity = j.rarity;
          renderOperative(); renderWear();
          toast(slot.toUpperCase()+' → '+title(next));
        } else { toast(j.error||'wearable update failed', true); }
      })
      .catch(function(e){ toast('NETWORK · '+e.message, true); })
      .finally(function(){ S.busy=false; });
  }

  // ---- FILES + COLLECTABLES ----
  function renderFiles(){
    var pane=$('rmPaneFiles'); if(!pane) return;
    var files = (S.room && S.room.files) || [];
    if(!files.length){ pane.innerHTML = '<div class="rm-empty-note">NO FILES YET · purchases from the marketplace land here</div>'; return; }
    pane.innerHTML = '<div class="rm-cards">' + files.map(function(f){
      var nm = f.name||f.title||f; var mt = f.kind||f.type||'file';
      return '<div class="rm-card"><div class="ic">📄</div><div class="nm">'+nm+'</div><div class="mt">'+mt+'</div></div>';
    }).join('') + '</div>';
  }
  function renderCol(){
    var pane=$('rmPaneCol'); if(!pane) return;
    var col = (S.room && S.room.collectables) || [];
    var html = '';
    if(!col.length){ html = '<div class="rm-empty-note">NO COLLECTABLES YET · earn them from jobs &amp; quests</div>'; }
    else { html = '<div class="rm-cards">' + col.map(function(c){
        var nm = (c && (c.name||c.title)) || title(c);
        var mt = (c && c.rarity) || 'earned';
        return '<div class="rm-card col"><div class="ic">✦</div><div class="nm">'+nm+'</div><div class="mt">'+mt+'</div></div>';
      }).join('') + '</div>'; }
    html += '<div class="rm-future">⮞ SOON · launch your operative from this room into Games</div>';
    pane.innerHTML = html;
  }

  // ---- TABS ----
  function wireTabs(){
    var btns = document.querySelectorAll('#roomsPanel .rm-tabbtn');
    Array.prototype.forEach.call(btns, function(b){
      b.onclick = function(){
        Array.prototype.forEach.call(btns, function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        var p = b.getAttribute('data-pane');
        $('rmPaneWear').className = 'rm-pane'+(p==='wear'?' on':'');
        $('rmPaneFiles').className = 'rm-pane'+(p==='files'?' on':'');
        $('rmPaneCol').className = 'rm-pane'+(p==='col'?' on':'');
      };
    });
  }

  // ---- BOOT ----
  function paintAll(){
    $('rmOwner').textContent = S.owner;
    renderOperative(); renderScene(); renderThemes(); renderWear(); renderFiles(); renderCol();
  }

  window.roomsPanelInit = function(owner){
    S.owner = owner || (window.SHADDAI_USER && window.SHADDAI_USER.email) || 'anon';
    wireTabs();
    load(true, 'OPENING QUARTERS…');
    Promise.all([
      fetch(api('/meta')).then(function(r){return r.json();}),
      fetch(api('/'+encodeURIComponent(S.owner))).then(function(r){return r.json();})
    ]).then(function(res){
      S.meta = res[0]; var rd = res[1];
      if (rd && rd.ok){ S.room = rd.room; S.rarity = rd.rarity; }
      else { S.room = { build:null, theme:'neon-loft', files:[], collectables:[], scene:null }; }
      paintAll();
    }).catch(function(e){
      toast('FAILED TO LOAD ROOM · '+e.message, true);
    }).finally(function(){ load(false); });
  };
})();
</script>
