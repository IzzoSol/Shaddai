    hud.globalAlpha = 0.28;
    hud.font = '11px "IBM Plex Mono", monospace';
    hud.textBaseline = 'middle';
    for(let i=0;i<elements.length;i++){
      const y = top + i*lineH;
      // ticking hex value
      if(Math.random()<0.06) hexRnd[i]=Math.random();
      const val = ((elements[i].base + Math.floor(hexRnd[i]*0x30 + Math.sin(t*2+i)*8))&0xFFF)>>>0;
      const hex = '0x'+val.toString(16).toUpperCase().padStart(3,'0');
      // symbol (emerald)
      hud.fillStyle = '#00ff9c';
      hud.fillText(elements[i].sym.padEnd(3,' '), x, y);
      // hex (cyan)
      hud.fillStyle = '#5fe0ff';
      hud.fillText(hex, x+34, y);
      // tiny animated bar
      bars[i] += (Math.sin(t*1.5+i*0.7)*0.5+0.5 - bars[i])*0.05;
      const bw = 46, bh = 3;
      const bx = x+92, by = y-1;
      hud.fillStyle = 'rgba(0,255,156,0.25)';
      hud.fillRect(bx,by,bw,bh);
      hud.fillStyle = '#00ff9c';
      hud.fillRect(bx,by,bw*bars[i],bh);
    }
    // header line
    hud.globalAlpha = 0.34;
    hud.fillStyle = '#e8c45c';
    hud.font = '10px "IBM Plex Mono", monospace';
    hud.fillText('◈ QUANTUM READOUT — MALKUTH', x, top - 26);
    hud.fillStyle = 'rgba(95,224,255,0.5)';
    hud.fillText('lattice.stable  · shells.coupled', x, top - 12);

    // ---- lower-right wordmark / scene id
    hud.globalAlpha = 0.5;
    const cssW = W/dpr;
    hud.textAlign = 'right';
    hud.fillStyle = '#e8c45c';
    hud.font = '13px "IBM Plex Mono", monospace';
    hud.fillText('QUANTUM  LATTICE', cssW-34, cssH-46);
    hud.globalAlpha = 0.3;
    hud.fillStyle = '#00ff9c';
    hud.font = '10px "IBM Plex Mono", monospace';
    hud.fillText(HUD_STAGE, cssW-34, cssH-30);
    hud.textAlign = 'left';
    hud.restore();
  }

  // ---- render passes helpers ----------------------------------
  function bindFBO(target){
    if(target){ gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo); gl.viewport(0,0,target.w,target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H); }
  }
  function drawFS(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null); }

  // ---- main loop (pause-safe) ---------------------------------
  let running = true;
  let startT = performance.now();
  let lastT  = startT;
  document.addEventListener('visibilitychange', ()=>{
    running = !document.hidden;
    if(running){ lastT = performance.now(); requestAnimationFrame(frame); }
  });

  function frame(now){
    if(!running) return;
    if(document.hidden){ requestAnimationFrame(frame); return; } // skip while hidden
    const t = (now - startT)/1000;
    // clamped delta for the governor EMA (ignore tab-switch spikes)
    const dtMs = Math.min(100, Math.max(1, now - lastT));
    lastT = now;
    updateGovernor(dtMs);

    // ease mouse + excitation (heavy reverent inertia)
    mouse.x += (mRaw.x - mouse.x)*0.045;
    mouse.y += (mRaw.y - mouse.y)*0.045;
    excite  += (exciteTarget - excite)*0.06;
    exciteTarget *= 0.965; // decay so it settles

    // ease scroll progress so the camera glides (cinematic, never jumpy)
    p += (pTarget - p)*0.075;
    // (test-only) allow a headless harness to pin p directly, so screenshots
    // reflect an exact scale without waiting for slow-framerate convergence.
    if(typeof window.__forceP === 'number') p = window.__forceP;

    // ---------- PASS 1 : SCENE -> HDR fbo ----------
    bindFBO(sceneFBO);
    gl.useProgram(progScene);
    // scene renders at scaled res -> feed the SCALED size as uRes so aspect &
    // fragcoord math stay correct (composite/HUD below still use native W,H).
    gl.uniform2f(uScene('uRes'), SW, SH);
    gl.uniform1f(uScene('uTime'), (typeof window.__forceT === 'number') ? window.__forceT : t);
    gl.uniform2f(uScene('uMouse'), mouse.x, mouse.y);
    gl.uniform2f(uScene('uMouseRaw'), mRaw.x, mRaw.y);
    gl.uniform1f(uScene('uExcite'), 0.35 + excite*0.65);
    gl.uniform1f(uScene('uP'), p);
    // remap the single eased scroll p into THREE continuous scale-beats.
    // EXTENDED (2026-07-17): journey is molecule -> water -> DESERT (finale).
    // The scroll driver was lengthened (1000vh -> 1600vh) so molecule+water keep
    // their ORIGINAL scroll distance/feel and the desert occupies the added tail.
    //   molecule zoom-out :  0.0000 .. 0.2063 -> pMol   (unchanged feel)
    //   WATER (skim/pool) :  0.2063 .. 0.6250 -> pWater (unchanged feel)
    //   DESERT (finale)   :  0.6250 .. 1.0000 -> pDesert (oasis pull-back ->
    //                        pyramid -> dunes -> tilt-up to NIGHT star-field)
    const SEAM_MW = 0.2063;  // molecule -> water
    const SEAM_WD = 0.6250;  // water    -> desert
    const pMol    = Math.min(1, p / SEAM_MW);
    const pWater  = Math.min(1, Math.max(0, (p - SEAM_MW) / (SEAM_WD - SEAM_MW)));
    const pDesert = Math.max(0, (p - SEAM_WD) / (1.0 - SEAM_WD));
    gl.uniform1f(uScene('uPMol'),    pMol);
    gl.uniform1f(uScene('uPWater'),  pWater);
    gl.uniform1f(uScene('uPDesert'), pDesert);
    window.__DBG = {p:p, pMol:pMol, pWater:pWater, pDesert:pDesert};
    // update HUD stage label to match the scale we're flying through
    if(p < SEAM_MW)      HUD_STAGE = 'מלכות · the seed of matter · SCENE 01/03';
    else if(p < SEAM_WD) HUD_STAGE = 'מים · the waters gather · SCENE 02/03';
    else if(pDesert < 0.34) HUD_STAGE = 'יסוד · the oasis & the pyramid · SCENE 03/03';
    else if(pDesert < 0.62) HUD_STAGE = 'יסוד · aerial over the dunes · SCENE 03/03';
    else                 HUD_STAGE = 'יסוד · climbing into night · SCENE 03/03';
    drawFS();

    // ---------- PASS 2 : BRIGHT PASS (half res) ----------
    bindFBO(brightFBO);
    gl.useProgram(progBright);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
    gl.uniform1i(uBright('uScene'), 0);
    gl.uniform1f(uBright('uThreshold'), 0.42);
    drawFS();

    // ---------- PASS 3 : SEPARABLE BLUR (2 iterations) ----------
    const bw = brightFBO.w, bh = brightFBO.h;
    let src = brightFBO;
    for(let it=0; it<2; it++){
      // horizontal -> blurA
      bindFBO(blurA);
      gl.useProgram(progBlur);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform1i(uBlur('uTex'),0);
      gl.uniform2f(uBlur('uDir'), (1.0/bw)*(1.0+it*0.8), 0.0);
      drawFS();
      // vertical -> blurB
      bindFBO(blurB);
      gl.bindTexture(gl.TEXTURE_2D, blurA.tex);
      gl.uniform2f(uBlur('uDir'), 0.0, (1.0/bh)*(1.0+it*0.8));
      drawFS();
      src = blurB;
    }

    // ---------- PASS 4 : FINAL COMPOSITE -> screen ----------
    bindFBO(null);
    gl.useProgram(progFinal);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
    gl.uniform1i(uFinal('uScene'),0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
    gl.uniform1i(uFinal('uBloom'),1);
    gl.uniform2f(uFinal('uRes'), W, H);
    gl.uniform2f(uFinal('uSceneTexel'), 1.0/SW, 1.0/SH);
    gl.uniform1f(uFinal('uTime'), t);
    gl.uniform2f(uFinal('uMouse'), mouse.x, mouse.y);
    drawFS();

    // ---------- HUD overlay ----------
    drawHUD(t);

    requestAnimationFrame(frame);
  }

  // small guard: if first frame throws, show fallback rather than blank
  try {
    requestAnimationFrame(frame);
    console.log('[QuantumLattice] WebGL2 acquired. HDR='+(HDR_TYPE===gl.HALF_FLOAT?'half-float':'rgba8')+' — rendering.');
  } catch(err){
    console.error('[QuantumLattice] render failed, showing fallback:', err);
    fallback.style.display='grid';
  }

})();
</script>
