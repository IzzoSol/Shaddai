<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADDAI · Iso MMO Room</title>
<style>
  html,body{margin:0;background:#0d1017;color:#cfe3f2;font-family:'Segoe UI',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid #202838}
  h1{margin:0;font-size:16px}h1 b{color:#00ff88}
  .sub{color:#7d8ea3;font-size:12px;margin-top:3px}
  .wrap{padding:14px 22px}
  .stage{background:#0c1119;border:1px solid #202838;border-radius:12px;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  canvas{display:block;width:100%;height:auto;border-radius:8px;image-rendering:pixelated}
</style></head><body>
<header><h1>SHADDAI · <b>Isometric MMO Room</b> — Habbo-style · AI citizens · smooth</h1>
<div class="sub">Proper iso room + normal AI-generated characters walking as ¾ billboards. This is the office, upgraded.</div></header>
<div class="wrap"><div class="stage"><canvas id="c"></canvas></div></div>
<script>
'use strict';
const TW=84, TH=42;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2), CSSW=0, CSSH=560, OX=0, OY=0;
const GW=10, GH=8;
function resize(){CSSW=Math.min(document.querySelector('.stage').clientWidth-16,1180);canvas.style.width=CSSW+'px';canvas.style.height=CSSH+'px';canvas.width=CSSW*DPR;canvas.height=CSSH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;OX=CSSW*0.5-((GW-1)/2-(GH-1)/2)*TW/2;OY=90;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function iso(col,row){return [OX+(col-row)*TW/2, OY+(col+row)*TH/2];}
function Pth(pts){ctx.beginPath();ctx.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));for(let i=1;i<pts.length;i++)ctx.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));ctx.closePath();}
function box(col,row,w,d,h,top,opts){opts=opts||{};const cx=OX+(col-row)*TW/2,cy=OY+(col+row)*TH/2;const dx=(dc,dr)=>(dc-dr)*TW/2,dy=(dc,dr)=>(dc+dr)*TH/2;const hw=w/2,hd=d/2;const back=[cx+dx(-hw,-hd),cy+dy(-hw,-hd)],right=[cx+dx(hw,-hd),cy+dy(hw,-hd)],front=[cx+dx(hw,hd),cy+dy(hw,hd)],left=[cx+dx(-hw,hd),cy+dy(-hw,hd)];const up=p=>[p[0],p[1]-h];const tB=up(back),tR=up(right),tF=up(front),tL=up(left);ctx.fillStyle=opts.left||shade(top,-0.18);Pth([left,front,tF,tL]);ctx.fill();ctx.fillStyle=opts.right||shade(top,-0.34);Pth([front,right,tR,tF]);ctx.fill();ctx.fillStyle=top;Pth([tB,tR,tF,tL]);ctx.fill();}
function boxL(col,row,w,d,h,color,lift,opts){const s=OY;OY-=lift;box(col,row,w,d,h,color,opts);OY=s;}
function tileD(col,row,color){const [cx,cy]=iso(col,row);ctx.fillStyle=color;Pth([[cx,cy-TH/2],[cx+TW/2,cy],[cx,cy+TH/2],[cx-TW/2,cy]]);ctx.fill();ctx.strokeStyle=shade(color,-0.12);ctx.lineWidth=1;Pth([[cx,cy-TH/2],[cx+TW/2,cy],[cx,cy+TH/2],[cx-TW/2,cy]]);ctx.stroke();}

// ---- background-removal cache (edge flood fill) ----
function cutout(img,tol=52){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);const id=g.getImageData(0,0,c.width,c.height),d=id.data,w=c.width,h=c.height;const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2]];});const bg=[0,1,2].map(k=>Math.round(cs.reduce((s,c)=>s+c[k],0)/4));const near=i=>Math.abs(d[i]-bg[0])<tol&&Math.abs(d[i+1]-bg[1])<tol&&Math.abs(d[i+2]-bg[2])<tol;const st=[],seen=new Uint8Array(w*h);for(let x=0;x<w;x++){st.push(x,x+(h-1)*w);}for(let y=0;y<h;y++){st.push(y*w,w-1+y*w);}while(st.length){const p=st.pop();if(seen[p])continue;seen[p]=1;const i=p*4;if(!near(i))continue;d[i+3]=0;const x=p%w,y=(p/w)|0;if(x>0)st.push(p-1);if(x<w-1)st.push(p+1);if(y>0)st.push(p-w);if(y<h-1)st.push(p+w);}g.putImageData(id,0,0);return c;}
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}

// ---- room ----
function drawFloor(){
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){
    let col=(c+r)%2?'#8a6a44':'#7d5f3c';                 // warm wood
    if(c>=3&&c<=6&&r>=2&&r<=5)col=(c+r)%2?'#3a4d6b':'#33445e'; // blue rug
    tileD(c,r,col);
  }
}
function drawWalls(){
  // back-left wall (along row = -0.5) and back-right wall (along col = -0.5)
  boxL((GW-1)/2,-0.62, GW,0.16, 78, '#2c3242', 0);
  boxL(-0.62,(GH-1)/2, 0.16,GH, 78, '#252a38', 0);
  // simple window on the left wall
  ctx.globalAlpha=0.9;
}
function deskFn(col,row){boxL(col,row,0.8,0.5,16,'#5a3f28',0);boxL(col-0.1,row-0.1,0.3,0.05,15,'#20242c',16);const [cx,cy]=iso(col-0.1,row-0.1);ctx.fillStyle='#5fe0ff';ctx.fillRect(Math.round(cx)-8,Math.round(cy)-30,10,7);}
function plantFn(col,row){boxL(col,row,0.2,0.2,11,'#7a5230',0);boxL(col,row,0.52,0.52,13,'#2fae4f',11);boxL(col,row,0.34,0.34,11,'#37c95f',24);}
function sofaFn(col,row){boxL(col,row,0.95,0.5,11,'#c0455a',0);boxL(col-0.2,row-0.2,0.55,0.5,17,'#a83a4e',11);}
const FURN=[{c:1,r:1,fn:deskFn},{c:8,r:1,fn:deskFn},{c:0,r:7,fn:plantFn},{c:9,r:7,fn:plantFn},{c:9,r:0,fn:plantFn},{c:5,r:6,fn:sofaFn}];
const blocked=new Set(FURN.map(f=>f.c+','+f.r));

// ---- citizens (billboard sprites) ----
let SEED=97; function rnd(){SEED=(SEED*1103515245+12345)&0x7fffffff;return SEED/0x7fffffff;}
function freeTile(){let c,r,k=0;do{c=(rnd()*GW)|0;r=(rnd()*GH)|0;k++;}while(blocked.has(c+','+r)&&k<30);return[c,r];}
const cits=[];
function billboard(cut,col,row){
  const [cx,cy]=iso(col,row);
  const dh=95, s=dh/cut.height, dw=cut.width*s;
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(cx,cy,17,7,0,0,7);ctx.fill();
  ctx.drawImage(cut, Math.round(cx-dw/2), Math.round(cy-dh+6), Math.round(dw), Math.round(dh));
}

let last=0;
function update(dt){for(const ch of cits){if(ch.pause>0){ch.pause-=dt;continue;}const dx=ch.tc-ch.col,dy=ch.tr-ch.row,dist=Math.hypot(dx,dy);if(dist<0.06){ch.col=ch.tc;ch.row=ch.tr;ch.pause=0.6+rnd()*2.6;const[tc,tr]=freeTile();ch.tc=tc;ch.tr=tr;}else{const v=ch.speed*dt;ch.col+=dx/dist*v;ch.row+=dy/dist*v;}}}
const draws=[];
function render(){ctx.clearRect(0,0,CSSW,CSSH);drawFloor();drawWalls();draws.length=0;for(const f of FURN)draws.push({k:f.c+f.r,d:()=>f.fn(f.c,f.r)});for(const ch of cits)draws.push({k:ch.col+ch.row+0.02,d:()=>billboard(ch.cut,ch.col,ch.row)});draws.sort((a,b)=>a.k-b.k);for(const o of draws)o.d();}
function loop(t){const dt=Math.min((t-last)/1000||0,0.05);last=t;update(dt);render();requestAnimationFrame(loop);}

(async()=>{
  const files=['_mmo_iso','_cit1','_cit2','_cit3','_cit4'];
  for(const f of files){const im=await load(f+'.png');if(im){const [c,r]=freeTile();const[tc,tr]=freeTile();cits.push({cut:cutout(im),col:c,row:r,tc,tr,speed:0.7+rnd()*0.6,pause:rnd()*2});}}
  addEventListener('resize',()=>{DPR=Math.min(devicePixelRatio||1,2);resize();});
  resize();requestAnimationFrame(loop);
})();
</script></body></html>
