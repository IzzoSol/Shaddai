<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHADDAI Forge Wizard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@500;600&family=Albert+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Marcellus&display=swap">
<style>
/* Layout: full-bleed WebGL stage. HUD in the four corners, step panel docked bottom-left (bottom sheet on phones). */
:root{
  --bg:#04101C; --surface:#0A1C2E; --line:#1B3A57; --text:#D6EEFF; --muted:#8FB3CC;
  --accent:#2FD6FF; --trim:#E6B84A; --on-accent:#04101C; --focus:#FFFFFF;
  --f-display:"Marcellus",Georgia,serif; --f-ui:"Albert Sans",system-ui,sans-serif; --f-hud:"Tomorrow",system-ui,sans-serif; --f-data:"Martian Mono",ui-monospace,monospace;
  --cut:12px; --card:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
  --plate:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  --plate-in:polygon(0 0,calc(100% - var(--cut) + 1px) 0,100% calc(var(--cut) - 1px),100% 100%,calc(var(--cut) - 1px) 100%,0 calc(100% - var(--cut) + 1px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.45;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}
.hud{font-family:var(--f-hud);font-size:.78rem;letter-spacing:.06em;color:var(--accent)}
#tl{top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;width:min(300px,calc(100vw - 150px))}
#tl b{font-weight:600}
#tl .sub{color:var(--muted);font-size:.74rem}
.seg{display:flex;gap:4px}.seg i{flex:1;height:4px;background:var(--line);transition:background .4s}.seg i.on{background:var(--accent)}.seg i.cur{background:var(--trim)}
#tr{top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:grid;gap:4px;font-family:var(--f-hud)}
#tr div{display:flex;gap:10px;justify-content:flex-end;align-items:baseline}
#tr .k{color:var(--trim);font-size:.78rem;letter-spacing:.08em}
#tr .v{color:var(--accent);font-size:1.15rem;font-weight:600;min-width:3ch}
#br{bottom:max(14px,env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:grid;gap:6px;justify-items:end}
#br .st{color:var(--muted);font-size:.74rem}#br .st b{color:var(--accent);font-weight:600}
.pal{display:flex;gap:6px}
.pal button{font:500 .72rem var(--f-hud);letter-spacing:.05em;background:rgba(10,28,46,.6);border:1px solid var(--line);color:var(--muted);padding:6px 10px;cursor:pointer}
.pal button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pal button:focus-visible,.ghost:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#bl{left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px))}

/* plate buttons */
.btn{--inset:1.5px;--fill:var(--surface);--edge:var(--accent);position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:0;background:var(--edge);color:var(--accent);font:600 .92rem/1 var(--f-ui);cursor:pointer;clip-path:var(--plate);transition:transform .12s}
.btn::before{content:"";position:absolute;inset:var(--inset);background:var(--fill);clip-path:var(--plate-in);transition:background .2s}
.btn>span{position:relative}
.btn.primary{--fill:var(--accent);--inset:0;color:var(--on-accent)}
.btn.primary:hover{--fill:color-mix(in srgb,var(--accent) 78%,#fff)}
.btn.secondary:hover{--fill:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:focus-visible{outline:none;--edge:var(--focus);--inset:3px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%) 130% 0/250% 100%;animation:sweep 1.1s linear infinite;clip-path:var(--plate);mix-blend-mode:overlay}
@keyframes sweep{to{background-position:-130% 0}}
.ghost{background:none;border:0;color:var(--muted);font:500 .85rem var(--f-ui);cursor:pointer;padding:10px 4px;min-height:44px}
.ghost:hover{color:var(--accent)}

/* step panel */
.panel{background:var(--line);clip-path:var(--card);padding:1.5px}
.panel>.in{background:rgba(6,18,32,.88);backdrop-filter:blur(8px);clip-path:var(--card);padding:18px 18px 14px;display:grid;gap:12px;max-height:calc(100vh - 150px);overflow:auto}
.panel h2{font:400 1.45rem/1.1 var(--f-display);color:var(--trim);margin:0;letter-spacing:.03em}
.panel p{margin:0;color:var(--muted);font-size:.9rem}
.panel label.f{display:grid;gap:5px;font-size:.82rem;color:var(--muted)}
.panel input[type=text],.panel select{background:#071526;border:1px solid var(--line);color:var(--text);font:500 .95rem var(--f-ui);padding:10px 12px;min-height:44px;width:100%;border-radius:0}
.panel input[type=text]:focus,.panel select:focus{outline:2px solid var(--accent);outline-offset:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--text);cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.opt span{display:block;border:1px solid var(--line);padding:9px 14px;font-size:.88rem;background:#071526;min-height:40px}
.opt input:checked+span{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#071526)}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.opt input:disabled+span{opacity:.4}
.sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.fine{font-size:.76rem;color:var(--muted)}
.receipt{font:400 .78rem/1.5 var(--f-data);border:1px dashed var(--line);padding:10px;color:var(--text)}
.receipt b{color:var(--trim);font-weight:500}

/* projected labels */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.pl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;transition:opacity .25s;white-space:nowrap}
.pl button{pointer-events:auto;background:none;border:0;cursor:pointer;color:var(--trim);font:400 clamp(1rem,2.1vw,1.7rem)/1 var(--f-display);letter-spacing:.06em;padding:4px 8px;text-transform:uppercase}
.pl button:disabled{cursor:default}
.pl button:focus-visible{outline:2px solid var(--focus)}
.pl small{display:block;font:500 clamp(.52rem,.8vw,.7rem) var(--f-hud);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.pl.dim button{color:color-mix(in srgb,var(--trim) 45%,transparent)}
.chkbox{width:26px;height:26px;border:1.5px solid var(--trim);display:grid;place-items:center;transition:background .3s,opacity .3s;opacity:.45}
.chkbox svg{width:16px;height:16px;opacity:0;transition:opacity .3s}
.chkbox.on{opacity:1;background:color-mix(in srgb,var(--trim) 22%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--trim) 60%,transparent)}
.chkbox.on svg{opacity:1}
.vl{text-align:center}
.vl .t{font:400 clamp(1.1rem,2.6vw,2rem) var(--f-display);color:var(--trim);letter-spacing:.14em}
.vl svg{width:28px;height:28px;display:block;margin:0 auto 4px}

/* intro */
#intro{inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:6;transition:opacity 1.2s}
#intro h1{margin:0;font:400 clamp(2.4rem,9vw,5.6rem)/1 var(--f-display);color:var(--trim);letter-spacing:.18em;text-shadow:0 0 30px color-mix(in srgb,var(--trim) 50%,transparent)}
#intro p{margin:10px 0 0;font:500 clamp(.7rem,1.6vw,.95rem) var(--f-hud);letter-spacing:.3em;color:var(--accent)}
#skip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:7}
#fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:760px){
  #bl{left:0;right:0;bottom:0;width:auto;padding-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel>.in{max-height:44vh}
  #br{bottom:auto;top:max(66px,calc(env(safe-area-inset-top,0px) + 56px));right:max(16px,env(safe-area-inset-right,0px))}
  #br .st{display:none}
  .pl small{display:none}
  #tl{width:min(220px,calc(100vw - 140px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</div>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function wire(){var q=function(s){return panel.querySelector(s)},qa=function(s){return panel.querySelectorAll(s)};
  var nx=q('#nx'),bk=q('#bk');if(bk)bk.onclick=UI.back;if(nx&&!q('#f-name'))nx.onclick=UI.next;
  if(q('#f-name')){var nm=q('#f-name'),oa=q('#f-oath'),pu=q('#f-purpose');var chk=function(){S.name=nm.value.trim();S.oath=oa.checked;S.purpose=pu.value;nx.disabled=!(S.name.length>=2&&S.oath)};chk();
    nm.oninput=chk;oa.onchange=chk;pu.onchange=chk;nx.onclick=function(){chk();if(!nx.disabled)UI.next()};nm.onkeydown=function(e){if(e.key==='Enter'&&!nx.disabled)UI.next()}}
  qa('input[name=kind]').forEach(function(r){r.onchange=function(){S.kind=r.value;W&&W.sync()}});
  qa('[data-fin]').forEach(function(b){b.onclick=function(){S.finish=b.dataset.fin;W&&W.finish(S.finish);qa('[data-fin]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
  qa('[data-sk]').forEach(function(c){c.onchange=function(){if(c.checked)S.skills[c.dataset.sk]=true;else delete S.skills[c.dataset.sk];var n=Object.keys(S.skills).length;nx.disabled=n<1;
    qa('[data-sk]').forEach(function(o){o.disabled=!o.checked&&n>=CAP});q('#skn').textContent=n+' of '+CAP+' skills. The cap here is an example; the real limit per tier is read from prices.json.'}});
  if(S.i===2&&nx)nx.disabled=Object.keys(S.skills).length<1;
  qa('input[name=job]').forEach(function(r){r.onchange=function(){S.job=r.value}});
  var rj=q('#runjob');if(rj)rj.onclick=function(){S.labor=1;W&&W.runLabor();if(!W){setTimeout(UI.laborDone,1200)}render()};
  var ov=q('#openv');if(ov)ov.onclick=function(){S.vault=1;if(!W)UI.sparks(100);render()};
  var ag=q('#again');if(ag)ag.onclick=function(){location.hash='#nointro';location.reload()};
  var en=q('#enter');if(en)en.onclick=function(){var note=q('#regNote'),who=S.name||'Your agent';
    if(en.dataset.go){location.href='/SHADDAI-WORLD-3D.html';return}
    en.disabled=true;en.classList.add('loading');en.firstChild.textContent='Registering '+who;
    enterWorld().then(function(){note.textContent=who+' is registered and wears the '+title(S.kind)+' body. Opening the world.';setTimeout(function(){location.href='/SHADDAI-WORLD-3D.html'},900)})
    .catch(function(e){en.disabled=false;en.classList.remove('loading');en.dataset.go='1';en.firstChild.textContent='Enter the world anyway';
      note.textContent='The server did not answer ('+e.message+'), so '+who+' is saved on this device only. Try again after you sign in.'})}}
/* FINISH: register the operative with the same endpoint forge.html uses. The server sets the owner from the session (never the client)
   and validates `model` against the 7 council bodies, so this record is what makes the agent appear in Shaddai World. */
function enterWorld(){
  var rec={codename:(S.name||'Unnamed').slice(0,24),archetype:S.kind.toLowerCase(),model:S.kind,look:{archetype:S.kind.toLowerCase(),model:S.kind},
    brain:{tier:'free',persona:'You are '+(S.name||'an operative')+', a SHADDAI operative. Purpose: '+S.purpose+'.'},tools:Object.keys(S.skills)};
  try{localStorage.setItem('shd_forge_demo_agent_v1',JSON.stringify(Object.assign({savedAt:Date.now(),firstJob:S.job},rec)))}catch(e){}
  return fetch('/api/operatives',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(!r.ok||d.ok===false)throw new Error((d&&d.error)||('HTTP '+r.status));return d})})}

function mount(){
  var pal=$('pal');Object.keys(PAL).forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=PAL[k].n;b.setAttribute('aria-pressed',k===S.pal);b.onclick=function(){S.pal=k;W?W.setPal(k):0;[].forEach.call(pal.children,function(x){x.setAttribute('aria-pressed',x===b)})};pal.appendChild(b)});
  $('skip').onclick=function(){W&&W.skip();$('skip').style.display='none'};
  $('replay').onclick=function(){W&&W.replay()};
  $('glow').onclick=function(){W&&W.setGlow($('glow').getAttribute('aria-pressed')!=='true')};
  try{W=buildWorld()}catch(e){W=null;console.warn('3D unavailable',e);$('fallback').style.display='grid';$('intro').style.display='none';$('skip').style.display='none'}
  render();W&&W.sync();
  var qs=location.hash;if(W&&qs==='#nointro')W.noIntro();
  window.__forge={S:S,UI:UI,W:W};
}
mount();
})();
