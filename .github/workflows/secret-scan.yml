# .github/workflows/secret-scan.yml
# Spec source: docs/specs/SPEC_security-hardening.md, Issue 5
#
# Runs gitleaks against the full git history on every push and pull request
# targeting the main branch. The build fails immediately if any secret matching
# .gitleaks.toml is found.

name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read        # needed to check out the repo
  security-events: write  # optional: allows uploading SARIF results to GitHub Security tab

jobs:
  gitleaks:
    name: Detect secrets with gitleaks
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Check out the full history so gitleaks can scan all commits,
      #    not just the most recent one.
      # ------------------------------------------------------------------
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Run gitleaks via the official action.
      #    - SARIF output is generated so findings can optionally appear
      #      in the GitHub Security tab (requires security-events: write).
      #    - The action exits non-zero (failing the build) if any secret
      #      is found, unless `fail` is set to false.
      # ------------------------------------------------------------------
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set GITLEAKS_LICENSE for the gitleaks.io managed service.
          # Leave unset to use the free open-source mode.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          # Point gitleaks at our custom rule set in the repo root.
          args: >-
            detect
            --source .
            --config .gitleaks.toml
            --redact
            --verbose
            --exit-code 1

      # ------------------------------------------------------------------
      # 3. (Optional) Upload SARIF report to GitHub Security tab.
      #    This step only runs if the scan produced a report file, and
      #    does NOT override the exit code from step 2.
      # ------------------------------------------------------------------
      - name: Upload SARIF report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
