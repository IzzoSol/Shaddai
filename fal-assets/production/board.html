<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fal Production Board</title>
<style>
:root{--bg:#06080b;--panel:#0d1219;--line:#1d2733;--ink:#dfe7ee;--dim:#7a8794;--gold:#e8c45c;--em:#00ff9c;--cy:#5fe0ff;--red:#ff5d6c;--amber:#ffb547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,8,11,.94);backdrop-filter:blur(6px);z-index:5}
h1{margin:0 0 4px;font-size:18px;letter-spacing:.12em;color:var(--gold)}
.sub{color:var(--dim);font-size:12px}
.budget{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{flex:1;min-width:220px;height:12px;border-radius:6px;background:#141b24;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{font-size:12px;color:var(--dim)}
.legend b{color:var(--ink)}
.filters{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:#101822;border:1px solid var(--line);color:var(--dim);padding:5px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.filters button.on{border-color:var(--gold);color:var(--gold)}
main{padding:16px;max-width:1400px;margin:0 auto}
.problems{border:1px solid var(--red);background:rgba(255,93,108,.07);border-radius:10px;padding:10px 14px;margin-bottom:16px}
section{margin-bottom:26px}
section h2{font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section h2 b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.canary{border-color:rgba(232,196,92,.55)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:700}
.id{font:11px ui-monospace,Consolas,monospace;color:var(--dim)}
.chip{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.s-needs-ref{background:rgba(255,93,108,.14);color:var(--red)}
.s-ready-concept{background:rgba(255,181,71,.14);color:var(--amber)}
.s-concept-approved,.s-mesh-approved{background:rgba(95,224,255,.14);color:var(--cy)}
.s-shipped{background:rgba(0,255,156,.14);color:var(--em)}
.s-cut{background:#1a1f27;color:var(--dim)}
.canbadge{font-size:10px;color:var(--gold);border:1px solid rgba(232,196,92,.5);border-radius:4px;padding:1px 5px;margin-left:6px}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs figure{margin:0;flex:0 0 auto;text-align:center}
.thumbs img{height:118px;max-width:150px;object-fit:contain;background:#5a5a60;border-radius:6px;display:block}
.thumbs figcaption{font-size:10px;color:var(--dim);margin-top:2px}
.empty{height:118px;width:96px;border:1px dashed var(--red);border-radius:6px;display:grid;place-items:center;color:var(--red);font-size:11px;text-align:center;padding:4px}
.need{font-size:12px;color:var(--red);margin:0;padding-left:16px}
.need.opt{color:var(--dim)}
.kv{font-size:12px;color:var(--dim);display:grid;grid-template-columns:78px 1fr;gap:2px 8px}
.kv span:nth-child(odd){color:#566372}
.kv span{overflow-wrap:anywhere}
details{font-size:12px}
summary{cursor:pointer;color:var(--cy)}
pre{white-space:pre-wrap;background:#080c11;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.45 ui-monospace,Consolas,monospace;color:#b9c6d2;margin:6px 0 0}
.copy{margin-top:6px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 8px;font:inherit;font-size:11px;cursor:pointer}
.steps{font-size:11px;color:var(--dim);margin:0;padding-left:16px}
.nodata{padding:40px 16px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>SHADDAI · fal PRODUCTION BOARD</h1>
  <div class="sub" id="sub"></div>
  <div class="budget"><div class="bar" id="bar"></div><div class="legend" id="legend"></div></div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"><div class="nodata">board-data.js missing — run <code>node fal-assets/production/preflight.mjs</code></div></main>
<script src="board-data.js"></script>
<script>
(function(){
  var D = window.FAL_BOARD; if(!D) return;
  var M = D.manifest, FAM = M.families, filter = 'all';
  try { filter = localStorage.getItem('falboard.filter') || 'all'; } catch(e){}
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  // refs live under fal-assets/ ; current_state may be repo-rooted (public/...)
  var src = function(p){ return /^public\//.test(p) ? '../../'+p : '../'+p; };
  var isImg = function(p){ return /\.(png|jpe?g|webp)$/i.test(p); };

  document.getElementById('sub').textContent = M.assets.length + ' assets · validated ' + new Date(D.builtAt).toLocaleString() + (D.validation.problems.length ? ' · ' + D.validation.problems.length + ' PROBLEMS' : ' · manifest OK');

  var cap = M.budget.hard_cap_usd, spent = D.spent, fams = Object.keys(FAM).sort(function(a,b){return FAM[a].order-FAM[b].order;});
  var colors = { agent:'#e8c45c', building:'#5fe0ff', vehicle:'#00ff9c', cosmetic:'#c78bff', video:'#ff8a5c' };
  var bar = '', leg = [];
  fams.forEach(function(f){ bar += '<i style="width:'+(FAM[f].cap_usd/cap*100)+'%;background:'+colors[f]+';opacity:.35" title="'+f+' $'+FAM[f].cap_usd+'"></i>'; leg.push('<span style="color:'+colors[f]+'">■</span> '+f+' $'+FAM[f].cap_usd); });
  bar += '<i style="width:'+(M.budget.reserve_usd/cap*100)+'%;background:#39424e" title="reserve"></i>';
  document.getElementById('bar').innerHTML = bar;
  document.getElementById('legend').innerHTML = 'spent <b>$'+spent.toFixed(2)+'</b> / $'+cap+' · reserve $'+M.budget.reserve_usd+' · '+leg.join(' · ');

  var sts = ['all'].concat(M.statuses);
  var fl = document.getElementById('filters');
  fl.innerHTML = sts.map(function(s){ var n = s==='all'?M.assets.length:M.assets.filter(function(a){return a.status===s;}).length; return '<button data-s="'+s+'"'+(s===filter?' class="on"':'')+'>'+s+' · '+n+'</button>'; }).join('');
  fl.onclick = function(e){ var s = e.target.getAttribute('data-s'); if(!s) return; filter = s; try{localStorage.setItem('falboard.filter',s);}catch(x){} [].forEach.call(fl.children,function(b){b.className=b.getAttribute('data-s')===s?'on':'';}); render(); };

  function prompt(a){
    return [M.style_lock, M.family_rules[a.family], a.silhouette ? 'Silhouette: '+a.silhouette+'.' : '', a.palette && a.palette!=='style_lock' ? 'Palette: '+a.palette+'.' : '', a.emissive ? 'Emissive: '+a.emissive+'.' : '', a.dims ? 'Scale: '+a.dims+'.' : '', a.family==='cosmetic'||a.family==='video' ? '' : M.shot, 'NEGATIVE: '+M.negative].filter(Boolean).join('\n');
  }
  function card(a){
    var r = a.refs||{}, have = r.have||[], need = r.need||[];
    var th = have.map(function(p){ return isImg(p) ? '<figure><img loading="lazy" src="'+esc(src(p))+'" alt=""><figcaption>ref</figcaption></figure>' : ''; }).join('');
    if(!have.length) th += '<div class="empty">NO REF<br>drop into<br>production/<br>refs/'+esc(a.id)+'/</div>';
    if(r.current_state && isImg(r.current_state)) th += '<figure><img loading="lazy" src="'+esc(src(r.current_state))+'" alt=""><figcaption>current</figcaption></figure>';
    if(r.legacy_concept) th += '<figure><img loading="lazy" src="'+esc(src(r.legacy_concept))+'" alt="" style="opacity:.55"><figcaption>legacy</figcaption></figure>';
    var needs = need.length ? '<ul class="need">'+need.map(function(n){ return '<li'+(/^optional/i.test(n)?' class="need opt"':'')+'>'+esc(n)+'</li>'; }).join('')+'</ul>' : '';
    var steps = (M.pipelines[a.family]||[]).map(function(s){ return '<li><b>'+esc(s.step)+'</b> ≤ $'+s.cap_usd+' · '+esc(s.model)+' — <i>'+esc(s.gate)+'</i></li>'; }).join('');
    var slot = a.slot ? esc(a.slot.file) + (a.slot.note ? ' — ' + esc(a.slot.note) : '') : '';
    var p = prompt(a);
    return '<div class="card'+(a.canary?' canary':'')+'">'
      + '<div class="top"><div><div class="name">'+esc(a.name)+(a.canary?'<span class="canbadge">CANARY</span>':'')+(a.count?'<span class="canbadge" style="color:var(--dim);border-color:var(--line)">×'+a.count+'</span>':'')+'</div><div class="id">'+esc(a.id)+'</div></div><span class="chip s-'+esc(a.status)+'">'+esc(a.status)+'</span></div>'
      + '<div class="thumbs">'+th+'</div>' + needs
      + '<div class="kv"><span>slot</span><span>'+slot+'</span>'+(a.dims?'<span>scale</span><span>'+esc(a.dims)+'</span>':'')+(a.palette?'<span>palette</span><span>'+esc(a.palette)+'</span>':'')+(a.defects?'<span>defects</span><span>'+esc(a.defects)+'</span>':'')+'</div>'
      + '<details><summary>prompt + gated steps</summary><pre>'+esc(p)+'</pre><button class="copy" data-p="'+esc(p)+'">copy prompt</button><ul class="steps">'+steps+'</ul></details>'
      + '</div>';
  }
  function render(){
    var h = '';
    if(D.validation.problems.length) h += '<div class="problems"><b>Preflight problems</b><ul>'+D.validation.problems.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>';
    fams.forEach(function(f){
      var list = M.assets.filter(function(a){ return a.family===f && (filter==='all'||a.status===filter); });
      if(!list.length) return;
      var w = D.validation.worst[f]||{}, sp = D.ledger.entries.filter(function(e){ var a=M.assets.find(function(x){return x.id===e.id;}); return a&&a.family===f; }).reduce(function(s,e){return s+e.usd;},0);
      h += '<section><h2><b style="color:'+colors[f]+'">'+f.toUpperCase()+'</b> cap $'+FAM[f].cap_usd+' · worst case $'+w.worst+' · spent $'+sp.toFixed(2)+' · canary '+esc(FAM[f].canary)+(FAM[f].only_if_reserve_intact?' · LAST, only if reserve intact':'')+'</h2><div class="grid">'+list.map(card).join('')+'</div></section>';
    });
    document.getElementById('main').innerHTML = h || '<div class="nodata">nothing with status '+esc(filter)+'</div>';
  }
  document.addEventListener('click', function(e){ var p = e.target.getAttribute && e.target.getAttribute('data-p'); if(p==null) return; try{ navigator.clipboard.writeText(p); e.target.textContent='copied'; }catch(x){} });
  render();
})();
</script>
</body>
</html>
