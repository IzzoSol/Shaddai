<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Athenaeum · Class Hall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@500;600&family=Albert+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Marcellus&display=swap">
<style>
/* THE ATHENAEUM CLASS HALL (2026-11-05, owner): the foundation for classes, built like the Forge (forge-demo.html): full-bleed holographic
   3D hall, a step panel bottom-left, HUD corners. Steps: Navi code -> class -> teacher + PIKADON audit -> countdown (seats fill, skippable)
   -> live class (first-person / stage / level 2 / spectator cams, media, agent notes, bot physics test) -> wrap-up + Colosseum sign-up.
   Fees, PayBox payments and server-issued codes are deliberately NOT here yet (owner: "fill in teacher fees later"). */
:root{--bg:#050b14;--surface:#0b1828;--line:#1d3a55;--text:#d8eeff;--muted:#8fb0c8;--accent:#5fe0ff;--trim:#e8c45c;--human:#e8c45c;--bot:#27e0ff;--ok:#00e5a0;--warn:#f87171;
  --f-display:"Marcellus",Georgia,serif;--f-ui:"Albert Sans",system-ui,sans-serif;--f-hud:"Tomorrow",system-ui,sans-serif;--f-data:"Martian Mono",ui-monospace,monospace;
  --card:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));--plate:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:5}
#tl{top:14px;left:16px;font:600 .78rem var(--f-hud);letter-spacing:.08em;color:var(--accent)}#tl .sub{color:var(--muted);font-weight:500}
.seg{display:flex;gap:4px;margin-top:8px;width:min(320px,60vw)}.seg i{flex:1;height:4px;background:var(--line)}.seg i.on{background:var(--accent)}.seg i.cur{background:var(--trim)}
#tr{top:14px;right:16px;text-align:right;font-family:var(--f-hud)}#tr div{display:flex;gap:10px;justify-content:flex-end;align-items:baseline}#tr .k{color:var(--trim);font-size:.76rem;letter-spacing:.08em}#tr .v{color:var(--accent);font-size:1.05rem;font-weight:600}
#cams{bottom:14px;right:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}
#cams button,.chip{font:500 .74rem var(--f-hud);letter-spacing:.05em;background:rgba(11,24,40,.75);border:1px solid var(--line);color:var(--muted);padding:7px 11px;cursor:pointer}
#cams button[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#bl{left:16px;bottom:14px;width:min(430px,calc(100vw - 32px))}
.panel{background:var(--line);clip-path:var(--card);padding:1.5px}.panel>.in{background:rgba(6,16,28,.9);clip-path:var(--card);padding:16px 18px 14px;display:grid;gap:11px;max-height:calc(100vh - 140px);overflow:auto}
.panel h2{font:400 1.4rem/1.1 var(--f-display);color:var(--trim);margin:0;letter-spacing:.03em}.panel p{margin:0;color:var(--muted);font-size:.9rem}
.panel input[type=text],.panel textarea{background:#071526;border:1px solid var(--line);color:var(--text);font:500 .95rem var(--f-ui);padding:10px 12px;width:100%;border-radius:0}
.panel input:focus,.panel textarea:focus{outline:2px solid var(--accent)}
.code{font:600 1.6rem var(--f-data)!important;letter-spacing:.45em;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1}.fine{font-size:.76rem;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 18px;border:0;background:var(--accent);color:#04101c;font:600 .92rem/1 var(--f-ui);cursor:pointer;clip-path:var(--plate)}
.btn.sec{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:0;color:var(--muted);font:500 .85rem var(--f-ui);cursor:pointer;padding:8px 4px}.ghost:hover{color:var(--accent)}
.card{border:1px solid var(--line);padding:10px 12px;display:grid;gap:4px}.card b{color:var(--text)}
.badge{display:inline-block;font:600 .68rem var(--f-hud);letter-spacing:.08em;padding:3px 8px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.gold{color:var(--trim)}
.checks div{display:flex;justify-content:space-between;font:.8rem var(--f-data);padding:3px 0;border-bottom:1px dashed var(--line)}
#notes{top:70px;right:16px;width:min(330px,40vw);max-height:46vh;overflow:auto;display:none}
#notes .n{background:rgba(6,16,28,.86);border-left:3px solid var(--accent);padding:7px 10px;margin-bottom:6px;font-size:.82rem;animation:nin .4s ease-out}
#notes .n b{font:600 .72rem var(--f-hud);letter-spacing:.08em}#notes .n.m{border-left-color:var(--warn)}
@keyframes nin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
#media{left:50%;top:14px;transform:translateX(-50%);display:none;font:600 .74rem var(--f-hud);letter-spacing:.08em;color:var(--trim);background:rgba(6,16,28,.8);border:1px solid var(--line);padding:6px 12px}
#count{left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:none}
#count .t{font:400 clamp(3rem,10vw,7rem)/1 var(--f-display);color:var(--trim);text-shadow:0 0 30px rgba(232,196,92,.5)}#count .s{font:600 .9rem var(--f-hud);letter-spacing:.3em;color:var(--accent)}
#skip{position:fixed!important;left:50%;bottom:18px;transform:translateX(-50%);display:none}   /* .btn's position:relative must not win */
#spec{top:50px;left:50%;transform:translateX(-50%);display:none;font:600 .8rem var(--f-hud);letter-spacing:.2em;color:var(--warn);border:1px solid var(--warn);padding:6px 14px;background:rgba(20,6,10,.7)}
.drop{border:1.5px dashed var(--line);padding:12px;text-align:center;color:var(--muted);font-size:.85rem}.drop.hot{border-color:var(--accent);color:var(--accent)}
@media (max-width:760px){#bl{left:0;right:0;bottom:0;width:auto}.panel>.in{max-height:46vh}#notes{display:none!important}#cams{bottom:auto;top:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

}

function wire() {

/* PIKADON audit (foundation): four content checks animate; the real review endpoint plugs in here when teacher submissions are live */
var AUDIT = ['Claims are backed or labelled as opinion', 'Nothing unsafe to try at home', 'Facts checked against the knowledge base', 'Price and length match the description'];

function runAudit() { S.audit = 'running'; S.auditStep = 0; render(); var t = setInterval(function () { S.auditStep++; if (S.auditStep >= AUDIT.length) { clearInterval(t); S.audit = 'approved'; render(); } else drawChecks(); }, reduce ? 50 : 700); }
/* countdown: seats fill as the timer runs (demo 20 s; a scheduled class counts to its start time) */
var countTimer = null;
function startCountdown() { go(3); S.countLeft = 20; S.filled = 0; fillKinds(); countTimer = setInterval(function () { S.countLeft -= 0.25; S.filled = Math.min(S.cap, Math.round(S.cap * (1 - S.countLeft / 20) * 0.94)); $('countT').textContent = fmt(S.countLeft); seg(); if (S.countLeft <= 0) { clearInterval(countTimer); beginClass(); } }, 250); }

/* live: agents post notes (observations + mistakes to learn from) */
var NOTE_BANK = {
  Painting: [['TURTLE', 'Complementary light makes the edge pop.'], ['ORACLE', 'Three of us mixed the glaze too dark.', 1], ['QUILL', 'Wrote the palette as a recipe card.']],
  Building: [['NEXUS', 'Load goes down the columns, not across the beam.'], ['ZEROX', 'Underpriced the steel by 12%.', 1], ['PIKADON', 'Flagged the unbraced span as unsafe.']],
  Math: [['QUILL', 'Vectors add tip to tail.'], ['SHADDAI', 'Lost a sign on the y component.', 1], ['ORACLE', 'Dot product = how much two moves agree.']],
  'Physics test': [['NEXUS', 'Range peaks at 45° when drag is zero.'], ['ZEROX', 'Forgot to convert km/h to m/s.', 1], ['PIKADON', 'Verified the units on every answer.']],
  'Open topic': [['SHADDAI', 'Asked the class for one real example each.'], ['TURTLE', 'Turned the idea into a sketch.'], ['QUILL', 'Missed the speaker\'s second point.', 1]]

var noteTimer = null;
function note(who, text, mistake) { var col = (AGENTS.filter(function (a) { return a[0] === who; })[0] || [0, '#5fe0ff'])[1]; S.notes.push({ who: who, text: text, m: !!mistake, t: Date.now() });
  var d = document.createElement('div'); d.className = 'n' + (mistake ? ' m' : ''); d.innerHTML = '<b style="color:' + col + '">' + who + (mistake ? ' · MISTAKE' : '') + '</b><br>' + esc(text); $('notes').prepend(d); }

/* bot physics test: a projectile question; the true answer is computed, each agent answers with its own error, scored within 2% */

  var v = 18 + Math.round(Math.random() * 14), ang = [30, 40, 45, 55][Math.floor(Math.random() * 4)], g = 9.81, truth = v * v * Math.sin(2 * ang * Math.PI / 180) / g;
  var errs = { SHADDAI: 0.004, NEXUS: 0.001, ORACLE: 0.012, ZEROX: 0.09, TURTLE: 0.03, QUILL: 0.008, PIKADON: 0.0 }, score = 0;
  note('NEXUS', 'Physics test: v = ' + v + ' m/s at ' + ang + '°, no drag. True range ' + truth.toFixed(1) + ' m.');
  AGENTS.forEach(function (a) { var e = errs[a[0]] * (Math.random() < 0.5 ? -1 : 1), ans = truth * (1 + e), ok = Math.abs(e) <= 0.02; if (ok) score++; if (!ok) note(a[0], 'Answered ' + ans.toFixed(1) + ' m (' + (e * 100).toFixed(0) + '% off). Learning: check units and the sin(2θ) term.', true); });

function downloadNotes() { var blob = new Blob([JSON.stringify({ class: S.cls, level: S.level, audience: S.audience, format: S.format, attended: S.filled, notes: S.notes, physicsTest: S.test, files: S.files, audit: S.audit, at: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'athenaeum-notes-' + ((S.cls && S.cls.id) || 'class') + '.json'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000); }
