<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SHADDAI · The Manual</title>
<meta name="description" content="The SHADDAI manual — Sparks, the council, the forge, the games, the worlds and the flywheel. Read it like a game booklet." />
<meta name="theme-color" content="#06080b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   THE MANUAL — a cartridge-era option booklet in SHADDAI's own language.

   The N64 reference is STRUCTURE, not skin: a fixed chapter rail with a
   travelling cursor, one plate of content at a time, page turns you can
   hear, and d-pad navigation. The surface stays obsidian/gold/Cinzel —
   grey plastic would be cosplay, not design.

   The plate is a real 3D object (CSS transform-style: preserve-3d). It
   rotates on its Y axis when you change chapter, so a page turn reads as
   a physical card flipping in a slot rather than a fade.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --void:#06080b; --void2:#0a0e13; --panel:#0e141b; --edge:rgba(120,150,140,.16);
  --emerald:#00ff9c; --gold:#e8c45c; --cyan:#5fe0ff; --violet:#b07cff; --rose:#ff6f6f;
  --ink:#e9efe9; --ink-soft:#93a49b; --ink-faint:#4f5d57;
  --f-display:'Cinzel',serif; --f-serif:'Fraunces',Georgia,serif; --f-mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.22,.7,.2,1);
  --accent:var(--gold);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--void); -webkit-text-size-adjust:100%; }
body{
  background:var(--void); color:var(--ink); font-family:var(--f-serif);
  min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
a{ color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

.aura{ position:fixed; inset:-15%; z-index:0; pointer-events:none;
  background:
    radial-gradient(46% 36% at 22% 16%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 64%),
    radial-gradient(42% 34% at 80% 78%, rgba(95,224,255,.06), transparent 64%);
  transition:background .8s var(--ease); }
.grain{ position:fixed; inset:0; z-index:40; pointer-events:none; mix-blend-mode:overlay; opacity:.26;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>"); }
.vig{ position:fixed; inset:0; z-index:39; pointer-events:none;
  background:radial-gradient(120% 92% at 50% 44%, transparent 46%, rgba(0,0,0,.72) 100%); }

/* ── header ───────────────────────────────────────────────────────────── */
header{ position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px clamp(14px,3.5vw,34px);
  padding-top:calc(14px + env(safe-area-inset-top)); }
.brand{ font-family:var(--f-display); font-weight:900; letter-spacing:.2em; font-size:clamp(14px,1.9vw,18px); }
.brand span{ color:var(--accent); }
.hbtns{ display:flex; gap:6px; }
.hb{ font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); border:1px solid var(--edge); border-radius:2px; background:rgba(14,20,27,.55);
  min-height:44px; min-width:44px; padding:0 12px; display:inline-flex; align-items:center; gap:7px;
  transition:border-color .25s var(--ease), color .25s var(--ease); }
.hb:hover,.hb.on{ color:var(--ink); border-color:color-mix(in srgb, var(--accent) 50%, transparent); }
.hb .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); }
.hb.on .dot{ background:var(--accent); box-shadow:0 0 8px var(--accent); }

/* ── the booklet ──────────────────────────────────────────────────────── */
main{ position:relative; z-index:10; flex:1; display:grid;
  grid-template-columns:minmax(190px,240px) 1fr; gap:clamp(14px,2.4vw,30px);
  padding:0 clamp(14px,3.5vw,34px) clamp(16px,3vw,30px); max-width:1400px; margin:0 auto; width:100%; }

/* chapter rail — the option list */
.rail{ display:flex; flex-direction:column; gap:2px; align-self:start;
  border:1px solid var(--edge); border-radius:3px; background:rgba(10,14,19,.6); padding:8px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.rail .rl{ font-family:var(--f-mono); font-size:9px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-faint); padding:4px 8px 8px; }
.ch{ position:relative; display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  font-family:var(--f-display); font-weight:700; font-size:13px; letter-spacing:.13em;
  color:var(--ink-soft); min-height:44px; padding:0 10px; border-radius:2px;
  transition:color .2s var(--ease), background .2s var(--ease); }
.ch .cur{ width:0; overflow:hidden; color:var(--ac); transition:width .2s var(--ease); font-family:var(--f-mono); }
.ch .n{ margin-left:auto; font-family:var(--f-mono); font-size:9px; color:var(--ink-faint); letter-spacing:.1em; }
.ch:hover{ color:var(--ink); background:rgba(255,255,255,.03); }
.ch.on{ color:var(--ink); background:color-mix(in srgb, var(--ac) 12%, transparent); }
.ch.on .cur{ width:14px; }
.ch.on .n{ color:var(--ac); }

/* the plate — a physical card in a slot */
.stage{ perspective:1600px; min-height:0; }
.plate{
  position:relative; transform-style:preserve-3d;
  border:1px solid color-mix(in srgb, var(--accent) 26%, transparent); border-radius:4px;
  background:linear-gradient(158deg, rgba(14,20,27,.94), rgba(6,8,11,.97));
  box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  padding:clamp(20px,3vw,38px); min-height:clamp(420px,62vh,660px);
  transition:transform .5s var(--ease), opacity .32s var(--ease), border-color .5s var(--ease);
}
.plate.turn{ transform:rotateY(-14deg) translateZ(-70px); opacity:0; }
.plate::after{ /* the bevel that makes it read as a moulded plate, not a div */
  content:''; position:absolute; inset:7px; border:1px solid rgba(255,255,255,.045);
  border-radius:2px; pointer-events:none; }

.pnum{ font-family:var(--f-mono); font-size:10px; letter-spacing:.24em; color:var(--ink-faint); }
.ptitle{ font-family:var(--f-display); font-weight:900; letter-spacing:.03em; line-height:1;
  font-size:clamp(30px,5vw,54px); margin:8px 0 0; color:var(--ink); }
.plede{ font-size:clamp(14px,1.6vw,17px); font-style:italic; color:var(--accent); margin-top:10px; max-width:60ch; }
.pbody{ margin-top:clamp(18px,2.4vw,28px); display:flex; flex-direction:column; gap:16px; }
.pbody p{ font-size:15px; line-height:1.68; color:var(--ink-soft); max-width:70ch; }

.big{ font-family:var(--f-display); font-weight:900; font-size:clamp(34px,6vw,64px);
  letter-spacing:.04em; color:var(--accent); text-shadow:0 0 40px color-mix(in srgb, var(--accent) 30%, transparent); }

.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
.gc{ border:1px solid var(--edge); border-left:2px solid var(--accent); border-radius:2px;
  padding:12px 14px; background:rgba(255,255,255,.016); }
.gc b{ display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); margin-bottom:5px; font-weight:500; }
.gc span{ font-size:13.5px; line-height:1.55; color:var(--ink-soft); }

.flow{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.flow i{ font-style:normal; font-family:var(--f-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  border-radius:2px; padding:9px 13px; color:var(--ink); background:rgba(255,255,255,.02); }
.flow em{ color:var(--accent); font-style:normal; }

.roster{ display:flex; flex-direction:column; gap:6px; }
.rs{ display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:baseline;
  border-bottom:1px solid var(--edge); padding:9px 0; }
.rs b{ font-family:var(--f-display); font-weight:900; font-size:14px; letter-spacing:.1em; color:var(--rc); }
.rs .role{ font-family:var(--f-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); }
.rs .d{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
@media(max-width:560px){ .rs{ grid-template-columns:1fr; gap:3px; } }

.controls{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.kc{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:1px solid var(--edge); border-radius:2px; padding:10px 12px; background:rgba(0,0,0,.25); }
.kc b{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; }
.kc kbd{ font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; color:var(--accent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-bottom-width:3px; border-radius:3px; padding:4px 9px; background:rgba(255,255,255,.03); }

.steps{ display:flex; flex-direction:column; gap:10px; counter-reset:s; }
.st{ display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; }
.st::before{ counter-increment:s; content:counter(s); font-family:var(--f-mono); font-size:11px;
  color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  border-radius:50%; width:30px; height:30px; display:grid; place-items:center; }
.st b{ display:block; font-family:var(--f-display); font-weight:700; font-size:14px; letter-spacing:.06em; }
.st span{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; }

.note,.warn{ border-radius:2px; padding:12px 14px; font-size:13.5px; line-height:1.6; }
.note{ border-left:2px solid var(--cyan); background:rgba(95,224,255,.05); color:var(--ink-soft); }
.warn{ border-left:2px solid var(--rose); background:rgba(255,111,111,.06); color:#ffd9d9; }
.warn::before{ content:'⚠ '; color:var(--rose); }

/* ── footer pager — the d-pad ──────────────────────────────────────────── */
footer{ position:relative; z-index:20; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:0 clamp(14px,3.5vw,34px) calc(16px + env(safe-area-inset-bottom)); }
.pg{ font-family:var(--f-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-soft); border:1px solid var(--edge); border-radius:2px; min-height:52px; padding:0 20px;
  display:inline-flex; align-items:center; gap:9px; background:rgba(14,20,27,.6);
  transition:border-color .22s var(--ease), color .22s var(--ease); }
.pg:hover{ color:var(--ink); border-color:var(--accent); }
.pg[disabled]{ opacity:.3; cursor:default; }
.pgi{ font-family:var(--f-mono); font-size:10px; letter-spacing:.2em; color:var(--ink-faint); min-width:74px; text-align:center; }

@media(max-width:820px){
  main{ grid-template-columns:1fr; gap:12px; }
  /* the rail becomes a swipeable tab strip on a phone */
  .rail{ flex-direction:row; overflow-x:auto; gap:4px; padding:6px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .rail .rl{ display:none; }
  .ch{ flex:0 0 auto; scroll-snap-align:start; font-size:12px; padding:0 14px; }
  .ch .n,.ch .cur{ display:none; }
  .plate{ min-height:auto; }
}
@media (prefers-reduced-motion: reduce){
  .plate{ transition:opacity .01s !important; }
  .plate.turn{ transform:none; }
  .aura{ transition:none; }
}
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>

<header>
  <a class="brand" href="/enter.html">SHADDAI <span>· MANUAL</span></a>
  <div class="hbtns">
    <button class="hb" id="bSound" type="button" title="Page sounds"><span class="dot"></span>sound</button>
    <a class="hb" href="/enter.html">exit</a>
  </div>
</header>

<main>
  <nav class="rail" id="rail" aria-label="Chapters"><span class="rl">Contents</span></nav>
  <div class="stage">
    <article class="plate" id="plate" aria-live="polite"></article>
  </div>
</main>

<footer>
  <button class="pg" id="prev" type="button">‹ back</button>
  <span class="pgi" id="pgi">01 / 09</span>
  <button class="pg" id="next" type="button">next ›</button>
</footer>

<script src="/js/manual-pages.js"></script>
<script>
(function () {
  'use strict';
  var P = window.MANUAL_PAGES || [];
  var plate = document.getElementById('plate');
  var rail = document.getElementById('rail');
  var pgi = document.getElementById('pgi');
  var i = 0;
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── page-turn sound ───────────────────────────────────────────────────
     Synthesised, not a file: two short blips through a lowpass, so the
     booklet has cartridge-menu feedback with zero asset weight. Off by
     default and gated behind a click, because audio that starts itself is
     hostile and browsers block it anyway. */
  var actx = null, soundOn = false;
  try { soundOn = localStorage.getItem('shd_manual_sound') === '1'; } catch (e) {}
  function blip(freq, when, dur) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2200;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.06, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(actx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  }
  function turnSound() {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      blip(440, t, 0.05); blip(660, t + 0.045, 0.06);
    } catch (e) {}
  }
  var bs = document.getElementById('bSound');
  function paintSound() { bs.classList.toggle('on', soundOn); }
  bs.addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('shd_manual_sound', soundOn ? '1' : '0'); } catch (e) {}
    paintSound(); turnSound();
  });
  paintSound();

  /* ── render ───────────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function block(b) {
    switch (b.k) {
      case 'p': return '<p>' + esc(b.v) + '</p>';
      case 'big': return '<div class="big">' + esc(b.v) + '</div>';
      case 'note': return '<div class="note">' + esc(b.v) + '</div>';
      case 'warn': return '<div class="warn">' + esc(b.v) + '</div>';
      case 'grid': return '<div class="grid">' + b.v.map(function (r) {
        return '<div class="gc"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>';
      }).join('') + '</div>';
      case 'flow': return '<div class="flow">' + b.v.map(function (s, n) {
        return (n ? '<em>→</em>' : '') + '<i>' + esc(s) + '</i>';
      }).join('') + '</div>';
      case 'roster': return '<div class="roster">' + b.v.map(function (r) {
        return '<div class="rs" style="--rc:' + esc(r[1]) + '"><div><b>' + esc(r[0]) +
          '</b><div class="role">' + esc(r[2]) + '</div></div><div class="d">' + esc(r[3]) + '</div></div>';
      }).join('') + '</div>';
      case 'controls': return '<div class="controls">' + b.v.map(function (r) {
        return '<div class="kc"><b>' + esc(r[0]) + '</b><kbd>' + esc(r[1]) + '</kbd></div>';
      }).join('') + '</div>';
      case 'steps': return '<div class="steps">' + b.v.map(function (r) {
        return '<div class="st"><div><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div></div>';
      }).join('') + '</div>';
      default: return '';
    }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function draw() {
    var p = P[i];
    document.documentElement.style.setProperty('--accent', p.accent);
    plate.innerHTML =
      '<div class="pnum">CHAPTER ' + pad(i + 1) + ' — ' + esc(p.tab) + '</div>' +
      '<h1 class="ptitle">' + esc(p.title) + '</h1>' +
      '<p class="plede">' + esc(p.lede) + '</p>' +
      '<div class="pbody">' + p.blocks.map(block).join('') + '</div>';
    pgi.textContent = pad(i + 1) + ' / ' + pad(P.length);
    rail.querySelectorAll('.ch').forEach(function (b, n) { b.classList.toggle('on', n === i); });
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === P.length - 1;
    try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
  }

  /* the plate physically turns before the new page is drawn */
  function go(n, dir) {
    if (n < 0 || n >= P.length || n === i) return;
    turnSound();
    if (reduced) { i = n; draw(); return; }
    plate.style.transformOrigin = dir < 0 ? 'right center' : 'left center';
    plate.classList.add('turn');
    setTimeout(function () {
      i = n; draw();
      plate.classList.remove('turn');
      plate.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, reduced ? 0 : 220);
  }

  P.forEach(function (p, n) {
    var b = document.createElement('button');
    b.className = 'ch'; b.type = 'button';
    b.style.setProperty('--ac', p.accent);
    b.innerHTML = '<span class="cur">▸</span>' + p.tab + '<span class="n">' + pad(n + 1) + '</span>';
    b.addEventListener('click', function () { go(n, n > i ? 1 : -1); });
    rail.appendChild(b);
  });

  document.getElementById('prev').addEventListener('click', function () { go(i - 1, -1); });
  document.getElementById('next').addEventListener('click', function () { go(i + 1, 1); });

  /* d-pad */
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(i + 1, 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(i - 1, -1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0, -1); }
    else if (e.key === 'End') { e.preventDefault(); go(P.length - 1, 1); }
  });

  /* swipe — the phone's d-pad. Horizontal only, so vertical reading scrolls. */
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tracking) return; tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    go(dx < 0 ? i + 1 : i - 1, dx < 0 ? 1 : -1);
  }, { passive: true });

  var want = (location.hash || '').replace('#', '');
  var found = P.findIndex(function (p) { return p.id === want; });
  if (found >= 0) i = found;
  draw();
})();
</script>
</body>
</html>
