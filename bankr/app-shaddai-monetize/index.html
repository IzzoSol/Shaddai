<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADDAI · Monetize</title>
<style>
:root{--bg:#06080b;--sf:#0d1117;--sf2:#141b24;--bd:#1e2a36;--tx:#e6edf3;--tx2:#7d8da0;--em:#00e5a0;--gd:#e8c45c;--cy:#39d0ff;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Chakra Petch',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;min-height:100vh}
h1{font-size:17px;letter-spacing:1px;color:var(--gd)}h1 b{color:var(--em)}
.sub{color:var(--tx2);font-size:12px;margin:4px 0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:9px 11px;font:inherit;font-size:13px;outline:none}
input:focus{border-color:var(--em)}
.btn{background:var(--em);color:#04120b;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card.on{border-color:var(--em);box-shadow:0 0 12px rgba(0,229,160,.15)}
.nm{font-weight:700;font-size:14px}.meta{color:var(--tx2);font-size:11px;margin:2px 0 10px}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--sf2);color:var(--tx2)}
.pill.live{background:rgba(0,229,160,.16);color:var(--em)}
.priced{display:flex;gap:6px;align-items:center;margin:8px 0}.priced input{width:74px}
.invoke{background:#0a0e14;border:1px solid var(--bd);border-radius:8px;padding:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cy);word-break:break-all;margin-top:8px}
.note{color:var(--tx2);font-size:12px;padding:14px;text-align:center}
.err{color:#ff6b6b;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>◆ SHADDAI · <b>Monetize</b></h1>
<div class="sub">Publish any forged operative as a paid x402 endpoint. Every call earns USDC on Base.</div>
<div class="row">
  <input id="owner" placeholder="Your account id (shd_userid)" style="flex:1;min-width:180px">
  <button class="btn" id="loadBtn" onclick="load()">Load my agents</button>
</div>
<div id="out" class="grid"></div>
<div id="msg"></div>

<script>
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
async function invoke(name,args){
  if(!(window.bankr&&bankr.invokeScript)){ throw new Error('Run this inside Bankr (bankr.invokeScript unavailable).'); }
  return await bankr.invokeScript(name,args||{});
}
async function load(){
  const owner=document.getElementById('owner').value.trim();
  const out=document.getElementById('out'), msg=document.getElementById('msg'); msg.innerHTML='';
  out.innerHTML='<div class="note">Loading…</div>';
  try{
    const r=await invoke('list-operatives',{owner});
    if(!r||!r.ok){ out.innerHTML=''; msg.innerHTML='<div class="err">'+esc((r&&r.error)||'Failed to load')+'</div>'; return; }
    if(!r.operatives.length){ out.innerHTML='<div class="note">No forged agents found for that id. Forge one in SHADDAI first.</div>'; return; }
    out.innerHTML='';
    r.operatives.forEach(function(o){ out.appendChild(card(o)); });
  }catch(e){ out.innerHTML=''; msg.innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}
function card(o){
  const d=document.createElement('div'); d.className='card'+(o.published?' on':'');
  d.innerHTML=
    '<div class="nm">'+esc(o.codename||'Agent')+'</div>'+
    '<div class="meta">'+esc(o.archetype||'operative')+' · '+esc(o.rarity||'common')+'</div>'+
    '<span class="pill'+(o.published?' live':'')+'">'+(o.published?'● Live · $'+o.price+'/call':'○ Not published')+'</span>'+
    '<div class="priced"><span style="font-size:12px;color:var(--tx2)">USDC/call</span><input type="number" step="0.01" min="0" value="'+(o.price||0.02)+'"></div>'+
    '<button class="btn'+(o.published?' ghost':'')+'" style="width:100%">'+(o.published?'Unpublish':'Publish as x402 →')+'</button>'+
    '<div class="invoke" style="display:none"></div>';
  const priceEl=d.querySelector('input'), btn=d.querySelector('button'), inv=d.querySelector('.invoke');
  btn.onclick=async function(){
    btn.disabled=true; const publish=!o.published;
    try{
      const r=await invoke('publish-agent',{codename:o.codename, price:parseFloat(priceEl.value)||0.02, publish:publish});
      if(r&&r.ok){ o.published=r.published; o.price=r.price;
        d.className='card'+(o.published?' on':'');
        d.querySelector('.pill').className='pill'+(o.published?' live':''); d.querySelector('.pill').textContent=o.published?('● Live · $'+o.price+'/call'):'○ Not published';
        btn.className='btn'+(o.published?' ghost':''); btn.textContent=o.published?'Unpublish':'Publish as x402 →';
        if(o.published&&r.invoke){ inv.style.display='block'; inv.textContent=r.invoke.example||(r.invoke.url+'?agent='+o.codename+'&task=...'); }
        else inv.style.display='none';
      }
    }catch(e){ /* ignore */ }
    btn.disabled=false;
  };
  return d;
}
// Prefill owner if Bankr exposes the account
try{ if(window.bankr&&bankr.account){ document.getElementById('owner').value=bankr.account; } }catch(e){}
</script>
</body>
</html>
