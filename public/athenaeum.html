<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>The Athenaeum — The Halls of the Seven · SHADDAI</title>
<meta name="description" content="Seven halls, one for each agent, around a central arcade. Turn the hall, pick a building, walk in."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --void:#06080b; --panel:#0b1016; --card:#0e141b; --edge:rgba(120,150,140,.18); --edge2:rgba(120,150,140,.34);
  --ink:#e9efe9; --soft:#93a49b; --faint:#5d6b65; --emerald:#00ff9c; --gold:#e8c45c; --ac:#00ff9c; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--emerald);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,28px);border-bottom:1px solid var(--edge);background:rgba(6,8,11,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.top h1{font:900 17px 'Cinzel',serif;letter-spacing:.16em}
.top h1 b{color:var(--gold)}
.top nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.top nav a{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);border:1px solid var(--edge);border-radius:5px;padding:8px 12px}
.top nav a:hover{color:var(--emerald);border-color:var(--emerald)}

.main{max-width:1280px;margin:0 auto;padding:clamp(12px,2vw,24px);display:grid;gap:clamp(12px,2vw,22px);grid-template-columns:1fr minmax(300px,380px);align-items:start}
@media(max-width:940px){.main{grid-template-columns:1fr}}

/* 3D stage */
.stage{position:relative;height:clamp(340px,64vh,640px);background:radial-gradient(120% 90% at 50% 30%,#0d151c 0%,#06080b 72%);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage .hint{position:absolute;left:14px;bottom:12px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);pointer-events:none}
.stage .tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--c);
  text-shadow:0 0 10px #000,0 0 3px #000;white-space:nowrap;transition:opacity .2s}
.stage .tag.sel{color:#fff}

/* panel */
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden;border-top:2px solid var(--ac)}
.panel .ph{height:170px;background-size:cover;background-position:50% 22%;position:relative}
.panel .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--panel))}
.panel .body{padding:4px 18px 18px}
.panel .k{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ac)}
.panel h2{font:900 24px 'Cinzel',serif;letter-spacing:.06em;margin:6px 0 6px}
.panel p{font-size:14px;line-height:1.6;color:var(--soft)}
.acts{display:grid;gap:8px;margin-top:16px}
.acts a{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--edge2);border-radius:7px;font-size:13.5px;font-weight:500}
.acts a small{font:500 10px 'IBM Plex Mono',monospace;color:var(--faint);letter-spacing:.08em}
.acts a:hover{border-color:var(--ac);color:var(--ac)}
.acts a.pri{background:var(--ac);color:#04120c;border-color:transparent;font-weight:600}
.acts a.pri small{color:rgba(4,18,12,.65)}
.acts .soon{opacity:.5;pointer-events:none}

/* hall chips (always-works nav, also the no-WebGL fallback) */
.chips{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--edge);border-radius:8px;background:var(--card);text-align:left}
.chip i{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:50% 20%;flex:0 0 auto;border:2px solid var(--c)}
.chip b{display:block;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.08em}
.chip span{font-size:11.5px;color:var(--faint)}
.chip:hover,.chip[aria-pressed=true]{border-color:var(--c)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>THE <b>ATHENAEUM</b></h1>
  <nav><a href="/enter.html">Doors</a><a href="/dashboard">Dashboard</a><a href="/SHADDAI-WORLD-3D.html">Enter the world</a></nav>
</header>

<div class="main">
  <div class="stage" id="stage"><div class="hint" id="hint">drag to turn · click a hall</div></div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="ph" id="pPhoto"></div>
    <div class="body">
      <div class="k" id="pKind"></div>
      <h2 id="pName"></h2>
      <p id="pDesc"></p>
      <div class="acts" id="pActs"></div>
    </div>
  </aside>

  <div class="chips" id="chips" role="group" aria-label="Halls"></div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script>
/* One entry per hall. 2D = the live page. world = a ?room= the 3D world already understands; absent means no walk-in yet. */
var HALLS = [
  {id:'SHADDAI', hall:'The Throne Hall',     col:'#c9a6ff', kind:'SHADDAI · orchestrator', img:'/assets/agents/SHADDAI-council.png',
   desc:'Where the council meets. Meet the seven, see what each one owns, and set the direction.',
   links:[{t:'Meet the Seven',s:'agents',h:'/agents.html',pri:1}]},
  {id:'NEXUS',   hall:'The Forge',           col:'#5bc8d4', kind:'NEXUS · architect', img:'/assets/banners/nexus.jpg',
   desc:'Build and import agents, wire their skills and tools, and put them to work in your office.',
   links:[{t:'Forge an agent',s:'sign in',h:'/agent-forge.html',pri:1},{t:'Skills & items forge',s:'forge',h:'/forge.html'}]},
  {id:'ZEROX',   hall:'The Exchange',        col:'#b87fdf', kind:'ZEROX · revenue', img:'/assets/agents/ZEROX-council.png',
   desc:'Live signals, markets and the trading terminal. Calls are rug-filtered and tracked.',
   links:[{t:'Open the terminal',s:'PIN 4444',h:'/simple-signals.html',pri:1}]},
  {id:'ORACLE',  hall:'The Observatory',     col:'#f0d080', kind:'ORACLE · research', img:'/assets/agents/ORACLE-council.png',
   desc:'Research, foresight and pattern-finding under the open sky.',
   links:[{t:'Astral Observatory',s:'2D',h:'/oracle-sky.html',pri:1},{t:'See it in the world',s:'3D flyover',h:'/SHADDAI-WORLD-3D.html?room=observatory'}]},
  {id:'TURTLE',  hall:'The Studio & Museum', col:'#4dd4a0', kind:'TURTLE · creative', img:'/assets/bazaar/music.png',
   desc:'Art, design, sound. Compose a track, make images and video, and browse the gallery.',
   links:[{t:'Creative Studio',s:'create',h:'/creative-studio.html',pri:1},{t:'Music studio',s:'compose',h:'/turtle-music-bot.html'},{t:'Museum',s:'2D',h:'/museum.html'},{t:'See it in the world',s:'3D flyover',h:'/SHADDAI-WORLD-3D.html?room=museum'}]},
  {id:'QUILL',   hall:'The Library',         col:'#e87f7f', kind:'QUILL · writing', img:'/assets/agents/QUILL-council.png',
   desc:'Your knowledge and notes, searchable, with the council’s studied sources behind them.',
   links:[{t:'Open the Library',s:'2D',h:'/library.html',pri:1},{t:'Ask the Brain',s:'PIN 4444',h:'/rag#QUILL'},{t:'See it in the world',s:'3D flyover',h:'/SHADDAI-WORLD-3D.html?room=library'}]},
  {id:'PIKADON', hall:'The Watch',           col:'#f0a060', kind:'PIKADON · security', img:'/assets/agents/PIKADON-action.png',
   desc:'Audit trails, permissions and risk checks. Nothing ships unreviewed.',
   links:[{t:'Open Security',s:'dashboard',h:'/dashboard#security',pri:1}]},
  {id:'ARCADE',  hall:'The Arcade',          col:'#00ff9c', kind:'Commons · play', img:'/assets/games/covers/hoops.svg', center:true,
   desc:'Eight SHADDAI games. Play solo, with your bots, or against other people.',
   links:[{t:'Play now',s:'8 games',h:'/arcade.html',pri:1},{t:'Arcade in the world',s:'building soon',h:'#',soon:1}]}
];
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sel=null;

function show(id){
  sel=HALLS.filter(function(h){return h.id===id})[0]||HALLS[0];
  document.documentElement.style.setProperty('--ac',sel.col);
  $('pPhoto').style.backgroundImage="url('"+sel.img+"')";
  $('pKind').textContent=sel.kind; $('pName').textContent=sel.hall; $('pDesc').textContent=sel.desc;
  $('pActs').innerHTML=sel.links.map(function(l){return '<a class="'+(l.pri?'pri ':'')+(l.soon?'soon':'')+'" href="'+esc(l.h)+'"><span>'+esc(l.t)+'</span><small>'+esc(l.s)+'</small></a>'}).join('');
  [].forEach.call($('chips').children,function(c){c.setAttribute('aria-pressed',c.dataset.id===sel.id?'true':'false')});
  if(window.__focus) window.__focus(sel.id);
  try{history.replaceState(null,'','#'+sel.id)}catch(e){}
}
HALLS.forEach(function(h){
  var b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.id=h.id; b.style.setProperty('--c',h.col); b.setAttribute('aria-pressed','false');
  b.innerHTML='<i style="background-image:url(\''+h.img+'\')"></i><div><b>'+esc(h.id==='ARCADE'?'ARCADE':h.id)+'</b><span>'+esc(h.hall)+'</span></div>';
  b.addEventListener('click',function(){show(h.id)}); $('chips').appendChild(b);
});
var start=(location.hash||'').replace('#','').toUpperCase();
show(HALLS.some(function(h){return h.id===start})?start:'SHADDAI');
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
try{
  const stage=document.getElementById('stage');
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,1.75)); stage.insertBefore(r.domElement,stage.firstChild);
  const sc=new THREE.Scene(); sc.fog=new THREE.FogExp2(0x06080b,.032);
  const cam=new THREE.PerspectiveCamera(36,1,.1,200); cam.position.set(0,9.5,16.5);
  sc.add(new THREE.HemisphereLight(0x99bbcc,0x0a1014,.9));
  const key=new THREE.DirectionalLight(0xffffff,.9); key.position.set(6,12,8); sc.add(key);
  const ctl=new OrbitControls(cam,r.domElement); ctl.enablePan=false; ctl.enableDamping=true; ctl.minDistance=9; ctl.maxDistance=28;
  ctl.maxPolarAngle=Math.PI*.47; ctl.autoRotate=true; ctl.autoRotateSpeed=.5; ctl.target.set(0,1.2,0);

  // plinth + ground grid
  const plinth=new THREE.Mesh(new THREE.CylinderGeometry(11.5,12.2,.5,64),new THREE.MeshStandardMaterial({color:0x0b1219,roughness:.9}));
  plinth.position.y=-.25; sc.add(plinth);
  const ring=new THREE.Mesh(new THREE.RingGeometry(11.1,11.5,96),new THREE.MeshBasicMaterial({color:0xe8c45c,transparent:true,opacity:.7,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.02; sc.add(ring);
  const grid=new THREE.GridHelper(80,40,0x12301f,0x0e1b17); grid.position.y=-.52; sc.add(grid);

  const mat=(c)=>new THREE.MeshStandardMaterial({color:0x101821,roughness:.55,metalness:.3,emissive:new THREE.Color(c),emissiveIntensity:.06});
  const edges=(m,c)=>{ const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.9})); m.add(l); return m; };
  const part=(g,c,x,y,z)=>{ const m=edges(new THREE.Mesh(g,mat(c)),c); m.position.set(x,y,z); return m; };
  const B=THREE.BoxGeometry, C=THREE.CylinderGeometry, S=THREE.SphereGeometry;
  const builders={
    SHADDAI:(c,g)=>{ g.add(part(new C(1.9,2.1,1.6,32),c,0,.8,0)); g.add(part(new S(1.8,32,16,0,Math.PI*2,0,Math.PI/2),c,0,1.6,0)); g.add(part(new C(.12,.12,1.6,8),c,0,3.5,0)); },
    NEXUS:(c,g)=>{ g.add(part(new B(3,1.8,2.4),c,0,.9,0)); g.add(part(new C(.35,.45,2.6,12),c,.9,3,.5)); g.add(part(new B(1.2,1,1.2),c,-.8,2.3,0)); },
    ZEROX:(c,g)=>{ [0,1,2].forEach(i=>g.add(part(new B(3.2-i*.9,.9,3.2-i*.9),c,0,.45+i*.9,0))); g.add(part(new C(.02,.02,1.5,6),c,0,3.5,0)); },
    ORACLE:(c,g)=>{ g.add(part(new C(1.5,1.7,2,32),c,0,1,0)); g.add(part(new S(1.5,32,16,0,Math.PI*2,0,Math.PI/2),c,0,2,0)); g.add(part(new B(.25,1.2,.25),c,0,3.3,0)); },
    TURTLE:(c,g)=>{ const s=part(new S(2,32,16,0,Math.PI*2,0,Math.PI/2),c,0,0,0); s.scale.y=.7; g.add(s); [-1,0,1].forEach(i=>g.add(part(new B(.5,1.1,.5),c,i*1.2,.55,2))); },
    QUILL:(c,g)=>{ g.add(part(new B(3.2,1.6,2.4),c,0,.8,0)); const roof=part(new C(0,2,1.6,4),c,0,2.4,0); roof.rotation.y=Math.PI/4; roof.scale.set(1.1,1,.82); g.add(roof); [-1.2,-.4,.4,1.2].forEach(x=>g.add(part(new C(.14,.14,1.6,8),c,x,.8,1.35))); },
    PIKADON:(c,g)=>{ g.add(part(new B(2.6,2.4,2.6),c,0,1.2,0)); const t=part(new THREE.TorusGeometry(.9,.1,8,32),c,0,1.3,1.35); g.add(t); },
    ARCADE:(c,g)=>{ g.add(part(new B(1.6,3.2,1.2),c,0,1.6,0)); g.add(part(new B(1.3,.9,.1),0x00ff9c,0,2.3,.62)); g.add(part(new B(1.8,.4,1.4),c,0,.2,0)); const rg=part(new THREE.TorusGeometry(2.2,.05,6,64),c,0,.1,0); rg.rotation.x=Math.PI/2; g.add(rg); }
  };
  const groups={}, pickables=[], tags={};
  HALLS.forEach((h,i)=>{
    const g=new THREE.Group(); const c=new THREE.Color(h.col);
    builders[h.id](c,g);
    const k=HALLS.filter(x=>!x.center).indexOf(h);
    if(h.center){ g.position.set(0,0,0); g.scale.setScalar(1.1); }
    else { const a=k/7*Math.PI*2-Math.PI/2; g.position.set(Math.cos(a)*7.4,0,Math.sin(a)*7.4); g.rotation.y=-a+Math.PI/2; }
    g.userData.id=h.id; g.traverse(o=>{ if(o.isMesh) o.userData.hall=h.id; });
    sc.add(g); groups[h.id]=g; pickables.push(g);
    const d=document.createElement('div'); d.className='tag'; d.style.setProperty('--c',h.col); d.textContent=h.id; stage.appendChild(d); tags[h.id]=d;
  });

  const ray=new THREE.Raycaster(), mp=new THREE.Vector2(); let down=null;
  r.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]; ctl.autoRotate=false;});
  r.domElement.addEventListener('pointerup',e=>{
    if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return;
    const b=r.domElement.getBoundingClientRect(); mp.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);
    ray.setFromCamera(mp,cam); const hit=ray.intersectObjects(pickables,true)[0];
    if(hit){ let o=hit.object; while(o&&!o.userData.id) o=o.parent; if(o) window.show(o.userData.id); }
  });

  // focus: glow the chosen hall, ease the camera target toward it
  let tgt=new THREE.Vector3(0,1.2,0);
  window.__focus=(id)=>{ Object.keys(groups).forEach(k=>groups[k].traverse(o=>{ if(o.isMesh&&o.material.emissiveIntensity!==undefined) o.material.emissiveIntensity=(k===id?.55:.06); }));
    Object.keys(tags).forEach(k=>tags[k].classList.toggle('sel',k===id));
    const p=groups[id].position; tgt.set(p.x*.45,1.2,p.z*.45); };
  if(window.sel) window.__focus(window.sel.id);

  const resize=()=>{ const w=stage.clientWidth,h=stage.clientHeight; r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
  let vis=true; new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(stage);
  const v=new THREE.Vector3();
  (function loop(){ requestAnimationFrame(loop); if(!vis) return;
    ctl.target.lerp(tgt,.06); ctl.update(); r.render(sc,cam);
    const w=stage.clientWidth,h=stage.clientHeight;
    for(const k in groups){ v.copy(groups[k].position); v.y=4.3; v.project(cam); const t=tags[k]; t.style.left=((v.x+1)/2*w)+'px'; t.style.top=((1-v.y)/2*h)+'px'; t.style.opacity=v.z<1?1:0; }
  })();
}catch(e){
  const s=document.getElementById('stage'); s.style.display='none'; document.querySelector('.main').style.gridTemplateColumns='1fr';
}
</script>
<script>window.show=show;</script>
</body>
</html>
