<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00e5a0;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#020817"/>
  
  <!-- Outer ring - neural network connections -->
  <g opacity="0.3">
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#neuralGrad)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neuralGrad)" stroke-width="0.5" stroke-dasharray="2 6"/>
  </g>
  
  <!-- Infinity symbol - main shape -->
  <g filter="url(#glow)">
    <path d="M160,256 C160,180 200,140 256,140 C312,140 352,180 352,256 C352,332 312,372 256,372 C200,372 160,332 160,256" 
          fill="none" stroke="url(#neuralGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M160,256 C160,332 200,372 256,372 C312,372 352,332 352,256 C352,180 312,140 256,140 C200,140 160,180 160,256" 
          fill="none" stroke="url(#neuralGrad)" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Neural nodes at key points -->
  <g filter="url(#neonGlow)">
    <!-- Left lobe center -->
    <circle cx="160" cy="256" r="20" fill="#00e5a0"/>
    <circle cx="160" cy="256" r="12" fill="#020817"/>
    <circle cx="160" cy="256" r="6" fill="#00e5a0"/>
    
    <!-- Right lobe center -->
    <circle cx="352" cy="256" r="20" fill="#00e5a0"/>
    <circle cx="352" cy="256" r="12" fill="#020817"/>
    <circle cx="352" cy="256" r="6" fill="#00e5a0"/>
    
    <!-- Center intersection -->
    <circle cx="256" cy="256" r="25" fill="#00c8ff"/>
    <circle cx="256" cy="256" r="15" fill="#020817"/>
    <circle cx="256" cy="256" r="8" fill="#00c8ff"/>
  </g>
  
  <!-- Outer neural nodes - 7 agents -->
  <g>
    <!-- Top -->
    <circle cx="256" cy="80" r="8" fill="#00e5a0" opacity="0.8"/>
    <!-- Top right -->
    <circle cx="377" cy="129" r="8" fill="#00c8ff" opacity="0.8"/>
    <!-- Right -->
    <circle cx="432" cy="256" r="8" fill="#8b5cf6" opacity="0.8"/>
    <!-- Bottom right -->
    <circle cx="377" cy="383" r="8" fill="#00e5a0" opacity="0.8"/>
    <!-- Bottom -->
    <circle cx="256" cy="432" r="8" fill="#00c8ff" opacity="0.8"/>
    <!-- Bottom left -->
    <circle cx="135" cy="383" r="8" fill="#8b5cf6" opacity="0.8"/>
    <!-- Left -->
    <circle cx="80" cy="256" r="8" fill="#00e5a0" opacity="0.8"/>
  </g>
  
  <!-- Neural connection lines to outer nodes -->
  <g stroke="#00e5a0" stroke-width="1" opacity="0.4">
    <line x1="256" y1="256" x2="256" y2="80"/>
    <line x1="256" y1="256" x2="377" y2="129"/>
    <line x1="256" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="256" x2="377" y2="383"/>
    <line x1="256" y1="256" x2="256" y2="432"/>
    <line x1="256" y1="256" x2="135" y2="383"/>
    <line x1="256" y1="256" x2="80" y2="256"/>
  </g>
  
  <!-- Orbital rings -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#00e5a0" stroke-width="1" opacity="0.3" transform="rotate(-20 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#00c8ff" stroke-width="1" opacity="0.2" transform="rotate(20 256 256)"/>
  
  <!-- Subtle particle effects -->
  <g fill="#00e5a0" opacity="0.6">
    <circle cx="100" cy="150" r="2"/>
    <circle cx="412" cy="362" r="2"/>
    <circle cx="90" cy="350" r="1.5"/>
    <circle cx="422" cy="140" r="1.5"/>
    <circle cx="200" cy="80" r="1"/>
    <circle cx="312" cy="432" r="1"/>
  </g>
  
  <!-- SHADDAI text -->
  <text x="256" y="485" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#00e5a0" letter-spacing="8">SHADDAI</text>
</svg>