<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Start — SHADDAI</title>
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --ink:#f5f6f8; --muted:#9aa0aa; --accent:#00e5ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, sans-serif; display:flex; flex-direction:column; }
  header { padding: 16px 20px; text-align:center; border-bottom: 1px solid rgba(255,255,255,0.08); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { margin:0; font-size: 18px; }
  header .sub { color:var(--muted); font-size:12px; margin-top:4px; }
  main { flex:1; max-width: 560px; width:100%; margin: 0 auto; padding: 20px 16px 60px; display:flex; flex-direction:column; }
  .card { background: var(--panel); border-radius: 16px; padding: 22px; }

  .search { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:#0d0d10; color:var(--ink); font-size:16px; margin-bottom:12px; }
  .cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
  .cat { flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:transparent; color:var(--muted); font-size:14px; cursor:pointer; white-space:nowrap; }
  .cat.active { background:var(--accent); color:#001318; border-color:var(--accent); font-weight:600; }

  .picker-grid { display:grid; gap: 10px; }
  .picker-item { background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; text-align:left; color:var(--ink); font-size: 16px; cursor:pointer; display:flex; gap:12px; align-items:center; width:100%; }
  .picker-item:active { transform: scale(0.98); }
  .picker-item .icon { font-size: 26px; flex:0 0 auto; }
  .picker-item .meta { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .picker-item .desc { color: var(--muted); font-size: 13px; }
  .empty { color:var(--muted); text-align:center; padding:30px 0; }

  .agent-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .agent-item { background:#0d0d10; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px; cursor:pointer; text-align:left; color:var(--ink); display:flex; gap:10px; align-items:center; }
  .agent-item .aemoji { font-size:22px; }
  .agent-item .aname { font-weight:700; font-size:14px; }
  .agent-item .arole { color:var(--muted); font-size:11px; }
  .agent-item.forged { border-style:dashed; }

  .progress { display:flex; gap:6px; justify-content:center; margin-bottom: 18px; }
  .progress .dot { width:8px; height:8px; border-radius:50%; background: rgba(255,255,255,0.15); }
  .progress .dot.active { background: var(--accent); }
  .whobar { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:14px; }
  .prompt { font-size: 18px; font-weight:600; margin-bottom: 14px; }
  input[type=text], input[type=email], textarea, select {
    width:100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: #0d0d10; color: var(--ink); font-size: 16px; margin-bottom: 18px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .btn-row { display:flex; gap:10px; }
  button { flex:1; padding: 14px; border-radius: 10px; border:none; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-next { background: var(--accent); color:#001318; }
  .btn-back { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.15); }
  .spinner { text-align:center; padding: 40px 0; color: var(--muted); }
  .result-frame { width:100%; height: 46vh; border:none; border-radius: 12px; background:#fff; margin-bottom:14px; }
  .result-url { display:block; text-align:center; color: var(--accent); word-break: break-all; margin-bottom: 14px; }
  .result-text { white-space: pre-wrap; background:#0d0d10; border-radius:10px; padding:16px; font-size:14px; max-height:52vh; overflow:auto; margin-bottom:14px; line-height:1.55; }
</style>
</head>
<body>
<header>
  <h1>⚡ Quick Start</h1>
  <div class="sub">Pick a job. Pick an agent. Answer a few questions.</div>
</header>
<main id="app"><div class="spinner">Loading…</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// Identify the caller so the server can scope generated work per owner and enforce its
// login gate. Same public web config as the dashboard (Firebase web keys are not secret).
// If Firebase is blocked or the visitor is signed out we simply send no token — the
// server decides whether that is allowed via REQUIRE_AUTH.
window.SHD_AUTH = { token: null, uid: null };
try {
  if (window.firebase && firebase.initializeApp) {
    firebase.initializeApp({ apiKey: "AIzaSyB9QzPlI9AiAnisSO-jK-UUJ-ZwtmHlzjw", authDomain: "shaddai999.firebaseapp.com", projectId: "shaddai999", storageBucket: "shaddai999.firebasestorage.app", messagingSenderId: "706335788411", appId: "1:706335788411:web:6b64d985f6b0c1bf8441de" });
    firebase.auth().onAuthStateChanged(async function (u) {
      window.SHD_AUTH.uid = u ? u.uid : null;
      window.SHD_AUTH.token = u ? await u.getIdToken().catch(function () { return null; }) : null;
    });
  }
} catch (e) { /* offline / blocked — stays anonymous */ }

function shdAuthHeaders() {
  const h = {};
  if (window.SHD_AUTH && window.SHD_AUTH.token) h['Authorization'] = 'Bearer ' + window.SHD_AUTH.token;
  let uid = (window.SHD_AUTH && window.SHD_AUTH.uid) || null;
  if (!uid) { try { uid = localStorage.getItem('shd_userid'); } catch (_) {} }
  if (uid) h['x-user-id'] = uid;
  return h;
}
</script>
<script>
(function () {
  const app = document.getElementById('app');
  let useCases = [], categories = [], agents = [];
  let cat = 'all', query = '';
  let current = null;   // selected use case
  let agent = null;     // selected agent
  let step = 0;
  let answers = {};

  function esc(s) {
    return String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Theme the whole page to the acting agent, so the choice is visible, not just stored.
  function applyAccent(hex) {
    if (/^#[0-9a-fA-F]{6}$/.test(String(hex || ''))) {
      document.documentElement.style.setProperty('--accent', hex);
    }
  }

  async function loadCatalog() {
    try {
      const [ucRes, agRes] = await Promise.all([
        fetch('/api/quickstart/usecases', { headers: shdAuthHeaders() }),
        fetch('/api/quickstart/agents', { headers: shdAuthHeaders() }),
      ]);
      // In a locked-down deployment even the catalog sits behind the login gate, so a
      // signed-out visitor must be sent to sign in rather than left on a dead "Loading…".
      if (ucRes.status === 401 || agRes.status === 401) return renderSignInPrompt();
      const uc = await ucRes.json();
      const ag = await agRes.json();
      useCases = (uc && uc.useCases) || [];
      categories = (uc && uc.categories) || [];
      agents = (ag && ag.agents) || [];
      renderPicker();
    } catch (e) {
      app.innerHTML = `<div class="card"><div class="prompt">Couldn't load</div>
        <p style="color:#9aa0aa">${esc(e.message)}</p>
        <div class="btn-row"><button class="btn-next" id="reloadBtn">Try Again</button></div></div>`;
      document.getElementById('reloadBtn').addEventListener('click', loadCatalog);
    }
  }

  function visibleUseCases() {
    const q = query.trim().toLowerCase();
    return useCases.filter((u) => {
      if (cat !== 'all' && u.category !== cat) return false;
      if (!q) return true;
      return (u.label + ' ' + (u.description || '')).toLowerCase().includes(q);
    });
  }

  function renderPicker() {
    current = null; agent = null; step = 0; answers = {};
    applyAccent('#00e5ff');
    const list = visibleUseCases();
    app.innerHTML = `
      <input class="search" id="searchBox" placeholder="Search ${useCases.length} things you can do…" value="${esc(query)}">
      <div class="cats">
        <button class="cat${cat === 'all' ? ' active' : ''}" data-cat="all">All</button>
        ${categories.map((c) => `<button class="cat${cat === c.id ? ' active' : ''}" data-cat="${esc(c.id)}">${esc(c.icon)} ${esc(c.label)}</button>`).join('')}
      </div>
      ${list.length ? `<div class="picker-grid">
        ${list.map((u) => `
          <button class="picker-item" data-id="${esc(u.id)}">
            <span class="icon">${esc(u.icon || '✨')}</span>
            <span class="meta">
              <strong>${esc(u.label)}</strong>
              <span class="desc">${esc(u.description || '')}</span>
            </span>
          </button>`).join('')}
      </div>` : `<div class="empty">Nothing matches "${esc(query)}"</div>`}
    `;

    const box = document.getElementById('searchBox');
    box.addEventListener('input', () => {
      query = box.value;
      const list2 = visibleUseCases();
      const grid = app.querySelector('.picker-grid');
      const empty = app.querySelector('.empty');
      // Re-render just the results so the search box keeps focus and the caret position.
      const html = list2.length ? list2.map((u) => `
          <button class="picker-item" data-id="${esc(u.id)}">
            <span class="icon">${esc(u.icon || '✨')}</span>
            <span class="meta"><strong>${esc(u.label)}</strong>
            <span class="desc">${esc(u.description || '')}</span></span>
          </button>`).join('') : '';
      if (grid) { grid.innerHTML = html; grid.style.display = list2.length ? '' : 'none'; }
      if (empty) empty.style.display = list2.length ? 'none' : '';
      if (!grid && list2.length) { renderPicker(); box.focus(); return; }
      bindPickerItems();
    });

    app.querySelectorAll('.cat').forEach((el) => {
      el.addEventListener('click', () => { cat = el.dataset.cat; renderPicker(); });
    });
    bindPickerItems();
  }

  function bindPickerItems() {
    app.querySelectorAll('.picker-item').forEach((el) => {
      el.addEventListener('click', () => {
        current = useCases.find((u) => u.id === el.dataset.id);
        if (current) renderAgentPicker();
      });
    });
  }

  // Who does the work. The agent is not a label — it supplies the voice the output is
  // written in and, for a website, the palette and accent it is built with.
  function renderAgentPicker() {
    const council = agents.filter((a) => !a.isCustom);
    const forged = agents.filter((a) => a.isCustom);
    app.innerHTML = `
      <div class="card">
        <div class="prompt">Who should build this?</div>
        <p style="color:#9aa0aa;margin-top:-8px;font-size:13px">Each agent works in their own voice and style.</p>
        <div class="agent-grid">
          ${council.map((a) => agentBtn(a)).join('')}
        </div>
        ${forged.length ? `<p style="color:#9aa0aa;font-size:12px;margin:18px 0 8px">Your forged agents</p>
        <div class="agent-grid">${forged.map((a) => agentBtn(a)).join('')}</div>` : ''}
        <div class="btn-row" style="margin-top:18px">
          <button class="btn-back" id="backBtn">Back</button>
        </div>
      </div>`;
    app.querySelectorAll('.agent-item').forEach((el) => {
      el.addEventListener('click', () => {
        agent = agents.find((a) => a.id === el.dataset.id) || null;
        if (agent) applyAccent(agent.accent);
        step = 0; answers = {};
        renderQuestion();
      });
    });
    document.getElementById('backBtn').addEventListener('click', renderPicker);
  }

  function agentBtn(a) {
    return `<button class="agent-item${a.isCustom ? ' forged' : ''}" data-id="${esc(a.id)}"
        style="border-left:3px solid ${/^#[0-9a-fA-F]{6}$/.test(a.accent) ? esc(a.accent) : '#00e5ff'}">
      <span class="aemoji">${esc(a.emoji || '🤖')}</span>
      <span><span class="aname">${esc(a.name)}</span><br><span class="arole">${esc(a.role || '')}</span></span>
    </button>`;
  }

  function renderProgress() {
    return `<div class="progress">${current.questions.map((_, i) =>
      `<span class="dot${i <= step ? ' active' : ''}"></span>`).join('')}</div>`;
  }

  function renderQuestion() {
    const q = current.questions[step];
    let field;
    if (q.type === 'textarea') {
      field = `<textarea id="qfield" placeholder="${esc(q.placeholder || '')}">${esc(answers[q.key] || '')}</textarea>`;
    } else if (q.type === 'select') {
      field = `<select id="qfield">${q.options.map((o) =>
        `<option value="${esc(o.value)}" ${answers[q.key] === o.value ? 'selected' : ''}>${esc(o.label)}</option>`
      ).join('')}</select>`;
    } else {
      field = `<input type="${q.type === 'email' ? 'email' : 'text'}" id="qfield" placeholder="${esc(q.placeholder || '')}" value="${esc(answers[q.key] || '')}">`;
    }
    app.innerHTML = `
      <div class="card">
        ${renderProgress()}
        <div class="whobar">${esc(agent.emoji || '')} ${esc(agent.name)} · ${esc(current.label)}</div>
        <div class="prompt">${esc(q.prompt)}</div>
        ${field}
        <div class="btn-row">
          <button class="btn-back" id="backBtn">${step === 0 ? 'Change agent' : 'Back'}</button>
          <button class="btn-next" id="nextBtn">${step === current.questions.length - 1 ? 'Go' : 'Next'}</button>
        </div>
      </div>`;
    const save = () => { const f = document.getElementById('qfield'); if (f) answers[q.key] = f.value; };
    document.getElementById('backBtn').addEventListener('click', () => {
      save();
      if (step === 0) { renderAgentPicker(); return; }
      step -= 1; renderQuestion();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      save();
      if (step === current.questions.length - 1) runUseCase();
      else { step += 1; renderQuestion(); }
    });
  }

  async function runUseCase() {
    app.innerHTML = `<div class="spinner">${esc(agent.emoji || '')} ${esc(agent.name)} is working on it…</div>`;
    try {
      const res = await fetch(`/api/quickstart/run/${encodeURIComponent(current.id)}`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, shdAuthHeaders()),
        body: JSON.stringify({ answers, agentId: agent.id }),
      });
      if (res.status === 401) return renderSignInPrompt();
      const data = await res.json();
      if (res.status === 429) throw new Error(data.error || 'Too many requests — give it a minute.');
      if (!data.ok) throw new Error(data.error || 'Something went wrong');
      renderResult(data);
    } catch (e) {
      app.innerHTML = `<div class="card"><div class="prompt">That didn't work</div><p style="color:#9aa0aa">${esc(e.message)}</p>
        <div class="btn-row">
          <button class="btn-back" id="startOverBtn">Start Over</button>
          <button class="btn-next" id="retryBtn">Try Again</button>
        </div></div>`;
      document.getElementById('startOverBtn').addEventListener('click', renderPicker);
      document.getElementById('retryBtn').addEventListener('click', runUseCase);
    }
  }

  // The server refused because nobody is signed in. Keep the answers in memory so
  // signing in and coming back doesn't cost the visitor their typing.
  function renderSignInPrompt() {
    app.innerHTML = `
      <div class="card">
        <div class="prompt">Sign in to finish</div>
        <p style="color:#9aa0aa">Your answers are saved on this screen. Sign in, then hit Try Again.</p>
        <div class="btn-row">
          <button class="btn-back" id="qsSignIn">Sign In</button>
          <button class="btn-next" id="qsRetry">Try Again</button>
        </div>
      </div>`;
    document.getElementById('qsSignIn').addEventListener('click', () => { location.href = '/index.html'; });
    // Retry whatever we were blocked on: the catalog load, or the run itself.
    document.getElementById('qsRetry').addEventListener('click', () => {
      if (current && agent) runUseCase(); else loadCatalog();
    });
  }

  function renderResult(data) {
    const who = data.agent ? `${esc(data.agent.emoji || '')} ${esc(data.agent.name)}` : '';
    let body = '';
    if (data.outputType === 'website') {
      body = `
        <iframe class="result-frame" srcdoc="${esc(data.previewHtml)}"></iframe>
        <a class="result-url" href="${esc(data.url)}" target="_blank">${esc(location.origin + data.url)}</a>`;
    } else {
      body = `<div class="result-text" id="resultText">${esc(data.content || '')}</div>`;
    }
    app.innerHTML = `
      <div class="card">
        <div class="prompt">🎉 Done${who ? ' — by ' + who : ''}</div>
        ${body}
        <div class="btn-row">
          ${data.outputType === 'text' ? '<button class="btn-back" id="copyBtn">Copy</button>' : ''}
          <button class="btn-next" id="againBtn">Make Another</button>
        </div>
      </div>`;
    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(data.content || '');
          copyBtn.textContent = 'Copied ✓';
        } catch (_) {
          // Clipboard is blocked (insecure context or denied) — select it so the
          // visitor can copy by hand rather than being told nothing.
          const node = document.getElementById('resultText');
          if (node) {
            const r = document.createRange(); r.selectNodeContents(node);
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          }
          copyBtn.textContent = 'Select + copy';
        }
      });
    }
    document.getElementById('againBtn').addEventListener('click', renderPicker);
  }

  loadCatalog();
})();
</script>
</body>
</html>
