<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hoverskate park preview</title><style>html,body{margin:0;background:#050814;overflow:hidden}#i{position:fixed;left:8px;top:6px;color:#7fe;font:12px monospace}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js"}}</script></head><body><div id="i">Hoverskate park · drag = orbit · wheel = zoom</div>
<script src="/world-race.js"></script><script src="/world-hoverpark.js"></script><script src="/world-hoverpark-v2.js?v=a"></script>
<script type="module">
import * as THREE from 'three';
const U=7/1.8,r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x070b1c);s.fog=new THREE.FogExp2(0x070b1c,0.0011);
s.add(new THREE.HemisphereLight(0x88aaff,0x203050,1.3));const d=new THREE.DirectionalLight(0xffe0b0,1.6);d.position.set(300,500,200);s.add(d);
const ground=new THREE.Mesh(new THREE.CircleGeometry(4000,48).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x0a1226,roughness:1}));ground.position.y=-3;s.add(ground);
const park=window.WorldHoverPark.build({THREE,scene:s,anchor:{x:0,z:0},heightAt:()=>0});
const gates=park.gates('forum-grand');window.__park=park;window.__gates=gates;
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,9000);let yaw=0.6,pitch=0.62,dist=1500,tx=0,tz=0;
const place=()=>{cam.position.set(tx+Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,tz+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(tx,0,tz);};place();
let drag=false,lx=0,ly=0;addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*0.006;pitch=Math.max(0.05,Math.min(1.5,pitch+(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY;place();});
addEventListener('wheel',e=>{dist=Math.max(150,Math.min(4000,dist*(1+e.deltaY*0.001)));place();},{passive:true});
window.__set=(y,p,dd,x,z)=>{yaw=y;pitch=p;dist=dd;tx=x||0;tz=z||0;place();};
const c=new THREE.Clock();(function loop(){requestAnimationFrame(loop);park.update(c.getDelta());r.render(s,cam);})();window.__ready=1;
</script></body></html>
