<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHADDAI World — Biome Props + Atmosphere Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.5 ui-monospace, monospace; color: #9fe9ff;
      background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(80,200,255,.3); pointer-events: none;
    }
  </style>
  <!-- load shared layout (classic script) BEFORE the module -->
  <script src="/world-layout.js"></script>
  <script src="/world-biomes.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">SHADDAI Biomes Test · drag to orbit · scroll to zoom<br>forest · arctic(water) · desert · void · grid</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060c);
    scene.fog = new THREE.Fog(0x04060c, 500, 1200);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 4000);
    camera.position.set(0, 520, 560);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    // lighting
    scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x202028, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(200, 400, 150);
    scene.add(sun);

    // simple flat reference ground (terrain module owns the real ground)
    const L = window.WORLD_LAYOUT;
    const groundGeo = new THREE.PlaneGeometry(L.half * 2, L.half * 2);
    groundGeo.rotateX(-Math.PI / 2);
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
      color: 0x0c1320, roughness: 1,
    }));
    ground.position.y = -0.2;
    scene.add(ground);

    // biome center markers (reference dots)
    for (const b of L.biomes) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(b.radius - 2, b.radius, 64),
        new THREE.MeshBasicMaterial({ color: b.color, side: THREE.DoubleSide, transparent: true, opacity: 0.25 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(b.center[0], 0.1, b.center[1]);
      scene.add(ring);
    }

    // ── the module under test ──
    const biomes = window.buildWorldBiomes(THREE, scene, L);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      biomes.update(t);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
