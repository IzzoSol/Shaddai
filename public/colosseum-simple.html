<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SHADDAI Stadium</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #0f0;
      font-family: monospace;
      overflow: hidden;
    }
    #canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #0f0;
      padding: 20px;
      z-index: 100;
      border-radius: 4px;
      width: 300px;
    }
    h2 { margin-bottom: 15px; font-size: 16px; }
    .btn {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: rgba(0,255,0,0.1);
      border: 1px solid #0f0;
      color: #0f0;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }
    .btn:hover { background: rgba(0,255,0,0.3); }
    .btn.active { background: #0f0; color: #000; }
    .info { font-size: 12px; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>⚔️ STADIUM</h2>
    <div class="info">
      <div>Field: 100×64m</div>
      <div>Height: 35m</div>
      <div>Seats: 40 rows</div>
    </div>
    <button class="btn active" onclick="setMode('sand')">Sand</button>
    <button class="btn" onclick="setMode('water')">Water</button>
    <button class="btn" onclick="setMode('naval')">Naval</button>
    <button class="btn" onclick="setMode('terrain')">Terrain</button>
    <div class="info" id="info">Ready...</div>
  </div>

  <script>
    console.log('Page HTML loaded');
    document.getElementById('info').textContent = 'Loading Three.js...';
  </script>

  <script async src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>

  <script>
    let scene, camera, renderer, boats = [];
    let currentMode = 'sand';

    function log(msg) {
      console.log(msg);
      const el = document.getElementById('info');
      if (el) el.textContent = msg;
    }

    function init() {
      log('Creating scene...');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e0c);
      scene.fog = new THREE.Fog(0x0a0e0c, 400, 1200);

      log('Creating camera...');
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 3000);
      camera.position.set(200, 100, 200);
      camera.lookAt(0, 30, 0);

      log('Creating renderer...');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      log('Building stadium...');
      buildStadium();

      log('Setting up controls...');
      setupControls();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      log('Starting animation...');
      animate();
    }

    function buildStadium() {
      // Materials
      const mat = {
        sand: new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 }),
        water: new THREE.MeshStandardMaterial({ color: 0x1a7fa0, roughness: 0.2, transparent: true, opacity: 0.8 }),
        seat: new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.8 }),
        stone: new THREE.MeshStandardMaterial({ color: 0xb8956a, roughness: 0.85 }),
        steel: new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5 }),
        marble: new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.3 })
      };

      // Sand floor
      let m = new THREE.Mesh(new THREE.PlaneGeometry(100, 64), mat.sand);
      m.name = 'sand';
      m.rotation.x = -Math.PI / 2;
      m.receiveShadow = true;
      scene.add(m);

      // Water floor
      m = new THREE.Mesh(new THREE.PlaneGeometry(100, 64), mat.water);
      m.name = 'water';
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.5;
      m.visible = false;
      scene.add(m);

      // Boats
      for (let i = 0; i < 2; i++) {
        let boat = new THREE.Group();

        let hull = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 15), mat.steel);
        hull.castShadow = true;
        boat.add(hull);

        let mast = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 14), mat.steel);
        mast.position.y = 9;
        boat.add(mast);

        let sail = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), mat.marble);
        sail.position.set(3, 7, 0);
        boat.add(sail);

        boat.position.set((i ? 45 : -45), 1.5, (i ? 35 : -35));
        boat.userData.phase = i * Math.PI;
        boat.userData.baseY = 1.5;
        boat.visible = false;
        scene.add(boat);
        boats.push(boat);
      }

      // Rocks
      for (let i = 0; i < 8; i++) {
        let rock = new THREE.Mesh(new THREE.IcosahedronGeometry(3.5, 2), mat.stone);
        let angle = (i / 8) * Math.PI * 2;
        rock.position.set(Math.cos(angle) * 45, 2.5, Math.sin(angle) * 45);
        rock.castShadow = true;
        rock.name = 'rock_' + i;
        scene.add(rock);
      }

      // Podium
      let podGeo = new THREE.LatheGeometry([
        new THREE.Vector2(50, 0),
        new THREE.Vector2(53, 0),
        new THREE.Vector2(53, 2),
        new THREE.Vector2(50, 2)
      ], 64);
      m = new THREE.Mesh(podGeo, mat.stone);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);

      // Lower bleachers (20 rows)
      for (let i = 0; i < 20; i++) {
        let r1 = 53 + i * 2.5;
        let r2 = 53 + (i + 1) * 2.5;
        let geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0),
          new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, 0.75),
          new THREE.Vector2(r1, 0.75)
        ], 64);
        m = new THREE.Mesh(geo, mat.seat);
        m.position.y = 2 + i * 0.75;
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
      }

      // Promenade
      let promGeo = new THREE.LatheGeometry([
        new THREE.Vector2(103, 0),
        new THREE.Vector2(107, 0),
        new THREE.Vector2(107, 1.5),
        new THREE.Vector2(103, 1.5)
      ], 64);
      m = new THREE.Mesh(promGeo, mat.stone);
      m.position.y = 18;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);

      // Upper bleachers (20 rows)
      for (let i = 0; i < 20; i++) {
        let r1 = 107 + i * 2.5;
        let r2 = 107 + (i + 1) * 2.5;
        let geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0),
          new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, 0.6),
          new THREE.Vector2(r1, 0.6)
        ], 64);
        m = new THREE.Mesh(geo, mat.seat);
        m.position.y = 18 + i * 0.6;
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
      }

      // Roof
      let roofGeo = new THREE.LatheGeometry([
        new THREE.Vector2(157, 0),
        new THREE.Vector2(167, 0),
        new THREE.Vector2(167, 35),
        new THREE.Vector2(157, 35)
      ], 64);
      m = new THREE.Mesh(roofGeo, mat.steel);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);

      // Pillars (32)
      for (let i = 0; i < 32; i++) {
        let angle = (i / 32) * Math.PI * 2;
        let x = Math.cos(angle) * 162;
        let z = Math.sin(angle) * 162;
        m = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 32, 12), mat.steel);
        m.position.set(x, 16, z);
        m.castShadow = true;
        scene.add(m);
      }

      // Lobby
      m = new THREE.Mesh(new THREE.PlaneGeometry(85, 45), mat.marble);
      m.rotation.x = -Math.PI / 2;
      m.position.set(0, 18, 210);
      m.receiveShadow = true;
      scene.add(m);

      // Walls
      m = new THREE.Mesh(new THREE.BoxGeometry(85, 32, 1), mat.stone);
      m.position.set(0, 16, 238);
      m.castShadow = true;
      scene.add(m);

      m = new THREE.Mesh(new THREE.BoxGeometry(1, 32, 45), mat.stone);
      m.position.set(-42.5, 16, 210);
      m.castShadow = true;
      scene.add(m);

      m = new THREE.Mesh(new THREE.BoxGeometry(1, 32, 45), mat.stone);
      m.position.set(42.5, 16, 210);
      m.castShadow = true;
      scene.add(m);

      // Columns
      let colGeo = new THREE.CylinderGeometry(1.6, 1.6, 28, 12);
      let cols = [[-4, -2], [-4, 2], [0, -2], [0, 2], [4, -2], [4, 2]];
      cols.forEach(([cx, cz]) => {
        m = new THREE.Mesh(colGeo, mat.marble);
        m.position.set(cx * 12, 14, 210 + cz * 15);
        m.castShadow = true;
        scene.add(m);
      });

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));

      let sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(120, 120, 120);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 4096;
      sun.shadow.mapSize.height = 4096;
      sun.shadow.camera.far = 900;
      scene.add(sun);

      for (let i = 0; i < 20; i++) {
        let angle = (i / 20) * Math.PI * 2;
        let light = new THREE.SpotLight(0xffd700, 2);
        light.position.set(Math.cos(angle) * 165, 34, Math.sin(angle) * 165);
        light.target.position.set(0, 20, 0);
        light.castShadow = true;
        scene.add(light);
      }
    }

    function setupControls() {
      let drag = false, px = 0, py = 0;

      document.addEventListener('mousedown', (e) => {
        drag = true;
        px = e.clientX;
        py = e.clientY;
      });

      document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        let dx = e.clientX - px;
        let dy = e.clientY - py;
        camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -dx * 0.01);
        px = e.clientX;
        py = e.clientY;
      });

      document.addEventListener('mouseup', () => { drag = false; });

      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        let d = camera.position.length();
        let dir = camera.position.clone().normalize();
        let nd = Math.max(60, Math.min(600, d + e.deltaY * 0.2));
        camera.position.copy(dir.multiplyScalar(nd));
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      boats.forEach(boat => {
        boat.userData.phase += 0.016 * 2;
        boat.position.y = boat.userData.baseY + Math.sin(boat.userData.phase) * 0.6;
        boat.rotation.z = Math.sin(boat.userData.phase * 0.5) * 0.12;
      });

      renderer.render(scene, camera);
    }

    function setMode(mode) {
      currentMode = mode;
      let sand = scene.getObjectByName('sand');
      let water = scene.getObjectByName('water');

      sand.visible = (mode === 'sand');
      water.visible = (mode === 'water' || mode === 'naval');

      boats.forEach(b => {
        b.visible = (mode === 'water' || mode === 'naval');
      });

      for (let i = 0; i < 8; i++) {
        let rock = scene.getObjectByName('rock_' + i);
        if (rock) rock.visible = (mode === 'terrain');
      }

      // Update buttons
      document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      log('Mode: ' + mode.toUpperCase());
    }

    // Wait for Three.js then start
    function checkThree() {
      if (typeof THREE === 'undefined') {
        setTimeout(checkThree, 100);
        return;
      }
      init();
    }

    checkThree();
  </script>
</body>
</html>
