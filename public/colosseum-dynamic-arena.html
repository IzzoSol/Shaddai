<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ SHADDAI Dynamic Colosseum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #06080b;
      color: #00ff9c;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(6, 8, 11, 0.95);
      border: 2px solid #00ff9c;
      padding: 20px;
      border-radius: 8px;
      max-width: 350px;
      z-index: 100;
    }
    .control-panel h2 {
      font-size: 16px;
      margin-bottom: 15px;
      text-shadow: 0 0 20px #00ff9c;
    }
    .control-section {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #00ff9c;
    }
    .control-section:last-child {
      border-bottom: none;
    }
    .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(0, 255, 156, 0.1);
      border: 1px solid #00ff9c;
      color: #00ff9c;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    button:hover {
      background: rgba(0, 255, 156, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 156, 0.3);
    }
    button.active {
      background: #00ff9c;
      color: #06080b;
      font-weight: bold;
    }
    .terrain-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .terrain-btn {
      width: 100%;
      padding: 8px;
      margin-bottom: 0;
    }
    .info-box {
      background: rgba(0, 100, 150, 0.1);
      border-left: 3px solid #00aaff;
      padding: 10px;
      border-radius: 4px;
      font-size: 10px;
      line-height: 1.4;
      color: #888;
    }
    .status {
      font-size: 11px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0, 255, 156, 0.05);
      border-radius: 4px;
      color: #00ff9c;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #00ff9c;
      border-top-color: #ffaa00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Colosseum...</p>
  </div>

  <canvas id="canvas"></canvas>

  <div class="control-panel">
    <h2>⚔️ COLOSSEUM</h2>

    <div class="control-section">
      <div class="label">Level</div>
      <button id="mainArenaBtn" class="active">Main Arena</button>
      <button id="basementBtn">Basement</button>
    </div>

    <div class="control-section">
      <div class="label">Terrain</div>
      <div class="terrain-grid">
        <button class="terrain-btn" data-terrain="grass">🟢 Grass</button>
        <button class="terrain-btn" data-terrain="water">💧 Water</button>
        <button class="terrain-btn" data-terrain="fire">🔥 Fire</button>
        <button class="terrain-btn" data-terrain="ice">❄️ Ice</button>
        <button class="terrain-btn" data-terrain="lava">🌋 Lava</button>
        <button class="terrain-btn" data-terrain="crystal">💎 Crystal</button>
      </div>
    </div>

    <div class="control-section">
      <div class="info-box">
        Right-click + drag to rotate<br>
        Scroll to zoom<br>
        Space for auto-rotate
      </div>
    </div>

    <div class="status">
      <div>Level: <span id="currentLevel">Main Arena</span></div>
      <div>Terrain: <span id="currentTerrain">Grass</span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let currentLevel = 'main';
    let currentTerrain = 'grass';
    let arenaGroup, basementGroup, terrainMesh;
    let autoRotate = false;

    const TERRAINS = {
      grass: { color: 0x3a6b3a, emissive: 0x1a4a1a, name: 'Grass' },
      water: { color: 0x001a4d, emissive: 0x000d2e, name: 'Water' },
      fire: { color: 0x8b3a1a, emissive: 0xff4400, name: 'Fire' },
      ice: { color: 0x1a3a4d, emissive: 0x4da6ff, name: 'Ice' },
      lava: { color: 0x5a2a0a, emissive: 0xff6600, name: 'Lava' },
      crystal: { color: 0x2a4a6a, emissive: 0x6699ff, name: 'Crystal' }
    };

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x001a33);
      scene.fog = new THREE.Fog(0x001a33, 300, 1000);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
      camera.position.set(0, 40, 100);

      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;

      controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 2;
      controls.target.set(0, 0, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(100, 150, 100);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 4096;
      directionalLight.shadow.mapSize.height = 4096;
      directionalLight.shadow.camera.left = -300;
      directionalLight.shadow.camera.right = 300;
      directionalLight.shadow.camera.top = 300;
      directionalLight.shadow.camera.bottom = -300;
      scene.add(directionalLight);

      // Build arenas
      buildMainArena();
      buildBasement();
      createTerrainPlane();

      // Event listeners
      document.getElementById('mainArenaBtn').addEventListener('click', () => switchLevel('main'));
      document.getElementById('basementBtn').addEventListener('click', () => switchLevel('basement'));

      document.querySelectorAll('.terrain-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.terrain-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          switchTerrain(btn.dataset.terrain);
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          autoRotate = !autoRotate;
          controls.autoRotate = autoRotate;
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.querySelector('[data-terrain="grass"]').classList.add('active');
      document.getElementById('loading').style.display = 'none';
    }

    function buildMainArena() {
      arenaGroup = new THREE.Group();

      const loader = new THREE.GLTFLoader();
      loader.load('/fal-assets/world/assets/bld-mecha-arena/bld-mecha-arena-mesh.glb', (gltf) => {
        const colosseum = gltf.scene;
        colosseum.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
        arenaGroup.add(colosseum);
      });

      scene.add(arenaGroup);
    }

    function buildBasement() {
      basementGroup = new THREE.Group();

      // Basement floor
      const floorGeo = new THREE.CylinderGeometry(150, 150, 2, 64);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -100;
      floor.receiveShadow = true;
      basementGroup.add(floor);

      // Catacomb walls
      for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 8) {
        const x = Math.cos(angle) * 152;
        const z = Math.sin(angle) * 152;
        const wallGeo = new THREE.BoxGeometry(25, 80, 4);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(x, -60, z);
        wall.rotation.y = angle;
        wall.castShadow = true;
        basementGroup.add(wall);
      }

      // Support pillars
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const radius = 80;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const pillarGeo = new THREE.CylinderGeometry(5, 5, 80, 8);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x5a5a5a });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(x, -60, z);
        pillar.castShadow = true;
        basementGroup.add(pillar);
      }

      basementGroup.visible = false;
      scene.add(basementGroup);
    }

    function createTerrainPlane() {
      const terrainGeo = new THREE.CylinderGeometry(120, 120, 1, 64);
      const terrainMat = new THREE.MeshStandardMaterial({
        color: TERRAINS.grass.color,
        emissive: TERRAINS.grass.emissive,
        roughness: 0.8
      });
      terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.position.y = 0.5;
      terrainMesh.receiveShadow = true;
      arenaGroup.add(terrainMesh);
    }

    function switchLevel(level) {
      currentLevel = level;
      const isMain = level === 'main';
      arenaGroup.visible = isMain;
      basementGroup.visible = !isMain;

      document.getElementById('mainArenaBtn').classList.toggle('active', isMain);
      document.getElementById('basementBtn').classList.toggle('active', !isMain);
      document.getElementById('currentLevel').textContent = isMain ? 'Main Arena' : 'Basement';

      controls.target.set(0, isMain ? 0 : -100, 0);
    }

    function switchTerrain(terrain) {
      currentTerrain = terrain;
      const terrainData = TERRAINS[terrain];

      terrainMesh.material.color.setHex(terrainData.color);
      terrainMesh.material.emissive.setHex(terrainData.emissive);

      document.getElementById('currentTerrain').textContent = terrainData.name;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
