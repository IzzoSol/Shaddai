<!-- SHADDAI & PIKADON Agent Control Dashboard -->
<!-- Integrate into main SHADDAI dashboard as a new tab -->

<style>
  .agent-dashboard {
    background: linear-gradient(135deg, #0c1425 0%, #1a2a4e 100%);
    border-radius: 12px;
    padding: 24px;
    border: 2px solid #00e5a0;
    font-family: 'JetBrains Mono', monospace;
    color: #e8edf5;
  }

  .agent-dashboard h2 {
    color: #00e5a0;
    margin: 0 0 24px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 20px;
  }

  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .agent-card {
    background: rgba(12, 20, 37, 0.8);
    border: 1px solid #00e5a0;
    border-radius: 8px;
    padding: 16px;
  }

  .agent-card h3 {
    margin: 0 0 12px 0;
    color: #00e5a0;
    font-size: 16px;
    text-transform: uppercase;
  }

  .agent-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
  }

  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .status-indicator.online {
    background: #00e5a0;
  }

  .status-indicator.offline {
    background: #ff4070;
    animation: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .agent-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .agent-btn {
    padding: 8px 12px;
    background: linear-gradient(135deg, #00e5a0 0%, #00cc8a 100%);
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    font-family: 'JetBrains Mono', monospace;
  }

  .agent-btn:hover {
    box-shadow: 0 0 15px rgba(0, 229, 160, 0.4);
    transform: translateY(-1px);
  }

  .agent-btn.danger {
    background: linear-gradient(135deg, #ff4070 0%, #ff2050 100%);
    color: #fff;
  }

  .job-executor {
    background: rgba(12, 20, 37, 0.8);
    border: 1px solid #ff7b3d;
    border-radius: 8px;
    padding: 16px;
    margin-top: 20px;
  }

  .job-executor h3 {
    color: #ff7b3d;
    margin: 0 0 12px 0;
    text-transform: uppercase;
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 11px;
    color: #8b9dc3;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 8px;
    background: #0f3460;
    border: 1px solid #00e5a0;
    color: #fff;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    box-sizing: border-box;
  }

  .form-group textarea {
    min-height: 60px;
    resize: vertical;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #ff7b3d;
    box-shadow: 0 0 10px rgba(255, 123, 61, 0.3);
  }

  .execute-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #ff7b3d 0%, #ff6b2d 100%);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 12px;
    transition: all 0.3s ease;
    font-family: 'JetBrains Mono', monospace;
  }

  .execute-btn:hover {
    box-shadow: 0 0 20px rgba(255, 123, 61, 0.4);
    transform: translateY(-2px);
  }

  .execution-log {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid #00e5a0;
    border-radius: 4px;
    padding: 12px;
    margin-top: 16px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.4;
  }

  .log-entry {
    color: #00e5a0;
    margin-bottom: 4px;
  }

  .log-entry.error {
    color: #ff4070;
  }

  .log-entry.warning {
    color: #ffb020;
  }

  .log-entry.success {
    color: #00e5a0;
  }
</style>

<div class="agent-dashboard">
  <h2>🤖 SHADDAI & PIKADON Command Center</h2>

  <!-- Agent Status Cards -->
  <div class="agent-grid">
    <!-- SHADDAI -->
    <div class="agent-card">
      <h3>SHADDAI</h3>
      <div class="agent-status">
        <div class="status-indicator online" id="shaddai-indicator"></div>
        <span id="shaddai-status">Checking...</span>
      </div>
      <p style="font-size: 11px; color: #8b9dc3; margin: 8px 0;">
        Supreme Orchestrator • Port 8000<br>
        Strategy & Decision Making
      </p>
      <div class="agent-controls">
        <button class="agent-btn" onclick="checkSHADDAIHealth()">Check Status</button>
        <button class="agent-btn" onclick="getSHADDAISkills()">View Skills</button>
      </div>
    </div>

    <!-- PIKADON -->
    <div class="agent-card">
      <h3>PIKADON</h3>
      <div class="agent-status">
        <div class="status-indicator offline" id="pikadon-indicator"></div>
        <span id="pikadon-status">Checking...</span>
      </div>
      <p style="font-size: 11px; color: #8b9dc3; margin: 8px 0;">
        Security Guardian • Port 8008<br>
        Compliance & Risk Management
      </p>
      <div class="agent-controls">
        <button class="agent-btn" onclick="checkPIKADONHealth()">Check Status</button>
        <button class="agent-btn" onclick="getPIKADONSkills()">View Skills</button>
      </div>
    </div>
  </div>

  <!-- Job Executor -->
  <div class="job-executor">
    <h3>⚡ Execute Job with Agents</h3>

    <form id="job-executor-form">
      <div class="form-group">
        <label>Job ID (existing job)</label>
        <input type="text" id="job-id" placeholder="job_1234567890" />
      </div>

      <div class="form-group">
        <label>Or Create New Job</label>
        <input type="text" id="job-title" placeholder="Job title" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="job-description" placeholder="What needs to be done..."></textarea>
      </div>

      <div class="form-group">
        <label>Budget (USD)</label>
        <input type="number" id="job-budget" placeholder="500" min="10" />
      </div>

      <div class="form-group">
        <label>Primary Agent</label>
        <select id="agent-select">
          <option value="SHADDAI">SHADDAI (Orchestrator)</option>
          <option value="NEXUS">NEXUS (Backend Expert)</option>
          <option value="TURTLE">TURTLE (Design)</option>
          <option value="QUILL">QUILL (Writing)</option>
        </select>
      </div>

      <button type="button" class="execute-btn" onclick="executeJobWithAgents()">
        ▶ Route & Execute with Agents
      </button>
    </form>

    <!-- Execution Log -->
    <div class="execution-log" id="execution-log">
      <div class="log-entry">Waiting for execution...</div>
    </div>
  </div>
</div>

<script>
  let executionLogs = [];

  function addLog(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    executionLogs.push({ message, type, timestamp });

    const logEl = document.getElementById('execution-log');
    const entryClass = type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'success';
    logEl.innerHTML += `<div class="log-entry ${entryClass}">[${timestamp}] ${message}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function checkAgentHealth(agentName, indicatorId, statusId) {
    try {
      const response = await fetch(`/api/agents/${agentName}/health`);
      const data = await response.json();

      const online = data.status === 'online';
      const indicator = document.getElementById(indicatorId);
      const statusEl = document.getElementById(statusId);

      if (online) {
        indicator.classList.remove('offline');
        indicator.classList.add('online');
        statusEl.textContent = 'Online';
        addLog(`${agentName} is online`, 'success');
      } else {
        indicator.classList.remove('online');
        indicator.classList.add('offline');
        statusEl.textContent = 'Offline';
        addLog(`${agentName} is offline`, 'error');
      }
    } catch (error) {
      document.getElementById(indicatorId).classList.add('offline');
      document.getElementById(statusId).textContent = 'Error';
      addLog(`${agentName} health check failed: ${error.message}`, 'error');
    }
  }

  function checkSHADDAIHealth() {
    checkAgentHealth('SHADDAI', 'shaddai-indicator', 'shaddai-status');
  }

  function checkPIKADONHealth() {
    checkAgentHealth('PIKADON', 'pikadon-indicator', 'pikadon-status');
  }

  async function getSHADDAISkills() {
    try {
      addLog('Fetching SHADDAI skills...', 'info');
      const response = await fetch('/api/agents/SHADDAI/skills');
      const data = await response.json();
      addLog(`SHADDAI has ${data.skills?.length || 0} skills available`, 'success');
    } catch (error) {
      addLog(`Failed to fetch skills: ${error.message}`, 'error');
    }
  }

  async function getPIKADONSkills() {
    try {
      addLog('Fetching PIKADON skills...', 'info');
      const response = await fetch('/api/agents/PIKADON/skills');
      const data = await response.json();
      addLog(`PIKADON has ${data.skills?.length || 0} skills available`, 'success');
    } catch (error) {
      addLog(`Failed to fetch skills: ${error.message}`, 'error');
    }
  }

  async function executeJobWithAgents() {
    const jobId = document.getElementById('job-id').value;
    const jobTitle = document.getElementById('job-title').value;
    const jobDescription = document.getElementById('job-description').value;
    const jobBudget = document.getElementById('job-budget').value;
    const selectedAgent = document.getElementById('agent-select').value;

    if (!jobId && !jobTitle) {
      addLog('Please enter job ID or create a new job', 'error');
      return;
    }

    try {
      addLog(`Starting job execution with ${selectedAgent}...`, 'info');

      const endpoint = jobId ? `/api/jobs/${jobId}/execute` : '/api/jobs';
      const method = jobId ? 'POST' : 'POST';
      const body = jobId
        ? { agent: selectedAgent }
        : {
            title: jobTitle,
            description: jobDescription,
            budget: parseInt(jobBudget) || 0,
            targetAgent: selectedAgent
          };

      const response = await fetch(endpoint, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const result = await response.json();

      if (!response.ok) {
        addLog(`Execution error: ${result.error}`, 'error');
        return;
      }

      addLog(`Job routed successfully`, 'success');
      addLog(`Status: ${result.status || result.orchestration?.status}`, 'success');

      if (result.securityCheck?.approved === false) {
        addLog(`⚠️ Security check failed: ${result.securityCheck.reason}`, 'warning');
      } else {
        addLog(`✓ Security check passed`, 'success');
      }

      document.getElementById('job-id').value = result.jobId || '';

    } catch (error) {
      addLog(`Execution failed: ${error.message}`, 'error');
    }
  }

  // Auto-check agent health on load
  window.addEventListener('load', () => {
    checkSHADDAIHealth();
    checkPIKADONHealth();
  });
</script>
