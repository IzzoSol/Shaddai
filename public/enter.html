<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SHADDAI · Enter</title>
<meta name="description" content="Four ways into the empire. Choose your threshold — the cinematic descent, the full story, the command hub, or one thumb and everything." />
<meta name="theme-color" content="#06080b" />
<meta property="og:title" content="SHADDAI — Enter" />
<meta property="og:description" content="Four ways in. Choose your threshold." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   SHADDAI · THE FRONT DOOR — tokens mirror home.html / journey.html.
   Obsidian ground, emerald/gold/cyan/violet accents. Do not invent hues.
   Spec: docs/FRONT-DOOR-MASTER-PROMPT.md
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* Each skin carries a three-stop aurora (--g1/--g2/--g3) painted behind the
     grid, not just flat tokens — that is what makes a theme read as designed
     rather than as a recoloured background. */
  --g1:rgba(0,255,156,.075); --g2:rgba(95,224,255,.065); --g3:rgba(232,196,92,.05);
  --void:#06080b; --void2:#0a0e13; --panel:#0e141b; --edge:rgba(120,150,140,.14);
  --emerald:#00ff9c; --gold:#e8c45c; --cyan:#5fe0ff; --violet:#b07cff; --rose:#ff6f6f;
  --ink:#e9efe9; --ink-soft:#93a49b; --ink-faint:#4f5d57;
  --f-display:'Cinzel', serif; --f-serif:'Fraunces', Georgia, serif; --f-mono:'IBM Plex Mono', monospace;
  --ease:cubic-bezier(.22,.7,.2,1);
  --accent:var(--emerald);
}
/* The six shared skins (same localStorage key as the rest of the app:
   shd_theme_skin). We remap our OWN tokens rather than loading
   theme-switcher.js, whose repaint pass is written for the dashboard's
   markup and would fight this page's art direction. Choice still carries. */
html[data-theme-skin="terminal"]{ --void:#030a03; --void2:#041004; --panel:#061806; --ink:#00ff41; --ink-soft:rgba(0,255,65,.62); --edge:rgba(0,255,65,.22); }
html[data-theme-skin="amber"]   { --void:#0a0600; --void2:#120c02; --panel:#160f03; --ink:#ffcf7a; --ink-soft:rgba(255,176,32,.65); --edge:rgba(255,176,32,.20); }
html[data-theme-skin="void"]    { --void:#000; --void2:#050505; --panel:#0a0a0a; --ink:#f2f2f2; --ink-soft:#8f8f8f; --edge:rgba(255,255,255,.10); }
html[data-theme-skin="brutalist"]{ --void:#f5f4f0; --void2:#eceae4; --panel:#fff; --ink:#0a0804; --ink-soft:#5a5248; --ink-faint:#8b8378; --edge:rgba(10,8,4,.18); }
html[data-theme-skin="terminal"]{ --g1:rgba(0,255,65,.10); --g2:rgba(0,255,65,.04); --g3:rgba(0,120,40,.06); }
html[data-theme-skin="amber"]   { --g1:rgba(255,176,32,.10); --g2:rgba(255,110,20,.06); --g3:rgba(120,60,0,.07); }
html[data-theme-skin="void"]    { --g1:rgba(255,255,255,.05); --g2:rgba(160,160,180,.04); --g3:rgba(90,90,120,.05); }
html[data-theme-skin="brutalist"]{ --g1:rgba(245,192,0,.13); --g2:rgba(255,120,0,.07); --g3:rgba(0,0,0,.04); }
html[data-theme-skin="serif"]   { --g1:rgba(58,107,74,.10); --g2:rgba(160,140,90,.08); --g3:rgba(0,0,0,.03); }
html[data-theme-skin="serif"]   { --void:#f8f6f0; --void2:#efece4; --panel:#fff; --ink:#1c1710; --ink-soft:#6b5f4e; --ink-faint:#9a8e7c; --edge:rgba(38,28,8,.12); }

*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--void); -webkit-text-size-adjust:100%; }
body{
  background:var(--void); color:var(--ink); font-family:var(--f-serif);
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;
  min-height:100dvh; display:flex; flex-direction:column;
}
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::selection{ background:var(--emerald); color:#022; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* ── atmosphere ─────────────────────────────────────────────────────── */
.grain{ position:fixed; inset:0; pointer-events:none; z-index:40; mix-blend-mode:overlay; opacity:.32;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>"); }
.vignette{ position:fixed; inset:0; pointer-events:none; z-index:38;
  background:radial-gradient(125% 95% at 50% 40%, transparent 48%, rgba(0,0,0,.78) 100%); }
html[data-theme-skin="brutalist"] .vignette, html[data-theme-skin="serif"] .vignette{
  background:radial-gradient(125% 95% at 50% 40%, transparent 55%, rgba(0,0,0,.14) 100%); }
.aura{ position:fixed; inset:-20%; pointer-events:none; z-index:0;
  background:
    radial-gradient(52% 40% at 18% 14%, var(--g1), transparent 63%),
    radial-gradient(48% 38% at 84% 20%, var(--g2), transparent 63%),
    radial-gradient(64% 46% at 50% 96%, var(--g3), transparent 66%);
  animation:drift 34s ease-in-out infinite alternate; }
@keyframes drift{ to{ transform:translate3d(2.5%,-2%,0) scale(1.06); } }
@media (prefers-reduced-motion: reduce){ .aura{ animation:none; } }

/* the shared WebGL layer. Transparent, above the tile art, below nothing —
   tile text reads straight through it, and each tile's solid is scissored
   into the upper region of its own rect so they never collide. */
#gl{ position:fixed; inset:0; width:100%; height:100%; z-index:15; pointer-events:none; }

/* ── header ─────────────────────────────────────────────────────────── */
header{
  position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:clamp(14px,2.4vw,24px) clamp(16px,4vw,42px);
  padding-top:calc(clamp(14px,2.4vw,24px) + env(safe-area-inset-top));
}
.brand{ display:flex; align-items:baseline; gap:10px; min-width:0; overflow:hidden; }
.brand .sh{
  font-family:var(--f-display); font-weight:900; font-size:clamp(19px,2.5vw,26px);
  letter-spacing:.20em; color:var(--ink);
  text-shadow:0 0 24px rgba(0,255,156,.28);
}
.brand .sub{ font-family:var(--f-mono); font-size:10px; letter-spacing:.24em; color:var(--ink-faint); text-transform:uppercase; white-space:nowrap; }
@media(max-width:640px){ .brand .sub{ display:none; } }

.controls{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.ctl{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); border:1px solid var(--edge); border-radius:2px; background:rgba(14,20,27,.5);
  min-height:38px; padding:0 13px; display:inline-flex; align-items:center; gap:7px;
  transition:border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
html[data-theme-skin="brutalist"] .ctl, html[data-theme-skin="serif"] .ctl{ background:rgba(255,255,255,.6); }
.ctl:hover, .ctl.on{ color:var(--ink); border-color:rgba(0,255,156,.42); }
.ctl.on{ background:rgba(0,255,156,.09); }
.ctl .dot{ width:6px; height:6px; border-radius:50%; background:var(--emerald); box-shadow:0 0 8px var(--emerald); flex-shrink:0; }
.ctl.out .dot{ background:var(--ink-faint); box-shadow:none; }
@media(max-width:520px){ .ctl{ padding:0 10px; font-size:10px; } .ctl .lbl-long{ display:none; } }
.brand .sh b{ font-weight:900; }
.brand .sh .sh-mini{ display:none; }
@media(max-width:440px){
  header{ padding-left:12px; padding-right:12px; gap:8px; }
  .brand .sh{ font-size:17px; letter-spacing:.16em; }
  .brand .sh .sh-full{ display:none; }
  .brand .sh .sh-mini{ display:inline; }
  .controls{ gap:6px; }
  /* 44px is the thumb floor — the room comes from the wordmark and the
     'bios' label instead of from the targets */
  .ctl{ padding:0 10px; min-height:44px; min-width:44px; }
  #btnDwell span:not(.dot){ display:none; }
}

/* ── the grid ───────────────────────────────────────────────────────── */
main{ position:relative; z-index:10; flex:1; display:flex; flex-direction:column; justify-content:center;
  padding:clamp(6px,1.6vw,18px) clamp(16px,4vw,42px) clamp(18px,3vw,32px); }
.lede{ text-align:center; margin:0 auto clamp(16px,2.6vw,30px); max-width:600px; }
.lede h1{ font-family:var(--f-display); font-weight:500; font-size:clamp(15px,2vw,20px); letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-soft); }
.lede p{ font-size:clamp(13px,1.5vw,15px); color:var(--ink-faint); margin-top:7px; font-style:italic; }

.grid{
  display:grid; gap:clamp(12px,1.6vw,18px); width:100%;
  max-width:1340px; margin:0 auto;
  grid-template-columns:repeat(3,1fr);
  perspective:1400px;              /* tiles tilt in real space, not as a fake skew */
}
@media(max-width:1080px){ .grid{ grid-template-columns:repeat(2,1fr); max-width:820px; } }
@media(max-width:760px){ .grid{ grid-template-columns:1fr; max-width:520px; } }
body.full .grid{ grid-template-columns:repeat(3,1fr); max-width:1320px; }
body.full .slot{ min-height:clamp(150px,19vh,200px); }
body.full .slot .name{ font-size:clamp(22px,2.6vw,32px); }
@media(max-width:1100px){ body.full .grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:760px){ body.full .grid{ grid-template-columns:1fr; }
  body.full .slot{ min-height:clamp(140px,17vh,180px); } }

/* ── a slot ─────────────────────────────────────────────────────────── */
.slot{
  position:relative; display:block; width:100%; text-align:left; overflow:hidden;
  /* square. a radius on a monolith makes it a card, and these are not cards */
  border:1px solid color-mix(in srgb, var(--accent) 30%, var(--edge)); border-radius:0;
  background:var(--panel);
  min-height:clamp(200px,26vh,280px); isolation:isolate;
  transform-style:preserve-3d;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.4);
  transition:border-color .4s var(--ease), transform .5s var(--ease), box-shadow .5s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
/* the neon trace — a conic sweep clipped to the border box, so the edge itself
   lights up and travels rather than a glow sitting outside the tile */
.slot .trace{ position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
  transition:opacity .45s var(--ease); }
.slot .trace::before{ content:''; position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, transparent 0turn, var(--accent) .08turn, transparent .18turn, transparent 1turn);
  animation:trace 3.4s linear infinite; }
.slot .trace::after{ content:''; position:absolute; inset:1px; background:var(--panel); }
@keyframes trace{ to{ transform:rotate(1turn); } }
.slot:hover .trace, .slot:focus-visible .trace, .slot.touched .trace{ opacity:.85; }
@media (prefers-reduced-motion: reduce){ .slot .trace::before{ animation:none; } }
@media(max-width:760px){ .slot{ min-height:clamp(168px,23vh,210px); } }
/* the art plate — dimmed hard and pushed toward the module's own colour */
.slot .art{
  position:absolute; inset:0; z-index:0; background-size:cover; background-position:center;
  opacity:.30; filter:saturate(.55) contrast(1.06);
  transform:scale(1.04); transition:opacity .55s var(--ease), transform .8s var(--ease);
}
/* The wash is mixed FROM --shell, so it follows the theme automatically:
   dark shell gives a dark scrim, light shell a light one. It used to be
   hardcoded dark with an override naming brutalist and serif — which meant
   every new light theme got dark tiles under light chrome, and the names
   went unreadable. Deriving it removes that whole class of bug. */
.slot .wash{
  position:absolute; inset:0; z-index:1; transition:opacity .5s var(--ease);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--shell) 42%, transparent) 0%,
      color-mix(in srgb, var(--shell) 76%, transparent) 52%,
      color-mix(in srgb, var(--shell) 95%, transparent) 100%),
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 66%);
}
/* the accent hairline that traces the frame */
.slot .frame{
  position:absolute; inset:0; z-index:3; pointer-events:none; border:1px solid transparent;
  transition:border-color .4s var(--ease), box-shadow .4s var(--ease);
}
.slot .corner{ position:absolute; z-index:6; width:16px; height:16px; pointer-events:none;
  border:2px solid var(--accent); opacity:.45; filter:drop-shadow(0 0 5px var(--accent)); transition:opacity .4s var(--ease), width .4s var(--ease), height .4s var(--ease); }
.slot .corner.tl{ top:9px; left:9px; border-right:0; border-bottom:0; }
.slot .corner.br{ bottom:9px; right:9px; border-left:0; border-top:0; }

.slot .body{ position:relative; z-index:7; height:100%; display:flex; flex-direction:column;
  justify-content:flex-end; padding:clamp(15px,2vw,22px); gap:3px; min-height:inherit; }
.slot .idx{ position:absolute; top:clamp(13px,1.8vw,19px); right:clamp(15px,2vw,22px);
  font-family:var(--f-mono); font-size:10px; letter-spacing:.2em; color:var(--ink-faint); }
.slot .kicker{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--accent); opacity:.9; }
.slot .name{
  font-family:var(--f-display); font-weight:900; letter-spacing:.05em; line-height:.95;
  font-size:clamp(28px,3.4vw,44px); color:var(--ink);
  text-transform:uppercase;
  /* halo in the GROUND colour: a dark glow behind dark text on a light tile
     just muddies it */
  text-shadow:0 2px 26px color-mix(in srgb, var(--shell) 70%, transparent);
}
@media(max-width:760px){ .slot .name{ font-size:clamp(32px,10vw,46px); } }
/* The CTA was a whisper of muted text. It is now an actual accent button that
   arrives on approach, with a sheen that sweeps once across it — the sweep is
   a single translate on a skewed gradient, which is cheap enough to run on a
   phone and reads as light catching an edge rather than as an animation. */
.slot .go{ position:relative; overflow:hidden; align-self:flex-start;
  font-family:var(--f-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--void); background:var(--accent); font-weight:600;
  margin-top:11px; padding:9px 15px; border-radius:2px;
  display:inline-flex; align-items:center; gap:8px;
  box-shadow:0 6px 20px color-mix(in srgb, var(--accent) 26%, transparent);
  opacity:0; transform:translateY(6px);
  transition:opacity .4s var(--ease), transform .4s var(--ease); }
html[data-theme-skin="brutalist"] .slot .go, html[data-theme-skin="serif"] .slot .go{ color:#fff; }
.slot .go::after{ content:''; position:absolute; top:0; bottom:0; width:38%; left:-45%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform:skewX(-18deg); }
.slot:hover .go::after, .slot:focus-visible .go::after, .slot.touched .go::after{
  animation:sheen 1.1s var(--ease) .12s 1; }
@keyframes sheen{ to{ left:120%; } }
@media (prefers-reduced-motion: reduce){ .slot .go::after{ display:none; } }

/* awake state — pointer hover, keyboard focus, or touch-press all share it */
.slot:hover, .slot:focus-visible, .slot.touched{
  transform:translateY(-5px) rotateX(3deg) scale(1.012);
  border-color:var(--accent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent),
             0 0 26px color-mix(in srgb, var(--accent) 30%, transparent),
             0 24px 54px rgba(0,0,0,.6);
}
@media (prefers-reduced-motion: reduce){
  .slot:hover, .slot:focus-visible, .slot.touched{ transform:none; }
}
.slot:hover .art, .slot:focus-visible .art, .slot.touched .art{ opacity:.46; transform:scale(1.0); }
.slot:hover .frame, .slot:focus-visible .frame, .slot.touched .frame{
  border-color:color-mix(in srgb, var(--accent) 34%, transparent);
  box-shadow:inset 0 0 44px color-mix(in srgb, var(--accent) 12%, transparent), 0 14px 46px rgba(0,0,0,.5); }
.slot:hover .corner, .slot:focus-visible .corner, .slot.touched .corner{ opacity:.95; width:20px; height:20px; }
.slot:hover .go, .slot:focus-visible .go, .slot.touched .go{ opacity:1; transform:none; }

/* ── dwell bio (5s) ─────────────────────────────────────────────────── */
.slot .bio{
  position:absolute; inset:auto 0 0 0; z-index:8; padding:clamp(15px,2vw,22px);
  background:linear-gradient(180deg, transparent, rgba(6,8,11,.94) 26%);
  transform:translateY(101%); transition:transform .55s var(--ease);
  font-size:13.5px; line-height:1.5; color:var(--ink-soft);
  border-top:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
html[data-theme-skin="brutalist"] .slot .bio, html[data-theme-skin="serif"] .slot .bio{
  background:linear-gradient(180deg, transparent, rgba(255,255,255,.97) 26%); }
.slot.bio-open .bio{ transform:translateY(0); }
.slot .bio b{ color:var(--accent); font-weight:400; font-family:var(--f-mono); font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; display:block; margin-bottom:6px; }
/* the dwell timer hairline, filling left→right over 5s */
.slot .dwell{ position:absolute; left:0; bottom:0; z-index:9; height:1.5px; width:0; background:var(--accent);
  box-shadow:0 0 8px var(--accent); opacity:.75; }
.slot.dwelling .dwell{ width:100%; transition:width 5s linear; }

/* ── edit mode ──────────────────────────────────────────────────────── */
body.editing .slot{ cursor:copy; }
body.editing .slot::after{
  content:'swap'; position:absolute; z-index:7; inset:auto 12px 12px auto;
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--void); background:var(--accent); padding:6px 10px; border-radius:2px;
}
body.editing .slot.pending{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 46px color-mix(in srgb, var(--accent) 26%, transparent); }
body.editing .slot .go{ display:none; }

/* ── drawer ─────────────────────────────────────────────────────────── */
/* backdrop-filter must be applied ONLY while open. Left on permanently it is a
   composited blur layer that never goes away — over the WebGL canvas that reads
   as the whole page freezing blurry after the sheet closes. visibility:hidden
   takes it out of compositing entirely rather than trusting opacity:0. */
.scrim{ position:fixed; inset:0; z-index:60; background:rgba(3,5,7,.72); opacity:0;
  pointer-events:none; visibility:hidden;
  transition:opacity .35s var(--ease), visibility 0s linear .35s; }
.scrim.on{ opacity:1; pointer-events:auto; visibility:visible;
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  transition:opacity .35s var(--ease), visibility 0s linear 0s; }
.sheet{
  position:fixed; z-index:61; left:50%; bottom:0; width:min(560px,100%);
  transform:translate(-50%,102%); transition:transform .45s var(--ease);
  background:var(--void2); border:1px solid var(--edge); border-bottom:0;
  border-radius:6px 6px 0 0; padding:20px clamp(16px,4vw,26px);
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
  max-height:82dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.sheet.on{ transform:translate(-50%,0); }
.sheet h2{ font-family:var(--f-display); font-weight:700; font-size:16px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink); }
.sheet .hint{ font-size:13px; color:var(--ink-faint); margin-top:5px; font-style:italic; }
.sheet .close{ position:absolute; top:14px; right:14px; font-family:var(--f-mono); font-size:11px;
  letter-spacing:.14em; color:var(--ink-faint); min-height:40px; min-width:40px; }
.sheet .close:hover{ color:var(--ink); }

.lib{ display:flex; flex-direction:column; gap:7px; margin-top:16px; }
.lib .row{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  border:1px solid var(--edge); border-radius:3px; background:var(--panel);
  padding:10px 13px; min-height:60px; transition:border-color .25s var(--ease), background .25s var(--ease);
}
.lib .row:hover{ border-color:color-mix(in srgb, var(--ac) 50%, transparent); background:var(--void2); }
.lib .row .chip{ width:40px; height:40px; border-radius:2px; background-size:cover; background-position:center;
  border:1px solid color-mix(in srgb, var(--ac) 40%, transparent); flex-shrink:0; opacity:.8; }
.lib .row .txt{ min-width:0; flex:1; }
.lib .row .n{ display:block; font-family:var(--f-display); font-weight:700; font-size:15px; letter-spacing:.09em; color:var(--ink); }
.lib .row .k{ display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ac); margin-top:3px; }
.lib .row .state{ font-family:var(--f-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); border:1px solid var(--edge); padding:4px 8px; border-radius:2px; flex-shrink:0; }
.lib .row.placed .state{ color:var(--ac); border-color:color-mix(in srgb, var(--ac) 42%, transparent); }

footer{ position:relative; z-index:10; text-align:center; font-family:var(--f-mono); font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint);
  padding:0 16px calc(16px + env(safe-area-inset-bottom)); }
footer b{ color:var(--ink-soft); font-weight:400; }

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.001s !important; animation-duration:.001s !important; }
  .slot.dwelling .dwell{ transition:width 5s linear !important; }
}
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="sh"><b class="sh-full">SHADDAI</b><b class="sh-mini">SH</b></span>
    <span class="sub">Choose your threshold</span>
  </div>
  <div class="controls">
    <button class="ctl" id="btnDwell" type="button" title="Rest on a door to read what it is">
      <span class="dot"></span><span>info</span>
    </button>
    <button class="ctl" id="btnTheme" type="button" title="Change theme">◈ <span class="lbl-long">theme</span></button>
    <button class="ctl" id="btnAll" type="button" title="Show every module">◳ <span class="lbl-long">all</span></button>
    <button class="ctl" id="btnEdit" type="button" title="Rearrange your front door">✎ <span class="lbl-long">edit</span></button>
    <button class="ctl out" id="btnAuth" type="button"><span class="dot"></span><span id="authLbl">sign in</span></button>
  </div>
</header>

<main>
  <div class="lede">
    <h1>Ways in</h1>
    <p>One empire. Pick the door — or rearrange them until they're yours.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>Seven agents · one council · <b id="footNote">tap ✎ to rearrange</b></footer>

<!-- ── drawer: swap a module into a slot ───────────────────────────── -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheetLib" role="dialog" aria-modal="true" aria-labelledby="libTitle">
  <button class="close" id="libClose" type="button">✕ close</button>
  <h2 id="libTitle">Swap this door</h2>
  <p class="hint">Choose what lives in slot <b id="libSlotNo">1</b>. If it's already in another slot, the two trade places.</p>
  <div class="lib" id="lib"></div>
</div>

<script src="/js/shd-modules.js"></script>
<script src="/js/enter-intro.js"></script>
<script src="/js/shd-chrome.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   THE FRONT DOOR — slots, dwell-bios, swapping, sign-in, theme.
   Plain script (no build step). The WebGL layer is a separate ES module
   below and is entirely optional — if it fails or WebGL is unavailable,
   every tile still renders and works from this script alone.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var M = window.SHDModules;
  // must cover DEFAULT_SLOTS.length — a short list printed 'undefined'
  // on the fifth and sixth doors
  var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];

  var C = window.SHDChrome.init();
  document.getElementById('btnTheme').addEventListener('click', function () { C.openTheme(); });

  /* ── dwell-bio preference (shared with Simple Mode) ─────────────────── */
  var btnDwell = document.getElementById('btnDwell');
  function dwellOn() { return C.dwell(); }
  function paintDwell() {
    var on = C.dwell();
    btnDwell.classList.toggle('on', on);
    btnDwell.classList.toggle('out', !on);
    btnDwell.title = on
      ? 'Info on — rest on a door for 5 seconds and it tells you what it is'
      : 'Info off — doors stay quiet';
    if (!on) document.querySelectorAll('.slot').forEach(clearDwell);
  }
  /* A setting whose effect is delayed by five seconds reads as broken: you
     press it and nothing happens. Toggling now DEMONSTRATES itself — every
     door shows its description for a moment, so you can see what the switch
     controls before deciding to leave it on. */
  var demoT = null;
  btnDwell.addEventListener('click', function () {
    var on = !C.dwell();
    C.setDwell(on);
    clearTimeout(demoT);
    var tiles = grid.querySelectorAll('.slot');
    if (on) {
      tiles.forEach(function (t) { clearDwell(t); t.classList.add('bio-open'); });
      demoT = setTimeout(function () {
        tiles.forEach(function (t) { t.classList.remove('bio-open'); });
      }, 2200);
    } else {
      tiles.forEach(clearDwell);
    }
  });
  C.onDwell(paintDwell);
  paintDwell();

  /* ── slots ────────────────────────────────────────────────────────── */
  var grid = document.getElementById('grid');
  var slots = M.readSlots();
  var editing = false, pendingSlot = -1;

  /* Full mode shows every module in the library instead of the four slots.
     Same tile, same dwell, same 3D — only the source list and the density
     change, so there is no second code path to keep in sync. */
  var showAll = false;
  try { showAll = localStorage.getItem('shd_enter_full') === '1'; } catch (e) {}

  function render() {
    grid.innerHTML = '';
    var list = showAll ? M.MODULES.map(function (m) { return m.id; }) : slots;
    list.forEach(function (id, i) {
      var m = M.byId(id); if (!m) return;
      var a = document.createElement('a');
      a.className = 'slot';
      a.href = m.href;
      a.dataset.slot = String(i);
      a.dataset.module = m.id;
      a.style.setProperty('--accent', m.accent);
      a.setAttribute('aria-label', m.name + ' — ' + m.kicker + '. ' + m.blurb);
      a.innerHTML =
        '<div class="art" style="background-image:url(\'' + m.art + '\')"></div>' +
        '<div class="wash"></div>' +
        '<div class="frame"></div><div class="trace"></div><i class="corner tl"></i><i class="corner br"></i>' +
        '<div class="body">' +
          '<span class="idx">' + (showAll ? '' : (ROMAN[i] || '')) + '</span>' +
          '<span class="kicker">' + m.kicker + '</span>' +
          '<span class="name">' + m.name + '</span>' +
          '<span class="go">enter →</span>' +
        '</div>' +
        '<div class="dwell"></div>' +
        '<div class="bio"><b>' + m.name + '</b>' + m.blurb + '</div>';
      grid.appendChild(a);
    });
    wire();
    window.dispatchEvent(new CustomEvent('shd:slots', { detail: list.slice() }));
  }

  /* dwell: sitting on a tile for 5s opens its bio. One mechanic for thumb,
     mouse, and keyboard — hover doesn't exist on a phone, and this rewards
     hesitation instead of punishing it. */
  function startDwell(el) {
    if (!dwellOn() || editing || el.classList.contains('bio-open')) return;
    clearDwell(el);
    el.classList.add('dwelling');
    el._dwellT = setTimeout(function () { el.classList.remove('dwelling'); el.classList.add('bio-open'); }, 5000);
  }
  function clearDwell(el) {
    if (el._dwellT) { clearTimeout(el._dwellT); el._dwellT = null; }
    el.classList.remove('dwelling', 'bio-open');
  }

  function wire() {
    grid.querySelectorAll('.slot').forEach(function (el) {
      el.addEventListener('mouseenter', function () { startDwell(el); });
      el.addEventListener('mouseleave', function () { clearDwell(el); el.classList.remove('touched'); });
      el.addEventListener('focus', function () { el.classList.add('touched'); startDwell(el); });
      el.addEventListener('blur', function () { clearDwell(el); el.classList.remove('touched'); });
      // touch: a finger resting on the tile is the dwell. Moving cancels it so
      // a scroll gesture never opens a bio.
      el.addEventListener('touchstart', function () { el.classList.add('touched'); startDwell(el); }, { passive: true });
      el.addEventListener('touchmove', function () { clearDwell(el); el.classList.remove('touched'); }, { passive: true });
      el.addEventListener('touchend', function () { setTimeout(function () { el.classList.remove('touched'); }, 260); }, { passive: true });

      el.addEventListener('click', function (e) {
        if (!editing) return;
        e.preventDefault();
        openLib(parseInt(el.dataset.slot, 10));
      });
    });
  }

  /* ── edit + drawer ────────────────────────────────────────────────── */
  var scrim = document.getElementById('scrim');
  var sheetLib = document.getElementById('sheetLib');
  var libEl = document.getElementById('lib');
  var footNote = document.getElementById('footNote');

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    document.getElementById('btnEdit').classList.toggle('on', on);
    footNote.textContent = on ? 'tap a door to swap it' : 'tap ✎ to rearrange';
    if (!on) { grid.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('pending'); }); }
  }
  document.getElementById('btnEdit').addEventListener('click', function () {
    if (showAll) setShowAll(false);          // editing only applies to the four slots
    setEditing(!editing);
  });

  var btnAll = document.getElementById('btnAll');
  function setShowAll(on) {
    showAll = !!on;
    try { localStorage.setItem('shd_enter_full', showAll ? '1' : '0'); } catch (e) {}
    document.body.classList.toggle('full', showAll);
    btnAll.classList.toggle('on', showAll);
    btnAll.title = showAll ? 'Back to your four doors' : 'Show every module';
    if (showAll && editing) setEditing(false);
    document.querySelector('.lede h1').textContent = showAll ? 'Everything' : 'Ways in';
    document.querySelector('.lede p').textContent = showAll
      ? 'Every module in the empire. Tap ◳ again to go back to your four.'
      : "One empire. Pick the door — or rearrange them until they're yours.";
    footNote.textContent = showAll ? 'tap ◳ to return to your four' : 'tap ✎ to rearrange';
    render();
  }
  btnAll.addEventListener('click', function () { setShowAll(!showAll); });

  function openLib(slotIndex) {
    pendingSlot = slotIndex;
    document.getElementById('libSlotNo').textContent = ROMAN[slotIndex];
    grid.querySelectorAll('.slot').forEach(function (s) {
      s.classList.toggle('pending', parseInt(s.dataset.slot, 10) === slotIndex);
    });
    libEl.innerHTML = '';
    M.LIBRARY.forEach(function (m) {
      var at = slots.indexOf(m.id);
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'row' + (at >= 0 ? ' placed' : '');
      row.style.setProperty('--ac', m.accent);
      row.innerHTML =
        '<span class="chip" style="background-image:url(\'' + m.art + '\')"></span>' +
        '<span class="txt"><span class="n">' + m.name + '</span><span class="k">' + m.kicker + '</span></span>' +
        '<span class="state">' + (at >= 0 ? 'slot ' + ROMAN[at] : 'available') + '</span>';
      row.addEventListener('click', function () { assign(pendingSlot, m.id); });
      libEl.appendChild(row);
    });
    openSheet(sheetLib);
  }

  /* Assign, trading places if the module already sits in another slot —
     so the four are always four distinct doors, never a duplicate. */
  function assign(slotIndex, moduleId) {
    var at = slots.indexOf(moduleId);
    if (at === slotIndex) { closeSheets(); return; }
    if (at >= 0) { slots[at] = slots[slotIndex]; }
    slots[slotIndex] = moduleId;
    M.writeSlots(slots);
    render();
    closeSheets();
  }

  /* ── sheets ───────────────────────────────────────────────────────── */
  function openSheet(el) {
    scrim.classList.add('on'); el.classList.add('on');
  }
  function closeSheets() {
    sheetLib.classList.remove('on');
    scrim.classList.remove('on');
    grid.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('pending'); });
  }
  scrim.addEventListener('click', function () { closeSheets(); });
  document.getElementById('libClose').addEventListener('click', function () { closeSheets(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheets(); if (editing) setEditing(false); }
  });

  /* ── sign-in ─────────────────────────────────────────────────────────
     Implemented once in shd-chrome.js and shared with Simple Mode. It uses
     endpoints that already exist; no backend file is modified. */
  var authBtn = document.getElementById('btnAuth');
  var authLbl = document.getElementById('authLbl');
  function paintAuth() {
    var u = C.user();
    authBtn.classList.toggle('out', !u);
    authLbl.textContent = u ? C.shortId(u) : (window.innerWidth <= 440 ? 'in' : 'sign in');
  }
  authBtn.addEventListener('click', function () { C.openAuth(); });
  C.onAuth(paintAuth);

  paintAuth();
  setShowAll(showAll);   // renders once, in the mode the visitor left it in

  /* the intro runs after the doors exist, so it can hand off into them.
     It self-limits to once per session and skips under reduced motion. */
  try { window.SHDIntro && window.SHDIntro.play(); } catch (e) {}
})();
</script>

<script type="module">
/* ══════════════════════════════════════════════════════════════════════
   THE LIVING SOLIDS — one renderer, one canvas, scissored per tile.

   Each slot gets a slowly-turning sacred-geometry solid drawn in the UPPER
   region of its own rect, so it never collides with the text at the bottom
   (the canvas is transparent, so type reads straight through it).

   Strictly optional: any failure here leaves the page fully functional.
   ══════════════════════════════════════════════════════════════════════ */
import * as THREE from '/vendor/three/three.module.js';

const canvas = document.getElementById('gl');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' });
} catch (e) { console.warn('[enter] WebGL unavailable — tiles render without solids.', e); }

if (renderer) {
  renderer.setClearAlpha(0);
  renderer.setScissorTest(true);

  /* ── the solids ───────────────────────────────────────────────────────
     Neon wireframe over a near-black shell: the shell hides the back edges
     so the form reads as solid geometry rather than a wire tangle. */
  /* The shell hides the solid's back edges so it reads as geometry rather
     than a wire tangle — which means it has to match the PAGE, not be a fixed
     colour. Hardcoding obsidian turned every solid into a black blob on the
     two light skins. */
  /* Read the shell colour from the theme instead of keeping a hardcoded list
     of which skins are light. A new light theme used to silently turn every
     solid into a black blob until someone remembered to edit this file. */
  function shellColor() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--shell').trim();
    if (v) { const n = parseInt(v.replace('#', ''), 16); if (!isNaN(n)) return n; }
    return 0x06080b;
  }

  function neon(geo, color, opacity = 1) {
    const g = new THREE.Group();
    const shell = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: shellColor(), transparent: true, opacity: 0.86,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
    }));
    const wire = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo, 12),
      new THREE.LineBasicMaterial({ color, transparent: true, opacity })
    );
    g.add(shell, wire);
    return g;
  }
  function dust(color, count = 90, spread = 3.4) {
    const p = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) p[i] = (Math.random() - 0.5) * spread;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({ color, size: 0.022, transparent: true, opacity: 0.5 }));
  }

  const BUILD = {
    icosa: c => { const g = new THREE.Group();
      g.add(neon(new THREE.IcosahedronGeometry(1, 0), c));
      g.add(neon(new THREE.IcosahedronGeometry(0.52, 0), c, 0.45));
      g.add(dust(c, 120, 4)); return g; },
    dodeca: c => { const g = new THREE.Group();
      g.add(neon(new THREE.DodecahedronGeometry(1, 0), c));
      const rp = [];
      for (let i = 0; i < 64; i++) { const a = (i / 64) * Math.PI * 2; rp.push(new THREE.Vector3(Math.cos(a) * 1.45, Math.sin(a) * 1.45, 0)); }
      const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(rp),
        new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.32 }));
      ring.rotation.x = Math.PI / 2.6; g.add(ring); return g; },
    lattice: c => { const g = new THREE.Group();
      for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) {
        const b = neon(new THREE.BoxGeometry(0.46, 0.46, 0.46), c, 0.8);
        b.position.set(x * 0.62, y * 0.62, (x * y) * 0.28);
        g.add(b);
      } return g; },
    drum: c => { const g = new THREE.Group();
      // a miniature of Simple Mode's own wheel — the tile shows you the thing
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        const s = neon(new THREE.BoxGeometry(1.5, 0.34, 0.05), c, i === 0 ? 1 : 0.42);
        s.position.set(0, Math.sin(a) * 1.05, Math.cos(a) * 1.05);
        s.rotation.x = -a; g.add(s);
      }
      g.userData.axis = 'x';   // a drum spins on its own axis, not on Y
      return g; },
    graph: c => { const g = new THREE.Group();
      const nodes = [];
      for (let i = 0; i < 16; i++) {
        const v = new THREE.Vector3().setFromSphericalCoords(1.15,
          Math.acos(1 - 2 * (i + 0.5) / 16), Math.PI * (1 + Math.sqrt(5)) * i);
        nodes.push(v);
        const n = new THREE.Mesh(new THREE.SphereGeometry(0.062, 8, 8), new THREE.MeshBasicMaterial({ color: c }));
        n.position.copy(v); g.add(n);
      }
      const pts = [];
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++)
        if (nodes[i].distanceTo(nodes[j]) < 1.1) pts.push(nodes[i], nodes[j]);
      g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.34 })));
      return g; },
    isogrid: c => { const g = new THREE.Group();
      const grid = new THREE.GridHelper(2.6, 10, c, c);
      grid.material.transparent = true; grid.material.opacity = 0.4;
      g.add(grid);
      const t = neon(new THREE.BoxGeometry(0.44, 0.44, 0.44), c);
      t.position.y = 0.24; g.add(t);
      g.rotation.x = 0.34; return g; },
    terrain: c => { const g = new THREE.Group();
      const geo = new THREE.PlaneGeometry(2.8, 2.8, 18, 18);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++)
        pos.setZ(i, Math.sin(pos.getX(i) * 1.7) * Math.cos(pos.getY(i) * 1.7) * 0.34);
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: c, wireframe: true, transparent: true, opacity: 0.52 }));
      m.rotation.x = -Math.PI / 2.35; g.add(m); return g; },
    octa: c => { const g = new THREE.Group();
      g.add(neon(new THREE.OctahedronGeometry(1, 0), c));
      const o2 = neon(new THREE.OctahedronGeometry(0.62, 0), c, 0.5);
      o2.rotation.set(0.7, 0.7, 0); g.add(o2); return g; },
    chart: c => { const g = new THREE.Group();
      const h = [0.4, 0.75, 0.5, 1.05, 0.8, 1.35, 1.1];
      h.forEach((v, i) => {
        const b = neon(new THREE.BoxGeometry(0.2, v, 0.2), c, 0.55 + i * 0.06);
        b.position.set((i - 3) * 0.31, v / 2 - 0.6, 0); g.add(b);
      }); return g; }
  };

  /* One scene per slot, all sharing the renderer via scissor. */
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.z = 4.1;
  let cells = [];

  function build() {
    cells.forEach(c => c.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
    }));
    cells = [];
    document.querySelectorAll('.slot').forEach(el => {
      const m = window.SHDModules.byId(el.dataset.module);
      if (!m) return;
      const make = BUILD[m.geo] || BUILD.icosa;
      const scene = new THREE.Scene();
      const obj = make(new THREE.Color(m.accent));
      scene.add(obj);
      cells.push({ el, scene, obj, seed: Math.random() * 6.28 });
    });
  }
  window.addEventListener('shd:slots', build);
  /* a skin change flips the shell between obsidian and bone, so the solids
     have to be rebuilt — the colour is baked into the material */
  let lastSkin = document.documentElement.getAttribute('data-theme-skin');
  new MutationObserver(() => {
    const now = document.documentElement.getAttribute('data-theme-skin');
    if (now !== lastSkin) { lastSkin = now; build(); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme-skin'] });
  build();

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  }
  window.addEventListener('resize', resize);
  resize();

  let paused = document.hidden;
  document.addEventListener('visibilitychange', () => { paused = document.hidden; });

  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    if (paused || !cells.length) return;
    const t = clock.getElapsedTime();
    const H = window.innerHeight;

    for (const c of cells) {
      const r = c.el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > H || r.width < 2) continue;

      // upper 62% of the tile — the text lives in the lower third
      const h = r.height * 0.62;
      const x = r.left, y = H - r.top - h;
      if (h < 2) continue;

      renderer.setViewport(x, y, r.width, h);
      renderer.setScissor(x, y, r.width, h);
      camera.aspect = r.width / h;
      camera.updateProjectionMatrix();

      if (!reduced) {
        if (c.obj.userData.axis === 'x') {
          // the drum turns on its own axis with a fixed three-quarter tilt,
          // so it always reads as one wheel rather than scattered plates
          c.obj.rotation.set(t * 0.22 + c.seed, 0.42, 0.08);
        } else {
          c.obj.rotation.y = t * 0.19 + c.seed;
          c.obj.rotation.x = Math.sin(t * 0.32 + c.seed) * 0.16;
        }
        c.obj.position.y = Math.sin(t * 0.55 + c.seed) * 0.05;
      } else {
        c.obj.rotation.set(c.obj.userData.axis === 'x' ? 0.5 : 0.2, c.obj.userData.axis === 'x' ? 0.42 : 0.6 + c.seed, 0);
      }
      renderer.render(c.scene, camera);
    }
  }
  frame();
}
</script>
</body>
</html>
