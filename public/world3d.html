<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHADDAI World 3D</title>
<style>
:root{--gold:#e8c45c;--ink:#06080b;--em:#00ff9c;--cy:#5fe0ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;color:#eee;touch-action:none;user-select:none}
canvas{display:block}
#loading{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#161b26,#06080b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#loading:not([hidden]){display:flex}
#loading[hidden]{display:none}
#loading h1{margin:0;font-weight:700;letter-spacing:.3em;color:var(--gold);font-size:28px}
#bar{width:min(360px,70vw);height:6px;background:#1a2030;border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .2s}
#loadmsg{font-size:12px;color:#8b93a6;letter-spacing:.08em}
.panel{position:fixed;z-index:10;background:rgba(8,11,18,.62);backdrop-filter:blur(8px);border:1px solid rgba(232,196,92,.28);border-radius:12px;padding:10px 14px;box-shadow:0 0 24px rgba(0,255,156,.08)}
#top{top:12px;left:12px}
#top b{color:var(--gold);letter-spacing:.14em;font-size:13px}
#top div{font-size:12px;color:#b8c0d0;margin-top:3px}
#who{color:var(--em)!important;font-size:14px!important;font-weight:600}
#chars{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:60vw}
#chars button{background:rgba(8,11,18,.7);color:#dfe6f3;border:1px solid rgba(232,196,92,.3);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;letter-spacing:.06em}
#chars button.on{border-color:var(--em);color:var(--em);box-shadow:0 0 14px rgba(0,255,156,.35)}
#help{top:12px;right:12px;font-size:12px;line-height:1.7;color:#b8c0d0;max-width:230px}
#help kbd{background:#1b2232;border:1px solid #33405c;border-radius:5px;padding:0 6px;color:var(--gold);font-size:11px}
#prompt{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:12;padding:9px 18px;border-radius:24px;background:rgba(8,11,18,.78);border:1px solid var(--gold);color:var(--gold);font-size:14px;letter-spacing:.06em;display:none;text-shadow:0 0 10px rgba(232,196,92,.5)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:12;font-size:22px;letter-spacing:.2em;color:#fff;text-shadow:0 0 18px var(--cy);opacity:0;transition:opacity .5s;pointer-events:none;text-align:center}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .45s}
#joy{position:fixed;left:24px;bottom:110px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(232,196,92,.4);background:rgba(8,11,18,.35);z-index:11;display:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(0,255,156,.35);border:1px solid var(--em)}
.tb{position:fixed;right:18px;z-index:11;width:64px;height:64px;border-radius:50%;background:rgba(8,11,18,.6);border:2px solid var(--gold);color:var(--gold);font-weight:700;display:none;align-items:center;justify-content:center}
@media (hover:none){#joy,.tb{display:flex}#help{display:none}}
</style></head><body>
<div id="loading"><h1>SHADDAI</h1><div id="bar"><i></i></div><div id="loadmsg">waking the world…</div></div>
<div id="fade"></div><div id="toast"></div><div id="prompt"></div>
<div class="panel" id="top"><b>SHADDAI · WORLD 3D</b><div id="realm">City Hub · Dusk</div><div id="who"></div></div>
<div class="panel" id="help"><kbd>W A S D</kbd> move · <kbd>Shift</kbd> run<br><kbd>Drag</kbd> look · <kbd>Wheel</kbd> zoom<br><kbd>E</kbd> interact / ride / enter<br><kbd>F</kbd> strike · <kbd>G</kbd> cast<br><kbd>1–6</kbd> switch hero · <kbd>L</kbd> light<br><kbd>Space</kbd>/<kbd>C</kbd> fly up/down (hawk)</div>
<div id="chars"></div>
<div id="joy"><i></i></div>
<div class="tb" id="tbE" style="bottom:120px">E</div><div class="tb" id="tbF" style="bottom:198px">F</div><div class="tb" id="tbR" style="bottom:42px">RUN</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };

/* ───────────────────────── renderer / scene ───────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1400);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.5, 0.95);
composer.addPass(bloom); composer.addPass(new OutputPass());

/* ── lighting rulebook: one preset per time-of-day/realm mood (color-harmony noted) ── */
const PRESETS = {
  dusk:   { label: 'City Hub · Dusk',      harmony: 'complementary (gold/violet)', sky: ['#1a1240', '#f0a45a'], fog: '#2b1d4d', fogN: 70, fogF: 520, hemi: ['#6a5bb0', '#12261f', 0.75], sun: ['#ffb26b', 2.6, [-60, 38, 40]], bloom: 0.72, exp: 0.9, stars: 0.35 },
  day:    { label: 'City Hub · Day',       harmony: 'analogous (sky/emerald)',     sky: ['#2f7dd6', '#cfe8ff'], fog: '#bcd9f2', fogN: 90, fogF: 640, hemi: ['#cfe6ff', '#3f6b3f', 0.95], sun: ['#fff1d6', 3.2, [70, 90, 40]], bloom: 0.35, exp: 1.0, stars: 0 },
  night:  { label: 'City Hub · Night',     harmony: 'split-complementary (blue/gold)', sky: ['#02030a', '#0c1436'], fog: '#050a1a', fogN: 50, fogF: 420, hemi: ['#28407a', '#050a08', 0.55], sun: ['#7aa2ff', 1.1, [-50, 70, -30]], bloom: 1.05, exp: 1.15, stars: 1 },
  desert: { label: 'Desert Terminal · Dusk', harmony: 'triadic (rust/teal/gold)',  sky: ['#41224a', '#ff9a4a'], fog: '#5c2f2a', fogN: 60, fogF: 480, hemi: ['#ff9d6a', '#4a2418', 0.8], sun: ['#ffae5c', 2.9, [80, 30, -20]], bloom: 0.6, exp: 1.05, stars: 0.2 },
  inside: { label: 'Shop Interior',        harmony: 'monochromatic gold',          sky: ['#0a0812', '#0a0812'], fog: '#0d0a14', fogN: 60, fogF: 240, hemi: ['#8f7a4a', '#120e08', 0.9], sun: ['#ffd9a0', 0.0, [0, 30, 0]], bloom: 0.35, exp: 0.85, stars: 0 },

const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=clamp(p.y*1.4+.15,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.7)),1.);}' });
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), skyMat); scene.add(sky);
const starPts = (() => { const g = new THREE.BufferGeometry(), a = []; for (let i = 0; i < 900; i++) { const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u); a.push(900 * r * Math.cos(t), Math.abs(900 * u) * 0.9 + 40, 900 * r * Math.sin(t)); } g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3)); const m = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false })); scene.add(m); return m; })();
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = -70; sc.right = 70; sc.top = 70; sc.bottom = -70; sc.near = 1; sc.far = 300; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;

let presetName = 'dusk', presetCur = null, presetK = 1;
function applyPreset(name, instant) {
  presetName = name; const p = PRESETS[name]; presetK = instant ? 1 : 0; presetCur = presetCur || {};
  targetPreset = p; if (instant) blendPreset(1);
  $('#realm').textContent = p.label;
}
let targetPreset = PRESETS.dusk; const cols = { top: new THREE.Color(), bot: new THREE.Color(), fog: new THREE.Color(), h1: new THREE.Color(), h2: new THREE.Color(), sun: new THREE.Color() };
const cur = { hemiI: 0.8, sunI: 2, bloom: 0.6, exp: 1, fogN: 70, fogF: 500, stars: 0, sunPos: new THREE.Vector3(-60, 38, 40) };
scene.fog = new THREE.Fog(0x000000, 70, 500);
function blendPreset(k) {
  const p = targetPreset, t = (a, b) => a.lerp(new THREE.Color(b), k);
  t(cols.top, p.sky[0]); t(cols.bot, p.sky[1]); t(cols.fog, p.fog); t(cols.h1, p.hemi[0]); t(cols.h2, p.hemi[1]); t(cols.sun, p.sun[0]);
  cur.hemiI = lerp(cur.hemiI, p.hemi[2], k); cur.sunI = lerp(cur.sunI, p.sun[1], k); cur.bloom = lerp(cur.bloom, p.bloom, k); cur.exp = lerp(cur.exp, p.exp, k);
  cur.fogN = lerp(cur.fogN, p.fogN, k); cur.fogF = lerp(cur.fogF, p.fogF, k); cur.stars = lerp(cur.stars, p.stars, k); cur.sunPos.lerp(new THREE.Vector3(...p.sun[2]), k);
  skyMat.uniforms.top.value.copy(cols.top); skyMat.uniforms.bot.value.copy(cols.bot);
  scene.fog.color.copy(cols.fog); scene.fog.near = cur.fogN; scene.fog.far = cur.fogF;
  hemi.color.copy(cols.h1); hemi.groundColor.copy(cols.h2); hemi.intensity = cur.hemiI; sun.color.copy(cols.sun); sun.intensity = cur.sunI;
  bloom.strength = cur.bloom; renderer.toneMappingExposure = cur.exp; starPts.material.opacity = cur.stars;
}
applyPreset('dusk', true);

/* ───────────────────────── loading ───────────────────────── */
const gltf = new GLTFLoader(); gltf.setMeshoptDecoder(MeshoptDecoder);
const texLoader = new THREE.TextureLoader();
let loadTotal = 40, loadDone = 0;
const tick = (msg) => { loadDone++; $('#bar i').style.width = Math.min(100, (loadDone / loadTotal) * 100) + '%'; if (msg) $('#loadmsg').textContent = msg; };
const loadG = async (url, msg) => { try { const g = await gltf.loadAsync(url); tick(msg); return g; } catch (e) { console.warn('load fail', url, e); tick(); return null; } };
const tex = (name, rep, srgb = true) => { const t = texLoader.load(`assets/terrain/${name}.webp`); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };

/* ───────────────────────── terrain ───────────────────────── */
const world = new THREE.Group(); scene.add(world);
const colliders = [];
function buildTerrain() {
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshStandardMaterial({ map: tex('emerald-grass', 90), roughness: 0.95, metalness: 0 }));
  grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; world.add(grass);
  // second, larger-scale translucent layer breaks the visible repeat grid of the tile
  const g2t = tex('emerald-grass', 37); g2t.rotation = 0.7; g2t.center.set(0.5, 0.5);
  const grass2 = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshBasicMaterial({ map: g2t, transparent: true, opacity: 0.5, depthWrite: false, color: 0x9fd0a0, fog: true }));
  grass2.rotation.x = -Math.PI / 2; grass2.position.y = 0.015; world.add(grass2);
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(36, 96), new THREE.MeshStandardMaterial({ map: tex('obsidian-plaza', 40), roughness: 0.4, metalness: 0.25, envMapIntensity: 0.6 }));
  plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.02; plaza.receiveShadow = true; world.add(plaza);
  const ringM = new THREE.MeshBasicMaterial({ color: 0xe8c45c }); [36.2, 24, 12].forEach((r, i) => { const m = new THREE.Mesh(new THREE.RingGeometry(r - 0.18, r, 128), ringM); m.rotation.x = -Math.PI / 2; m.position.y = 0.05; world.add(m); });
  const cobT = tex('tech-cobble-street', 4);
  const cobM = new THREE.MeshStandardMaterial({ map: cobT, roughness: 0.55, metalness: 0.2, emissive: 0x3a2400, emissiveMap: cobT, emissiveIntensity: 0.9 });
  for (let i = 0; i < 4; i++) { const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 150), cobM.clone()); road.material.map = cobT.clone(); road.material.map.needsUpdate = true; road.material.map.repeat.set(2, 30); road.material.emissiveMap = road.material.map; road.rotation.x = -Math.PI / 2; road.rotation.z = i * Math.PI / 2; road.position.set(Math.sin(i * Math.PI / 2) * 111, 0.03, Math.cos(i * Math.PI / 2) * 111); road.receiveShadow = true; world.add(road); }
  const water = new THREE.Mesh(new THREE.CircleGeometry(20, 64), new THREE.MeshStandardMaterial({ map: tex('teal-water', 5), roughness: 0.1, metalness: 0.6, emissive: 0x0a3a44, emissiveIntensity: 0.8 }));
  water.rotation.x = -Math.PI / 2; water.position.set(120, 0.04, -20); world.add(water); waterMesh = water;
  const desert = new THREE.Mesh(new THREE.CircleGeometry(90, 64), new THREE.MeshStandardMaterial({ map: tex('red-regolith', 24), roughness: 1 }));
  desert.rotation.x = -Math.PI / 2; desert.position.set(420, 0.03, 0); desert.receiveShadow = true; world.add(desert);
  const pad = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ map: tex('obsidian-plaza', 16), roughness: 0.3, metalness: 0.4 })); pad.rotation.x = -Math.PI / 2; pad.position.set(420, 0.05, 0); world.add(pad);
  const lava = new THREE.Mesh(new THREE.CircleGeometry(38, 64), new THREE.MeshStandardMaterial({ map: tex('lava-crust', 8), emissive: 0xff2a8a, emissiveMap: tex('lava-crust', 8), emissiveIntensity: 0.6, roughness: 0.6 }));
  lava.rotation.x = -Math.PI / 2; lava.position.set(-190, 0.03, -160); world.add(lava);
}
let waterMesh;

/* ───────────────────────── static models ───────────────────────── */
async function place(name, o) {
  const g = await loadG(`assets/models/${name}.glb`, name); if (!g) return null;
  const m = g.scene, box = new THREE.Box3().setFromObject(m), sz = box.getSize(new THREE.Vector3());
  const s = o.h ? o.h / sz.y : o.w / Math.max(sz.x, sz.z); m.scale.setScalar(s); m.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(m), c = b2.getCenter(new THREE.Vector3());
  m.position.set(-c.x, -b2.min.y + (o.y || 0), -c.z);
  const grp = new THREE.Group(); grp.add(m); grp.position.set(o.x, 0, o.z); grp.rotation.y = o.ry || 0; world.add(grp);
  m.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; if (n.material) { n.material.envMapIntensity = 0.45; if (n.material.emissiveIntensity > 0.01) n.material.emissiveIntensity *= 0.6; if (n.material.map) n.material.map.anisotropy = 8; } } });
  if (o.r) colliders.push({ x: o.x, z: o.z, r: o.r });
  grp.userData = { size: sz.clone().multiplyScalar(s) };
  return grp;
}

/* ───────────────────────── characters ───────────────────────── */
const HEROES = [
  { id: 'zerox', name: 'ZEROX', role: 'Revenue', accent: '#00c8ff' }, { id: 'quill', name: 'QUILL', role: 'Writing', accent: '#e0a060' },
  { id: 'oracle', name: 'ORACLE', role: 'Research', accent: '#a06bff' }, { id: 'turtle', name: 'TURTLE', role: 'Design', accent: '#00ff9c' },
  { id: 'leadr', name: 'Leadr', role: 'Citizen', accent: '#ff7a3a' }, { id: 'gaeli', name: 'Gaeli', role: 'Citizen', accent: '#b6ff3a' },
];
const charSrc = {}, clipSrc = {};
// in-place retarget: rotations are portable; per-bone translations are baked to the donor's limbs (squash), and
// Hips X/Z is root motion (causes sliding/snapping on loop) -> keep Hips Y only, rescaled to the body.
function retarget(clip, body, name) {
  const hips = body.getObjectByName('Hips'), tracks = [];
  for (const t of clip.tracks) {
    if (t.name.endsWith('.quaternion')) { tracks.push(t); continue; }
    if (t.name === 'Hips.position' && hips) {
      const v = Float32Array.from(t.values), n = v.length / 3, d0 = v[1] || 1, k = hips.position.y / d0;
      for (let i = 0; i < n; i++) { v[i * 3] = hips.position.x; v[i * 3 + 1] = t.values[i * 3 + 1] * k; v[i * 3 + 2] = hips.position.z; }
      tracks.push(new THREE.VectorKeyframeTrack(t.name, t.times, v));

  }
  return new THREE.AnimationClip(name, clip.duration, tracks);
}
function makeActor(id, opts = {}) {
  const src = charSrc[id]; if (!src) return null;
  const model = SkeletonUtils.clone(src.scene), root = new THREE.Group(); root.add(model);
  model.updateMatrixWorld(true);
  const wp = (n) => { const o = model.getObjectByName(n); return o ? new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).y : null; };
  const hy = wp('Head'), fy = Math.min(wp('LeftToeBase') ?? 0, wp('RightToeBase') ?? 0);
  const k = 1.8 / ((hy - fy) * 1.12 || 1); model.scale.setScalar(k); model.position.y = -fy * k;   // every hero = 1.8 m, feet on the ground

  ['slash', 'cast'].forEach((c) => { if (A[c]) { A[c].setLoop(THREE.LoopOnce, 1); A[c].clampWhenFinished = true; } });
  const a = { id, root, model, mixer, A, cur: null, speed: 0, yaw: 0, busy: 0, hero: HEROES.find((h) => h.id === id) };

}
function play(a, name, fade = 0.2, ts = 1) {

  if (a.cur === n) return; n.reset(); n.enabled = true; n.setEffectiveWeight(1);
  if (a.cur) { a.cur.crossFadeTo(n, fade, false); } n.play(); a.cur = n; a.curName = name;
}
function locomote(a, speed, dt) {
  if (a.busy > 0) return;
  if (speed < 0.15) play(a, 'idle', 0.25, 1);
  else if (speed < 3.4) play(a, 'walk', 0.2, clamp(speed / 1.5, 0.6, 1.9));
  else play(a, 'run', 0.2, clamp(speed / 3.9, 0.8, 1.7));
}
function strike(a, kind) {
  const n = a.A[kind]; if (!n || a.busy > 0) return;
  play(a, kind, 0.12, 1); a.busy = n.getClip().duration * 0.95;
  vfxBurst(a, kind);
}
function makeLabel(text, color = '#ffffff', scale = 1) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.font = '700 54px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = color; g.shadowBlur = 18; g.fillStyle = color; g.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false })); s.scale.set(3.2 * scale, 0.8 * scale, 1); return s;
}

/* ───────────────────────── VFX ───────────────────────── */
const vfx = [];
function vfxBurst(a, kind) {
  const col = new THREE.Color(a.hero.accent), g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 8, 48), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));

  // camera (damped orbit, collision-free)
  const c = state.cam, cp = new THREE.Vector3(Math.sin(c.yaw) * Math.cos(c.pitch), Math.sin(c.pitch), Math.cos(c.yaw) * Math.cos(c.pitch)).multiplyScalar(c.dist * (mountedOn ? 1.5 : 1)).add(camTarget);

/* ───────────────────────── portal shader ───────────────────────── */
function makePortal(pos, ry, col) {
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { t: { value: 0 }, c: { value: new THREE.Color(col) } },
    vertexShader: 'varying vec2 u;void main(){u=uv-.5;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'varying vec2 u;uniform float t;uniform vec3 c;void main(){float r=length(u);if(r>.5)discard;float a=atan(u.y,u.x);float w=sin(a*5.+r*22.-t*3.)*.5+.5;float w2=sin(a*3.-r*14.+t*2.)*.5+.5;float g=(1.-r*2.)*(.55+.45*w*w2)+smoothstep(.42,.5,r)*.9;gl_FragColor=vec4(c*g*1.6,clamp(g,0.,.95));}' });
  portalMats.push(m); const mesh = new THREE.Mesh(new THREE.CircleGeometry(2.7, 48).translate(0, 0, 0), m); mesh.geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(mesh.geometry.attributes.uv.array.map((v) => v)), 2));
  mesh.position.copy(pos); mesh.rotation.y = ry; world.add(mesh); return mesh;
}
