<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRID GRIDIRON // SHADDAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00ff88; --cyan:#00f0ff; --red:#ff1a1a; --mag:#ff2bd6;
    --bg:#000; --dim:#0a0f0d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:#cfe;cursor:default;-webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;background:#000;}
  canvas{position:absolute;inset:0;display:block;image-rendering:optimizeSpeed;}
  /* CRT scanline overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:39;
    box-shadow:inset 0 0 180px rgba(0,255,136,0.05), inset 0 0 60px rgba(0,0,0,0.7);}
  #exit{position:fixed;top:12px;right:14px;z-index:60;
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;
    color:var(--red);background:rgba(10,0,0,0.55);border:1px solid var(--red);
    padding:8px 12px;border-radius:6px;cursor:pointer;user-select:none;
    text-shadow:0 0 8px var(--red);box-shadow:0 0 14px rgba(255,26,26,0.35);
    transition:all .15s;}
  #exit:hover{background:var(--red);color:#000;box-shadow:0 0 22px var(--red);}
  #hint{position:fixed;left:0;right:0;bottom:8px;z-index:35;text-align:center;
    font-size:12px;letter-spacing:1px;color:#7fe;opacity:.85;pointer-events:none;
    text-shadow:0 0 6px rgba(0,240,255,.5);}
  #hint b{color:var(--green);}
  @media (max-width:640px){#hint{font-size:10px;bottom:110px;}}

  /* ===== TOUCH CONTROLS (shown on touch devices) ===== */
  #touch{position:fixed;inset:0;z-index:50;pointer-events:none;display:none;}
  #touch.on{display:block;}
  .tbtn{position:fixed;pointer-events:auto;user-select:none;
    font-family:'Orbitron',sans-serif;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid rgba(0,240,255,.5);
    background:rgba(0,20,26,.5);color:#8ff;text-shadow:0 0 6px #0ff;
    box-shadow:0 0 12px rgba(0,240,255,.2);}
  .tbtn:active{background:rgba(0,240,255,.25);}
  #tpad{position:fixed;left:14px;bottom:26px;width:150px;height:150px;pointer-events:auto;
    border-radius:50%;border:1px solid rgba(0,255,136,.35);background:rgba(0,20,14,.35);}
  #tstick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;background:rgba(0,255,136,.35);border:1px solid #0f8;box-shadow:0 0 14px #0f8;}
  #tACT{right:24px;bottom:96px;width:92px;height:92px;font-size:16px;color:#0f8;border-color:#0f8;text-shadow:0 0 6px #0f8;}
  #tTUR{right:120px;bottom:36px;width:74px;height:74px;font-size:13px;color:#ff2bd6;border-color:#ff2bd6;text-shadow:0 0 6px #ff2bd6;}
  #tSW{right:24px;bottom:20px;width:66px;height:66px;font-size:12px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="vig"></div>
<div id="crt"></div>
<button id="exit">✕ EXIT</button>

<div id="touch">
  <div id="tpad"><div id="tstick"></div></div>
  <div id="tACT" class="tbtn">ACT</div>
  <div id="tTUR" class="tbtn">TURBO</div>
  <div id="tSW" class="tbtn">SW</div>
</div>

<div id="hint">
  <b>WASD/ARROWS</b> move &nbsp;·&nbsp; <b>SHIFT</b> turbo &nbsp;·&nbsp; <b>SPACE</b> snap / throw / juke / tackle &nbsp;·&nbsp; <b>C</b> catch-assist &nbsp;·&nbsp; <b>E</b> cycle receiver / switch &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>ESC</b> exit
</div>

<script>
(function(){
"use strict";

/* ============================ EXIT ============================ */
function doExit(){
  try{ if(window.parent && window.parent!==window && window.parent.closeGame){ window.parent.closeGame(); return; } }catch(e){}
  try{ window.close(); }catch(e){}
  if(history.length>1){ history.back(); } else { location.href="/"; }
}
document.getElementById('exit').addEventListener('click', doExit);

/* ============================ CANVAS ============================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeView();
}
window.addEventListener('resize', resize);

/* ============================ AUDIO ============================ */
var AC=null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol,when){
  var a=audio(); if(!a) return;
  when = when||0; dur=dur||0.12; type=type||'square'; vol=(vol==null?0.18:vol);
  var t=a.currentTime+when;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol){
  var a=audio(); if(!a) return;
  var n=Math.floor((a.sampleRate)*dur);
  var buf=a.createBuffer(1,n,a.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  var s=a.createBufferSource(); s.buffer=buf;
  var g=a.createGain(); g.gain.value=vol||0.15;
  var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sndFanfare(){ var seq=[523,659,784,1046,1318]; for(var i=0;i<seq.length;i++){ beep(seq[i],0.16,'square',0.16,i*0.10);} beep(1046,0.5,'sawtooth',0.10,seq.length*0.10); }
function sndTackle(){ beep(90,0.16,'square',0.22,0); noiseBurst(0.12,0.18); }
function sndBigHit(){ beep(70,0.22,'sawtooth',0.28,0); noiseBurst(0.20,0.26); beep(110,0.10,'square',0.18,0.02); }
function sndWhistle(){ beep(2100,0.09,'square',0.10,0); beep(2100,0.09,'square',0.10,0.12); }
function sndThrow(){ noiseBurst(0.16,0.09); beep(340,0.12,'sawtooth',0.08,0); }
function sndCatch(){ beep(880,0.08,'square',0.14,0); beep(1240,0.10,'square',0.12,0.06); }
function sndFirst(){ beep(660,0.10,'square',0.14,0); beep(990,0.14,'square',0.14,0.10); }
function sndSnap(){ beep(180,0.06,'square',0.12,0); }
function sndBad(){ beep(200,0.18,'sawtooth',0.14,0); beep(140,0.22,'sawtooth',0.12,0.12); }
function sndFire(){ beep(300,0.10,'sawtooth',0.14,0); beep(500,0.10,'sawtooth',0.14,0.08); beep(760,0.16,'sawtooth',0.14,0.16); }
function sndJuke(){ beep(1400,0.05,'square',0.10,0); beep(900,0.06,'square',0.09,0.05); }
function sndBlip(f){ beep(f||900,0.04,'square',0.09,0); }

/* ============================ AGENT RATINGS ============================ */
// qb=accuracy, wr=receiving, def=defense — affects throw scatter + AI decisions
var AGENT_RATING = {
  SHADDAI: {qb:0.90, wr:0.80, def:0.75},
  NEXUS:   {qb:0.85, wr:0.75, def:0.80},
  ORACLE:  {qb:0.80, wr:0.85, def:0.70},
  ZEROX:   {qb:0.50, wr:0.85, def:0.65},
  TURTLE:  {qb:0.55, wr:0.90, def:0.60},
  QUILL:   {qb:0.70, wr:0.78, def:0.55},
  PIKADON: {qb:0.35, wr:0.65, def:0.90}
};

/* ============================ AGENT ABILITIES ============================ */
// Each agent has 2-3 signature abilities matching their real identity.
// Effects are wired into the sim via getEffectiveRating + per-play modifiers.
//
// EXTENSIBILITY HOOK: forged agents can supply abilities via
//   GET /api/football/agent-kit/:id → {abilities:['cannon_arm','sticky_hands',...]}
// loadForgedAbilities() below fetches that endpoint and merges into AGENT_ABILITIES.
// If the endpoint is unavailable, the council table below is the fallback.
//
// Ability vocabulary:
//   cannon_arm    = +QB accuracy (less throw scatter)
//   field_general = smarter/quicker AI throws + wider open-read threshold
//   sticky_hands  = +WR catch radius (catchR bonus)
//   ankle_breaker = longer iframe on juke + sharper dash (juke cd reduced)
//   truck_stick   = RB/carrier breaks first tackle (power through)
//   burner        = +speed on carrier
//   lockdown      = +DB coverage tightness (cover shadows receiver earlier)
//   big_hit       = harder tackle — knockback+stun on contact
//   ball_hawk     = +INT/deflect chance for that team's defense
//   pass_rush     = DL/LB pressure speed boost vs QB
var AGENT_ABILITIES = {
  SHADDAI: ['field_general','cannon_arm'],
  NEXUS:   ['cannon_arm','field_general'],
  ORACLE:  ['field_general','ball_hawk'],
  ZEROX:   ['truck_stick','big_hit'],
  TURTLE:  ['ankle_breaker','sticky_hands'],
  QUILL:   ['sticky_hands','cannon_arm'],
  PIKADON: ['lockdown','big_hit','ball_hawk']
  // forged agents: added dynamically by loadForgedAbilities()
};

// Full skill defs (master list) — used as skill pool for SKILLPLAY
var ALL_SKILL_DEFS = [
  {id:'cannon_arm',    label:'Cannon Arm',    icon:'🎯', desc:'+QB accuracy, less scatter',      boost:{qb:0.18}},
  {id:'field_general', label:'Field General', icon:'🧠', desc:'+QB decision speed + read',        boost:{qbDecision:0.30}},
  {id:'sticky_hands',  label:'Sticky Hands',  icon:'🧤', desc:'+WR catch radius',                 boost:{wr:0.20}},
  {id:'ankle_breaker', label:'Ankle Breaker', icon:'💨', desc:'+juke dodge window & speed',       boost:{spd:0.18, ankleBreaker:1}},
  {id:'truck_stick',   label:'Truck Stick',   icon:'🚛', desc:'Break first tackle with power',    boost:{truckStick:1}},
  {id:'burner',        label:'Burner',        icon:'⚡', desc:'+speed all players',               boost:{spd:0.25}},
  {id:'lockdown',      label:'Lockdown',      icon:'🛡', desc:'+DB coverage, tighter shadow',     boost:{def:0.22, lockdown:1}},
  {id:'big_hit',       label:'Big Hit',       icon:'💥', desc:'Harder tackles — knockback+stun', boost:{bigHit:1}},
  {id:'ball_hawk',     label:'Ball Hawk',     icon:'🦅', desc:'+INT/deflect chance on defense',  boost:{def:0.18, ballHawk:1}},
  {id:'pass_rush',     label:'Pass Rush',     icon:'🌪', desc:'+DL/LB pressure speed vs QB',     boost:{passRush:1}}
];

/* Return the skill defs for the currently selected agent (for SKILLPLAY).
   Falls back to a sensible generic set if agent not found. */
function agentSkillDefs(){
  var idx = G.teams.YOU;
  var abils = [];
  if(idx != null){
    var id = AGENTS[idx].id;
    abils = AGENT_ABILITIES[id] || [];
  }
  if(!abils.length) abils = ['cannon_arm','sticky_hands'];
  // map ability ids to full skill defs
  var out = [];
  for(var i=0;i<abils.length;i++){
    for(var j=0;j<ALL_SKILL_DEFS.length;j++){
      if(ALL_SKILL_DEFS[j].id===abils[i]){ out.push(ALL_SKILL_DEFS[j]); break; }
    }
  }
  return out;
}

// Active skill defs for the current SKILLPLAY session (set when entering skill select)
var SKILL_DEFS = ALL_SKILL_DEFS.slice(0,5);  // overwritten by agentSkillDefs() on mode confirm
var skillPickMax = 2;
var skillPicked = [];
var skillBoosts = {qb:0, wr:0, def:0, spd:0, qbDecision:0, ankleBreaker:0, truckStick:0, lockdown:0, bigHit:0, ballHawk:0, passRush:0};

function applySkillBoosts(){
  skillBoosts={qb:0,wr:0,def:0,spd:0,qbDecision:0,ankleBreaker:0,truckStick:0,lockdown:0,bigHit:0,ballHawk:0,passRush:0};
  for(var i=0;i<skillPicked.length;i++){
    var sk=SKILL_DEFS[skillPicked[i]]; if(!sk) continue;
    for(var k in sk.boost){ if(sk.boost.hasOwnProperty(k)) skillBoosts[k]=(skillBoosts[k]||0)+sk.boost[k]; }
  }
}

/* hasAbility(team, abilId): returns true if that team's agent has the named passive ability
   (used for always-on effects in PLAY and WATCH modes) */
function hasAbility(team, abilId){
  var idx = agentIdx(team);
  if(idx==null) return false;
  var id = AGENTS[idx].id;
  var abils = AGENT_ABILITIES[id] || [];
  return abils.indexOf(abilId) >= 0;
}

/* loadForgedAbilities: async hook for forged agents.
   Fetches GET /api/football/agent-kit/:id and merges abilities into AGENT_ABILITIES.
   Safe to call at any time; silently ignored if endpoint unavailable. */
function loadForgedAbilities(agentId){
  if(!agentId || AGENT_ABILITIES[agentId]) return; // council agents already loaded
  try{
    fetch('/api/football/agent-kit/'+encodeURIComponent(agentId))
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ if(d&&Array.isArray(d.abilities)){ AGENT_ABILITIES[agentId]=d.abilities; } })
      .catch(function(){});
  }catch(e){}
}

function getEffectiveRating(baseRat, team){
  // only boost the human team in skill/watch modes
  if(team!==HUMAN) return baseRat;
  return {
    qb: Math.min(1.0, baseRat.qb + skillBoosts.qb),
    wr: Math.min(1.0, baseRat.wr + skillBoosts.wr),
    def: Math.min(1.0, baseRat.def + skillBoosts.def)
  };
}

// for WATCH/SKILL: badge + mode indicator drawn on HUD
var modeBadgeEl = null;
function showModeBadge(){
  if(modeBadgeEl) return;
  modeBadgeEl = document.createElement('div');
  modeBadgeEl.id='modeBadge';
  var txt = (MODE==='watch') ? '📺 SIMULATING' : '🧬 SKILLPLAY';
  var col = (MODE==='watch') ? '#00f0ff' : '#ff2bd6';
  modeBadgeEl.textContent = txt;
  modeBadgeEl.style.cssText='position:fixed;left:14px;top:12px;z-index:60;font-family:Orbitron,sans-serif;font-weight:800;font-size:12px;letter-spacing:1px;color:'+col+';background:rgba(0,10,14,.6);border:1px solid '+col+';padding:7px 12px;border-radius:6px;box-shadow:0 0 12px rgba(0,240,255,.25);pointer-events:none;';
  document.body.appendChild(modeBadgeEl);
}
function removeModeBadge(){ if(modeBadgeEl){ modeBadgeEl.parentNode&&modeBadgeEl.parentNode.removeChild(modeBadgeEl); modeBadgeEl=null; } }

function humanControlActive(){
  // WATCH and SKILL modes: AI drives everything
  if(MODE==='watch'||MODE==='skill') return false;
  if(G.state==='LIVE'||G.state==='THROWN') return true;
  if(G.state==='PRESNAP' && G.offenseTeam!==HUMAN) return true; // shuffle defender
  return false;
}

/* MODE-SELECT state (inserted between TITLE/SELECT and match start) */
var G_MODESEL = false;   // true when we're on the mode-select step
var G_SKILLSEL = false;  // true when we're on the skill-pick step (SKILLPLAY only)
var MODE = 'play';       // 'play' | 'watch' | 'skill' — MUST be declared: strict-mode assignment to an undeclared MODE threw ReferenceError, silently breaking confirmMode()/mode-select

function gotoModeSelect(){
  G_MODESEL=true; G_SKILLSEL=false;
  G.state='SELECT'; // reuse SELECT draw hook — mode select overlays after team pick
  sndBlip(900);
}
function confirmMode(m){
  MODE=m; G_MODESEL=false;
  if(m==='skill'){
    // Build SKILL_DEFS from the selected agent's own abilities
    SKILL_DEFS = agentSkillDefs();
    if(!SKILL_DEFS.length) SKILL_DEFS = ALL_SKILL_DEFS.slice(0,3);
    skillPickMax = Math.min(2, SKILL_DEFS.length);
    skillPicked=[]; applySkillBoosts();
    G_SKILLSEL=true; sndBlip(1100);
  } else {
    skillPicked=[]; applySkillBoosts(); G_SKILLSEL=false;
    if(m==='watch'){ showModeBadge(); }
    sndFirst(); startMatch();
  }
}
function confirmSkillPlay(){
  G_SKILLSEL=false;
  applySkillBoosts();
  showModeBadge();
  sndFirst(); startMatch();
}

function getQBRating(team){
  var idx=agentIdx(team);
  if(idx!=null){
    var id=AGENTS[idx].id;
    var base=AGENT_RATING[id]||{qb:0.7};
    return getEffectiveRating(base,team).qb;
  }
  return 0.7;
}

/* ============================ AGENT TEAMS ============================ */
var AGENTS = [
  {id:'SHADDAI', color:'#ffcf1a'},
  {id:'NEXUS',   color:'#00f0ff'},
  {id:'ORACLE',  color:'#b06bff'},
  {id:'ZEROX',   color:'#ff9d3d'},
  {id:'TURTLE',  color:'#ff2bd6'},
  {id:'QUILL',   color:'#f5e000'},
  {id:'PIKADON', color:'#ff2a2a'}
];
/* ---- team-name generator (deterministic: same agent => same name) ---- */
var MASCOTS=['BLITZ','TITANS','VOLTAGE','REAPERS','PHANTOMS','GUARDIANS','SERAPHS','RONIN','HAVOC','OVERLORDS'];
function teamName(agentId){
  // hash the id to a fixed mascot index — no Math.random per frame
  var h=0;
  for(var ci=0;ci<agentId.length;ci++){ h=(h*31+agentId.charCodeAt(ci))&0xffff; }
  return agentId+' '+MASCOTS[h%MASCOTS.length];
}
function teamNameForTeam(t){
  var idx=agentIdx(t);
  if(idx!=null) return teamName(AGENTS[idx].id);
  return t===HUMAN?'YOU BLITZ':'CPU HAVOC';
}

AGENTS.forEach(function(a){
  a.ready=false;
  var img=new Image();
  img.onload=function(){ a.ready=true; };
  img.onerror=function(){ a.ready=false; };
  img.src='/assets/agents/'+a.id+'-portrait.png';
  a.img=img;

  /* action-art: cinematic football image, falls back to portrait */
  a.artReady=false;
  var art=new Image();
  art.onload=function(){ a.artReady=true; };
  art.onerror=function(){
    /* fallback: reuse portrait img already loaded */
    a.artReady=false;
  };
  art.src='/sports/football/assets/players/'+a.id+'.png?v=cine1';
  a.art=art;
});

function shade(hex,amt){
  if(hex.charAt(0)!=='#') return hex;
  var c=hex.replace('#',''); if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return 'rgb('+r+','+g+','+b+')';
}
function contrast(hex){
  if(hex.charAt(0)!=='#') return '#fff';
  var c=hex.replace('#',''); if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)>150?'#0a0a0a':'#ffffff';
}
function teamCol(t){
  var idx = (t===HUMAN)? G.teams.YOU : G.teams.CPU;
  if(idx!=null) return AGENTS[idx].color;
  return t===HUMAN? '#00f0ff':'#ff5a3c';
}
function agentIdx(t){ return (t===HUMAN)? G.teams.YOU : G.teams.CPU; }
function agentName(t){
  var idx=agentIdx(t);
  if(idx!=null) return AGENTS[idx].id;
  return t===HUMAN?'YOU':'CPU';
}
/* returns the best image object for an AGENTS entry (art preferred, then portrait) */
function bestImg(a){
  if(!a) return null;
  if(a.artReady) return a.art;
  if(a.ready)    return a.img;
  return null;
}

/* ============================ AUTOPLAY (bot mode) — behind ?autoplay=1 ============================ */
var AGENT_IDS=['SHADDAI','NEXUS','ORACLE','ZEROX','TURTLE','QUILL','PIKADON'];
var AP={on:false, agent:null, idx:0, t0:0, wait:0, reported:false};
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var a=(q.get('autoplay')||'').toLowerCase();
    AP.on=(a==='1'||a==='true');
    var ag=(q.get('agent')||'').toUpperCase();
    var ix=AGENT_IDS.indexOf(ag);
    if(ix<0) ix=Math.floor(Math.random()*AGENT_IDS.length);
    AP.idx=ix; AP.agent=AGENT_IDS[ix];
  }catch(e){ AP.on=false; }
})();
function apBadge(){
  if(!AP.on || document.getElementById('apBadge')) return;
  var b=document.createElement('div'); b.id='apBadge';
  b.textContent='◈ AUTOPLAY — '+AP.agent;

/* ============================ FIELD / PSEUDO-3D VIEW ============================ */
var FIELD_W = 53.3;          // sideline to sideline (yards)
var MIDY = FIELD_W/2;
var FDIST = 20;              // yards to first down (Blitz-style short field)

// perspective params
var CAM_BEHIND = 15;         // yards the near plane sits behind the focus point
var CAMD = 30;               // camera distance constant (bigger = flatter)
var horizonY=0, baseY=0, PPX=0, PLAYER_H=0;
var camBackX = 0, camTarget = 0;
var shakeX=0, shakeY=0, shakeMag=0;

function computeView(){
  horizonY = H*0.15;
  baseY    = H*0.94;
  PPX      = W/62;           // px per yard of width, at the near plane (scale=1)
  PLAYER_H = Math.max(46, H*0.17);
}
// project a field point (x=yardline, y=width) -> screen {x,y,s=depthScale}
function proj(x,y){
  var dz = x - camBackX;
  if(dz < -(CAMD-3)) dz = -(CAMD-3);
  var s = CAMD/(CAMD+dz);
  var yy = horizonY + (baseY-horizonY)*s;
  var xx = W/2 + (y-MIDY)*PPX*s;
  return {x:xx+shakeX, y:yy+shakeY, s:s};
}
function SX(x,y){ return proj(x,y).x; }
function SY(x,y){ return proj(x,y).y; }
function addShake(m){ shakeMag = Math.max(shakeMag, m); }
function clampY(v){ return Math.max(0.5, Math.min(FIELD_W-0.5, v)); }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* ============================ CONSTANTS ============================ */
var HUMAN='YOU', CPU='CPU';
var QUARTERS=4, QLEN=40;     // game-seconds per quarter (ticks only during live play)
function other(t){ return t===HUMAN?CPU:HUMAN; }

var PLAYS = [
  {name:'SLANT',  sub:'quick slants',   type:'pass', routes:{WR1:[[4,0],[12,7]],  WR2:[[4,0],[12,-7]],  RB:[[3,7]]}},
  {name:'STREAK', sub:'go deep',        type:'pass', routes:{WR1:[[28,-1]],       WR2:[[28,1]],         RB:[[5,6]]}},
  {name:'CROSS',  sub:'crossing routes',type:'pass', routes:{WR1:[[7,0],[18,15]], WR2:[[7,0],[18,-15]], RB:[[3,-6]]}},
  {name:'DIVE',   sub:'hand off & run', type:'run',  routes:{WR1:[[16,-1]],       WR2:[[16,1]],         RB:[[9,0]]}}
];

var gQB=null, gRB=null, gWR1=null, gWR2=null, gOL1=null, gOL2=null;
var ball = {carrier:null, targetRec:null, inAir:false, x:0,y:0,z:0, t:0, dur:0, spin:0, sx:0, sy:0, tx:0, ty:0, swat:false, jumpPressed:false};
var eligible=[], selRec=0, selPlay=0, humanDef=null;
// QB charge-throw state

// Hit a nav button at canvas coords (mx, my)

/* ============================ ENTITIES ============================ */
function mkP(team,role,x,y){
  var r = (role==='OL'||role==='DL') ? 0.95 : 0.82;
  return {team:team, role:role, num:0, x:x, y:y, x0:x, y0:y, vx:0, vy:0, face:0, r:r,
          route:null, routeIdx:0, anim:Math.random()*6.28,
          turbo:1, turboActive:false, iframe:0, jcd:0, truckCd:0, diveT:0, stun:0, blocked:0, burst:0,
          crossedLOS:false, cover:null, spd:0, jumpLift:0};
}

function nearestTo(arr, p){
  var best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var d=dist(arr[i],p); if(d<bd){bd=d;best=arr[i];} }
  return best;
}

function buildFormation(){
  computeView();
  var L=G.los, oc=G.offenseTeam, dc=other(oc);
  // CHANGE 6: Spread formation wider — WRs out to ±19, OL ±4.2, QB deeper
  gQB = mkP(oc,'QB', L-5, MIDY);            gQB.num=7;
  gOL1= mkP(oc,'OL', L-1, MIDY-4.2);        gOL1.num=66;
  gOL2= mkP(oc,'OL', L-1, MIDY+4.2);        gOL2.num=74;
  gWR1= mkP(oc,'WR', L-0.5, MIDY-19);       gWR1.num=81;
  gWR2= mkP(oc,'WR', L-0.5, MIDY+19);       gWR2.num=88;
  gRB = mkP(oc,'RB', L-6, MIDY+2.0);        gRB.num=28;
  OFF=[gQB,gOL1,gOL2,gWR1,gWR2,gRB];

  var dl1=mkP(dc,'DL', L+1.8, MIDY-4),  dl2=mkP(dc,'DL', L+1.8, MIDY+4);
  var lb1=mkP(dc,'LB', L+7,   MIDY-6.5),lb2=mkP(dc,'LB', L+7,   MIDY+6.5);
  var db1=mkP(dc,'DB', L+13,  MIDY-18), db2=mkP(dc,'DB', L+13,  MIDY+18);
  dl1.num=99; dl2.num=93; lb1.num=54; lb2.num=58; db1.num=24; db2.num=29;
  db1.cover=gWR1; db2.cover=gWR2; lb2.cover=gRB;
  DEF=[dl1,dl2,lb1,lb2,db1,db2];

  players=OFF.concat(DEF);
  ball.carrier=gQB; ball.inAir=false; ball.targetRec=null; ball.swat=false;
  ball.jumpPressed=false;
  ball.x=gQB.x; ball.y=gQB.y; ball.z=0;
  eligible=[gWR1,gWR2,gRB]; selRec=0;
  humanDef = nearestTo(DEF, gQB);
  // reset charge state
  qbCharge.active=false; qbCharge.t=0;
  applyPlay(selPlay);
}

function setRoute(p, wps){
  p.route = wps.map(function(w){ return {x:p.x0+w[0], y:clampY(p.y0+w[1])}; });
  p.routeIdx=0;
}
function applyPlay(idx){
  var pl=PLAYS[idx]; G.playType=pl.type;
  setRoute(gWR1, pl.routes.WR1);
  setRoute(gWR2, pl.routes.WR2);
  setRoute(gRB,  pl.routes.RB);
}
function cpuPickPlay(){
  var r=Math.random();
  if(G.down>=3 && (G.firstDown-G.los)>8) return Math.random()<0.6?2:1; // need yards -> cross/streak
  if(r<0.34) return 0; if(r<0.55) return 1; if(r<0.78) return 2; return 3;
}

/* ============================ FLOW ============================ */
function newGame(){
  G.state='TITLE'; G.scoreYou=0; G.scoreCpu=0; G.offenseTeam=HUMAN;
  G.down=1; G.los=20; G.firstDown=G.los+FDIST; G.quarter=1; G.clock=QLEN; G.clockDead=false;
  G.result=''; G.win=false;
  G.streak={YOU:0,CPU:0}; G.fire={YOU:false,CPU:false};
  G.teams={YOU:null, CPU:null};
  particles.length=0; popups.length=0; flames.length=0; shakeMag=0;
  selPlay=0; titleFlash=2.2;
  buildFormation();
}
function gotoSelect(){
  audio();
  G.state='SELECT'; selPhase=0; selIdx=0; G.teams={YOU:null, CPU:null};
  G_MODESEL=false; G_SKILLSEL=false; MODE='play';
  removeModeBadge(); skillPicked=[]; applySkillBoosts();
  sndBlip(1100);
}
function confirmSelect(){
  if(G_MODESEL){ /* handled by modeBtn clicks */ return; }
  if(G_SKILLSEL){ /* handled by skillBtn clicks */ return; }
  if(selPhase===0){
    G.teams.YOU=selIdx;

    selIdx=(selIdx+1)%AGENTS.length;   // default to a different agent

}
function startMatch(){
  audio();
  // Attempt to load forged-agent abilities if agent is not in council
  if(G.teams.YOU!=null) loadForgedAbilities(AGENTS[G.teams.YOU].id);
  if(G.teams.CPU!=null) loadForgedAbilities(AGENTS[G.teams.CPU].id);
  G.scoreYou=0; G.scoreCpu=0; G.offenseTeam=HUMAN;
  G.down=1; G.los=20; G.firstDown=G.los+FDIST; G.quarter=1; G.clock=QLEN; G.clockDead=false;
  G.result=''; G.win=false;
  G.streak={YOU:0,CPU:0}; G.fire={YOU:false,CPU:false};
  particles.length=0; popups.length=0; flames.length=0; shakeMag=0;
  titleFlash=0; modeReported=false;
  startDown();
}

function startDown(){
  buildFormation();
  var watchMode=(MODE==='watch'||MODE==='skill');
  if(G.offenseTeam===HUMAN && !watchMode){
    selPlay=0; applyPlay(selPlay);
    G.state='PLAYCALL';
  } else {
    selPlay=cpuPickPlay(); applyPlay(selPlay);
    G.state='PRESNAP'; snapTimer=watchMode?0.8:1.5;
  }
}
function confirmPlay(){
  applyPlay(selPlay);
  G.state='PRESNAP'; snapTimer=0;  // human snaps manually
}
function doSnap(){
  audio(); sndSnap();
  G.state='LIVE'; G.playElapsed=0; G.clockDead=false;
  if(G.playType==='run'){ ball.carrier=gRB; }
  else { ball.carrier=gQB; }
  ball.carrier.turbo=1;
  if(humanDef) humanDef.turbo=1;
}

function throwBall(){
  var qb=gQB, r=eligible[selRec];
  if(!r) return;
  // CHANGE 1+2: Slower flight (16 base), charge modifies ±20%, higher arc
  var chargeRatio = qbCharge.active ? Math.min(1, qbCharge.t/qbCharge.maxT) : 0.5;
  var flightSpeed = 14 + chargeRatio*4;  // 14–18 range (slow/catchable)
  qbCharge.active=false; qbCharge.t=0;

  var dx=r.x-qb.x, dy=r.y-qb.y, d=Math.hypot(dx,dy);
  var dur=Math.max(0.45, d/flightSpeed);

  // QB accuracy scatter: poor QB = larger wobble in tx/ty
  var qbRat = getQBRating(G.offenseTeam);
  var scatter = (1.0 - qbRat) * 5.5;  // max ~5.5 yards scatter at qb=0 (PIKADON)
  var scatterX = (Math.random()*2-1)*scatter;
  var scatterY = (Math.random()*2-1)*scatter;

  var tx=r.x + r.vx*dur*0.85 + scatterX;
  var ty=clampY(r.y + r.vy*dur*0.85 + scatterY);

  ball.inAir=true; ball.targetRec=r; ball.swat=false; ball.jumpPressed=false;
  ball.sx=qb.x; ball.sy=qb.y; ball.tx=tx; ball.ty=ty;
  ball.x=qb.x; ball.y=qb.y; ball.z=0; ball.t=0; ball.dur=dur; ball.spin=0;
  ball.carrier=null;
  G.state='THROWN'; sndThrow();
}

/* ---- possession / scoring resolution ---- */
function offScore(pts){ if(G.offenseTeam===HUMAN) G.scoreYou+=pts; else G.scoreCpu+=pts; }

function bumpStreak(team){
  G.streak[team]++;
  G.streak[other(team)]=0;
  G.fire[other(team)]=false;
  if(G.streak[team]>=3 && !G.fire[team]){
    G.fire[team]=true; fireFlash[team]=2.0; sndFire();
    announce('ON FIRE!', teamCol(team), true);
  }
}
function coolStreak(team){ G.streak[team]=0; G.fire[team]=false; }

function endPlay(spotX, opt){
  opt=opt||{};
  var carrier = ball.carrier || eligible[selRec] || gQB;
  var gain = Math.round((spotX - G.los)*10)/10;

  // TOUCHDOWN
  if(opt.touchdown){
    tdFX(spotX);
    offScore(7);   // 6 + auto extra point
    bumpStreak(G.offenseTeam);
    announce('TOUCHDOWN!', teamCol(G.offenseTeam), true);
    banner('TOUCHDOWN  +7', teamCol(G.offenseTeam));
    kickoffFlip();
    goDead(1.6); return;
  }

  // INTERCEPTION
  if(opt.intercept){
    sndBad(); addShake(9);
    announce('INTERCEPTED!', '#ff1a1a', true);
    banner('INTERCEPTED — TURNOVER', '#ff1a1a');
    var interceptor = other(G.offenseTeam);
    bumpStreak(interceptor);
    coolStreak(G.offenseTeam);
    G.offenseTeam = interceptor;
    G.los = Math.max(2, Math.min(98, spotX));
    G.down=1; G.firstDown=Math.min(100, G.los+FDIST);
    goDead(1.5); return;
  }

  // INCOMPLETE
  if(opt.incomplete){
    sndBad(); addShake(3);
    if(opt.swat){ announce('BROKEN UP!', '#00f0ff'); }
    banner('INCOMPLETE', '#ff2bd6');
    G.down++;
    coolStreak(G.offenseTeam);
    checkDowns(); return;
  }

  // TACKLE / OOB
  var big = !!opt.bigHit;
  if(opt.oob){ sndWhistle(); addShake(3); }
  else if(big){ sndBigHit(); addShake(15); flingFX(carrier); }
  else { sndTackle(); addShake(6); }

  if(big){
    announce('BIG HIT!', teamCol(other(G.offenseTeam)), true);
    bumpStreak(other(G.offenseTeam));   // defense gets the hype
  }

  var newLos=Math.max(0.5, Math.min(99.5, spotX));
  popup(SX(spotX,carrier.y), SY(spotX,carrier.y)-30, (gain>=0?'+':'')+gain+' YDS', gain>=8?'#00ff88':'#00f0ff');
  if(gain>=15){ bumpStreak(G.offenseTeam); announce("HE'S ROLLING!", '#00ff88'); }

  if(newLos >= G.firstDown){
    sndFirst();
    G.los=newLos; G.down=1; G.firstDown=Math.min(100, newLos+FDIST);
    announce('FIRST DOWN!', teamCol(G.offenseTeam));
    banner((big?'BIG HIT · ':'')+'FIRST DOWN  '+(gain>=0?'+':'')+gain, '#00ff88');
    goDead(1.2); return;
  }
  G.los=newLos; G.down++;
  banner((opt.oob?'OUT OF BOUNDS · ':(big?'BIG HIT · ':'TACKLE · '))+(gain>=0?'+':'')+gain+' YDS',
         gain>=8?'#00ff88':'#00f0ff');
  checkDowns();
}
function checkDowns(){
  if(G.down>4){
    sndBad();
    announce('TURNOVER ON DOWNS', '#ff1a1a', true);
    banner('TURNOVER ON DOWNS', '#ff1a1a');
    coolStreak(G.offenseTeam);
    G.offenseTeam = other(G.offenseTeam);
    G.down=1; G.firstDown=Math.min(100, G.los+FDIST);
  }
  goDead(1.3);
}
function kickoffFlip(){
  G.offenseTeam = other(G.offenseTeam);
  G.los=20; G.down=1; G.firstDown=G.los+FDIST;
}
function goDead(t){ G.state='DEAD'; deadTimer=t; }

function proceedAfterDead(){
  if(G.clockDead){
    G.quarter++;
    if(G.quarter>QUARTERS){ gameOver(); return; }
    G.clock=QLEN; G.clockDead=false;
    announce('QUARTER '+G.quarter, '#00f0ff');
  }
  startDown();
}
function gameOver(){
  if(G.state==='OVER') return;
  G.state='OVER';
  G.win = G.scoreYou>G.scoreCpu;
  if(G.win) sndFanfare(); else sndBad();
  if(AP.on){ apReport(G.scoreYou, G.win); }   // score = player team points
  // watch/skill mode: also report result to arcade + leaderboard
  if((MODE==='watch'||MODE==='skill') && !modeReported && !AP.on){
    modeReported=true;
    var s=G.scoreYou, ag=(G.teams.YOU!=null)?AGENTS[G.teams.YOU].id:'UNKNOWN';
    try{ fetch('/api/arcade/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'football',agent:ag,score:s,win:!!G.win,mode:MODE,skills:skillPicked.map(function(i){return SKILL_DEFS[i]?SKILL_DEFS[i].id:'';})})}).catch(function(){}); }catch(e){}
    try{ window.parent.postMessage({type:'arcadeResult',game:'football',agent:ag,score:s,win:!!G.win,mode:MODE},'*'); }catch(e){}
  }
}

/* ============================ FX ============================ */
function banner(t,c){ G.result=t; G.resultColor=c||'#00ff88'; }
function announce(txt,color,big){ popup(W/2, H*0.28, txt, color||'#00ff88', big?1.8:1.2, big!==false); }
function popup(px,py,txt,color,life,big){ popups.push({x:px,y:py,txt:txt,color:color||'#0ff',life:life||1.1,max:life||1.1,big:!!big}); }
function spawnParticles(cx,cy,n,cols,spdMax){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28, sp=40+Math.random()*(spdMax||300);
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.5+Math.random()*0.8,max:1.3,size:2+Math.random()*4,
      color:cols[(Math.random()*cols.length)|0]});
  }
}
function tdFX(x){
  addShake(16); sndFanfare();
  var yy=(ball.carrier||gQB).y;
  spawnParticles(SX(x,yy),SY(x,yy),120,['#00ff88','#00f0ff','#ffffff','#ff2bd6'],380);
}
function flingFX(p){
  spawnParticles(SX(p.x,p.y),SY(p.x,p.y),26,['#ffffff','#ff2bd6','#00f0ff'],420);
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life-=dt; if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=340*dt; p.vx*=0.985; p.vy*=0.985; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(var j=popups.length-1;j>=0;j--){ var q=popups[j]; q.life-=dt; q.y-=(q.big?16:32)*dt; if(q.life<=0) popups.splice(j,1); }
  for(var k=flames.length-1;k>=0;k--){ var f=flames[k]; f.life-=dt; f.y-=60*dt; f.x+=f.vx*dt; if(f.life<=0) flames.splice(k,1); }
  // CHANGE 3: update juke ghosts
  for(var g=jukeGhosts.length-1;g>=0;g--){ var gh=jukeGhosts[g]; gh.life-=dt; if(gh.life<=0){ jukeGhosts.splice(g,1); } }
}
function spawnFlame(x,y){
  flames.push({x:x+(Math.random()*2-1)*6, y:y, vx:(Math.random()*2-1)*10,
    life:0.3+Math.random()*0.25, max:0.55, size:3+Math.random()*5,
    color:Math.random()<0.5?'#ff8a00':(Math.random()<0.5?'#ff2bd6':'#ffdd00')});
}

/* ============================ INPUT ============================ */
var keys={};
function keyName(e){
  var k=e.key;
  if(k===' '||k==='Spacebar') return 'space';
  if(k==='Shift') return 'shift';
  if(k==='Escape') return 'esc';
  return k.toLowerCase();
}
window.addEventListener('keydown', function(e){
  var k=keyName(e);
  if(['space','arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].indexOf(k)>=0) e.preventDefault();
  if(k==='esc'){
    // ESC on SELECT screens = navigate back; on OVER = main menu; otherwise exit
    if(G.state==='SELECT' || G.state==='OVER'){ navBack(); return; }
    doExit(); return;
  }
  if(AP.on) return;   // ignore real input while autoplaying
  if(k==='r'){ if(G.teams.YOU!=null && G.teams.CPU!=null){ MODE='play'; removeModeBadge(); skillPicked=[]; applySkillBoosts(); startMatch(); } else newGame(); return; }
  if(!e.repeat){
    if(k==='space') onAction();
    if(k==='c') onCatchAssist();
    if(k==='e') onSwitch();
    if(k==='a'||k==='arrowleft'){
      if(G.state==='PLAYCALL'){ selPlay=(selPlay+PLAYS.length-1)%PLAYS.length; applyPlay(selPlay); sndBlip(700); }
      else if(G.state==='SELECT'){ selMove(-1); }
    }
    if(k==='d'||k==='arrowright'){
      if(G.state==='PLAYCALL'){ selPlay=(selPlay+1)%PLAYS.length; applyPlay(selPlay); sndBlip(700); }
      else if(G.state==='SELECT'){ selMove(1); }
    }
  }
  keys[k]=true;
});
window.addEventListener('keyup', function(e){
  var k=keyName(e);
  keys[k]=false;
  // CHANGE 2: Release SPACE fires the charged throw (only if charge was started)
  if(!AP.on && k==='space' && qbCharge.active && G.state==='LIVE'){
    throwBall();
  }
});
window.addEventListener('blur', function(){ keys={}; qbCharge.active=false; qbCharge.t=0; });
canvas.addEventListener('pointerdown', function(e){
  if(AP.on) return;   // ignore real input while autoplaying
  audio();
  var r2=canvas.getBoundingClientRect();
  var mx2=e.clientX-r2.left, my2=e.clientY-r2.top;
  if(hitNavBtn(mx2, my2)) return;  // nav button takes priority
  if(G.state==='TITLE'){ gotoSelect(); return; }
  if(G.state==='OVER'){ gotoSelect(); return; }
  if(G.state==='SELECT'){
    var mx=mx2, my=my2;
    // Mode select overlay
    if(G_MODESEL){
      for(var mi=0;mi<modeBtns.length;mi++){
        var mb=modeBtns[mi];
        if(mx>=mb.x&&mx<=mb.x+mb.w&&my>=mb.y&&my<=mb.y+mb.h){ sndBlip(1000); confirmMode(mb.mode); return; }
      }
      return;
    }
    // Skill select overlay
    if(G_SKILLSEL){
      for(var si=0;si<skillBtns.length;si++){
        var sb=skillBtns[si];
        if(mx>=sb.x&&mx<=sb.x+sb.w&&my>=sb.y&&my<=sb.y+sb.h){
          if(sb.action==='confirm'){ sndBlip(1300); confirmSkillPlay(); return; }
          if(sb.action==='skill'){
            var idx=sb.idx;
            var already=skillPicked.indexOf(idx);
            if(already>=0){ skillPicked.splice(already,1); sndBlip(700); }
            else if(skillPicked.length<skillPickMax){ skillPicked.push(idx); sndBlip(1100); }
            return;
          }
        }
      }
      return;
    }
    // Normal card select
    for(var ci=0;ci<selCards.length;ci++){
      var c=selCards[ci];
      if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h){
        if(selPhase===1 && ci===G.teams.YOU) return;
        selIdx=ci; confirmSelect(); return;
      }
    }
  }
});

function selMove(dir){
  var n=AGENTS.length;
  do{ selIdx=(selIdx+dir+n)%n; } while(selPhase===1 && selIdx===G.teams.YOU);
  sndBlip(760);
}

function moveVec(){
  var dx=touchVec.x, dy=touchVec.y;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  var m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  return {x:dx,y:dy};
}

// humanControlActive() defined earlier in MODE section
function controlledPlayer(){
  if(G.offenseTeam===HUMAN){
    if(G.state==='THROWN') return ball.targetRec || gQB;
    return ball.carrier || gQB;
  }
  return humanDef;
}

function onAction(){
  if(AP.on) return;   // ignore real input while autoplaying
  audio();
  if(G.state==='TITLE'){ gotoSelect(); return; }
  if(G.state==='SELECT'){
    if(G_MODESEL){ confirmMode('play'); return; }   // default SPACE = PLAY mode
    if(G_SKILLSEL){ confirmSkillPlay(); return; }
    confirmSelect(); return;
  }
  if(G.state==='OVER'){ gotoSelect(); return; }
  if(G.state==='DEAD'){ deadTimer=Math.min(deadTimer,0.05); return; }
  if(G.state==='PLAYCALL'){ confirmPlay(); return; }
  if(G.state==='PRESNAP'){ if(G.offenseTeam===HUMAN) doSnap(); return; }
  if(G.state==='LIVE'){
    var c=controlledPlayer();
    if(G.offenseTeam===HUMAN){
      // CHANGE 2: Begin charge-throw on SPACE press (release will fire via keyup)
      if(c===gQB && G.playType!=='run' && !gQB.crossedLOS && gQB.x<=G.los+0.4){
        qbCharge.active=true; qbCharge.t=0; return;
      }
      doJuke(c); return;
    } else { doDive(c); return; }
  }
  if(G.state==='THROWN'){
    // CHANGE 1: SPACE on offense side = jump-to-catch attempt
    if(G.offenseTeam===HUMAN){
      var pr=Math.min(1,ball.t/ball.dur);
      if(pr>0.50){ ball.jumpPressed=true; beep(1100,0.07,'square',0.12,0); } // feedback beep
      return;
    }
    var d=controlledPlayer();
    if(G.offenseTeam!==HUMAN){ doDive(d); } // swat attempt
    return;
  }
}
// (charge-throw fires on keyup — handled by the main keyup listener)
function onSwitch(){
  if(AP.on) return;
  if(G.state==='SELECT'){ selMove(1); return; }
  if(G.offenseTeam===HUMAN){
    if((G.state==='PLAYCALL'||G.state==='LIVE') && !ball.inAir){
      selRec=(selRec+1)%eligible.length; sndBlip(1000);
    }
  } else {
    // switch to defender nearest the ball
    var ref = ball.carrier || {x:ball.x,y:ball.y};
    var cand=null, bd=1e9;
    for(var i=0;i<DEF.length;i++){ if(DEF[i]===humanDef) continue; var d=dist(DEF[i],ref); if(d<bd){bd=d;cand=DEF[i];} }
    if(cand){ humanDef=cand; sndBlip(1000); }
  }
}
/* ============================ CATCH ASSIST (C key) ============================ */
function onCatchAssist(){
  if(AP.on) return;
  if(MODE==='watch'||MODE==='skill') return;  // spectator modes, no human input
  if(G.state!=='THROWN') return;
  if(G.offenseTeam!==HUMAN) return;  // only on offense
  // Find eligible receiver nearest the ball landing point
  var best=null, bd=1e9;
  for(var i=0;i<eligible.length;i++){
    var r=eligible[i];
    var d=Math.hypot(r.x-ball.tx, r.y-ball.ty);
    if(d<bd){ bd=d; best=r; }
  }
  if(!best) return;
  // Magnet: snap receiver toward ball landing spot
  var pullStr = 0.55;  // how far they jump toward landing (0=none, 1=teleport)
  best.x += (ball.tx - best.x) * pullStr;
  best.y = clampY(best.y + (ball.ty - best.y) * pullStr);
  // Mark as jump-catch attempt for radius bonus
  ball.jumpPressed = true;
  ball.targetRec = best;
  selRec = eligible.indexOf(best);
  beep(1300, 0.06, 'square', 0.12, 0);
  popup(SX(best.x, best.y), SY(best.x, best.y)-44, 'C ASSIST!', '#00ff88', 0.8, true);
}

// CHANGE 3: Juke ghost/afterimage + particles
var jukeGhosts=[];
function doJuke(c){
  if(!c||c.jcd>0) return;
  // pick a random lateral dash direction (opposite to nearest defender)
  var nd=nearestTo(DEF,c);
  var dashY = nd? (nd.y>c.y ? c.y-4.5 : c.y+4.5) : c.y+(Math.random()<0.5?-4.5:4.5);
  // ankle_breaker: longer iframe + shorter cooldown (passive for agent, or via skill boost)
  var ankleBonus = hasAbility(c.team,'ankle_breaker') || skillBoosts.ankleBreaker>0;
  c.iframe = ankleBonus ? 0.52 : 0.38;
  c.burst  = ankleBonus ? 0.60 : 0.48;
  c.jcd    = ankleBonus ? 0.90 : 1.30;
  // spawn 3 ghost afterimages at current pos
  for(var g=0;g<3;g++){
    jukeGhosts.push({x:SX(c.x,c.y), y:SY(c.x,c.y), col:teamCol(c.team), life:0.28+g*0.08, max:0.44, s:proj(c.x,c.y).s, alpha:0.55-g*0.12});
  }
  // burst particles
  var col=teamCol(c.team);
  spawnParticles(SX(c.x,c.y),SY(c.x,c.y),14,[col,'#ffffff','#00ff88'],220);
  // move player laterally
  c.vy = (dashY-c.y>0?1:-1) * 22;
  popup(SX(c.x,c.y),SY(c.x,c.y)-42,'JUKE!','#00ff88',0.9,true);
  sndJuke();
}
function doDive(c){
  if(!c||c.diveT>0) return;
  c.diveT=0.34; c.burst=0.30;
  if(ball.inAir) ball.swat=true;
}

/* ============================ MOVEMENT / AI ============================ */
function integrate(p, tx, ty, speed, dt){
  var dx=tx-p.x, dy=ty-p.y, m=Math.hypot(dx,dy)||1;
  p.vx=dx/m*speed; p.vy=dy/m*speed;
  p.x+=p.vx*dt; p.y=clampY(p.y+p.vy*dt);
  if(m>0.05) p.face=Math.atan2(p.vy,p.vx);
  p.anim+=speed*dt*1.4;
}
function baseSpeed(p){
  var base;
  switch(p.role){
    case 'WR': base=9.6; break; case 'DB': base=9.4; break; case 'RB': base=9.0; break;
    case 'LB': base=8.9; break; case 'DL': base=8.3; break; case 'QB': base=8.4; break;
    case 'OL': base=7.4; break; default: base=8.6;
  }
  // burner: +speed for that team's offensive players
  if(hasAbility(p.team,'burner') || (p.team===HUMAN && skillBoosts.spd>0.15)){
    if(p.team===G.offenseTeam) base += 1.4;
  }
  // pass_rush: DL/LB get bonus speed when chasing QB
  if((p.role==='DL'||p.role==='LB') && (hasAbility(p.team,'pass_rush') || (p.team===HUMAN && skillBoosts.passRush>0))){
    base += 1.8;
  }
  return base;
}

function humanMove(p, dt){
  var mv=moveVec(), mag=Math.hypot(mv.x,mv.y);
  var wantTurbo = (keys['shift']||touchTurbo) && p.turbo>0.02;
  var fireBoost = (G.fire[p.team] && (p===ball.carrier)) ? 2.2 : 0;
  var spd = (p.team===G.offenseTeam? 9.2 : 9.5) + fireBoost;   // snappier
  if(wantTurbo && mag>0){ spd += 4.0; p.turbo=Math.max(0,p.turbo-dt*0.55); p.turboActive=true; }
  else { p.turbo=Math.min(1,p.turbo+dt*0.35); p.turboActive=false; }
  if(p.burst>0){ spd+=4.4; }
  p.diveT=Math.max(0,p.diveT-dt);
  if(p.diveT>0) spd+=3.0;
  // Screen-relative controls: the field projects x(yardline)->vertical, y(width)->horizontal.
  // So W/S must drive downfield/back (p.x) and A/D must strafe sideways (p.y).
  // W (mv.y=-1) = forward/up-screen = +x. D (mv.x=+1) = screen-right = +y.
  if(mag>0){ p.vx=-mv.y*spd; p.vy=mv.x*spd; p.face=Math.atan2(p.vy,p.vx); }
  else { p.vx*=0.45; p.vy*=0.45; }   // quicker stop = snappier feel
  p.x+=p.vx*dt; p.y=clampY(p.y+p.vy*dt);
  p.anim+=(Math.abs(p.vx)+Math.abs(p.vy))*dt*1.4;
  if(p.role==='QB' && p.x>G.los+0.3) p.crossedLOS=true;
}

function aiRoute(p, dt){
  var goalX, goalY;
  if(p.route && p.routeIdx<p.route.length){
    var wp=p.route[p.routeIdx];
    goalX=wp.x; goalY=wp.y;
    if(Math.hypot(wp.x-p.x, wp.y-p.y)<1.6) p.routeIdx++;
  } else {
    goalX=p.x+18; goalY=p.y; // drift downfield
  }
  var avx=0,avy=0;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<5){ avx+=(p.x-d.x)/(dd+0.2); avy+=(p.y-d.y)/(dd+0.2); } }
  integrate(p, goalX+avx*0.7, goalY+avy*0.7, baseSpeed(p), dt);
}
function aiBlock(p, dt){
  var best=null,bd=1e9;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<bd){bd=dd;best=d;} }
  if(best){
    integrate(p, best.x+best.vx*0.1, best.y+best.vy*0.1, baseSpeed(p), dt);
    if(bd<1.5){ best.blocked=0.08; }
  }
}
function aiQB(qb, dt){
  if(G.playElapsed<0.65){ // drop back
    integrate(qb, G.los-7, MIDY+(Math.sin(G.playElapsed*4)*1.5), 6.5, dt);
    return;
  }
  var pressure=1e9;
  for(var i=0;i<DEF.length;i++){ var d=dist(DEF[i],qb); if(d<pressure) pressure=d; }
  var best=null, bestScore=-1, bestIdx=0;
  for(var r=0;r<eligible.length;r++){
    var rec=eligible[r];
    var open=1e9; for(var j=0;j<DEF.length;j++){ var dd=dist(DEF[j],rec); if(dd<open)open=dd; }
    var score=open + (rec.x-G.los)*0.12;
    if(score>bestScore){ bestScore=score; best=rec; bestIdx=r; }
  }
  // field_general: QB reads faster + wider open threshold
  var fieldGen = hasAbility(G.offenseTeam,'field_general') || (skillBoosts.qbDecision>0.15);
  var openThresh = fieldGen ? 3.2 : 4.2;
  var throwDeadline = fieldGen ? 1.6 : 2.0;
  var openEnough = best && (bestScore>openThresh || G.playElapsed>throwDeadline);
  if(openEnough && pressure>2.0){
    selRec=bestIdx; throwBall(); return;
  }
  if(pressure<2.4 || G.playElapsed>3.2){
    qb.crossedLOS = qb.x>G.los+0.3;
    var ty=qb.y + (qb.y<MIDY?-1:1)*2;
    integrate(qb, qb.x+8, clampY(ty), 8.8, dt);
    return;
  }
  integrate(qb, G.los-6, qb.y+(pressure<5? (qb.y<MIDY?-1:1)*3:0), 5.5, dt);
}
function aiRun(p, dt){
  p.jcd=Math.max(0,p.jcd-dt); p.iframe=Math.max(0,p.iframe-dt);
  p.truckCd=Math.max(0,p.truckCd-dt); p.burst=Math.max(0,p.burst-dt);
  var nd=null, ndDist=1e9;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<ndDist){ndDist=dd;nd=d;} }
  var goalY=p.y;
  if(nd){
    goalY = (nd.y>p.y)? p.y-6 : p.y+6;
    goalY=clampY(goalY);
    if(ndDist<3.2 && p.jcd<=0 && Math.random()<0.5){ p.iframe=0.30; p.burst=0.4; p.jcd=1.2; }
  }
  var fireBoost=G.fire[p.team]?2.0:0;
  var spd=(9.0+fireBoost) + (p.burst>0?3.5:0) + (ndDist<8?1.2:0);
  integrate(p, p.x+9, goalY, spd, dt);
}
function aiDef(p, dt){
  p.stun=Math.max(0,p.stun-dt);
  if(p.blocked>0) p.blocked-=dt;
  var target;
  if(ball.inAir){ target={x:ball.tx,y:ball.ty}; }
  else if(ball.carrier){ target=ball.carrier; }
  else { target={x:G.los,y:MIDY}; }

  if(p.role==='DB' && p.cover && !ball.inAir && ball.carrier===gQB && G.playType!=='run'){
    var cv=p.cover;
    // lockdown: tighter shadow — DB sits ON the receiver instead of 1.5y ahead
    var lockOffset = (hasAbility(p.team,'lockdown') || skillBoosts.lockdown>0) ? 0.4 : 1.5;
    target={x:cv.x+lockOffset, y:cv.y};
  }
  var speed = baseSpeed(p);
  if(G.fire[p.team]) speed+=1.2;
  if(p.blocked>0) speed*=0.30;
  if(p.stun>0) speed*=0.25;
  var lead=0.28;
  var tx=(target.vx?target.x+target.vx*lead:target.x);
  var ty=(target.vy?target.y+target.vy*lead:target.y);

  /* ---- CHASE-DOWN PURSUIT BOOST ---- */
  // If defender is directly behind ball-carrier (rear cone) and close-ish, grant speed boost
  // so you can run them down rather than watching every breakaway become a TD
  if(ball.carrier && !ball.inAir && target===ball.carrier){
    var c2=ball.carrier;
    var relX = p.x - c2.x;   // positive = defender behind carrier (carrier going +x)
    var relY = p.y - c2.y;
    var d2c = Math.hypot(relX, relY);
    var carrierDir = Math.atan2(c2.vy||0, c2.vx||0.1);
    var defAngle = Math.atan2(-relY, -relX);  // angle from carrier to defender (behind = ~same as carrier dir)
    var angleDiff = Math.abs(((defAngle - carrierDir + Math.PI*3) % (Math.PI*2)) - Math.PI);
    var inRearCone = angleDiff < 0.65;  // ~37-degree half-cone behind carrier
    if(inRearCone && d2c < 14 && d2c > 1.5){
      // behind and within ~14 yards: pursuit boost scales with distance
      var pursuitBoost = 2.6 * (1.0 - d2c/14);
      speed += pursuitBoost;
      // cap carrier breakaway speed slightly (CPU carrier)
      if(c2.team!==HUMAN){
        var cSpd = Math.hypot(c2.vx,c2.vy);
        if(cSpd > 13.5){ var sf=13.5/cSpd; c2.vx*=sf; c2.vy*=sf; }
      }
    }
  }
  integrate(p, tx, ty, speed, dt);
}

function updateEntities(dt){
  var controlled = controlledPlayer();
  for(var i=0;i<players.length;i++){
    var p=players[i];
    p.jcd=Math.max(0,p.jcd-dt); p.iframe=Math.max(0,p.iframe-dt);
    p.truckCd=Math.max(0,p.truckCd-dt); p.burst=Math.max(0,p.burst-dt);
    if(!AP.on && p===controlled && humanControlActive()){ humanMove(p,dt); continue; }  // autoplay: AI drives all
    if(G.state==='PRESNAP') continue; // AI holds until snap (except human defender above)
    if(p.team===G.offenseTeam){
      if(p===ball.carrier){
        if(p.role==='QB' && G.playType!=='run' && !p.crossedLOS && !ball.inAir) aiQB(p,dt);
        else aiRun(p,dt);
      } else if(p.role==='OL'){ aiBlock(p,dt); }
      else if(p.role==='QB'){ p.vx*=0.6; p.vy*=0.6; }
      else aiRoute(p,dt);
    } else {
      aiDef(p,dt);
    }
  }
}

/* ============================ UPDATE STATES ============================ */
function updateLive(dt){
  G.playElapsed+=dt;
  tickClock(dt);
  // CHANGE 2: Update charge timer
  if(qbCharge.active) qbCharge.t=Math.min(qbCharge.maxT, qbCharge.t+dt);
  updateEntities(dt);
  var c=ball.carrier;
  if(!c) return;
  ball.x=c.x; ball.y=c.y;

  if(G.fire[c.team] && (Math.abs(c.vx)+Math.abs(c.vy))>2){ spawnFlame(SX(c.x,c.y), SY(c.x,c.y)); }

  if(c.x>=100){ endPlay(100,{touchdown:true}); return; }
  if(c.y<=0.6 || c.y>=FIELD_W-0.6){ c.y=clampY(c.y); endPlay(c.x,{oob:true}); return; }
  if(c.x<-9) c.x=-9;

  for(var i=0;i<DEF.length;i++){
    var d=DEF[i];
    var dd=dist(d,c);
    var reach = d.r+c.r-0.85 + (d.diveT>0?1.5:0);  // extended dive reach for chase-down tackles
    if(dd < reach){
      if(c.iframe>0){
        var a=Math.atan2(d.y-c.y,d.x-c.x);
        d.x+=Math.cos(a)*1.4; d.y=clampY(d.y+Math.sin(a)*1.4); d.stun=0.4;
        continue;
      }
      var carrierFast = (c.turboActive||c.burst>0);
      // truck_stick: carrier breaks the first tackle (passive or skill-boosted)
      var hasTruck = hasAbility(c.team,'truck_stick') || skillBoosts.truckStick>0;
      var truckChance = hasTruck ? 0.80 : 0.60;
      if(carrierFast && c.truckCd<=0 && Math.random()<truckChance){
        var a2=Math.atan2(d.y-c.y,d.x-c.x);
        d.x+=Math.cos(a2)*2.0; d.y=clampY(d.y+Math.sin(a2)*2.0); d.stun=0.6;
        c.truckCd=1.1;
        popup(SX(c.x,c.y),SY(c.x,c.y)-34,'TRUCK!','#ff2bd6',0.8);
        sndBigHit(); addShake(8); flingFX(d);
        continue;
      }
      var rel=Math.hypot(d.vx-c.vx, d.vy-c.vy);
      // big_hit: defenders with this ability tackle harder (more stun/knockback)
      var hasBigHit = hasAbility(d.team,'big_hit') || skillBoosts.bigHit>0;
      var big = (d.turboActive || d.diveT>0 || rel>16 || hasBigHit);
      endPlay(c.x, {bigHit:big}); return;
    }
  }
}

function updateThrown(dt){
  tickClock(dt);
  ball.t+=dt; ball.spin+=dt*22;
  var pr=Math.min(1, ball.t/ball.dur);
  ball.x=ball.sx+(ball.tx-ball.sx)*pr;
  ball.y=ball.sy+(ball.ty-ball.sy)*pr;
  // CHANGE 1: Higher arc peak (4.5 instead of 3.2)
  ball.z=Math.sin(pr*Math.PI)*4.5;
  updateEntities(dt);

  // CHANGE 1: Jump-to-catch window (last 35% of flight, pr>0.65)
  // If human controls the target WR, boost WR upward visually when jumpPressed
  if(pr>0.65 && ball.jumpPressed && ball.targetRec && G.offenseTeam===HUMAN){
    var recP=ball.targetRec;
    // Apply a visual upward pop to the WR by temporarily boosting their y-draw via recP.jumpLift
    var jumpFrac = (pr-0.65)/0.35;  // 0→1 as ball closes in
    var liftArc  = Math.sin(jumpFrac*Math.PI);
    recP.jumpLift = liftArc * PLAYER_H * 0.28;  // visual-only lift in screen px
  } else if(ball.targetRec){
    ball.targetRec.jumpLift = 0;
  }

  if(ball.t>=ball.dur){
    ball.inAir=false;
    var rec=ball.targetRec;
    var landX=ball.tx, landY=ball.ty;
    var rDist = rec? Math.hypot(rec.x-landX, rec.y-landY) : 99;
    var nd=1e9, ndP=null;
    for(var i=0;i<DEF.length;i++){ var dd=Math.hypot(DEF[i].x-landX, DEF[i].y-landY); if(dd<nd){nd=dd;ndP=DEF[i];} }

    // Jump/C-assist bonus — extends catch radius and protects against INT
    var didJump = ball.jumpPressed;  // set by SPACE or C assist
    var jumpBonus = didJump ? 1.8 : 0;
    // Wider catch radius overall (was 3.0) — catching is supposed to be achievable
    var catchR = 3.8 + jumpBonus;
    // WR catch rating boosts from skills/agent rating
    var wrRat = (function(){
      var idx=agentIdx(G.offenseTeam);
      if(idx!=null){ var id=AGENTS[idx].id; var base=AGENT_RATING[id]||{wr:0.75}; return getEffectiveRating(base,G.offenseTeam).wr; }
      return 0.75;
    })();
    catchR += (wrRat - 0.70) * 2.0;  // high WR rating = slightly bigger window
    // sticky_hands passive: receiver magnetism bonus (separate from wr rating)
    if(hasAbility(G.offenseTeam,'sticky_hands') || skillBoosts.wr>0.12) catchR += 0.9;

    // ball_hawk: defensive team gets tighter INT window / higher deflect chance
    var defTeam = other(G.offenseTeam);
    var hasBallHawk = hasAbility(defTeam,'ball_hawk') || (defTeam===HUMAN && skillBoosts.ballHawk>0);
    // INT requires: defender very close AND receiver NOT within catch window AND NOT jumping
    var intR = ball.swat ? 1.6 : (hasBallHawk ? 1.25 : 0.9);  // ball_hawk widens INT reach
    var defClearlyWins = (nd < intR) && (nd <= rDist - 2.5) && !didJump;

    if(defClearlyWins){
      endPlay((ndP?ndP.x:landX),{intercept:true}); return;
    }

    // Swat/deflection — if defender is nearby and no jump, DEFLECT (visual bounce + incomplete) not auto-INT
    if(ball.swat && nd < 2.2 && !didJump){
      // deflection bounce: ball pops up visually then lands as incomplete
      ball.z = 2.8;   // kick the ball z up (visual "bounce" seen next few frames)
      endPlay(G.los,{incomplete:true, swat:true}); return;
    }
    // Near-miss contested catch — if defender contests but doesn't cleanly intercept, it's incomplete (not INT)
    if(nd < 2.0 && rDist < 4.0 && !didJump && Math.random() < 0.70){
      // contested: 70% chance deflection, 30% miraculous catch
      endPlay(G.los,{incomplete:true}); return;
    }

    if(rec && rDist<catchR){
      rec.x=landX; rec.y=clampY(landY);
      rec.jumpLift=0;
      ball.carrier=rec; sndCatch();
      if(didJump){ popup(SX(landX,landY),SY(landX,landY)-54,'JUMP CATCH!','#00ff88',1.2,true); }
      else { popup(SX(landX,landY),SY(landX,landY)-34,'CATCH!','#00ff88',0.8); }
      G.state='LIVE'; G.playElapsed=0;
      ball.jumpPressed=false;
      return;
    }
    // Default: incomplete
    if(rec) rec.jumpLift=0;
    ball.jumpPressed=false;
    endPlay(G.los,{incomplete:true}); return;
  }
}

function tickClock(dt){
  if(G.clockDead) return;
  G.clock-=dt;
  if(G.clock<=0){ G.clock=0; G.clockDead=true; }
}

/* ============================ CAMERA / LOOP ============================ */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  perfNow=now;

  if(AP.on) apDirector(dt);

  if(G.state==='LIVE') updateLive(dt);
  else if(G.state==='THROWN') updateThrown(dt);
  else if(G.state==='PRESNAP'){
    var watchMode=(MODE==='watch'||MODE==='skill');
    if(G.offenseTeam!==HUMAN || watchMode){ updateEntities(dt); snapTimer-=dt; if(snapTimer<=0) doSnap(); }
    else updateEntities(dt);
  } else if(G.state==='DEAD'){
    deadTimer-=dt; if(deadTimer<=0) proceedAfterDead();
  }
  updateParticles(dt);
  if(titleFlash>0) titleFlash-=dt;
  fireFlash.YOU=Math.max(0,fireFlash.YOU-dt); fireFlash.CPU=Math.max(0,fireFlash.CPU-dt);

  // camera follows ball carrier down the field
  var focus;
  if(G.state==='THROWN') focus=ball.x;
  else if(G.state==='LIVE'||G.state==='DEAD') focus=(ball.carrier||gQB).x;
  else focus=G.los+2;
  camTarget = focus - CAM_BEHIND;
  if(camTarget < -22) camTarget=-22;
  if(camTarget > 100) camTarget=100;
  camBackX += (camTarget-camBackX)*Math.min(1,dt*5);

  // shake decay
  if(shakeMag>0.2){ shakeX=(Math.random()*2-1)*shakeMag; shakeY=(Math.random()*2-1)*shakeMag; shakeMag-=dt*40; if(shakeMag<0)shakeMag=0; }
  else { shakeX=0; shakeY=0; shakeMag=0; }

  render();
  requestAnimationFrame(frame);
}

/* ============================ RENDER ============================ */
function render(){
  navBtns.length = 0;  // reset nav hit areas each frame
  ctx.clearRect(0,0,W,H);
  drawField();

  if(G.state!=='TITLE' && G.state!=='SELECT'){
    drawPlayersSorted();
    drawJukeGhosts();
    drawFlames();
    drawBall();
    drawParticles();
    drawAim();
    drawPopups();
    drawHUD();
    drawStatePrompts();
  }
  if(G.state==='TITLE') drawTitle();
  if(G.state==='SELECT'){
    if(G_MODESEL) drawModeSelect();
    else if(G_SKILLSEL) drawSkillSelect();
    else drawSelect();
  }
  if(G.state==='OVER') drawOver();
}

function drawPlayersSorted(){
  // painter's algorithm: farthest (largest x) first, nearest last
  var list = players.slice().sort(function(a,b){ return b.x - a.x; });
  for(var i=0;i<list.length;i++) drawPlayer(list[i]);
}

function yardLabel(){
  var L=Math.round(G.los);
  if(L<=50) return 'OWN '+L; return 'OPP '+(100-L);
}
function distLabel(){
  var dn=['1ST','2ND','3RD','4TH'][Math.min(3,G.down-1)];
  if(G.firstDown>=100) return dn+' & GOAL';
  return dn+' & '+Math.max(1,Math.ceil(G.firstDown-G.los));
}

/* ---- perspective field ---- */
function fieldLineX(yd){ // draw a full-width yard line at depth yd
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  return {a:a,b:b};
}
function drawField(){
  computeView();
  ctx.fillStyle='#010c08'; ctx.fillRect(0,0,W,H);

  var near=Math.max(-12, camBackX-2);
  var far =Math.min(112, camBackX+74);

  // grass trapezoid — richer depth gradient
  var nl=proj(near,0), nr=proj(near,FIELD_W), fl=proj(far,0), fr=proj(far,FIELD_W);
  var grad=ctx.createLinearGradient(0,fl.y,0,nl.y);
  grad.addColorStop(0.0,'#020f08');  // horizon: near-black forest green
  grad.addColorStop(0.35,'#063a18'); // mid: deeper emerald
  grad.addColorStop(0.72,'#094d1e'); // lush mid-field
  grad.addColorStop(1.0,'#041a0e');  // near plane: dark again (depth shadow)
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.fill();

  // mowed stripe bands every 5 yards — alternating light/dark, perspective-correct
  for(var s=Math.ceil(near/5)*5; s<far; s+=5){
    var A=proj(s,0), B=proj(s,FIELD_W);
    var s2=Math.min(far,s+5);
    var C2=proj(s2,FIELD_W), D2=proj(s2,0);
    var even=((s/5)%2===0);
    ctx.fillStyle=even?'rgba(10,80,30,0.22)':'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C2.x,C2.y); ctx.lineTo(D2.x,D2.y); ctx.closePath(); ctx.fill();
  }

  // subtle inner vignette on the field for depth
  var fgx1=W/2, fgy1=fl.y+(nl.y-fl.y)*0.5;
  var fieldVig=ctx.createRadialGradient(fgx1,fgy1,0, fgx1,fgy1,(nl.y-fl.y)*1.2);
  fieldVig.addColorStop(0,'rgba(0,0,0,0)');
  fieldVig.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=fieldVig;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.fill();

  // end zones (fixed field ends), tinted by the two agent teams
  drawEndzone(-10,0, teamCol(HUMAN), agentName(HUMAN), near, far);
  drawEndzone(100,110, teamCol(CPU), agentName(CPU), near, far);

  // yard lines + numbers + hashes
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var yd=Math.max(0,Math.ceil(near/5)*5); yd<=Math.min(100,far); yd+=5){
    var ln=fieldLineX(yd);
    var major=(yd%10===0);
    ctx.strokeStyle= major?'rgba(120,255,190,0.40)':'rgba(120,255,190,0.16)';
    ctx.lineWidth= Math.max(0.6, (major?2.0:1.0)*ln.a.s);
    ctx.beginPath(); ctx.moveTo(ln.a.x,ln.a.y); ctx.lineTo(ln.b.x,ln.b.y); ctx.stroke();

    if(major && yd>0 && yd<100){
      var num = yd<=50 ? yd : 100-yd;
      var fs=Math.max(8, PLAYER_H*0.42*ln.a.s);
      ctx.font="800 "+fs+"px 'Share Tech Mono', monospace";
      ctx.fillStyle='rgba(150,255,200,0.35)';
      var p1=proj(yd, MIDY-13), p2=proj(yd, MIDY+13);
      ctx.fillText(num, p1.x, p1.y);
      ctx.fillText(num, p2.x, p2.y);
    }
    // hash ticks
    var h1=proj(yd,MIDY-6), h2=proj(yd,MIDY+6);
    var hs=Math.max(2,4*ln.a.s);
    ctx.strokeStyle='rgba(120,255,190,0.22)'; ctx.lineWidth=Math.max(0.6,ln.a.s);
    ctx.beginPath(); ctx.moveTo(h1.x-hs,h1.y); ctx.lineTo(h1.x+hs,h1.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h2.x-hs,h2.y); ctx.lineTo(h2.x+hs,h2.y); ctx.stroke();
  }

  // sidelines
  ctx.strokeStyle='rgba(200,255,235,0.6)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nr.x,nr.y); ctx.lineTo(fr.x,fr.y); ctx.stroke();
  // goal lines
  goalLine(0,'rgba(255,255,255,0.7)'); goalLine(100,'rgba(255,255,255,0.7)');

  // LOS & first-down markers in perspective
  if(G.state!=='TITLE' && G.state!=='SELECT'){
    persLine(G.los, '#00f0ff', 2.4, false);
    persLine(G.firstDown, '#ffdd00', 2.4, true);
  }
}
function goalLine(yd,color){
  if(yd<camBackX-2 || yd>camBackX+76) return;
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.2,2.4*a.s);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function persLine(yd,color,w,dashed){
  if(yd<camBackX-2 || yd>camBackX+76) return;
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.5,w*a.s);
  ctx.shadowColor=color; ctx.shadowBlur=12*a.s;
  if(dashed) ctx.setLineDash([10*a.s,8*a.s]);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function drawEndzone(x0,x1,neon,label,near,far){
  if(x1<near || x0>far) return;
  var c0=Math.max(x0,near-6), c1=Math.min(x1,far+6);
  var a=proj(c0,0), b=proj(c0,FIELD_W), c=proj(c1,FIELD_W), d=proj(c1,0);
  ctx.save();
  ctx.globalAlpha=0.30; ctx.fillStyle=neon;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  var mid=proj((x0+x1)/2, MIDY);
  var fs=Math.max(10, PLAYER_H*0.7*mid.s);
  ctx.font="800 "+fs+"px 'Orbitron', sans-serif";
  ctx.fillStyle=neon; ctx.globalAlpha=0.9; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=neon; ctx.shadowBlur=14*mid.s;
  ctx.fillText(label, mid.x, mid.y);
  ctx.restore();
}

/* ---- perspective humanoid players (improved football figures v2) ---- */
function drawPlayer(p){
  var pr=proj(p.x,p.y), s=pr.s;
  var cx=pr.x, footY=pr.y;
  var isCarrier=(p===ball.carrier);
  var isControlled=(p===controlledPlayer() && humanControlActive());
  var onFire=(G.fire[p.team] && isCarrier);
  var isSel=(G.offenseTeam===HUMAN && !ball.inAir && p===eligible[selRec] && p.team===G.offenseTeam && p!==ball.carrier && (G.state==='PLAYCALL'||G.state==='LIVE'||G.state==='PRESNAP'));

  var col = onFire? '#ff8a00' : teamCol(p.team);
  // secondary accent per agent: complementary color for pads, number plate, gloves
  var accentCol = (function(){
    var idx2=agentIdx(p.team);
    if(idx2==null) return '#ffffff';
    var id=AGENTS[idx2].id;
    var accents={SHADDAI:'#ffffff',NEXUS:'#ff2bd6',ORACLE:'#ffdd00',ZEROX:'#00f0ff',TURTLE:'#00ff88',QUILL:'#ff2bd6',PIKADON:'#ffcf1a'};
    return accents[id]||'#ffffff';
  })();
  if(onFire) accentCol='#ffdd00';
  var dark=shade(col,-80), mid=shade(col,-30), light=shade(col,55), ink=contrast(col);
  var Hp = Math.max(24, PLAYER_H*s);
  var w  = Hp*0.44;

  var jumpLift = (p.jumpLift||0);
  footY -= jumpLift;

  // Proportions — taller torso, more defined waist
  var hipY      = footY - Hp*0.36;
  var waistY    = footY - Hp*0.48;
  var torsoTop  = footY - Hp*0.80;
  var headR     = w*0.45;
  var headY     = torsoTop - headR*0.85;
  var faceDir   = (Math.cos(p.face)>=0)?1:-1;

  // Smooth running cycle with two-phase stride
  var running = Math.abs(p.vx)+Math.abs(p.vy);
  var strideAmt = running>0.4 ? w*0.38 : 0;
  var strideT   = p.anim*2.0;
  var stride    = Math.sin(strideT)*strideAmt;
  var stride2   = Math.sin(strideT+Math.PI)*strideAmt;  // opposite leg
  var armSwing  = Math.sin(strideT+Math.PI)*strideAmt*0.55;
  var armSwing2 = Math.sin(strideT)*strideAmt*0.55;

  // ---- GROUND SHADOW (ellipse, slightly blurred) ----
  ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,footY,w*0.85,w*0.22,0,0,6.283); ctx.fill(); ctx.restore();

  // ---- SELECTION / CONTROL RINGS ----
  if(isControlled){
    var pu=(Math.sin(perfNow*0.008)*0.5+0.5);
    ctx.save(); ctx.globalAlpha=0.88; ctx.strokeStyle='#00ff88'; ctx.lineWidth=Math.max(2,3*s);
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.ellipse(cx,footY,w*1.0+pu*4,w*0.38,0,0,6.283); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
  }
  if(isSel){
    ctx.save(); ctx.globalAlpha=0.82; ctx.strokeStyle='#ffdd00'; ctx.lineWidth=Math.max(1.5,2*s);
    ctx.setLineDash([6,4]); ctx.beginPath(); ctx.ellipse(cx,footY,w*0.94,w*0.36,0,0,6.283); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  // ---- LEGS (two separate limbs with knee bend) ----
  var legW = Math.max(2.2, w*0.24);
  ctx.lineCap='round';

  // Back leg (darker)
  ctx.strokeStyle=dark; ctx.lineWidth=legW*0.9;
  var bk_knee_x = cx - w*0.14 + stride*0.4, bk_knee_y = hipY+(footY-hipY)*0.52;
  var bk_foot_x = cx - w*0.14 + stride, bk_foot_y = footY - Hp*0.04;
  ctx.beginPath();
  ctx.moveTo(cx-w*0.14, hipY);
  ctx.quadraticCurveTo(bk_knee_x, bk_knee_y, bk_foot_x, bk_foot_y);
  ctx.stroke();
  // Front leg (brighter)
  ctx.strokeStyle=mid; ctx.lineWidth=legW;
  var fr_knee_x = cx + w*0.14 + stride2*0.4, fr_knee_y = hipY+(footY-hipY)*0.52;
  var fr_foot_x = cx + w*0.14 + stride2, fr_foot_y = footY - Hp*0.04;
  ctx.beginPath();
  ctx.moveTo(cx+w*0.14, hipY);
  ctx.quadraticCurveTo(fr_knee_x, fr_knee_y, fr_foot_x, fr_foot_y);
  ctx.stroke();
  // Cleats
  ctx.fillStyle=shade(dark,-25); ctx.lineWidth=0;
  ctx.beginPath(); ctx.ellipse(bk_foot_x, bk_foot_y+Hp*0.02, w*0.13, w*0.055, 0.15, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(fr_foot_x, fr_foot_y+Hp*0.02, w*0.14, w*0.055, 0.15, 0, 6.283); ctx.fill();
  // cleat spikes
  ctx.strokeStyle=shade(dark,-50); ctx.lineWidth=Math.max(0.5, w*0.04);
  for(var si=-1;si<=1;si+=2){
    ctx.beginPath(); ctx.moveTo(bk_foot_x+si*w*0.05, bk_foot_y+Hp*0.03); ctx.lineTo(bk_foot_x+si*w*0.05, bk_foot_y+Hp*0.055); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fr_foot_x+si*w*0.05, fr_foot_y+Hp*0.03); ctx.lineTo(fr_foot_x+si*w*0.05, fr_foot_y+Hp*0.055); ctx.stroke();
  }

  // ---- TORSO (tapered: wider at shoulders, narrower at waist) ----
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=isCarrier?22:(onFire?20:10);
  // main jersey body — trapezoid for taper
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(cx - w*0.56, torsoTop);      // shoulder left
  ctx.lineTo(cx + w*0.56, torsoTop);      // shoulder right
  ctx.lineTo(cx + w*0.38, hipY);          // hip right
  ctx.lineTo(cx - w*0.38, hipY);          // hip left
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  // jersey side shading for 3D depth
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.moveTo(cx + w*0.16, torsoTop); ctx.lineTo(cx + w*0.56, torsoTop);
  ctx.lineTo(cx + w*0.38, hipY); ctx.lineTo(cx + w*0.16, hipY);
  ctx.closePath(); ctx.fill();

  // jersey center stripe (team highlight)
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(cx - w*0.09, torsoTop+Hp*0.05);
  ctx.lineTo(cx + w*0.09, torsoTop+Hp*0.05);
  ctx.lineTo(cx + w*0.06, hipY - Hp*0.01);
  ctx.lineTo(cx - w*0.06, hipY - Hp*0.01);
  ctx.closePath(); ctx.fill();

  // jersey number plate (accent color inset)
  if(Hp>32){
    ctx.fillStyle='rgba(0,0,0,0.28)';
    roundRect(cx-w*0.28, torsoTop+Hp*0.13, w*0.56, Hp*0.22, w*0.08); ctx.fill();
    // accent stripe on number plate
    ctx.fillStyle=accentCol; ctx.globalAlpha=0.18;
    roundRect(cx-w*0.28, torsoTop+Hp*0.13, w*0.56, Hp*0.07, w*0.08); ctx.fill();
    ctx.globalAlpha=1;
  }

  // ---- SHOULDER PADS (chunky, beveled) — accent colored ----
  ctx.fillStyle=accentCol; ctx.globalAlpha=0.82;
  roundRect(cx - w*0.70, torsoTop - Hp*0.02, w*1.40, Hp*0.18, w*0.26); ctx.fill();
  ctx.globalAlpha=1;
  // pad top highlight
  ctx.fillStyle=light; ctx.globalAlpha=0.55;
  roundRect(cx - w*0.70, torsoTop - Hp*0.02, w*1.40, Hp*0.06, w*0.26); ctx.fill();
  ctx.globalAlpha=1;
  // pad ridge highlights
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(cx - w*0.50, torsoTop+Hp*0.05, w*0.20, Hp*0.04, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + w*0.50, torsoTop+Hp*0.05, w*0.20, Hp*0.04, 0, 0, 6.283); ctx.fill();
  // pad edge line
  ctx.strokeStyle=shade(accentCol,-40); ctx.lineWidth=Math.max(0.8,s); ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.moveTo(cx-w*0.70, torsoTop+Hp*0.16); ctx.lineTo(cx+w*0.70, torsoTop+Hp*0.16); ctx.stroke();
  ctx.globalAlpha=1;

  // ---- ARMS (upper + forearm segments for more articulation) ----
  ctx.lineWidth=Math.max(1.8, w*0.19); ctx.lineCap='round';
  // left arm (back)
  ctx.strokeStyle=dark;
  var la_elbow = {x: cx - w*0.54 + armSwing*0.6, y: torsoTop+Hp*0.22};
  var la_hand  = {x: cx - w*0.62 + armSwing, y: hipY + Hp*0.04};
  ctx.beginPath(); ctx.moveTo(cx-w*0.52, torsoTop+Hp*0.06); ctx.lineTo(la_elbow.x, la_elbow.y); ctx.stroke();
  ctx.lineWidth=Math.max(1.5,w*0.15);
  ctx.beginPath(); ctx.moveTo(la_elbow.x, la_elbow.y); ctx.lineTo(la_hand.x, la_hand.y); ctx.stroke();
  // right arm (front)
  ctx.strokeStyle=mid; ctx.lineWidth=Math.max(1.8,w*0.19);
  var ra_elbow = {x: cx + w*0.54 + armSwing2*0.6, y: torsoTop+Hp*0.22};
  var ra_hand  = {x: cx + w*0.62 + armSwing2, y: hipY + Hp*0.04};
  ctx.beginPath(); ctx.moveTo(cx+w*0.52, torsoTop+Hp*0.06); ctx.lineTo(ra_elbow.x, ra_elbow.y); ctx.stroke();
  ctx.lineWidth=Math.max(1.5,w*0.15);
  ctx.beginPath(); ctx.moveTo(ra_elbow.x, ra_elbow.y); ctx.lineTo(ra_hand.x, ra_hand.y); ctx.stroke();
  // gloves (round tips) — accent colored
  ctx.fillStyle=accentCol; ctx.globalAlpha=0.75;
  ctx.beginPath(); ctx.arc(la_hand.x, la_hand.y, w*0.12, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(ra_hand.x, ra_hand.y, w*0.12, 0, 6.283); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();

  // ---- JERSEY NUMBER ----
  if(Hp>30){
    ctx.save();
    ctx.fillStyle=ink; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(Math.max(7,Hp*0.19))+"px 'Orbitron', sans-serif";
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.fillText(p.num, cx, (torsoTop+hipY)*0.5 + Hp*0.04);
    ctx.shadowBlur=0; ctx.restore();
  }

  // ---- ROLE TAG (below feet, subtle) ----
  if(Hp>40 && s>0.58){
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font=(Math.max(6,Hp*0.11))+"px 'Share Tech Mono',monospace";
    ctx.fillStyle=col; ctx.globalAlpha=0.65;
    ctx.fillText(p.role, cx, footY+3);
    ctx.restore();
  }

  // ---- HELMET (more detailed) ----
  ctx.save();
  // shell — rounded top
  var grad2 = ctx.createRadialGradient(cx-headR*0.25, headY-headR*0.28, headR*0.06, cx, headY, headR*1.05);
  grad2.addColorStop(0, light);
  grad2.addColorStop(0.55, dark);
  grad2.addColorStop(1, shade(dark,-40));
  ctx.fillStyle=grad2; ctx.shadowColor=col; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx, headY, headR, 0, 6.283); ctx.fill(); ctx.shadowBlur=0;
  // helmet gloss highlight
  ctx.fillStyle='rgba(255,255,255,0.17)';
  ctx.beginPath(); ctx.ellipse(cx-headR*0.22, headY-headR*0.38, headR*0.38, headR*0.20, -0.45, 0, 6.283); ctx.fill();
  // center mohawk stripe (accent color for contrast)
  ctx.strokeStyle=accentCol; ctx.lineWidth=Math.max(1.4, headR*0.30); ctx.lineCap='round';
  ctx.globalAlpha=0.90;
  ctx.beginPath(); ctx.moveTo(cx, headY-headR*0.98); ctx.lineTo(cx, headY+headR*0.22); ctx.stroke();
  ctx.globalAlpha=1;
  // jaw line / chin strap
  ctx.strokeStyle=shade(dark,-20); ctx.lineWidth=Math.max(0.8, headR*0.14);
  ctx.beginPath(); ctx.arc(cx, headY+headR*0.25, headR*0.70, 0.2, Math.PI-0.2); ctx.stroke();
  // ear hole (recessed)
  ctx.fillStyle=shade(dark,-40);
  ctx.beginPath(); ctx.arc(cx - faceDir*headR*0.68, headY+headR*0.06, headR*0.20, 0, 6.283); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(cx - faceDir*headR*0.68, headY+headR*0.06, headR*0.12, 0, 6.283); ctx.fill();
  // facemask — 3-bar cage
  ctx.strokeStyle=light; ctx.lineWidth=Math.max(0.9, headR*0.16); ctx.lineCap='round';
  var fmx = cx + faceDir*headR*0.28;
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.04, headR*0.62, -0.80, 0.80); ctx.stroke();
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.26, headR*0.58, -0.72, 0.72); ctx.stroke();
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.46, headR*0.52, -0.62, 0.62); ctx.stroke();
  // visor tint (subtle glow)
  ctx.fillStyle='rgba(0,240,255,0.10)';
  ctx.beginPath(); ctx.ellipse(cx+faceDir*headR*0.16, headY-headR*0.10, headR*0.46, headR*0.28, faceDir*0.18, 0, 6.283); ctx.fill();
  ctx.restore();

  // ---- CARRIER: ball tuck + position chevron ----
  if(isCarrier && !ball.inAir){
    var by2=torsoTop+Hp*0.20;
    ctx.save(); ctx.translate(cx+faceDir*w*0.60, by2);
    ctx.fillStyle= onFire?'#ffcc00':'#a5560f'; ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(0.7,s*1.2);
    ctx.shadowColor= onFire?'#ff8a00':'#ffb347'; ctx.shadowBlur=onFire?16:8;
    ctx.beginPath(); ctx.ellipse(0,0,w*0.34,w*0.20,0.22,0,6.283); ctx.fill();
    // lace marks
    ctx.beginPath(); ctx.moveTo(-w*0.14,0); ctx.lineTo(w*0.14,0); ctx.stroke();
    ctx.lineWidth=Math.max(0.5,s*0.8);
    ctx.beginPath(); ctx.moveTo(-w*0.04,-w*0.06); ctx.lineTo(-w*0.04,w*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w*0.04,-w*0.06); ctx.lineTo(w*0.04,w*0.06); ctx.stroke();
    ctx.restore();
    // position indicator chevron (floating above head)
    var cvy=headY-headR-Hp*0.18-Math.abs(Math.sin(perfNow*0.006))*6;
    ctx.save(); ctx.fillStyle=onFire?'#ff8a00':'#00ff88'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.moveTo(cx,cvy+Hp*0.12); ctx.lineTo(cx-w*0.34,cvy); ctx.lineTo(cx+w*0.34,cvy); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawAim(){
  // pass-target indicator: line QB -> selected receiver + pulsing marker
  if(G.offenseTeam!==HUMAN) return;
  if(G.playType==='run') return;
  if(ball.inAir || ball.carrier!==gQB) return;
  if(G.state!=='LIVE' && G.state!=='PRESNAP') return;
  var r=eligible[selRec]; if(!r || r===gQB) return;
  var a=proj(gQB.x,gQB.y), b=proj(r.x,r.y);
  ctx.save();
  ctx.strokeStyle='rgba(255,221,0,0.55)'; ctx.lineWidth=2; ctx.setLineDash([8,7]);
  ctx.shadowColor='#ffdd00'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(a.x,a.y-6); ctx.lineTo(b.x,b.y-6); ctx.stroke();
  ctx.setLineDash([]);
  // target reticle
  var pu=0.6+0.4*Math.sin(perfNow*0.012);
  ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2.2; ctx.globalAlpha=pu;
  ctx.beginPath(); ctx.arc(b.x,b.y-b.s*PLAYER_H*0.5, b.s*22, 0, 6.283); ctx.stroke();
  ctx.restore();

  // CHANGE 2: Draw charge-throw power meter above QB
  if(qbCharge.active && G.state==='LIVE'){
    var ratio=Math.min(1, qbCharge.t/qbCharge.maxT);
    var qbS=proj(gQB.x,gQB.y);
    var mW=Math.max(60, PLAYER_H*qbS.s*1.1), mH=9, mx=qbS.x-mW/2, my=qbS.y-PLAYER_H*qbS.s-28;
    ctx.save();
    // bg
    ctx.fillStyle='rgba(0,0,0,0.60)';
    roundRect(mx-2,my-2,mW+4,mH+4,4); ctx.fill();
    // fill — color shifts green→yellow→red as charge increases
    var mCol = ratio<0.5?'#00ff88':(ratio<0.8?'#ffdd00':'#ff2bd6');
    ctx.fillStyle=mCol; ctx.shadowColor=mCol; ctx.shadowBlur=10;
    roundRect(mx,my,mW*ratio,mH,3); ctx.fill();
    // label
    ctx.shadowBlur=0; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='#fff'; ctx.font="700 9px 'Share Tech Mono',monospace";
    ctx.fillText('HOLD→THROW', qbS.x, my-2);
    ctx.restore();
  }
}

function drawBall(){
  if(!ball.inAir) return;
  var pr=proj(ball.x,ball.y), s=pr.s;
  var X=pr.x, Y=pr.y - ball.z*PPX*s*2.0;
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(pr.x,pr.y,10*s,5*s,0,0,6.283); ctx.fill(); ctx.restore();
  var onFire=G.fire[G.offenseTeam];
  ctx.save(); ctx.translate(X,Y); ctx.rotate(ball.spin*0.6);
  ctx.shadowColor= onFire?'#ff8a00':'#ffb347'; ctx.shadowBlur=onFire?18:12;
  ctx.fillStyle= onFire?'#ffcc00':'#a5560f'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.ellipse(0,0,11*s,6.5*s,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6*s,0); ctx.lineTo(6*s,0); ctx.stroke();
  ctx.restore();
  if(onFire){ spawnFlame(X,Y); }
}

// CHANGE 3: Draw juke ghost afterimages as silhouette circles
function drawJukeGhosts(){
  for(var i=0;i<jukeGhosts.length;i++){
    var gh=jukeGhosts[i]; var frac=Math.max(0,gh.life/gh.max);
    var Hp=Math.max(20,PLAYER_H*gh.s);
    ctx.save();
    ctx.globalAlpha=frac*gh.alpha;
    ctx.fillStyle=gh.col; ctx.shadowColor=gh.col; ctx.shadowBlur=10;
    // draw a simple player silhouette ghost
    ctx.beginPath(); ctx.ellipse(gh.x, gh.y-Hp*0.42, Hp*0.23, Hp*0.44, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(gh.x, gh.y-Hp*0.86-Hp*0.08, Hp*0.11, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function drawFlames(){
  for(var i=0;i<flames.length;i++){
    var f=flames[i]; var a=Math.max(0,f.life/f.max);
    ctx.save(); ctx.globalAlpha=a*0.9; ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.size*a,0,6.283); ctx.fill(); ctx.restore();
  }
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i]; var a=Math.max(0,p.life/p.max);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.283); ctx.fill(); ctx.restore();
  }
}
function drawPopups(){
  for(var i=0;i<popups.length;i++){
    var q=popups[i]; var a=Math.min(1,q.life/(q.max*0.6));
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(q.big?Math.max(24,Math.min(56,W*0.05)):16)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=q.color; ctx.shadowColor=q.color; ctx.shadowBlur=q.big?24:10;
    ctx.fillText(q.txt, q.x, q.y); ctx.restore();
  }
}

/* ============================ HUD ============================ */

  /* YOU chip — bottom-left corner */
  drawYouChip();

  if((MODE==='watch'||MODE==='skill') && (G.state==='LIVE'||G.state==='THROWN'||G.state==='PRESNAP')){

      var skillNames=skillPicked.map(function(i){ return SKILL_DEFS[i]?SKILL_DEFS[i].label:''; }).join(' · ');

      ctx.fillStyle= c.turbo>0.25?'#ff2bd6':'#ff1a1a';
      ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=8;
      ctx.fillRect(bx,by,bw*Math.max(0,c.turbo),bh); ctx.shadowBlur=0;
