<!DOCTYPE html>
<html>
<head>
  <title>Model Load Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: monospace; }
    canvas { display: block; }
    #log { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; max-height: 200px; overflow-y: auto; width: 400px; }
    .log-entry { font-size: 10px; margin: 2px 0; }
    .ok { color: #0f0; }
    .err { color: #f00; }
    .info { color: #0ff; }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="log"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const logEl = document.getElementById('log');
    function log(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(`[${type}]`, msg);
    }

    log('Initializing Three.js...', 'info');

    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
    camera.position.set(0, 5, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    // Basic lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // Add a reference sphere at origin
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x00ff00 })
    );
    scene.add(sphere);
    log('Added reference sphere at origin', 'ok');

    // Add a grid
    const grid = new THREE.GridHelper(50, 50);
    scene.add(grid);
    log('Added grid', 'ok');

    // Load models
    const loader = new GLTFLoader();
    const modelFiles = [
      'base_basic_pbr.glb',
      'base.glb',
      'base (1).glb'
    ];

    let loaded = 0;
    modelFiles.forEach((file, idx) => {
      const path = `/assets/models/${file}`;
      log(`Fetching ${file}...`, 'info');

      loader.load(
        path,
        (gltf) => {
          loaded++;
          log(`✓ Loaded ${file} (${loaded}/${modelFiles.length})`, 'ok');
          const model = gltf.scene;
          model.position.x = (idx - 1) * 10;
          model.scale.set(2, 2, 2);
          scene.add(model);
          log(`  → Positioned at x=${model.position.x}, children=${model.children.length}`, 'ok');
        },
        (progress) => {
          const pct = Math.round(progress.loaded / progress.total * 100);
          log(`  ⏳ ${file}: ${pct}%`, 'info');
        },
        (error) => {
          log(`✗ Failed to load ${file}: ${error.message || error}`, 'err');
        }
      );
    });

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.01;
      renderer.render(scene, camera);
    }

    log('Starting render loop...', 'info');
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
