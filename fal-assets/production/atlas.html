<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realm Atlas</title>
<style>
:root{--bg:#06080b;--panel:#0d1219;--line:#1d2733;--ink:#dfe7ee;--dim:#7a8794;--gold:#e8c45c;--em:#00ff9c;--cy:#5fe0ff;--red:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;letter-spacing:.14em;color:var(--gold)}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.sub a{color:var(--cy)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--dim)}
main{max-width:1400px;margin:0 auto;padding:16px}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:22px 0 10px}
.scale{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.scale svg{display:block;min-width:900px;width:100%}
.scale text{font-size:11px;fill:var(--dim)}
.realms{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;gap:12px;align-items:flex-start}
.top h3{margin:0;font-size:16px}
.role{color:var(--dim);font-size:12px}
.loc{flex:0 0 86px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.row figure{margin:0;flex:0 0 auto;text-align:center}
.row img{height:96px;width:auto;max-width:170px;object-fit:cover;border-radius:8px;background:#2a3038;display:block}
.row figcaption{font-size:10px;color:var(--dim);margin-top:3px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.none{font-size:12px;color:var(--red);border:1px dashed rgba(255,107,122,.5);border-radius:8px;padding:10px;height:96px;display:grid;place-items:center;text-align:center;min-width:130px}
.land{display:flex;gap:12px;align-items:center;background:#080c11;border:1px solid var(--line);border-radius:10px;padding:8px}
.land img{height:110px;width:110px;object-fit:cover;border-radius:8px;background:#2a3038}
.land b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;border-radius:999px;padding:3px 8px;border:1px solid}
.c-shipped{color:var(--em);border-color:rgba(0,255,156,.45)}
.c-concept{color:var(--gold);border-color:rgba(232,196,92,.45)}
.c-needed{color:var(--red);border-color:rgba(255,107,122,.45)}
.c-world{color:var(--dim);border-color:var(--line)}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:4px}
ul.needs{margin:0;padding-left:18px;font-size:12.5px}
ul.needs li{margin:2px 0}
</style>
</head>
<body>
<header>
  <h1>SHADDAI · REALM ATLAS</h1>
  <div class="sub">Everything we have and everything we still need, realm by realm, at real size · <a href="map.html">🗺 World Planner</a> · <a href="board.html">asset board</a></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <h2>REAL SCALE — every building next to a 1.8 m player</h2>
  <div class="scale"><svg id="scaleA" viewBox="0 0 1200 230"></svg></div>
  <div class="scale" style="margin-top:10px"><svg id="scaleB" viewBox="0 0 1200 330"></svg></div>
  <h2>REALMS</h2>
  <div class="realms" id="realms"></div>
</main>
<script src="../../public/world-layout.js"></script>
<script src="board-data.js"></script>
<script src="placements.js"></script>
<script src="atlas-data.js"></script>
<script src="atlas-refs.js"></script>
<script>
(function(){
  const A = window.ATLAS, L = window.WORLD_LAYOUT, AR = window.ATLAS_REFS || {};
  A.realms.forEach((r) => { r.refs = Array.from(new Set((r.refs || []).concat(AR[r.id] || []))); });
  const B = window.FAL_BOARD || { manifest: { assets: [] }, spent: 0 };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // image for an asset id: shipped 3D thumb > HF/fal concept > spec concept
  const man = {}; (B.manifest.assets || []).forEach((a) => { man[a.id] = a; });
  function img(id) {
    const cands = [];
    if (man[id] && man[id].concepts && man[id].concepts.length) cands.push('../' + man[id].concepts[0]);
    cands.push(`models/${id}-thumb.png`, `../concepts/${id}.png`);
    return cands;
  }
  const imgTag = (id, cls) => { const c = img(id); return `<img ${cls ? `class="${cls}"` : ''} src="${esc(c[0])}" data-alt="${esc(c.slice(1).join('|'))}" onerror="const a=(this.dataset.alt||'').split('|').filter(Boolean);if(a.length){this.src=a.shift();this.dataset.alt=a.join('|')}else{this.style.visibility='hidden'}" alt="">`; };

  // ── totals ──
  let shipped = 0, concept = 0, needed = 0;
  A.realms.forEach((r) => { r.models.forEach(([, s]) => { if (s === 'shipped') shipped++; else if (s === 'concept') concept++; else needed++; }); if (r.landmark.have === 'concept') concept++; });
  const refsN = A.realms.reduce((s, r) => s + r.refs.length, 0), noRef = A.realms.filter((r) => !r.refs.length).length;
  document.getElementById('stats').innerHTML = [
    [A.realms.length, 'realms incl. colosseum'], [shipped, 'models ready (3D done)'], [concept, 'approved concepts → 3D next'],
    [needed, 'still to design'], [refsN, 'world reference images'], [noRef, 'realms with no reference yet'], ['$' + (B.spent || 0).toFixed(2), 'of $100 fal spent'],
  ].map(([v, t]) => `<div class="stat"><b>${v}</b><span>${t}</span></div>`).join('');

  // ── scale strips (true height; A = human scale ≤ 30m, B = landmarks) ──
  // resolve the first image path that actually loads (SVG <image> has no onerror fallback)
  const probe = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(src); im.onerror = () => res(null); im.src = src; });
  async function firstImg(id) { for (const c of img(id)) { const ok = await probe(c); if (ok) return ok; } return null; }
  async function strip(svgId, items, maxH, H) {
    const svg = document.getElementById(svgId), base = H - 30, k = (H - 60) / maxH;
    const srcs = await Promise.all(items.map((it) => it.id === 'person' ? null : firstImg(it.id)));
    let x = 20, out = `<line x1="0" y1="${base}" x2="1200" y2="${base}" stroke="#1d2733"/>`, n = 0;
    for (const it of items) {
      const src = srcs[n++];
      const h = it.h * k, w = Math.max(6, it.w * k);
      if (x + w > 1190) break;
      out += it.id === 'person'
        ? `<rect x="${x}" y="${base - h}" width="${Math.max(3, w)}" height="${Math.max(2, h)}" rx="2" fill="#5fe0ff"/>`
        : (src ? `<image href="${esc(src)}" x="${x}" y="${base - h}" width="${w}" height="${h}" preserveAspectRatio="xMidYMax slice"/>` : `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="#1a232d"/>`) + `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="none" stroke="#e8c45c" stroke-opacity=".5"/>`;
      const small = w < 40, ty = small ? base - h - 16 - (n % 2) * 12 : base + 14;   // tiny items: label above, staggered
      out += small ? `<text x="${x}" y="${ty}">${esc(it.label)} ${it.h}m</text>` : `<text x="${x}" y="${base + 14}">${esc(it.label)}</text><text x="${x}" y="${base + 26}" style="fill:#566372">${it.h} m</text>`;
      x += w + (small ? 58 : 26);
    }
    svg.innerHTML = out;
  }
  strip('scaleA', A.scale.filter((s) => s.h <= 30 && s.id !== 'hero-colosseum'), 26, 230);
  strip('scaleB', [A.scale[0]].concat(A.scale.filter((s) => s.h >= 24)), 205, 330);

  // ── realm cards ──
  const box = document.getElementById('realms');
  const biome = (id) => (L.biomes || []).find((b) => b.id === id);
  A.realms.forEach((r) => {
    const b = biome(r.id), c = b ? b.center : (r.center || [0, 0]), rad = b ? b.radius : 46;
    const loc = `<svg class="loc" viewBox="-740 -740 1480 1480"><rect x="-720" y="-720" width="1440" height="1440" fill="#0b1117" stroke="#1d2733" stroke-width="10"/>
      <circle r="450" fill="none" stroke="#6b4a2b" stroke-width="140" opacity=".6"/>
      ${(L.biomes || []).map((o) => `<circle cx="${o.center[0]}" cy="${o.center[1]}" r="${o.radius}" fill="#${(o.color >>> 0).toString(16).padStart(6, '0')}" opacity="${o.id === r.id ? .9 : .15}"/>`).join('')}
      ${b ? '' : `<circle cx="${c[0]}" cy="${c[1]}" r="60" fill="#ff4a8a"/>`}</svg>`;
    const refs = r.refs.length ? r.refs.map((p) => `<figure><img src="../${esc(p)}" alt=""><figcaption>${esc(p.split('/').pop())}</figcaption></figure>`).join('')
      : `<div class="none">No reference yet<br>— send one if you have a look in mind</div>`;
    const chips = r.models.map(([id, s]) => `<span class="chip c-${s}">${esc(id)}</span>`).join('') + r.world.map((w) => `<span class="chip c-world">${esc(w)}</span>`).join('');
    box.insertAdjacentHTML('beforeend', `<div class="card">
      <div class="top">${loc}<div><h3>${esc(r.name)}</h3><div class="role">${esc(r.role)}</div>
        <div class="role" style="margin-top:4px">center ${c.join(', ')} · radius ${rad} m · ${Math.round(Math.hypot(c[0], c[1]))} m from the Source</div></div></div>
      <div><div class="lbl">REFERENCES</div><div class="row">${refs}</div></div>
      <div class="land">${imgTag(r.landmark.id)}<div><div class="lbl">LANDMARK · ${r.landmark.have === 'shipped' ? '3D READY' : 'CONCEPT — 3D NEXT'}</div><b>${esc(r.landmark.id)}</b><span class="role">${esc(r.landmark.dims)}</span></div></div>
      <div><div class="lbl">MODELS · <span style="color:var(--em)">ready</span> · <span style="color:var(--gold)">concept</span> · <span style="color:var(--red)">needed</span> · in world today</div><div class="chips">${chips}</div></div>
      <div><div class="lbl">STILL NEEDED</div><ul class="needs">${r.needs.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>
    </div>`);
  });
})();
</script>
</body>
</html>
