/* YOU chip: small corner badge showing your agent action-art + team name */
function drawYouChip(){
  if(G.teams.YOU==null) return;
  var idx=G.teams.YOU, a=AGENTS[idx];
  var col=teamCol(HUMAN);
  var chipH=34, chipW=Math.min(W*0.28, 180);
  var cx2=14, cy2=H-chipH-38; // above turbo bar
  // panel
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.70)';
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.shadowColor=col; ctx.shadowBlur=8;
  roundRect(cx2, cy2, chipW, chipH, 8); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
  // mini art image (square panel left side)
  var imgSize=chipH-4;
  var bImg=bestImg(a);
  ctx.save();
  roundRect(cx2+2, cy2+2, imgSize, imgSize, 6); ctx.clip();
  if(bImg){
    try{ ctx.drawImage(bImg, cx2+2, cy2+2, imgSize, imgSize); }catch(e){}
  } else {
    ctx.fillStyle=col; ctx.globalAlpha=0.35; ctx.fillRect(cx2+2, cy2+2, imgSize, imgSize); ctx.globalAlpha=1;
  }
  ctx.restore();
  // labels
  var tx=cx2+imgSize+8;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font="700 9px 'Share Tech Mono',monospace"; ctx.fillStyle='#00ff88';
  ctx.fillText('YOU', tx, cy2+4);
  ctx.font="800 "+Math.max(9,Math.min(13,chipW*0.08))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
  // truncate team name if needed
  var tn=teamName(a.id);
  ctx.fillText(tn, tx, cy2+14); ctx.shadowBlur=0;
  // Show QB rating (with skill boost if active)
  var baseRat2=AGENT_RATING[a.id]||{qb:0.7};
  var effRat2=getEffectiveRating(baseRat2,HUMAN);
  var qbR=Math.round(effRat2.qb*100);
  var qbLabel='QB '+qbR+'%'+(skillBoosts.qb>0?' ⬆':'');
  ctx.font="700 8px 'Share Tech Mono',monospace"; ctx.fillStyle='rgba(180,255,220,0.7)';
  ctx.fillText(qbLabel, tx, cy2+chipH-12);
  ctx.restore();

  // Active abilities panel (below YOU chip)
  var abils = AGENT_ABILITIES[a.id] || [];
  if(abils.length>0){
    var abilY = cy2 + chipH + 5;
    var abilX = cx2;
    ctx.save();
    ctx.font="700 8px 'Share Tech Mono',monospace";
    ctx.textAlign='left'; ctx.textBaseline='top';
    for(var ai=0;ai<abils.length;ai++){
      var abilLabel = abils[ai].replace(/_/g,' ').toUpperCase();
      var abilCol = col;
      // check if skill-boosted version active
      var isActive = skillBoosts[abils[ai]]>0;
      ctx.fillStyle = isActive ? '#ff2bd6' : 'rgba(180,255,200,0.55)';
      ctx.shadowColor = isActive ? '#ff2bd6' : 'transparent';
      ctx.shadowBlur = isActive ? 6 : 0;
      ctx.fillText((isActive?'⬆ ':'◈ ')+abilLabel, abilX, abilY+ai*13);
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }
}
function drawBadge(cx,cy,rad,idx,color){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.283); ctx.closePath();
  ctx.fillStyle='#04140d'; ctx.fill();
  ctx.save(); ctx.clip();
  var a=(idx!=null)?AGENTS[idx]:null;
  var bImg = a ? bestImg(a) : null;
  if(bImg){
    try{ ctx.drawImage(bImg, cx-rad, cy-rad, rad*2, rad*2); }catch(e){}
  } else {
    ctx.fillStyle=color; ctx.globalAlpha=0.35; ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2); ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.283); ctx.stroke();
  ctx.restore();
}
function scoreBlock(x,y,teamKey,val,color,align,hasBall){
  var idx=(teamKey===HUMAN)?G.teams.YOU:G.teams.CPU;
  var a=(idx!=null)?AGENTS[idx]:null;
  var rad=20; // larger badge
  var bx=(align==='left')? x+rad : x-rad;
  drawBadge(bx,y+rad,rad,idx,color);
  var tx=(align==='left')? x+rad*2+8 : x-rad*2-8;
  var tname = a ? teamName(a.id) : (teamKey===HUMAN?'YOU':'CPU');
  ctx.save(); ctx.textAlign=align; ctx.textBaseline='top';
  // team name (small, compact)
  ctx.font="700 "+Math.max(9,Math.min(12,W*0.011))+"px 'Share Tech Mono',monospace";
  ctx.fillStyle=color; ctx.globalAlpha=0.9;
  ctx.fillText(tname+(hasBall?' ◉':''), tx, y);
  ctx.globalAlpha=1;
  // score (big)
  ctx.font="800 "+Math.max(22,Math.min(38,W*0.032))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=14;
  ctx.fillText(val, tx, y+14);
  ctx.shadowBlur=0;
  // YOU / CPU label underneath
  if(teamKey===HUMAN){
    ctx.font="600 9px 'Share Tech Mono',monospace"; ctx.fillStyle='#00ff88'; ctx.globalAlpha=0.8;
    ctx.fillText('YOU', tx, y+14+Math.max(22,W*0.032)+2);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawStatePrompts(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  // CHANGE 1: Show jump-catch window prompt when ball is in the air and approaching receiver
  if(G.state==='THROWN' && G.offenseTeam===HUMAN && !AP.on){
    var pr2=Math.min(1,ball.t/ball.dur);
    if(pr2>0.50){
      var pulse2=0.55+0.45*Math.sin(perfNow*0.016);
      ctx.save(); ctx.globalAlpha=pulse2;
      ctx.font="800 "+Math.max(16,Math.min(28,W*0.024))+"px 'Orbitron',sans-serif";
      var jc=ball.jumpPressed?'#00ff88':'#ffdd00';
      ctx.fillStyle=jc; ctx.shadowColor=jc; ctx.shadowBlur=16;
      ctx.fillText(ball.jumpPressed?'✓ JUMP!':'↑ SPACE TO JUMP-CATCH', W/2, H*0.82);
      ctx.shadowBlur=0; ctx.restore();
    }
  }
  if(G.result && (G.state==='DEAD'||G.state==='PLAYCALL'||G.state==='PRESNAP')){
    ctx.font="800 "+Math.max(16,Math.min(30,W*0.026))+"px 'Orbitron',sans-serif";
    ctx.fillStyle=G.resultColor; ctx.shadowColor=G.resultColor; ctx.shadowBlur=16;
    ctx.fillText(G.result, W/2, H*0.40); ctx.shadowBlur=0;
  }
  if(G.state==='PLAYCALL' && MODE==='play'){ drawPlayMenu(); }
  else if(G.state==='PRESNAP' && MODE==='play'){
    if(G.offenseTeam===HUMAN){
      var pulse=0.6+0.4*Math.sin(perfNow*0.006); ctx.globalAlpha=pulse;
      ctx.font="800 "+Math.max(24,Math.min(46,W*0.045))+"px 'Orbitron',sans-serif";
      ctx.fillStyle='#00ff88'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=22;
      ctx.fillText('▶ SNAP (SPACE)', W/2, H*0.80); ctx.globalAlpha=1; ctx.shadowBlur=0;
      ctx.font="13px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
      ctx.fillText(G.playType==='run'?'HAND-OFF · run with the RB':'HOLD SPACE to charge throw · RELEASE to throw · E=cycle receiver · SPACE=jump-catch after ball', W/2, H*0.85);
    } else {
      ctx.font="800 "+Math.max(18,Math.min(32,W*0.03))+"px 'Orbitron',sans-serif";
      ctx.fillStyle=teamCol(CPU); ctx.shadowColor=teamCol(CPU); ctx.shadowBlur=16;
      ctx.fillText(agentName(CPU)+' BALL — DEFENSE!', W/2, H*0.80); ctx.shadowBlur=0;
      ctx.font="13px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
      ctx.fillText('move your defender (green ring) · E=switch · SPACE=dive tackle', W/2, H*0.85);
    }
  }
  ctx.restore();
}
function drawPlayMenu(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(16,Math.min(24,W*0.02))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=12;
  ctx.fillText('CALL YOUR PLAY', W/2, H*0.62); ctx.shadowBlur=0;
  var n=PLAYS.length, cw=Math.min(150,W/(n+1)), gap=cw*0.12, total=n*cw+(n-1)*gap;
  var startX=W/2-total/2, cy=H*0.70, ch=cw*0.62;
  for(var i=0;i<n;i++){
    var x=startX+i*(cw+gap), sel=(i===selPlay);
    ctx.globalAlpha=1;
    ctx.fillStyle=sel?'rgba(0,255,136,0.18)':'rgba(0,240,255,0.06)';
    ctx.strokeStyle=sel?'#00ff88':'#0aa'; ctx.lineWidth=sel?2.5:1;
    ctx.shadowColor=sel?'#00ff88':'transparent'; ctx.shadowBlur=sel?16:0;
    roundRect(x,cy,cw,ch,8); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=sel?'#00ff88':'#8fd';
    ctx.font="800 "+Math.max(13,cw*0.14)+"px 'Orbitron',sans-serif";
    ctx.fillText(PLAYS[i].name, x+cw/2, cy+ch*0.36);
    ctx.fillStyle='#7fe'; ctx.font=Math.max(9,cw*0.085)+"px 'Share Tech Mono',monospace";
    ctx.fillText(PLAYS[i].sub, x+cw/2, cy+ch*0.66);
  }
  ctx.font="13px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
  ctx.fillText('◀ A / D ▶  choose   ·   SPACE / ACT  confirm', W/2, cy+ch+26);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ============================ TEAM SELECT SCREEN ============================ */
function drawSelect(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.font="800 "+Math.max(22,Math.min(46,W*0.045))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00ff88'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=20;
  ctx.fillText(selPhase===0?'CHOOSE YOUR AGENT TEAM':'CHOOSE THE OPPONENT', W/2, H*0.12); ctx.shadowBlur=0;

  if(selPhase===1){
    var youTname=(G.teams.YOU!=null)?teamName(AGENTS[G.teams.YOU].id):'YOU';
    ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
    ctx.fillText('YOU: '+youTname, W/2, H*0.18);
  }

  var cols = (W<620)?4:7;
  var rows = Math.ceil(AGENTS.length/cols);
  var pad = 14;
  var cw = Math.min(150, (W-40)/cols - pad);
  var ch = cw*1.34;
  var totalW = cols*cw + (cols-1)*pad;
  var startX = W/2 - totalW/2;
  var startY = H*0.24;

  selCards.length=0;
  for(var i=0;i<AGENTS.length;i++){
    var col=i%cols, row=(i/cols)|0;
    var x=startX + col*(cw+pad);
    var y=startY + row*(ch+pad);
    selCards.push({x:x,y:y,w:cw,h:ch});
    var a=AGENTS[i];
    var taken=(selPhase===1 && i===G.teams.YOU);
    var isSel=(i===selIdx && !taken);
    var isYours=(G.teams.YOU===i);

    ctx.save();
    ctx.globalAlpha = taken?0.35:1;
    // card body
    ctx.fillStyle= isSel?'rgba(0,0,0,0.65)':'rgba(4,16,12,0.7)';
    ctx.strokeStyle=a.color; ctx.lineWidth=isSel?3.5:1.5;
    ctx.shadowColor=a.color; ctx.shadowBlur=isSel?22:6;
    roundRect(x,y,cw,ch,10); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;

    // portrait (prefer action-art)
    var portH=ch*0.68;
    ctx.save();
    roundRect(x+6,y+6,cw-12,portH-6,8); ctx.clip();
    var selBImg=bestImg(a);
    if(selBImg){
      try{ ctx.drawImage(selBImg, x+6, y+6, cw-12, portH-6); }catch(e){ drawBadgePlaceholder(x+6,y+6,cw-12,portH-6,a); }
    } else {
      drawBadgePlaceholder(x+6,y+6,cw-12,portH-6,a);
    }
    ctx.restore();

    // team name (agent id on top line, mascot on bottom)
    var tn=teamName(a.id);
    ctx.fillStyle=a.color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+Math.max(9,cw*0.12)+"px 'Orbitron',sans-serif";
    ctx.fillText(a.id, x+cw/2, y+ch-ch*0.16);
    ctx.font=Math.max(7,cw*0.085)+"px 'Share Tech Mono',monospace";
    ctx.fillStyle='rgba(200,255,220,0.7)';
    ctx.fillText(MASCOTS[(function(){var h=0;for(var ci=0;ci<a.id.length;ci++){h=(h*31+a.id.charCodeAt(ci))&0xffff;}return h%MASCOTS.length;})()], x+cw/2, y+ch-ch*0.06);

    if(isYours){
      ctx.fillStyle='#00ff88'; ctx.font="10px 'Share Tech Mono',monospace";
      ctx.fillText('★ YOU', x+cw/2, y+14);
    }
    if(taken){
      ctx.fillStyle='#9fe'; ctx.font="10px 'Share Tech Mono',monospace";
      ctx.fillText('YOURS', x+cw/2, y+ch/2);
    }
    ctx.restore();
  }

  var pulse=0.6+0.4*Math.sin(perfNow*0.006); ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(16,Math.min(26,W*0.024))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=16;
  ctx.fillText('◀ A / D ▶  ·  SPACE / TAP CARD = '+(selPhase===0?'PICK TEAM':'KICK OFF'), W/2, startY+rows*(ch+pad)+18);
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  // BACK button
  var backLbl = selPhase===0 ? '◀ BACK TO TITLE' : '◀ BACK';
  drawNavBtn(14, H-52, 150, 38, backLbl, '#00f0ff', navBack, 'back');
  ctx.restore();
}
function drawBadgePlaceholder(x,y,w,h,a){
  ctx.fillStyle=shade(a.color,-120); ctx.fillRect(x,y,w,h);
  ctx.fillStyle=a.color; ctx.globalAlpha=0.9; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(20,w*0.5)+"px 'Orbitron',sans-serif";
  ctx.fillText(a.id.charAt(0), x+w/2, y+h/2); ctx.globalAlpha=1;
}

function drawSkillSelect(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.font="800 "+Math.max(18,Math.min(36,W*0.034))+"px 'Orbitron',sans-serif";

  ctx.fillText('ACTIVATE ABILITIES', W/2, H*0.10); ctx.shadowBlur=0;

  // Show which agent's abilities these are
  var agIdx2=(G.teams.YOU!=null)?G.teams.YOU:0;
  var agObj=AGENTS[agIdx2];
  ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle=agObj?agObj.color:'#ff2bd6';
  ctx.fillText((agObj?agObj.id+' · ':'')+'SIGNATURE ABILITIES', W/2, H*0.17);
  ctx.font="11px 'Share Tech Mono',monospace"; ctx.fillStyle='#f9d';
  ctx.fillText('Choose up to '+skillPickMax+' — AI runs the match with your boosts active', W/2, H*0.22);

  var sw=Math.min(W*0.42,310), sh=Math.min(H*0.14,90), gap2=Math.min(W*0.04,22);
  var totalSH=SKILL_DEFS.length*(sh+gap2)-gap2;
  var sx=W/2-sw/2, sy=H*0.28;
  skillBtns.length=0;

  for(var j=0;j<SKILL_DEFS.length;j++){
    var sk=SKILL_DEFS[j], bsy=sy+j*(sh+gap2);
    var picked=skillPicked.indexOf(j)>=0;
    skillBtns.push({x:sx,y:bsy,w:sw,h:sh,action:'skill',idx:j});

    ctx.save();
    ctx.fillStyle=picked?'rgba(255,43,214,0.18)':'rgba(4,12,10,0.65)';
    ctx.strokeStyle=picked?'#ff2bd6':'rgba(255,43,214,0.35)'; ctx.lineWidth=picked?2.5:1.2;
    ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=picked?18:4;
    roundRect(sx,bsy,sw,sh,10); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;

    // icon
    ctx.font=Math.max(22,sh*0.36)+"px serif"; ctx.fillStyle='#ff2bd6';
    ctx.fillText(sk.icon, sx+sh*0.52, bsy+sh/2);
    // label + desc
    ctx.textAlign='left'; ctx.font="800 "+Math.max(12,sw*0.055)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=picked?'#ff2bd6':'#f9d'; ctx.shadowColor=picked?'#ff2bd6':'transparent'; ctx.shadowBlur=picked?8:0;
    ctx.fillText(sk.label, sx+sh*0.92, bsy+sh*0.34); ctx.shadowBlur=0;
    ctx.font=Math.max(9,sw*0.042)+"px 'Share Tech Mono',monospace"; ctx.fillStyle='rgba(200,150,220,0.85)';
    ctx.fillText(sk.desc, sx+sh*0.92, bsy+sh*0.68);
    // checkmark if picked
    if(picked){
      ctx.textAlign='right'; ctx.font="800 "+Math.max(14,sh*0.30)+"px 'Orbitron',sans-serif";
      ctx.fillStyle='#ff2bd6'; ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=10;
      ctx.fillText('✓', sx+sw-10, bsy+sh/2); ctx.shadowBlur=0;
    }
    ctx.textAlign='center'; ctx.restore();
  }

  // Confirm button
  var confY=sy+totalSH+Math.max(22,H*0.04);
  var confW=Math.min(240,W*0.4), confH=Math.min(52,H*0.08);
  var confX=W/2-confW/2;
  skillBtns.push({x:confX,y:confY,w:confW,h:confH,action:'confirm'});
  var pulse2=0.65+0.35*Math.sin(perfNow*0.008);
  ctx.save(); ctx.globalAlpha=pulse2;
  ctx.fillStyle='rgba(255,43,214,0.20)'; ctx.strokeStyle='#ff2bd6'; ctx.lineWidth=2.5;
  ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=20;
  roundRect(confX,confY,confW,confH,10); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
  ctx.globalAlpha=1;
  ctx.font="800 "+Math.max(14,confH*0.32)+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#ff2bd6'; ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=12;
  ctx.fillText((skillPicked.length>0?'▶ START WITH '+skillPicked.length+' SKILL'+(skillPicked.length>1?'S':''):'▶ START (NO SKILLS)'), W/2, confY+confH/2);
  ctx.shadowBlur=0; ctx.restore();
  // BACK → mode select
  drawNavBtn(14, H-52, 150, 38, '◀ BACK', '#ff2bd6', navBack, 'back');
  ctx.restore();
}

function drawOver(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  var tie=(G.scoreYou===G.scoreCpu);
  var col=G.win?'#00ff88':(tie?'#00f0ff':'#ff1a1a');

  /* --- big action-art panel for winner (or YOU on tie) --- */
  var winTeam = G.win?HUMAN:(tie?HUMAN:CPU);
  var winIdx = (winTeam===HUMAN)?G.teams.YOU:G.teams.CPU;
  var winA = (winIdx!=null)?AGENTS[winIdx]:null;
  var winBImg = winA?bestImg(winA):null;
  var artW=Math.min(W*0.34, 260), artH=artW*1.22;
  var artX=W/2-artW/2, artY=H*0.06;

  if(winBImg){
    // neon frame
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=28;
    ctx.strokeStyle=col; ctx.lineWidth=3;
    roundRect(artX-3, artY-3, artW+6, artH+6, 14); ctx.stroke(); ctx.shadowBlur=0;
    // clip + draw image
    roundRect(artX, artY, artW, artH, 12); ctx.clip();
    try{ ctx.drawImage(winBImg, artX, artY, artW, artH); }catch(e){}
    ctx.restore();
    // gradient overlay at bottom of art
    ctx.save();
    var fad=ctx.createLinearGradient(0,artY+artH*0.55,0,artY+artH);
    fad.addColorStop(0,'rgba(0,0,0,0)'); fad.addColorStop(1,'rgba(0,0,0,0.85)');
    ctx.fillStyle=fad;
    roundRect(artX, artY+artH*0.55, artW, artH*0.45, 12); ctx.fill();
    ctx.restore();
  } else {
    // fallback placeholder box
    ctx.save(); ctx.fillStyle='rgba(0,40,20,0.5)'; ctx.strokeStyle=col; ctx.lineWidth=3;
    roundRect(artX, artY, artW, artH, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle=col; ctx.globalAlpha=0.4; ctx.font="800 "+(artW*0.35)+"px 'Orbitron',sans-serif";
    ctx.fillText(winA?winA.id.charAt(0):'?', W/2, artY+artH/2); ctx.globalAlpha=1;
    ctx.restore();
  }

  /* team name on art */
  var winTName=winA?teamName(winA.id):(winTeam===HUMAN?'YOU':'CPU');
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(14,Math.min(22,artW*0.10))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.fillText(winTName, W/2, artY+artH-18); ctx.shadowBlur=0;
  ctx.restore();

  /* result headline */
  var headY = artY+artH+Math.max(22,H*0.025);
  ctx.font="800 "+Math.max(28,Math.min(78,W*0.075))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(G.win?'VICTORY!':(tie?'TIE GAME':'DEFEAT'), W/2, headY); ctx.shadowBlur=0;

  /* score line with both team names */
  var ytnYOU=teamNameForTeam(HUMAN), ytnCPU=teamNameForTeam(CPU);
  ctx.font="16px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText(ytnYOU+' '+G.scoreYou+'   —   '+G.scoreCpu+' '+ytnCPU, W/2, headY+Math.max(40,H*0.06));

  /* prompt */
  var pulse=0.6+0.4*Math.sin(perfNow*0.006); ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(14,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=16;
  ctx.fillText('SPACE = NEW MATCHUP   ·   R = REMATCH', W/2, headY+Math.max(80,H*0.115));
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  // MAIN MENU button on OVER screen
  var mmW=170, mmH=40;
  drawNavBtn(W/2-mmW/2, headY+Math.max(110,H*0.145), mmW, mmH, '⌂ MAIN MENU', '#00ff88', gotoTitle, 'main');
  ctx.restore();
}

/* ============================ TOUCH ============================ */
var touchVec={x:0,y:0}, touchTurbo=false;
(function setupTouch(){
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
  if(!isTouch) return;
  document.getElementById('touch').classList.add('on');
  var pad=document.getElementById('tpad'), stick=document.getElementById('tstick');
  var padId=null, cx=0, cy=0, rad=64;
  function padStart(e){ audio(); var r=pad.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2; padId=1; padMove(e); e.preventDefault(); }
  function padMove(e){ if(padId===null) return; var t=(e.touches?e.touches[0]:e);
    var dx=t.clientX-cx, dy=t.clientY-cy; var m=Math.hypot(dx,dy)||1; var cl=Math.min(m,rad);
    var nx=dx/m, ny=dy/m; touchVec.x=nx*(cl/rad); touchVec.y=ny*(cl/rad);
    stick.style.transform='translate('+(nx*cl)+'px,'+(ny*cl)+'px)'; e.preventDefault(); }
  function padEnd(e){ padId=null; touchVec.x=0; touchVec.y=0; stick.style.transform='translate(0,0)'; }
  pad.addEventListener('touchstart',padStart,{passive:false});
  pad.addEventListener('touchmove',padMove,{passive:false});
  pad.addEventListener('touchend',padEnd); pad.addEventListener('touchcancel',padEnd);

  function bind(id,down,up){ var el=document.getElementById(id);
    el.addEventListener('touchstart',function(e){audio();down();e.preventDefault();},{passive:false});
    el.addEventListener('touchend',function(e){if(up)up();e.preventDefault();},{passive:false}); }
  bind('tACT', function(){ onAction(); }, null);
  bind('tSW',  function(){ onSwitch(); }, null);
  bind('tTUR', function(){ touchTurbo=true; }, function(){ touchTurbo=false; });
})();

/* ============================ BOOT ============================ */
resize();
newGame();
requestAnimationFrame(frame);

})();
</script>
