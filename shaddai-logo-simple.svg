<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="simpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="256" height="256" fill="#020817"/>
  
  <!-- Simple infinity symbol -->
  <path d="M90,128 C90,75 115,55 128,55 C141,55 166,75 166,128 C166,181 141,201 128,201 C115,201 90,181 90,128" 
        fill="none" stroke="url(#simpleGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="128" cy="128" r="12" fill="#00e5a0" filter="url(#glow)"/>
  
  <!-- Simple node dots -->
  <circle cx="90" cy="128" r="6" fill="#00e5a0"/>
  <circle cx="166" cy="128" r="6" fill="#00e5a0"/>
  <circle cx="128" cy="55" r="5" fill="#00c8ff"/>
  <circle cx="128" cy="201" r="5" fill="#00c8ff"/>
  
  <!-- Text - small below -->
  <text x="128" y="235" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00e5a0" letter-spacing="3">SHADDAI</text>
</svg>