<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Signals Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1e;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #a0aec0;
        }

        /* CONTROLS */
        .controls {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 1px solid #764ba2;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667eea;
            font-weight: 600;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #4a5568;
            margin-top: 4px;
        }

        .slider-value {
            min-width: 30px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        select {
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #16213e;
            padding-bottom: 12px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #fff;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 1px solid #764ba2;
            border-radius: 10px;
            padding: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .card:hover {
            border-color: #a78bfa;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
        }

        .card-badge {
            padding: 3px 8px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-badge.risky {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
        }

        .card-badge.medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .card-badge.safe {
            background: rgba(0, 255, 156, 0.2);
            color: #00ff9c;
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            color: #a0aec0;
            font-size: 10px;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .stat-value.positive {
            color: #00ff9c;
        }

        .stat-value.negative {
            color: #ff6464;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(102, 126, 234, 0.1);
            font-size: 11px;
            color: #4a5568;
        }

        .bid-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .bid-btn:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #4a5568;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div>
                <h1>🎯 Pro Signals</h1>
            </div>
            <div class="header-stats">
                <div>Signals: <span id="signal-count">0</span></div>
                <div>Avg Score: <span id="avg-score">0</span></div>
            </div>
        </header>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="control-group">
                <label>Strictness (More/Less Calls)</label>
                <div class="slider-container">
                    <input type="range" id="strictness" min="0" max="100" value="50">
                    <span class="slider-value" id="strictness-value">50</span>
                </div>
                <div class="slider-labels">
                    <span>Safe Only</span>
                    <span>All Tiers</span>
                </div>
            </div>

            <div class="control-group">
                <label>Risk Filter</label>
                <select id="risk-filter">
                    <option value="all">All Risk Tiers</option>
                    <option value="risky">Risky (Pre-Bond)</option>
                    <option value="medium">Medium (Bonded)</option>
                    <option value="safe">Safe (Established)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Views</label>
                <select id="view-select">
                    <option value="signals">Live Signals</option>
                    <option value="recommendations">Bid Recommendations</option>
                    <option value="top-dex">Top 25 DEX</option>
                    <option value="wallets">Tracked Wallets</option>
                </select>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="signals">📡 Live Signals</button>
            <button class="tab-btn" data-tab="recommendations">🎯 Top Bids</button>
            <button class="tab-btn" data-tab="quick-xs">⚡ Quick Xs</button>
            <button class="tab-btn" data-tab="top-dex">📊 Top 25 DEX</button>
        </div>

        <!-- GRID -->
        <div class="grid" id="grid">
            <div class="empty">Loading signals...</div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId') || 'guest';
        let allSignals = [];
        let currentView = 'signals';

        // Load user preferences
        async function loadPrefs() {
            try {
                const res = await fetch(`/api/pro-signals/feed?strictness=50&riskFilter=all`, {
                    headers: { 'x-user-id': userId }
                });
                const data = await res.json();
                allSignals = data.calls || [];
                renderSignals();
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('grid').innerHTML = '<div class="empty">Failed to load signals</div>';
            }
        }

        // Get filter values
        function getFilters() {
            return {
                strictness: parseInt(document.getElementById('strictness').value),
                riskFilter: document.getElementById('risk-filter').value,
            };
        }

        // Save user preferences
        async function savePrefs() {
            const filters = getFilters();
            try {
                await fetch('/api/pro-signals/prefs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': userId
                    },
                    body: JSON.stringify(filters)
                });
            } catch (err) {
                console.error('Save error:', err);
            }
        }

        // Filter signals
        function filterSignals() {
            const filters = getFilters();
            let filtered = allSignals;

            // Risk filter
            if (filters.riskFilter !== 'all') {
                filtered = filtered.filter(s => s.riskTier === filters.riskFilter);
            }

            return filtered.sort((a, b) => b.score - a.score);
        }

        // Render signals grid
        function renderSignals() {
            const filtered = filterSignals();
            const grid = document.getElementById('grid');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">No signals match your filters</div>';
                document.getElementById('signal-count').textContent = '0';
                document.getElementById('avg-score').textContent = '0';
                return;
            }

            const html = filtered.map(s => `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${s.symbol}</div>
                        <div class="card-badge ${s.riskTier}">${s.riskTier}</div>
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <span class="stat-label">Entry FDV</span>
                            <span class="stat-value">$${(s.entryFdv || 0).toLocaleString()}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Current Mult</span>
                            <span class="stat-value ${s.curMult >= 1 ? 'positive' : 'negative'}">${s.curMult ? s.curMult.toFixed(2) + 'x' : '—'}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Peak</span>
                            <span class="stat-value positive">${s.peakMult ? s.peakMult.toFixed(2) + 'x' : '—'}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Score</span>
                            <span class="stat-value">${s.score ? Math.round(s.score) : '0'}</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>${s.source}</span>
                        <button class="bid-btn">💰 BID</button>
                    </div>
                </div>
            `).join('');

            grid.innerHTML = html;

            // Update stats
            document.getElementById('signal-count').textContent = filtered.length;
            const avgScore = Math.round(filtered.reduce((sum, s) => sum + (s.score || 0), 0) / filtered.length);
            document.getElementById('avg-score').textContent = avgScore;
        }

        // Event listeners
        document.getElementById('strictness').addEventListener('input', (e) => {
            document.getElementById('strictness-value').textContent = e.target.value;
            savePrefs();
            renderSignals();
        });

        document.getElementById('risk-filter').addEventListener('change', () => {
            savePrefs();
            renderSignals();
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                // TODO: Implement tab switching
            });
        });

        // Load on start
        loadPrefs();
    </script>
</body>
</html>
