<!DOCTYPE html>
<html>
<head>
  <title>SHADDAI Colosseum</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { background: #0a0e0c; font-family: monospace; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: #0f0; padding: 20px; border: 2px solid #0f0; border-radius: 8px; z-index: 999; width: 300px; }
    .btn { background: rgba(0,255,100,0.2); border: 1px solid #0f0; color: #0f0; padding: 8px 12px; margin: 5px 0; cursor: pointer; width: 100%; font-family: monospace; }
    .btn:hover { background: rgba(0,255,100,0.4); }
    .btn.active { background: #0f0; color: #000; }
    #info { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: #0f0; padding: 15px; border: 1px solid #0f0; font-size: 12px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3 style="color:#0f0; margin-bottom: 15px;">⚔️ COLOSSEUM</h3>
    <div style="margin-bottom: 15px;">
      <div>Field: 100×64m</div>
      <div>Height: 35m</div>
      <div>Seats: 40 rows</div>
    </div>
    <button class="btn active" onclick="setMode('sand')">🏜️ Sand</button>
    <button class="btn" onclick="setMode('water')">💧 Water</button>
    <button class="btn" onclick="setMode('naval')">⛵ Naval</button>
    <button class="btn" onclick="setMode('terrain')">🏔️ Terrain</button>
    <div id="event" style="margin-top: 15px; font-size: 12px; color: #5fe0ff;">Ready...</div>
  </div>
  <div id="info">
    <div>Mode: <span id="modeTxt">SAND</span></div>
    <div>FPS: <span id="fpsTxt">0</span></div>
  </div>

  <script async src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, colosseum, clock;
    let frameCount = 0, lastTime = Date.now();
    let currentMode = 'sand';

    // Wait for Three.js to load
    function waitForThree() {
      if (typeof THREE === 'undefined') {
        setTimeout(waitForThree, 100);
        return;
      }
      init();
    }

    function init() {
      try {
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e0c);
        scene.fog = new THREE.Fog(0x0a0e0c, 300, 1000);

        // Camera
        camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(150, 80, 180);
        camera.lookAt(0, 30, 0);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // Build colosseum
        colosseum = buildColosseum();
        scene.add(colosseum.group);

        // Controls
        setupControls();
        window.addEventListener('resize', onResize);

        // Start animation
        animate();
      } catch (e) {
        console.error('Init error:', e);
        document.getElementById('ui').innerHTML = '<h3 style="color:red;">ERROR: ' + e.message + '</h3>';
      }
    }

    function buildColosseum() {
      const group = new THREE.Group();

      // Materials
      const mat = {
        sand: new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 }),
        water: new THREE.MeshStandardMaterial({ color: 0x1e90ff, roughness: 0.2, transparent: true, opacity: 0.8 }),
        seat: new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.8 }),
        stone: new THREE.MeshStandardMaterial({ color: 0xc9a961, roughness: 0.85 }),
        steel: new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.5 }),
        marble: new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 })
      };

      // Arena floors
      const sandFloor = new THREE.Mesh(new THREE.PlaneGeometry(100, 64, 32, 32), mat.sand);
      sandFloor.name = 'sand';
      sandFloor.rotation.x = -Math.PI / 2;
      sandFloor.position.y = 0.01;
      sandFloor.receiveShadow = true;
      group.add(sandFloor);

      const waterFloor = new THREE.Mesh(new THREE.PlaneGeometry(100, 64, 64, 64), mat.water);
      waterFloor.name = 'water';
      waterFloor.rotation.x = -Math.PI / 2;
      waterFloor.position.y = 0.5;
      waterFloor.visible = false;
      group.add(waterFloor);

      // Boats
      const boats = new THREE.Group();
      boats.name = 'boats';
      boats.visible = false;

      for (let i = 0; i < 2; i++) {
        const boat = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 15), mat.steel);
        hull.castShadow = true;
        boat.add(hull);

        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 12), mat.steel);
        mast.position.y = 8;
        boat.add(mast);

        const sail = new THREE.Mesh(new THREE.PlaneGeometry(6, 8), mat.marble);
        sail.position.set(2, 6, 0);
        boat.add(sail);

        boat.position.set((i * 2 - 1) * 40, 1.5, (i * 2 - 1) * 25);
        boat.userData.phase = i * Math.PI;
        boat.userData.baseY = 1.5;
        boats.add(boat);
      }
      group.add(boats);

      // Rocks
      const rocks = new THREE.Group();
      rocks.name = 'rocks';
      rocks.visible = false;
      for (let i = 0; i < 8; i++) {
        const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 2), mat.stone);
        const angle = (i / 8) * Math.PI * 2;
        rock.position.set(Math.cos(angle) * 40, 2, Math.sin(angle) * 40);
        rock.castShadow = true;
        rocks.add(rock);
      }
      group.add(rocks);

      // Podium
      const podGeo = new THREE.LatheGeometry([
        new THREE.Vector2(50, 0), new THREE.Vector2(53, 0),
        new THREE.Vector2(53, 2), new THREE.Vector2(50, 2)
      ], 64);
      const podium = new THREE.Mesh(podGeo, mat.stone);
      podium.castShadow = true;
      group.add(podium);

      // Lower bleachers
      for (let i = 0; i < 20; i++) {
        const r1 = 53 + i * 2.5;
        const r2 = 53 + (i + 1) * 2.5;
        const h = 0.75;
        const geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0), new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, h), new THREE.Vector2(r1, h)
        ], 64);
        const seat = new THREE.Mesh(geo, mat.seat);
        seat.position.y = 2 + i * h;
        seat.castShadow = true;
        group.add(seat);
      }

      // Promenade
      const promGeo = new THREE.LatheGeometry([
        new THREE.Vector2(103, 0), new THREE.Vector2(107, 0),
        new THREE.Vector2(107, 1), new THREE.Vector2(103, 1)
      ], 64);
      const prom = new THREE.Mesh(promGeo, mat.stone);
      prom.position.y = 18;
      group.add(prom);

      // Upper bleachers
      for (let i = 0; i < 20; i++) {
        const r1 = 107 + i * 2.5;
        const r2 = 107 + (i + 1) * 2.5;
        const h = 0.6;
        const geo = new THREE.LatheGeometry([
          new THREE.Vector2(r1, 0), new THREE.Vector2(r2, 0),
          new THREE.Vector2(r2, h), new THREE.Vector2(r1, h)
        ], 64);
        const seat = new THREE.Mesh(geo, mat.seat);
        seat.position.y = 18 + i * h;
        seat.castShadow = true;
        group.add(seat);
      }

      // Roof
      const roofGeo = new THREE.LatheGeometry([
        new THREE.Vector2(157, 0), new THREE.Vector2(165, 0),
        new THREE.Vector2(165, 35), new THREE.Vector2(157, 35)
      ], 64);
      const roof = new THREE.Mesh(roofGeo, mat.steel);
      roof.castShadow = true;
      group.add(roof);

      // Pillars
      for (let i = 0; i < 32; i++) {
        const angle = (i / 32) * Math.PI * 2;
        const x = Math.cos(angle) * 161;
        const z = Math.sin(angle) * 161;
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 30, 12), mat.steel);
        pillar.position.set(x, 15, z);
        pillar.castShadow = true;
        group.add(pillar);
      }

      // Lobby
      const lobbyFloor = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), mat.marble);
      lobbyFloor.rotation.x = -Math.PI / 2;
      lobbyFloor.position.set(0, 18, 200);
      lobbyFloor.receiveShadow = true;
      group.add(lobbyFloor);

      const backWall = new THREE.Mesh(new THREE.BoxGeometry(80, 30, 1), mat.stone);
      backWall.position.set(0, 30 / 2, 240);
      backWall.castShadow = true;
      group.add(backWall);

      [-1, 1].forEach(s => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 30, 40), mat.stone);
        wall.position.set(s * 40, 30 / 2, 200);
        wall.castShadow = true;
        group.add(wall);
      });

      // Lobby columns
      const colGeo = new THREE.CylinderGeometry(1.5, 1.5, 26, 12);
      [[-3, -1], [-3, 1], [0, -1], [0, 1], [3, -1], [3, 1]].forEach(([cx, cz]) => {
        const col = new THREE.Mesh(colGeo, mat.marble);
        col.position.set(cx * 15, 26 / 2, 200 + cz * 15);
        col.castShadow = true;
        group.add(col);
      });

      // Lighting
      group.add(new THREE.AmbientLight(0xffffff, 0.7));

      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(100, 100, 100);
      sun.castShadow = true;
      sun.shadow.mapSize.width = sun.shadow.mapSize.height = 4096;
      sun.shadow.camera.far = 800;
      group.add(sun);

      for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const light = new THREE.SpotLight(0xffd700, 2);
        light.position.set(Math.cos(angle) * 161, 33, Math.sin(angle) * 161);
        light.target.position.set(0, 15, 0);
        light.castShadow = true;
        group.add(light);
      }

      return {
        group,
        boats,
        setMode: (mode) => {
          group.getObjectByName('sand').visible = mode === 'sand';
          group.getObjectByName('water').visible = (mode === 'water' || mode === 'naval');
          boats.visible = (mode === 'water' || mode === 'naval');
          group.getObjectByName('rocks').visible = (mode === 'terrain');
        },
        update: (dt) => {
          boats.children.forEach((b, i) => {
            b.userData.phase += dt * 2;
            b.position.y = b.userData.baseY + Math.sin(b.userData.phase) * 0.4;
            b.rotation.z = Math.sin(b.userData.phase * 0.5) * 0.1;
          });
        }
      };
    }

    function setupControls() {
      let drag = false, prevX = 0, prevY = 0;

      document.addEventListener('mousedown', (e) => {
        drag = true;
        prevX = e.clientX;
        prevY = e.clientY;
      });

      document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -dx * 0.01);
        prevX = e.clientX;
        prevY = e.clientY;
      });

      document.addEventListener('mouseup', () => { drag = false; });

      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        const d = camera.position.length();
        const dir = camera.position.clone().normalize();
        const newD = Math.max(50, Math.min(500, d + e.deltaY * 0.2));
        camera.position.copy(dir.multiplyScalar(newD));
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (colosseum) {
        const dt = clock.getDelta();
        colosseum.update(dt);
      }

      frameCount++;
      const now = Date.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fpsTxt').textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      if (renderer) renderer.render(scene, camera);
    }

    function setMode(m) {
      currentMode = m;
      colosseum.setMode(m);
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const msgs = {
        sand: '⚔️ Gladiators enter the arena!',
        water: '🌊 Water fills the stadium!',
        naval: '⛵ Naval battle begins!',
        terrain: '🏔️ Terrain combat starts!'
      };
      document.getElementById('event').textContent = msgs[m];
      document.getElementById('modeTxt').textContent = m.toUpperCase();
    }

    // Start
    waitForThree();
  </script>
</body>
</html>
