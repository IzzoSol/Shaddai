<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADDAI · Iso Office v4</title>
<style>
  html,body{margin:0;background:#0d1017;color:#cfe3f2;font-family:'Segoe UI',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid #202838}
  h1{margin:0;font-size:16px}h1 b{color:#00ff88}
  .sub{color:#7d8ea3;font-size:12px;margin-top:3px}
  .wrap{padding:14px 22px}
  .stage{background:#0c1119;border:1px solid #202838;border-radius:12px;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  canvas{display:block;width:100%;height:auto;border-radius:8px;image-rendering:pixelated}
</style></head><body>
<header><h1>SHADDAI · <b>Iso Office</b> — simple modular characters · cosmetics · walk anim</h1>
<div class="sub">Slightly-better office guys: one tiny rig, swappable cap/hair/shirt/pants/skin, animated. 7 agents (chakra accents) + citizens.</div></header>
<div class="wrap"><div class="stage"><canvas id="c"></canvas></div></div>
<script>
'use strict';
const TW=84, TH=42;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2), CSSW=0, CSSH=560, OX=0, OY=0;
const GW=10, GH=8;
function resize(){CSSW=Math.min(document.querySelector('.stage').clientWidth-16,1180);canvas.style.width=CSSW+'px';canvas.style.height=CSSH+'px';canvas.width=CSSW*DPR;canvas.height=CSSH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;OX=CSSW*0.5-((GW-1)/2-(GH-1)/2)*TW/2;OY=90;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function iso(col,row){return [OX+(col-row)*TW/2, OY+(col+row)*TH/2];}
function Pth(pts){ctx.beginPath();ctx.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));for(let i=1;i<pts.length;i++)ctx.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));ctx.closePath();}
function box(col,row,w,d,h,top,opts){opts=opts||{};const cx=OX+(col-row)*TW/2,cy=OY+(col+row)*TH/2;const dx=(dc,dr)=>(dc-dr)*TW/2,dy=(dc,dr)=>(dc+dr)*TH/2;const hw=w/2,hd=d/2;const back=[cx+dx(-hw,-hd),cy+dy(-hw,-hd)],right=[cx+dx(hw,-hd),cy+dy(hw,-hd)],front=[cx+dx(hw,hd),cy+dy(hw,hd)],left=[cx+dx(-hw,hd),cy+dy(-hw,hd)];const up=p=>[p[0],p[1]-h];const tB=up(back),tR=up(right),tF=up(front),tL=up(left);ctx.fillStyle=opts.left||shade(top,-0.17);Pth([left,front,tF,tL]);ctx.fill();ctx.fillStyle=opts.right||shade(top,-0.33);Pth([front,right,tR,tF]);ctx.fill();ctx.fillStyle=top;Pth([tB,tR,tF,tL]);ctx.fill();if(opts.edge){ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;ctx.lineJoin='round';Pth([tB,tR,right,front,left,tL]);ctx.stroke();}}
function boxL(col,row,w,d,h,color,lift,opts){const s=OY;OY-=lift;box(col,row,w,d,h,color,opts);OY=s;}
function tileD(col,row,color){const [cx,cy]=iso(col,row);ctx.fillStyle=color;Pth([[cx,cy-TH/2],[cx+TW/2,cy],[cx,cy+TH/2],[cx-TW/2,cy]]);ctx.fill();ctx.strokeStyle=shade(color,-0.10);ctx.lineWidth=1;Pth([[cx,cy-TH/2],[cx+TW/2,cy],[cx,cy+TH/2],[cx-TW/2,cy]]);ctx.stroke();}

// ===== SIMPLE MODULAR CHARACTER (slightly-better office guy) =====
// parts: 2 leg stubs · torso · head · cap/hair · eyes.  All cosmetic slots are data.
const E={edge:true};
function armStub(c,r,sleeve,skinC,L){boxL(c,r,0.1,0.1,3,skinC,8+L,E);boxL(c,r,0.1,0.1,13,sleeve,11+L,E);}
function guy(col,row,rig,t,phase){
  const tt=t/1000+(phase||0), walk=rig.anim==='walk';
  const bob=walk?Math.abs(Math.cos(tt*7))*1.5:Math.sin(tt*1.7)*0.5;
  const str=walk?Math.sin(tt*7)*0.05:0;
  const skin=rig.skin||'#f0c199', shirt=rig.shirt||'#e0662e', pants=rig.pants||'#37414f';
  const shoe=rig.shoe||'#2a2a2a', hair=rig.hair||'#3a2a1a', cap=rig.cap, sleeve=rig.jacket||shirt;
  const [cx,cy]=iso(col,row);
  ctx.fillStyle='rgba(0,0,0,0.26)';ctx.beginPath();ctx.ellipse(cx,cy+3,13,6,0,0,7);ctx.fill();
  const L=bob;
  // BACK arm (before torso so torso overlaps → flush)
  armStub(col+0.18+str,row-0.18+str,sleeve,skin,L);
  // legs: shoe + pant leg (2, alternate stride)
  for(const g of [[-0.08,0.08,1],[0.08,-0.08,-1]]){
    const c=col+g[0]+str*g[2], r=row+g[1]+str*g[2];
    boxL(c,r+0.03,0.16,0.17,4,shoe,0+L,E);        // shoe
    boxL(c,r,0.13,0.13,6,pants,4+L,E);            // pant leg
  }
  // torso (jacket colour if present)
  boxL(col,row,0.4,0.3,15,rig.jacket||shirt,10+L,E);
  if(rig.jacket){ctx.fillStyle=shirt;ctx.fillRect(Math.round(cx)-2,Math.round(cy)-(10+13+L),4,12);} // inner shirt stripe
  ctx.fillStyle=shade(rig.jacket||shirt,0.16);ctx.fillRect(Math.round(cx)-4,Math.round(cy)-(10+14+L),8,2); // collar
  if(rig.emblem){ctx.fillStyle=rig.emblem;ctx.fillRect(Math.round(cx)-3,Math.round(cy)-(10+8+L),6,6);}
  // FRONT arm (after torso → overlaps front edge)
  armStub(col-0.18-str,row+0.18-str,sleeve,skin,L);
  // head
  boxL(col,row,0.44,0.35,15,skin,25+L,E);
  const ey=cy-(25+L)-7;ctx.fillStyle='#241a12';ctx.fillRect(Math.round(cx)-5,Math.round(ey),3,4);ctx.fillRect(Math.round(cx)+3,Math.round(ey),3,4);
  // hair + cap/hat, with a forehead fringe
  if(cap){boxL(col,row,0.5,0.4,6,cap,40+L,E);boxL(col,row+0.15,0.42,0.06,3,hair,38+L,E);}
  else{boxL(col,row,0.47,0.38,7,hair,39+L,E);boxL(col,row+0.16,0.44,0.07,5,hair,35+L,E);}
}

// ===== room =====
function drawFloor(){for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){let col=(c+r)%2?'#8a6a44':'#7d5f3c';if(c>=3&&c<=6&&r>=2&&r<=5)col=(c+r)%2?'#3a4d6b':'#33445e';tileD(c,r,col);}}
function drawWalls(){boxL((GW-1)/2,-0.62,GW,0.16,80,'#2c3242',0);boxL(-0.62,(GH-1)/2,0.16,GH,80,'#252a38',0);}
function deskFn(c,r){boxL(c,r,0.8,0.5,16,'#5a3f28',0,E);boxL(c-0.1,r-0.1,0.3,0.05,15,'#20242c',16,E);const [cx,cy]=iso(c-0.1,r-0.1);ctx.fillStyle='#5fe0ff';ctx.fillRect(Math.round(cx)-8,Math.round(cy)-30,10,7);}
function plantFn(c,r){boxL(c,r,0.2,0.2,11,'#7a5230',0,E);boxL(c,r,0.5,0.5,12,'#2fae4f',11,E);boxL(c,r,0.32,0.32,10,'#37c95f',23,E);}
function sofaFn(c,r){boxL(c,r,0.95,0.5,10,'#c0455a',0,E);boxL(c-0.2,r-0.2,0.55,0.5,16,'#a83a4e',10,E);}
const FURN=[{c:1,r:1,fn:deskFn},{c:8,r:1,fn:deskFn},{c:0,r:7,fn:plantFn},{c:9,r:7,fn:plantFn},{c:9,r:0,fn:plantFn},{c:5,r:6,fn:sofaFn}];
const blocked=new Set(FURN.map(f=>f.c+','+f.r));

// ===== cast =====
let SEED=71;function rnd(){SEED=(SEED*1103515245+12345)&0x7fffffff;return SEED/0x7fffffff;}
function pick(a){return a[(rnd()*a.length)|0];}
function freeTile(){let c,r,k=0;do{c=(rnd()*GW)|0;r=(rnd()*GH)|0;k++;}while(blocked.has(c+','+r)&&k<30);return[c,r];}
const SKIN=['#f0c199','#e7b58a','#caa06f','#8a5a3a','#6b4423'];
const HAIR=['#2a1c12','#5a3a1a','#111111','#e8a23a','#d8d2c8','#7a5a3a','#c0392b'];
const SHIRT=['#e0662e','#2f6fe8','#3f9e4d','#e8433a','#f2a01e','#8b5cf6','#12b3b3','#eef1f4','#d94f8f'];
const PANTS=['#37414f','#20242c','#2b3a4a','#3a2a1f','#203a5a'];
const CAPS=[null,null,null,'#e8c33a','#e8433a','#2f6fe8','#1a1a1a','#00a3a3'];
const AGENTS=[
  ['SHADDAI','#c9a6ff'],['ORACLE','#8b7bf0'],['QUILL','#5fe0ff'],['TURTLE','#00ff9c'],
  ['NEXUS','#e8c45c'],['ZEROX','#ff9a3c'],['PIKADON','#ff5a4d'],
];
const cast=[];
// 7 agents: accent shirt + matching cap + emblem
for(const [name,accent] of AGENTS){const [c,r]=freeTile();const[tc,tr]=freeTile();cast.push({name,col:c,row:r,tc,tr,speed:0.7+rnd()*0.5,pause:rnd()*2,rig:{shirt:accent,cap:shade(accent,-0.2),skin:pick(SKIN),pants:'#2b3038',emblem:'#ffffff'}});}
// citizens
for(let i=0;i<7;i++){const [c,r]=freeTile();const[tc,tr]=freeTile();const cap=pick(CAPS);const rig={skin:pick(SKIN),shirt:pick(SHIRT),pants:pick(PANTS)};if(cap)rig.cap=cap;else rig.hair=pick(HAIR);cast.push({col:c,row:r,tc,tr,speed:0.7+rnd()*0.6,pause:rnd()*2,rig});}

let last=0;
function update(dt){for(const ch of cast){if(ch.pause>0){ch.pause-=dt;ch.rig.anim='idle';continue;}const dx=ch.tc-ch.col,dy=ch.tr-ch.row,dist=Math.hypot(dx,dy);if(dist<0.06){ch.col=ch.tc;ch.row=ch.tr;ch.pause=0.5+rnd()*2.4;const[tc,tr]=freeTile();ch.tc=tc;ch.tr=tr;ch.rig.anim='idle';}else{const v=ch.speed*dt;ch.col+=dx/dist*v;ch.row+=dy/dist*v;ch.rig.anim='walk';}}}
const draws=[];
function render(t){ctx.clearRect(0,0,CSSW,CSSH);drawFloor();drawWalls();draws.length=0;for(const f of FURN)draws.push({k:f.c+f.r,d:()=>f.fn(f.c,f.r)});for(const ch of cast)draws.push({k:ch.col+ch.row+0.02,d:()=>guy(ch.col,ch.row,ch.rig,t,ch.col*0.7)});draws.sort((a,b)=>a.k-b.k);for(const o of draws)o.d();}
function loop(t){const dt=Math.min((t-last)/1000||0,0.05);last=t;update(dt);render(t);requestAnimationFrame(loop);}
addEventListener('resize',()=>{DPR=Math.min(devicePixelRatio||1,2);resize();});
resize();requestAnimationFrame(loop);
</script></body></html>
