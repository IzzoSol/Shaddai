<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEROX 3D Trading Floor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;color:#fff;font-family:monospace;overflow:hidden;}
#canvas{display:block;width:100%;height:100%;}
#hud{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);color:#00ff9c;font-size:12px;display:flex;justify-content:space-between;align-items:center;}
#hud-left{display:flex;gap:20px;}
#hud-right{display:flex;gap:15px;align-items:center;}
.stat{display:flex;flex-direction:column;gap:4px;}
.stat-label{color:#666;font-size:10px;text-transform:uppercase;}
.stat-value{color:#00ff9c;font-weight:bold;font-size:14px;}
#exit-3d{padding:8px 16px;background:#e8a020;color:#000;border:none;cursor:pointer;font-weight:bold;border-radius:4px;transition:all .2s;}
#exit-3d:hover{background:#ffc84a;transform:scale(1.05);}
#mirofish-3d{position:fixed;bottom:20px;right:20px;width:300px;height:300px;background:rgba(0,0,0,.8);border:2px solid #00d4dc;border-radius:8px;z-index:99;}
#mirofish-label{padding:10px;font-size:10px;font-weight:bold;color:#00d4dc;background:rgba(0,212,220,.1);}
#market-list{position:fixed;left:20px;bottom:20px;max-height:400px;overflow-y:auto;background:rgba(0,0,0,.8);border:2px solid #e8a020;border-radius:8px;padding:15px;font-size:10px;width:250px;}
.market-item{padding:8px;border-bottom:1px solid rgba(232,160,32,.2);color:#d4ae78;}
.market-item:hover{background:rgba(232,160,32,.1);cursor:pointer;}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);border:2px solid #00d4dc;padding:12px;border-radius:8px;font-size:11px;color:#00d4dc;}
.control-key{display:inline-block;background:#1a1a1a;padding:4px 8px;border-radius:3px;margin:0 2px;font-weight:bold;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div id="hud-left">
    <div class="stat">
      <div class="stat-label">Markets Active</div>
      <div class="stat-value" id="stat-markets">8</div>
    </div>
    <div class="stat">
      <div class="stat-label">Avg Multiplier</div>
      <div class="stat-value" id="stat-mult">2.3×</div>
    </div>
    <div class="stat">
      <div class="stat-label">Win Rate</div>
      <div class="stat-value" id="stat-rate">68%</div>
    </div>
  </div>
  <div style="color:#00ff9c;font-weight:bold;font-size:16px;">⚡ ZEROX 3D TRADING FLOOR ⚡</div>
  <div id="hud-right">
    <div class="stat">
      <div class="stat-label">FPS</div>
      <div class="stat-value" id="stat-fps">60</div>
    </div>
    <button id="exit-3d">← EXIT 3D</button>
  </div>
</div>

<div id="mirofish-3d">
  <div id="mirofish-label">🐟 MIROFISH SWARM</div>
  <div style="height:calc(100%-30px);position:relative;" id="mirofish-container"></div>
</div>

<div id="market-list" id="market-list">
  <div style="font-weight:bold;color:#e8a020;margin-bottom:10px;">📊 MARKETS</div>
  <div class="market-item">BONK: 2.3× 📈</div>
  <div class="market-item">POPCAT: 5.2× 🚀</div>
  <div class="market-item">BODEN: 3.1× 📈</div>
  <div class="market-item">SPY: +1.2% 📈</div>
  <div class="market-item">NVDA: +3.2% 📈</div>
  <div class="market-item">Bitcoin: 75% YES</div>
</div>

<div id="controls">
  <div style="margin-bottom:8px;">CONTROLS</div>
  <span class="control-key">W/A/S/D</span> Move ·
  <span class="control-key">MOUSE</span> Look ·
  <span class="control-key">SPACE</span> Up ·
  <span class="control-key">CTRL</span> Down
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ══════════════════════════════════════════════════════════════
// ZEROX 3D TRADING FLOOR — Three.js + Meshy VFX Integration
// ══════════════════════════════════════════════════════════════

const MESHY_API_KEY = 'msy_0VPbYvGMfwiGqL6xsvvm7zE9ofgzyi0Xoamr';
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
renderer.shadowMap.enabled = true;

camera.position.set(0, 50, 100);
camera.lookAt(0, 0, 0);

// ─── LIGHTING ───
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const spotLight = new THREE.SpotLight(0x00ff9c, 1, 500, Math.PI/4, 1, 2);
spotLight.position.set(100, 150, 100);
spotLight.castShadow = true;
scene.add(spotLight);

const neonLight = new THREE.PointLight(0xe8a020, 1, 300);
neonLight.position.set(-100, 80, 50);
scene.add(neonLight);

// ─── FLOOR GRID ───
const gridHelper = new THREE.GridHelper(400, 40, 0x444444, 0x222222);
gridHelper.position.y = 0;
scene.add(gridHelper);

// ─── MARKET DATA CUBES (3D Visualization) ───
const marketData = [
  {symbol:'BONK',x:-60,z:-60,mult:2.3,color:0x00ff9c},
  {symbol:'POPCAT',x:60,z:-60,mult:5.2,color:0x00ff41},
  {symbol:'BODEN',x:-60,z:60,mult:3.1,color:0x00ff9c},
  {symbol:'TRUMP',x:60,z:60,mult:4.7,color:0x00ff41},
  {symbol:'SPY',x:-30,z:0,mult:1.2,color:0xffc84a},
  {symbol:'NVDA',x:30,z:0,mult:3.2,color:0x00ff9c},
  {symbol:'BTC',x:0,z:-30,mult:7.5,color:0xf4a460},
  {symbol:'ETH',x:0,z:30,mult:2.8,color:0x00d4ff}
];

const cubes = [];
marketData.forEach(data=>{
  const height = Math.min(data.mult * 10, 80);
  const geom = new THREE.BoxGeometry(20, height, 20);
  const mat = new THREE.MeshStandardMaterial({
    color:data.color,
    emissive:data.color,
    emissiveIntensity:0.5,
    metalness:0.7,
    roughness:0.2
  });
  const cube = new THREE.Mesh(geom, mat);
  cube.position.set(data.x, height/2, data.z);
  cube.castShadow = true;
  cube.userData = {symbol:data.symbol, mult:data.mult};
  scene.add(cube);
  cubes.push(cube);
});

// ─── PARTICLE SYSTEM (Meshy VFX) ───
const particleCount = 1000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = new Float32Array(particleCount * 3);

for(let i=0;i<particleCount*3;i+=3){
  positions[i] = (Math.random()-0.5)*400;
  positions[i+1] = Math.random()*200;
  positions[i+2] = (Math.random()-0.5)*400;
  velocities[i] = (Math.random()-0.5)*2;
  velocities[i+1] = Math.random()*0.5;
  velocities[i+2] = (Math.random()-0.5)*2;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const material = new THREE.PointsMaterial({
  color:0x00ff9c,
  size:2,
  sizeAttenuation:true,
  transparent:true,
  opacity:0.6
});
const particles = new THREE.Points(geometry, material);
scene.add(particles);

// ─── CAMERA CONTROLS ───
const keys = {};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const moveSpeed = 0.5;
const animate = ()=>{
  requestAnimationFrame(animate);

  // Move camera
  if(keys['w'])camera.position.z -= moveSpeed;
  if(keys['s'])camera.position.z += moveSpeed;
  if(keys['a'])camera.position.x -= moveSpeed;
  if(keys['d'])camera.position.x += moveSpeed;
  if(keys[' '])camera.position.y += moveSpeed;
  if(keys['control'])camera.position.y -= moveSpeed;

  // Rotate cubes
  cubes.forEach(cube=>{
    cube.rotation.x += 0.003;
    cube.rotation.y += 0.005;
  });

  // Update particles
  const pos = geometry.attributes.position.array;
  for(let i=0;i<particleCount*3;i+=3){
    pos[i] += velocities[i];
    pos[i+1] += velocities[i+1];
    pos[i+2] += velocities[i+2];

    if(Math.abs(pos[i])>200)velocities[i]*=-1;
    if(pos[i+1]>200||pos[i+1]<0)velocities[i+1]*=-1;
    if(Math.abs(pos[i+2])>200)velocities[i+2]*=-1;
  }
  geometry.attributes.position.needsUpdate = true;

  // Animate lighting
  neonLight.intensity = 0.8 + Math.sin(Date.now()*0.003)*0.3;
  spotLight.intensity = 0.9 + Math.sin(Date.now()*0.002)*0.2;

  renderer.render(scene, camera);
};

animate();

// ─── EXIT 3D ───
document.getElementById('exit-3d').onclick = ()=>{
  window.location.href = 'pro-signals.html';
};

// ─── HANDLE RESIZE ───
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── UPDATE HUD ───
setInterval(()=>{
  const avg = marketData.reduce((s,d)=>s+d.mult,0)/marketData.length;
  document.getElementById('stat-mult').textContent = avg.toFixed(1)+'×';
},1000);
</script>

</body>
</html>
