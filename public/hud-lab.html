<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUD v4 Lab</title>
<style>
  :root{--bg:#06080b;--em:#00ff9c;--gold:#e8c45c;--ink:#d8e6df}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Consolas,monospace;overflow:hidden}
  body{background:radial-gradient(90% 70% at 50% 60%,#0d1a17 0%,#070b0e 55%,#06080b 100%)}
  .grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,156,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,156,.05) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
  #panel{position:fixed;top:14px;left:14px;z-index:30;max-width:min(360px,calc(100vw - 32px));padding:12px;background:rgba(6,8,11,.85);border:1px solid rgba(0,255,156,.2)}
  #panel h1{margin:0 0 8px;font-size:11px;letter-spacing:.2em;color:var(--em);text-transform:uppercase}
  #panel .g{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  #panel .k{width:100%;font-size:9px;letter-spacing:.18em;opacity:.55;text-transform:uppercase;margin-top:4px}
  button{font:inherit;font-size:11px;color:var(--ink);background:#0b1215;border:1px solid rgba(0,255,156,.3);padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--em);color:var(--em)}
  button.g2{border-color:rgba(232,196,92,.4)} button.g2:hover{color:var(--gold);border-color:var(--gold)}
  #readout{margin-top:8px;font-size:10px;opacity:.6;white-space:pre}
</style>
</head>
<body>
<div class="grid"></div>
<div id="panel">
  <h1>HUD v4 Lab</h1>
  <div class="g"><span class="k">Vitals</span>
    <button id="dmg">Damage −12</button><button id="big">Hit −30</button><button id="heal">Heal +25</button>
    <button id="sprint">Sprint (hold)</button></div>
  <div class="g"><span class="k">Dragon</span>
    <button id="engage">Telegraph</button><button id="strike">Player hits −15 %</button><button id="defeat">Defeat</button>
    <button id="manual">setBoss manual</button></div>
  <div class="g"><span class="k">Wolves</span><button id="wolves">Toggle pack hunting</button></div>
  <div class="g"><span class="k">Pings</span>
    <button class="g2" id="p1">+5 SPARKS class</button><button class="g2" id="p2">−12 SPARKS sink</button>
    <button id="p3">Plot claimed</button><button id="p4">Art placed</button><button id="p5">Burst ×6</button></div>
  <div id="readout"></div>
</div>
<script src="world-hud-v4.js"></script>
<script>
(function(){
  // ── fake game state ──
  var hp = 100, stamina = 1, sprinting = false, regenDelay = 0;
  var L = {}, dragon = { id: 'st-ember', name: 'Fire Dragon of Ember Gate', hp: 1200, hpMax: 1200, defeated: false };
  var dragons = {                                   // same surface world-dragons.js exposes
    core: { attacker: null, byId: function(id){ return id === dragon.id ? dragon : null; } }, dragons: [dragon],
    on: function(ev, cb){ (L[ev] = L[ev] || []).push(cb); return function(){ L[ev] = L[ev].filter(function(f){ return f !== cb; }); }; },
    off: function(ev, cb){ L[ev] = (L[ev] || []).filter(function(f){ return f !== cb; }); },
    stats: function(){ return { attacker: dragons.core.attacker, dragons: 1 }; }
  };
  function emit(ev, d){ (L[ev] || []).slice().forEach(function(f){ f(d); }); }
  var wolves = { packs: 2, wolves: 8, hostile: 0, bites: 0, kills: 0 };
  var wildlife = { stats: function(){ return wolves; } };

  var hud = window.buildHudV4({ getHP: function(){ return hp; }, getStamina: function(){ return stamina; }, dragons: dragons, wildlife: wildlife });
  window.__hud = hud;

  function $(id){ return document.getElementById(id); }
  $('dmg').onclick = function(){ hp = Math.max(0, hp - 12); };
  $('big').onclick = function(){ hp = Math.max(0, hp - 30); };
  $('heal').onclick = function(){ hp = Math.min(100, hp + 25); };
  var sp = $('sprint');
  sp.onpointerdown = function(){ sprinting = true; }; sp.onpointerup = sp.onpointerleave = function(){ sprinting = false; };
  $('engage').onclick = function(){ if (dragon.defeated) { dragon.defeated = false; dragon.hp = dragon.hpMax; } emit('telegraph', { id: dragon.id, kind: 'roar' }); };
  $('strike').onclick = function(){ if (dragon.defeated) return; dragon.hp = Math.max(0, dragon.hp - dragon.hpMax * 0.15);
    emit('hurt', { id: dragon.id, dmg: dragon.hpMax * 0.15, hp: dragon.hp, hpMax: dragon.hpMax });
    if (dragon.hp <= 0) { dragon.defeated = true; emit('downed', { id: dragon.id }); setTimeout(function(){ emit('defeated', { id: dragon.id, name: dragon.name }); }, 800); } };
  $('defeat').onclick = function(){ dragon.hp = 0; dragon.defeated = true; emit('downed', { id: dragon.id }); emit('defeated', { id: dragon.id, name: dragon.name }); };
  $('manual').onclick = function(){ hud.setBoss('Arena Colossus', Math.random()); };
  $('wolves').onclick = function(){ wolves.hostile = wolves.hostile ? 0 : 3; };
  $('p1').onclick = function(){ hud.ping({ type: 'mint', sparks: 5, text: 'Class complete' }); };
  $('p2').onclick = function(){ hud.ping({ type: 'sink', sparks: -12, text: 'Plot upkeep' }); };
  $('p3').onclick = function(){ hud.ping({ type: 'plot', plot_id: 'PLOT-SW-0012', state: 'claimed' }); };
  $('p4').onclick = function(){ hud.ping({ type: 'art', slot_id: 'ART-C-003', filled: true }); };
  $('p5').onclick = function(){ for (var i = 1; i <= 6; i++) hud.ping({ type: 'mint', sparks: i, text: 'Burst ping ' + i }); };

  var lastT = performance.now(), ro = $('readout'), roAcc = 0;
  (function loop(now){
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (sprinting && stamina > 0) { stamina = Math.max(0, stamina - dt / 8 * 3); regenDelay = 0; }
    else { regenDelay += dt; if (regenDelay > 1.5) stamina = Math.min(1, stamina + dt / 4); }
    hud.update(dt);
    roAcc += dt; if (roAcc > 0.25) { roAcc = 0; var d = hud._debug();
      ro.textContent = 'hp ' + hp.toFixed(0) + '  stamina ' + stamina.toFixed(2) + '\ndom writes ' + d.writes + '  toasts ' + d.toasts + '  boss ' + (d.bossVisible ? 'on' : 'off'); }
    requestAnimationFrame(loop);
  })(lastT);
})();
</script>
</body>
</html>
