<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRID DODGEBALL // SHADDAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00ff88; --cyan:#00f0ff; --red:#ff1a1a; --mag:#ff2bd6;
    --bg:#000; --dim:#0a0f0d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:#cfe;cursor:default;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
       touch-action:none;}
  #wrap{position:fixed;inset:0;background:#000;}
  canvas{position:absolute;inset:0;display:block;image-rendering:optimizeSpeed;touch-action:none;}
  /* CRT scanline overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:39;
    box-shadow:inset 0 0 180px rgba(0,255,136,0.05), inset 0 0 60px rgba(0,0,0,0.7);}
  /* ---- ONE clean top strip: BACK + title ---- */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;gap:12px;
    padding:8px clamp(10px,2vw,18px);
    background:linear-gradient(180deg,rgba(0,0,0,0.78),rgba(0,0,0,0));
    pointer-events:none;}
  #topbar .navbtns{display:flex;gap:8px;align-items:center;flex:none;pointer-events:none;}
  #back,#codex{pointer-events:auto;flex:none;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(11px,1.5vw,14px);letter-spacing:1px;
    color:var(--green);background:rgba(0,14,9,0.6);border:1px solid var(--green);
    padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
    text-shadow:0 0 8px var(--green);box-shadow:0 0 14px rgba(0,255,136,0.28);
    transition:all .15s;}
  #back:hover{background:var(--green);color:#000;box-shadow:0 0 22px var(--green);}
  #codex{color:var(--mag);border-color:var(--mag);text-shadow:0 0 8px var(--mag);box-shadow:0 0 14px rgba(255,0,170,0.28);}
  #codex:hover{background:var(--mag);color:#000;box-shadow:0 0 22px var(--mag);}
  #topbar .ttl{flex:1;min-width:0;text-align:center;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(13px,2.4vw,22px);letter-spacing:2px;
    color:var(--mag);text-shadow:0 0 12px var(--mag);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar .spacer{flex:none;width:clamp(58px,9vw,90px);}
  /* ---- CONTROLS legend: spaced, wrapping, overlaps nothing ---- */
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:35;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:6px 16px;padding:8px clamp(10px,3vw,24px);
    background:linear-gradient(0deg,rgba(0,0,0,0.72),rgba(0,0,0,0));
    font-size:clamp(9px,1.4vw,12px);letter-spacing:1px;color:#8ff;opacity:.92;
    pointer-events:none;text-shadow:0 0 6px rgba(0,240,255,.5);}
  #hint span{white-space:nowrap;}
  #hint b{color:var(--green);}
  @media (max-width:640px){#hint{gap:4px 10px;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="vig"></div>
<div id="crt"></div>
<div id="topbar">
  <button id="back">◀ ARCADE MENU</button>
  <div class="ttl">GRID DODGEBALL</div>
  <div class="navbtns">
    <button id="codex" title="Back to Codex">⌂ CODEX</button>
  </div>
</div>
<div id="hint">
  <span><b>WASD / ARROWS</b> move</span>
  <span><b>SPACE</b> throw / catch (hold = charge)</span>
  <span><b>SHIFT</b> jump-dodge</span>
  <span><b>E</b> / double-tap dash</span>
  <span><b>Q</b> captain OVERDRIVE</span>
  <span><b>V</b> camera view</span>
  <span><b>R</b> restart</span>
  <span><b>ESC</b> exit</span>
</div>

<script src="../js/touch-controls.js"></script>
<script>
(function(){
"use strict";

/* ============================ EXIT (contract preserved) ============================ */
function doExit(){
  // preferred: tell the SHADDAI world shell to close this overlay panel
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'shaddai-close-panel'}, '*'); } }catch(e){}
  // legacy hook if the shell exposes a direct closer
  try{ if(window.parent && window.parent!==window && window.parent.closeGame){ window.parent.closeGame(); return; } }catch(e){}
  // standalone fallbacks
  try{ window.close(); }catch(e){}
  if(history.length>1){ history.back(); } else { location.href="/"; }
}
document.getElementById('back').addEventListener('click', doExit);
document.getElementById('codex').addEventListener('click', function(){
  try{ (window.top||window).location.href='/codex.html'; }catch(e){ location.href='/codex.html'; }
});

/* ============================ CINEMATIC BG (HF FLUX arena; gradient fallback) ============================ */
var arenaBg=new Image(); var arenaReady=false;
arenaBg.onload=function(){ arenaReady=true; };
arenaBg.onerror=function(){ arenaReady=false; };
arenaBg.src='/assets/games/dodgeball/arena-bg.jpg?v=1';
// draw HF art as a "cover" fill; gentle dark scrim keeps text readable. Falls back to gradient.
function drawArenaBg(scrim){
  if(arenaReady && arenaBg.width){
    var iw=arenaBg.width, ih=arenaBg.height, s=Math.max(W/iw, H/ih);
    var dw=iw*s, dh=ih*s;
    ctx.drawImage(arenaBg, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#12001a'); g.addColorStop(0.5,'#1a0022'); g.addColorStop(1,'#02110b');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // subtle magenta glow center for the fallback so it never looks broken/empty
    var rg=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.6);
    rg.addColorStop(0,'rgba(255,43,214,0.16)'); rg.addColorStop(1,'rgba(255,43,214,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  if(scrim==null) scrim=0.55;
  ctx.fillStyle='rgba(2,0,8,'+scrim+')'; ctx.fillRect(0,0,W,H);
}

/* ============================ CANVAS ============================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeView();
}
window.addEventListener('resize', resize);

/* ============================ AUDIO ============================ */
var AC=null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol,when){
  var a=audio(); if(!a) return;
  when = when||0; dur=dur||0.12; type=type||'square'; vol=(vol==null?0.18:vol);
  var t=a.currentTime+when;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol){
  var a=audio(); if(!a) return;
  var n=Math.floor((a.sampleRate)*dur);
  var buf=a.createBuffer(1,n,a.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  var s=a.createBufferSource(); s.buffer=buf;
  var g=a.createGain(); g.gain.value=vol||0.15;
  var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=700;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sndThrow(){ noiseBurst(0.12,0.08); beep(360,0.10,'sawtooth',0.08,0); }
function sndSpecial(){ beep(140,0.22,'sawtooth',0.16,0); beep(80,0.30,'square',0.14,0.04); noiseBurst(0.25,0.14); }
function sndHit(){ beep(120,0.14,'square',0.20,0); noiseBurst(0.10,0.16); }
function sndBigHit(){ beep(90,0.20,'square',0.24,0); noiseBurst(0.16,0.20); beep(200,0.10,'sawtooth',0.14,0.02); }
function sndCatch(){ beep(880,0.07,'square',0.14,0); beep(1320,0.10,'square',0.12,0.05); }
function sndJump(){ beep(680,0.06,'square',0.08,0); beep(980,0.06,'square',0.07,0.05); }
function sndKO(){ beep(300,0.14,'sawtooth',0.18,0); beep(180,0.22,'sawtooth',0.16,0.10); beep(90,0.32,'square',0.14,0.22); }
function sndWin(){ var s=[523,659,784,1046,1318]; for(var i=0;i<s.length;i++) beep(s[i],0.16,'square',0.15,i*0.11); beep(1046,0.5,'sawtooth',0.10,s.length*0.11); }
function sndLose(){ beep(300,0.2,'sawtooth',0.15,0); beep(220,0.24,'sawtooth',0.14,0.16); beep(140,0.4,'square',0.13,0.34); }
function sndSelect(){ beep(760,0.06,'square',0.10,0); beep(1140,0.06,'square',0.08,0.04); }
function sndMove(){ beep(520,0.04,'square',0.05,0); }

/* ============================ AGENT ROSTER ============================ */
// stats are 1..5 display values (spd=speed, pwr=throw power, cat=catch skill, hp=durability)
// selImg = themed neon-dodgeball-uniform portrait (task art); img = fallback agent portrait
var AGENTS=[
  {key:'SHADDAI', color:'#ffcf1a', selImg:'/assets/games/dodgeball/chars/SHADDAI.png', img:'/assets/agents/SHADDAI-portrait.png', tag:'Supreme',  stats:{spd:3,pwr:4,cat:3,hp:5}},
  {key:'NEXUS',   color:'#00f0ff', selImg:'/assets/games/dodgeball/chars/NEXUS.png',   img:'/assets/agents/NEXUS-portrait.png',   tag:'Architect',stats:{spd:4,pwr:4,cat:3,hp:3}},
  {key:'ORACLE',  color:'#b06bff', selImg:'/assets/games/dodgeball/chars/ORACLE.png',  img:'/assets/agents/ORACLE-portrait.png',  tag:'Intel',    stats:{spd:3,pwr:2,cat:5,hp:3}},
  {key:'ZEROX',   color:'#ff9d3d', selImg:'/assets/games/dodgeball/chars/ZEROX.png',   img:'/assets/agents/ZEROX-portrait.png',   tag:'Wealth',   stats:{spd:3,pwr:5,cat:2,hp:4}},
  {key:'TURTLE',  color:'#ff2bd6', selImg:'/assets/games/dodgeball/chars/TURTLE.png',  img:'/assets/agents/TURTLE-portrait.png',  tag:'Creative', stats:{spd:2,pwr:3,cat:4,hp:5}},
  {key:'QUILL',   color:'#f5e000', selImg:'/assets/games/dodgeball/chars/QUILL.png',   img:'/assets/agents/QUILL-portrait.png',   tag:'Comms',    stats:{spd:5,pwr:2,cat:4,hp:2}},
  {key:'PIKADON', color:'#ff2a2a', selImg:'/assets/games/dodgeball/chars/PIKADON.png', img:'/assets/agents/PIKADON-portrait.png', tag:'Security', stats:{spd:4,pwr:5,cat:3,hp:3}}
];
// derive gameplay multipliers from display stats
for(var si=0; si<AGENTS.length; si++){
  var st=AGENTS[si].stats;
  AGENTS[si].spdMul = 0.82 + st.spd*0.09;   // 0.91 .. 1.27
  AGENTS[si].pwrMul = 0.80 + st.pwr*0.08;   // 0.88 .. 1.20
  AGENTS[si].catMul = 0.70 + st.cat*0.12;   // 0.82 .. 1.30
  AGENTS[si].hpVal  = Math.round(72 + st.hp*14); // 86 .. 142
}
// preload portraits (HUD badge) + themed selector art (falls back to badge portrait)
for(var ai=0; ai<AGENTS.length; ai++){
  (function(a){
    var im=new Image(); im.onload=function(){ a.ready=true; }; im.onerror=function(){ a.ready=false; };
    im.src=a.img; a.im=im; a.ready=false;
    // themed neon-uniform selector portrait; on error fall back to the badge portrait
    var sel=new Image();
    sel.onload=function(){ a.selReady=true; };
    sel.onerror=function(){ a.selReady=false; a.selIm=a.im; a.selReady=a.ready; };
    sel.src=a.selImg; a.selIm=sel; a.selReady=false;
  })(AGENTS[ai]);
}
// helper: the best available image + its readiness for the SELECT cards
function selArt(a){
  if(a.selReady && a.selIm && a.selIm.width) return a.selIm;
  if(a.ready && a.im && a.im.width) return a.im;
  return null;
}
function hexToRgb(h){ h=h.replace('#',''); return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)}; }
function tint(hex,f){ var c=hexToRgb(hex); return 'rgb('+Math.round(c.r*f)+','+Math.round(c.g*f)+','+Math.round(c.b*f)+')'; }
function lighten(hex,f){ var c=hexToRgb(hex); return 'rgb('+Math.round(c.r+(255-c.r)*f)+','+Math.round(c.g+(255-c.g)*f)+','+Math.round(c.b+(255-c.b)*f)+')'; }
function rgba(hex,a){ var c=hexToRgb(hex); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }

/* ============================ SKILLPLAY (ability loadout) ============================ */
// Master ability catalog — ids MUST match backend /api/skillplay/dodgeball catalog.
// boost keys map onto the team-A player multipliers applied in applySkillBoosts().
var ALL_SKILL_DEFS = [
  {id:'cannon_throw', label:'Cannon Throw', icon:'💣', desc:'+throw power & damage',        boost:{pwr:0.22}},
  {id:'quick_dodge',  label:'Quick Dodge',  icon:'💨', desc:'+move speed, slip shots',      boost:{spd:0.18}},
  {id:'sniper',       label:'Sniper',       icon:'🎯', desc:'+accuracy & throw power',       boost:{pwr:0.12, spd:0.05}},
  {id:'iron_catch',   label:'Iron Catch',   icon:'🧤', desc:'+catch radius & skill',         boost:{cat:0.25}},
  {id:'blitzer',      label:'Blitzer',      icon:'⚡', desc:'+rush speed to the line',       boost:{spd:0.22}},
  {id:'wall',         label:'Human Wall',   icon:'🛡', desc:'+durability, soak hits',        boost:{hp:0.20}},
  {id:'trick_shot',   label:'Trick Shot',   icon:'🌀', desc:'+curve on throws',              boost:{cat:0.08, pwr:0.06}},
  {id:'relentless',   label:'Relentless',   icon:'🔥', desc:'+endurance & durability',       boost:{hp:0.14, spd:0.06}}
];
// natural ability map per council agent (local fallback; backend refines it)
var AGENT_ABILITIES = {
  SHADDAI:['wall','cannon_throw','relentless'],
  NEXUS:  ['iron_catch','trick_shot','sniper'],
  ORACLE: ['iron_catch','quick_dodge','trick_shot'],
  ZEROX:  ['cannon_throw','sniper','wall'],
  TURTLE: ['wall','iron_catch','relentless'],
  QUILL:  ['quick_dodge','blitzer','iron_catch'],
  PIKADON:['cannon_throw','blitzer','sniper']
};
var SKILL_DEFS = ALL_SKILL_DEFS.slice();
var skillPickMax = 3;
var skillPicked = [];
var agentMatchedIds = [];
var skillBtns = [];
var G_SKILLSEL = false;   // true when on the skill-pick step (between team-pick and match)
var G_MODESEL  = false;   // true when on the mode-pick step (between team-pick and skill/match)
var WATCH_ON   = false;   // true in WATCH mode: AI drives the human team, no player input
var skillBoosts = {pwr:0, spd:0, cat:0, hp:0};

function selectedAgentKey(){ return (sel.you!=null && AGENTS[sel.you]) ? AGENTS[sel.you].key : (G.playerAgent?G.playerAgent.key:null); }
function computeAgentMatchedLocal(){
  var k=selectedAgentKey();
  var a=(k && AGENT_ABILITIES[k]) ? AGENT_ABILITIES[k].slice() : [];
  if(!a.length) a=['cannon_throw','iron_catch','quick_dodge'];
  return a;
}
// scalable path: ask the backend to auto-match this agent's REAL skills → abilities
function refreshAgentMatchedFromBackend(){
  var k=selectedAgentKey(); if(!k) return;
  try{
    fetch('/api/skillplay/dodgeball/kit/'+encodeURIComponent(k)+'?n=3')
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok&&j.abilities&&j.abilities.length){ agentMatchedIds=j.abilities.map(function(x){return x.id;}); } })
      .catch(function(){});
  }catch(e){}
}
function applySkillBoosts(){
  skillBoosts={pwr:0,spd:0,cat:0,hp:0};
  for(var i=0;i<skillPicked.length;i++){
    var sk=SKILL_DEFS[skillPicked[i]]; if(!sk) continue;
    for(var kk in sk.boost){ if(sk.boost.hasOwnProperty(kk)) skillBoosts[kk]=(skillBoosts[kk]||0)+sk.boost[kk]; }
  }
}
// apply the accumulated boosts to team A players (call after teams are built)
function applyBoostsToTeamA(){
  for(var i=0;i<teamA.length;i++){
    var p=teamA[i];
    p.spdMul *= (1+(skillBoosts.spd||0));
    p.pwrMul *= (1+(skillBoosts.pwr||0));
    p.catMul *= (1+(skillBoosts.cat||0));
    if(skillBoosts.hp){
      p.maxHp=Math.round(p.maxHp*(1+skillBoosts.hp)); p.hp=p.maxHp;
    }
  }
}
function gotoSkillSelect(){
  G_SKILLSEL=true;
  SKILL_DEFS=ALL_SKILL_DEFS.slice();
  skillPickMax=3;
  agentMatchedIds=computeAgentMatchedLocal();
  refreshAgentMatchedFromBackend();
  skillPicked=[];
  for(var mi=0; mi<SKILL_DEFS.length && skillPicked.length<skillPickMax; mi++){
    if(agentMatchedIds.indexOf(SKILL_DEFS[mi].id)>=0) skillPicked.push(mi);
  }
  applySkillBoosts();
  sndSelect();
}
function confirmSkillPlay(){
  G_SKILLSEL=false;
  applySkillBoosts();
  sndSelect();
  startMatch();   // startMatch → newGame builds teams; boosts applied there
}

/* ============================ AUTOPLAY (bot mode) — behind ?autoplay=1 ============================ */
var AGENT_IDS=['SHADDAI','NEXUS','ORACLE','ZEROX','TURTLE','QUILL','PIKADON'];
var AP={on:false, agent:null, idx:0, t0:0, wait:0, reported:false};
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var a=(q.get('autoplay')||'').toLowerCase();
    AP.on=(a==='1'||a==='true');
    var ag=(q.get('agent')||'').toUpperCase();
    var ix=-1;
    for(var i=0;i<AGENTS.length;i++){ if(AGENTS[i].key===ag){ ix=i; break; } }
    if(ix<0) ix=Math.floor(Math.random()*AGENTS.length);
    AP.idx=ix; AP.agent=AGENTS[ix].key;
  }catch(e){ AP.on=false; }
})();
function apBadge(){
  if(!AP.on || document.getElementById('apBadge')) return;
  var b=document.createElement('div'); b.id='apBadge';
  b.textContent='◈ AUTOPLAY — '+AP.agent;
  b.style.cssText='position:fixed;left:14px;top:12px;z-index:60;font-family:Orbitron,sans-serif;font-weight:800;font-size:12px;letter-spacing:1px;color:#00f0ff;background:rgba(0,10,14,.6);border:1px solid #00f0ff;padding:7px 12px;border-radius:6px;box-shadow:0 0 12px rgba(0,240,255,.35);pointer-events:none;';
  document.body.appendChild(b);
}
function apReport(gameScore, win){
  if(!AP.on || AP.reported) return; AP.reported=true;
  var s=Math.round(gameScore)|0;
  try{ fetch('/api/arcade/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'dodgeball',agent:AP.agent,score:s,win:!!win})}).catch(function(){}); }catch(e){}
  try{ window.parent.postMessage({type:'arcadeResult',game:'dodgeball',agent:AP.agent,score:s,win:!!win}, '*'); }catch(e){}
  apEndCard(s, !!win);
}
function apEndCard(sc, win){
  if(document.getElementById('apEndCard')) return;
  var c=document.createElement('div'); c.id='apEndCard';
  c.style.cssText='position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,4,6,.9);font-family:Orbitron,sans-serif;';
  c.innerHTML='<div style="font-size:clamp(30px,8vw,72px);font-weight:800;color:'+(win?'#00ff88':'#ff1a1a')+';text-shadow:0 0 20px '+(win?'#00ff88':'#ff1a1a')+';">AGENT RESULT</div>'+
    '<div style="margin-top:10px;font-size:22px;color:#00f0ff;">'+AP.agent+'</div>'+
    '<div style="margin-top:6px;font-size:26px;color:#8ff;">SCORE '+sc+'</div>'+
    '<div style="margin-top:12px;font-size:clamp(28px,7vw,56px);font-weight:800;color:'+(win?'#00ff88':'#ff1a1a')+';">'+(win?'WIN':'LOSS')+'</div>';
  document.body.appendChild(c);
}
function apActiveAI(a,dt){
  if(!a || !a.alive) return;
  var th=threatInfo(a);
  // captain OVERDRIVE when pressured / holding
  if(a.captain && a.capCd<=0){
    if((th && th.d<84) || (a.hasBall && Math.random()<0.02) || a.hp<a.maxHp*0.5){ captainSpecial(a); }
  }
  if(a.hasBall){
    holderMove(a,dt);                       // reuse: advance to fire line, lead target
    if(a.apThrow==null) a.apThrow=0.4+Math.random()*0.5;
    a.apThrow-=dt;
    if(a.apThrow<=0){
      var tgt=Math.random()<0.4?weakestOpp(a):bestTarget(a);
      var chargeVal=Math.random()<0.4?(CHARGE_SPECIAL+0.2):0.05;
      throwBall(a,chargeVal,tgt);
      a.apThrow=0.5+Math.random()*0.6;
    }
    return;
  }
  if(th){
    if(th.d<CATCH_R*(a.catMul||1) && a.z<2){
      var cc=(th.ball.special?0.9:2.2)*dt*(a.catMul||1);
      if(Math.random()<cc){ doCatch(a, th.ball); return; }
    }
    if(th.d<63 && a.dashCd<=0 && a.z<1 && Math.random()<0.5){
      var tb=th.ball, perpx=-tb.vy, perpy=tb.vx;
      var side=((a.x-tb.x)*perpx+(a.y-tb.y)*perpy)>=0?1:-1;
      dash(a, perpx*side, perpy*side);
    } else if(a.z<=0.5 && th.d<46 && a.jumpCd<=0 && Math.random()<0.9){ jump(a); }
  }
  var lb=nearestLooseBall(a.x,a.y);
  var reach = lb && ((a.team==='A'&&lb.x<=CX-a.r)||(a.team==='B'&&lb.x>=CX+a.r));
  if(reach && !(th && th.d<42)){
    aiSteer(a, lb.x, lb.y, MOVE_SPD*(a.spdMul||1), dt);
    a.face=Math.atan2(lb.y-a.y, lb.x-a.x);
  } else {
    homeMove(a,dt,th);
  }
}
function apForceEnd(){
  if(G.state==='OVER') return;
  var win = teamHp(teamA) >= teamHp(teamB);
  G.state='OVER'; G.winner=win?'A':'B'; G.victory=win;
  if(win) sndWin(); else sndLose();
  postScore(G.score);
}
function apDirector(dt){
  if(!AP.on) return;
  if(AP.t0 && (G.state==='PLAY'||G.state==='ROUNDCLEAR') && performance.now()-AP.t0>90000){ apForceEnd(); return; }
  AP.wait-=dt; if(AP.wait>0) return; AP.wait=0.4;
  if(G.state==='SELECT'){
    G.playerAgent=AGENTS[AP.idx];
    var cpu; do{ cpu=Math.floor(Math.random()*AGENTS.length); }while(cpu===AP.idx);
    G.cpuAgent=AGENTS[cpu];
    apBadge();
    AP.t0=performance.now();
    startMatch();
  }
}

/* ============================ CONSTANTS ============================ */
// ---- ROOMIER ARENA (floor genuinely bigger, players smaller RELATIVE to it) ----
// The court AUTO-SCALES to fill the screen (see computeView: scale = min(availW/COURT_W,
// availH/COURT_H)). So scaling players UP with the court is a no-op — they'd fill the
// same screen space. The correct lever for "less crowded" is to grow the COURT while
// KEEPING the player render size ~constant, so each player occupies a SMALLER fraction
// of the floor and renders smaller on screen (a pulled-back broadcast feel).
//   Old floor: 300x180 with PR 10.5  -> player/court width ratio = 10.5/300 = 3.50%
//   New floor: 440x264 with PR 9.5   -> player/court width ratio =  9.5/440 = 2.16%
//   => players are ~38% smaller RELATIVE to the floor, and (court ~1.47x bigger, so it
//      auto-scales that much down) render clearly smaller on screen. Lots of real empty
//      space so nothing sits on top of each other.
// World-space reach/speed/physics constants are re-tuned for the bigger floor: they
// scale ~1.47x with the court so players still traverse it at a good pace and rallies
// still connect (not sluggish, not empty-feeling). Formations spread WIDER (see newGame).
var ARENA_K=1.47;         // arena scale factor applied to reach/speed vs. the 300x180 tuning
var COURT_W=440, COURT_H=264, CX=220;
var X0=0, X1=COURT_W, Y0=0, Y1=COURT_H;
var PR=9.5;               // player radius (world units) — kept ~constant so players shrink RELATIVE to the bigger floor
var BR=5.1;               // ball radius (kept readable)
var GRAV=560;             // gravity re-tuned so jump-arc time matches on the taller court
var JUMP_VZ=210;          // vertical launch (peak height ~1.4x)
var DODGE_Z=21;           // above this, ball passes under
var HIT_Z=19.5;           // ball hits if victim z < this
var MOVE_SPD=106;         // move speed (world u/s) — scaled so traversal pace stays snappy on the bigger floor
var THROW_SPD=356;        // normal throw speed  (scaled for the bigger floor)
var SPECIAL_SPD=545;      // special throw speed (scaled for the bigger floor)
var NORMAL_DMG=11;        // base damage (retuned per team size in syncTeamSize())
var SPECIAL_DMG=24;
var MAX_HP=100;
var CATCH_R=30;           // catch radius   (1.25x — a touch generous so catches still land on the roomier floor)
var PICKUP_R=28;          // loose-ball grab radius (1.24x)
var CHARGE_MAX=1.2;
var CHARGE_SPECIAL=0.8;
/* ---- CAPTAIN special ability ---- */
var CAP_COOLDOWN=9;       // seconds between captain special uses
var DASH_SPD=315;         // dash burst speed (world u/s)    (1.4x for the bigger floor)
var DASH_TIME=0.22;       // dash duration
var SHIELD_TIME=3.2;      // captain shield duration
var MATCH_TIME=99;
var MAX_ROUNDS=5;
// ---- selectable team size: 3v3 / 5v5 ONLY (no 4v4), balls = teamSize + 1 ----
// Fewer balls = calmer, more readable rallies. 3v3->4 balls, 5v5->6 balls.
var TEAM_SIZE=3;          // players per team (selectable 3 or 5 only)
var BALL_COUNT=4;         // dodgeballs in play — derived from TEAM_SIZE (teamSize + 1)
function ballsForSize(n){ return n+1; }
// damage eases down slightly for the bigger 5v5 match so it doesn't get too lethal;
// the smaller 3v3 squad keeps punchier hits.
function syncTeamSize(){
  BALL_COUNT = ballsForSize(TEAM_SIZE);   // 3v3 -> 4 balls, 5v5 -> 6 balls
  if(TEAM_SIZE<=3){ NORMAL_DMG=13; SPECIAL_DMG=27; }   // 3v3: punchier
  else            { NORMAL_DMG=9;  SPECIAL_DMG=20; }   // 5v5: calmer
}
syncTeamSize();
var CY='#00f0ff', MG='#ff2bd6', GN='#00ff88';

/* ============================ VIEW MAP ============================ */
var scale=1, offX=0, offY=0, topPad=70;
// vertical inset so the in-game HUD clears the fixed BACK/title top strip
var HUD_TOP=46;
function computeView(){
  // court top margin must clear the fixed top strip (HUD_TOP) + the HUD panels
  topPad=Math.min(150,Math.max(112,H*0.18));
  var botPad=54;   // leave room for the bottom controls legend + charge meter
  var availW=W-20, availH=H-topPad-botPad;
  scale=Math.min(availW/COURT_W, availH/COURT_H);
  if(scale<=0) scale=1;
  offX=(W-COURT_W*scale)/2;
  offY=topPad+(availH-COURT_H*scale)/2;
}
var shakeX=0, shakeY=0, shakeMag=0;
/* ---- CAMERA VIEW: 0=default (broadcast), 1=opponent-facing (mirrored), 2=FP-chase (zoom on you) ---- */
var VIEW={ mode:0, names:['BROADCAST','OPPONENT-FACING','FP-CHASE'], zoom:1, panX:0, panY:0 };
function cycleView(){
  VIEW.mode=(VIEW.mode+1)%3;
  // reset smoothing targets so the switch is snappy but not jarring
  if(VIEW.mode!==2){ VIEW.zoom=1; VIEW.panX=0; VIEW.panY=0; }
  sndSelect();
}
// world -> screen. Applies mirror (opponent-facing) and zoom/pan (FP-chase).
// Zoom is applied around the screen center, then the FP pan re-centers on the active player.
function sx(x){
  var wx = (VIEW.mode===1) ? (COURT_W-x) : x;           // mirror X to view from enemy side
  var base = offX + wx*scale;
  return W/2 + (base - W/2)*VIEW.zoom + VIEW.panX + shakeX;
}
function sy(y){
  var base = offY + y*scale;
  return H/2 + (base - H/2)*VIEW.zoom + VIEW.panY + shakeY;
}
function addShake(m){ shakeMag=Math.max(shakeMag,m); }
// subtle court depth: near rows (bottom) slightly larger than far rows (top)
function depthOf(y){ return 0.82 + 0.34*(y/COURT_H); }
// FP-chase / over-the-shoulder: zoom in and place the controlled player toward the
// near-bottom corner BEHIND their throwing direction, so the lane they attack down
// (toward the enemy side) fills the screen ahead of them. This lines the camera up
// with the actual play instead of dead-centering the player.
var FP_ZOOM=2.0;
function updateCamera(dt){
  var tZoom=1, tPanX=0, tPanY=0;
  if(VIEW.mode===2 && (G.state==='PLAY'||G.state==='ROUNDCLEAR') && activeRef){
    tZoom=FP_ZOOM;
    // active player's screen pos at this zoom (before pan). FP-chase is NOT mirrored,
    // so world x maps straight to screen x (team A on left throws right, +x).
    var baseX=offX+activeRef.x*scale, baseY=offY+activeRef.y*scale;
    var sxNoPan = W/2 + (baseX-W/2)*tZoom;
    var syNoPan = H/2 + (baseY-H/2)*tZoom;
    // faceSign: +1 = facing right (team A, throws toward right/enemy), -1 = facing left.
    var fSign = Math.cos(activeRef.face)>=0 ? 1 : -1;
    // Put the player ~30% in from the side they're facing FROM, so ~70% of the width
    // ahead of them (the throwing lane toward the enemy) stays on screen.
    var wantX = fSign>=0 ? W*0.32 : W*0.68;
    // Sit them lower on screen (chase / over-shoulder), leaving the court ahead visible.
    var wantY = H*0.66;
    tPanX = wantX - sxNoPan;
    tPanY = wantY - syNoPan;
  }
  // smooth toward targets
  var k=Math.min(1, dt*8);
  VIEW.zoom += (tZoom-VIEW.zoom)*k;
  VIEW.panX += (tPanX-VIEW.panX)*k;
  VIEW.panY += (tPanY-VIEW.panY)*k;
}

/* ============================ STATE ============================ */
var G={ state:'SELECT', timer:MATCH_TIME, winner:null,
        playerAgent:AGENTS[1], cpuAgent:AGENTS[4], introT:0,
        round:1, score:0, elims:0, catches:0, victory:false, rcT:0, mode:'PLAY' };
var scorePosted=false;
var teamA=[], teamB=[], players=[];
var balls=[];              // multi-ball: all dodgeballs in play
var activeRef=null;
var particles=[], popups=[], trail=[];
var drawOrder=[];                              // reused each frame for depth sort (no realloc)
function sortByY(a,b){ return a.y-b.y; }
var perfNow=0;

function mkPlayer(x,y,team,agent,num){
  var hpv=agent.hpVal||MAX_HP;
  return {x:x,y:y,z:0,vx:0,vy:0,vz:0,team:team,agent:agent,color:agent.color,num:num,
    hp:hpv,maxHp:hpv,alive:true,r:PR,face:team==='A'?0:Math.PI,
    spdMul:agent.spdMul||1, pwrMul:agent.pwrMul||1, catMul:agent.catMul||1, buff:1,
    iframe:0,charge:0,charging:false,hasBall:false,ball:null,catchTry:0,
    jumpCd:0,anim:Math.random()*6.28,hitFlash:0,koFall:0,throwAnim:0,catchFlash:0,
    homeX:x,homeY:y,aiThrow:0,wander:Math.random()*6.28,
    // captain + movement
    captain:false, capCd:0, shieldT:0, dashT:0, dashDX:0, dashDY:0, dashCd:0,
    capFlash:0, aiCapT:1+Math.random()*3, aiRole:(num%2===0?'front':'back')};
}
function mkBall(x,y){
  return {x:(x==null?CX:x),y:(y==null?COURT_H*0.5:y),z:9,vx:0,vy:0,vz:0,state:'loose',held:null,
    ownerTeam:null,special:false,dmg:NORMAL_DMG,curve:0,spin:0,looseT:0.2,emberT:0};
}
/* ---- multi-ball helpers ---- */
// nearest loose (un-held) ball to a point, on a player's own side is preferred
function nearestLooseBall(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<balls.length;i++){ var b=balls[i];
    if(b.state==='held') continue;
    var d=Math.hypot(b.x-x,b.y-y); if(d<bd){bd=d;best=b;}
  }
  return best;
}
// nearest thrown enemy ball threatening this player (for catch scan)
function nearestThreatBall(p){
  var best=null,bd=1e9;
  for(var i=0;i<balls.length;i++){ var b=balls[i];
    if(b.state!=='thrown'||b.ownerTeam===p.team) continue;
    var d=Math.hypot(b.x-p.x,b.y-p.y); if(d<bd){bd=d;best=b;}
  }
  return best;
}

function newGame(){
  computeView();
  var pa=G.playerAgent, cb=G.cpuAgent;
  // Formation loop: spread TEAM_SIZE players vertically across the court height,
  // staggered in X for depth (front line closer to center, back line near the wall).
  teamA=[]; teamB=[];
  var n=TEAM_SIZE;
  // Spread teammates across MOST of the (taller) court height, with a real margin top/bottom
  // so there are visible gaps between them on the roomier floor.
  var topM=Math.max(20, Y0+PR+16), botM=Math.min(COURT_H-16, Y1-PR-16);
  for(var fi=0; fi<n; fi++){
    var fy = n<=1 ? (topM+botM)/2 : topM + (botM-topM)*(fi/(n-1));
    var stagger = (fi%2===0) ? 22 : 0;  // alternate columns (depth) — wider on the bigger floor
    var axA = 50 + stagger;             // team A near left wall (scaled out for the wider court)
    var axB = COURT_W-50 - stagger;     // team B near right wall
    teamA.push(mkPlayer(axA, fy, 'A', pa, fi+1));
    teamB.push(mkPlayer(axB, fy, 'B', cb, fi+1));
  }
  // escalating difficulty: each round the CPU hits harder, tanks more and reacts faster
  var buff=1+(G.round-1)*0.15;
  for(var b=0;b<teamB.length;b++){
    var e=teamB[b];
    e.buff=buff;
    e.maxHp=Math.round(e.maxHp*buff); e.hp=e.maxHp;
    e.spdMul*=1+(G.round-1)*0.05;
    e.pwrMul*=1+(G.round-1)*0.05;
  }
  applyBoostsToTeamA();   // SKILLPLAY: apply chosen ability boosts to the human team
  // ---- CAPTAINS: the mid player on each team is the marked captain (the chosen agent).
  // Captains get a distinct special (charged dash-shield) + slightly tougher.
  var capA = teamA[Math.floor(TEAM_SIZE/2)] || teamA[0];
  var capB = teamB[Math.floor(TEAM_SIZE/2)] || teamB[0];
  if(capA){ capA.captain=true; capA.maxHp=Math.round(capA.maxHp*1.18); capA.hp=capA.maxHp; }
  if(capB){ capB.captain=true; capB.maxHp=Math.round(capB.maxHp*1.18); capB.hp=capB.maxHp; }
  players=teamA.concat(teamB);
  // multi-ball setup: BALL_COUNT balls. First is handed to a team-A starter; the
  // rest sit loose along the center line for both teams to contest.
  balls=[];
  var starter=teamA[Math.floor(TEAM_SIZE/2)] || teamA[0];
  var b0=mkBall(CX,COURT_H*0.5);
  b0.state='held'; b0.held=starter; b0.ownerTeam='A'; b0.z=starter.z+14; b0.looseT=0;
  starter.hasBall=true; starter.ball=b0;
  balls.push(b0);
  for(var bi=1; bi<BALL_COUNT; bi++){
    var spread = (BALL_COUNT<=1) ? 0 : (Y1-Y0)*( (bi)/(BALL_COUNT) ) - (Y1-Y0)*0.5;
    balls.push(mkBall(CX, COURT_H*0.5 + spread*0.7));
  }
  activeRef=starter;
  particles.length=0; popups.length=0; trail.length=0;
  shakeMag=0; G.timer=MATCH_TIME; G.winner=null; G.introT=1.6;
}
function startMatch(){
  G.round=1; G.score=0; G.elims=0; G.catches=0; G.victory=false; scorePosted=false;
  newGame(); G.state='PLAY'; sndSelect();
}
function restartMatch(){
  G.round=1; G.score=0; G.elims=0; G.catches=0; G.victory=false; scorePosted=false;
  newGame(); G.state='PLAY';
}
function nextRound(){
  G.round++; newGame(); G.state='PLAY'; sndSelect();
}

/* ============================ HELPERS ============================ */
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function opponentsOf(t){ return t==='A'?teamB:teamA; }
function nearestOpp(p){
  var arr=opponentsOf(p.team), best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o.alive) continue;
    var d=dist(p,o); if(d<bd){bd=d;best=o;} }
  return best;
}
function weakestOpp(p){
  var arr=opponentsOf(p.team), best=null, bh=1e9;
  for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o.alive) continue;
    if(o.hp<bh){bh=o.hp;best=o;} }
  return best;
}
function nearestAlive(arr, x, y){
  var best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var p=arr[i]; if(!p.alive) continue;
    var d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p;} }
  return best;
}
function teamHp(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=Math.max(0,arr[i].hp); return s; }
function teamAlive(arr){ for(var i=0;i<arr.length;i++) if(arr[i].alive) return true; return false; }

function clampPlayer(p){
  var minX,maxX;
  if(p.team==='A'){ minX=X0+p.r; maxX=CX-p.r-0.5; }
  else { minX=CX+p.r+0.5; maxX=X1-p.r; }
  if(p.x<minX)p.x=minX; if(p.x>maxX)p.x=maxX;
  if(p.y<Y0+p.r)p.y=Y0+p.r; if(p.y>Y1-p.r)p.y=Y1-p.r;
}

/* ============================ FX ============================ */
function popup(x,y,txt,color,life,big){
  popups.push({x:x,y:y,txt:txt,color:color||'#0ff',life:life||1.0,max:life||1.0,big:!!big});
}
var MAX_PARTICLES=220;   // hard cap keeps 5v5 smooth even during KO/special spam
function spawnBurst(wx,wy,color,n){
  var cx=sx(wx), cy=sy(wy);
  // trim n if we're near the cap so a single burst can't blow past it
  var room=MAX_PARTICLES-particles.length;
  if(room<=0){ particles.splice(0, Math.min(particles.length, n)); room=n; }
  if(n>room) n=room;
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28, sp=40+Math.random()*260;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.6,max:1.0,size:2+Math.random()*4,color:color});
  }
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=280*dt; p.vx*=0.97; p.vy*=0.97; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(var j=popups.length-1;j>=0;j--){
    var q=popups[j]; q.life-=dt; q.y-=(q.big?18:40)*dt; if(q.life<=0) popups.splice(j,1);
  }
  for(var k=trail.length-1;k>=0;k--){
    var t=trail[k]; t.life-=dt; if(t.life<=0) trail.splice(k,1);
  }
}

/* ============================ INPUT ============================ */
var keys={};
var lastDirKey=null, lastDirT=0;   // for double-tap dash detection
function keyName(e){
  var k=e.key;
  if(k===' '||k==='Spacebar') return 'space';
  if(k==='Shift') return 'shift';
  if(k==='Escape') return 'esc';
  if(k==='Enter') return 'enter';
  return k.toLowerCase();
}
window.addEventListener('keydown', function(e){
  var k=keyName(e);
  if(['space','arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','shift','enter'].indexOf(k)>=0) e.preventDefault();
  if(k==='esc'){ doExit(); return; }
  if(k==='v'){ cycleView(); return; }   // camera view toggle (works in autoplay/spectate too)
  if(AP.on) return;   // ignore real input while URL-autoplaying
  if(G.state==='SELECT'){ selectKey(k); keys[k]=true; return; }
  // menu/flow keys still work while WATCHing (spectate) so you can leave it
  if(k==='t'){ G_SKILLSEL=false; G_MODESEL=false; WATCH_ON=false; G.state='SELECT'; return; }
  if(k==='r'){ if(G.state!=='SELECT'){ restartMatch(); } return; }
  if(WATCH_ON) return;   // WATCH mode: no gameplay input, only flow keys above
  if(!e.repeat){
    if(k==='space') actionDown();
    if(k==='shift') doJump();
    if(k==='q') doCaptainSpecial();
    if(k==='e') doDash();               // E = dash burst in current move/facing direction
    // double-tap a direction to dash that way
    if(['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright'].indexOf(k)>=0){
      var nowT=performance.now();
      if(lastDirKey===k && nowT-lastDirT<260){ doDash(); lastDirKey=null; }
      else { lastDirKey=k; lastDirT=nowT; }
    }
  }
  keys[k]=true;
});
window.addEventListener('keyup', function(e){
  var k=keyName(e);
  if(k==='space') actionUp();
  keys[k]=false;
});
window.addEventListener('blur', function(){ keys={}; if(activeRef) activeRef.charging=false; });

function moveVec(){
  var dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  return {x:dx,y:dy};
}

function actionDown(){
  audio();
  if(G.state==='OVER'){ restartMatch(); return; }
  var a=activeRef;
  if(!a||!a.alive) return;
  if(a.hasBall){ a.charging=true; }
  else { a.catchTry=0.20*(a.catMul||1); }   // open catch window (scales with catch skill)
}
function actionUp(){
  var a=activeRef;
  if(a&&a.alive&&a.hasBall&&a.charging){ throwBall(a,a.charge); }
  if(a){ a.charging=false; }
}
function doJump(){
  if(G.state!=='PLAY') return;
  jump(activeRef);
}
function doDash(){
  if(G.state!=='PLAY') return;
  var a=activeRef; if(!a||!a.alive) return;
  var mv=moveVec();
  dash(a, mv.x, mv.y);   // dashes in the pressed direction, or facing if none
}
function doCaptainSpecial(){
  if(G.state!=='PLAY') return;
  // control the human team's captain for the special even if they're not the active carrier
  var cap=null;
  for(var i=0;i<teamA.length;i++){ if(teamA[i].captain && teamA[i].alive){ cap=teamA[i]; break; } }
  if(cap){ captainSpecial(cap); }
}
function jump(p){
  if(!p||!p.alive) return;
  if(p.z>0.5 || p.jumpCd>0) return;
  p.vz=JUMP_VZ; p.jumpCd=0.55; p.iframe=Math.max(p.iframe,0.06);
  sndJump();
}
/* ---- DASH: quick ground burst in a direction (dx,dy world-space, need not be unit) ---- */
function dash(p,dx,dy){
  if(!p||!p.alive||p.dashCd>0||p.z>1) return;
  var m=Math.hypot(dx,dy);
  if(m<0.01){ dx=Math.cos(p.face); dy=Math.sin(p.face); m=1; }
  p.dashDX=dx/m; p.dashDY=dy/m; p.dashT=DASH_TIME; p.dashCd=0.9;
  p.iframe=Math.max(p.iframe,DASH_TIME*0.85);   // dash slips through shots
  sndJump();
  spawnBurst(p.x,p.y,p.color,6);
}
/* ---- CAPTAIN SPECIAL: "OVERDRIVE" — pop a protective shield, gain a dash burst toward the
   nearest threat/enemy, and briefly super-charge the next throw. High-impact, on cooldown. */
function captainSpecial(p){
  if(!p||!p.alive||!p.captain||p.capCd>0) return;
  p.capCd=CAP_COOLDOWN; p.shieldT=SHIELD_TIME; p.capFlash=0.6;
  p.iframe=Math.max(p.iframe,0.5);
  // dash toward action: if holding a ball, dash at the target; else toward nearest loose ball or enemy
  var aim=nearestOpp(p);
  var lb=(!p.hasBall)?nearestLooseBall(p.x,p.y):null;
  var tx = lb?lb.x:(aim?aim.x:p.x+(p.team==='A'?45:-45)), ty=lb?lb.y:(aim?aim.y:p.y);
  dash(p, tx-p.x, ty-p.y);
  p.capBoost=1.0;   // next throw within a short window is a guaranteed special w/ extra power
  sndSpecial(); addShake(9); screenFlash(rgba(p.color,1),0.24);
  spawnBurst(p.x,p.y,p.color,30);
  popup(sx(p.x), sy(p.y)-p.r*scale-20, 'OVERDRIVE!', p.color, 1.2, true);
}
/* ---- lead a moving target: aim where the target WILL be when the ball arrives ---- */
function leadPoint(p,t,spd){
  if(!t) return null;
  var dx=t.x-p.x, dy=t.y-p.y, d=Math.hypot(dx,dy)||1;
  var tt=d/Math.max(120,spd);                // rough travel time (floor scaled for the bigger floor)
  // predict using target velocity, clamp lead so it stays on-court
  var lx=t.x+(t.vx||0)*tt*0.7, ly=t.y+(t.vy||0)*tt*0.7;
  lx=Math.max(X0+2,Math.min(X1-2,lx)); ly=Math.max(Y0+2,Math.min(Y1-2,ly));
  return {x:lx,y:ly};
}
/* ---- best throw target: prefer an alive opponent that is close, low-HP, and roughly ahead ---- */
function bestTarget(p){
  var arr=opponentsOf(p.team), best=null, bs=-1e9;
  for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o.alive) continue;
    var d=dist(p,o);
    // score: closer + weaker + not shielded is better (distance term rescaled for the
    // bigger court so "closer is better" still weighs the same relative to hp/shield)
    var s = 330 - d*0.57 - o.hp*0.5 - (o.shieldT>0?120:0) - (o.z>DODGE_Z?90:0);
    if(s>bs){ bs=s; best=o; }
  }
  return best || nearestOpp(p);
}

/* ============================ THROW / CATCH ============================ */
function throwBall(p,charge,target){
  if(!p||!p.hasBall||!p.ball) return;
  var b=p.ball;
  var t=target||bestTarget(p);
  // captain OVERDRIVE: the queued shot is a guaranteed, extra-powerful special
  var capShot = (p.captain && (p.capBoost||0)>0);
  var special = capShot || charge>=CHARGE_SPECIAL;
  var pw = (p.pwrMul||1)*(capShot?1.35:1);
  var spd = (special?SPECIAL_SPD:THROW_SPD)*(0.9+pw*0.1);
  // aim with LEAD prediction so throws connect on moving targets
  var aimP = leadPoint(p,t,spd) || (t?{x:t.x,y:t.y}:null);
  var ang = aimP ? Math.atan2(aimP.y-p.y, aimP.x-p.x) : (p.team==='A'?0:Math.PI);
  p.capBoost=0;
  b.state='thrown'; b.held=null; b.ownerTeam=p.team; b.special=special;
  b.dmg = Math.round((special?SPECIAL_DMG:NORMAL_DMG)*pw);
  b.x=p.x+Math.cos(ang)*(p.r+BR+1);
  b.y=p.y+Math.sin(ang)*(p.r+BR+1);
  b.z=p.z+14;
  b.vx=Math.cos(ang)*spd; b.vy=Math.sin(ang)*spd; b.vz=0;
  b.curve = special ? (Math.random()*2-1)*260 : 0;   // curve accel (1.33x for the bigger floor)
  b.looseT=0; b.emberT=0;
  p.hasBall=false; p.ball=null; p.charge=0; p.charging=false; p.face=ang; p.throwAnim=0.28;
  sndThrow();
  if(special){ sndSpecial(); addShake(7); spawnBurst(b.x,b.y,p.color,16);
    popup(sx(p.x),sy(p.y)-p.r*scale-14,'SPECIAL!',GN,0.9); }
}
function doCatch(p,b){
  if(!b || p.hasBall) return;
  b.held=p; b.state='held'; b.ownerTeam=p.team; p.hasBall=true; p.ball=b;
  p.iframe=0.3; p.charging=false; p.catchFlash=0.4; b.curve=0; b.special=false;
  if(p.team==='A'){ G.catches++; G.score+=150; }
  if(p.team==='B') p.aiThrow=(0.7+Math.random()*0.9)/(p.buff||1);
  sndCatch(); addShake(3);
  spawnBurst(p.x,p.y,GN,12);
  popup(sx(p.x),sy(p.y)-p.r*scale-16,'CATCH!',GN,0.9,false);
  reviveTeammate(p.team);   // catching revives one KO'd teammate
}
function doGrab(p,b){
  if(!b || p.hasBall) return;
  b.held=p; b.state='held'; b.ownerTeam=p.team; p.hasBall=true; p.ball=b;
  b.curve=0; b.special=false; b.vx=b.vy=b.vz=0;
  if(p.team==='B') p.aiThrow=(0.7+Math.random()*0.9)/(p.buff||1);
}

/* ============================ HIT ============================ */
function checkHits(b){
  var arr=opponentsOf(b.ownerTeam);
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    if(!p.alive || p.iframe>0) continue;
    if(p.z>=DODGE_Z) continue;                 // jumped over it
    if(b.z>HIT_Z) continue;                     // ball above body
    if(Math.hypot(b.x-p.x, b.y-p.y) < p.r+BR+1.5){
      hitPlayer(p, b.dmg, b.special, b);
      return;
    }
  }
}
function hitPlayer(p,dmg,special,b){
  var thrower=b.ownerTeam;
  // CAPTAIN SHIELD: fully deflects the hit (ball drops loose), brief flash, no damage.
  if(p.shieldT>0){
    p.iframe=0.3; p.catchFlash=0.25;
    spawnBurst(p.x,p.y,p.color,14); addShake(4);
    popup(sx(p.x), sy(p.y)-p.r*scale-16, 'BLOCK!', p.color, 0.8, false);
    var vl=Math.hypot(b.vx,b.vy)||1;
    b.state='loose'; b.ownerTeam=null; b.held=null; b.special=false;
    b.x=p.x - (b.vx/vl)*(p.r+BR+1); b.y=p.y - (b.vy/vl)*(p.r+BR+1);
    b.z=9; b.vx*=-0.35; b.vy*=-0.35; b.vz=60; b.curve=0; b.looseT=0;
    return;
  }
  if(thrower==='A'){ G.score += special?120:60; }
  p.hp-=dmg; p.hitFlash=0.28; p.iframe=0.45;
  popup(sx(p.x), sy(p.y)-p.r*scale-18, '-'+dmg, special?'#ff6bde':'#ffd24d', 1.0, special);
  spawnBurst(p.x,p.y, special?MG:'#ffffff', special?26:16);
  addShake(special?14:7);
  if(special){ screenFlash(rgba(MG,1),0.22); }
  if(special) sndBigHit(); else sndHit();
  // knockback
  var vlen=Math.hypot(b.vx,b.vy)||1;
  p.x+=b.vx/vlen*(special?5.25:2.7);
  p.y+=b.vy/vlen*(special?5.25:2.7);
  clampPlayer(p);
  // ball drops loose on victim's side
  b.state='loose'; b.ownerTeam=null; b.held=null; b.special=false;
  b.x=p.x + (b.vx/vlen)*(p.r+BR); b.y=p.y + (b.vy/vlen)*(p.r+BR);
  b.z=9; b.vx*=0.15; b.vy*=0.15; b.vz=60; b.curve=0; b.looseT=0;
  if(p.hp<=0){ if(thrower==='A' && p.team==='B'){ G.elims++; G.score+=500; } koPlayer(p); }
  checkWin();
}
var koCounter=0;
function koPlayer(p){
  p.hp=0; p.alive=false; p.koFall=0.01;
  p.koOrder=(++koCounter);   // stamp KO order so revive picks the earliest-fallen
  // drop any ball this player was holding so it becomes loose (multi-ball safety)
  if(p.ball){ var b=p.ball; b.state='loose'; b.held=null; b.ownerTeam=null;
    b.z=9; b.vz=45; b.vx=0; b.vy=0; b.looseT=0; b.special=false; b.curve=0;
    p.ball=null; p.hasBall=false; }
  spawnBurst(p.x,p.y,p.color,40);
  addShake(16); screenFlash('#ff1a1a',0.30); sndKO();
  popup(sx(p.x), sy(p.y)-p.r*scale-20, 'K.O.!', '#ff1a1a', 1.4, true);
}
// Catch reward: revive the earliest-KO'd teammate at home, half HP.
function reviveTeammate(team){
  var arr = team==='A' ? teamA : teamB;
  var pick=null;
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    if(!p.alive && (pick===null || (p.koOrder||1e9) < (pick.koOrder||1e9))) pick=p;
  }
  if(!pick) return;
  pick.alive=true;
  pick.hp=Math.max(1, Math.round(pick.maxHp*0.5));
  pick.koFall=0; pick.iframe=0.6; pick.hasBall=false; pick.ball=null;
  pick.x=pick.homeX; pick.y=pick.homeY; pick.z=0; pick.vx=pick.vy=pick.vz=0;
  pick.charge=0; pick.charging=false; pick.hitFlash=0; pick.koOrder=null;
  spawnBurst(pick.x,pick.y,GN,20);
  popup(sx(pick.x), sy(pick.y)-pick.r*scale-18, 'REVIVE!', GN, 1.2, true);
  sndSelect();
}
function checkWin(){
  var aA=teamAlive(teamA), bA=teamAlive(teamB);
  if(!bA){ roundWon(); }
  else if(!aA){ defeat(); }
}
function timeUp(){
  if(G.state!=='PLAY') return;
  var ha=teamHp(teamA), hb=teamHp(teamB);
  if(ha>=hb){ roundWon(); } else { defeat(); }
}
function roundWon(){
  G.score += 1000*G.round;                 // round-clear bonus (scales up)
  G.score += Math.floor(teamHp(teamA))*2;  // survival bonus for remaining HP
  if(G.round>=MAX_ROUNDS){ victory(); return; }
  G.state='ROUNDCLEAR'; G.rcT=2.4; sndWin();
}
function victory(){
  G.state='OVER'; G.winner='A'; G.victory=true; sndWin(); postScore(G.score);
}
function defeat(){
  G.state='OVER'; G.winner='B'; G.victory=false; sndLose(); postScore(G.score);
}
/* ---- score reporting to the SHADDAI shell (postMessage) + leaderboard API ---- */
function postScore(finalScore){
  if(scorePosted) return; scorePosted=true;
  if(AP.on){
    var win=!!G.victory;
    var hp=Math.round(teamHp(teamA));
    apReport(win ? 1000+hp : hp, win);   // score = win?1000+remainingHP:remainingHP
  }
  try{ window.parent.postMessage({type:'shaddai-game-score', game:'dodgeball', score:finalScore}, '*'); }catch(e){}
  try{ if(window.parent!==window) window.parent.postMessage({shdGame:'dodgeball', shdScore:finalScore, shdWin:!!G.victory}, location.origin); }catch(e){}   // SHADDAI arcade score bridge
  try{
    fetch('/api/leaderboard/dodgeball', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ game:'dodgeball', score:finalScore, agent:G.playerAgent.key,
        round:G.round, elims:G.elims, catches:G.catches, victory:!!G.victory, ts:Date.now() })
    }).catch(function(){});
  }catch(e){}
}

/* ============================ ACTIVE PLAYER ============================ */
function updateActive(){
  // if a team-A player currently holds a ball, control them
  for(var i=0;i<teamA.length;i++){ var p=teamA[i]; if(p.alive && p.hasBall){ activeRef=p; return; } }
  // otherwise control the team-A player nearest to the nearest loose ball
  var target=null, bd=1e9;
  for(var j=0;j<balls.length;j++){ var b=balls[j];
    if(b.state==='held' && b.ownerTeam==='A') continue;
    // prefer loose balls and incoming enemy throws
    var g=nearestAlive(teamA, b.x, b.y); if(!g) continue;
    var d=Math.hypot(g.x-b.x,g.y-b.y); if(d<bd){bd=d; target=g;}
  }
  activeRef = target || nearestAlive(teamA, CX, 60) || (teamA[0]||null);
}
function updateActiveInput(a,dt){
  var mv=moveVec(); var m=Math.hypot(mv.x,mv.y);
  var msp=MOVE_SPD*(a.spdMul||1);
  if(a.dashT>0){
    // dash burst overrides normal control for its short duration
    a.vx=a.dashDX*DASH_SPD; a.vy=a.dashDY*DASH_SPD;
  } else if(m>0){
    // momentum-eased steering so movement feels weighty, not on/off
    var wx=mv.x/m*msp, wy=mv.y/m*msp, k=Math.min(1,dt*12);
    a.vx+=(wx-a.vx)*k; a.vy+=(wy-a.vy)*k;
    if(!a.hasBall) a.face=Math.atan2(mv.y,mv.x);
  } else { a.vx*=0.55; a.vy*=0.55; }
  a.x+=a.vx*dt; a.y+=a.vy*dt;
  if(a.hasBall){
    var t=nearestOpp(a); if(t) a.face=Math.atan2(t.y-a.y,t.x-a.x);
    if(a.charging) a.charge=Math.min(CHARGE_MAX, a.charge+dt);
  }
  if(a.catchTry>0 && !a.hasBall){
    a.catchTry-=dt;
    // scan ALL thrown enemy balls; catch the nearest one in range
    var tb=nearestThreatBall(a);
    if(tb && dist(a,tb)<CATCH_R*(a.catMul||1)){ doCatch(a,tb); }
  }
}

/* ============================ AI ============================ */
function threatInfo(p){
  // scan every thrown enemy ball; return the closest approaching threat + that ball
  var best=null, bd=1e9;
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(b.state!=='thrown' || b.ownerTeam===p.team) continue;
    var d=Math.hypot(b.x-p.x, b.y-p.y);
    if(d>72) continue;   // threat-scan range (1.4x for the bigger floor)
    var toP_x=p.x-b.x, toP_y=p.y-b.y;
    if((toP_x*b.vx + toP_y*b.vy) <= 0) continue;   // not approaching
    if(d<bd){ bd=d; best=b; }
  }
  if(!best) return null;
  return {d:bd, ball:best};
}
// smoothly steer a player toward a world target at a given speed (with momentum)
function aiSteer(p,tx,ty,spd,dt){
  var dx=tx-p.x, dy=ty-p.y, mm=Math.hypot(dx,dy)||1;
  var wx=dx/mm*spd, wy=dy/mm*spd;
  // momentum: ease velocity toward the desired vector so movement looks fluid, not robotic
  var k=Math.min(1, dt*9);
  p.vx+=(wx-p.vx)*k; p.vy+=(wy-p.vy)*k;
  // dash overrides normal steering
  if(p.dashT>0){ p.vx=p.dashDX*DASH_SPD; p.vy=p.dashDY*DASH_SPD; }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
}
function runAI(p,dt){
  var th=threatInfo(p);
  // ---- captain uses OVERDRIVE when threatened or when it can turn the tide ----
  if(p.captain){
    p.aiCapT-=dt;
    if(p.capCd<=0 && p.aiCapT<=0){
      var lowHp = p.hp < p.maxHp*0.5;
      var pressured = th && th.d<84;
      var teamDown = teamHp(p.team==='A'?teamA:teamB) < teamHp(opponentsOf(p.team))*0.7;
      if(pressured || (p.hasBall && Math.random()<0.5) || lowHp || teamDown){
        captainSpecial(p);
        p.aiCapT=CAP_COOLDOWN+Math.random()*2;
      } else { p.aiCapT=0.6; }
    }
  }
  // ---- reaction to an incoming ball: catch, dash-dodge, or jump ----
  if(th && !p.hasBall){
    if(th.d<CATCH_R*(p.catMul||1) && p.z<2){
      var cc=(th.ball.special?0.9:2.0)*dt*(p.catMul||1)*(p.buff||1);
      if(Math.random()<cc){ doCatch(p, th.ball); return; }
    }
    // DASH-DODGE sideways out of the ball's path (best evasion) — otherwise jump over
    if(th.d<63 && p.dashCd<=0 && p.z<1 && Math.random()<0.5){
      var tb=th.ball, perpx=-tb.vy, perpy=tb.vx;
      var side=((p.x-tb.x)*perpx+(p.y-tb.y)*perpy)>=0?1:-1;
      dash(p, perpx*side, perpy*side);
    } else if(p.z<=0.5 && th.d<46 && p.jumpCd<=0 && Math.random()<0.85){ jump(p); }
  }
  if(p.hasBall){
    holderMove(p,dt);
    p.aiThrow-=dt;
    if(p.aiThrow<=0){
      var tgt = Math.random()<0.35 ? weakestOpp(p) : bestTarget(p);
      var chargeVal = Math.random()<0.34 ? (CHARGE_SPECIAL+0.2) : 0.0;
      throwBall(p, chargeVal, tgt);
    }
    return;
  }
  // ---- no ball: actively hunt the nearest loose ball, else hold/roam the zone ----
  var lb=nearestLooseBall(p.x,p.y);
  var reachable = lb && Math.hypot(lb.x-p.x,lb.y-p.y) < 190 &&
                  ((p.team==='A' && lb.x<=CX-p.r) || (p.team==='B' && lb.x>=CX+p.r));
  if(reachable && !(th && th.d<42)){
    var spd=MOVE_SPD*(p.spdMul||1);
    aiSteer(p, lb.x, lb.y, spd, dt);
    p.face=Math.atan2(lb.y-p.y, lb.x-p.x);
  } else {
    homeMove(p,dt,th);
  }
}
function holderMove(p,dt){
  var t=nearestOpp(p);
  // advance toward a firing lane, then STRAFE laterally to line up the shot / juke
  var fireX = p.team==='B' ? CX + (X1-CX)*0.24 : CX - (CX-X0)*0.24;
  p.wander+=dt*2.2;
  var goalY = (t ? t.y : p.homeY) + Math.sin(p.wander)*21;  // weave to break enemy aim (wider on bigger floor)
  var spd=63*(p.spdMul||1);   // holder advance speed (1.4x)
  aiSteer(p, fireX, goalY, spd, dt);
  if(t){ var lp=leadPoint(p,t,THROW_SPD)||t; p.face=Math.atan2(lp.y-p.y,lp.x-p.x); }
}
function homeMove(p,dt,th){
  // ---- role-based positioning: FRONT players press near the line, BACK players hold
  // deep + cover. Everyone spreads out (avoid clustering) and reacts to threats. ----
  var side=(p.team==='A')?1:-1;
  var lineX = (p.team==='A') ? CX-13 : CX+13;   // scaled for the bigger floor
  var baseX = (p.aiRole==='front') ? lineX - side*(42+Math.sin(perfNow*0.001+p.num)*17)
                                    : p.homeX;   // front-liners press ~42u off the line
  // if the enemy holds a ball, front-liners advance to pressure; if we hold none, drop back a touch
  var anyEnemyBall=false, oarr=opponentsOf(p.team);
  for(var i=0;i<oarr.length;i++){ if(oarr[i].alive && oarr[i].hasBall){ anyEnemyBall=true; break; } }
  p.wander+=dt*(0.8+Math.random()*0.5);
  var tx=baseX+Math.cos(p.wander)*15;              // wider roam on the bigger floor
  var ty=p.homeY+Math.sin(p.wander*1.3)*34;
  // spread: push away from the nearest teammate so the team uses the whole (bigger) court
  var mate=null, md=1e9, tarr=(p.team==='A')?teamA:teamB;
  for(var m=0;m<tarr.length;m++){ var q=tarr[m]; if(q===p||!q.alive) continue;
    var d=Math.hypot(q.x-p.x,q.y-p.y); if(d<md){md=d;mate=q;} }
  if(mate && md<50){ tx+=(p.x-mate.x)*0.6; ty+=(p.y-mate.y)*0.6; }   // wider spread trigger for real gaps
  // strafe out of an incoming ball's lane
  if(th && th.ball && p.z<=0.5){
    var tb=th.ball, perpx=-tb.vy, perpy=tb.vx, pl=Math.hypot(perpx,perpy)||1;
    var sgn=((p.x-tb.x)*perpx+(p.y-tb.y)*perpy)>=0?1:-1;
    tx+=perpx/pl*sgn*50; ty+=perpy/pl*sgn*50;      // bigger juke on the roomier floor
  }
  var spd=(th?96:(anyEnemyBall?63:50))*(p.spdMul||1);   // ~1.4x so AI keeps pace on the bigger floor
  aiSteer(p, tx, ty, spd, dt);
  var o=nearestOpp(p); if(o) p.face=Math.atan2(o.y-p.y,o.x-p.x);
}

/* ============================ PHYSICS + BALL ============================ */
function updatePlayerPhysics(p,dt){
  p.z+=p.vz*dt; p.vz-=GRAV*dt;
  if(p.z<0){ p.z=0; p.vz=0; }
  p.iframe=Math.max(0,p.iframe-dt);
  p.jumpCd=Math.max(0,p.jumpCd-dt);
  p.hitFlash=Math.max(0,p.hitFlash-dt);
  p.throwAnim=Math.max(0,p.throwAnim-dt);
  p.catchFlash=Math.max(0,p.catchFlash-dt);
  // captain + dash timers
  p.capCd=Math.max(0,p.capCd-dt);
  p.shieldT=Math.max(0,p.shieldT-dt);
  p.capFlash=Math.max(0,p.capFlash-dt);
  p.dashCd=Math.max(0,p.dashCd-dt);
  if(p.dashT>0){ p.dashT=Math.max(0,p.dashT-dt); }
  if(p.capBoost>0){ p.capBoost=Math.max(0,p.capBoost-dt); }   // OVERDRIVE throw window (~1s)
  if(p.koFall>0) p.koFall=Math.min(1,p.koFall+dt*2.4);
  // ---- SMOOTHED GAIT (cleaner limbs) ----
  // Drive the walk cycle from a low-pass-filtered speed rather than the raw (jittery)
  // per-frame velocity. gaitS eases toward the current speed fraction, so the stride
  // and knee/elbow bend ramp in/out smoothly instead of snapping — this is what kills
  // the "janky" close-up limb popping. Advance the cycle at a rate tied to that eased
  // speed so feet don't stutter when velocity flickers.
  var mvNow=Math.hypot(p.vx||0,p.vy||0);
  var gTarget=Math.min(1, mvNow/(MOVE_SPD*0.9));   // 0 idle -> 1 at ~full run
  if(p.gaitS==null) p.gaitS=0;
  p.gaitS += (gTarget-p.gaitS)*Math.min(1,dt*8);   // low-pass filter (smooth ramp)
  // cycle speed: idle keeps a slow breathing cadence; running strides faster
  p.anim += dt*(3.2 + p.gaitS*9.5);
  clampPlayer(p);
}
function updateBall(b,dt){
  if(b.state==='held'){
    var h=b.held;
    if(!h||!h.alive){ b.state='loose'; b.held=null; b.ownerTeam=null; b.looseT=0; return; }
    b.x=h.x+Math.cos(h.face)*(h.r+2);
    b.y=h.y+Math.sin(h.face)*(h.r+2);
    b.z=h.z+14; b.vx=b.vy=0;
  }
  else if(b.state==='thrown'){
    if(b.curve){
      var vlen=Math.hypot(b.vx,b.vy)||1;
      var px=-b.vy/vlen, py=b.vx/vlen;
      b.vx+=px*b.curve*dt; b.vy+=py*b.curve*dt;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.spin+=dt*20;
    if(trail.length<90) trail.push({x:b.x,y:b.y,special:b.special,life:0.3,max:0.3});
    if(b.special){ b.emberT-=dt; if(b.emberT<=0){ b.emberT=0.03;
      spawnBurst(b.x,b.y,Math.random()<0.5?'#ff8a3d':'#ffd24d',2); } }
    // walls -> loose
    if(b.x<X0+BR||b.x>X1-BR||b.y<Y0+BR||b.y>Y1-BR){
      b.x=Math.max(X0+BR,Math.min(X1-BR,b.x));
      b.y=Math.max(Y0+BR,Math.min(Y1-BR,b.y));
      b.state='loose'; b.ownerTeam=null; b.special=false;
      b.vx*=-0.25; b.vy*=-0.25; b.vz=45; b.z=9; b.curve=0; b.looseT=0;
    }
  }
  else if(b.state==='loose'){
    b.looseT+=dt;
    b.z+=b.vz*dt; b.vz-=GRAV*dt;
    if(b.z<0){ b.z=0; b.vz*=-0.4; if(Math.abs(b.vz)<18) b.vz=0; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.vx*=0.90; b.vy*=0.90;
    if(b.x<X0+BR){b.x=X0+BR;b.vx*=-0.4;}
    if(b.x>X1-BR){b.x=X1-BR;b.vx*=-0.4;}
    if(b.y<Y0+BR){b.y=Y0+BR;b.vy*=-0.4;}
    if(b.y>Y1-BR){b.y=Y1-BR;b.vy*=-0.4;}
    b.spin*=0.96;
    // ---- PICKUP (corner/ground-safe) ----
    // Grab by the nearest ALIVE player in range who isn't already holding a ball.
    // Fix: don't pick the globally-nearest player (who may be an enemy pinned on the
    // wrong half and unable to reach) — scan every player and take the closest one that
    // is actually within its own reach. Works fully at rest and hard against walls/corners
    // because the pickup radius is measured to the player, not gated by court geometry.
    var spd=Math.hypot(b.vx,b.vy);
    if(spd<140 && b.looseT>0.10){
      var grabber=null, gbest=1e9;
      for(var pi=0; pi<players.length; pi++){
        var g=players[pi];
        if(!g.alive || g.hasBall) continue;
        var gd=Math.hypot(g.x-b.x, g.y-b.y);
        // near-static balls (settled on ground / wedged in corners) get a wider grab
        // radius so they're never un-pickable; moving balls use the base radius.
        var reach=(spd<36 && b.z<4.5) ? (PICKUP_R+g.r+8) : (PICKUP_R+g.r);
        if(gd<reach && gd<gbest){ gbest=gd; grabber=g; }
      }
      if(grabber){ doGrab(grabber,b); }
    }
  }
}

/* ============================ MAIN UPDATE ============================ */
function updatePlay(dt){
  if(G.introT>0) G.introT-=dt;
  G.timer-=dt; if(G.timer<=0){ G.timer=0; timeUp(); return; }
  updateActive();
  var a=activeRef;
  if(a&&a.alive){ if(AP.on||WATCH_ON) apActiveAI(a,dt); else updateActiveInput(a,dt); }
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p===a || !p.alive) continue;
    runAI(p,dt);
  }
  for(var j=0;j<players.length;j++) updatePlayerPhysics(players[j],dt);
  for(var bi=0;bi<balls.length;bi++){
    var b=balls[bi];
    updateBall(b,dt);
    if(b.state==='thrown') checkHits(b);
  }
}

/* ============================ RENDER: COURT ============================ */
// procedural neon crowd — a band of soft twinkling dots framing the court on the
// top + sides, cheap (seeded, no per-frame allocs) so it stays smooth.
var CROWD=null;
function buildCrowd(){
  CROWD=[]; var cols=['#00f0ff','#ff2bd6','#00ff88','#ffd24a','#b06bff'];
  for(var i=0;i<180;i++){
    CROWD.push({ r:Math.random(), band:Math.random(), t:Math.random()*6.28,
      c:cols[(Math.random()*cols.length)|0], sz:1+Math.random()*1.6 });
  }
}
function drawCrowd(L,R,T,B){
  if(!CROWD) buildCrowd();
  var topBand=Math.max(0,T-Math.min(90,(T)*0.9));  // area above the court
  ctx.save();
  for(var i=0;i<CROWD.length;i++){
    var d=CROWD[i], x, y;
    if(d.band<0.55){          // top stands
      x=L-30 + d.r*((R+30)-(L-30));
      y=topBand + d.band/0.55*(T-topBand-6);
    } else if(d.band<0.775){  // left stands
      x=Math.max(2,L-40) + d.r*30;
      y=T + (d.band-0.55)/0.225*(B-T);
    } else {                  // right stands
      x=R+8 + d.r*30;
      y=T + (d.band-0.775)/0.225*(B-T);
    }
    var tw=0.35+0.65*(0.5+0.5*Math.sin(perfNow*0.003+d.t));
    ctx.globalAlpha=0.10+tw*0.35;
    ctx.fillStyle=d.c; ctx.shadowColor=d.c; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(x,y,d.sz,0,6.283); ctx.fill();
  }
  ctx.restore();
}
function drawCourt(){
  // deep arena backdrop (dark magenta-noir) behind everything
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#12001a'); bg.addColorStop(0.55,'#0a0011'); bg.addColorStop(1,'#050008');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // In OPPONENT-FACING (mirror) view, sx(X0) lands on the right and sx(X1) on the
  // left, so normalize to true left/right/top/bottom for fills & gradients (a
  // negative width fed to createRadialGradient's radius throws IndexSizeError).
  var L0=sx(X0), R0=sx(X1), T0=sy(Y0), B0=sy(Y1);
  var L=Math.min(L0,R0), R=Math.max(L0,R0), T=Math.min(T0,B0), B=Math.max(T0,B0);
  // neon crowd / stands behind the court (subtle twinkling dots framing the arena)
  drawCrowd(L,R,T,B);

  var mx=sx(CX), midY=(T+B)/2;
  var cw=R-L, ch=B-T;
  var pc=G.playerAgent.color, cc=G.cpuAgent.color;

  ctx.save();
  // clip to the court so the polished floor never bleeds past the walls
  ctx.beginPath(); ctx.rect(L,T,cw,ch); ctx.clip();

  // 1) polished floor base — dark surface, brighter at center, darker toward edges
  var floorBase=ctx.createLinearGradient(0,T,0,B);
  floorBase.addColorStop(0,'#140120'); floorBase.addColorStop(0.5,'#1c0330'); floorBase.addColorStop(1,'#0c0016');
  ctx.fillStyle=floorBase; ctx.fillRect(L,T,cw,ch);
  // radial center-court glow (magenta) so players/balls pop against a bright middle
  var rad=ctx.createRadialGradient(mx,midY,0,mx,midY,Math.max(cw,ch)*0.62);
  rad.addColorStop(0,'rgba(255,43,214,0.22)'); rad.addColorStop(0.5,'rgba(255,43,214,0.07)'); rad.addColorStop(1,'rgba(255,43,214,0)');
  ctx.fillStyle=rad; ctx.fillRect(L,T,cw,ch);

  // 2) team-tinted halves (agent colors, subtle)
  var gA=ctx.createLinearGradient(L,0,mx,0);
  gA.addColorStop(0,rgba(pc,0.20)); gA.addColorStop(1,rgba(pc,0.04));
  ctx.fillStyle=gA; ctx.fillRect(L,T,mx-L,ch);
  var gB=ctx.createLinearGradient(mx,0,R,0);
  gB.addColorStop(0,rgba(cc,0.04)); gB.addColorStop(1,rgba(cc,0.20));
  ctx.fillStyle=gB; ctx.fillRect(mx,T,R-mx,ch);

  // 3) tile / panel grid — cyan hairlines, brighter near center via a soft overlay pass
  ctx.strokeStyle='rgba(0,240,255,0.10)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var gx=10; gx<COURT_W; gx+=10){ ctx.moveTo(sx(gx),T); ctx.lineTo(sx(gx),B); }
  for(var gy=10; gy<COURT_H; gy+=10){ ctx.moveTo(L,sy(gy)); ctx.lineTo(R,sy(gy)); }
  ctx.stroke();

  // 4) reflection sheen — a soft diagonal highlight sweeping the floor (screen-blend)
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var sheen=ctx.createLinearGradient(L,T,R*0.55,B);
  sheen.addColorStop(0,'rgba(255,255,255,0.045)');
  sheen.addColorStop(0.35,'rgba(255,120,230,0.02)');
  sheen.addColorStop(0.6,'rgba(255,255,255,0)');
  ctx.fillStyle=sheen; ctx.fillRect(L,T,cw,ch);
  ctx.restore();

  // 5) inner vignette — darken the edges so the field reads as a lit stage
  var vig=ctx.createRadialGradient(mx,midY,Math.min(cw,ch)*0.28,mx,midY,Math.max(cw,ch)*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig; ctx.fillRect(L,T,cw,ch);
  ctx.restore(); // end clip

  // 6) center divider — glowing magenta beam with a white core + cyan mid circle
  ctx.save();
  var pulse=(Math.sin(perfNow*0.004)*0.5+0.5);
  ctx.strokeStyle=rgba(MG,0.9); ctx.lineWidth=4; ctx.shadowColor=MG; ctx.shadowBlur=18+pulse*10;
  ctx.beginPath(); ctx.moveTo(mx,T); ctx.lineTo(mx,B); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.4; ctx.shadowBlur=6;
  ctx.setLineDash([14,10]);
  ctx.beginPath(); ctx.moveTo(mx,T); ctx.lineTo(mx,B); ctx.stroke();
  ctx.setLineDash([]);
  // center circle (cyan) + inner dot
  ctx.strokeStyle=rgba(CY,0.6); ctx.lineWidth=2; ctx.shadowColor=CY; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(mx,midY, 22*scale, 0, 6.283); ctx.stroke();
  ctx.fillStyle=rgba(CY,0.12);
  ctx.beginPath(); ctx.arc(mx,midY, 22*scale, 0, 6.283); ctx.fill();
  ctx.restore();

  // 7) boundary walls — layered neon rail (magenta outer glow + cyan inner line)
  ctx.save();
  ctx.strokeStyle=rgba(MG,0.75); ctx.lineWidth=5; ctx.shadowColor=MG; ctx.shadowBlur=22;
  ctx.strokeRect(L,T,cw,ch);
  ctx.strokeStyle=rgba(CY,0.85); ctx.lineWidth=1.8; ctx.shadowColor=CY; ctx.shadowBlur=10;
  ctx.strokeRect(L,T,cw,ch);
  // corner accents
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2.5; ctx.shadowBlur=8;
  var cl=16*scale;
  var corners=[[L,T,1,1],[R,T,-1,1],[L,B,1,-1],[R,B,-1,-1]];
  ctx.beginPath();
  for(var i=0;i<corners.length;i++){ var c=corners[i];
    ctx.moveTo(c[0]+c[2]*cl,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*cl);
  }
  ctx.stroke();
  ctx.restore();
}

/* ============================ RENDER: PLAYER (big-head arcade sprite) ============================ */
// Draws a NBA-Jam style character: oversized circular portrait head on a small
// procedural body (jersey w/ number, shorts, limbs). Falls back to a vector head
// if the portrait isn't loaded. Flip to face dir, squash/stretch on jump, lean on throw.
function drawPlayer(p){
  var X=sx(p.x);
  var footY=sy(p.y);
  var lift=p.z*scale*0.55;
  var u=p.r*scale*depthOf(p.y);      // unit size w/ subtle depth
  var isActive=(p===activeRef && G.state==='PLAY');
  // SMOOTHED FACING: ease a continuous [-1..1] sign across left/right flips so the
  // knee/elbow bend direction doesn't snap-pop when a player turns — a big source of
  // close-up limb jank. faceSign stays the discrete sign for gross flip decisions;
  // faceSignS is the eased value used to drive joint bend.
  var faceSign = Math.cos(p.face)>=0 ? 1 : -1;
  if(p.faceSignS==null) p.faceSignS=faceSign;
  p.faceSignS += (faceSign-p.faceSignS)*0.28;   // ~4-frame ease across a flip

  // squash/stretch from vertical velocity (jump = stretch up, land = squash)
  var airT = Math.max(-1,Math.min(1, p.vz/JUMP_VZ));
  var sqY = 1 + airT*0.12;            // taller going up
  var sqX = 1 - airT*0.10;            // narrower going up

  // shadow (shrinks as they rise)
  ctx.save();
  ctx.globalAlpha=0.34*(1-Math.min(0.7,p.z/40)); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(X, footY, u*1.05*(1-p.z/60), u*0.44*(1-p.z/60), 0,0,6.283); ctx.fill();
  ctx.restore();

  // active ring at feet
  if(isActive){
    ctx.save();
    var pr=(Math.sin(perfNow*0.008)*0.5+0.5);
    ctx.globalAlpha=0.85; ctx.strokeStyle=GN; ctx.lineWidth=3;
    ctx.shadowColor=GN; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(X, footY, u*1.4+pr*3, u*0.62+pr*1.4, 0,0,6.283); ctx.stroke();
    // little chevron arrow above showing it's you
    ctx.globalAlpha=0.7+pr*0.3; ctx.fillStyle=GN;
    var ay=footY-lift-u*4.7-pr*2;
    ctx.beginPath(); ctx.moveTo(X,ay+u*0.5); ctx.lineTo(X-u*0.42,ay); ctx.lineTo(X+u*0.42,ay); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // captain marker: a small glowing chevron/star ring at the feet (distinct from active ring)
  if(p.captain && p.alive){
    ctx.save();
    var cp=(Math.sin(perfNow*0.006+p.num)*0.5+0.5);
    ctx.globalAlpha=0.6+cp*0.35; ctx.strokeStyle=p.color; ctx.lineWidth=2;
    ctx.shadowColor=p.color; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.ellipse(X, footY, u*1.15+cp*2, u*0.5+cp*1, 0,0,6.283); ctx.stroke();
    // captain "C" star pip above the HP bar area
    ctx.globalAlpha=0.9; ctx.fillStyle=p.color; ctx.shadowBlur=8;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(u*0.9).toFixed(0)+"px 'Orbitron',sans-serif";
    ctx.fillText('★', X, footY-lift-u*5.6);
    ctx.restore();
  }
  // captain shield bubble (active OVERDRIVE deflect field)
  if(p.shieldT>0 && p.alive){
    ctx.save();
    var sa=Math.min(1,p.shieldT/SHIELD_TIME);
    var sp=(Math.sin(perfNow*0.02)*0.5+0.5);
    ctx.globalAlpha=0.25+sa*0.35;
    ctx.strokeStyle=p.color; ctx.lineWidth=2.5; ctx.shadowColor=p.color; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.ellipse(X, footY-u*2.2, u*2.0+sp*3, u*2.7+sp*3, 0,0,6.283); ctx.stroke();
    ctx.globalAlpha=0.10+sa*0.12; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.ellipse(X, footY-u*2.2, u*2.0, u*2.7, 0,0,6.283); ctx.fill();
    ctx.restore();
  }

  if(!p.alive){
    // KO: fallen figure + cross marker
    ctx.save();
    ctx.globalAlpha=0.4; ctx.strokeStyle=p.color; ctx.lineWidth=2.5;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    var kcy=footY-u*0.8;
    ctx.beginPath(); ctx.moveTo(X-u*0.7,kcy-u*0.7); ctx.lineTo(X+u*0.7,kcy+u*0.7);
    ctx.moveTo(X+u*0.7,kcy-u*0.7); ctx.lineTo(X-u*0.7,kcy+u*0.7); ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(X, footY - lift);
  ctx.scale(sqX, sqY);
  // lean on wind-up / throw
  var lean = 0;
  if(p.charging) lean = -0.22*faceSign;
  if(p.throwAnim>0) lean = 0.30*faceSign*(p.throwAnim/0.28);
  var iframeFlick = (p.iframe>0 && Math.floor(perfNow/60)%2===0) ? 0.55 : 1;
  ctx.globalAlpha=iframeFlick;
  ctx.rotate(lean*0.30);

  var flash = p.hitFlash>0;
  var bodyCol = flash ? '#ffffff' : p.color;
  var bodyDark = flash ? '#ffffff' : tint(p.color,0.55);
  var jerseyLo = flash ? '#ffffff' : tint(p.color,0.34);
  var glowCol = p.color;
  // NOTE: p.anim now advances at a speed-eased rate and gaitS is a low-passed speed
  // fraction (see updatePlayerPhysics), so these drivers are smooth — no per-frame
  // velocity jitter reaches the limbs, which reads clean even at close zoom.
  var walk = Math.sin(p.anim);
  // walk phase for the second (opposite) limb, and a running-intensity scalar
  var walk2 = Math.sin(p.anim + Math.PI);
  var gait = (p.gaitS!=null?p.gaitS:0);    // 0 idle -> 1 running (drives stride + knee bend)
  var breathe = Math.sin(p.anim*0.55)*u*0.04; // subtle idle bob

  // --- ATHLETIC HUMAN PROPORTIONS (realistic-ish, no big-head) ---
  // Ground is y=0 (feet). Everything measured up from the feet.
  var hipY    = -u*1.55;                // pelvis / hip pivot
  var torsoH  = u*1.45;                 // torso height (hip -> shoulder)
  var shoulderY = hipY - torsoH;        // shoulder line
  var torsoHalf = u*0.62;               // torso half-width
  var neckY   = shoulderY - u*0.18;
  var headR   = u*0.72;                 // realistic head (was oversized u*1.15)
  var headCY  = neckY - headR - u*0.06 - breathe;

  // small helper: draw a two-segment limb that bends at a joint (elbow/knee).
  // hipX/hipY = root, footX/footY = end; bendDir pushes the joint out so it flexes.
  function limb(rootX,rootY,endX,endY,bend,width,col){
    var mx=(rootX+endX)/2, my=(rootY+endY)/2;
    // perpendicular offset gives the joint its outward bend
    var dx=endX-rootX, dy=endY-rootY, len=Math.hypot(dx,dy)||1;
    var nx=-dy/len, ny=dx/len;
    var jx=mx+nx*bend, jy=my+ny*bend;
    ctx.strokeStyle=col; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(rootX,rootY); ctx.lineTo(jx,jy); ctx.lineTo(endX,endY); ctx.stroke();
    return {jx:jx,jy:jy};
  }

  // ===== LEGS: thigh + shin bending at the KNEE =====
  var legSpread=u*0.30;
  var stride=(0.28+gait*0.34)*u;               // how far feet swing fore/aft
  var kneeBend=(0.18+gait*0.34)*u;             // knee flex increases when running
  // jump: tuck knees up (bend more, feet rise)
  var jumpTuck = airT>0 ? airT*u*0.5 : 0;
  // foot targets (swing front/back with walk cycle)
  var lFootX=-legSpread + walk*stride, lFootY=-u*0.02 - (walk>0?jumpTuck:0);
  var rFootX= legSpread + walk2*stride, rFootY=-u*0.02 - (walk2>0?jumpTuck:0);
  var hipLX=-legSpread*0.7, hipRX=legSpread*0.7, hy=hipY;
  // knees bend forward (toward facing) — use the EASED facing sign so the bend
  // rotates smoothly across a flip instead of popping to the mirror instantly.
  var kb = kneeBend + jumpTuck*0.6;
  var kbSign = p.faceSignS;   // eased [-1..1]
  // back leg first (behind torso), then front leg drawn after torso for depth
  // -- BACK LEG (the one swinging back) --
  var backIsLeft = walk<0;
  var thighW=u*0.50, shinW=u*0.40;
  // draw both legs' back portions here; front leg re-drawn over torso below.
  // We draw the far (top-going-back) leg fully now:
  (function(){
    // choose the leg currently in "back" swing to sit behind torso
    var fx2=backIsLeft?lFootX:rFootX, fy2=backIsLeft?lFootY:rFootY, hx=backIsLeft?hipLX:hipRX;
    limb(hx,hy, fx2,fy2, kbSign*kb, thighW, bodyDark);
    // shoe
    ctx.fillStyle=flash?'#fff':'#dfeefc';
    ctx.beginPath(); ctx.ellipse(fx2+faceSign*u*0.10, fy2+u*0.02, u*0.26,u*0.13,0,0,6.283); ctx.fill();
  })();

  // ===== TORSO (jersey) — tapered athletic trunk with shade gradient =====
  ctx.save();
  ctx.shadowColor=glowCol; ctx.shadowBlur=isActive?15:8;
  var jg=ctx.createLinearGradient(0,shoulderY,0,hipY);
  jg.addColorStop(0, flash?'#fff':lighten(p.color,0.20));
  jg.addColorStop(1, jerseyLo);
  ctx.fillStyle=jg;
  // trunk polygon: narrower at hips, broader at shoulders (athletic V)
  var shW=torsoHalf*1.14, hpW=torsoHalf*0.86;
  ctx.beginPath();
  ctx.moveTo(-shW, shoulderY+u*0.05);
  ctx.quadraticCurveTo(-shW*1.02, (shoulderY+hipY)/2, -hpW, hipY);
  ctx.quadraticCurveTo(0, hipY+u*0.12, hpW, hipY);
  ctx.quadraticCurveTo(shW*1.02, (shoulderY+hipY)/2, shW, shoulderY+u*0.05);
  ctx.quadraticCurveTo(0, shoulderY-u*0.10, -shW, shoulderY+u*0.05);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // team stripe + number on jersey (clipped to trunk)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-shW, shoulderY+u*0.05);
  ctx.quadraticCurveTo(-shW*1.02, (shoulderY+hipY)/2, -hpW, hipY);
  ctx.quadraticCurveTo(0, hipY+u*0.12, hpW, hipY);
  ctx.quadraticCurveTo(shW*1.02, (shoulderY+hipY)/2, shW, shoulderY+u*0.05);
  ctx.quadraticCurveTo(0, shoulderY-u*0.10, -shW, shoulderY+u*0.05);
  ctx.closePath(); ctx.clip();
  ctx.globalAlpha=iframeFlick*0.9; ctx.fillStyle=flash?'#ccc':'rgba(0,0,0,0.26)';
  ctx.fillRect(-shW, (shoulderY+hipY)/2, shW*2, (hipY-shoulderY)/2+u);
  ctx.restore();
  // jersey number
  ctx.fillStyle= flash?'#111':'#0a0a0a';
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=Math.max(1,u*0.09);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+(u*0.72).toFixed(0)+"px 'Orbitron',sans-serif";
  var numY=(shoulderY+hipY)/2+u*0.18;
  ctx.strokeText(p.num, 0, numY);
  ctx.fillText(p.num, 0, numY);

  // ===== FRONT LEG (drawn over torso for depth) =====
  (function(){
    var fx2=backIsLeft?rFootX:lFootX, fy2=backIsLeft?rFootY:lFootY, hx=backIsLeft?hipRX:hipLX;
    limb(hx,hy, fx2,fy2, kbSign*kb, thighW, bodyCol);
    ctx.fillStyle=flash?'#fff':'#eaf6ff';
    ctx.beginPath(); ctx.ellipse(fx2+faceSign*u*0.10, fy2+u*0.02, u*0.27,u*0.14,0,0,6.283); ctx.fill();
  })();

  // ===== ARMS: upper-arm + forearm bending at the ELBOW =====
  ctx.lineCap='round';
  var shLX=-torsoHalf*1.02, shRX=torsoHalf*1.02;  // shoulder anchors
  var armW=u*0.40, foreW=u*0.34;
  if(p.throwAnim>0){
    // throwing arm: reaches forward toward facing, elbow snaps through
    var t=p.throwAnim/0.28;
    var shoX=faceSign>0?shRX:shLX;
    var handX=faceSign*u*(0.9+0.7*t), handY=shoulderY - u*0.30 + u*0.25*t;
    limb(shoX,shoulderY, handX,handY, -faceSign*u*(0.5-0.3*t), armW, bodyCol);
    // off arm counter-balances back
    var offX=faceSign>0?shLX:shRX;
    limb(offX,shoulderY, -faceSign*u*0.7, shoulderY+u*0.5, faceSign*u*0.35, armW, bodyDark);
    // throwing fist
    ctx.fillStyle=flash?'#fff':lighten(p.color,0.4);
    ctx.beginPath(); ctx.arc(handX, handY, u*0.20,0,6.283); ctx.fill();
  } else if(p.charging || p.hasBall){
    // wind-up: throwing arm cocked back+up (elbow high), other arm points forward for aim
    var shoX=faceSign>0?shRX:shLX;
    var cockX=-faceSign*u*0.55, cockY=shoulderY - u*0.85;
    limb(shoX,shoulderY, cockX,cockY, -faceSign*u*0.4, armW, bodyDark);
    var offX=faceSign>0?shLX:shRX;
    limb(offX,shoulderY, faceSign*u*0.9, shoulderY+u*0.05, faceSign*u*0.30, armW, bodyCol);
    // held-ball hand
    ctx.fillStyle=flash?'#fff':lighten(p.color,0.4);
    ctx.beginPath(); ctx.arc(cockX,cockY,u*0.19,0,6.283); ctx.fill();
  } else {
    // idle/run: arms swing opposite to legs, elbows relaxed-bent
    var swing=(0.3+gait*0.5);
    // left arm swings with walk2, right with walk (opposite legs)
    limb(shLX,shoulderY, -torsoHalf*1.1, shoulderY+u*(0.85)+walk2*u*swing*0.5,
         -u*(0.28+gait*0.25), armW, bodyDark);
    limb(shRX,shoulderY,  torsoHalf*1.1, shoulderY+u*(0.85)+walk*u*swing*0.5,
          u*(0.28+gait*0.25), armW, bodyCol);
  }

  // ===== NECK + HEAD (clean, FACELESS) =====
  // neck
  ctx.strokeStyle=flash?'#fff':'#e6b58c'; ctx.lineWidth=u*0.34; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,shoulderY-u*0.02); ctx.lineTo(0,neckY); ctx.stroke();

  var hCY=headCY;
  // soft dark halo behind head (team glow), keeps it readable on neon court
  ctx.save();
  ctx.shadowColor=glowCol; ctx.shadowBlur=isActive?16:9;
  ctx.fillStyle=flash?'#fff':'#0a0a0f';
  ctx.beginPath(); ctx.ellipse(0,hCY,headR*0.98,headR*1.06,0,0,6.283); ctx.fill();
  ctx.restore();

  // skin base — slightly oval head, soft radial shading (light upper-left). NO FACE.
  var sg=ctx.createRadialGradient(-headR*0.35, hCY-headR*0.4, headR*0.15, 0, hCY, headR);
  if(flash){ sg.addColorStop(0,'#fff'); sg.addColorStop(1,'#eee'); }
  else { sg.addColorStop(0,'#ffe6cf'); sg.addColorStop(0.6,'#f0c39a'); sg.addColorStop(1,'#c98f63'); }
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(0,hCY,headR*0.9,headR,0,0,6.283); ctx.fill();

  // team-color cap / headband across the crown (no facial features whatsoever)
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0,hCY,headR*0.9,headR,0,0,6.283); ctx.clip();
  var hg=ctx.createLinearGradient(0,hCY-headR,0,hCY-headR*0.15);
  hg.addColorStop(0, flash?'#fff':lighten(p.color,0.25));
  hg.addColorStop(1, flash?'#eee':tint(p.color,0.55));
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(-headR*0.9,hCY-headR*0.12);
  ctx.quadraticCurveTo(-headR*0.9, hCY-headR*1.02, 0, hCY-headR*1.0);
  ctx.quadraticCurveTo(headR*0.9, hCY-headR*1.02, headR*0.9, hCY-headR*0.12);
  ctx.quadraticCurveTo(headR*0.5, hCY-headR*0.32, 0, hCY-headR*0.34);
  ctx.quadraticCurveTo(-headR*0.5, hCY-headR*0.32, -headR*0.9, hCY-headR*0.12);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // hit flash white wash over the head
  if(flash){
    ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(0,hCY,headR*0.9,headR,0,0,6.283); ctx.fill(); ctx.restore();
  }
