<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Intel</title>
<style>
:root{--bg:#06080b;--panel:#0d1218;--edge:#1a232c;--text:#d8e2ea;--mute:#6f8394;--em:#00ff9c;--gold:#e8c45c;--red:#ff5c6c}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:20px}
header{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--edge);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{background:none;border:1px solid var(--edge);color:var(--mute);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700;letter-spacing:.04em}
.tab[aria-pressed=true]{background:var(--em);color:#04120c;border-color:var(--em)}
.live{margin-left:auto;color:var(--mute);font-size:11px}
.chips{display:flex;gap:6px;padding:10px 12px 4px;flex-wrap:wrap}.chip{border:1px solid var(--edge);background:none;color:var(--mute);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
main{padding:6px 12px}.err{color:var(--gold);font-size:11px;padding:2px 12px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sym{font-weight:800;min-width:64px}.buy{color:var(--em)}.sell{color:var(--red)}
.mute{color:var(--mute);font-size:11px}.bar{height:5px;border-radius:3px;background:var(--edge);width:90px}.bar i{display:block;height:100%;border-radius:3px;background:var(--em)}
.act{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:4px 10px;cursor:pointer}
select{background:var(--bg);color:var(--text);border:1px solid var(--edge);border-radius:6px;padding:3px 4px}
.push{margin-left:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--edge);text-align:right}th:first-child,td:first-child{text-align:left}
.regime{padding:8px 12px;margin:4px 12px 4px;border:1px solid var(--edge);border-radius:8px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
h4{margin:14px 0 6px;color:var(--gold);letter-spacing:.06em;font-size:11px;text-transform:uppercase}
@media(max-width:640px){.bar{width:60px}.push{margin-left:0}}
</style></head><body>
<header><span id="tabs" style="display:contents"></span><span class="live" id="stamp"></span></header>
<div class="chips" id="chips"></div>
<div class="regime" id="regime" hidden></div>
<div class="err" id="errs"></div>
<main id="out">Loading…</main>
<div class="toast" id="toast"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['signals','Signals'],['stocks','Stocks'],['crypto','Crypto'],['corr','Correlations'],['paper','Paper']];
const CLS=[['','All'],['stock','Stocks'],['crypto','Crypto'],['prediction','Predictions']];
let tab='signals',cls='';
try{tab=localStorage.getItem('mh_tab')||'signals'}catch(_){}
if(!TABS.some(t=>t[0]===tab))tab='signals';
const $=id=>document.getElementById(id);
const api=async(p,o)=>{let j={};let st=0;try{const r=await fetch('/api/intel'+p,Object.assign({credentials:'same-origin'},o));st=r.status;j=await r.json()}catch(_){}return Object.assign({_status:st},j)};
const money=n=>n==null?'—':(n>=1?Number(n).toLocaleString(undefined,{maximumFractionDigits:2}):String(+Number(n).toPrecision(4)));
const pct=n=>n==null?'—':(n>=0?'+':'')+(+n).toFixed(2)+'%';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

function head(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" data-k="${k}" aria-pressed="${k===tab}">${l}</button>`).join('');
  $('chips').hidden=tab!=='signals';
  $('chips').innerHTML=CLS.map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cls}">${l}</button>`).join('');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'),c=e.target.closest('.chip'),a=e.target.closest('[data-open]'),x=e.target.closest('[data-close]');
  if(t){tab=t.dataset.k;try{localStorage.setItem('mh_tab',tab)}catch(_){}render()}
  else if(c){cls=c.dataset.c;render()}
  else if(a)openTrade(a.dataset.open,a.parentElement.querySelector('select').value);
  else if(x)closeTrade(x.dataset.close);
});
function errs(j){$('errs').textContent=(j.errors&&j.errors.length)?'Some sources unavailable: '+j.errors.map(e=>e.adapter).join(', '):'';if(j.ts)$('stamp').textContent='updated '+new Date(j.ts).toLocaleTimeString()}

function sigRow(s){
  const sym=s.symbol.length>16?s.symbol.slice(0,16)+'…':s.symbol;
  return `<div class="card"><div class="row"><span class="sym">${esc(sym)}</span>
  <span class="${s.side==='buy'?'buy':'sell'}">${s.side==='buy'?'BUY':'SELL'}</span><span class="mute">${esc(s.assetClass)}</span>
  <span class="bar"><i style="width:${Math.round(s.confidence*100)}%"></i></span><span>${Math.round(s.confidence*100)}%</span>
  <span class="mute">entry ${money(s.entry)} → ${money(s.target)} · stop ${money(s.stop)}</span>
  <span class="push"><select aria-label="Paper size"><option>250</option><option selected>1000</option><option>5000</option></select> <button class="act" data-open="${esc(s.id)}">Paper trade</button></span></div>
  <div class="mute">${esc(s.name)} — ${esc(s.rationale)} <em>(${esc(s.moduleId)})</em></div></div>`;
}
async function render(){
  head();$('regime').hidden=true;$('errs').textContent='';$('out').textContent='Loading…';
  const mine=tab;
  if(tab==='signals'){
    const j=await api('/signals'+(cls?'?assetClass='+cls:''));if(mine!==tab)return;errs(j);
    if(j.regime&&j.regime.riskOn!=null){$('regime').hidden=false;$('regime').textContent='Market regime: '+(j.regime.riskOn?'risk-on':'risk-off')+' (SPY 5d '+pct(j.regime.spy5d)+', BTC 5d '+pct(j.regime.btc5d)+')'}
    $('out').innerHTML=(j.signals||[]).map(sigRow).join('')||`<div class="mute">${j.ok?'No signals right now — markets are quiet.':'Signals are unavailable right now. Try again in a minute.'}</div>`;
  }else if(tab==='stocks'||tab==='crypto'){
    const j=await api('/quotes?assetClass='+(tab==='stocks'?'stock':'crypto'));if(mine!==tab)return;errs(j);
    $('out').innerHTML=(j.quotes&&j.quotes.length)?'<table><tr><th>Symbol</th><th>Price</th><th>24h</th></tr>'+j.quotes.map(q=>`<tr><td>${esc(q.symbol)} <span class="mute">${esc(q.name)}</span></td><td>${money(q.price)}</td><td class="${q.change24hPct>=0?'buy':'sell'}">${pct(q.change24hPct)}</td></tr>`).join('')+'</table>':'<div class="mute">No data right now. Try again in a minute.</div>';
  }else if(tab==='corr'){
    const j=await api('/correlations');if(mine!==tab)return;
    if(!j.symbols||!j.symbols.length){$('out').innerHTML='<div class="mute">Correlation data unavailable right now.</div>';return}
    const cell=v=>v==null?'<td class="mute">—</td>':`<td style="background:${v>=0?`rgba(0,255,156,${Math.abs(v)*.55})`:`rgba(255,92,108,${Math.abs(v)*.55})`}">${v.toFixed(2)}</td>`;
    $('out').innerHTML='<table><tr><th></th>'+j.symbols.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr>'+j.symbols.map((s,i)=>`<tr><td>${esc(s)}</td>${j.values[i].map(cell).join('')}</tr>`).join('')+'</table><div class="mute" style="margin-top:8px">30-day daily-return correlation. Green = move together, red = move opposite.</div>';
  }else{
    const j=await api('/paper');if(mine!==tab)return;
    if(j._status===401){$('out').innerHTML='<div class="mute">Sign in to paper trade.</div>';return}
    if(!j.ok){$('out').innerHTML='<div class="mute">Paper account unavailable right now.</div>';return}
    const bm=Object.entries(j.byModule||{});
    $('out').innerHTML=`<div class="card"><div class="row"><b>Equity $${money(j.equity)}</b><span class="mute">cash $${money(j.cash)} · paper money only</span></div></div>`+
      '<h4>Open trades</h4>'+((j.openTrades||[]).map(t=>`<div class="card row"><span class="sym">${esc(t.symbol.slice(0,16))}</span><span class="${t.side==='buy'?'buy':'sell'}">${t.side==='buy'?'BUY':'SELL'}</span><span>$${money(t.sizeUsd)} @ ${money(t.entry)}</span><span class="${t.unrealized>=0?'buy':'sell'}">${t.unrealized>=0?'+':''}${t.unrealized}</span><span class="push"><button class="act" data-close="${esc(t.id)}">Close</button></span></div>`).join('')||'<div class="mute">No open trades. Pick a signal and tap Paper trade.</div>')+
      '<h4>Which strategy is winning</h4>'+(bm.map(([m,v])=>`<div class="card row"><b>${esc(m)}</b><span class="${v.pnl>=0?'buy':'sell'}">${v.pnl>=0?'+':''}${v.pnl}</span><span class="mute">${v.wins}/${v.trades} wins</span></div>`).join('')||'<div class="mute">Close a trade to see strategy results.</div>');
  }
}
async function openTrade(id,size){
  const r=await api('/paper/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({signalId:id,sizeUsd:Number(size)})});
  if(r._status===401)toast('Sign in to paper trade');else if(!r.ok)toast(r.error||'Could not open trade');else{toast('Paper trade opened');tab='paper';render()}
}
async function closeTrade(id){
  const r=await api('/paper/close',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});
  toast(r.ok?'Closed at market':(r.error||'Could not close'));render();
}
render();
setInterval(()=>{if(document.visibilityState==='visible'&&tab!=='paper')render()},90000);
</script></body></html>
