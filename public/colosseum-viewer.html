<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colosseum Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #06080b; font-family: 'Space Grotesk', system-ui, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #e7f3ee;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(6, 8, 11, 0.8);
      border: 1px solid #1c2624;
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 10;
      line-height: 1.6;
    }
    #ui b { color: #00ff9c; }
    button {
      margin-top: 8px;
      padding: 6px 12px;
      background: rgba(0, 255, 156, 0.2);
      border: 1px solid #00ff9c;
      color: #00ff9c;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    button:hover { background: rgba(0, 255, 156, 0.35); }
  </style>
</head>
<body>
  <div id="ui">
    <b>SHADDAI COLOSSEUM</b><br>
    <small>Drag to orbit · Scroll or pinch to zoom</small><br>
    <br>
    <b>Theme:</b><br>
    <button onclick="setTheme('classic')">Classic</button>
    <button onclick="setTheme('royal')">Royal</button>
    <button onclick="setTheme('night')">Night</button>
    <button onclick="setTheme('festival')">Festival</button>
    <br>
    <b>Field:</b><br>
    <button onclick="setField('sand')">Sand</button>
    <button onclick="setField('soccer')">Soccer</button>
    <button onclick="setField('tactics')">Tactics</button>
    <button onclick="setField('team-attack')">Team Attack</button>
    <button onclick="setField('party')">Party</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Basic Three.js setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06080b);
    scene.fog = new THREE.Fog(0x06080b, 100, 500);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 30, 80);
    camera.lookAt(0, 20, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Light the scene (the arena builder expects the host page to provide lights)
    scene.add(new THREE.HemisphereLight(0xeaf1ff, 0x4a3f2c, 1.6));
    const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(60, 140, 40); scene.add(sun);

    // Load the real 3D realm Colosseum. world-colosseum.js is a classic script: it registers window.buildColosseumArena
    // and returns a record whose .group is the 3D object (the record also carries tick/setTheme/setField for pages like this one).
    await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = './world-colosseum.js?v=119'; sc.onload = res; sc.onerror = () => rej(new Error('world-colosseum.js failed to load')); document.head.appendChild(sc); });
    const api = window.buildColosseumArena(THREE, { scene });
    const arena = api.group; arena.visible = true; scene.add(arena);

    // Frame the whole arena and orbit around its centre
    // frame from the arena floor (the whole group includes a huge sky dome that would push the camera far away)
    let framed = api.floorMesh || arena; arena.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(framed), centre = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    const radius = Math.max(40, Math.max(size.x, size.z) * 1.15);
    try { if (api.setTheme) api.setTheme('classic'); } catch (e) { /* keep default */ }
    let theta = 0.6, phi = 0.95, dist = radius * 1.35;     // spherical orbit: theta around, phi down from the top
    function placeCamera() {
      phi = Math.max(0.25, Math.min(1.45, phi)); dist = Math.max(25, Math.min(radius * 3, dist));
      camera.position.set(centre.x + dist * Math.sin(phi) * Math.sin(theta), centre.y + dist * Math.cos(phi), centre.z + dist * Math.sin(phi) * Math.cos(theta));
      camera.lookAt(centre.x, centre.y + size.y * 0.15, centre.z);
    }
    camera.far = radius * 12; camera.updateProjectionMatrix(); placeCamera();

    // Drag to orbit (mouse and touch), wheel / pinch to zoom
    let drag = null, pinch = 0;
    const dom = renderer.domElement; dom.style.touchAction = 'none';
    dom.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; dom.setPointerCapture(e.pointerId); });
    dom.addEventListener('pointermove', (e) => { if (!drag) return; theta -= (e.clientX - drag.x) * 0.006; phi -= (e.clientY - drag.y) * 0.006; drag = { x: e.clientX, y: e.clientY }; placeCamera(); });
    const stop = () => { drag = null; }; dom.addEventListener('pointerup', stop); dom.addEventListener('pointercancel', stop);
    dom.addEventListener('wheel', (e) => { e.preventDefault(); dist += e.deltaY * 0.12; placeCamera(); }, { passive: false });
    window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    // Theme and field switches (the buttons in the panel)
    window.setTheme = (name) => { if (api.setTheme) api.setTheme(name); };
    window.setField = (name) => { if (api.setField) api.setField(name); };

    // Animation loop: the arena's own tick drives the crowd, lights and field
    let last = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
      try { if (api.tick) api.tick(dt); } catch (e) { /* keep rendering */ }
      renderer.render(scene, camera);
    }
    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
