<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADDAI · Realm Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#06080b; --obsidian2:#0b1016;
    --emerald:#00ff9c; --gold:#e8c45c; --cyan:#5fe0ff; --violet:#c9a6ff;
    --ink:#e7ecf2; --muted:#7a8794; --crimson:#ff5a4d;
    --line:rgba(232,196,92,.22);
    --disp:"Cinzel Decorative",serif;
    --hud:"Chakra Petch",sans-serif;
    --mono:"IBM Plex Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;background:var(--obsidian);color:var(--ink);
    font-family:var(--hud);-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}

  /* ambient canvas mandala (kept from original, dimmed to a backdrop) */
  #ambient{position:fixed;inset:0;z-index:0;opacity:.32;pointer-events:none}
  /* subtle grain + vignette — cheap, static */
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.6'/></svg>")}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 100% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.72) 100%)}

  .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 26px 60px}

  /* ---- top bar ---- */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    justify-content:space-between;padding:20px 0 16px;
    background:linear-gradient(180deg,rgba(6,8,11,.94),rgba(6,8,11,.6) 70%,rgba(6,8,11,0))}
  .brand{display:flex;align-items:baseline;gap:14px}
  .sigil{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:2px;
    color:var(--gold);text-shadow:0 0 16px rgba(232,196,92,.3)}
  .sigil::before{content:"◈";margin-right:10px;color:var(--emerald);
    text-shadow:0 0 14px rgba(0,255,156,.5)}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:4px;
    color:var(--cyan);opacity:.7;text-transform:uppercase}
  .nav{display:flex;gap:10px}
  .nbtn{font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:1px;
    padding:9px 15px;border:1px solid var(--line);border-radius:8px;
    background:rgba(10,14,20,.55);color:var(--muted);cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;transition:.2s}
  .nbtn:hover{color:var(--gold);border-color:var(--gold)}

  /* ---- hero heading ---- */
  .head{text-align:center;padding:26px 0 6px;position:relative}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:6px;color:var(--emerald);
    text-transform:uppercase;opacity:.85;margin-bottom:14px}
  h1{font-family:var(--disp);font-weight:900;font-size:clamp(34px,6vw,62px);
    letter-spacing:2px;line-height:1;color:transparent;
    -webkit-text-stroke:1.5px var(--emerald);
    text-shadow:0 0 24px rgba(0,255,156,.28)}
  .tag{font-family:var(--hud);font-weight:500;font-size:14px;color:var(--muted);
    letter-spacing:1px;margin-top:14px}
  .hair{height:1px;max-width:320px;margin:20px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}

  /* ---- mode row ---- */
  .modes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:26px 0 8px}
  .mode{font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:.5px;
    padding:10px 18px;border:1px solid var(--line);border-radius:999px;
    background:rgba(10,14,20,.5);color:var(--ink);cursor:pointer;transition:.2s;
    display:inline-flex;align-items:center;gap:9px;position:relative}
  .mode:hover{border-color:var(--cyan);color:var(--cyan)}
  .mode.active{border-color:var(--emerald);color:var(--emerald);
    box-shadow:inset 0 0 0 1px rgba(0,255,156,.25)}
  .mode .soon{font-family:var(--mono);font-size:8px;letter-spacing:1px;
    color:var(--gold);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;text-transform:uppercase;opacity:.85}

  /* ---- realm grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;margin-top:28px}
  .realm{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
    aspect-ratio:16/10;border:1px solid rgba(122,135,148,.22);
    background:#0b1016;transition:transform .18s,border-color .2s;isolation:isolate}
  .realm:hover{transform:translateY(-4px);border-color:var(--gold)}
  .realm.sel{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald)}
  .realm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    z-index:0;transition:transform .3s;filter:saturate(1.05)}
  .realm:hover img{transform:scale(1.06)}
  .realm .shade{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(6,8,11,.15) 0%,rgba(6,8,11,.35) 45%,rgba(6,8,11,.9) 100%)}
  /* HUD corner brackets — cheap static borders */
  .realm .br{position:absolute;width:16px;height:16px;z-index:3;pointer-events:none;
    border-color:var(--gold);opacity:.55}
  .realm .br.tl{top:9px;left:9px;border-top:2px solid;border-left:2px solid}
  .realm .br.tr{top:9px;right:9px;border-top:2px solid;border-right:2px solid}
  .realm .br.bl{bottom:9px;left:9px;border-bottom:2px solid;border-left:2px solid}
  .realm .br.brr{bottom:9px;right:9px;border-bottom:2px solid;border-right:2px solid}
  .realm.sel .br{border-color:var(--emerald);opacity:.9}
  .realm .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 15px 13px}
  .realm .seph{font-family:var(--mono);font-size:9px;letter-spacing:2px;
    color:var(--cyan);text-transform:uppercase;opacity:.85;margin-bottom:3px}
  .realm h3{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.5px;
    line-height:1.1}
  .realm .biome{font-family:var(--mono);font-size:10px;letter-spacing:1px;
    color:var(--muted);margin-top:4px;text-transform:uppercase}
  .realm .enter{position:absolute;top:12px;right:14px;z-index:3;
    font-family:var(--hud);font-weight:700;font-size:10px;letter-spacing:1.5px;
    color:var(--obsidian);background:var(--gold);padding:4px 9px;border-radius:5px;
    text-transform:uppercase;opacity:0;transform:translateY(-4px);transition:.2s}
  .realm:hover .enter,.realm.sel .enter{opacity:1;transform:translateY(0)}
  .realm.sel .enter{background:var(--emerald)}
  .realm .lockb{position:absolute;top:12px;left:12px;z-index:3;
    font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--gold);
    background:rgba(6,8,11,.7);border:1px solid var(--line);border-radius:5px;
    padding:3px 8px;text-transform:uppercase;display:none}
  .realm.locked .lockb{display:inline-block}
  .realm.locked img{filter:grayscale(.55) brightness(.7)}

  /* ---- footer action bar ---- */
  .actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:16px;margin-top:34px;padding:18px 22px;border-radius:14px;
    background:rgba(8,11,16,.7);border:1px solid var(--line)}
  .sel-info{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--muted);
    text-transform:uppercase}
  .sel-info b{color:var(--ink);font-weight:500}
  .act-btns{display:flex;gap:12px;flex-wrap:wrap}
  .enter-realm{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:2px;
    padding:13px 30px;border-radius:10px;border:none;cursor:pointer;text-transform:uppercase;
    background:linear-gradient(120deg,#2a2411,#3a3316);color:#5a5a52;pointer-events:none;
    transition:.2s}
  .enter-realm.ready{color:#05070b;pointer-events:auto;
    background:linear-gradient(120deg,var(--emerald),#baffe4);
    box-shadow:0 0 22px rgba(0,255,156,.35)}
  .forge{font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:1.5px;
    padding:13px 24px;border-radius:10px;border:1px solid var(--gold);cursor:pointer;
    text-transform:uppercase;background:transparent;color:var(--gold);text-decoration:none;
    display:inline-flex;align-items:center;transition:.2s}
  .forge:hover{background:rgba(232,196,92,.1)}

  .flash{position:fixed;inset:0;z-index:50;
    background:radial-gradient(circle,#fff,var(--emerald) 40%,transparent 70%);
    opacity:0;pointer-events:none;transition:opacity .6s ease-in}

  @media(max-width:560px){
    .actions{flex-direction:column;align-items:stretch}
    .act-btns{justify-content:stretch}
    .enter-realm,.forge{flex:1;text-align:center;justify-content:center}
    .sub{display:none}
  }
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<div class="grain"></div>
<div class="vig"></div>

<div class="wrap">
  <div class="bar">
    <div class="brand">
      <div class="sigil">SHADDAI</div>
      <div class="sub">Realm Map</div>
    </div>
    <div class="nav">
      <a class="nbtn" href="/home.html">⌂ Home</a>
      <a class="nbtn" href="/dashboard">▦ Dashboard</a>
    </div>
  </div>

  <div class="head">
    <div class="kicker">Ancient Wisdom · Future Tech</div>
    <h1>CHOOSE YOUR REALM</h1>
    <div class="tag">Seven lands await across the SHADDAI world. Select a realm, then enter.</div>
    <div class="hair"></div>
  </div>

  <div class="modes">
    <div class="mode active" data-mode="guest">➜ Join as guest</div>
    <div class="mode" data-mode="spectate">◉ Spectate <span class="soon">soon</span></div>
    <div class="mode" data-mode="profile">✦ Create profile <span class="soon">soon</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <div class="sel-info" id="selInfo">▸ Selected: <b>—</b></div>
    <div class="act-btns">
      <a class="forge" href="/pixel-forge.html">⚒ Pixel Forge</a>
      <button class="enter-realm" id="enterBtn">▸ Enter Realm</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
/* ============================================================
   REALM DATA — 7 realms mapped to the real hero/*.png backdrops
   (files verified: beach, city, desert, forest, meadow,
    shaddai-city, volcano)
   ============================================================ */
const REALMS=[
  {id:'meadow',    img:'hero/meadow.png',       name:'Green Meadow',    seph:'CHESED · Mercy',      biome:'Farm Valley',   accent:'#5bd06a', locked:false},
  {id:'forest',    img:'hero/forest.png',       name:'Emerald Forest',  seph:'NETZACH · Victory',   biome:'Deep Woodland', accent:'#3fae63', locked:false},
  {id:'beach',     img:'hero/beach.png',        name:'Sunset Beach',    seph:'MALKUTH · Kingdom',   biome:'Coastal Shore', accent:'#42c8e0', locked:false},
  {id:'city',      img:'hero/city.png',         name:'Obsidian City',   seph:'TIFERET · Beauty',    biome:'Dense Metropolis',accent:'#9fb0c4', locked:false},
  {id:'desert',    img:'hero/desert.png',       name:'Golden Desert',   seph:'HOD · Splendor',      biome:'Sunbaked Mesas',accent:'#e0a85a', locked:false},
  {id:'volcano',   img:'hero/volcano.png',      name:'Crimson Volcano', seph:'GEVURAH · Severity',  biome:'Volcanic Range',accent:'#ff7a3c', locked:false},
  {id:'agentcity', img:'hero/shaddai-city.png', name:'SHADDAI City',    seph:'KETER · The Crown',   biome:'Sacred Capital',accent:'#c9a6ff', locked:false},
];

/* PREVIEW LOCK — worlds under construction. Flip to false when ready.
   (Preserved from the original page.) */
const WORLDS_LOCKED = true;
if(WORLDS_LOCKED){ REALMS.forEach(r=>{ r.locked=true; }); }

let selId = null;
let flying = false;

/* ---- build cards ---- */
const grid=document.getElementById('grid');
REALMS.forEach((r,idx)=>{
  const el=document.createElement('div');
  el.className='realm'+(r.locked?' locked':'');
  el.dataset.id=r.id;
  el.innerHTML =
    '<img src="'+r.img+'" alt="'+r.name+'" loading="lazy" '+
      'onerror="this.style.display=\'none\'">'+
    '<div class="shade"></div>'+
    '<span class="br tl"></span><span class="br tr"></span>'+
    '<span class="br bl"></span><span class="br brr"></span>'+
    '<span class="enter">Enter ▸</span>'+
    '<span class="lockb">🔒 Soon</span>'+
    '<div class="meta">'+
      '<div class="seph" style="color:'+r.accent+'">'+r.seph+'</div>'+
      '<h3 style="color:'+(r.locked?'#c6cdd6':r.accent)+'">'+r.name+'</h3>'+
      '<div class="biome">'+r.biome+'</div>'+
    '</div>';
  el.addEventListener('click',()=>select(r.id));
  el.addEventListener('dblclick',()=>{ if(!r.locked){ select(r.id); enter(); }});
  grid.appendChild(el);
});

function select(id){
  const r=REALMS.find(x=>x.id===id); if(!r) return;
  selId=id;
  document.querySelectorAll('.realm').forEach(el=>
    el.classList.toggle('sel', el.dataset.id===id));
  document.getElementById('selInfo').innerHTML =
    '▸ Selected: <b style="color:'+r.accent+'">'+r.name+'</b>';
  const btn=document.getElementById('enterBtn');
  if(r.locked || WORLDS_LOCKED){
    btn.classList.remove('ready');
    btn.textContent='Coming Soon';
  } else {
    btn.classList.add('ready');
    btn.textContent='▸ Enter Realm';
  }
}

/* ---- ENTER — preserves original travel/hand-off logic ---- */
function enter(){
  if(!selId || flying) return;
  const r=REALMS.find(x=>x.id===selId); if(!r) return;
  if(r.locked || WORLDS_LOCKED) return;   // preview lock guard
  flying=true;
  const fl=document.getElementById('flash');
  fl.style.opacity='1';
  setTimeout(()=>{
    // hand off to the game world with the chosen region (original contract)
    try{ localStorage.setItem('shaddai.region', r.id); }catch(e){}
    location.href='game.html?v='+Math.floor(performance.now());
  },600);
}
document.getElementById('enterBtn').addEventListener('click',enter);

/* ---- mode row (guest wired; others are labeled stubs) ---- */
document.querySelectorAll('.mode').forEach(m=>{
  m.addEventListener('click',()=>{
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    m.classList.add('active');
    try{ localStorage.setItem('shaddai.mode', m.dataset.mode); }catch(e){}
  });
});

/* default-highlight Green Meadow */
select('meadow');

/* ============================================================
   AMBIENT MANDALA BACKDROP — a slimmed, non-interactive version
   of the original sacred-geometry canvas (kept as living backdrop).
   Cheap: static gradient + slow-rotating seed-of-life + faint stars.
   ============================================================ */
(function(){
  const cv=document.getElementById('ambient'), ctx=cv.getContext('2d');
  let W,H,DPR;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
    W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();

  const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),
    r:Math.random()*1.2+0.2, s:Math.random()*3+1, ph:Math.random()*6.28}));

  function frame(t){
    ctx.clearRect(0,0,W,H);
    const cx=W*0.5, cy=H*0.42, R=Math.min(W,H)*0.34;
    // radial base
    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.75);
    bg.addColorStop(0,'#0b1016'); bg.addColorStop(1,'#04060a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // stars
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const s of stars){ const a=0.2+0.3*(0.5+0.5*Math.sin(t/1000*s.s+s.ph));
      ctx.globalAlpha=a; ctx.fillStyle='#dfeaff'; ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.r,0,6.28); ctx.fill(); }
    ctx.restore();
    // seed of life (slow rotate)
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(t/40000);
    ctx.globalCompositeOperation='lighter';
    const seedR=R*0.5;
    ctx.strokeStyle='rgba(0,255,156,0.9)'; ctx.globalAlpha=0.06; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,seedR,0,6.28); ctx.stroke();
    for(let k=0;k<6;k++){ const a=k*Math.PI/3; ctx.beginPath();
      ctx.arc(seedR*Math.cos(a),seedR*Math.sin(a),seedR,0,6.28); ctx.stroke(); }
    // outer ring
    ctx.strokeStyle='rgba(95,224,255,0.9)'; ctx.globalAlpha=0.06;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.28); ctx.stroke();
    // gold heptagram
    ctx.strokeStyle='rgba(232,196,92,0.9)'; ctx.globalAlpha=0.05;
    ctx.beginPath();
    for(let k=0;k<7;k++){ const a=(-90+k*(360/7)*3)*Math.PI/180, rr=R*0.72;
      const px=rr*Math.cos(a), py=rr*Math.sin(a); k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
